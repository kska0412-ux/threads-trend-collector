ttps://www.threads.com/@bomuchann/post/DcvfCv4ko7X", "likes": 1, "velocity": 0.08, "ageHours": 11.8, "postedAt": "2026-09-01T19:49:18+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3976538907844685070", "username": "aki_biyoushi", "text": "頭皮の皮脂って、鼻の2倍たまるらしい。しかも半日で戻ってくる。せやから夕方に匂うんは当たり前で、洗い方が下手なわけやない。ここで2回洗いに走る人が多いんやけど、それが一番あかんねん。ほんまに変えなあかんのは、", "permalink": "https://www.threads.com/@aki_biyoushi/post/DcvgRFtmi0O", "likes": 1, "velocity": 0.09, "ageHours": 11.6, "postedAt": "2026-09-01T20:00:02+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3962737954309461068", "username": "tora_mamama", "text": "何度でも言います。\n頭皮マッサージを毎日続けたら、4週間で顔の位置が変わる。\n初期費用ゼロで今夜からできる。\nでもやり方間違えると逆効果。正しいやり方は、", "permalink": "https://www.threads.com/@tora_mamama/post/Db-eSyIktRM", "likes": 1, "velocity": 0.0, "ageHours": 468.6, "postedAt": "2026-08-13T18:59:57+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3976567698896789634", "username": "shiratama_no_ohada", "text": "顔の浮腫撲滅したい人は耳たぶを回してみて", "permalink": "https://www.threads.com/@shiratama_no_ohada/post/Dcvm0DeCSCC", "likes": 1, "velocity": 0.09, "ageHours": 10.6, "postedAt": "2026-09-01T20:57:11+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3976548412564948286", "username": "yukidama.aroma", "text": "静岡市でアロマで癒されながら小顔フェイシャル受けたい人いますか？", "permalink": "https://www.threads.com/@yukidama.aroma/post/DcvibZrE8U-", "likes": 1, "velocity": 0.09, "ageHours": 11.3, "postedAt": "2026-09-01T20:18:52+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3976569087949922521", "username": "bupura.yaese", "text": "頭蓋骨小顔矯正で頭もお顔も目も\nスッキリしたい方🙋🏻‍♀️\n\n初回クーポンなら毛穴洗浄やEMSや\nハーブピーリングがセットになったメニュー\nあってお得ですよ🉐\n\nいいねで詳細\u0026ホットペッパーの予約画面送ります！！", "permalink": "https://www.threads.com/@bupura.yaese/post/DcvnIRIDeDZ", "likes": 1, "velocity": 0.09, "ageHours": 10.6, "postedAt": "2026-09-01T20:59:57+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3976572070570221678", "username": "clinicalsalon_serein", "text": "お顔のたるみケアのモニター募集します！\n\nモニター価格で「受けてみたい」と言う方いらっしゃいますか？\n\n元看護師として肌構造の知識を活かし、\nお顔の状態を見極めながら、高周波で\n一人ひとりに合わせた施術をさせて\nいただきます✨\n\n▫️お顔のたるみが気になる方/小顔になりたい方\n▫️むくみ/首肩こり/エラ張りなどでお悩みの方もぜひお願いします😌🌿\n\n📍谷町九丁目|徒歩2分\n  大阪上本町|徒歩5分", "permalink": "https://www.threads.com/@clinicalsalon_serein/post/Dcvnzq6E-Bu", "likes": 1, "velocity": 0.1, "ageHours": 10.5, "postedAt": "2026-09-01T21:05:53+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3976552101329869971", "username": "totonoe_haru", "text": "📍埼玉県富士見市・三芳町\n「マスクに顔がおさまりました」\n小顔コルギなのに、背中からアプローチ。\nお顔だけでなく、\n首・肩・背中まで整えていきます。", "permalink": "https://www.threads.com/@totonoe_haru/post/DcvjRFGmZyT", "likes": 1, "velocity": 0.09, "ageHours": 11.2, "postedAt": "2026-09-01T20:26:12+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3976550810549123056", "username": "duck.kso", "text": "千円以下なのに、翌朝の目元がしっとりしてハリ感もいい感じ。\nお手頃だから、目元だけじゃなくおでこやほうれい線にもたっぷり使えるのが嬉しい", "permalink": "https://www.threads.com/@duck.kso/post/Dcvi-S-Enfw", "likes": 1, "velocity": 0.09, "ageHours": 11.2, "postedAt": "2026-09-01T20:23:38+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3976539340729556156", "username": "frou.fushi.o", "text": "ちょっとエロい話なんだけど、\n担当のエステティシャンに「表情筋トレーニングじゃなくてもほうれい線を目立たなくする方法ないか」って聞いたら、「舌を上あごに押しつけて、そのまま10秒キープ。それを1日5回」って言われた。半信半疑で2週間続けた。鏡見たら、頬の位置がちょっと上がってきてる。担当の人に報告したら、追加でこんなことも、、、", "permalink": "https://www.threads.com/@frou.fushi.o/post/DcvgXY3jRy8", "likes": 1, "velocity": 0.09, "ageHours": 11.6, "postedAt": "2026-09-01T20:00:51+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3872186600629670072", "username": "bibi.scalp_ink", "text": ".\nスカルプインク認定アーティストBiBiです\n薄毛・つむじ・分け目・傷跡の悩みを解決します\n⭐︎麻酔不要\n⭐︎痛みほぼなし\n⭐︎つむじ・分け目カバー\n⭐︎ヘアーライン施術により小顔仕上げ効果\n⭐︎即日効果\n\nスカルプインクとは\n麻酔を使用せず頭皮の浅い層にインクをのせ\n定着させていく美容を目的とした\n頭皮カバー技法です\nダウンタイムもなく当日から\nシャンプーも可能です\n地肌の透け感をカバーし薄毛のお悩みを\n軽減するだけでなく生際ラインに\nグラデーションを入れる事で\n視覚的な小顔効果やおでこのコンプレックスも\n軽減できます\n\n『通常価格一発1.5円税別』がいまなら\n初回モニターキャンペーン中\n初回3万発29800円！！\nでご提供できます\n\nお気軽にご相談下さい\nカウセリング無料\n\n※本サービスは医療行為ではありません\n※治療目的の施術ではありません\n※効果・仕上がりは個人差があります\n\n福岡県北九州市八幡西区穴生２丁目2-2-8\nお問い合わせはインスタDM・LINE\nお電話で090-1099-0357", "permalink": "https://www.threads.com/@bibi.scalp_ink/post/DW8xTKSjxC4", "likes": 1, "velocity": 0.0, "ageHours": 3467.1, "postedAt": "2026-04-10T20:30:38+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3974396301358032174", "username": "real_muse_love", "text": "毎日の頭皮ケアで根元から立ち上がるようなハリ・コシを与え、健やかで豊かな髪へ。", "permalink": "https://www.threads.com/@real_muse_love/post/Dcn5GD7EmUu", "likes": 1, "velocity": 0.01, "ageHours": 82.5, "postedAt": "2026-08-29T21:03:01+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3892337009905759167", "username": "sho_lask", "text": "ぶっちゃけます。AGAクリニックに駆け込むのは、一番最後でいいんです。\n「最近、生え際が後退してきた気がする……」\n「とにかく手っ取り早く薬で増やしたい！」\nその焦る気持ち、本当によくわかります。\nだけど、、、\n実は、体の中が「酸化」してボロボロなままだと、せっかく薬で髪を生やしても、砂上の楼閣のようにすぐ崩れてしまうんです。", "permalink": "https://www.threads.com/@sho_lask/post/DYEW-NVifO_", "likes": 0, "velocity": 0.0, "ageHours": 2799.8, "postedAt": "2026-05-08T15:45:51+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3968213940773803163", "username": "kana_ruana", "text": "生え癖やつむじ割れ、もう悩まなくても大丈夫！\n何故かというと、、、", "permalink": "https://www.threads.com/@kana_ruana/post/DcR7Y38k1Sb", "likes": 0, "velocity": 0.0, "ageHours": 287.3, "postedAt": "2026-08-21T08:19:46+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3974017261317395523", "username": "hair_nayami_koharu", "text": "ずっと後退していく一方だった生え際が、ある時期からそれ以上下がらなくなった気がしました。増えたとまでは言えない。でも、進む一方だったものが、", "permalink": "https://www.threads.com/@hair_nayami_koharu/post/Dcmi6TYGBRD", "likes": 0, "velocity": 0.0, "ageHours": 95.1, "postedAt": "2026-08-29T08:29:59+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3903277987902793975", "username": "tumuji_senpai", "text": "つむじが3年で2倍に広がって、ようやく気づいた。\n「ハゲる」より先に、必ず\"前兆\"が来てる。\n\n29歳でつむじ薄毛、3年で育毛剤8本・サプリ12種類試した俺。\n当時の写真を見返すと、見るべきサインは1年前から出てた。\n\n❌ 当時の俺が、見逃してたサイン\n・風呂上がり、洗面台の正面からしか鏡を見ない\n・ドライヤーで乾かしてる途中、地肌の見え方を直視しない\n・抜け毛の\"長さ\"を見てない（短い抜け毛は危険サイン）\n・つむじを\"写真\"じゃなく\"記憶\"で比較する\n\n⭕ 1年前の俺に教えたい、月1チェック↓", "permalink": "https://www.threads.com/@tumuji_senpai/post/DYrOqZIjCj3", "likes": 0, "velocity": 0.0, "ageHours": 2437.5, "postedAt": "2026-05-23T18:03:37+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3950870096793181195", "username": "o_dai_o_dai", "text": "何度でも言います。\n前髪・つむじの薄毛が気になる人が優先すべき\n遠回りしないAGA対策ランキングTOP10\n10位 頭皮に合うシャンプーを使う\n9位 タンパク質不足を避ける\n8位 睡眠時間を確保する\n7位 前髪とつむじを毎月撮影する\n6位 短く細い毛が増えていないか見る\n5位 個人輸入の治療薬を避ける\n4位 副作用を医師に相談できる環境を選ぶ\n3位 外用ミノキシジルで発毛を促す\n2位 フィナステリドで進行を抑える\n1位は、、、", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbUT2uhEhwL", "likes": 0, "velocity": 0.0, "ageHours": 861.6, "postedAt": "2026-07-28T10:00:39+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3879364627721967767", "username": "biyou_saki", "text": "髪が細くなってきた、ボリュームが出ない。\n\nそう感じてる人、まず頭皮の硬さを確認してみて。\n\nこれ、本当に大事なサインだから。", "permalink": "https://www.threads.com/@biyou_saki/post/DXWRZM9lViX", "likes": 0, "velocity": 0.0, "ageHours": 3229.4, "postedAt": "2026-04-20T18:12:07+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3933717331873430338", "username": "kami_neesan_", "text": "更年期に差し掛かった頃から急に髪のボリュームが減って、婦人科に相談したら意外なことを言われてな、", "permalink": "https://www.threads.com/@kami_neesan_/post/DaXXxJVHPtC", "likes": 0, "velocity": 0.0, "ageHours": 1429.6, "postedAt": "2026-07-04T18:01:12+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3880664592830219826", "username": "yuu41b", "text": "左　スキンケア始める前\n右　スキンケア始めて1カ月\n\n目の下のたるみが改善されてる🥹嬉しい🥹", "permalink": "https://www.threads.com/@yuu41b/post/DXa4-L0FMYy", "likes": 0, "velocity": 0.0, "ageHours": 3186.4, "postedAt": "2026-04-22T13:14:50+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3974469531758019583", "username": "keiko_biyou50", "text": "えええ！！！！先生それ言っていいのwww 更年期になってから生え際が薄くなってきて、本気で1万円の育毛剤買おうとしてたアラフィフの私。AGAクリニックの先生に相談したら、こっそり「メンズベーシックの育毛剤、3,680円ですけど1万円クラス並みに効果ありますよ」って！！！！いやいやいや！！！！それ先に知りたかったわwwww", "permalink": "https://www.threads.com/@keiko_biyou50/post/DcoJvtDDMP_", "likes": 0, "velocity": 0.0, "ageHours": 80.1, "postedAt": "2026-08-29T23:28:30+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3974254541223423288", "username": "ekimae_aga_clinic_okayama", "text": "今回は駅前AGAクリニック岡山院に通院中の患者様にインタビュー🎤しちゃいました💖✨\n\nご協力くださった患者様🥰本当にありがとうございました🙇‍♀️✨\nこれからも私達と一緒に楽しく頑張っていきましょうね✌️✨よろしくお願いします✨\n\n💁‍♀️髪の毛の事でお悩みの方はお一人で悩まず、まずは駅前AGAクリニック岡山院へお気軽にご相談ください😊\n初回カウンセリングは無料ですので、安心してご来院下さいませ💖\nお一人お一人に合った治療をご案内いたします🧑‍⚕️\n\n@ekimae_aga_clinic_okayama .\n#駅前AGAクリニック岡山院\n#美容男子 \n#薄毛治療\n#AGA\n#FAGA\n\n円形脱毛\n女性薄毛\n男性薄毛\n産後脱毛\nメソセラピー", "permalink": "https://www.threads.com/@ekimae_aga_clinic_okayama/post/DcnY3Lgmu04", "likes": 0, "velocity": 0.0, "ageHours": 87.2, "postedAt": "2026-08-29T16:21:24+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3974346177393984670", "username": "mayune_hb", "text": "ええええええええーーーー！！！！！！AGAクリニックの先生！！！！それ言ってええんかwwwww 薄毛気にし始めた旦那が「やっぱ1万円くらいする育毛剤じゃないとダメですか？」って聞いたら、先生がこっそり「いや、メンズベーシックの3,680円の育毛剤でも1万円クラス並みに効果ありますよ」って！！！！旦那から聞いた瞬間「はぁぁぁぁ！？！？！？」って声出たwww その値段差知ったら高い方買えんやろ！！！！", "permalink": "https://www.threads.com/@mayune_hb/post/DcntsqWAASe", "likes": 0, "velocity": 0.0, "ageHours": 84.2, "postedAt": "2026-08-29T19:23:25+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3973972036846605116", "username": "thecellclinic_official", "text": "薄毛の悩みあるけど、AGA治療はしていない方に聞いてみたいです。\n\n治療しない理由って、何ですか？🤔\n\n費用が高い？\n薬を飲み続けることへの抵抗？\n副作用が心配？\nクリニックに行くほどではない？\n何をしたらいいのかわからない？\nそれとも、効果があるのか半信半疑？\n\n「これだったら治療してみたい」もあれば、ぜひ聞いてみたいです。\n\nリアルな本音を教えてください🙏", "permalink": "https://www.threads.com/@thecellclinic_official/post/DcmYoMzk9M8", "likes": 0, "velocity": 0.0, "ageHours": 96.6, "postedAt": "2026-08-29T07:00:04+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3966822263450803124", "username": "efu.ikumou", "text": "「育毛剤の〇〇ップを半年使ったけど全く薄毛が改善しなかった」\n\nそんな人が半年間、eFu式育毛鍼を続けたら、\n\n「髪セットした時に髪の毛がスカスカにならず良い感じになるようになりました✨️」\n\nこんな嬉しいコメントをいただきました😄\n\n何をしたかというと、", "permalink": "https://www.threads.com/@efu.ikumou/post/DcM-9TcGJu0", "likes": 0, "velocity": 0.0, "ageHours": 333.4, "postedAt": "2026-08-19T10:14:45+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3924158423709631025", "username": "kamonohasi.aga", "text": "怖い話。\n育毛剤を1年続けた奴に\n言いにくいことを言う。", "permalink": "https://www.threads.com/@kamonohasi.aga/post/DZ1aUuXkcIx", "likes": 0, "velocity": 0.0, "ageHours": 1746.1, "postedAt": "2026-06-21T13:29:19+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3937975966329069544", "username": "suncy_salon", "text": "「抜け毛が1日何本以上だったら異常ですか？」\n\nよく聞かれる質問です。\n\n正直に言うと、\n本数よりも「抜けた毛の状態」の方が\n大事なことが多いです。", "permalink": "https://www.threads.com/@suncy_salon/post/DamgEbvEd_o", "likes": 0, "velocity": 0.0, "ageHours": 1288.6, "postedAt": "2026-07-10T15:02:51+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3949814384932127005", "username": "kami_neesan_", "text": "夜、美容室の帰りにバス停で信号待ちしとったら、隣に立っとった女性が風でうねりが広がった前髪を気にしながら、鞄から小さいボトルを取り出して指先に少しだけ乗せとってん。何しとるんか気になって見てたら、", "permalink": "https://www.threads.com/@kami_neesan_/post/DbQj0GOm4Ed", "likes": 0, "velocity": 0.0, "ageHours": 896.5, "postedAt": "2026-07-26T23:03:11+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3948949794860951618", "username": "withglint_ikumou.aga", "text": "「最近、抜け毛が増えた気がする…」\n「分け目やつむじが目立ってきたかも。」\n「髪のボリュームが以前より少なくなった気がする。」\n\nそんな変化を感じたら、早めのケアがおすすめです。\n\n当店では、医師監修の育毛成分を使用し、お客様一人ひとりの頭皮状態やお悩みに合わせた施術をご提供しています。\n\n施術前には丁寧なカウンセリングと頭皮チェックを行い、現在の頭皮環境をしっかり確認。一人ひとりに合わせた施術をご提案し、理想の髪を目指してサポートいたします。\n\n完全予約制のため、人目を気にせずリラックスしてお過ごしいただける空間をご用意。育毛サロンが初めての方でも、安心して施術を受けていただけます！\n\n初回体験は5,000円。\n\n「いつか始めよう」ではなく、「気になった今」がケアを始めるタイミングです。\n\n未来の髪のために、あなたに合った育毛ケアを始めてみませんか？✨\n#名古屋育毛 #名古屋育毛サロン #伏見育毛 #伏見育毛サロン #伏見AGA #名古屋AGA #AGA対策", "permalink": "https://www.threads.com/@withglint_ikumou.aga/post/DbNfOp-iehC", "likes": 0, "velocity": 0.0, "ageHours": 925.2, "postedAt": "2026-07-25T18:25:21+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3930886167496140908", "username": "hana_scalp_oyama", "text": "【宇都宮でつむじの薄毛が気になる方】\n\n「分け目が広がってきた…」\n「頭頂部の透け感が気になる…」\nそんなお悩みはありませんか？\n\nスカルプインクは、頭皮に自然な陰影をつくることで、髪が増えたような印象へ導く施術です。\n\n✔ 女性の分け目\n✔ 頭頂部の薄毛\n✔ つむじの透け感\n\n「薬は続けたくない」\n「ウィッグには抵抗がある」\nそんな方にも選ばれています。\n\n当サロンには宇都宮からも多くのお客様にご来店いただいています。\n\nまずはお気軽にDM・LINEからご相談ください😊\n\n#栃木薄毛\n#宇都宮美容\n#宇都宮薄毛\n#つむじハゲ\n#スカルプインク", "permalink": "https://www.threads.com/@hana_scalp_oyama/post/DaNUCSCGqhs", "likes": 0, "velocity": 0.0, "ageHours": 1523.3, "postedAt": "2026-06-30T20:16:09+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3948122023154810064", "username": "o_dai_o_dai", "text": "ちょっとエロい話します｡\n薄毛治療10年以上の俺が気づいたんですけど、抜け毛って一括りにされがちだけど、実はAGAと一時的な脱毛では原因が全然違う｡AGAは前髪やつむじの毛が少しずつ細く短くなるのに対して、休止期脱毛は発熱、強いストレス、急激な減量などの後に、頭全体から急に抜けることがあります｡だから、育毛剤を頑張ってもなかなか変わらない場合は、", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbKjA_gCfzQ", "likes": 0, "velocity": 0.0, "ageHours": 952.6, "postedAt": "2026-07-24T15:00:43+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3915685699513177489", "username": "tachibana_wakahage", "text": "AGAの原因は、\nただの「老化」ではありません。\n\n体内の「5αリダクターゼ」\nという酵素が男性ホルモンと結びつき、\n\n髪の成長期をガクンと\n短くしてしまうのが主なメカニズム\n\nつまり、髪が太く育つ前に\n抜け落ちてしまう状態ということ。\n\nここにストレスや睡眠不足が重なると\nさらに拍車がかかることも。\n\n遺伝の要素もありますが、\n\n日々の生活習慣や適切な頭皮ケアで\nアプローチできることはたくさんあります。\n\n「あれ？」と思ったら、\n早めの対策をするのがおすすめです。", "permalink": "https://www.threads.com/@tachibana_wakahage/post/DZXT2XDj1WR", "likes": 0, "velocity": 0.0, "ageHours": 2026.7, "postedAt": "2026-06-09T20:55:32+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3974727200300699015", "username": "wakistyle_health", "text": "洗面台とかお風呂で髪の毛が落ちてると、\n\n「抜け毛が増えたのかな？」\n\nって気になりますよね。\n\nでも、考えてみれば当たり前なんですけど、\n\n根元から抜けた毛と、途中で切れた毛って同じじゃないんですよね。\n\n気になってる時って、落ちてる髪を見て「抜け毛が増えたのかも」って思うこともありますよね。\n\nまず「何を見て抜け毛が増えたと思ったんだろう？」ってところを、分けて考えた方がよさそうです。", "permalink": "https://www.threads.com/@wakistyle_health/post/DcpEVRlAY2H", "likes": 0, "velocity": 0.0, "ageHours": 71.6, "postedAt": "2026-08-30T08:00:27+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3952302095530101822", "username": "sana_oniku", "text": "夕方のぺたんこ髪が悩みで無印のヘアエッセンスを使ってみたら、ふわっとして良かったです。母も気に入って一緒に愛用中…。皆さんは髪のボリューム対策、何かおすすめありますか？💋", "permalink": "https://www.threads.com/@sana_oniku/post/DbZZdDRGow-", "likes": 0, "velocity": 0.0, "ageHours": 814.2, "postedAt": "2026-07-30T09:25:51+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3972461052822753571", "username": "sukinamo_no713", "text": "40代になって、少しずつ自分を大事にするようになった。\n30代は子育てと仕事で毎日いっぱいいっぱい。自分のことはいつも後回し🥺\nでも40代になって、子どもも少し手が離れて。\n美容やファッション、健康のことを考える時間が久々に楽しくなってきた♡\nちゃんとお手入れしてあげると、\n少しずつだけど自分が磨かれていく感じがして🤏\n髪も肌も、健康でキレイにしておくと\nそれだけで自分の気分が上がるんだよね☺️\n‥とはいえ、私は根っからのズボラ😂\nだから「頑張りすぎずにキレイになれるもの」が好き。\n最近のお気に入りは、リファのブラシ♡\n髪をとかすだけじゃなくて、\n頭皮をほぐすような感覚も気持ちよくて、\n毎日のブラッシングがちょっとした癒しになってる🌿\nこういう「使ってよかった♡」を\n愛用品や気になっているものは楽天ROOMにまとめています🫶\n気になるものがあれば、ROOMから見てみてください♡\n\n#40代主婦 #40代美容 #40代自分磨き #ズボラ美容 #美容好き #大人美容 #ヘアケア #美髪ケア #楽天ROOM #楽天アフィリエイト\nhttps://a.r10.to/hPCif6", "permalink": "https://www.threads.com/@sukinamo_no713/post/DchBEfRkxEj", "likes": 0, "velocity": 0.0, "ageHours": 146.6, "postedAt": "2026-08-27T04:58:01+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3937437301413544226", "username": "kami_neesan_", "text": "ショックで言葉が出なかった。「更年期の抜け毛は歳のせいやから仕方ない」って思って、特に対策せず諦めてた。鏡を見るたび気が重いし、抜け毛の量にもため息つくし。たまたまスポーツトレーナーをしてる友人に会う機会があって話したら、言われたのがまさかの一言で、", "permalink": "https://www.threads.com/@kami_neesan_/post/Dakll08IIEi", "likes": 0, "velocity": 0.0, "ageHours": 1306.4, "postedAt": "2026-07-09T21:12:11+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3867729936462713345", "username": "esthetics911_yokohama", "text": "当サロンは2回目からは決まった間隔でご来店頂き\n改善させるためにコースで通って頂いておりますが、\n年齢に合わせたケアをしております。\nこの方はたるみが気になるということで\nドライヘットスパと高周波でCETとRETでケア。\n10分で引き上がりました。血色も良くなります。", "permalink": "https://www.threads.com/@esthetics911_yokohama/post/DWs7-KWARIB", "likes": 0, "velocity": 0.0, "ageHours": 3614.7, "postedAt": "2026-04-04T16:55:59+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3935784638279002401", "username": "mizuki.c5", "text": "インナードライ混合肌(鼻、頬にテカリ)\n赤み\nニキビ\n毛穴\n\nこの悩みを伝えてチャッピーにスキンケアのアドバイス出してもらったら「乳液をこれに変えてみて！」って言われて試して1週間。\nとりあえず1ヶ月は様子見るけどどうなんだろう？\n美容に詳しい方ならどうすか教えてほしい！", "permalink": "https://www.threads.com/@mizuki.c5/post/Daet0adDykh", "likes": 0, "velocity": 0.0, "ageHours": 1361.1, "postedAt": "2026-07-07T14:28:32+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3963554961752606702", "username": "watanabeseitai", "text": "「睡眠時間は足りているのに、疲れやだるさが抜けない…」\n\nその不調、骨格や筋肉の問題ではなく【体質・栄養・ホルモンバランス】といった身体の内側に原因があるかもしれません。\n当院では手技による施術にとどまらず、身体の内側からもお悩みを解決できるよう、スマホで医師に相談できる「シェアクリニック東京」と提携を開始しました。\n・ダイエットの成果が出にくい\n・髪のボリュームや肌荒れが気になる\n・理由のない体の重さやホルモンの乱れ", "permalink": "https://www.threads.com/@watanabeseitai/post/DcBYDznAEfu", "likes": 0, "velocity": 0.0, "ageHours": 441.5, "postedAt": "2026-08-14T22:03:12+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3973737421598208889", "username": "coruli_scalp_ink", "text": "４０代女性スカルプインク1回目7日後グレイカラーでご来店、頭皮上空✈️髪質硬め毛量多め　動機理由→毎日同じ分け目だったのでその分け目が薄毛に見える　良く質問されますがスカルプインク施術後1週間後くらい←個人差ありますがヘアカラー可能です😊なのでそんなにカラータイミングご心配ないですよ☝️本施術は医療行為ではありません。本サービスは発毛、育毛、治療を目的としたものではありません、自然なボリューム感を演出、髪型のように印象チェンジ、タトゥー技術を応用した審美的なデザイン、医療行為ではなく美容目的の施術です、☝️効果には個人差あります#スカルプインク #大阪市北区", "permalink": "https://www.threads.com/@coruli_scalp_ink/post/DcljSGVCbN5", "likes": 0, "velocity": 0.0, "ageHours": 104.4, "postedAt": "2026-08-28T23:13:58+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3975126110640642687", "username": "mio__beauty__", "text": "私42歳で白髪が一本もないんだだけど、これを使ってきたのが大きいと思ってる。紗栄子さんやMEGUMIさんも愛用ってバズってたケンザン。美髪と小顔だけじゃない。頭皮ケアって、日々の少しずつの積み重ねが未来の自分を変えると思ってる。", "permalink": "https://www.threads.com/@mio__beauty__/post/DcqfCLyHZp_", "likes": 0, "velocity": 0.0, "ageHours": 58.4, "postedAt": "2026-08-30T21:13:01+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3974999694250814129", "username": "retreathari", "text": "むくみ顔とお別れ！10年前の自分に戻る魔法のリフトアップ術\n\n毎日鏡を見るたびに、「なんだか顔がすっきりしない」「朝のむくみが夕方になっても取れない」と感じていま…...\n\nhttps://sns.retreathari.jp/%e3%82%80%e3%81%8f%e3%81%bf%e9%a1%94%e3%81%a8%e3%81%8a%e5%88%a5%e3%82%8c%ef%bc%8110%e5%b9%b4%e5%89%8d%e3%81%ae%e8%87%aa%e5%88%86%e3%81%ab%e6%88%bb%e3%82%8b%e9%ad%94%e6%b3%95%e3%81%ae%e3%83%aa%e3%83%95/", "permalink": "https://www.threads.com/@retreathari/post/DcqCSlWGyqx", "likes": 0, "velocity": 0.0, "ageHours": 62.6, "postedAt": "2026-08-30T17:02:03+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3975116903043769015", "username": "kyon1228.har", "text": "みんな「ぶす」「ばばあ」と言われた事件が1年半前におこったんだけど、(意味わからなくてOK)\nその時、ある人をマスク外しても「綺麗」とみんなが言ったそのある人。\nわたしすっごい期待していたんだけど、\n外した瞬間唖然としたわ！\n鼻が顔から飛び出すデカさだし、口元飛び出し半開きの口ゴボだし、顎がない。ほうれい線やばくない？\nなにそれ！わざとみんな言ったん？\nだって、どこをどう見たら「綺麗」なのよ？\nあーびっくり！あーがっかり！", "permalink": "https://www.threads.com/@kyon1228.har/post/Dcqc8MikyK3", "likes": 0, "velocity": 0.0, "ageHours": 58.7, "postedAt": "2026-08-30T20:54:43+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3975421621938587376", "username": "ikuta2323", "text": "2年前まではAGAガイドラインでも推奨度Aのミノキシジル外用（塗りミノ）を使っていました！ \n\n 内服薬のフィナステリドとミノキシジルの副作用が怖い人には良い選択肢ですよね！ \n\nただし、発毛剤の説明書や注意書きにもあるように、半年以上継続しても効果を実感できない場合は、他の薄毛対策への切り替えも検討ですね😅", "permalink": "https://www.threads.com/@ikuta2323/post/DcriOcIDobw", "likes": 0, "velocity": 0.0, "ageHours": 48.6, "postedAt": "2026-08-31T07:00:08+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3975408092028596757", "username": "scalp.ink.rui.osaka.city", "text": "はじめまして✨\n大阪市生野区「今里」ディープな街…🌇\n看護師による安心安全な施術を🪄\n\n頭皮タトゥー🆗治療ではない魅せる技術✨\n\n薄毛、傷痕、円形脱毛症などなど…頭皮タトゥーでお悩み軽減できます！\n\n失敗ないスカルプインク最高ですよっ！！\n\n眉毛、アイラインタトゥーも🆗✨症例たくさんあるので良かったら覗いてください✨\n\nたぶん今里近隣では当店だけ！！\n当日も空きあれば🉑夜も可能🉑夜得🉐\n特に夜は比較的ご案内しやすいです✨\nぜひご縁がありますように✨\n@scalp.ink.rui.osaka.city \n症例もあり！無料カウンセリングも\nあります✨ぜひフォローよろしく\nお願いします🤲", "permalink": "https://www.threads.com/@scalp.ink.rui.osaka.city/post/DcrfJjak_IV", "likes": 0, "velocity": 0.0, "ageHours": 49.0, "postedAt": "2026-08-31T06:33:16+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3975391820032938688", "username": "o_dai_o_dai", "text": "もう言い切るよ。\nAGAは、抜け毛が増えてから始まるとは限らない。\nそれより先に見てほしい場所が、頭に3か所ある、、", "permalink": "https://www.threads.com/@o_dai_o_dai/post/Dcrbcw8DpLA", "likes": 0, "velocity": 0.0, "ageHours": 49.6, "postedAt": "2026-08-31T06:00:56+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3976161912878334791", "username": "hachi_aga_hair8", "text": "見た目に金使って\n「これは早くやればよかった…」と思ったものありますか？\n\nAGA治療でも、脱毛でも、歯でも、筋トレでもいい。\n\n皆さんのリアルな後悔を教えてください！\n（男女関係なくお待ちしてます！）", "permalink": "https://www.threads.com/@hachi_aga_hair8/post/DcuKjFyjQNH", "likes": 0, "velocity": 0.0, "ageHours": 24.1, "postedAt": "2026-09-01T07:30:58+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3976160448343967963", "username": "isseh89", "text": "薄毛って突き詰めると、\nAGA治療しかないんでしょうか？\n\n一生薬を飲み続けるって考えると、\n正直ちょっと躊躇します。\n\nあと初期脱毛。\n\n一時的なものだとしても、\n今より薄くなるのは普通に怖いです。\n\n実際に治療してる人って、\nこのへんどうやって決断したんだろう。\n\n薬を続けること。\n初期脱毛のこと。\n副作用のこと。\n\n不安はあったと思うんですが、\nそれでも治療しようと思った決め手って何でしたか？\n\nなかなか人には言いにくい話だと思いますが、\n実際に治療してる方がいたら、\nぜひ聞いてみたいです。", "permalink": "https://www.threads.com/@isseh89/post/DcuKNx1gAjb", "likes": 0, "velocity": 0.0, "ageHours": 24.1, "postedAt": "2026-09-01T07:28:03+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3976140917686089871", "username": "tenka.hageme", "text": "AGA13日目", "permalink": "https://www.threads.com/@tenka.hageme/post/DcuFxkfkziP", "likes": 0, "velocity": 0.0, "ageHours": 24.8, "postedAt": "2026-09-01T06:49:15+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3958330137746853093", "username": "h.rkaua", "text": "生後3ヶ月👶🏼の頭皮、乾燥がすごい😂😂\nフケがぽろぽろ…\n頭皮ってクリーム塗りずらいし何を使えば？！？！💦", "permalink": "https://www.threads.com/@h.rkaua/post/Dbu0EnEH8zl", "likes": 0, "velocity": 0.0, "ageHours": 614.6, "postedAt": "2026-08-07T17:02:25+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3976167686396933617", "username": "kami_neesan_", "text": "40代の頭皮ケアで、無駄やと気づいたこと。無駄な方から書くわ↓", "permalink": "https://www.threads.com/@kami_neesan_/post/DcuL3GzE3Xx", "likes": 0, "velocity": 0.0, "ageHours": 23.9, "postedAt": "2026-09-01T07:42:30+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3976182147417584323", "username": "life.curate", "text": "秋になると頭皮の固さや抜け毛が気になりませんか？夏の疲れを残さないために試した2,000円台からのスカルプブラシ3選を比べてみました！\n\nゴリゴリほぐしたい派か、シャンプーで優しく使いたい派かで選び方が変わる気がします。気になる方はチェックしてみてくださいね�\n【記事URL】\n\n#スカルプブラシ #頭皮マッサージ #ヘアケア好き #おうちヘッドスパ #美髪ケア\n\n� https://biyo-navi.jp/articles/5eeab1a8-489c-44ec-86d0-caf5d60009cc", "permalink": "https://www.threads.com/@life.curate/post/DcuPJirEzLD", "likes": 0, "velocity": 0.0, "ageHours": 23.4, "postedAt": "2026-09-01T08:11:10+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3976146865485962051", "username": "mio_touhi_lab", "text": "勘違いしないでください。\n頭皮の匂い、体質のせいにされて終わってない、、、？", "permalink": "https://www.threads.com/@mio_touhi_lab/post/DcuHIH0EttD", "likes": 0, "velocity": 0.0, "ageHours": 24.6, "postedAt": "2026-09-01T07:01:07+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3974682082190534521", "username": "kinakonochichi", "text": "【PR】今週の楽天ROOMでは、ペット用品への反応が比較的安定していました。\n\nドッグステップ、抜け毛対策のグルーミング掃除機、循環式給水器がそれぞれ4いいね。暮らしの負担を減らす道具への関心が見えた一週間でした。\n\nなかでもMooSoo LM2は、抜け毛を吸い込みながらブラッシングやお手入れができるタイプ。ペットが音や吸引を怖がらないか、対応する毛質、刃のお手入れは購入前にご確認ください。未使用のため使い心地は要確認です。\n\n次に見たいのは「お手入れ」「給餌・給水」「省スペース家具」のどれですか？\n\n楽天ROOMはこちら👇\nhttps://room.rakuten.co.jp/room_76f5739083/1700390246459221\n\n#楽天ROOM #ペット用品 #犬猫との暮らし", "permalink": "https://www.threads.com/@kinakonochichi/post/Dco6EuEE6d5", "likes": 0, "velocity": 0.0, "ageHours": 73.1, "postedAt": "2026-08-30T06:30:48+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3975599605215910498", "username": "miki.cosme.0222", "text": "40代のほうれい線ケア、これ使えぇぇ‼️‼️\n軽い気持ちで買ってみたら明らかに印象変わったし、今では使わないと不安になるくらい愛用してる", "permalink": "https://www.threads.com/@miki.cosme.0222/post/DcsKsb-E9pi", "likes": 0, "velocity": 0.0, "ageHours": 42.7, "postedAt": "2026-08-31T12:53:46+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3976557411746561353", "username": "hiro.hatumou.fukuoka", "text": "薄毛の方に多い、首の硬さチェック。\n\n上を向いてください。\n天井、しっかり見えますか。\n\n見えにくい。つっぱる。\nそういう方は硬くなってます。\n\n首の後ろには、頭へ向かう血管が通ってます。\nここが硬いと、届く量が変わります。", "permalink": "https://www.threads.com/@hiro.hatumou.fukuoka/post/DcvkeW0Gb1J", "likes": 0, "velocity": 0.0, "ageHours": 11.0, "postedAt": "2026-09-01T20:36:48+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3976535514911684215", "username": "0520hair", "text": "【AGA治療で絶対に薬を使いたくない】\n育毛鍼による症例\n\n今回の症例は、「フィナステリドやデュタステリドなどのAGA治療薬はもちろんのこと、ミノキシジルの塗り薬でさえも絶対に使いたくない。育毛鍼が効かなければもう諦めます」という強い覚悟を持って来院された患者様です。\n\n施術を重ねるうちに比較的早い段階で「髪にハリが出てきた」と変化を実感され、数ヶ月が経つ頃には、最初にご本人が気にされていた「髪が伸びてこない」という違和感も消失。現在ではご自宅での薄毛チェックや、定期的な写真比較でも明らかな改善が見られ、大変喜んでいただいております。\n\n現在もより良い状態を目指して経過観察中です。\n\n当院では、患者様一人ひとりのお悩みに合わせ、最適な育毛プランをご提案しております。\n\n ［育毛鍼を主体としたプラン］\n ［他の治療と組み合わせた補助的なプラン］\nなど、幅広くご提案可能です。", "permalink": "https://www.threads.com/@0520hair/post/DcvfftzCTZ3", "likes": 0, "velocity": 0.0, "ageHours": 11.7, "postedAt": "2026-09-01T19:54:22+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策", "AGA"]}, {"id": "3849750779687740743", "username": "wellbeing_headspa.by_miyu", "text": "60代以降、どんどん髪の毛のボリューム\nダウンに悩む方も増える年齢に\n\n原因は一つではなくて、、\n\nまずは１つ\n\n頭皮環境の悪化（土壌の問題）\n植物と同じで、土壌（頭皮）が荒れていると\n元気な髪は育ちません。\n\nモニター1ヶ月の変化", "permalink": "https://www.threads.com/@wellbeing_headspa.by_miyu/post/DVtD-_xEiVH", "likes": 0, "velocity": 0.0, "ageHours": 4210.0, "postedAt": "2026-03-10T21:34:37+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3900480210487959171", "username": "bibi.scalp_ink", "text": ".\nスカルプインク認定アーティストBiBiです\n薄毛・つむじ・分け目・傷跡の悩みを解決します\n⭐︎麻酔不要\n⭐︎痛みほぼなし\n⭐︎つむじ分け目カバー\n⭐︎ヘアーライン施術により小顔仕上げ効果\n⭐︎即日効果\n\nスカルプインクとは\n麻酔を使用せず頭皮の浅い層にインクをのせ\n定着させていく美容を目的とした\n頭皮カバー技法です\nダウンタイムもなく当日から\nシャンプーも可能です\n地肌の透け感をカバー薄毛のお悩みを\n軽減するだけでなく生際ラインに\nグラデーションを入れる事で\n視覚的な小顔効果や\nおでこのコンプレックスも\n軽減できます\n\n『通常価格一発1.3円』がいまなら\n初回モニターキャンペーン中\n初回3万発29800円\n次回ご予約頂いた\nお客様に限り\n一発1円で\nご提供できます\n\nお気軽にご相談下さい\nカウセリング無料\n\n※本サービスは医療行為ではありません\n※治療目的の施術ではありません\n※効果・仕上がりは個人差があります\n\n福岡県北九州市八幡西区穴生２丁目2-2-8\nお問い合わせは  インスタDM\nお電話で090-1099-0357\n\n#美容\n#薄毛\n#八幡西区\n#北九州\n#頭皮", "permalink": "https://www.threads.com/@bibi.scalp_ink/post/DYhShX3k16D", "likes": 0, "velocity": 0.0, "ageHours": 2530.2, "postedAt": "2026-05-19T21:24:59+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3976478628330131220", "username": "oyausuge", "text": "AGAクリニックで\n「薄毛改善鍼って意味あるんですか？」\nと聞かれた患者さんが、\n\nうちに来られたことがあります\n\n正直にお伝えしたのは、", "permalink": "https://www.threads.com/@oyausuge/post/DcvSj6CjM8U", "likes": 0, "velocity": 0.0, "ageHours": 13.6, "postedAt": "2026-09-01T18:00:13+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3944377351336943169", "username": "ol_rin_cosme_", "text": "この画像は、母の10ヶ月の変化です。\n薄毛、抜け毛が気になるってずっと言ってて、何かいいケアないかなと一緒に探してた。\n\nハーグ治療に170万円以上、育毛剤も数え切れないほど試して、それでも「何か違う」って感じながらお金と時間を使い続けてたみたい。\n\n何が違っていたかというと、1/2", "permalink": "https://www.threads.com/@ol_rin_cosme_/post/Da9Pk2GiN5B", "likes": 0, "velocity": 0.0, "ageHours": 1076.6, "postedAt": "2026-07-19T11:00:43+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3976467964371369104", "username": "marsmars_50", "text": "この方に育毛剤っていりますか？\nさすがに、顔部分は「マスク」ってことはないでしょう…。", "permalink": "https://www.threads.com/@marsmars_50/post/DcvQIudE3yQ", "likes": 0, "velocity": 0.0, "ageHours": 13.9, "postedAt": "2026-09-01T17:39:02+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3976539033748231514", "username": "ikumou_kobe", "text": "9月、髪や頭皮のケアで新しく始めたいことはありますか？", "permalink": "https://www.threads.com/@ikumou_kobe/post/DcvgS6-CdVa", "likes": 0, "velocity": 0.0, "ageHours": 11.6, "postedAt": "2026-09-01T20:00:14+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3976554015257477391", "username": "akari_scalp_sleep", "text": "ストレスで髪が抜ける、という言い方、正直ざっくりしすぎです。ストレスと抜け毛の間には、少なくとも3つの段階が挟まっています。ここを飛ばしたまま、ストレスをなくしましょうと言われても、何をすればいいのか分からないと思います。順番に書きます↓", "permalink": "https://www.threads.com/@akari_scalp_sleep/post/Dcvjs7lk0EP", "likes": 0, "velocity": 0.0, "ageHours": 11.1, "postedAt": "2026-09-01T20:30:03+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3936314111193898609", "username": "eriko.healingsora89", "text": "若よもぎ蒸しを試したお客様の「頭皮」に、驚きの変化が起きました。", "permalink": "https://www.threads.com/@eriko.healingsora89/post/DagmNQiEd5x", "likes": 0, "velocity": 0.0, "ageHours": 1343.6, "postedAt": "2026-07-08T08:00:30+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3928576367487748957", "username": "fusafusa_gingin", "text": "残酷だが、リアップなどの市販発毛剤だけに頼ってるハゲは絶対に望んでいるような改善は得られない。理由は明確で、", "permalink": "https://www.threads.com/@fusafusa_gingin/post/DaFG2RJGgtd", "likes": 0, "velocity": 0.0, "ageHours": 1599.8, "postedAt": "2026-06-27T15:46:59+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3976448963511978140", "username": "verano.beautysalon", "text": "「普通のヘッドスパじゃ物足りない…」\nそんなヘッドスパ好きさんへ。\n\nインディバヘッドは、頭皮をじんわり温めながら巡りをサポートし、硬くなりやすい頭皮をやわらかく整えるケア。\n\n元美容師＋整体師として培った技術を活かし、頭だけで終わらずデコルテ・首・肩までしっかり施術します。\n\n健やかな髪を育てるには、まず土台となる頭皮環境から。\n\n抜け毛やハリ・コシ不足、頭皮の硬さが気になる方にもおすすめです。\n※発毛を保証する施術ではありません。\n\n【インディバヘッドスパ】\nオプション30分 ￥5,770\n単品45分 ￥8,660 → 初回￥6,000\n\nご予約・お問い合わせはLINEから。\n\n#インディバヘッド\n#頭皮ケア\n#ヘッドスパ\n#光市エステ\n#Verano", "permalink": "https://www.threads.com/@verano.beautysalon/post/DcvL0Ohmgic", "likes": 0, "velocity": 0.0, "ageHours": 14.6, "postedAt": "2026-09-01T17:01:18+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3950895490678349083", "username": "koki.wanope.kurashi", "text": "無印の新作「トゲトゲ」はヤバいやつです…\n美容師さんも大絶賛してるヘアブラシ、夏の頭皮の脂にはかなり効果的って言ってて、使ってみたらさぁ", "permalink": "https://www.threads.com/@koki.wanope.kurashi/post/DbUZoQak10b", "likes": 0, "velocity": 0.0, "ageHours": 860.7, "postedAt": "2026-07-28T10:51:06+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3976527897435417785", "username": "moon_pooa", "text": "白髪や抜け毛の悩みを放置するのは危険。早めの頭皮ケアで健やかな髪を目指すのが大切なポイント。Threadsで話題を集める『無印良品』の頭皮用ローションが、", "permalink": "https://www.threads.com/@moon_pooa/post/Dcvdw3eEay5", "likes": 0, "velocity": 0.0, "ageHours": 12.0, "postedAt": "2026-09-01T19:38:10+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3972962670172806092", "username": "mina_life_beauty", "text": "顔のたるみが気になる更年期世代は、小田切ヒロがテレビで紹介してた側頭筋の頭皮マッサージを毎日やって。何より継続することが大事なこのマッサージを手軽に続けるコツが、", "permalink": "https://www.threads.com/@mina_life_beauty/post/DcizH-1iZvM", "likes": 0, "velocity": 0.0, "ageHours": 130.0, "postedAt": "2026-08-27T21:34:39+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3967843535387903256", "username": "suncy_salon", "text": "批判覚悟で言います。\n\n自己流の頭皮マッサージ、\n今すぐやめてください。", "permalink": "https://www.threads.com/@suncy_salon/post/DcQnKxDIEUY", "likes": 0, "velocity": 0.0, "ageHours": 299.5, "postedAt": "2026-08-20T20:04:23+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3976566990529600164", "username": "enbano88", "text": "小顔にしたいからと\n肌の見える面積を狭めても\n小顔には見えません\nただ顔を隠している人です\n他人からは正面以外から見られることが多く\n２メートルくらい離れてバランスが良い\nイメージを持つことが大切だと思います", "permalink": "https://www.threads.com/@enbano88/post/DcvmpvwD5qk", "likes": 0, "velocity": 0.0, "ageHours": 10.7, "postedAt": "2026-09-01T20:55:47+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3976565438712843164", "username": "liftup.salon_anew", "text": "50代以上のお客さんの大半が目の下のたるみに悩んでいます。\n私もありますが、2年前に比べてだいぶ良くなりました。\n\n高い美容液やクリームなんか使っていません。\nまずは夜な夜なスマホを半時間も見てしまう習慣があるなら今すぐやめてください。\n十分な睡眠と眼球を動かすことが何よりも大事です。", "permalink": "https://www.threads.com/@liftup.salon_anew/post/DcvmTKgkwuc", "likes": 0, "velocity": 0.0, "ageHours": 10.7, "postedAt": "2026-09-01T20:52:42+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3976567479485389128", "username": "tsuki_biyou_", "text": "美容医療、何から始めたら良いか分からない30代はとりあえずこれ参考にして⤵︎\n\n・毛穴、角栓、皮脂→ハイドラフェイシャル/マッサージピール\n・シミ、そばかす、くすみ→ピコトーニング/IPL(光治療)\n・小じわ、乾燥、くすみ→水光注射/肌育注射\n・ニキビ跡、クレーター→ポテンツァ/サブシジョン\n・たるみ→ハイフ/RF(高周波)\n\nどれも比較的ダウンタイム少なくて始めやすい。\nただ注意点があって、", "permalink": "https://www.threads.com/@tsuki_biyou_/post/Dcvmw3IGNlI", "likes": 0, "velocity": 0.0, "ageHours": 10.7, "postedAt": "2026-09-01T20:56:45+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3976534249892885424", "username": "terassinaterassina", "text": "「美容医療には抵抗がある・・・」\n「高額な化粧品を使ってるけどいまいち効果が・・・」\n「健康的に自然なリフトアップがしたい！」\n\nそんな方へ美容医療に頼らないたるみ改善を行ってます。\n\n兵庫県神戸市\n三ノ宮各駅から徒歩7分\nたるみ・しわ専門サロンＴｒａｓｓｉｎａ", "permalink": "https://www.threads.com/@terassinaterassina/post/DcvfNTqCjOw", "likes": 0, "velocity": 0.0, "ageHours": 11.7, "postedAt": "2026-09-01T19:51:10+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3976578606629674420", "username": "momoco_salon", "text": "ほうれい線を薄くしたいならマッサージやめて、ここを1分ゆるめて。", "permalink": "https://www.threads.com/@momoco_salon/post/DcvpSyFlF20", "likes": 0, "velocity": 0.0, "ageHours": 10.3, "postedAt": "2026-09-01T21:18:52+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3976543531729501929", "username": "zakuro_skincare", "text": "40代で肌悩みが急に増えたん、あれ歳のせいやのうて原因が若い頃と全部入れ替わっとるけんよ。\n毛穴・くすみ・ほうれい線・シミが“同時多発”するのが40代やけん、片っぱしから攻めても空回りするとやけど、", "permalink": "https://www.threads.com/@zakuro_skincare/post/DcvhUYCnT7p", "likes": 0, "velocity": 0.0, "ageHours": 11.4, "postedAt": "2026-09-01T20:09:15+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3976533190470939923", "username": "dr.ryu_itohyalu", "text": "【施術名】\n糸リフト\n\n【施術内容】\n医療用の糸を皮下に挿入し、組織を物理的に牽引することで、フェイスラインなどの形態を整える施術です。\n\n【施術料金】\n8本　240,000円（税込）\n※使用する糸の種類・本数により料金が異なります。\n\n【主なリスク・副作用】\n腫れ、むくみ、内出血、疼痛、圧痛、ひきつれ、凹凸、左右差、違和感、感染、糸の露出・突出、神経障害、血管損傷などが生じる可能性があります。\n\n【経過】\n施術直後\n※効果や経過には個人差があります。\n※自由診療となります。", "permalink": "https://www.threads.com/@dr.ryu_itohyalu/post/Dcve94_kjUT", "likes": 0, "velocity": 0.0, "ageHours": 11.8, "postedAt": "2026-09-01T19:48:38+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3976569809671930474", "username": "mtsalon_kamitori", "text": "40代50代の方が毛穴洗浄するとね☝️\n\n・くすみ感が減る\n・肌に艶が出る\n・顔色が明るく見える\n・ファンデのヨレが変わる\n・乾燥でしぼんだ感じがうるおう\n・毛穴が目立ちにくくなる\n・超音波でリフトアップ⤴︎\n・『最近なんか綺麗になったね☺️』\n　と言われる✨\n\n40代、50代の毛穴悩みって\n乾燥・たるみ・ごわつきも関係してるんです。\n洗浄でキメを整えてツルツル肌になれますよ！", "permalink": "https://www.threads.com/@mtsalon_kamitori/post/DcvnSxSCcJq", "likes": 0, "velocity": 0.0, "ageHours": 10.6, "postedAt": "2026-09-01T21:01:23+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3930824999813270986", "username": "biyou.tama", "text": "美容看護師です。2025年から本格導入された、オンダリフト。ダウンタイムがほぼなくて、ガチで推せる。でも知っておくべき注意点があって、", "permalink": "https://www.threads.com/@biyou.tama/post/DaNGILMGE3K", "likes": 0, "velocity": 0.0, "ageHours": 1525.4, "postedAt": "2026-06-30T18:14:37+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3976871211317725836", "username": "soara.hari", "text": "「抜け毛が増えたから」と、シャンプーで念入りに洗っている方は注意してください。\n\n薄毛が気になる方の頭皮をマイクロスコープで見ると、「洗えば解決」とは言えない状態が見えることがあります。\n\n育毛鍼灸では何を確認しているのか。\n続きはコメント欄へ。", "permalink": "https://www.threads.com/@soara.hari/post/Dcwr0vcEgqM", "likes": 0, "velocity": 0.0, "ageHours": 0.6, "postedAt": "2026-09-02T07:00:13+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3911289292839799916", "username": "bibi.scalp_ink", "text": "スカルプインク認定アーティストBiBiです\n薄毛・つむじ・分け目・傷跡の悩みを解決します\n⭐︎麻酔不要\n⭐︎痛みほぼなし\n⭐︎つむじ分け目カバー\n⭐︎ヘアーライン施術により小顔仕上げ効果\n⭐︎即日効果\n\nスカルプインクとは\n麻酔を使用せず頭皮の浅い層にインクをのせ\n定着させていく美容を目的とした\n頭皮カバー技法です\nダウンタイムもなく当日から\nシャンプーも可能です\n地肌の透け感をカバー薄毛のお悩みを\n軽減するだけでなく生際ラインに\nグラデーションを入れる事で\n視覚的な小顔効果や\nおでこのコンプレックスも\n軽減できます\n\n『通常価格一発1.3円』がいまなら\n初回モニターキャンペーン中\n初回3万発29800円\n次回ご予約頂いた\nお客様に限り\n一発1円で\nご提供できます\n\nお気軽にご相談下さい\nカウセリング無料\n\n※本サービスは医療行為ではありません\n※治療目的の施術ではありません\n※効果・仕上がりは個人差があります\n\n福岡県北九州市八幡西区穴生２丁目2-2-8\nお問い合わせ　ご相談はLINE インスタDM\nお電話で090-1099-0357", "permalink": "https://www.threads.com/@bibi.scalp_ink/post/DZHsOORgUxs", "likes": 0, "velocity": 0.0, "ageHours": 2172.3, "postedAt": "2026-06-03T19:20:41+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3890830656704555455", "username": "bibi.scalp_ink", "text": ".\nスカルプインク認定アーティストBiBiです\n薄毛・つむじ・分け目・傷跡の悩みを解決します\n⭐︎麻酔不要\n⭐︎痛みほぼなし\n⭐︎つむじ・分け目カバー\n⭐︎ヘアーライン施術により小顔仕上げ効果\n⭐︎即日効果\n\nスカルプインクとは\n麻酔を使用せず頭皮の浅い層にインクをのせ\n定着させていく美容を目的とした\n頭皮カバー技法です\nダウンタイムもなく当日から\nシャンプーも可能です\n地肌の透け感をカバーし薄毛のお悩みを\n軽減するだけでなく生際ラインに\nグラデーションを入れる事で\n視覚的な小顔効果やおでこのコンプレックスも\n軽減できます\n\n『通常価格一発1.5円税別』がいまなら\n初回モニターキャンペーン中\n初回 <script>
(function () {
  var readJSON = function (id) { return JSON.parse(document.getElementById(id).textContent); };
  var POSTS = readJSON('data');
  var GENRES = readJSON('genre-list');
  var KEYWORDS = readJSON('keyword-list');
  var SUMMARY = readJSON('summary-data');
  var RISING = 0.76;   // 伸び率の上位10%にあたる値

  var activeGenres = new Set();
  var els = {
    sort: document.getElementById('sort'),
    period: document.getElementById('period'),
    keyword: document.getElementById('keyword'),
    q: document.getElementById('q'),
    genres: document.getElementById('genres'),
    list: document.getElementById('list'),
    count: document.getElementById('count'),
    summary: document.getElementById('summary'),
    breakdown: document.getElementById('breakdown')
  };

  function mk(tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  // 文節を1かたまりとして置く。途中で改行されないので、
  // 「を」「と」などの助詞が行頭に来ることがなくなる。
  function phrases(parent, list) {
    list.forEach(function (t) { parent.appendChild(mk('span', 'nb', t)); });
    return parent;
  }

  // --- 集計 ---
  // タイルは必ず4枚。ジャンルはここに混ぜず、下の棒グラフで見せる。
  (function renderSummary() {
    var tiles = [
      ['表示中の投稿', SUMMARY.total, '件'],
      ['直近7日の投稿', SUMMARY.thisWeek, '件'],
      ['1000いいね超え', SUMMARY.over1000, '件'],
      ['投稿者', SUMMARY.authors, '人']
    ];
    tiles.forEach(function (t) {
      var box = mk('div', 'stat');
      box.appendChild(mk('span', 'stat-label', t[0]));
      var v = mk('div', 'stat-value', t[1].toLocaleString());
      v.appendChild(mk('span', 'unit', t[2]));
      box.appendChild(v);
      els.summary.appendChild(box);
    });
  })();

  // --- ジャンル別の内訳 ---
  // 棒の長さは最多ジャンルを100%とした相対値。1つの投稿が複数ジャンルに
  // 入ることがあり、合計が総数と一致しないため、全体に対する割合としては見せない。
  (function renderBreakdown() {
    if (!SUMMARY.genres.length) { els.breakdown.remove(); return; }

    els.breakdown.appendChild(mk('p', 'breakdown-title', 'ジャンル別'));
    var max = SUMMARY.genres.reduce(function (m, p) { return Math.max(m, p[1]); }, 0);

    SUMMARY.genres.forEach(function (pair) {
      var row = mk('div', 'bar-row');
      row.appendChild(mk('span', 'bar-name', pair[0]));

      var track = mk('div', 'bar-track');
      var fill = mk('div', 'bar-fill');
      fill.style.width = (max > 0 ? (pair[1] / max) * 100 : 0) + '%';
      track.appendChild(fill);
      row.appendChild(track);

      row.appendChild(mk('span', 'bar-count', pair[1].toLocaleString() + ' 件'));
      els.breakdown.appendChild(row);
    });
  })();

  // 何件のうち何件を見ているのかを明示する。
  // 「最終収集」は実際に収集した時刻。HTMLを作り直しただけでは進まない。
  (function renderStamp() {
    var stamp = document.getElementById('stamp');
    var collectedAt = SUMMARY.updatedAt || '2026-09-02 07:35';
    var units = ['最終収集 ' + collectedAt];
    if (SUMMARY.archived > SUMMARY.total) {
      units.push('　/　蓄積 ' + SUMMARY.archived.toLocaleString() + ' 件のうち ');
      units.push(SUMMARY.total.toLocaleString() + ' 件を表示');
    }
    phrases(stamp, units);
  })();

  KEYWORDS.forEach(function (k) {
    var o = document.createElement('option');
    o.value = k; o.textContent = 'キーワード: ' + k;
    els.keyword.appendChild(o);
  });

  GENRES.forEach(function (g) {
    var b = mk('span', 'chip', g);
    b.tabIndex = 0;
    var toggle = function () {
      if (activeGenres.has(g)) { activeGenres.delete(g); b.classList.remove('on'); }
      else { activeGenres.add(g); b.classList.add('on'); }
      render();
    };
    b.addEventListener('click', toggle);
    b.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
    els.genres.appendChild(b);
  });

  function fmtAge(h) {
    if (h === null || h === undefined) return '不明';
    if (h < 24) return Math.round(h) + '時間前';
    return Math.round(h / 24) + '日前';
  }

  function filtered() {
    var days = parseInt(els.period.value, 10);
    var kw = els.keyword.value;
    var q = els.q.value.trim().toLowerCase();

    return POSTS.filter(function (p) {
      if (days > 0) {
        if (p.ageHours === null || p.ageHours > days * 24) return false;
      }
      if (kw && p.keywords.indexOf(kw) === -1) return false;
      if (activeGenres.size > 0) {
        var hit = p.genres.some(function (g) { return activeGenres.has(g); });
        if (!hit) return false;
      }
      if (q) {
        var hay = (p.text + ' ' + p.username).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function sorted(rows) {
    var mode = els.sort.value;
    var copy = rows.slice();
    if (mode === 'likes') copy.sort(function (a, b) { return b.likes - a.likes; });
    else if (mode === 'newest') copy.sort(function (a, b) {
      var av = a.ageHours === null ? Infinity : a.ageHours;
      var bv = b.ageHours === null ? Infinity : b.ageHours;
      return av - bv;
    });
    else copy.sort(function (a, b) { return b.velocity - a.velocity; });
    return copy;
  }

  function render() {
    var rows = sorted(filtered());
    els.count.textContent = rows.length + ' 件を表示';
    els.list.textContent = '';

    if (rows.length === 0) {
      // 「絞り込みを」を1かたまりにして、「を」が行頭に来ないようにする
      els.list.appendChild(phrases(mk('div', 'empty'), [
        '条件に合う投稿が', 'ありません。', '絞り込みを', '緩めてください。'
      ]));
      return;
    }

    var frag = document.createDocumentFragment();
    rows.forEach(function (p, i) {
      var isRising = p.velocity >= RISING;
      var card = mk('div', 'card' + (isRising ? ' rising' : ''));

      var head = mk('div', 'card-head');
      head.appendChild(mk('span', 'rank', String(i + 1)));
      head.appendChild(mk('span', 'user', '@' + p.username));
      if (isRising) head.appendChild(mk('span', 'badge', '伸び中'));

      var stats = mk('div', 'stats');
      stats.appendChild(mk('span', 'likes', p.likes.toLocaleString() + ' likes'));
      stats.appendChild(mk('span', 'vel', p.velocity.toFixed(1) + '/h'));
      stats.appendChild(mk('span', 'age', fmtAge(p.ageHours)));
      head.appendChild(stats);
      card.appendChild(head);

      card.appendChild(mk('p', 'text', p.text));

      var tags = mk('div', 'tags');
      p.genres.concat(p.keywords).forEach(function (t) {
        tags.appendChild(mk('span', 'tag', t));
      });
      if (p.permalink) {
        var a = mk('a', 'link', '元投稿を開く →');
        a.href = p.permalink;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        tags.appendChild(a);
      }
      card.appendChild(tags);
      frag.appendChild(card);
    });
    els.list.appendChild(frag);
  }

  [els.sort, els.period, els.keyword].forEach(function (el) {
    el.addEventListener('change', render);
  });
  els.q.addEventListener('input', render);

  render();
})();
</script>
