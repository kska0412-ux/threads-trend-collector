{"id": "3968744709703266804", "username": "kitemlab", "text": "一晩貼って寝るだけで、翌朝の鏡が楽しみになるなんて思わなかった。正直、ほうれい線が目に見えて薄くなっててマジで感動したんだよね。「最近疲れてる？」って言われなくなるだけで、こんなに自信が持てるんだね。", "permalink": "https://www.threads.com/@kitemlab/post/DcT0ElCEvH0", "likes": 5, "velocity": 0.02, "ageHours": 283.8, "postedAt": "2026-08-22T01:54:18+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["ほうれい線"]}, {"id": "3961311398789845784", "username": "lufeli_yuko", "text": "毎日たった30秒これをするだけで、簡単に目元が若返る頭皮ケア。", "permalink": "https://www.threads.com/@lufeli_yuko/post/Db5Z7qxkxMY", "likes": 5, "velocity": 0.01, "ageHours": 529.9, "postedAt": "2026-08-11T19:45:39+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3976957400439750894", "username": "kanakabae", "text": "調子がいいとこれにコンシーラーだけでいい日もある。\n二日酔いで土色の時はダメ。月の使者が来て死人みたいな時もだめ。寝不足でほうれい線の主張が強い時もだめ。\n調子がいい時だけである。", "permalink": "https://www.threads.com/@kanakabae/post/Dcw_a9UEoDu", "likes": 5, "velocity": 0.42, "ageHours": 11.8, "postedAt": "2026-09-02T09:51:28+09:00", "genres": ["たるみ・シワ"], "keywords": ["ほうれい線"]}, {"id": "3977094177532083858", "username": "__70_____", "text": "間違ったダイエット方法が多すぎるううううう。今は良くても身体は一生モノだから、栄養はバランスよく、摂取カロリーと消費カロリーを調整するんだよ。あとは睡眠の質を上げること。これはもはや1番にやるべき。", "permalink": "https://www.threads.com/@__70_____/post/DcxehU6Ev6S", "likes": 5, "velocity": 0.68, "ageHours": 7.3, "postedAt": "2026-09-02T14:23:13+09:00", "genres": ["ダイエット・痩身"], "keywords": ["ダイエット 方法"]}, {"id": "3854448491905667021", "username": "shinayaka_helthcare", "text": "更年期。下腹ぽっこりにはこれ！5つお伝えします!", "permalink": "https://www.threads.com/@shinayaka_helthcare/post/DV9wHtNE8_N", "likes": 5, "velocity": 0.0, "ageHours": 4068.6, "postedAt": "2026-03-17T09:08:08+09:00", "genres": ["ダイエット・痩身"], "keywords": ["下腹 ぽっこり"]}, {"id": "3955175853273632124", "username": "masaki.dgc", "text": "ヘッドスパ・ヘッドマッサージ後のダルさ\n「好転反応」で片付けていませんか？\n\n施術後にダルい・頭痛がする・気分が悪くなることを「好転反応」って説明する人が多いけど\n\nあれは完全に間違いです\n\nこれ施術者としてめっちゃ重要な話で…", "permalink": "https://www.threads.com/@masaki.dgc/post/Dbjm3uuk818", "likes": 5, "velocity": 0.01, "ageHours": 733.1, "postedAt": "2026-08-03T08:35:25+09:00", "genres": ["エステ・リラクゼーション"], "keywords": ["ヘッドスパ"]}, {"id": "3965140650216892924", "username": "key_kun_mom", "text": "もうすぐ1歳半になる娘が見事な薄毛です。\n早生まれなので七五三は満3歳でやればあと2年ちょっと猶予があるとは思いつつ、これほどまでに薄毛ガールはいつになったら髪の毛伸びてくるもんなんでしょうか？\n似たようや薄毛ガールの方の情報教えて欲しいです！", "permalink": "https://www.threads.com/@key_kun_mom/post/DcHAmnEo6n8", "likes": 4, "velocity": 0.01, "ageHours": 403.1, "postedAt": "2026-08-17T02:33:41+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3957024109753863483", "username": "official_paramiclinic", "text": "同一人物です。\n変わったのは、生え際だけ🌸\n\n#植毛 #AGA #薄毛治療 #ビフォーアフター", "permalink": "https://www.threads.com/@official_paramiclinic/post/DbqLHZtiQ07", "likes": 4, "velocity": 0.01, "ageHours": 671.9, "postedAt": "2026-08-05T21:47:34+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3974338122259557934", "username": "masa.agabye", "text": "ハゲたくないならこれ覚えとけ10選👊\n\n① 抜け毛だけ見るな。毛の細さも見ろ\n② AGAは進行性。様子見はおすすめしない\n③ DHTは覚えとけ。AGAに関わる男性ホルモン\n④ フィナは進行を抑える薬。DHTの生成を抑える\n⑤ デュタは作用範囲が広い。フィナとの違いはここ\n⑥ ミノキは発毛を促す。フィナとは役割が違う\n⑦ 育毛と発毛は別だ。ごっちゃにするな\n⑧ シャンプーだけに期待するな。AGA治療とは別物\n⑨ 遺伝でも諦めるな。親父の頭＝お前の未来じゃない\n⑩ 薬は自己判断するな。医師と相談して決めろ\n\n今年こそハゲ辞めるぞ", "permalink": "https://www.threads.com/@masa.agabye/post/Dcnr3caku4u", "likes": 4, "velocity": 0.04, "ageHours": 98.6, "postedAt": "2026-08-29T19:07:25+09:00", "genres": ["薄毛", "育毛・頭皮ケア"], "keywords": ["AGA", "発毛"]}, {"id": "3960653623860373756", "username": "momo_biyo321", "text": "バズってるこれ。毛穴消えるでお馴染みらしいけど正直に言うね。「一瞬で毛穴消えて神〜」はごめんけどない🙅🏻でもね…", "permalink": "https://www.threads.com/@momo_biyo321/post/Db3EXyIj6j8", "likes": 4, "velocity": 0.01, "ageHours": 551.7, "postedAt": "2026-08-10T21:58:46+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["毛穴 ケア"]}, {"id": "3967000691760349439", "username": "mimi2025jewelry", "text": "今までずっとハイトーン派で\nブリーチやめて髪質改善方向へきて数年\n最近白髪マジで増えてきて😨\nカラーしても1ヶ月持たないし‥‥\n\nでもめちゃくちゃ癖毛だし髪質改善して\n髪綺麗なったし🤔\nどっちを優先すべきなのか🥹\n\n来年50代突入だし🫨\nめちゃくちゃ悩むところ😮‍💨\n\nみんなはどんな感じ？？", "permalink": "https://www.threads.com/@mimi2025jewelry/post/DcNnhxwGsD_", "likes": 4, "velocity": 0.01, "ageHours": 341.5, "postedAt": "2026-08-19T16:09:15+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3945536592672966072", "username": "ms0101n", "text": "産後の抜け毛がすっごい。ハゲてる絶対😭\nお風呂場と髪の毛乾かした時すっごい。\n部屋中抜け毛だらけですっごい。\nこれいつ頃落ち着くのでしょうか🥹", "permalink": "https://www.threads.com/@ms0101n/post/DbBXKBuk8W4", "likes": 4, "velocity": 0.0, "ageHours": 1052.3, "postedAt": "2026-07-21T01:23:55+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["抜け毛 対策"]}, {"id": "3909986649644187846", "username": "ham__yur", "text": "あの、、、まじで声を大にして言わないといけないことがありまして、、頭皮マッサージとかしてない人ほんと顔たるむんで、まじでこれ使ってほしい、、テレビで女優さんが使ってたやつなんですけどほんとこういうのが1番いいぞ…", "permalink": "https://www.threads.com/@ham__yur/post/DZDECRQj8DG", "likes": 4, "velocity": 0.0, "ageHours": 2229.5, "postedAt": "2026-06-02T00:12:32+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3949405248637032355", "username": "chizureen", "text": "髪🪮　血行促進　頭皮マッサージ", "permalink": "https://www.threads.com/@chizureen/post/DbPGyYXEtej", "likes": 4, "velocity": 0.0, "ageHours": 924.2, "postedAt": "2026-07-26T09:30:15+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3958195644905738254", "username": "yumi.twins02", "text": "髪の毛かき集めたツインテール（？）", "permalink": "https://www.threads.com/@yumi.twins02/post/DbuVfe2GtAO", "likes": 4, "velocity": 0.01, "ageHours": 633.1, "postedAt": "2026-08-07T12:35:12+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3952375987086396397", "username": "miiii.2598", "text": "薄毛なのにぃーーーー\nハゲてきた😭😭\nとりあえず枕にシルクカバーつけたけど😭\n女の子なのに😭😭\n対策ありますか？", "permalink": "https://www.threads.com/@miiii.2598/post/DbZqQUJEYvt", "likes": 4, "velocity": 0.0, "ageHours": 825.8, "postedAt": "2026-07-30T11:52:35+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3899708760751567882", "username": "oyausuge", "text": "頭皮マッサージは、\nやればやるほど\n逆効果になることがあります。\n\n触りすぎる頭皮は、", "permalink": "https://www.threads.com/@oyausuge/post/DYejHTUE3QK", "likes": 4, "velocity": 0.0, "ageHours": 2569.8, "postedAt": "2026-05-18T19:52:12+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3961172200761926796", "username": "eeeeen.faaaam", "text": "毛穴おだまりクリームってどうなってんの？\nなんで毛穴消滅するの！！？\n毛穴に比べて気にならなかったシミが気になるようになってきた🤣", "permalink": "https://www.threads.com/@eeeeen.faaaam/post/Db46SEgkSSM", "likes": 4, "velocity": 0.01, "ageHours": 534.5, "postedAt": "2026-08-11T15:09:05+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["毛穴 ケア"]}, {"id": "3962838810660904009", "username": "non.biyouu", "text": "女性の薄毛って男性みたいに前頭部からごっそり後退するパターンは少なくて、実はほとんどの人がまず頭頂部の分け目からじわじわ進行するらしい。初期サインは抜け毛の本数が増えることより先に、1本1本の髪が細くなること。分け目が広がって地肌が透けて見えるようになった時点で、実はけっこう進行してるサインらしくて、これ知った時ゾッとした。しかも自分では毎日鏡を見てるからこそ変化に気づきにくくて、はっきり気づいた時にはもう分け目全体が薄くなってるパターンが多い。", "permalink": "https://www.threads.com/@non.biyouu/post/Db-1Ob7kxxJ", "likes": 4, "velocity": 0.01, "ageHours": 479.4, "postedAt": "2026-08-13T22:20:20+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3961138022981494974", "username": "emyi.02", "text": "え、これ同一人物…？😳\n自分でも写真並べてびっくりした。\n\n毎日ケア＋スペシャルケアを続けてたら、\n肌にハリ感が出てきて\n気になってたほうれい線までなんか違う…！✨\n\n毛穴汚れもスッキリして、キメもなめらかに。\nツヤ・透明感も出てきた気がする🥹🤍", "permalink": "https://www.threads.com/@emyi.02/post/Db4ygt-Gui-", "likes": 4, "velocity": 0.01, "ageHours": 535.7, "postedAt": "2026-08-11T14:01:11+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["ほうれい線"]}, {"id": "3976203907399607229", "username": "iemny_ja12", "text": "なんか前回、林道を久しぶりに走ってからなんか目覚めたイエムニーす\n⁡\n外見、内装あーしよこーしよみたいな\n考えがあった私です\n⁡\n久しぶりに林道走って\nやっぱり私のジムニーは\n悪路走ってこそのジムニーだと\n思いました☺️\n⁡\n悪路を走るドキドキ感が\n正直、勃起しそうになりました\n⁡\n女子、すいません\n⁡\nでも、この興奮こそが\nビンビンに来るアレと\n一緒で大興奮でした\n⁡\nこの車壊すと思うけど\n大事に乗るからね♡\n⁡\n#Jimny\n#ジムニー\n#ja12\n#jb23\n#jb64リフトアップ", "permalink": "https://www.threads.com/@iemny_ja12/post/DcuUGMPEuO9", "likes": 4, "velocity": 0.11, "ageHours": 36.8, "postedAt": "2026-09-01T08:54:24+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3957849577261012925", "username": "sak_i00511", "text": "元々長年コンプレックスでどうやっても生えてこなかったM字ハゲが、ケア頑張ってるおかげか2ヶ月も経ってないのにかなり良くなってきた気がする🤔\nなんかおでこの生え際も産毛が健やかに育ってきてフサフサしてきた🌱\nでも未だに産後の抜け毛全然治らんの悲しい", "permalink": "https://www.threads.com/@sak_i00511/post/DbtGziPEpe9", "likes": 4, "velocity": 0.01, "ageHours": 644.6, "postedAt": "2026-08-07T01:07:38+09:00", "genres": ["薄毛", "育毛・頭皮ケア"], "keywords": ["薄毛 対策", "抜け毛 対策"]}, {"id": "3976556784479935854", "username": "soracoromai", "text": "抗がん剤TC療法ラストケモからちょうど半年くらい\n頭部冷却は自己流で、前頭葉部分が発毛しにくいと聞いてたから重点的に冷却\n効果出てるかわからないけど、半年でこのくらいは普通なのかな？\nベリーショートならいけそうかも\n皆さんいかがでしたか？", "permalink": "https://www.threads.com/@soracoromai/post/DcvkVOoGJ1u", "likes": 4, "velocity": 0.16, "ageHours": 25.1, "postedAt": "2026-09-01T20:35:30+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["発毛"]}, {"id": "3967904305457883229", "username": "miwa.electronic38", "text": "10月で39歳になります。\n夏場は汗かいて毛がまとまると毛が細いのでちらかります。\nAGA治療を考えてます。\n\nこんなとこでこんな醜態晒すのもどうかと思いますが、Threads民は優しいと評判なので教えて下さい！\n\n現在ペソッド使ってます！\n令和の虎のやつです！\nピンクのやつ！\n効能はよくわかってません！\n\n飲み薬を考えてます。\nいいのないですか😭\nボサボサになりたいです🫣😅😭🤣🫣😭", "permalink": "https://www.threads.com/@miwa.electronic38/post/DcQ0_Flj2hd", "likes": 4, "velocity": 0.01, "ageHours": 311.6, "postedAt": "2026-08-20T22:04:35+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3966532106314854003", "username": "hellomama273", "text": "これ、美容部員時代の後輩にこっそり聞いた話。\nデパコスのシミ対策クリーム、成分表見たらプチプラとほぼ同じ処方のものが結構あるらしい。\n正直、パッケージと接客にお金払ってる部分も大きいんだなって知って複雑だった。\n知らなきゃよかったような、知れてよかったような😆", "permalink": "https://www.threads.com/@hellomama273/post/DcL8-9jFC5z", "likes": 4, "velocity": 0.01, "ageHours": 357.1, "postedAt": "2026-08-19T00:38:16+09:00", "genres": ["くすみ・美白"], "keywords": ["シミ 対策"]}, {"id": "3972201089122680520", "username": "momotarou_t", "text": "自律神経系を整える方法を教えて。\n\nとりあえず寝る事かな。", "permalink": "https://www.threads.com/@momotarou_t/post/DcgF9hNk77I", "likes": 4, "velocity": 0.02, "ageHours": 169.3, "postedAt": "2026-08-26T20:21:31+09:00", "genres": ["エステ・リラクゼーション"], "keywords": ["自律神経 整える"]}, {"id": "3947971002407333380", "username": "o_dai_o_dai", "text": "早く知ればよかった薄毛対策↓\n\n🥉論外（金ドブになりやすい）\n・高いだけのスカルプシャンプー\n・根拠の弱い発毛サプリ\n・頭皮を強く刺激するマッサージ器\n\n🥈惜しい（悪くないけど役割が違う）\n・低刺激シャンプー\n・亜鉛やビオチンのサプリ\n・育毛トニックの単品使い\n・頭皮用美容液だけ\n・タンパク質を意識した食事\n\n🥇ガチで将来に差がつく対策", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbKArWeCC4E", "likes": 3, "velocity": 0.0, "ageHours": 971.7, "postedAt": "2026-07-24T10:00:40+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3935068598268699007", "username": "firstpenguin_is", "text": "最近「髪ツヤツヤだね」って言われること増えたんだけど、絶対これのおかげだと思う✨\n以前は朝起きるたびに枕見て落ち込んでたのに、今はボリュームも出てきて\n\n同じ悩みあった人いる？もっと早く出会いたかったやつ", "permalink": "https://www.threads.com/@firstpenguin_is/post/DacLAqOmaF_", "likes": 3, "velocity": 0.0, "ageHours": 1398.9, "postedAt": "2026-07-06T14:45:53+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3953834512312565986", "username": "days_mo_ni", "text": "高いオイルもバームも何使っても癖毛大ボリュームヤチボウズハグリッドになってたんだけど\n同じく癖毛の子に相談したら「ベビーオイルがいいよ〜」って教えてもらって。\nお風呂後に揉み込んで寝たら\n朝起きてまとまりすぎてて感動した😭😭(寿司がアフターね)\n頑張って伸ばせそう〜", "permalink": "https://www.threads.com/@days_mo_ni/post/Dbe14pnEgDi", "likes": 3, "velocity": 0.0, "ageHours": 777.5, "postedAt": "2026-08-01T12:10:24+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3966416118433329123", "username": "yasunari_akiba_peace", "text": "ペロリコオススメです。\n使ってみてください。\n発毛クリニックでも使われてる世界的特許の機能性ペプチドを高配合されてるシャンプー、コンディショナー、育毛剤です。\n当店でも90%以上のお客様にしっかりとした効果があります。\nお近くに取り扱いの理美容室があれば1度ご相談してみて下さい。", "permalink": "https://www.threads.com/@yasunari_akiba_peace/post/DcLinHami_j", "likes": 3, "velocity": 0.01, "ageHours": 360.9, "postedAt": "2026-08-18T20:47:49+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["発毛"]}, {"id": "3906998884375885979", "username": "festa201206", "text": "「毛穴消えるわよぉ〜」って\n小田切ヒロさんの聞いて即ポチ。🥹\nこれ当たりだった…。\n1ヶ月続けたらお肌つるんつるん。w\n毛穴ケアって、こーゆー事ね。", "permalink": "https://www.threads.com/@festa201206/post/DY4cskBEnib", "likes": 3, "velocity": 0.0, "ageHours": 2328.4, "postedAt": "2026-05-28T21:16:23+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["毛穴 ケア"]}, {"id": "3970626307495381579", "username": "nori_jinsei_lab", "text": "AGA治療、始めて1年3ヶ月経過。", "permalink": "https://www.threads.com/@nori_jinsei_lab/post/Dcaf5biFUpL", "likes": 3, "velocity": 0.01, "ageHours": 221.5, "postedAt": "2026-08-24T16:12:52+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3973970177821925130", "username": "o_dai_o_dai", "text": "お願いですから、メモってください。 \n薄毛治療10年以上、育毛剤でかなり遠回りした俺からのお願いです。\n\n・育毛剤は「AGAの進行を止める薬ではありません」\n・育毛シャンプーは「頭皮を洗うもの。発毛治療ではありません」\n・頭皮マッサージは「気持ちいい。でもAGA治療の代わりにはなりません」\n・亜鉛サプリは「不足を補うもの。AGAを治すものではありません」\n・フィナステリドは「AGAの進行を抑える“守り”です」\n・デュタステリドは「作用範囲が違う“守り”の選択肢です」\n・外用ミノキシジルは「", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DcmYNJdEl8K", "likes": 3, "velocity": 0.03, "ageHours": 110.8, "postedAt": "2026-08-29T06:56:23+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3964920156567757171", "username": "aru.pska.no.suke", "text": "AGAの治療したいんだけど、トランスジェンダーで毎月男性ホルモン注射打ちながらって意味あるんかな....", "permalink": "https://www.threads.com/@aru.pska.no.suke/post/DcGOeAXAeFz", "likes": 3, "velocity": 0.01, "ageHours": 410.4, "postedAt": "2026-08-16T19:15:36+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3887433089312117504", "username": "sacchan_moto_biyou", "text": "小田切ヒロ様が「毛穴消えるわよ〜！！！」って言ってたクレンジング、黒ずみ＆角栓まとめて崩壊した。1回で変化出るのに、使い続けたら毛穴どこ？状態。これで2000円以下は意味わからん。", "permalink": "https://www.threads.com/@sacchan_moto_biyou/post/DXy78xYjFMA", "likes": 3, "velocity": 0.0, "ageHours": 2976.3, "postedAt": "2026-05-01T21:22:38+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["毛穴 ケア"]}, {"id": "3864961581343943305", "username": "akari_scalp_sleep", "text": "抜け毛、薄毛で悩む方へ。美容師歴18年の私が、頭皮を見続けて気づいたこと10選", "permalink": "https://www.threads.com/@akari_scalp_sleep/post/DWjGhSuiaqJ", "likes": 3, "velocity": 0.0, "ageHours": 3720.4, "postedAt": "2026-03-31T21:15:46+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3955149705345416087", "username": "salon_bluete", "text": "髪を明るくしたとたん、顔がぼやけて見えるようになった方。美容室の色が悪かったのではありません。髪は、顔のすぐ横にあるいちばん面積の大きい色です。ここを動かすと顔の印象がまるごと変わります。効いているのは、", "permalink": "https://www.threads.com/@salon_bluete/post/Dbjg7OkmruX", "likes": 3, "velocity": 0.0, "ageHours": 734.0, "postedAt": "2026-08-03T07:43:35+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3856276255931331587", "username": "ngmyuka", "text": "産後抜け毛もびびったけど、9ヶ月にして。頭皮のかゆみとフケ。、(汚、すいません💦)まじで聞いてない✋💫💫\nシャンプー薬用とかにしたら効果あるのかな。、？？😭\n頭皮で悩んだこととかないって✋。。、", "permalink": "https://www.threads.com/@ngmyuka/post/DWEPtLGj3QD", "likes": 3, "velocity": 0.0, "ageHours": 4008.0, "postedAt": "2026-03-19T21:39:34+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["抜け毛 対策"]}, {"id": "3940253102187818655", "username": "datsumo_science", "text": "★★脱毛初心者向け、その4★★\n\n「10回コース中残り2回。毎回あまり抜けずに普通に生えてきます。少し毛が柔らかくなって、生えるペース遅くなってきたけど、あと1回で本当に毛が減るのか不安です。」\n↑\nこれは手遅れ、", "permalink": "https://www.threads.com/@datsumo_science/post/Daul1HxCS6f", "likes": 3, "velocity": 0.0, "ageHours": 1227.3, "postedAt": "2026-07-13T18:26:34+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["発毛"]}, {"id": "3884909349173334006", "username": "lily.bihouse", "text": "まっっっっっじで続けててよかったーーーーー\nと思ったアラサー続けててよかったNo1！！！！\n\nマツパのお姉さんに\n「何使ってます？まつ毛綺麗ですね」って言われたまつ毛美容液！！！", "permalink": "https://www.threads.com/@lily.bihouse/post/DXp-HhOEg_2", "likes": 3, "velocity": 0.0, "ageHours": 3059.9, "postedAt": "2026-04-28T09:48:25+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["育毛剤"]}, {"id": "3972242964609224572", "username": "berrie_luby", "text": "韓国のオリーブヤングで人気って聞いて使ってみたんだけど、\nこれ、続けて使ってたら\n産毛っぽい短い毛がふわっと見えるようになってきた気がする。\nやっぱりこういう頭皮ケアは継続が大事かも。", "permalink": "https://www.threads.com/@berrie_luby/post/DcgPe4zE898", "likes": 3, "velocity": 0.02, "ageHours": 168.0, "postedAt": "2026-08-26T21:44:43+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3943821416273790778", "username": "ly.kaiq", "text": "｢たるみ毛穴が酷くなってきたんです…｣そう皮膚科の先生に話したんだけど｢スキンケアならペプチドが入ってるのがいいけどこのブースターが最強でしかもね…｣って", "permalink": "https://www.threads.com/@ly.kaiq/post/Da7RK7Ok8c6", "likes": 3, "velocity": 0.0, "ageHours": 1109.1, "postedAt": "2026-07-18T16:36:10+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["毛穴 ケア"]}, {"id": "3953423519023459453", "username": "hari.kyu_tsumugi", "text": "髪の調子いいんです！\n\n「食べるアンチエイジング美容液」", "permalink": "https://www.threads.com/@hari.kyu_tsumugi/post/DbdYb6SEWx9", "likes": 3, "velocity": 0.0, "ageHours": 791.1, "postedAt": "2026-07-31T22:33:50+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3915741662005908105", "username": "kuruta_kun11", "text": "実はあまり知られてない。\n\n薄毛が気になる人ほど、\nAGA治療ばかり見ている。\n\nでも本音では、、、", "permalink": "https://www.threads.com/@kuruta_kun11/post/DZXgkuMD1KJ", "likes": 3, "velocity": 0.0, "ageHours": 2038.9, "postedAt": "2026-06-09T22:46:43+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3976567831697437993", "username": "pitalabo_japan", "text": "この間ふと横顔のフェイスラインみて、ギョッ😱😱としたので急いで超音波リフトしました。\n\n祭り前のかけこみ美容いかがでしょう？💜\n週1ペースでもOKなくらい優しい施術🙋‍♀️\n\nHIFUで顎裏の脂肪だいぶ減って油断してたら…😂😂\nたるみ、浮腫のもたつきはふいに登場して老けてみえるので嫌ですねぇ🤢\n\n#岸和田たるみ　#岸和田小顔　#痛みゼロ　\n#LDM #保湿　#しわ", "permalink": "https://www.threads.com/@pitalabo_japan/post/Dcvm1_JkjUp", "likes": 3, "velocity": 0.12, "ageHours": 24.7, "postedAt": "2026-09-01T20:57:27+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["小顔"]}, {"id": "3976569428695266603", "username": "dr.sayakanagao", "text": "輪郭3点、頬脂肪吸収、鼻フルから4ヶ月！！\n\n顔がなくなるくらい\n小顔になりたかったから\nめちゃくちゃ嬉しい！！\n\nしんじ先生ありがとう🥹", "permalink": "https://www.threads.com/@dr.sayakanagao/post/DcvnNOeDzUr", "likes": 3, "velocity": 0.12, "ageHours": 24.7, "postedAt": "2026-09-01T21:00:38+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["小顔"]}, {"id": "3960306316438628992", "username": "raaaaai.21", "text": "肌育てに精神的豊かさをともに育みながら\nハッピーホルモン放出中😆🩷\n寝起きの顔笑→のケア後は\n涙袋もぷっくりしてリフトアップ\nほっぺも上がったりなんせ艶がすごい😍🩷\nさてさてhealyの「つやめき」もやっていくよー🩷", "permalink": "https://www.threads.com/@raaaaai.21/post/Db11Zy5D2qA", "likes": 3, "velocity": 0.01, "ageHours": 563.2, "postedAt": "2026-08-10T10:28:44+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3921078652708670087", "username": "biyou.tama", "text": "ヒアルロン酸を考えてる人、全員読んで。美容ナース12年の私が見た症例を話す。頬にヒアルロン酸を3ccも入れていた患者さん。リフトアップ目的のつもりが、", "permalink": "https://www.threads.com/@biyou.tama/post/DZqeEKHEUqH", "likes": 3, "velocity": 0.0, "ageHours": 1862.2, "postedAt": "2026-06-17T07:30:22+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3913390761543049032", "username": "tachibana_wakahage", "text": "【薄毛の人によくある初期症状】\n\n1. 枕や排水溝の抜け毛が増えた\n2. 抜け毛の毛先が細い\n3. 抜け毛が短い\n4. なんとなく髪のボリュームか減った\n5. 前髪やつむじが透けて地肌か見える\n6. 髪の分け目がくっきりする\n7. 頭皮を揉んだ時に硬い\n8. 頭皮の皮脂が増えてベタつく\n9. 頭皮の臭いが気になる\n10. 髪のうねりやくせ毛が増えた\n\n3つ以上当てはまるなら\n薄毛が進行してる可能性があるかも…", "permalink": "https://www.threads.com/@tachibana_wakahage/post/DZPKCnhEZ9I", "likes": 3, "velocity": 0.0, "ageHours": 2116.8, "postedAt": "2026-06-06T16:55:54+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3962561635323706386", "username": "toiro_personal_salon", "text": "見えてる髪より、\n見えない頭皮。\n\n髪は毎日見てるのに、\n頭皮って意外と見てない。\n\nでも、\nきれいな髪を育てる土台は頭皮🌿\n\n「最近、髪の変化が気になる」\nその前に、頭皮を見てみませんか？", "permalink": "https://www.threads.com/@toiro_personal_salon/post/Db92NASD3wS", "likes": 3, "velocity": 0.01, "ageHours": 488.5, "postedAt": "2026-08-13T13:09:39+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3971118373760251766", "username": "deko_rere1", "text": "なぜ頭皮は硬くなるのか？〜「血流が悪い」だけでは説明できない、頭皮の変…", "permalink": "https://www.threads.com/@deko_rere1/post/DccPx79Abd2", "likes": 3, "velocity": 0.01, "ageHours": 205.2, "postedAt": "2026-08-25T08:30:21+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3975663112464306450", "username": "iwasaki.kanau", "text": "え‼️ちょっと待って。\n生え際から今まで見たことないこんな太い毛が生えてきてた🤣\n話題の化粧品を使い始めて9ヶ月！\n生え際までしっかり塗ってるから、ジャイアントビョンプールのツボクサの影響だと思ってる🌿\nツボクサすごすぎない？笑", "permalink": "https://www.threads.com/@iwasaki.kanau/post/DcsZIltDxES", "likes": 3, "velocity": 0.05, "ageHours": 54.6, "postedAt": "2026-08-31T15:08:55+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3940217030343638350", "username": "kurea_cu1225cuu", "text": "アトピーや肌荒れで悩んでいる方いますか？\nよくなると人生変わりますよ！\n隠さなくていい、気にしなくていい\nこれがどれだけストレスじゃないかを知れます！\n皮膚科で治りましたか？\n私は治りませんでした、、、\n悩んで三年、使用して2ヶ月！\nびっくりです！こんなよくなるなんて！\n体質改善が大切なんです！\n変わりたい方コメント下さい！\nサロンにこなくても大丈夫！誰でも購入できます！\n\n#アトピー#ニキビ#肌荒れ#皮膚科", "permalink": "https://www.threads.com/@kurea_cu1225cuu/post/DaudoNPk71O", "likes": 3, "velocity": 0.0, "ageHours": 1228.5, "postedAt": "2026-07-13T17:14:54+09:00", "genres": ["毛穴・ニキビ"], "keywords": ["ニキビ 治し方"]}, {"id": "3932333155131059789", "username": "narico_diet15", "text": "悲しいけど、部分痩せはできません。\n\n私も昔は部分痩せ信じてた。\n痩せたいところはどこですか？\nって聞かれたら、\n\nお尻、太もも、ふくらはぎ、二の腕、お腹…\n全部に丸がついてた笑←\n\nでも痩せたように見えるのは👇", "permalink": "https://www.threads.com/@narico_diet15/post/DaSdCuSE-5N", "likes": 3, "velocity": 0.0, "ageHours": 1489.5, "postedAt": "2026-07-02T20:11:03+09:00", "genres": ["ダイエット・痩身"], "keywords": ["部分痩せ"]}, {"id": "3875459944607370428", "username": "enne_yukino", "text": "まさに今、ふくらはぎから下\nパンパンにむくんじゃってる人\n\n水分気にするのも、足揉むのもやめてください\n\n中学生でもわかる\n【本当の足のむくみ撃退法】", "permalink": "https://www.threads.com/@enne_yukino/post/DXIZklbk8y8", "likes": 3, "velocity": 0.0, "ageHours": 3372.8, "postedAt": "2026-04-15T08:54:08+09:00", "genres": ["むくみ・冷え"], "keywords": ["脚 むくみ"]}, {"id": "3977061326904345013", "username": "mi.comco", "text": "VIO脱毛のときに、日焼けしてませんか？って聞かれるのジワるw\nただの確認だとはわかってるけどそんな開放的な人いる？日サロとか？", "permalink": "https://www.threads.com/@mi.comco/post/DcxXDSYE8G1", "likes": 3, "velocity": 0.36, "ageHours": 8.4, "postedAt": "2026-09-02T13:17:57+09:00", "genres": ["脱毛"], "keywords": ["VIO脱毛"]}, {"id": "3977087904078539366", "username": "sakeutuchan", "text": "美容院終わってまだちょい時間あるし\nヘッドスパ？ドライスパ？いく💆🏼‍♀️\n肩こりと目の疲れが、、\n(何疲れやねん)", "permalink": "https://www.threads.com/@sakeutuchan/post/DcxdGCTGqpm", "likes": 3, "velocity": 0.4, "ageHours": 7.5, "postedAt": "2026-09-02T14:10:45+09:00", "genres": ["エステ・リラクゼーション"], "keywords": ["ヘッドスパ"]}, {"id": "3972521547311272831", "username": "head.spa.salon_be2", "text": "ヘッドスパ受けるなら\nシャンプーヘッドスパとドライヘッドスパと\nどっちが受けたいかな？", "permalink": "https://www.threads.com/@head.spa.salon_be2/post/DchO0zKEtN_", "likes": 3, "velocity": 0.02, "ageHours": 158.7, "postedAt": "2026-08-27T06:58:13+09:00", "genres": ["エステ・リラクゼーション"], "keywords": ["ヘッドスパ"]}, {"id": "3963249860112220708", "username": "aone_2222", "text": "自律神経を整えるって、深呼吸をイメージする人が多いと思う。でも、呼吸法が合わない日ってあるよね。実は、呼吸以外にも自律神経がふっとゆるむ方法があるみたいで。しかも、ちょっと意外なやり方なんです。", "permalink": "https://www.threads.com/@aone_2222/post/DcASr_kGwIk", "likes": 3, "velocity": 0.01, "ageHours": 465.7, "postedAt": "2026-08-14T11:57:06+09:00", "genres": ["エステ・リラクゼーション"], "keywords": ["自律神経 整える"]}, {"id": "3880031307468573493", "username": "noar_hairatelier", "text": "私が20代半ばで抜け毛で悩み、改善できた方法↓\n正直安心しました。", "permalink": "https://www.threads.com/@noar_hairatelier/post/DXYo-q3Dws1", "likes": 2, "velocity": 0.0, "ageHours": 3221.4, "postedAt": "2026-04-21T16:16:37+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3925082250320752128", "username": "kamonohasi.aga", "text": "怖い話。\n生え際が1cm後退したら、\n放置した証拠だ。\nちなみに\n\nただ、知らない奴が多くて、", "permalink": "https://www.threads.com/@kamonohasi.aga/post/DZ4sYK8jy4A", "likes": 2, "velocity": 0.0, "ageHours": 1729.6, "postedAt": "2026-06-22T20:04:48+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3955165887045281884", "username": "kirary_jewels", "text": "この程度で言わないほうが良いのかなと思いつつ、お金も払ったし…という気持ちで相談です\n\n昨日の夕方、初めての美容室へ行きました\nヘアカラーとヘアカット、トリートメント、ヘッドマッサージのコースで予約しました\n\n口コミがとても良かったので期待して行き、カットもマッサージも大満足で帰りました\n\nしかし、帰宅後に切ってもらった前髪を上げたところ、おでこの真ん中の生え際が染まっていないことに気が付きました\n（画像が見づらく申し訳ありません、恥ずかしいですが白髪画像付けました）\n\n細い毛なので染まりきらなかったのか、それとも塗り残しなのか、前髪は下ろすので多少染まらなくても問題視されないものなのか…？\n\n今日は美容室が休みで連絡が出来ない\u0026私は明日から義両親が泊まりに来るなど連日予定がびっしりで、そのためにも綺麗にしたくて、限られた時間の中で行ったのでどうしたら良いものか…\n\nこういった少しの白髪が残るのは致し方ないのでしょうか\nお店に連絡して、お盆明けなどに染めてもらうなどの対応はしていただけるものなのでしょうか？", "permalink": "https://www.threads.com/@kirary_jewels/post/Dbjkms9E6hc", "likes": 2, "velocity": 0.0, "ageHours": 733.4, "postedAt": "2026-08-03T08:15:37+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3961073548542286049", "username": "tsubasa.agataisaku", "text": "友人に撮ってもらった集合写真。\nいつもと違う角度から見た自分の生え際に、\n正直かなりゾッとした。\n\n「あれ、こんなに後退してたっけ」\n\nその日から今日まで、7年かかりました。\n\nこれから数回に分けて、\n薄毛に気づいてから今に至るまでの\nリアルな話をしていこうと思います。\n\n長くなるので、興味ある人だけ\nゆっくり読んでもらえたら嬉しいです🧵", "permalink": "https://www.threads.com/@tsubasa.agataisaku/post/Db4j2feDxjh", "likes": 2, "velocity": 0.0, "ageHours": 537.8, "postedAt": "2026-08-11T11:53:05+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3944620318039775049", "username": "non.biyouu", "text": "薄毛、気づいた時にはもう進んでる。これ、薄毛に悩んでる人にとって一番怖い現実。分け目が目立ってきた、つむじが透けて見える、抜け毛が増えた。そう感じ始めたら、今すぐ動いてほしい。", "permalink": "https://www.threads.com/@non.biyouu/post/Da-G0eejJdJ", "likes": 2, "velocity": 0.0, "ageHours": 1082.6, "postedAt": "2026-07-19T19:03:27+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "つむじ 薄毛"]}, {"id": "3936585794424861571", "username": "o_dai_o_dai", "text": "40代入ってヤバいくらい髪が薄くなった人いる？\n「前髪が割れるようになった」「つむじが白く透ける」「過去最高にセットが決まらない」などなど...\n同じ人が多いから原因を話すね。", "permalink": "https://www.threads.com/@o_dai_o_dai/post/Dahj-xQivOD", "likes": 2, "velocity": 0.0, "ageHours": 1348.7, "postedAt": "2026-07-08T17:00:17+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3901094220890448589", "username": "usuge_cut_kurita", "text": "つむじハゲのカットはブロッキングがめちゃ大事！\n毛流れに合わせて切ったらこうならない。\n美容師はキレイにコーミングして切っちゃうから薄毛の人が切れない。", "permalink": "https://www.threads.com/@usuge_cut_kurita/post/DYjeIZngSLN", "likes": 2, "velocity": 0.0, "ageHours": 2524.0, "postedAt": "2026-05-20T17:44:52+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3929287258855961203", "username": "o_r_i__sa", "text": "朝アイロンしても、数十分したらうねり出し、すぐにこうなります。\n産後１年経っているので生えてきた毛が短い毛が内側にあります。\nそしておでこの生え際につむじが有り、立ち上がる癖があります。\n前髪を伸ばしてたのですが、産後の抜け毛からの伸びてきた毛が嫌過ぎて前髪を切ってしまい扱いがしづらくて悩んでます。\n前髪ストレートパーマかければ解消しますか？\nもし解決するならストレートパーマをかけたいのですが、\nつむじがある場合、立ち上がるのが強過ぎてストレートかけたら尚更立ち上がってしまいますか？\n朝にあまり自分に時間をかけたくないため、ストレートかけるか悩んでます。\n先月美容室行ったばかりだし、まだ産後でなかなか時間が取れないため美容室で質問もできず、もしスレッズでわかる方がいれば…と質問しています。\nよろしくお願いします。", "permalink": "https://www.threads.com/@o_r_i__sa/post/DaHofGUk_Jz", "likes": 2, "velocity": 0.0, "ageHours": 1590.4, "postedAt": "2026-06-28T15:19:24+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3916245030018163288", "username": "hairofseoul_jp", "text": "こちらは非切開植毛（FUE法）で3,200毛を移植し、1年後の経過を撮影したお写真です🌿\n\n元々の髪の流れに合わせ、違和感のない自然なヘアラインに仕上げました✨\n\n非切開は切らない手術のため、ダウンタイムも短く、施術後すぐの日常生活もOK！\n\nまた、出血や痛みも少なく、手術への負担も少ないので安心です😊\n\n負担の少ない非切開植毛で、自然なヘアラインを試してみませんか❓\n\n＃植毛 ＃自毛植毛 ＃薄毛 ＃つむじ ＃韓国アートメイク", "permalink": "https://www.threads.com/@hairofseoul_jp/post/DZZTBsLnyJY", "likes": 2, "velocity": 0.0, "ageHours": 2022.3, "postedAt": "2026-06-10T15:26:50+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3872563938756619916", "username": "akari_scalp_sleep", "text": "9割の人が知らない。髪がペタっとしてボリュームが出ないのは、脳のオーバーヒートが原因", "permalink": "https://www.threads.com/@akari_scalp_sleep/post/DW-HGJzk26M", "likes": 2, "velocity": 0.0, "ageHours": 3468.7, "postedAt": "2026-04-11T09:00:17+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3913273380674089271", "username": "kogao.aya.okayama", "text": "抜け毛が増えてきて、落ち武者感が増してきた。\n\n40代になってから、\n髪のボリュームが減った気がする。\n\n分け目は目立つし、\n鏡を見るたびに悲しい\n\nそれが解決できる唯一の方法が", "permalink": "https://www.threads.com/@kogao.aya.okayama/post/DZOvWgEEjE3", "likes": 2, "velocity": 0.0, "ageHours": 2120.7, "postedAt": "2026-06-06T13:02:41+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3958812231022379451", "username": "usuge_matome", "text": "妊娠中の女性が、パートナーのAGA治療薬に触れてしまったとき。\n慌てなくていい場合と、気をつけたい場合があります。", "permalink": "https://www.threads.com/@usuge_matome/post/Dbwhr_aj4G7", "likes": 2, "velocity": 0.0, "ageHours": 612.7, "postedAt": "2026-08-08T09:00:15+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3974368208588711256", "username": "masa.agabye", "text": "俺はM字ハゲでした\n\n20代後半、「ん？デコ広くなってね？」\nから俺の薄毛人生がスタート。\n\nそこから色々試した。アホみたいに金も使った。\n検索も死ぬほどした。そして普通に遠回りした。\n\n現在はAGA治療5年目。\n\nだからここでは昔の俺が知りたかったことを全部置いていく。\n\nAGAの知識も実際に試した薄毛対策も\n微妙だったものは微妙って言う。\n\n最近、生え際が怪しい。\nでも何すりゃいいか分からん。\n\nそんな奴はついてこい。\n俺が先に失  ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3974294370644091076", "username": "222.sakura.base", "text": "売り車\n\nキューブ\n30mmリフトアップ\nキャリア\nマッドタイヤ＋アルミ\n一時抹消\n無事故\n実走行\n\n静岡発", "permalink": "https://www.threads.com/@222.sakura.base/post/Dcnh6xjE2DE", "likes": 2, "velocity": 0.02, "ageHours": 100.0, "postedAt": "2026-08-29T17:40:30+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3929320680738884976", "username": "withglint_ikumou.aga", "text": "髪は年齢だけが原因で変わるわけではありません。\n\n睡眠不足、ストレス、食生活、頭皮環境など、毎日の積み重ねが髪にも影響を与えることがあります。\n\n「最近なんとなく髪が元気ない」\nそんな小さな変化を感じたら、頭皮ケアを始めるサインかもしれません。\n\n将来も自分の髪で過ごすために、今できるケアを始めませんか？\n\n名古屋・伏見で育毛・頭皮ケアならお気軽にご相談ください🌿\n\n#名古屋育毛 #伏見育毛 #名古屋AGA #伏見AGA #育毛サロン #頭皮改善 #頭皮環境 #抜け毛予防 #薄毛予防 #ボリュームアップ #スカルプケア #ヘッドケア #育毛ケア #髪の悩み #美髪ケア #髪質改善 #名古屋美容 #伏見美容", "permalink": "https://www.threads.com/@withglint_ikumou.aga/post/DaHwFc4CY1w", "likes": 2, "velocity": 0.0, "ageHours": 1589.3, "postedAt": "2026-06-28T16:25:48+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3977035406507839563", "username": "nami.biyou", "text": "40代からの肌はエイジングケアにおいて高い化粧品を使ってるかどうかの差も消えて、毎日の丁寧な洗顔や保湿、紫外線対策を徹底できてるかの差しかない。", "permalink": "https://www.threads.com/@nami.biyou/post/DcxRKGIDRBL", "likes": 2, "velocity": 0.22, "ageHours": 9.3, "postedAt": "2026-09-02T12:26:35+09:00", "genres": ["たるみ・シワ"], "keywords": ["エイジングケア"]}, {"id": "3969066162922909232", "username": "nako_healthybeauty", "text": "3ヶ月でくすみが変わった方法…\nこういうくすみって、美白ケアより先に酸化を止めることが先らしい。ビタミンC（夜）で酸化をブロック→SPF50日焼け止め（朝）で紫外線を防ぐセットでくすみの原因を断ったらまっっっっっっじで肌トーンが上がってきた。これはもうリピ確定。", "permalink": "https://www.threads.com/@nako_healthybeauty/post/DcU9KVrCu4w", "likes": 2, "velocity": 0.01, "ageHours": 273.2, "postedAt": "2026-08-22T12:32:59+09:00", "genres": ["くすみ・美白"], "keywords": ["美白 ケア"]}, {"id": "3903095176169193133", "username": "yobo_chokin", "text": "絶対やめて。\n骨格ウェーブで「痩身エステで夏までに脚やせる」って通い始めた人、ガチでお金捨ててるだけやで。施術後の鏡で「変わった気がする」って思うあれは、3日で全部戻ってしまう一時現象や。理由シンプルで、", "permalink": "https://www.threads.com/@yobo_chokin/post/DYqlGIcGv6t", "likes": 2, "velocity": 0.0, "ageHours": 2457.7, "postedAt": "2026-05-23T12:00:28+09:00", "genres": ["ダイエット・痩身"], "keywords": ["痩身エステ"]}, {"id": "3929339188189885061", "username": "powan_seraphi", "text": "部分痩せ、みなさんはどこが気になる？\n参考に教えていただけると嬉しいです😣🙏\n①ぽっこりお腹\n②足\n③二の腕", "permalink": "https://www.threads.com/@powan_seraphi/post/DaH0SxSFHKF", "likes": 2, "velocity": 0.0, "ageHours": 1588.7, "postedAt": "2026-06-28T17:02:34+09:00", "genres": ["ダイエット・痩身"], "keywords": ["部分痩せ"]}, {"id": "3951201405745864432", "username": "narisann_diet", "text": "「お腹の部分痩せは不可能」とお話ししましたが……\n実は脂肪を効率的に燃やす方法は存在します！\n特に「有酸素運動でお腹の脂肪を効率よく燃やしたい」という方。\nただ走るだけだと、少しもったいないかもしれません……！", "permalink": "https://www.threads.com/@narisann_diet/post/DbVfL6BgZ7w", "likes": 2, "velocity": 0.0, "ageHours": 864.7, "postedAt": "2026-07-28T20:58:54+09:00", "genres": ["ダイエット・痩身"], "keywords": ["部分痩せ"]}, {"id": "3892620879444697970", "username": "reboot_tomo", "text": "ほんの少しえろい話ですが、下腹ぽっこりが取れない人、タンパク質が完全に終わってます🫨ご飯減らしてサラダ多めにしてるのに、なぜか下腹だけ落ちん。脂肪のせいと思ってたら違って、原因はインナーマッスルの萎縮。内臓支える筋肉が落ちて、お腹がぽっこり前に押し出される。鶏むね150g、卵2個、これを毎日積むだけで下腹の出方が変わる。", "permalink": "https://www.threads.com/@reboot_tomo/post/DYFXhDckeNy", "likes": 2, "velocity": 0.0, "ageHours": 2804.5, "postedAt": "2026-05-09T01:09:51+09:00", "genres": ["ダイエット・痩身"], "keywords": ["下腹 ぽっこり"]}, {"id": "3977072041413391764", "username": "shiyawase_diet", "text": "寝る前のたった3分でOK。翌朝の「下腹ぽっこり＆むくみ」がスッキリ消え去る夜の骨格痩せルーティンを教えます。👇", "permalink": "https://www.threads.com/@shiyawase_diet/post/DcxZfNClTWU", "likes": 2, "velocity": 0.25, "ageHours": 8.0, "postedAt": "2026-09-02T13:39:16+09:00", "genres": ["ダイエット・痩身"], "keywords": ["下腹 ぽっこり"]}, {"id": "3935921257890989697", "username": "terry_datsumou", "text": "広島市中区の脱毛サロンです💙\n\n​フェイシャルワックス、まだやったことない人全員に教えたい。\n​うぶ毛と一緒に古い角質もごっそり取れるから、終わった後の肌の「ツヤん！」とした輝きが本当にすごいんです。\nスキンケアの浸透も、翌朝のファンデの密着度も別次元。\n​「自分の肌、こんなにポテンシャル高かったの！？」って感動するはず✨\n\nこんなにごっそり取れます👇", "permalink": "https://www.threads.com/@terry_datsumou/post/DafM4fYgEaB", "likes": 2, "velocity": 0.0, "ageHours": 1370.7, "postedAt": "2026-07-07T18:59:58+09:00", "genres": ["脱毛"], "keywords": ["脱毛 サロン"]}, {"id": "3887763439591052227", "username": "juno_selfesthetic", "text": "メンズの清潔感レベルは「ムダ毛」でわかる\n\n🥉 低い\n処理してない、気にしてない\n→「なんか清潔感ないな」と思われてる\n\n🥈 普通\nカミソリで自己処理してる\n→頑張ってるのに肌荒れで逆効果\n\n🥇 高い↓", "permalink": "https://www.threads.com/@juno_selfesthetic/post/DX0HEADk1PD", "likes": 2, "velocity": 0.0, "ageHours": 2965.4, "postedAt": "2026-05-02T08:18:59+09:00", "genres": ["脱毛"], "keywords": ["自己処理 肌荒れ"]}, {"id": "3966422683960866436", "username": "tatoto_salon", "text": "ヘッドスパ\n頭皮だけほぐしても足りないんです🤭🌿\n実は…", "permalink": "https://www.threads.com/@tatoto_salon/post/DcLkGqCifaE", "likes": 2, "velocity": 0.01, "ageHours": 360.7, "postedAt": "2026-08-18T21:00:51+09:00", "genres": ["エステ・リラクゼーション"], "keywords": ["ヘッドスパ"]}, {"id": "3962523655380491216", "username": "yuko_the_rebirth", "text": "ヘッドスパメニューで\n売上上げようと思っているサロンさんに\nお伝えしておきたいことがあります。", "permalink": "https://www.threads.com/@yuko_the_rebirth/post/Db9tkUtCVvQ", "likes": 2, "velocity": 0.0, "ageHours": 489.8, "postedAt": "2026-08-13T11:54:11+09:00", "genres": ["エステ・リラクゼーション"], "keywords": ["ヘッドスパ"]}, {"id": "3913974030869726607", "username": "efu.ikumou", "text": "育毛鍼で薄毛が改善\n「前髪が透けなくなりました！」\nやったことはたったの2つ！", "permalink": "https://www.threads.com/@efu.ikumou/post/DZROqTaGAWP", "likes": 1, "velocity": 0.0, "ageHours": 2097.5, "postedAt": "2026-06-07T12:14:45+09:00", "genres": ["薄毛", "育毛・頭皮ケア"], "keywords": ["薄毛 対策", "育毛剤"]}, {"id": "3966465529431640204", "username": "trinsachi", "text": "産後の抜け毛、本当に助けてください😭😭\n\n3人目にしてここまでの抜け毛は初めて😭\n想像してた産後の抜け毛レベルを完全に超えて、毎日数百本単位で抜けてます。\nもう本当に絶望してます😭\n\n床も布団も服も、子どものおもちゃも、\n家中どこもかしこも髪の毛だらけ。\n掃除しても掃除しても髪の毛が落ちてて、\n抜け毛を見るたびにイライラするし、メンタルが🥲\n\n生え際もどんどん薄くなってきて、前髪もほぼ消滅して\n鏡を見るたびに泣きそう😭\n\n産後の抜け毛を経験した方、\nいつ頃から落ち着きましたか？ちゃんと元に戻りましたか？😭\n\n「これやったらマシになった！」\n「これ飲んだ・食べた」\n「このシャンプーや育毛剤よかった」\n「何もしなくても○ヶ月で戻った」\n\n本当に何でもいいので教えてほしいです🙏🏻😭\nちゃんと髪が戻るっていう希望が欲しいです🥲\n\n経験談でも改善策でも何でもいいです。\n産後ハゲを経験した方、どうか知恵を貸してください😭🙏🏻\n\n#産後抜け毛 #産後ハゲ #抜け毛 #薄毛 #産後ママ #産後ケア #産後の悩み #育児ママ #ママさんと繋がりたい #先輩ママ教えて #産後抜け毛対策", "permalink": "https://www.threads.com/@trinsachi/post/DcLt2I_msiM", "likes": 1, "velocity": 0.0, "ageHours": 359.3, "postedAt": "2026-08-18T22:25:59+09:00", "genres": ["薄毛", "育毛・頭皮ケア"], "keywords": ["つむじ 薄い", "育毛剤"]}, {"id": "3928401702374209631", "username": "kami_neesan_", "text": "【需要返信】分け目とつむじの薄毛、家でなんとかする方法をまとめてほしいてリクエストが多かったから本気で出すで。まず大前提：女の薄毛は男と根本的に違う。ここ間違えると一生遠回りするで。何がちゃうかっていうとな、", "permalink": "https://www.threads.com/@kami_neesan_/post/DaEfIjlDfhf", "likes": 1, "velocity": 0.0, "ageHours": 1619.7, "postedAt": "2026-06-27T09:59:59+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "つむじ 薄毛"]}, {"id": "3952942593289076435", "username": "o_dai_o_dai", "text": "髪が薄い人って、実は頭皮が悪い😭\nそう思って高級シャンプーや育毛剤を増やしがち。でも、前髪が割れる、つむじが透ける、短く細い毛が増えるなら、頭皮の汚れではなくAGAが進んでいる可能性があります。薄毛治療10年以上の俺も、商品に課金する前にこれを知りたかった。やることは💁こちら", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbbrFhSgb7T", "likes": 1, "velocity": 0.0, "ageHours": 807.1, "postedAt": "2026-07-31T06:38:19+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3883632420122207577", "username": "zero_xxcxx_", "text": "娘のヘアアレンジが難しすぎる😭\nくせ毛+薄毛ちゃん+つむじ後ろで前髪の境目も分からん😂\n\nいつもはちょんまげか後ろで二つ結びとかです、、\nどなたか…不器用にでもできる\n薄毛ちゃんのヘアアレンジ教えてくださーい💦\nもしよければお写真付きだと嬉しいです😭✨", "permalink": "https://www.threads.com/@zero_xxcxx_/post/DXlbxwXkyVZ", "likes": 1, "velocity": 0.0, "ageHours": 3102.2, "postedAt": "2026-04-26T15:31:23+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3932859251756872984", "username": "dr.mackerel", "text": "何回も言うけど、髪のボリュームをだしたいならこれ！", "permalink": "https://www.threads.com/@dr.mackerel/post/DaUUqb8k7UY", "likes": 1, "velocity": 0.0, "ageHours": 1472.1, "postedAt": "2026-07-03T13:36:19+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3973614916657324099", "username": "w_clinic_", "text": "大阪にある美容クリニックです👩‍⚕️\nオーダーメイドであなたに合ったたるみ改善したい方、", "permalink": "https://www.threads.com/@w_clinic_/post/DclHbatjaBD", "likes": 1, "velocity": 0.01, "ageHours": 122.5, "postedAt": "2026-08-28T19:10:32+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["たるみ 改善"]}, {"id": "3924023011686638958", "username": "biyou_sake", "text": "たるみケアの順番\n\n🥉やめとけ\n・高い美顔器から始める（土台ノーケア）\n・顔だけ揉む（頭皮放置で逆戻り）\n・引き上げ塗り（靭帯を痛める）\n\n🥈無難\n・保湿を強化する（土台作りにはなる）\n・日焼け止め徹底（柱を折らせない）\n・表情筋を使う（衰え止め）\n\n🥇ナースが本気で勧める1番目は…", "permalink": "https://www.threads.com/@biyou_sake/post/DZ07iOGCmVu", "likes": 1, "velocity": 0.0, "ageHours": 1764.7, "postedAt": "2026-06-21T09:00:17+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["たるみ 改善"]}, {"id": "3970029865513157880", "username": "hana_scalp_oyama", "text": "【栃木｜スカルプインク取材】\n\nprivate salon HANAは「小山市でスカルプインク専門サロン」として4月にopenいたしました⭐︎\n\nスカルプインクを、まだ知らない方にまず知ってもらいたい。そして、薄毛で悩んでいる方が『自分にもできることがある』と思えるきっかけになれば嬉しいです。\n\n気になる方は、ぜひ公式LINEまたはInstagramからお問合せください。\n\n💎サロン情報💎\nprivate salon HANA（ハナ）\n\nSCALP INK 頭皮タトゥー\n【国際認証ISO9001取得】\n@hana_scalp_oyama\n\n▶小山市八幡町\n（ご予約確定後詳細お送りします）\n*  090-5553-7001\n*  完全予約制\n*  JR小山駅から車で5分\n*  お問い合わせ・ご予約は【公式ライン】or 【お電話】で受付中！\n\n#栃木県薄毛サロン\n#スカルプインク\n#TV取材\n#小山駅 \n#AGA", "permalink": "https://www.threads.com/@hana_scalp_oyama/post/DcYYSDpmoT4", "likes": 1, "velocity": 0.0, "ageHours": 241.2, "postedAt": "2026-08-23T20:27:43+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3968537498436145408", "username": "hana_scalp_oyama", "text": "【栃木｜スカルプインクインクで小顔効果】\n\n「生え際、薄くなった？」\n実はこれ、髪が減っただけじゃない。\n\n生え際の“透け感”を\nスカルプインクで自然にカバー。\n\n近くで見ても不自然にならないように\n極小ドットで仕上げます。\n\n「髪型が決まらない…」\n「おでこが広く見える…」\nそんな悩みに。\n\n生え際が変わると、顔の印象も変わる。\n\n💎サロン情報💎\nprivate salon HANA（ハナ）\n\nSCALP INK 頭皮タトゥー\n【国際認証ISO9001取得】\n@hana_scalp_oyama\n\n▶小山市八幡町\n（ご予約確定後詳細お送りします）\n*  090-5553-7001\n*  完全予約制\n*  JR小山駅から車で5分\n*  お問い合わせ・ご予約は【公式ライン】or 【お電話】で受付中！\n\n#小顔効果\n#栃木薄毛\n#AGA\n#小山駅 \n#スカルプインク", "permalink": "https://www.threads.com/@hana_scalp_oyama/post/DcTE9QgGpEA", "likes": 1, "velocity": 0.0, "ageHours": 290.7, "postedAt": "2026-08-21T19:02:38+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3972775728214834711", "username": "coruli_scalp_ink", "text": "いつもパーマのお客さんが2回続けて、カットとヘッドスパ、なんでかって？スカルプインクで頭皮透けにくくなったから、違うところにメンテナンス☝️タトゥーの技術で毛根をかいてるの（まだ施術中）、パーマお休みした分、髪も薬剤の休憩でき次回しっかり根元から綺麗なパーマあてれるの☝️自然なボリューム感演出、髪型のように印象チェンジ、本サービスは発毛、育毛、治療を目的としたものではありません、タトゥー技術を応用した審美的なデザイン、医療行為ではなく美容目的の施術です。☝️効果には個人差あります☝️ちょっとしたお悩み、ちょっとの勇気でお気軽にカウセリングどうぞ#スカルプインク #天神橋筋六丁目", "permalink": "https://www.threads.com/@coruli_scalp_ink/post/DciInnkif4X", "likes": 1, "velocity": 0.01, "ageHours": 150.3, "postedAt": "2026-08-27T15:23:15+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["発毛"]}, {"id": "3972957522554245862", "username": "calla.esthetic_relaxation", "text": ".\n\n💫HBL(ハリウッドブロウリフト)って？\n\n眉毛の毛流れそのものを整える、日本初の眉癖改善技術。\n\n•自分の眉毛でナチュラルに盛れる\n•細眉・薄眉もふっくら見せる\n•1回で「垢抜けたね」と言われる\n•メイク時間が半分になる\n•顔全体がリフトアップした印象に✨\n\n💡こんな人にこそ試してほしい！\n\n✔︎ 眉の形がいつも決まらない\n✔︎ 左右非対称が気になる\n✔︎ 毎朝メイクが面倒\n✔︎ 自分に似合う眉がわからない\n✔︎ 薄眉・細眉に悩んでいる\n✔︎アートメイクしたままで放置している\n\nご興味のある方は、お気軽にお問い合わせください😊❣️", "permalink": "https://www.threads.com/@calla.esthetic_relaxation/post/Dcix9Evj9Lm", "likes": 1, "velocity": 0.01, "ageHours": 144.3, "postedAt": "2026-08-27T21:24:25+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3974477987953202033", "username": "sbc_jun", "text": "糸リフトでこめかみ上の方から縦に入れて、\nカマキリみたいに不自然にリフトアップするのはアンチエイジング的には不向きです😭\n正しいリフトは、、、", "permalink": "https://www.threads.com/@sbc_jun/post/DcoLqwfj1Nx", "likes": 1, "velocity": 0.01, "ageHours": 93.9, "postedAt": "2026-08-29T23:45:19+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3967848997830335409", "username": "kamomi_rutea", "text": "最近、髪洗ったり乾かしたりしてる時の抜け毛がすごくてつらい🥲前髪が薄く後退してる気がする…。\n産後の抜け毛って、時間が経ったら治るものなのかこのままなの？何かいいヘアケアとかあれば知りたい🥲🥲", "permalink": "https://www.threads.com/@kamomi_rutea/post/DcQoaQWERux", "likes": 1, "velocity": 0.0, "ageHours": 313.5, "postedAt": "2026-08-20T20:14:41+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退", "髪 ボリューム"]}, {"id": "3973348963969364670", "username": "hears.mikami", "text": "いつも有難うございます。\n８月が終わり９月になります。\n９月のお休みカレンダーです。\n９／８日火曜は、TOＰmaster MODEの為臨時休業させて頂きます。２２日２３日の\n祝日も営業します。\nご予約お待ちしております。\n#人も髪も輝き続けるサロンドハーズ出雲、\n#出雲市プレミアム商品券加盟店サロンドハーズ、\n\n#髪質改善出雲市、\n＃カラーパーマ匂いしない店出雲、\n＃hears.jp、\n＃髪の薄毛対策出雲市、\n#上級着付け師出雲、\n\n＃ラ・カスタシステム、\n＃つむじ割れ薄毛ケア、\n＃骨格診断出雲市、\n＃復元フォースカット出雲市、\n＃パーソナルカラー診断出雲市、\n\n＃野草カラー、\n＃くせ毛改善カラー、\n＃髪を健康にするヘアーカラー、\n＃復元ドライヤープロ8販売店、\n#心結び詩人敏、", "permalink": "https://www.threads.com/@hears.mikami/post/DckK9S-D3K-", "likes": 1, "velocity": 0.01, "ageHours": 131.3, "postedAt": "2026-08-28T10:22:08+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3909019245481102830", "username": "emi_sangocare", "text": "現役助産師でも衝撃だった話する。産後3ヶ月のママ友から「抜け毛がすごすぎて排水溝が詰まる」って連絡がきて、夫（産婦人科医）に話したら「それ、止める方法を知らないまま過ごしてるから悪化してるだけだよ」って言われたんだけど、", "permalink": "https://www.threads.com/@emi_sangocare/post/DY_oEr7EQ3u", "likes": 1, "velocity": 0.0, "ageHours": 2261.5, "postedAt": "2026-05-31T16:10:28+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["抜け毛 対策"]}, {"id": "3974737667279696171", "username": "iyasheep.akashi", "text": "頭皮って、押した瞬間に音がしそうなくらい硬い人いるんですよね。\n\nさっきのお客様、こめかみのあたりが本当にカッチカチで、触った瞬間わたしのほうが「うわ」って声出そうになりました。5分ほぐしたら、耳の上がふにゃっと沈んだんです。\n\nその瞬間に寝息。あれが一番うれしいやつなんです。\n\n70分でここまで変わるんやから、頭皮って正直やなあと思いました✨", "permalink": "https://www.threads.com/@iyasheep.akashi/post/DcpGtltkjEr", "likes": 1, "velocity": 0.01, "ageHours": 85.3, "postedAt": "2026-08-30T08:21:20+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3925145149236346734", "username": "kami_neesan_", "text": "つむじの薄さは、本人が一番気づかへん。自分で見えへん後頭部から、更年期の薄毛は始まるんや。美容師に後ろ向きの鏡で「地肌見えてますね」言われた時、ワテ血の気引いた。見るべきは、", "permalink": "https://www.threads.com/@kami_neesan_/post/DZ46reIFH9u", "likes": 1, "velocity": 0.0, "ageHours": 1727.5, "postedAt": "2026-06-22T22:09:50+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3974163225370041081", "username": "mii1030.kyoyuno", "text": "知り合いが今度オリヤン？？（韓国）に行って化粧品や、洗顔等、美容関係を買ってきてくれるらしいのですが\n無知すぎて全くわからず、、、アドバイスください！！\nニキビはできにくいが、顎下やなどにはごくたまにポツポツ白いぶつぶつできる程度で混合肌です。\n毛穴は気になります。全滅して欲しいです。\n\n詳しい方いませんか😌", "permalink": "https://www.threads.com/@mii1030.kyoyuno/post ext": "今回は駅前AGAクリニック岡山院に通院中の患者様にインタビュー🎤しちゃいました💖✨\n\nご協力くださった患者様🥰本当にありがとうございました🙇‍♀️✨\nこれからも私達と一緒に楽しく頑張っていきましょうね✌️✨よろしくお願いします✨\n\n💁‍♀️髪の毛の事でお悩みの方はお一人で悩まず、まずは駅前AGAクリニック岡山院へお気軽にご相談ください😊\n初回カウンセリングは無料ですので、安心してご来院下さいませ💖\nお一人お一人に合った治療をご案内いたします🧑‍⚕️\n\n@ekimae_aga_clinic_okayama .\n#駅前AGAクリニック岡山院\n#美容男子 \n#薄毛治療\n#AGA\n#FAGA\n\n円形脱毛\n女性薄毛\n男性薄毛\n産後脱毛\nメソセラピー", "permalink": "https://www.threads.com/@ekimae_aga_clinic_okayama/post/DcnY3Lgmu04", "likes": 0, "velocity": 0.0, "ageHours": 101.3, "postedAt": "2026-08-29T16:21:24+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3974346177393984670", "username": "mayune_hb", "text": "ええええええええーーーー！！！！！！AGAクリニックの先生！！！！それ言ってええんかwwwww 薄毛気にし始めた旦那が「やっぱ1万円くらいする育毛剤じゃないとダメですか？」って聞いたら、先生がこっそり「いや、メンズベーシックの3,680円の育毛剤でも1万円クラス並みに効果ありますよ」って！！！！旦那から聞いた瞬間「はぁぁぁぁ！？！？！？」って声出たwww その値段差知ったら高い方買えんやろ！！！！", "permalink": "https://www.threads.com/@mayune_hb/post/DcntsqWAASe", "likes": 0, "velocity": 0.0, "ageHours": 98.3, "postedAt": "2026-08-29T19:23:25+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3973972036846605116", "username": "thecellclinic_official", "text": "薄毛の悩みあるけど、AGA治療はしていない方に聞いてみたいです。\n\n治療しない理由って、何ですか？🤔\n\n費用が高い？\n薬を飲み続けることへの抵抗？\n副作用が心配？\nクリニックに行くほどではない？\n何をしたらいいのかわからない？\nそれとも、効果があるのか半信半疑？\n\n「これだったら治療してみたい」もあれば、ぜひ聞いてみたいです。\n\nリアルな本音を教えてください🙏", "permalink": "https://www.threads.com/@thecellclinic_official/post/DcmYoMzk9M8", "likes": 0, "velocity": 0.0, "ageHours": 110.7, "postedAt": "2026-08-29T07:00:04+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3966822263450803124", "username": "efu.ikumou", "text": "「育毛剤の〇〇ップを半年使ったけど全く薄毛が改善しなかった」\n\nそんな人が半年間、eFu式育毛鍼を続けたら、\n\n「髪セットした時に髪の毛がスカスカにならず良い感じになるようになりました✨️」\n\nこんな嬉しいコメントをいただきました😄\n\n何をしたかというと、", "permalink": "https://www.threads.com/@efu.ikumou/post/DcM-9TcGJu0", "likes": 0, "velocity": 0.0, "ageHours": 347.5, "postedAt": "2026-08-19T10:14:45+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["育毛剤"]}, {"id": "3924158423709631025", "username": "kamonohasi.aga", "text": "怖い話。\n育毛剤を1年続けた奴に\n言いにくいことを言う。", "permalink": "https://www.threads.com/@kamonohasi.aga/post/DZ1aUuXkcIx", "likes": 0, "velocity": 0.0, "ageHours": 1760.2, "postedAt": "2026-06-21T13:29:19+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["育毛剤"]}, {"id": "3937975966329069544", "username": "suncy_salon", "text": "「抜け毛が1日何本以上だったら異常ですか？」\n\nよく聞かれる質問です。\n\n正直に言うと、\n本数よりも「抜けた毛の状態」の方が\n大事なことが多いです。", "permalink": "https://www.threads.com/@suncy_salon/post/DamgEbvEd_o", "likes": 0, "velocity": 0.0, "ageHours": 1302.7, "postedAt": "2026-07-10T15:02:51+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["抜け毛 対策"]}, {"id": "3949814384932127005", "username": "kami_neesan_", "text": "夜、美容室の帰りにバス停で信号待ちしとったら、隣に立っとった女性が風でうねりが広がった前髪を気にしながら、鞄から小さいボトルを取り出して指先に少しだけ乗せとってん。何しとるんか気になって見てたら、", "permalink": "https://www.threads.com/@kami_neesan_/post/DbQj0GOm4Ed", "likes": 0, "velocity": 0.0, "ageHours": 910.6, "postedAt": "2026-07-26T23:03:11+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3948949794860951618", "username": "withglint_ikumou.aga", "text": "「最近、抜け毛が増えた気がする…」\n「分け目やつむじが目立ってきたかも。」\n「髪のボリュームが以前より少なくなった気がする。」\n\nそんな変化を感じたら、早めのケアがおすすめです。\n\n当店では、医師監修の育毛成分を使用し、お客様一人ひとりの頭皮状態やお悩みに合わせた施術をご提供しています。\n\n施術前には丁寧なカウンセリングと頭皮チェックを行い、現在の頭皮環境をしっかり確認。一人ひとりに合わせた施術をご提案し、理想の髪を目指してサポートいたします。\n\n完全予約制のため、人目を気にせずリラックスしてお過ごしいただける空間をご用意。育毛サロンが初めての方でも、安心して施術を受けていただけます！\n\n初回体験は5,000円。\n\n「いつか始めよう」ではなく、「気になった今」がケアを始めるタイミングです。\n\n未来の髪のために、あなたに合った育毛ケアを始めてみませんか？✨\n#名古屋育毛 #名古屋育毛サロン #伏見育毛 #伏見育毛サロン #伏見AGA #名古屋AGA #AGA対策", "permalink": "https://www.threads.com/@withglint_ikumou.aga/post/DbNfOp-iehC", "likes": 0, "velocity": 0.0, "ageHours": 939.3, "postedAt": "2026-07-25T18:25:21+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3930886167496140908", "username": "hana_scalp_oyama", "text": "【宇都宮でつむじの薄毛が気になる方】\n\n「分け目が広がってきた…」\n「頭頂部の透け感が気になる…」\nそんなお悩みはありませんか？\n\nスカルプインクは、頭皮に自然な陰影をつくることで、髪が増えたような印象へ導く施術です。\n\n✔ 女性の分け目\n✔ 頭頂部の薄毛\n✔ つむじの透け感\n\n「薬は続けたくない」\n「ウィッグには抵抗がある」\nそんな方にも選ばれています。\n\n当サロンには宇都宮からも多くのお客様にご来店いただいています。\n\nまずはお気軽にDM・LINEからご相談ください😊\n\n#栃木薄毛\n#宇都宮美容\n#宇都宮薄毛\n#つむじハゲ\n#スカルプインク", "permalink": "https://www.threads.com/@hana_scalp_oyama/post/DaNUCSCGqhs", "likes": 0, "velocity": 0.0, "ageHours": 1537.4, "postedAt": "2026-06-30T20:16:09+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3948122023154810064", "username": "o_dai_o_dai", "text": "ちょっとエロい話します｡\n薄毛治療10年以上の俺が気づいたんですけど、抜け毛って一括りにされがちだけど、実はAGAと一時的な脱毛では原因が全然違う｡AGAは前髪やつむじの毛が少しずつ細く短くなるのに対して、休止期脱毛は発熱、強いストレス、急激な減量などの後に、頭全体から急に抜けることがあります｡だから、育毛剤を頑張ってもなかなか変わらない場合は、", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbKjA_gCfzQ", "likes": 0, "velocity": 0.0, "ageHours": 966.7, "postedAt": "2026-07-24T15:00:43+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3915685699513177489", "username": "tachibana_wakahage", "text": "AGAの原因は、\nただの「老化」ではありません。\n\n体内の「5αリダクターゼ」\nという酵素が男性ホルモンと結びつき、\n\n髪の成長期をガクンと\n短くしてしまうのが主なメカニズム\n\nつまり、髪が太く育つ前に\n抜け落ちてしまう状態ということ。\n\nここにストレスや睡眠不足が重なると\nさらに拍車がかかることも。\n\n遺伝の要素もありますが、\n\n日々の生活習慣や適切な頭皮ケアで\nアプローチできることはたくさんあります。\n\n「あれ？」と思ったら、\n早めの対策をするのがおすすめです。", "permalink": "https://www.threads.com/@tachibana_wakahage/post/DZXT2XDj1WR", "likes": 0, "velocity": 0.0, "ageHours": 2040.8, "postedAt": "2026-06-09T20:55:32+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3974727200300699015", "username": "wakistyle_health", "text": "洗面台とかお風呂で髪の毛が落ちてると、\n\n「抜け毛が増えたのかな？」\n\nって気になりますよね。\n\nでも、考えてみれば当たり前なんですけど、\n\n根元から抜けた毛と、途中で切れた毛って同じじゃないんですよね。\n\n気になってる時って、落ちてる髪を見て「抜け毛が増えたのかも」って思うこともありますよね。\n\nまず「何を見て抜け毛が増えたと思ったんだろう？」ってところを、分けて考えた方がよさそうです。", "permalink": "https://www.threads.com/@wakistyle_health/post/DcpEVRlAY2H", "likes": 0, "velocity": 0.0, "ageHours": 85.7, "postedAt": "2026-08-30T08:00:27+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3952302095530101822", "username": "sana_oniku", "text": "夕方のぺたんこ髪が悩みで無印のヘアエッセンスを使ってみたら、ふわっとして良かったです。母も気に入って一緒に愛用中…。皆さんは髪のボリューム対策、何かおすすめありますか？💋", "permalink": "https://www.threads.com/@sana_oniku/post/DbZZdDRGow-", "likes": 0, "velocity": 0.0, "ageHours": 828.3, "postedAt": "2026-07-30T09:25:51+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3972461052822753571", "username": "sukinamo_no713", "text": "40代になって、少しずつ自分を大事にするようになった。\n30代は子育てと仕事で毎日いっぱいいっぱい。自分のことはいつも後回し🥺\nでも40代になって、子どもも少し手が離れて。\n美容やファッション、健康のことを考える時間が久々に楽しくなってきた♡\nちゃんとお手入れしてあげると、\n少しずつだけど自分が磨かれていく感じがして🤏\n髪も肌も、健康でキレイにしておくと\nそれだけで自分の気分が上がるんだよね☺️\n‥とはいえ、私は根っからのズボラ😂\nだから「頑張りすぎずにキレイになれるもの」が好き。\n最近のお気に入りは、リファのブラシ♡\n髪をとかすだけじゃなくて、\n頭皮をほぐすような感覚も気持ちよくて、\n毎日のブラッシングがちょっとした癒しになってる🌿\nこういう「使ってよかった♡」を\n愛用品や気になっているものは楽天ROOMにまとめています🫶\n気になるものがあれば、ROOMから見てみてください♡\n\n#40代主婦 #40代美容 #40代自分磨き #ズボラ美容 #美容好き #大人美容 #ヘアケア #美髪ケア #楽天ROOM #楽天アフィリエイト\nhttps://a.r10.to/hPCif6", "permalink": "https://www.threads.com/@sukinamo_no713/post/DchBEfRkxEj", "likes": 0, "velocity": 0.0, "ageHours": 160.7, "postedAt": "2026-08-27T04:58:01+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3937437301413544226", "username": "kami_neesan_", "text": "ショックで言葉が出なかった。「更年期の抜け毛は歳のせいやから仕方ない」って思って、特に対策せず諦めてた。鏡を見るたび気が重いし、抜け毛の量にもため息つくし。たまたまスポーツトレーナーをしてる友人に会う機会があって話したら、言われたのがまさかの一言で、", "permalink": "https://www.threads.com/@kami_neesan_/post/Dakll08IIEi", "likes": 0, "velocity": 0.0, "ageHours": 1320.5, "postedAt": "2026-07-09T21:12:11+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["抜け毛 対策"]}, {"id": "3867729936462713345", "username": "esthetics911_yokohama", "text": "当サロンは2回目からは決まった間隔でご来店頂き\n改善させるためにコースで通って頂いておりますが、\n年齢に合わせたケアをしております。\nこの方はたるみが気になるということで\nドライヘットスパと高周波でCETとRETでケア。\n10分で引き上がりました。血色も良くなります。", "permalink": "https://www.threads.com/@esthetics911_yokohama/post/DWs7-KWARIB", "likes": 0, "velocity": 0.0, "ageHours": 3628.8, "postedAt": "2026-04-04T16:55:59+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["たるみ 改善"]}, {"id": "3935784638279002401", "username": "mizuki.c5", "text": "インナードライ混合肌(鼻、頬にテカリ)\n赤み\nニキビ\n毛穴\n\nこの悩みを伝えてチャッピーにスキンケアのアドバイス出してもらったら「乳液をこれに変えてみて！」って言われて試して1週間。\nとりあえず1ヶ月は様子見るけどどうなんだろう？\n美容に詳しい方ならどうすか教えてほしい！", "permalink": "https://www.threads.com/@mizuki.c5/post/Daet0adDykh", "likes": 0, "velocity": 0.0, "ageHours": 1375.2, "postedAt": "2026-07-07T14:28:32+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["毛穴 ケア"]}, {"id": "3963554961752606702", "username": "watanabeseitai", "text": "「睡眠時間は足りているのに、疲れやだるさが抜けない…」\n\nその不調、骨格や筋肉の問題ではなく【体質・栄養・ホルモンバランス】といった身体の内側に原因があるかもしれません。\n当院では手技による施術にとどまらず、身体の内側からもお悩みを解決できるよう、スマホで医師に相談できる「シェアクリニック東京」と提携を開始しました。\n・ダイエットの成果が出にくい\n・髪のボリュームや肌荒れが気になる\n・理由のない体の重さやホルモンの乱れ", "permalink": "https://www.threads.com/@watanabeseitai/post/DcBYDznAEfu", "likes": 0, "velocity": 0.0, "ageHours": 455.6, "postedAt": "2026-08-14T22:03:12+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3973737421598208889", "username": "coruli_scalp_ink", "text": "４０代女性スカルプインク1回目7日後グレイカラーでご来店、頭皮上空✈️髪質硬め毛量多め　動機理由→毎日同じ分け目だったのでその分け目が薄毛に見える　良く質問されますがスカルプインク施術後1週間後くらい←個人差ありますがヘアカラー可能です😊なのでそんなにカラータイミングご心配ないですよ☝️本施術は医療行為ではありません。本サービスは発毛、育毛、治療を目的としたものではありません、自然なボリューム感を演出、髪型のように印象チェンジ、タトゥー技術を応用した審美的なデザイン、医療行為ではなく美容目的の施術です、☝️効果には個人差あります#スカルプインク #大阪市北区", "permalink": "https://www.threads.com/@coruli_scalp_ink/post/DcljSGVCbN5", "likes": 0, "velocity": 0.0, "ageHours": 118.5, "postedAt": "2026-08-28T23:13:58+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["発毛"]}, {"id": "3975126110640642687", "username": "mio__beauty__", "text": "私42歳で白髪が一本もないんだだけど、これを使ってきたのが大きいと思ってる。紗栄子さんやMEGUMIさんも愛用ってバズってたケンザン。美髪と小顔だけじゃない。頭皮ケアって、日々の少しずつの積み重ねが未来の自分を変えると思ってる。", "permalink": "https://www.threads.com/@mio__beauty__/post/DcqfCLyHZp_", "likes": 0, "velocity": 0.0, "ageHours": 72.5, "postedAt": "2026-08-30T21:13:01+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["小顔"]}, {"id": "3974999694250814129", "username": "retreathari", "text": "むくみ顔とお別れ！10年前の自分に戻る魔法のリフトアップ術\n\n毎日鏡を見るたびに、「なんだか顔がすっきりしない」「朝のむくみが夕方になっても取れない」と感じていま…...\n\nhttps://sns.retreathari.jp/%e3%82%80%e3%81%8f%e3%81%bf%e9%a1%94%e3%81%a8%e3%81%8a%e5%88%a5%e3%82%8c%ef%bc%8110%e5%b9%b4%e5%89%8d%e3%81%ae%e8%87%aa%e5%88%86%e3%81%ab%e6%88%bb%e3%82%8b%e9%ad%94%e6%b3%95%e3%81%ae%e3%83%aa%e3%83%95/", "permalink": "https://www.threads.com/@retreathari/post/DcqCSlWGyqx", "likes": 0, "velocity": 0.0, "ageHours": 76.7, "postedAt": "2026-08-30T17:02:03+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["小顔"]}, {"id": "3975116903043769015", "username": "kyon1228.har", "text": "みんな「ぶす」「ばばあ」と言われた事件が1年半前におこったんだけど、(意味わからなくてOK)\nその時、ある人をマスク外しても「綺麗」とみんなが言ったそのある人。\nわたしすっごい期待していたんだけど、\n外した瞬間唖然としたわ！\n鼻が顔から飛び出すデカさだし、口元飛び出し半開きの口ゴボだし、顎がない。ほうれい線やばくない？\nなにそれ！わざとみんな言ったん？\nだって、どこをどう見たら「綺麗」なのよ？\nあーびっくり！あーがっかり！", "permalink": "https://www.threads.com/@kyon1228.har/post/Dcqc8MikyK3", "likes": 0, "velocity": 0.0, "ageHours": 72.8, "postedAt": "2026-08-30T20:54:43+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["ほうれい線"]}, {"id": "3975421621938587376", "username": "ikuta2323", "text": "2年前まではAGAガイドラインでも推奨度Aのミノキシジル外用（塗りミノ）を使っていました！ \n\n 内服薬のフィナステリドとミノキシジルの副作用が怖い人には良い選択肢ですよね！ \n\nただし、発毛剤の説明書や注意書きにもあるように、半年以上継続しても効果を実感できない場合は、他の薄毛対策への切り替えも検討ですね😅", "permalink": "https://www.threads.com/@ikuta2323/post/DcriOcIDobw", "likes": 0, "velocity": 0.0, "ageHours": 62.7, "postedAt": "2026-08-31T07:00:08+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3975408092028596757", "username": "scalp.ink.rui.osaka.city", "text": "はじめまして✨\n大阪市生野区「今里」ディープな街…🌇\n看護師による安心安全な施術を🪄\n\n頭皮タトゥー🆗治療ではない魅せる技術✨\n\n薄毛、傷痕、円形脱毛症などなど…頭皮タトゥーでお悩み軽減できます！\n\n失敗ないスカルプインク最高ですよっ！！\n\n眉毛、アイラインタトゥーも🆗✨症例たくさんあるので良かったら覗いてください✨\n\nたぶん今里近隣では当店だけ！！\n当日も空きあれば🉑夜も可能🉑夜得🉐\n特に夜は比較的ご案内しやすいです✨\nぜひご縁がありますように✨\n@scalp.ink.rui.osaka.city \n症例もあり！無料カウンセリングも\nあります✨ぜひフォローよろしく\nお願いします🤲", "permalink": "https://www.threads.com/@scalp.ink.rui.osaka.city/post/DcrfJjak_IV", "likes": 0, "velocity": 0.0, "ageHours": 63.1, "postedAt": "2026-08-31T06:33:16+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3975391820032938688", "username": "o_dai_o_dai", "text": "もう言い切るよ。\nAGAは、抜け毛が増えてから始まるとは限らない。\nそれより先に見てほしい場所が、頭に3か所ある、、", "permalink": "https://www.threads.com/@o_dai_o_dai/post/Dcrbcw8DpLA", "likes": 0, "velocity": 0.0, "ageHours": 63.7, "postedAt": "2026-08-31T06:00:56+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3976161912878334791", "username": "hachi_aga_hair8", "text": "見た目に金使って\n「これは早くやればよかった…」と思ったものありますか？\n\nAGA治療でも、脱毛でも、歯でも、筋トレでもいい。\n\n皆さんのリアルな後悔を教えてください！\n（男女関係なくお待ちしてます！）", "permalink": "https://www.threads.com/@hachi_aga_hair8/post/DcuKjFyjQNH", "likes": 0, "velocity": 0.0, "ageHours": 38.2, "postedAt": "2026-09-01T07:30:58+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3976160448343967963", "username": "isseh89", "text": "薄毛って突き詰めると、\nAGA治療しかないんでしょうか？\n\n一生薬を飲み続けるって考えると、\n正直ちょっと躊躇します。\n\nあと初期脱毛。\n\n一時的なものだとしても、\n今より薄くなるのは普通に怖いです。\n\n実際に治療してる人って、\nこのへんどうやって決断したんだろう。\n\n薬を続けること。\n初期脱毛のこと。\n副作用のこと。\n\n不安はあったと思うんですが、\nそれでも治療しようと思った決め手って何でしたか？\n\nなかなか人には言いにくい話だと思いますが、\n実際に治療してる方がいたら、\nぜひ聞いてみたいです。", "permalink": "https://www.threads.com/@isseh89/post/DcuKNx1gAjb", "likes": 0, "velocity": 0.0, "ageHours": 38.2, "postedAt": "2026-09-01T07:28:03+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3976140917686089871", "username": "tenka.hageme", "text": "AGA13日目", "permalink": "https://www.threads.com/@tenka.hageme/post/DcuFxkfkziP", "likes": 0, "velocity": 0.0, "ageHours": 38.9, "postedAt": "2026-09-01T06:49:15+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3958330137746853093", "username": "h.rkaua", "text": "生後3ヶ月👶🏼の頭皮、乾燥がすごい😂😂\nフケがぽろぽろ…\n頭皮ってクリーム塗りずらいし何を使えば？！？！💦", "permalink": "https://www.threads.com/@h.rkaua/post/Dbu0EnEH8zl", "likes": 0, "velocity": 0.0, "ageHours": 628.7, "postedAt": "2026-08-07T17:02:25+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3976167686396933617", "username": "kami_neesan_", "text": "40代の頭皮ケアで、無駄やと気づいたこと。無駄な方から書くわ↓", "permalink": "https://www.threads.com/@kami_neesan_/post/DcuL3GzE3Xx", "likes": 0, "velocity": 0.0, "ageHours": 38.0, "postedAt": "2026-09-01T07:42:30+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3976182147417584323", "username": "life.curate", "text": "秋になると頭皮の固さや抜け毛が気になりませんか？夏の疲れを残さないために試した2,000円台からのスカルプブラシ3選を比べてみました！\n\nゴリゴリほぐしたい派か、シャンプーで優しく使いたい派かで選び方が変わる気がします。気になる方はチェックしてみてくださいね�\n【記事URL】\n\n#スカルプブラシ #頭皮マッサージ #ヘアケア好き #おうちヘッドスパ #美髪ケア\n\n� https://biyo-navi.jp/articles/5eeab1a8-489c-44ec-86d0-caf5d60009cc", "permalink": "https://www.threads.com/@life.curate/post/DcuPJirEzLD", "likes": 0, "velocity": 0.0, "ageHours": 37.5, "postedAt": "2026-09-01T08:11:10+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3976146865485962051", "username": "mio_touhi_lab", "text": "勘違いしないでください。\n頭皮の匂い、体質のせいにされて終わってない、、、？", "permalink": "https://www.threads.com/@mio_touhi_lab/post/DcuHIH0EttD", "likes": 0, "velocity": 0.0, "ageHours": 38.7, "postedAt": "2026-09-01T07:01:07+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3974682082190534521", "username": "kinakonochichi", "text": "【PR】今週の楽天ROOMでは、ペット用品への反応が比較的安定していました。\n\nドッグステップ、抜け毛対策のグルーミング掃除機、循環式給水器がそれぞれ4いいね。暮らしの負担を減らす道具への関心が見えた一週間でした。\n\nなかでもMooSoo LM2は、抜け毛を吸い込みながらブラッシングやお手入れができるタイプ。ペットが音や吸引を怖がらないか、対応する毛質、刃のお手入れは購入前にご確認ください。未使用のため使い心地は要確認です。\n\n次に見たいのは「お手入れ」「給餌・給水」「省スペース家具」のどれですか？\n\n楽天ROOMはこちら👇\nhttps://room.rakuten.co.jp/room_76f5739083/1700390246459221\n\n#楽天ROOM #ペット用品 #犬猫との暮らし", "permalink": "https://www.threads.com/@kinakonochichi/post/Dco6EuEE6d5", "likes": 0, "velocity": 0.0, "ageHours": 87.2, "postedAt": "2026-08-30T06:30:48+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["抜け毛 対策"]}, {"id": "3975599605215910498", "username": "miki.cosme.0222", "text": "40代のほうれい線ケア、これ使えぇぇ‼️‼️\n軽い気持ちで買ってみたら明らかに印象変わったし、今では使わないと不安になるくらい愛用してる", "permalink": "https://www.threads.com/@miki.cosme.0222/post/DcsKsb-E9pi", "likes": 0, "velocity": 0.0, "ageHours": 56.8, "postedAt": "2026-08-31T12:53:46+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["ほうれい線"]}, {"id": "3976557411746561353", "username": "hiro.hatumou.fukuoka", "text": "薄毛の方に多い、首の硬さチェック。\n\n上を向いてください。\n天井、しっかり見えますか。\n\n見えにくい。つっぱる。\nそういう方は硬くなってます。\n\n首の後ろには、頭へ向かう血管が通ってます。\nここが硬いと、届く量が変わります。", "permalink": "https://www.threads.com/@hiro.hatumou.fukuoka/post/DcvkeW0Gb1J", "likes": 0, "velocity": 0.0, "ageHours": 25.1, "postedAt": "2026-09-01T20:36:48+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3976535514911684215", "username": "0520hair", "text": "【AGA治療で絶対に薬を使いたくない】\n育毛鍼による症例\n\n今回の症例は、「フィナステリドやデュタステリドなどのAGA治療薬はもちろんのこと、ミノキシジルの塗り薬でさえも絶対に使いたくない。育毛鍼が効かなければもう諦めます」という強い覚悟を持って来院された患者様です。\n\n施術を重ねるうちに比較的早い段階で「髪にハリが出てきた」と変化を実感され、数ヶ月が経つ頃には、最初にご本人が気にされていた「髪が伸びてこない」という違和感も消失。現在ではご自宅での薄毛チェックや、定期的な写真比較でも明らかな改善が見られ、大変喜んでいただいております。\n\n現在もより良い状態を目指して経過観察中です。\n\n当院では、患者様一人ひとりのお悩みに合わせ、最適な育毛プランをご提案しております。\n\n ［育毛鍼を主体としたプラン］\n ［他の治療と組み合わせた補助的なプラン］\nなど、幅広くご提案可能です。", "permalink": "https://www.threads.com/@0520hair/post/DcvfftzCTZ3", "likes": 0, "velocity": 0.0, "ageHours": 25.8, "postedAt": "2026-09-01T19:54:22+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策", "AGA"]}, {"id": "3849750779687740743", "username": "wellbeing_headspa.by_miyu", "text": "60代以降、どんどん髪の毛のボリューム\nダウンに悩む方も増える年齢に\n\n原因は一つではなくて、、\n\nまずは１つ\n\n頭皮環境の悪化（土壌の問題）\n植物と同じで、土壌（頭皮）が荒れていると\n元気な髪は育ちません。\n\nモニター1ヶ月の変化", "permalink": "https://www.threads.com/@wellbeing_headspa.by_miyu/post/DVtD-_xEiVH", "likes": 0, "velocity": 0.0, "ageHours": 4224.1, "postedAt": "2026-03-10T21:34:37+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3900480210487959171", "username": "bibi.scalp_ink", "text": ".\nスカルプインク認定アーティストBiBiです\n薄毛・つむじ・分け目・傷跡の悩みを解決します\n⭐︎麻酔不要\n⭐︎痛みほぼなし\n⭐︎つむじ分け目カバー\n⭐︎ヘアーライン施術により小顔仕上げ効果\n⭐︎即日効果\n\nスカルプインクとは\n麻酔を使用せず頭皮の浅い層にインクをのせ\n定着させていく美容を目的とした\n頭皮カバー技法です\nダウンタイムもなく当日から\nシャンプーも可能です\n地肌の透け感をカバー薄毛のお悩みを\n軽減するだけでなく生際ラインに\nグラデーションを入れる事で\n視覚的な小顔効果や\nおでこのコンプレックスも\n軽減できます\n\n『通常価格一発1.3円』がいまなら\n初回モニターキャンペーン中\n初回3万発29800円\n次回ご予約頂いた\nお客様に限り\n一発1円で\nご提供できます\n\nお気軽にご相談下さい\nカウセリング無料\n\n※本サービスは医療行為ではありません\n※治療目的の施術ではありません\n※効果・仕上がりは個人差があります\n\n福岡県北九州市八幡西区穴生２丁目2-2-8\nお問い合わせは  インスタDM\nお電話で090-1099-0357\n\n#美容\n#薄毛\n#八幡西区\n#北九州\n#頭皮", "permalink": "https://www.threads.com/@bibi.scalp_ink/post/DYhShX3k16D", "likes": 0, "velocity": 0.0, "ageHours": 2544.3, "postedAt": "2026-05-19T21:24:59+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3976478628330131220", "username": "oyausuge", "text": "AGAクリニックで\n「薄毛改善鍼って意味あるんですか？」\nと聞かれた患者さんが、\n\nうちに来られたことがあります\n\n正直にお伝えしたのは、", "permalink": "https://www.threads.com/@oyausuge/post/DcvSj6CjM8U", "likes": 0, "velocity": 0.0, "ageHours": 27.7, "postedAt": "2026-09-01T18:00:13+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3944377351336943169", "username": "ol_rin_cosme_", "text": "この画像は、母の10ヶ月の変化です。\n薄毛、抜け毛が気になるってずっと言ってて、何かいいケアないかなと一緒に探してた。\n\nハーグ治療に170万円以上、育毛剤も数え切れないほど試して、それでも「何か違う」って感じながらお金と時間を使い続けてたみたい。\n\n何が違っていたかというと、1/2", "permalink": "https://www.threads.com/@ol_rin_cosme_/post/Da9Pk2GiN5B", "likes": 0, "velocity": 0.0, "ageHours": 1090.7, "postedAt": "2026-07-19T11:00:43+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["育毛剤"]}, {"id": "3976467964371369104", "username": "marsmars_50", "text": "この方に育毛剤っていりますか？\nさすがに、顔部分は「マスク」ってことはないでしょう…。", "permalink": "https://www.threads.com/@marsmars_50/post/DcvQIudE3yQ", "likes": 0, "velocity": 0.0, "ageHours": 28.0, "postedAt": "2026-09-01T17:39:02+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["育毛剤"]}, {"id": "3976539033748231514", "username": "ikumou_kobe", "text": "9月、髪や頭皮のケアで新しく始めたいことはありますか？", "permalink": "https://www.threads.com/@ikumou_kobe/post/DcvgS6-CdVa", "likes": 0, "velocity": 0.0, "ageHours": 25.7, "postedAt": "2026-09-01T20:00:14+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3976554015257477391", "username": "akari_scalp_sleep", "text": "ストレスで髪が抜ける、という言い方、正直ざっくりしすぎです。ストレスと抜け毛の間には、少なくとも3つの段階が挟まっています。ここを飛ばしたまま、ストレスをなくしましょうと言われても、何をすればいいのか分からないと思います。順番に書きます↓", "permalink": "https://www.threads.com/@akari_scalp_sleep/post/Dcvjs7lk0EP", "likes": 0, "velocity": 0.0, "ageHours": 25.2, "postedAt": "2026-09-01T20:30:03+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["抜け毛 対策"]}, {"id": "3936314111193898609", "username": "eriko.healingsora89", "text": "若よもぎ蒸しを試したお客様の「頭皮」に、驚きの変化が起きました。", "permalink": "https://www.threads.com/@eriko.healingsora89/post/DagmNQiEd5x", "likes": 0, "velocity": 0.0, "ageHours": 1357.7, "postedAt": "2026-07-08T08:00:30+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["発毛"]}, {"id": "3928576367487748957", "username": "fusafusa_gingin", "text": "残酷だが、リアップなどの市販発毛剤だけに頼ってるハゲは絶対に望んでいるような改善は得られない。理由は明確で、", "permalink": "https://www.threads.com/@fusafusa_gingin/post/DaFG2RJGgtd", "likes": 0, "velocity": 0.0, "ageHours": 1613.9, "postedAt": "2026-06-27T15:46:59+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["発毛"]}, {"id": "3976448963511978140", "username": "verano.beautysalon", "text": "「普通のヘッドスパじゃ物足りない…」\nそんなヘッドスパ好きさんへ。\n\nインディバヘッドは、頭皮をじんわり温めながら巡りをサポートし、硬くなりやすい頭皮をやわらかく整えるケア。\n\n元美容師＋整体師として培った技術を活かし、頭だけで終わらずデコルテ・首・肩までしっかり施術します。\n\n健やかな髪を育てるには、まず土台となる頭皮環境から。\n\n抜け毛やハリ・コシ不足、頭皮の硬さが気になる方にもおすすめです。\n※発毛を保証する施術ではありません。\n\n【インディバヘッドスパ】\nオプション30分 ￥5,770\n単品45分 ￥8,660 → 初回￥6,000\n\nご予約・お問い合わせはLINEから。\n\n#インディバヘッド\n#頭皮ケア\n#ヘッドスパ\n#光市エステ\n#Verano", "permalink": "https://www.threads.com/@verano.beautysalon/post/DcvL0Ohmgic", "likes": 0, "velocity": 0.0, "ageHours": 28.7, "postedAt": "2026-09-01T17:01:18+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["発毛"]}, {"id": "3950895490678349083", "username": "koki.wanope.kurashi", "text": "無印の新作「トゲトゲ」はヤバいやつです…\n美容師さんも大絶賛してるヘアブラシ、夏の頭皮の脂にはかなり効果的って言ってて、使ってみたらさぁ", "permalink": "https://www.threads.com/@koki.wanope.kurashi/post/DbUZoQak10b", "likes": 0, "velocity": 0.0, "ageHours": 874.8, "postedAt": "2026-07-28T10:51:06+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3976527897435417785", "username": "moon_pooa", "text": "白髪や抜け毛の悩みを放置するのは危険。早めの頭皮ケアで健やかな髪を目指すのが大切なポイント。Threadsで話題を集める『無印良品』の頭皮用ローションが、", "permalink": "https://www.threads.com/@moon_pooa/post/Dcvdw3eEay5", "likes": 0, "velocity": 0.0, "ageHours": 26.1, "postedAt": "2026-09-01T19:38:10+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3972962670172806092", "username": "mina_life_beauty", "text": "顔のたるみが気になる更年期世代は、小田切ヒロがテレビで紹介してた側頭筋の頭皮マッサージを毎日やって。何より継続することが大事なこのマッサージを手軽に続けるコツが、", "permalink": "https://www.threads.com/@mina_life_beauty/post/DcizH-1iZvM", "likes": 0, "velocity": 0.0, "ageHours": 144.1, "postedAt": "2026-08-27T21:34:39+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3967843535387903256", "username": "suncy_salon", "text": "批判覚悟で言います。\n\n自己流の頭皮マッサージ、\n今すぐやめてください。", "permalink": "https://www.threads.com/@suncy_salon/post/DcQnKxDIEUY", "likes": 0, "velocity": 0.0, "ageHours": 313.6, "postedAt": "2026-08-20T20:04:23+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3976566990529600164", "username": "enbano88", "text": "小顔にしたいからと\n肌の見える面積を狭めても\n小顔には見えません\nただ顔を隠している人です\n他人からは正面以外から見られることが多く\n２メートルくらい離れてバランスが良い\nイメージを持つことが大切だと思います", "permalink": "https://www.threads.com/@enbano88/post/DcvmpvwD5qk", "likes": 0, "velocity": 0.0, "ageHours": 24.8, "postedAt": "2026-09-01T20:55:47+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["小顔"]}, {"id": "3976565438712843164", "username": "liftup.salon_anew", "text": "50代以上のお客さんの大半が目の下のたるみに悩んでいます。\n私もありますが、2年前に比べてだいぶ良くなりました。\n\n高い美容液やクリームなんか使っていません。\nまずは夜な夜なスマホを半時間も見てしまう習慣があるなら今すぐやめてください。\n十分な睡眠と眼球を動かすことが何よりも大事です。", "permalink": "https://www.threads.com/@liftup.salon_anew/post/DcvmTKgkwuc", "likes": 0, "velocity": 0.0, "ageHours": 24.8, "postedAt": "2026-09-01T20:52:42+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["たるみ 改善"]}, {"id": "3976567479485389128", "username": "tsuki_biyou_", "text": "美容医療、何から始めたら良いか分からない30代はとりあえずこれ参考にして⤵︎\n\n・毛穴、角栓、皮脂→ハイドラフェイシャル/マッサージピール\n・シミ、そばかす、くすみ→ピコトーニング/IPL(光治療)\n・小じわ、乾燥、くすみ→水光注射/肌育注射\n・ニキビ跡、クレーター→ポテンツァ/サブシジョン\n・たるみ→ハイフ/RF(高周波)\n\nどれも比較的ダウンタイム少なくて始めやすい。\nただ注意点があって、", "permalink": "https://www.threads.com/@tsuki_biyou_/post/Dcvmw3IGNlI", "likes": 0, "velocity": 0.0, "ageHours": 24.8, "postedAt": "2026-09-01T20:56:45+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["たるみ 改善"]}, {"id": "3976534249892885424", "username": "terassinaterassina", "text": "「美容医療には抵抗がある・・・」\n「高額な化粧品を使ってるけどいまいち効果が・・・」\n「健康的に自然なリフトアップがしたい！」\n\nそんな方へ美容医療に頼らないたるみ改善を行ってます。\n\n兵庫県神戸市\n三ノ宮各駅から徒歩7分\nたるみ・しわ専門サロンＴｒａｓｓｉｎａ", "permalink": "https://www.threads.com/@terassinaterassina/post/DcvfNTqCjOw", "likes": 0, "velocity": 0.0, "ageHours": 25.8, "postedAt": "2026-09-01T19:51:10+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["たるみ 改善"]}, {"id": "3976578606629674420", "username": "momoco_salon", "text": "ほうれい線を薄くしたいならマッサージやめて、ここを1分ゆるめて。", "permalink": "https://www.threads.com/@momoco_salon/post/DcvpSyFlF20", "likes": 0, "velocity": 0.0, "ageHours": 24.4, "postedAt": "2026-09-01T21:18:52+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["ほうれい線"]}, {"id": "3976543531729501929", "username": "zakuro_skincare", "text": "40代で肌悩みが急に増えたん、あれ歳のせいやのうて原因が若い頃と全部入れ替わっとるけんよ。\n毛穴・くすみ・ほうれい線・シミが“同時多発”するのが40代やけん、片っぱしから攻めても空回りするとやけど、", "permalink": "https://www.threads.com/@zakuro_skincare/post/DcvhUYCnT7p", "likes": 0, "velocity": 0.0, "ageHours": 25.5, "postedAt": "2026-09-01T20:09:15+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["ほうれい線"]}, {"id": "3976533190470939923", "username": "dr.ryu_itohyalu", "text": "【施術名】\n糸リフト\n\n【施術内容】\n医療用の糸を皮下に挿入し、組織を物理的に牽引することで、フェイスラインなどの形態を整える施術です。\n\n【施術料金】\n8本　240,000円（税込）\n※使用する糸の種類・本数により料金が異なります。\n\n【主なリスク・副作用】\n腫れ、むくみ、内出血、疼痛、圧痛、ひきつれ、凹凸、左右差、違和感、感染、糸の露出・突出、神経障害、血管損傷などが生じる可能性があります。\n\n【経過】\n施術直後\n※効果や経過には個人差があります。\n※自由診療となります。", "permalink": "https://www.threads.com/@dr.ryu_itohyalu/post/Dcve94_kjUT", "likes": 0, "velocity": 0.0, "ageHours": 25.9, "postedAt": "2026-09-01T19:48:38+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3976569809671930474", "username": "mtsalon_kamitori", "text": "40代50代の方が毛穴洗浄するとね☝️\n\n・くすみ感が減る\n・肌に艶が出る\n・顔色が明るく見える\n・ファンデのヨレが変わる\n・乾燥でしぼんだ感じがうるおう\n・毛穴が目立ちにくくなる\n・超音波でリフトアップ⤴︎\n・『最近なんか綺麗になったね☺️』\n　と言われる✨\n\n40代、50代の毛穴悩みって\n乾燥・たるみ・ごわつきも関係してるんです。\n洗浄でキメを整えてツルツル肌になれますよ！", "permalink": "https://www.threads.com/@mtsalon_kamitori/post/DcvnSxSCcJq", "likes": 0, "velocity": 0.0, "ageHours": 24.7, "postedAt": "2026-09-01T21:01:23+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3930824999813270986 <script>
(function () {
  var readJSON = function (id) { return JSON.parse(document.getElementById(id).textContent); };
  var POSTS = readJSON('data');
  var GENRES = readJSON('genre-list');
  var KEYWORDS = readJSON('keyword-list');
  var SUMMARY = readJSON('summary-data');
  var RISING = 0.92;   // 伸び率の上位10%にあたる値

  var activeGenres = new Set();
  var els = {
    sort: document.getElementById('sort'),
    period: document.getElementById('period'),
    keyword: document.getElementById('keyword'),
    q: document.getElementById('q'),
    genres: document.getElementById('genres'),
    list: document.getElementById('list'),
    count: document.getElementById('count'),
    summary: document.getElementById('summary'),
    breakdown: document.getElementById('breakdown')
  };

  function mk(tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  // 文節を1かたまりとして置く。途中で改行されないので、
  // 「を」「と」などの助詞が行頭に来ることがなくなる。
  function phrases(parent, list) {
    list.forEach(function (t) { parent.appendChild(mk('span', 'nb', t)); });
    return parent;
  }

  // --- 集計 ---
  // タイルは必ず4枚。ジャンルはここに混ぜず、下の棒グラフで見せる。
  (function renderSummary() {
    var tiles = [
      ['表示中の投稿', SUMMARY.total, '件'],
      ['直近7日の投稿', SUMMARY.thisWeek, '件'],
      ['1000いいね超え', SUMMARY.over1000, '件'],
      ['投稿者', SUMMARY.authors, '人']
    ];
    tiles.forEach(function (t) {
      var box = mk('div', 'stat');
      box.appendChild(mk('span', 'stat-label', t[0]));
      var v = mk('div', 'stat-value', t[1].toLocaleString());
      v.appendChild(mk('span', 'unit', t[2]));
      box.appendChild(v);
      els.summary.appendChild(box);
    });
  })();

  // --- ジャンル別の内訳 ---
  // 棒の長さは最多ジャンルを100%とした相対値。1つの投稿が複数ジャンルに
  // 入ることがあり、合計が総数と一致しないため、全体に対する割合としては見せない。
  (function renderBreakdown() {
    if (!SUMMARY.genres.length) { els.breakdown.remove(); return; }

    els.breakdown.appendChild(mk('p', 'breakdown-title', 'ジャンル別'));
    var max = SUMMARY.genres.reduce(function (m, p) { return Math.max(m, p[1]); }, 0);

    // 長いジャンル名は固定幅の列に1行では収まらない。
    // 「・」の位置だけで折り、カタカナ語の途中では絶対に割らない。
    function nameParts(name) {
      var parts = name.split('・');
      return parts.map(function (t, i) {
        // 「・」は前の語にくっつける。行頭に落とさないため
        return i < parts.length - 1 ? t + '・' : t;
      });
    }

    SUMMARY.genres.forEach(function (pair) {
      var row = mk('div', 'bar-row');
      if (pair[1] === 0) row.classList.add('pending');
      row.appendChild(phrases(mk('span', 'bar-name'), nameParts(pair[0])));

      var track = mk('div', 'bar-track');
      var fill = mk('div', 'bar-fill');
      fill.style.width = (max > 0 ? (pair[1] / max) * 100 : 0) + '%';
      track.appendChild(fill);
      row.appendChild(track);

      // 数字は出さない。棒の長さで強弱は足りる。
      // まだ集まっていないものだけ、空の棒の理由が分かるよう言葉を添える
      row.appendChild(mk('span', 'bar-count', pair[1] === 0 ? '収集待ち' : ''));
      els.breakdown.appendChild(row);
    });
  })();

  // 何件のうち何件を見ているのかを明示する。
  // 「最終収集」は実際に収集した時刻。HTMLを作り直しただけでは進まない。
  (function renderStamp() {
    var stamp = document.getElementById('stamp');
    var collectedAt = SUMMARY.updatedAt || '2026-09-02 21:42';
    var units = ['最終収集 ' + collectedAt];
    if (SUMMARY.archived > SUMMARY.total) {
      units.push('　/　蓄積 ' + SUMMARY.archived.toLocaleString() + ' 件のうち ');
      units.push(SUMMARY.total.toLocaleString() + ' 件を表示');
    }
    phrases(stamp, units);
  })();

  KEYWORDS.forEach(function (k) {
    var o = document.createElement('option');
    o.value = k; o.textContent = 'キーワード: ' + k;
    els.keyword.appendChild(o);
  });

  // --- ジャンルの絞り込み ---
  // 対象の10ジャンルを全部並べる。ローテーションで今日まだ回っていないジャンルを
  // 隠すと、扱う範囲が狭まったように見えるため。
  // ジャンルが10個並ぶので、どれを押したか数えなくても戻れる「すべて」を先頭に置く。
  var chipStates = [];

  function makeChip(label, onActivate) {
    var b = mk('span', 'chip');
    b.appendChild(mk('span', 'chip-name', label));
    if (onActivate) {
      b.tabIndex = 0;
      b.setAttribute('role', 'button');
      b.addEventListener('click', onActivate);
      b.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onActivate(); }
      });
    } else {
      // 1件も無いので押しても何も起きない。操作対象から外す
      b.classList.add('pending');
      b.setAttribute('aria-disabled', 'true');
      b.title = 'まだ収集していません';
    }
    els.genres.appendChild(b);
    return b;
  }

  function syncChips() {
    chipStates.forEach(function (s) {
      var on = s.isOn();
      s.el.classList.toggle('on', on);
      s.el.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  var allChip = makeChip('すべて', function () {
    activeGenres.clear();
    syncChips();
    render();
  });
  chipStates.push({ el: allChip, isOn: function () { return activeGenres.size === 0; } });

  GENRES.forEach(function (pair) {
    var g = pair[0];
    if (pair[1] === 0) { makeChip(g, null); return; }
    var chip = makeChip(g, function () {
      if (activeGenres.has(g)) activeGenres.delete(g);
      else activeGenres.add(g);
      syncChips();
      render();
    });
    chipStates.push({ el: chip, isOn: function () { return activeGenres.has(g); } });
  });

  syncChips();

  function fmtAge(h) {
    if (h === null || h === undefined) return '不明';
    if (h < 24) return Math.round(h) + '時間前';
    return Math.round(h / 24) + '日前';
  }

  function filtered() {
    var days = parseInt(els.period.value, 10);
    var kw = els.keyword.value;
    var q = els.q.value.trim().toLowerCase();

    return POSTS.filter(function (p) {
      if (days > 0) {
        if (p.ageHours === null || p.ageHours > days * 24) return false;
      }
      if (kw && p.keywords.indexOf(kw) === -1) return false;
      if (activeGenres.size > 0) {
        var hit = p.genres.some(function (g) { return activeGenres.has(g); });
        if (!hit) return false;
      }
      if (q) {
        var hay = (p.text + ' ' + p.username).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function sorted(rows) {
    var mode = els.sort.value;
    var copy = rows.slice();
    if (mode === 'likes') copy.sort(function (a, b) { return b.likes - a.likes; });
    else if (mode === 'newest') copy.sort(function (a, b) {
      var av = a.ageHours === null ? Infinity : a.ageHours;
      var bv = b.ageHours === null ? Infinity : b.ageHours;
      return av - bv;
    });
    else copy.sort(function (a, b) { return b.velocity - a.velocity; });
    return copy;
  }

  function render() {
    var rows = sorted(filtered());
    els.count.textContent = rows.length + ' 件を表示';
    els.list.textContent = '';

    if (rows.length === 0) {
      // 「絞り込みを」を1かたまりにして、「を」が行頭に来ないようにする
      els.list.appendChild(phrases(mk('div', 'empty'), [
        '条件に合う投稿が', 'ありません。', '絞り込みを', '緩めてください。'
      ]));
      return;
    }

    var frag = document.createDocumentFragment();
    rows.forEach(function (p, i) {
      var isRising = p.velocity >= RISING;
      var card = mk('div', 'card' + (isRising ? ' rising' : ''));

      var head = mk('div', 'card-head');
      head.appendChild(mk('span', 'rank', String(i + 1)));
      head.appendChild(mk('span', 'user', '@' + p.username));
      if (isRising) head.appendChild(mk('span', 'badge', '伸び中'));

      var stats = mk('div', 'stats');
      stats.appendChild(mk('span', 'likes', p.likes.toLocaleString() + ' likes'));
      stats.appendChild(mk('span', 'vel', p.velocity.toFixed(1) + '/h'));
      stats.appendChild(mk('span', 'age', fmtAge(p.ageHours)));
      head.appendChild(stats);
      card.appendChild(head);

      card.appendChild(mk('p', 'text', p.text));

      var tags = mk('div', 'tags');
      p.genres.concat(p.keywords).forEach(function (t) {
        tags.appendChild(mk('span', 'tag', t));
      });
      if (p.permalink) {
        var a = mk('a', 'link', '元投稿を開く →');
        a.href = p.permalink;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        tags.appendChild(a);
      }
      card.appendChild(tags);
      frag.appendChild(card);
    });
    els.list.appendChild(frag);
  }

  [els.sort, els.period, els.keyword].forEach(function (el) {
    el.addEventListener('change', render);
  });
  els.q.addEventListener('input', render);

  render();
})();
</script>
