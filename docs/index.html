<style>
  /* 明るい側を基準に全トークンを定義する。暗い側は下で上書きする。 */
  :root {
    --bg: #f6f4f5;
    --surface: #ffffff;
    --surface-2: #fbf9fa;
    --ink: #231c22;
    --muted: #6f636c;
    --border: #e4dee2;
    --accent: #8b2f5f;
    --accent-soft: #f7e9f0;
    --rising: #0f7b6c;
    --rising-soft: #e2f2ef;
    --chip: #efeaed;
    --focus: #8b2f5f;
  }
  /* OS が暗いとき。ただし閲覧者が明るいテーマを選んでいたらそちらを優先する。 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151114;
      --surface: #1f1a1e;
      --surface-2: #241e23;
      --ink: #f0eaee;
      --muted: #a3969e;
      --border: #332b31;
      --accent: #e086b0;
      --accent-soft: #3a2130;
      --rising: #4fc3ae;
      --rising-soft: #16332e;
      --chip: #2c2429;
      --focus: #e086b0;
    }
  }
  /* 閲覧者が暗いテーマを選んだとき。OS の設定に関係なく効かせる。 */
  :root[data-theme="dark"] {
    --bg: #151114;
    --surface: #1f1a1e;
    --surface-2: #241e23;
    --ink: #f0eaee;
    --muted: #a3969e;
    --border: #332b31;
    --accent: #e086b0;
    --accent-soft: #3a2130;
    --rising: #4fc3ae;
    --rising-soft: #16332e;
    --chip: #2c2429;
    --focus: #e086b0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    /* 透明のままだと閲覧側の地の色を借りてしまうので必ず塗る */
    background: var(--bg);
    color: var(--ink);
    /* 日本語本文はWebフォントを落とすと重いので、端末のフォントを使う */
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
                 -apple-system, BlinkMacSystemFont, "Yu Gothic Medium", sans-serif;
    line-height: 1.75;
    font-feature-settings: "palt" 1;
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
  }

  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px 96px; }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* --- 見出し --- */
  h1 {
    font-family: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-weight: 900;
    font-size: clamp(1.5rem, 4vw, 2.1rem);
    line-height: 1.35;
    letter-spacing: .01em;
    margin: 0;
    text-wrap: balance;
  }
  /* 対象ジャンルの但し書き。名前より一段弱く見せる */
  .ver {
    display: block;
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-weight: 400;
    font-size: .74rem;
    letter-spacing: .02em;
    color: var(--muted);
    margin-top: 6px;
  }

  /* --- 集計：詳細より先に全体像を出す --- */
  .panel {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    margin: 28px 0 8px;
  }
  /* 4枚で固定する。auto-fit だと枚数によって最後の1枚だけ次の行に
     取り残され、空いた枠が塗り残しに見えてしまうため。 */
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
  }
  @media (max-width: 620px) {
    /* 4枚なので2列でもきれいに埋まる */
    .summary { grid-template-columns: repeat(2, 1fr); }
  }
  .stat { background: var(--surface); padding: 14px 16px; }

  /* --- ジャンル別の内訳 --- */
  /* 棒にしておけば、ジャンルが何個あっても1行1本で並ぶので取り残しが出ない */
  .breakdown { padding: 15px 16px 17px; border-top: 1px solid var(--border); }
  .breakdown-title {
    font-size: .7rem; color: var(--muted); letter-spacing: .06em;
    margin: 0 0 11px; white-space: nowrap;
  }
  /* 名前の列は固定幅。名前に合わせて伸ばすと、長いジャンルの行だけ棒の
     開始位置がずれて、棒どうしの長さを目で比べられなくなる。
     収まらない名前は「・」の位置で2行に折る（折り位置は .nb で決め打ち）。
     8.5em は「・」で切ったときの最長の区切り8文字が1行に収まる幅。 */
  .bar-row {
    display: grid;
    grid-template-columns: 8.5em 1fr auto;
    gap: 12px; align-items: center;
  }
  .bar-row + .bar-row { margin-top: 8px; }
  /* 1行で収まる名前も2行の名前と同じ高さにする。混ざると行の間隔が
     ばらついて、棒の並びが読みにくくなる。
     flex にしているのは、折り返した2行をまとめて上下中央に置くため。 */
  .bar-name {
    font-size: .76rem; line-height: 1.4;
    min-height: 2.8em;
    display: flex; flex-wrap: wrap; align-content: center;
  }
  .bar-track {
    height: 6px; border-radius: 999px;
    background: var(--chip); overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 999px; background: var(--accent); }
  .bar-count {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; color: var(--muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  @media (max-width: 620px) {
    /* 幅は変えない。変えると狭い画面だけ折り返し位置が変わってしまう */
    .bar-row { gap: 9px; }
  }
  /* まだ集まっていないジャンル。対象には入っているので消さず、弱く見せる */
  .bar-row.pending .bar-name { color: var(--muted); }
  .bar-row.pending .bar-track { opacity: .55; }
  /* 「収集待ち」は日本語なので、等幅フォントに任せず本文と同じ書体で出す */
  .bar-row.pending .bar-count {
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: .7rem;
  }
  .stat-label {
    font-size: .7rem; color: var(--muted); letter-spacing: .06em;
    display: block; margin-bottom: 4px;
    /* 「表示中/の投稿」のように助詞で割れないよう、まとめて扱う */
    white-space: nowrap;
  }
  .stat-value {
    white-space: nowrap;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: 1.25rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .stat-value .unit { font-size: .72rem; font-weight: 400; color: var(--muted); margin-left: 3px; }
  .stamp {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .7rem; color: var(--muted); margin: 0 0 26px;
  }

  /* --- 操作バー --- */
  .controls {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: 12px 0 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row + .row { margin-top: 8px; }
  select, input[type=search] {
    font: inherit; font-size: .82rem;
    padding: 7px 11px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    color: var(--ink);
  }
  input[type=search] { flex: 1; min-width: 180px; }
  .chip {
    display: inline-flex; align-items: baseline; gap: 6px;
    font-size: .78rem; padding: 5px 13px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on {
    background: var(--accent-soft); border-color: var(--accent);
    color: var(--accent); font-weight: 700;
  }
  /* ジャンル名は途中で割らない。「ダイエット」を「ダイ」と「エット」に分けない */
  .chip-name { white-space: nowrap; }
  /* まだ1件も無いジャンル。押しても空振りするので、選べないことを見た目で示す */
  .chip.pending {
    opacity: .45; cursor: default;
    border-style: dashed;
  }
  .chip.pending:hover { border-color: var(--border); color: var(--muted); }
  .count {
    white-space: nowrap;
    font-family: "Roboto Mono", ui-monospace, monospace;
    color: var(--muted); font-size: .76rem; margin-bottom: 14px;
    font-variant-numeric: tabular-nums;
  }

  /* --- カード --- */
  #list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid transparent;
    border-radius: 10px;
    padding: 16px 18px;
  }
  /* 伸びが速い投稿は左端の色で一目で分かるようにする */
  .card.rising { border-left-color: var(--rising); background: var(--surface-2); }

  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 9px; }
  .rank {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; color: var(--muted);
    font-variant-numeric: tabular-nums; min-width: 2.4em;
  }
  .user { font-weight: 700; font-size: .86rem; }
  .badge {
    white-space: nowrap;
    font-size: .66rem; font-weight: 700; letter-spacing: .04em;
    padding: 2px 8px; border-radius: 999px;
    background: var(--rising-soft); color: var(--rising);
  }
  .stats {
    margin-left: auto; display: flex; gap: 11px;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; font-variant-numeric: tabular-nums;
  }
  .likes { color: var(--accent); font-weight: 700; }
  .vel { color: var(--rising); font-weight: 500; }
  .age { color: var(--muted); }

  .text {
    white-space: pre-wrap;
    /* word-break: break-word は単語の途中で割るので使わない。
       overflow-wrap なら、1語が行に収まらないときだけ割る。
       line-break: strict で日本語の禁則処理を厳しい方に寄せる。 */
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
    font-size: .92rem; margin: 0 0 12px;
  }

  /* 文節のかたまり。ここで囲った範囲は途中で改行されない。
     「を」「と」などの助詞が行頭に来るのを防ぐために使う。 */
  .nb { white-space: nowrap; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag {
    white-space: nowrap;
    font-size: .7rem; padding: 3px 9px; border-radius: 4px;
    background: var(--chip); color: var(--muted);
  }
  .link {
    margin-left: auto; font-size: .76rem; color: var(--accent);
    text-decoration: none; font-weight: 700; white-space: nowrap;
  }
  .link:hover { text-decoration: underline; }

  .empty { text-align: center; color: var(--muted); padding: 64px 20px; font-size: .88rem; }
</style>

マッサージ", "薄毛 対策"]}, {"id": "3919403234142850104", "username": "mafu_career", "text": "ハゲてきた男は薬呑め。\n3ヶ月で一応復活したから。", "permalink": "https://www.threads.com/@mafu_career/post/DZkhHm-mgw4", "likes": 1155, "velocity": 0.6, "ageHours": 1917.7, "postedAt": "2026-06-15T00:01:36+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["抜け毛 対策", "育毛剤"]}, {"id": "3949616772345883606", "username": "anya_kaorin", "text": "更年期になってから\n一切わき毛が生えなくなったのは何故⁇\n剃る手間が省けて嬉しいんだか、悲しいんだか…", "permalink": "https://www.threads.com/@anya_kaorin/post/DbP24dKmevW", "likes": 1114, "velocity": 1.21, "ageHours": 917.2, "postedAt": "2026-07-26T16:30:31+09:00", "genres": ["脱毛"], "keywords": ["毛深い 悩み"]}, {"id": "3935611355290330196", "username": "bijin_face", "text": "歯科衛生士として何万回でも言う。35歳を過ぎたら、骨が広がって目の下がたるむ。頬骨や眼窩まわりの骨は年齢とともに少しずつ広がっていく。眼窩が広がると眼輪筋が支えきれなくなって、皮膚脂肪と下に落ちる。たるみ解消するならちょっといい化粧水美容液よりも、", "permalink": "https://www.threads.com/@bijin_face/post/DaeGa0GEuRU", "likes": 1009, "velocity": 0.73, "ageHours": 1381.0, "postedAt": "2026-07-07T08:44:15+09:00", "genres": ["フェイシャル・小顔", "たるみ・シワ"], "keywords": ["ほうれい線", "たるみ 改善"]}, {"id": "3885041921852829223", "username": "aromamion.33", "text": "ローソンで買える無印良品の\n頭皮マッサージもできるブナ材ヘアコーム。\n\nかっさセラピスト目線で、\n持ち方や流し方をお伝えしてみました。\n\nまず感じたのは、コスパのよさ。\nそして、持ちやすくて使いやすいサイズ感。\n普段使いにはとてもいいと思います。\n\n今回は撮り方が少しわかりにくくなってしまいましたが、\n参考にしていただけたら嬉しいです。\nお客様に試していただくと\n\n「やさしい感じですね」とのお声も。\nやはり水牛の角プレートとは\n浸透感の違いを感じますが\n気軽に取り入れやすいアイテムとしてはおすすめです。", "permalink": "https://www.threads.com/@aromamion.33/post/DXqcQtJie4n", "likes": 996, "velocity": 0.33, "ageHours": 3055.5, "postedAt": "2026-04-28T14:11:49+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3906305995982839447", "username": "macaronimasatin", "text": "ハンドケア始めて3ヶ月🖐️\nガサガサでシワシワな手に悩んでた\n何かいい方法はないかと探しまくってたらハンドモデルさんの手の投稿を見て衝撃をうけた。あまりに手が美しすぎてうっとり♡\n自分もこんなきれいな手になりたいて思って使ってる商品を買って真似してケアしていったらここまで変わった✨無印良品の発酵導入化粧液＋マカデミアナッツオイルを塗り出して乾燥しなくなって手がツルツルになった。夜に化粧液＋オイル＋コエンリッチの夜用ハンドクリーム塗って手の血流を良くする運動したりマッサージするようになったらシワもうすくなって手も白くなった🖐️（動画は5月27日朝）まだまだ関節のシワが気になるしむっちりした指や丸い爪の形がコンプレックスだけどハンドケアするようになってお顔と同じように優しくケアしてあげることの大切さを知った\n手がきれいになると気持ちまで明るくなるしネイルした手が可愛いく見えてくる♡\n同じように悩んでる方の参考に少しでもなったら嬉しい☺️\nインスタでレチノール入りのアイクリーム塗ったら2週間で関節のシワなど薄くなった投稿を見て最近塗り出したよ。お顔のシミにも塗ってるから結果はまた報告します✨", "permalink": "https://www.threads.com/@macaronimasatin/post/DY1_JtaiR6X", "likes": 973, "velocity": 0.41, "ageHours": 2351.4, "postedAt": "2026-05-27T22:19:44+09:00", "genres": ["くすみ・美白"], "keywords": ["美白 ケア"]}, {"id": "3955495335774921795", "username": "biyoubiyou13", "text": "初めましての美容師さんに、「白髪、少なっ！！！髪にいくらかけてます？」ってめちゃくちゃ驚かれた。「実は頭皮にマグネシウムスプレーを毎日シュッシュしてるだけです」って答えたら、「え、", "permalink": "https://www.threads.com/@biyoubiyou13/post/Dbkvgz_lCRD", "likes": 961, "velocity": 1.33, "ageHours": 722.5, "postedAt": "2026-08-03T19:10:10+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3864287013008662590", "username": "kaor_u214", "text": "ダイエット垢作りました。\n155cm、73.4kg、ダイエット始めて46日経過、体重変わらずです💦\n痩せ方がわからない😭\n\n皆さんよろしくお願いいたします🙇‍♀️", "permalink": "https://www.threads.com/@kaor_u214/post/DWgtJCAiWA-", "likes": 949, "velocity": 0.25, "ageHours": 3742.8, "postedAt": "2026-03-30T22:55:31+09:00", "genres": ["ダイエット・痩身"], "keywords": ["部分痩せ"]}, {"id": "3904725884317248348", "username": "mochi_bihada", "text": "ローソン限定の無印のかっさ付きコーム。\n「口が開く」「飛ぶぞ」って言われてるから解説しとく。\n\n頭皮と顔の皮膚は1枚で繋がってる。\nだから頭皮をかっさでほぐす＝顔が上がるは本当。\n\n特に効くのは↓\n・側頭筋（耳の上）→眼精疲労・目の開きUP\n・後頭筋（後頭部の下）→首肩こり・不眠\n・帽状腱膜（頭頂部）→自律神経・おでこのシワ\n・生え際→前頭筋ほぐして額のシワ予防\n\nコームタイプの良いところは、髪と一緒にケアできて続けやすいこと。お風呂場に置いて、シャンプー前に30秒やるだけで頭が軽くなる。\n\n「擦らずに、置いて揺らす」だけ覚えておいて。ちなみに顔で使うべきポイントは、", "permalink": "https://www.threads.com/@mochi_bihada/post/DYwX4DwAKtc", "likes": 948, "velocity": 0.39, "ageHours": 2403.7, "postedAt": "2026-05-25T18:00:20+09:00", "genres": ["育毛・頭皮ケア", "薄毛"], "keywords": ["頭皮ケア", "頭皮マッサージ", "生え際 後退"]}, {"id": "3864856519238675393", "username": "atsushi_bihatsu14", "text": "何度も言うけど、美容の現場にいて、血管が汚い人は、白髪がめちゃくちゃ多い。パサつき、抜け毛、頭皮が硬いのも原因は同じ。加齢と共に毛細血管はゴースト血管化しちゃうから最優先は「血管ケア」だよ。やり方は、", "permalink": "https://www.threads.com/@atsushi_bihatsu14/post/DWiuocBEuvB", "likes": 935, "velocity": 0.25, "ageHours": 3723.9, "postedAt": "2026-03-31T17:47:01+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3955856582227739427", "username": "minmin_to_milk", "text": "以前よりご意見をいただいてる目の下のたるみグマについてです。美容医療は大幅に予算オーバーだし怖いので、メイクで少しでも改善したいです。\n\n日差しのあるところで撮り直しました。\nメイクはしてません。\n\nコンシーラーの神様が降りてきますように…", "permalink": "https://www.threads.com/@minmin_to_milk/post/DbmBpo-E0Mj", "likes": 916, "velocity": 1.29, "ageHours": 710.6, "postedAt": "2026-08-04T07:07:54+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["たるみ 改善"]}, {"id": "3947457270513760148", "username": "yururu.selfcare", "text": "誰も言わないから言うけど、寝る前にスマホをやめても自律神経は整わないよ。「深呼吸して」「湯船つかって」みたいな王道は今日は一旦置いといて、海外の神経科学ベースで「え、それで整うの」ってやつだけ集めた。寝つきが悪い人、更年期世代の約51%がそうなんだけど、その人ほど効くやつ。全部30秒以内、ベッドの中でできる。順番に置いてく↓", "permalink": "https://www.threads.com/@yururu.selfcare/post/DbIL3kXAXeU", "likes": 916, "velocity": 0.93, "ageHours": 988.7, "postedAt": "2026-07-23T16:59:58+09:00", "genres": ["エステ・リラクゼーション"], "keywords": ["自律神経 整える"]}, {"id": "3940946405933272504", "username": "amujm78649", "text": "過緊張の自律神経失調症の方いますか？私がそうです。休めないです気持ちが。", "permalink": "https://www.threads.com/@amujm78649/post/DaxDeBMgU24", "likes": 900, "velocity": 0.75, "ageHours": 1204.3, "postedAt": "2026-07-14T17:24:02+09:00", "genres": ["エステ・リラクゼーション"], "keywords": ["自律神経 整える"]}, {"id": "3934199239224634172", "username": "warewarewa_r", "text": "昨日あおばクリニックに行って顔脱毛しただけやのに終わった直後からめっちゃ肌の調子がいい。なぜや...何のおかげなんや...\nクレンジング？終わった後にクーリングで塗られた薬が肌にあった？\nちなみにパウダールームに置いてあった日焼け止めジェルもめっちゃ良かったよ！！！\n\nあおばクリニックで働いてる人いませんかーーーー\nあの薬なんだったんですかーーーーーー\nクレンジングと日焼け止めジェルは買えないんですかーーーーーー", "permalink": "https://www.threads.com/@warewarewa_r/post/DaZFV0hmKs8", "likes": 891, "velocity": 0.62, "ageHours": 1427.7, "postedAt": "2026-07-05T09:58:37+09:00", "genres": ["脱毛"], "keywords": ["医療脱毛"]}, {"id": "3958384551961143112", "username": "rira_yukari", "text": "糸リフト片側3本ずつ！今回もいい感じに自然にリフトアップできて満足の39歳女\n(わかりやすいように同じ服きて同じ場所で撮った)", "permalink": "https://www.threa 3964932758179147968", "username": "tora_mamama", "text": "だから何度でも言うけど、こういう毛穴は朝にナイアシンアミド→夜にアゼライン酸仕込めば２週間ぐらいで見違えるってば。これ使ってみな", "permalink": "https://www.threads.com/@tora_mamama/post/DcGRVYhk_DA", "likes": 818, "velocity": 2.0, "ageHours": 410.0, "postedAt": "2026-08-16T19:40:38+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["毛穴 ケア"]}, {"id": "3906272047135847015", "username": "sefu_chan2", "text": "胸鎖乳突筋を鍛えると顔の肉が消える。\nこれマジで革命的に効くから話す。\n首の横、耳の下から鎖骨にかけて伸びる筋肉。\nここを意識的に動かすだけで、フェイスラインが別人になる。\n2週間で輪郭が出てくる人もいる。覚えとけ。", "permalink": "https://www.threads.com/@sefu_chan2/post/DY13bsFkfJn", "likes": 813, "velocity": 0.35, "ageHours": 2352.5, "postedAt": "2026-05-27T21:12:20+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["小顔"]}, {"id": "3934494547904821891", "username": "yunchan_daisuki11", "text": "この前、肝斑とシミの件でアドバイスくれたフォロワーさん、見てますかーー！😭✨ 教えてもらったクリーム、速攻で成分まで調べて買いました！ 正直ここまで中身が豪華だと思ってなくて、価格と成分のバランス崩壊してます（笑） あの時、藁にもすがる思いで投稿して本当によかった。フォロワーさんとの出会いに本気で感謝です", "permalink": "https://www.threads.com/@yunchan_daisuki11/post/DaaIfIKk_qD", "likes": 801, "velocity": 0.56, "ageHours": 1417.9, "postedAt": "2026-07-05T19:45:21+09:00", "genres": ["くすみ・美白"], "keywords": ["シミ 対策"]}, {"id": "3888607330787196837", "username": "antyan_beauty", "text": "35歳を超えてる女性は、『カリウム』不足で一気に老けます。顔のむくみ、二重顎、朝起きた時の腫れぼったい瞼、これ全部カリウム不足。日本人女性の8割が、カリウムの推奨量に届いてない。これが足りないと、顔のむくみがそのまま老け顔として定着する。そんなカリウムを世界一摂れる食材があって、", "permalink": "https://www.threads.com/@antyan_beauty/post/DX3G8O-jP-l", "likes": 781, "velocity": 0.27, "ageHours": 2937.4, "postedAt": "2026-05-03T12:15:38+09:00", "genres": ["むくみ・冷え"], "keywords": ["むくみ 解消", "脚 むくみ"]}, {"id": "3970531789828539600", "username": "owl.70983938", "text": "産後もう1年経つんですけど、体重が増えていく一方で87キロになってしまった(；；)\n流石にやばいと思って死ぬ気でダイエット頑張ろうと思うんですけど食事制限以外になにしたらいいのか分からない💦\nマンジャロで痩せた友達に会ったけど激痩せしすぎててガリガリなってて羨ましかったけど、まだ小さい娘もいるし副作用とか考えたらなかなか手出せない。なにかアドバイスください😣", "permalink": "https://www.threads.com/@owl.70983938/post/DcaKaBGIETQ", "likes": 738, "velocity": 3.29, "ageHours": 224.6, "postedAt": "2026-08-24T13:04:55+09:00", "genres": ["ダイエット・痩身"], "keywords": ["部分痩せ"]}, {"id": "3907004974445537657", "username": "kumi_biyo_official", "text": "ちょい怖いこと言うと、、、\nすり鉢毛穴は「皮脂」でも「汚れ」でもなく炎症で地盤が凹む構造トラブルやねん。本気で卒業したい40代は、今日から3つの成分でケア始めて。￼", "permalink": "https://www.threads.com/@kumi_biyo_official/post/DY4eFL1gql5", "likes": 721, "velocity": 0.31, "ageHours": 2328.2, "postedAt": "2026-05-28T21:28:29+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["毛穴 ケア"]}, {"id": "3937960063256316381", "username": "antyan_beauty", "text": "ストレートネックの人！！！！！二重あごになるし、ほうれい線目立つし、顔むくむし、めっちゃ老けて見えるから、今すぐこれやって！！！！！", "permalink": "https://www.threads.com/@antyan_beauty/post/DamcdA2EUnd", "likes": 712, "velocity": 0.55, "ageHours": 1303.2, "postedAt": "2026-07-10T14:30:43+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["小顔", "ほうれい線"]}, {"id": "3970561344102089602", "username": "mellow.days_7", "text": "噂の固形シャンプー、思い切って使ってみた。\n\nキシキシしそうで正直不安だったけど、\n洗い上がりの頭皮のすっきり感が想像以上でびっくり。\n\n場所取らないし、減りもゆっくりでコスパいいし、\n乾かしたあと髪がふんわりする感じも好き🛁\n\n今まで高いシャンプー探し回ってたの何だったんだろう……😂", "permalink": "https://www.threads.com/@mellow.days_7/post/DcaRIFqGkOC", "likes": 709, "velocity": 3.17, "ageHours": 223.6, "postedAt": "2026-08-24T14:03:38+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3967070676339993332", "username": "iikurashi_i", "text": "最短で垢抜けたいなら、この前髪真似してみ。\nセンターで分けて左右は毛量残したまま、真ん中だけシースルー。これがもう誰にでも似合う黄金垢抜け前髪なんですよ。", "permalink": "https://www.threads.com/@iikurashi_i/post/DcN3cL-HSr0", "likes": 669, "velocity": 1.97, "ageHours": 339.2, "postedAt": "2026-08-19T18:28:18+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3957695176390025818", "username": "megu_tsi_com", "text": "助けてほしい、、、\n顔脂肪いらない人無料でください🥹\n明日〜8/30まで小顔デトックスエステの\n練習モデルになって欲しいです…🥲💧￼", "permalink": "https://www.threads.com/@megu_tsi_com/post/DbsjstOASJa", "likes": 669, "velocity": 1.03, "ageHours": 649.7, "postedAt": "2026-08-06T20:00:52+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["小顔"]}, {"id": "3919358441610214321", "username": "kokonatukokonatu", "text": "最 すが凸凹がほとんどない)", "permalink": "https://www.threads.com/@y_baby1017/post/Dcp8dgamazV", "likes": 479, "velocity": 6.18, "ageHours": 77.5, "postedAt": "2026-08-30T16:10:55+09:00", "genres": ["毛穴・ニキビ"], "keywords": ["大人ニキビ"]}, {"id": "3884794557531862989", "username": "koma.cheek", "text": "衝撃だった。\n脚が太いのは「体質」か「筋肉のつき方」だと思ってたけど、 \n元モデルの友人いわく \nスキニーを綺麗に履きこなしたいなら \n毎日１時間ウォーキングするわけでもなく、\nキツいスクワットを毎日100回頑張るでもなく、\n 着圧レギンスを24時間履き続けるでもなく、", "permalink": "https://www.threads.com/@koma.cheek/post/DXpkBFLDrfN", "likes": 474, "velocity": 0.15, "ageHours": 3063.7, "postedAt": "2026-04-28T06:00:26+09:00", "genres": ["むくみ・冷え"], "keywords": ["脚 むくみ"]}, {"id": "3953768001825169757", "username": "n._life_", "text": "これだけはずっと続けたいっていう\nお気に入りの医療美容はありますか？🧖🏻‍♀️\n\n内側から発光するような肌になりたい✨", "permalink": "https://www.threads.com/@n._life_/post/Dbemwy5GGFd", "likes": 470, "velocity": 0.6, "ageHours": 779.7, "postedAt": "2026-08-01T09:58:16+09:00", "genres": ["くすみ・美白"], "keywords": ["肌 透明感"]}, {"id": "3947552402908724107", "username": "y___kotoha", "text": "25超えてからシミ出てきて\nシミ取りしたいのと\nクレーターには何がいいですか！？！\nあと毛穴は！？\nノーファンデには何をしたらいいですか⁉️\n#助けて", "permalink": "https://www.threads.com/@y___kotoha/post/DbIhf7TnTuL", "likes": 458, "velocity": 0.46, "ageHours": 985.6, "postedAt": "2026-07-23T20:08:59+09:00", "genres": ["くすみ・美白"], "keywords": ["シミ 対策"]}, {"id": "3885281577731619354", "username": "wankononki", "text": "あの、ヘッドマッサージ教えてくれた方にお礼を言いたい！\n\nヘッドマッサージしたら頭が軽くなっただけでなく、顔のたるみも首の皮膚も持ち上がったのだが‼️\n\nリフトアップ‼️‼️\nもうやめられないし、ヘッドスパ行かなくて良くなっちゃった\n\n本当にありがとうございますm(_ _)m", "permalink": "https://www.threads.com/@wankononki/post/DXrSwKFD_oa", "likes": 455, "velocity": 0.15, "ageHours": 3047.6, "postedAt": "2026-04-28T22:07:58+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3971526427338204523", "username": "tattatta_p", "text": "VIOのIO部分をもう少し黄色人種味のある色にしたい。まあまあ黒ずんでる。みんなそんなもん？\nVIO脱毛行きたいけど恥ずかしい。", "permalink": "https://www.threads.com/@tattatta_p/post/Dcdsj5dkeVr", "likes": 446, "velocity": 2.33, "ageHours": 191. , {"id": "3893167497709574417", "username": "kurisumasurozu642", "text": "長年お世話になっていた美容師さんが私が円形脱毛症になっている事に気づきながらも私には黙って普通にカラーや縮毛矯正を施術されていました。\nハゲが大きくなってから私が気づき、皮膚科でもっと前からできている、カラーも本来は避けるべきと言われてその後美容師さんに確認しましたが最後まで謝らず、カラーとハゲとは関係ないですからと逆に嫌な態度をされる始末。\nハゲはすぐ治るから大丈夫とも言われました。\n美容師さんってハゲてても教えてもくれず、カラーや縮毛矯正するのでしょうか？\n毎回2万近く支払ったのになあ。\n長年信頼していたのでかなり残念です。", "permalink": "https://www.threads.com/@kurisumasurozu642/post/DYHTzZYE1kR", "likes": 271, "velocity": 0.1, "ageHours": 2786.4, "postedAt": "2026-05-09T19:15:53+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3925863378431347402", "username": "nico_mina25", "text": "エステって月１回でも継続したら効果あるのかな？\n美容を放棄しすぎてて、そろそろ何か始めようかと。\n月１回、フェイシャルとボディがっつりをやろうかと思ってるんだけど。", "permalink": "https://www.threads.com/@nico_mina25/post/DZ7d_FMHYrK", "likes": 267, "velocity": 0.16, "ageHours": 1703.8, "postedAt": "2026-06-23T21:56:45+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["フェイシャルエステ"]}, {"id": "3965245648106937844", "username": "gcstagram2", "text": "家庭用脱毛器って何日か連続でやったらダメかな？\n毛の周期があるのは理解してるんだけど\n昨日やってからの\n濃いとこだけ今日もう1回やりたいなーって", "permalink": "https://www.threads.com/@gcstagram2/post/DcHYeh-k930", "likes": 266, "velocity": 0.67, "ageHours": 399.7, "postedAt": "2026-08-17T06:02:18+09:00", "genres": ["脱毛"], "keywords": ["医療脱毛"]}, {"id": "3901162470446353704", "username": "antyan_beauty", "text": "シミ消したい女はよく聞け！！！\n\n1万円超えの『HAKU』と同じ美白有効成分が入った美白ジェルが、1,000円台で買える。1週間で頬のシミが薄くなって、2週間で鼻の毛穴が目立たなくなって、3週間で目の下のくすみが薄くなる。そんなコスパ最強の商品が、", "permalink": "https://www.threads.com/@antyan_beauty/post/DYjtpj-Ck0o", "likes": 265, "velocity": 0.11, "ageHours": 2521.7, "postedAt": "2026-05-20T20:00:28+09:00", "genres": ["くすみ・美白"], "keywords": ["美白 ケア"]}, {"id": "3946160651538451697", "username": "tae.kanade", "text": "何度でも言うわ。35歳を過ぎたら、顔より先に\"髪\"で年齢が出るの。白髪。髪のパサつき。頭皮のベタつきやニオイ……高いシャンプーを探す前に、私が5年以上続けてるのは洗い方を変えることを言うから保存して…", "permalink": "https://www.threads.com/@tae.kanade/post/DbDlDR1kszx", "likes": 262, "velocity": 0.25, "ageHours": 1031.6, "postedAt": "2026-07-21T22: う、全身ガチガチ、浮腫まくり😭", "permalink": "https://www.threads.com/@m__fk_hnn/post/DaxZ8Zij2xm", "likes": 237, "velocity": 0.2, "ageHours": 1201.0, "postedAt": "2026-07-14T20:40:26+09:00", "genres": ["むくみ・冷え"], "keywords": ["リンパ マッサージ"]}, {"id": "3921551918242791455", "username": "arma.dijo", "text": "お風呂上がり、ヘアミルクもつけてすっごい時間かけてブラシもちゃんと通しながら、ドライヤーも一方向から当てて乾かしてもこのレベル\n天使の輪なんてあったことない\n光も反射しないパサパサ髪\nちなみに母親もゴワゴワバサバサの髪質😭\n○ぬまでこの髪なのほんとに鬱", "permalink": "https://www.threads.com/@arma.dijo/post/DZsJrE_HQAf", "likes": 234, "velocity": 0.13, "ageHours": 1846.5, "postedAt": "2026-06-17T23:10:39+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3943334220777832087", "username": "mm.ss.1221", "text": "vio脱毛してる方に聞きたいです\n施術前に全部剃りますよね\nその後、すぐ抜けるわけではないし、\n伸びてジョリってなるときがあると思うんですが、その時期はどう過ごされてますか？\nパートナーの方にはジョリの姿をお見せしてますか？", "permalink": "https://www.threads.com/@mm.ss.1221/post/Da5iZTEGr6X", "likes": 232, "velocity": 0.21, "ageHours": 1125.2, "postedAt": "2026-07-18T00:28:12+09:00", "genres": ["脱毛"], "keywords": ["VIO脱毛"]}, {"id": "3972909003122655535", "username": "bon50501", "text": "女性の薄毛に本当に効果のある物が知りたいです‼️\n40歳女性。小学生のころから前髪が薄いです。\n猫っ毛で細いです。", "permalink": "https://www.threads.com/@bon50501/post/Dcim7BgE8Ev", "likes": 229, "velocity": 1.57, "ageHours": 145.9, "postedAt": "2026-08-27T19:48:01+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "つむじ 薄毛"]}, {"id": "3960978742398904396", "username": "kaname_fubuki", "text": "恐いことに気付いてしまいました。\n\n次男の髪の毛がごっそり減っているのです。\n本人が、シャンプーの時に髪がすごく抜けて恐いと言い、頭頂部を見たら、つむじ以外も地肌が露出しているのです😔\n触ると、髪全体の毛量がスカスカになっていました。次男は背が高いので、頭頂部に気付きませんでした。\n円形脱毛症という抜け方ではなく、全体的に密度が落ちている感じです。\n\n明らかにストレスだと思いますが、同じようになった方いらっしゃいますか？😢\n本人も怖がっており、可哀想です。\n明日、小児科へ行くので相談してみようとは思っています。", "permalink": "https://www.threads.com/@kaname_fubuki/post/Db4OS4Xj2hM", "likes": 228, "velocity": 0.42, "ageHours": 541.0, "postedAt": "2026-08-11T08:44:43+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3903425964852492499", "username": "dr.norimoto", "text": "美容外科界隈みんな知ってるけど、黙ってる事ひとつぶっちゃけます\n・\n糸とヒアルで小顔は作れん\nむしろ、物入れてるからデカなる", "permalink": "https://www.threads.com/@dr.norimoto/post/DYrwTvaEbjT", "likes": 220, "velocity": 0.09, "ageHours": 2446.7, "postedAt": "2026-05-23T22:57:37+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["小顔"]}, {"id": "3941756124753066492", "username": "katsuki772026", "text": "絶対自律神経弱ってるなぁ…\nどうやって整うんだろ…健康な生活だとは思うけど、なかなか難しい😓", "permalink": "https://www.threads.com/@katsuki772026/post/Daz7k-nIHn8", "likes": 220, "velocity": 0.19, "ageHours": 1177.5, "postedAt": "2026-07-15T20:12:48+09:00", "genres": ["エステ・リラクゼーション"], "keywords": ["自律神経 整える"]}, {"id": "3915548706699664612", "username": "koziwatyann_biyou", "text": "いいか、40代50代。ハイフでも高周波でも取れないたるみがある。それが「皮膚の余り」。40代以降になると骨・筋肉・脂肪が減るのに皮膚の量は変わらないから、どんどん皮膚が余ってたるんでくる。この皮膚を直接引き締められる機械がたった1つだけあって、「皮膚のアイロン」って言われる", "permalink": "https://www.threads.com/@koziwatyann_biyou/post/DZW0s2jktzk", "likes": 218, "velocity": 0.11, "ageHours": 2045.3, "postedAt": "2026-06-09T16:23:21+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["たるみ 改善"]}, {"id": "3961259933790951163", "username": "reeba_iraka", "text": "家庭用脱毛器ってのはほんとに脱毛できるの？永久なの？？？？？そこんとこどーなんだってきいてんだよおおおお", "permalink": "https://www.threads.com/@reeba_iraka/post/Db5OOwQmNb7", "likes": 218, "velocity": 0.41, "ageHours": 531.6, "postedAt": "2026-08-11T18:03:24+09:00", "genres": ["脱毛"], "keywords": ["脱毛 サロン"]}, {"id": "3954947860018296473", "username": "mi_ku5690", "text": "なんで脱毛したばっかりなのに、もう生えてくるの", "permalink": "https://www.threads.com/@mi_ku5690/post/DbizB_dlPaZ", "likes": 216, "velocity": 0.29, "ageHours": 740.7, "postedAt": "2026-08-03T01:02:26+09:00", "genres": ["脱毛"], "keywords": ["医療脱毛"]}, {"id": "3898858442480416722", "username": "ychibiyou", "text": "5万回は言ってるけど、まだ言う‼️‼️‼️‼️\n元大手美容クリニック勤務だから言える。\nシミを薄くしたいなら、高級美白化粧水でも、フォトフェイシャルでも、レーザーでもない。\n一番おすすめなのは、、、", "permalink": "https://www.threads.com/@ychibiyou/post/DYbhxitk_fS", "likes": 211, "velocity": 0.08, "ageHours": 2598.0, "postedAt": "2026-05-17T15:42:46+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["フェイシャルエステ"]}, {"id": "3920394369510613003", "username": "piro0327", "text": "むくみ（水腫）は、中医学では非常に奥が深い症状です。", "permalink": "https://www.threads.com/@piro0327/post/DZoCehuHyAL", "likes": 208, "velocity": 0.11, "ageHours": 1884.9, "postedAt": "2026-06-16T08:50:49+09:00", "genres": ["むくみ・冷え"], "keywords": ["むくみ 解消"]}, {"id": "3854065901797276079", "username": "seitailien_koga", "text": "【口まわりが老ける人の共通点】\n\nほうれい線\n口角の下がり\nマリオネットライン\nフェイスラインのぼやけ\n\n実はこれ\n「口まわりの筋肉バランスの崩れ」が原因です！\n\n口の周りには\n表情を作る筋肉が放射状に広がっています。\n\n特に影響するのがこのあたり\n\n口輪筋\n頬筋\n大頬骨筋\n小頬骨筋\n広頸筋\nオトガイ筋\n\nこれらの筋肉が\n\n使われない\n硬くなる\n下に引っ張られる\n\nこの状態になると\n顔の組織が下方向に引っ張られやすくなります。\n\n結果\n\n口角が下がる\n頬がたるむ\nフェイスラインがぼやける\n\nという「老け顔サイクル」に。\n\nでも安心してください。\n\n筋肉は\n正しく動かせば変わります。\n\n今回の動画では\n口まわり老化に関わる筋肉ケアを\nまとめて紹介しています。\n\n気になる人は\n保存して一緒にやってみてください！", "permalink": "https://www.threads.com/@seitailien_koga/post/DV8ZISZknmv", "likes": 207, "velocity": 0.05, "ageHours": 4081.2, "postedAt": "2026-03-16T20:28:02+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["ほうれい線"]}, {"id": "3968272051169391637", "username": "eririe_biyou", "text": "白髪ほぼゼロ41歳の\n頭皮ケア\nこの3つは旅行にも連れて行きます", "permalink": "https://www.threads.com/@eririe_biyou/post/DcSImfeD_QV", "likes": 204, "velocity": 0.68, "ageHours": 299.4, "postedAt": "2026-08-21T10:15:13+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3866811341659434601", "username": "erikofujishiro.stylist", "text": "ちょっとでも、暑い室内にいると\n顔すぐ赤みがでる\nこれも、4,5年前にした\nフォトフェイシャルのせい\nセルラムで随分よくなって\nほぼ気にならなくなったけど\nこういう赤みと同じ悩みの人いるかなぁ🤔", "permalink": "https://www.threads.com/@erikofujishiro.stylist/post/DWprG2RD-5p", "likes": 203, "velocity": 0.06, "ageHours": 3659.2, "postedAt": "2026-04-03T10:30:54+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["フェイシャルエステ"]}, {"id": "3967088645752783029", "username": "yuri_migaku", "text": "無印の頭皮ケア、グレーとピンク何が違う？\n\nグレーは頭皮環境を整える育毛ローション。\nピンクは発毛促進のエイジングケアエッセンス。\n\n私は朝グレー、夜ピンクで使い分けてる。", "permalink": "https://www.threads.com/@yuri_migaku/post/DcN7hrSlIC1", "likes": 198, "velocity": 0.58, "ageHour , "text": "トリートメントを断ったら美容師さんめっちゃ怖い顔になった。理論上髪にとっていいことはわかってるけど、髪の悩みないし、過去に効果を感じ取れんかった鈍感なので、必要ないんだよね。悩みと言えば、剛毛、多毛。熱弁されるだけこっちは引いてしまう。なかなか食い下がってくれないので、次に考えときますって言うたら次の予約して帰ってくださいって言われた。あー😩", "permalink": "https://www.threads.com/@awamo.chi/post/Da7R10Gkcen", "likes": 192, "velocity": 0.17, "ageHours": 1109.0, "postedAt": "2026-07-18T16:42:02+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3861097823849227129", "username": "lbc.lula_dr.k.hashimoto", "text": "どちらの顔が魅力的ですか？？", "permalink": "https://www.threads.com/@lbc.lula_dr.k.hashimoto/post/DWVYAOJkSN5", "likes": 185, "velocity": 0.05, "ageHours": 3848.4, "postedAt": "2026-03-26T13:19:10+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["小顔"]}, {"id": "3894730200345784701", "username": "liliy_keanabukkero", "text": "【閲覧注意🚨】\n36歳、本気の毛穴撲滅運動はじめました。\n\n１週間くらい前から、ちょこちょこ毛穴をブッコロリできると噂のあれやこれやを購入して、朝晩のケアを頑張ってます。\n\n1人で頑張ってるのもアレなので、スレッズの皆さんに私の頑張りを見てもろて、モチベ上げたいと思いました！\n\n中学時代、顔中のニキビに人生詰むほど悩まされた結果なのか、頬はかっぴらき毛穴、鼻は黒ずみと穴だらけ。今はニキビはあまりできませんが、とにかく毛穴がひでぇです。\n\n大人になってもニキビが治ったことが嬉しすぎて、あんまり他のシミとかたるみとか毛穴とか気にしていなくて、紫外線ケアも怠った結果、酷い有様です🥹🥹🥹お目み汚しすまん🥹🥹🥹\n\nこれからできるだけ毎日投稿します！\nどんなの使ってるのかも載せます！\n有識者の方アドバイスください！\n日本・韓国・世界中でもいいので、コスパの良いコスメあったら買って試します💪\n\nとりあえずday1(ケアして１週間目)", "permalink": "https://www.threads.com/@liliy_keanabukkero/post/DYM3HtnmLF9", "likes": 185, "velocity": 0.07, "ageHours": 2734.7, "postedAt": "2026-05-11T23:00:41+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["毛穴 ケア"]}, {"id": "3930846753360836398", "username": "ayu_aaa10", "text": "口横のたるみに悩んでるアラフォーたち、よく聞いてください。\n\n40歳の私が「これは効いた」と思った施術はオンダリフト。ウルトラフォーマーMPTもかなり効くけど、とにかく激痛。\nオンダリフトは、痛みに弱い人にも受けやすい施術。ほんのり温かいくらいで、効果をジワジワ実感できる。\n\nただし、何度も言っているように適応は人それぞれ。いきなりコース契約する前に、必ず信頼できる医師にしっかり相談してほしい。約束だぞ。", "permalink": "https://www.threads.com/@ayu_aaa10/post/DaNLEuwkfcu", "likes": 184, "velocity": 0.12, "ageHours": 1538.7, "postedAt": "2026-06-30T18:57:50+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["たるみ 改善"]}, {"id": "3933399815560461097", "username": "coco.cosme.room", "text": "整形した？？ってレベ 21305", "username": "a.s_0229", "text": "threadsこれいいよって見かけて、ローソンにあったから早速買ってみたけど…\n\nどうやって使うんやっけ😅\n\nとりあえずコームで頭マッサージしてみたけど、ただ櫛の背で頭かいてる人みたいになっちゃって、でも元投稿も見つけられず一旦髪とかしといた😂", "permalink": "https://www.threads.com/@a.s_0229/post/DXn2eG3gWOZ", "likes": 154, "velocity": 0.05, "ageHours": 3079.6, "postedAt": "2026-04-27T14:03:07+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3964806846440195551", "username": "jellyfish.water0826", "text": "理想は一枚目のようなニュアンスシニヨン。ただ、毛量が多く、難しいと思うので、その場合は二枚目のような感じになると嬉しい。あまりボリューム感がありすぎたり、きっちりしすぎると顔タイプに合わないためゆるっとして欲しいとオーダーしました。結果、3枚目。もう少しゆるっとしたいと一度言ってみましたが、あまり変わらず。かなりボリューム感は抑えていただいたのでこれを最終としました。美容師さん曰く、ドレスを着たらもっと馴染む。髪色が違うから違うと印象が変わるからとのこと。ここからどのようにすれば私の理想に近づくのでしょうか…。やはり毛量多いとニュアンスは無理ですか(；；)先輩花嫁さん、美容師さん助けてください(；；)", "permalink": "https://www.threads.com/@jellyfish.water0826/post/DcF0tIFGsXf", "likes": 153, "velocity": 0.37, "ageHours": 414.2, "postedAt": "2026-08-16T15:30:29+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3922845531412524301", "username": "kumi_biyo_official", "text": "40代にはちょいエロい話、、、ほうれい線って、単に脂肪が落ちてきてるだけ。筋肉がたら〜っとなって支えられんくて下がる。口角が下がる、二重アゴ、これ意外やけど原因は同じ。たでも3分で鍛えられる方法があってな、、、", "permalink": "https://www.threads.com/@kumi_biyo_official/post/DZwvzoIkm0N", "likes": 152, "velocity": 0.08, "ageHours": 1803.7, "postedAt": "2026-06-19T18:00:50+09:00", "genres": ["フェイシャル・小顔", "たるみ・シワ"], "keywords": ["ほうれい線"]}, {"id": "3934479249416495633", "username": "1848_iyashiya", "text": "みなさんに伺いたいです。\n一般的なリンパマッサージ店では鼠蹊部までリンパを流してもらえないと思いますが可能であれば流してもらいたいですか？", "permalink": "https://www.threads.com/@1848_iyashiya/post/DaaFAgVnaIR", "likes": 150, "velocity": 0.11, "ageHours": 1418.5, "postedAt": "2026-07-05T19:14:57+09:00", "genres": ["むくみ・冷え"], "keywords": ["リンパ マッサージ"]}, {"id": "3891810303192694607", "username": "miyu838383", "text": "32歳。フォトフェイシャル10回ほど当てましたがこの細かいシミが消えません😭肌が弱く定期的に全ての化粧品が沁みて赤くなる時期が来ます。\nなんの治療が最適でしょうか‥\nビタミンCなどは合いません😢", "permalink": "https://www.threads.com/@miyu838383/post/DYCfNnfAX9P", "likes": 149, "velocity" "], "keywords": ["毛穴 ケア"]}, {"id": "3940665775656995508", "username": "suu_mon8", "text": "みんないつの間に脱毛やってたん\n\nって20年前くらいから思ってて、やっと重い腰を上げて40を軽く過ぎて初脱毛の予約した。\n\n我が子には私みたいにならんように脱毛代プレゼントしてあげよう。何歳くらいからするんやろ。", "permalink": "https://www.threads.com/@suu_mon8/post/DawDqT4kwq0", "likes": 142, "velocity": 0.12, "ageHours": 1213.6, "postedAt": "2026-07-14T08:06:29+09:00", "genres": ["脱毛"], "keywords": ["医療脱毛"]}, {"id": "3970703971845360419", "username": "poteusa_biyou", "text": "嘘みたいな本当の話なんですけど、白髪は染めるより先に、作らせん方が安いんよ。紗栄子がインスタで、白髪はスキンケアと同じで仕込みの結果、って言うてて、月2回染めに行ってる人ほど効きが早い。作る材料は4つで、", "permalink": "https://www.threads.com/@poteusa_biyou/post/DcaxjmGE0sj", "likes": 140, "velocity": 0.64, "ageHours": 218.9, "postedAt": "2026-08-24T18:47:06+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3899760652303638183", "username": "touka.k2304", "text": "リンパマッサージ90分(体験価格)￥2650円\n受けてみたい方いらっしゃいませんか？", "permalink": "https://www.threads.com/@touka.k2304/post/DYeu6bFmp6n", "likes": 139, "velocity": 0.05, "ageHours": 2568.1, "postedAt": "2026-05-18T21:35:18+09:00", "genres": ["むくみ・冷え"], "keywords": ["リンパ マッサージ"]}, {"id": "3892500007438359545", "username": "yokorin91", "text": "自律神経が乱れている人は、\n【首肩まわりがガチガチ】なことが多いです。\n実は、首・肩・鎖骨まわりが硬くなると血流やリンパ、神経の流れが悪くなり\n・頭痛 ・めまい ・首こり ・呼吸の浅さ ・だるさ ・不眠 こういう不調につながりやすくなります。\nそこでおすすめなのが、", "permalink": "https://www.threads.com/@yokorin91/post/DYE8CInkZv5", "likes": 138, "velocity": 0.05, "ageHours": 2808.5, "postedAt": "2026-05-08T21:09:42+09:00", "genres": ["エステ・リラクゼーション"], "keywords": ["眼精疲労"]}, {"id": "3857534247078792560", "username": "u__pa_ru_pa__", "text": "ラッシュのまつ毛美容液ずっと使ってたんですけど、同じくらい伸びて色素沈着の心配もない美容液を3,000円で見つけてしまって🥹1万円が3,000円って普通に神すぎる、、", "permalink": "https://www.threads.com/@u__pa_ru_pa__/post/DWItvWqCQ1w", "likes": 137, "velocity": 0.03, "ageHours": 3966.4, "postedAt": "2026-03-21T15:18:58+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["育毛剤"]}, {"id": "3848993977123682414", "username": "rooo_shiho", "text": "どうやって痩せたら良いかわからん🫠🫠\n食べる量減らしても、全く痩せない\nむしろ身体の半分以上が脂肪😇😇40代でも痩せる方は教えてください", "permalink": "https://www.threads.com/@rooo_shiho/post/DVqX6EdEzhu", "likes": 137, "velocity": 0.03, "ageHours": 4249.2, "postedAt": "2026-03-09T20:30:59+09:00", "genres": ["ダイエット・痩身"], "keywords": ["部分痩せ"]}, {"id": "3874458260103975326", "username": "q.o.v.2012", "text": "誰も教えてくれないけど、最近目が小さくなった気がしてアイクリーム塗りたくってる人それ原因は目じゃなくてガチガチに固まった「頭皮と生え際の癒着」ですよ！スマホ見すぎておでこの筋肉が冬眠して動かなくなるとまぶたの皮ふが重力に負けて二重幅を押し潰すのは当然の結末！目をいじっても皮ふが伸びて余計に老けるだけだから今すぐ拳の関節を生え際に当てて上にグイグイ持ち上げながら揺らしてみて！おでこの吊り上げスイッチがオンになれば埋もれてた二重は勝手に復活するし視界もパッと明るくなるから！10年前の目力を取り戻したいなら生え際を疑って！", "permalink": "https://www.threads.com/@q.o.v.2012/post/DXE10KCk1Ge", "likes": 136, "velocity": 0.04, "ageHours": 3406.0, "postedAt": "2026-04-13T23:43:58+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3962582826583434838", "username": "nana_shi_69", "text": "美容室で流すついでに頭皮マッサージを軽くしてくれるんだけど、終わると毎回頭痛がする。\nこれって私の頭がカッチコチで血流が良くなったからってこと😭？", "permalink": "https://www.threads.com/@nana_shi_69/post/Db97BYLkaZW", "likes": 135, "velocity": 0.28, "ageHours": 487.8, "postedAt": "2026-08-13T13:51:45+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ", "頭皮ケア"]}, {"id": "3854503247730682226", "username": "biyou._.m", "text": "断言するけど、30代は全員「糸リフト」やった方がいい🫩フェイスラインがシュッとする。ほうれい線も薄くなる。年1回でいい。「糸リフトは金ドブ」って言う人いるけど、金ドブなわけないからね🫩(ちゃんとしたドクターならねwww) あ、でも、ガチ1つだけ注意点があって、", "permalink": "https://www.threads.com/@biyou._.m/post/DV98kgik6ly", "likes": 134, "velocity": 0.03, "ageHours": 4066.8, "postedAt": "2026-03-17T10:56:55+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3954101098920264315", "username": "tsuyako_mamabiyou", "text": "インナードライの人、テカってるってことは油分はすでに出てるの。そこに乳液やクリームで油分を足してたら、毛穴は一生開いたまま。それが「インナードライが改善しない」の正体。実はインナードライは乾燥肌がなるものじゃなくて、脂性肌がなるもの。乳液を足せば収まると思ってたのが逆効果だったってこと。じゃあどうすればいいかっていうと、", "permalink": "https://www.threads.com/@tsuyako_mamabiyou/post/Dbfyf_vH8J7", "likes": 134, "velocity": 0.17, "ageHours": 768.7, "postedAt": "2026-08-01T21:00:08+09:00", "genres": ["くすみ・美白"], "keywords": ["肌 透明感"]}, {"id": "3934158319770642455", "username": "mm_ms21", "text": "とうとう予約を入れてしまった\n緊張するー\nどんな態勢で受けるの？\n股開いておくの？ハズカシイー笑\nとりあえず水曜日行ってきます医療脱毛へ", "permalink": "https://www.threads.com/@mm_ms21/post/DaY8CXUE6gX", "likes": 134, "velocity": 0.09, "ageHours": 1429.1, "postedAt": "2026-07-05T08:37:20+09:00", "genres": ["脱毛"], "keywords": ["脱毛 サロン", "医療脱毛", "VIO脱毛"]}, {"id": "3963518350563856042", "username": "sekichisa0821", "text": "えっ！！！\nミュゼも破産したの？！？！\n脱毛サロンは潰れやすいんだなとは思ってたけど\nミュゼは結構大手な方だったよね？！？！\nいやもうほんとに脱毛はどこだから安心とかじゃなくて\n割高になってもその都度払い以外やめた方がいいんだな😂", "permalink": "https://www.threads.com/@sekichisa0821/post/DcBPvCyGc6q", "likes": 134, "velocity": 0.29, "ageHours": 456.9, "postedAt": "2026-08-14T20:50:28+09:00", "genres": ["脱毛"], "keywords": ["脱毛 サロン"]}, {"id": "3959990019108383467", "username": "biyo_.honne_emi", "text": "全女性に伝えたい。美容医療なしでほうれい線を目立たなくするのに『ゼラチン』は最強なんだけど、単体で食べるともったいない。この5つの組み合わせで食べて。", "permalink": "https://www.threads.com/@biyo_.honne_emi/post/Db0tfEDDCrr", "likes": 132, "velocity": 0.23, "ageHours": 573.7, "postedAt": "2026-08-10T00:00:18+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["ほうれい線"]}, {"id": "3899603620421872216", "username": "avec_toitoitoi.303", "text": "6月から抗がん剤が始まります。１年以内に再発の可能性が半分以上…こわいな…。\n抗がん剤で脱毛もします…。まず髪の毛どうしたらいいですか？ウィッグどれがいいのかとか教えて下さい😭😭😭", "permalink": "https://www.threads.com/@avec_toitoitoi.303/post/DYeLNTwEqpY", "likes": 130, "velocity": 0.05, "ageHours": 2573.3, "postedAt": "2026-05-18T16:23:18+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3877141366917037888", "username": "tegakimoji_n", "text": "お肌つやっつやのお姉さんたちは\n何をしてるんですか？\nどうしたらつやんつやんになれますか？", "permalink": "https://www.threads.com/@tegakimoji_n/post/DXOX4f_D_9A", "likes": 129, "velocity": 0.04, "ageHours": 3317.1, "postedAt": "2026-04-17T16:34:49+09:00", "genres": ["くすみ・美白"], "keywords": ["肌 透明感"]}, {"id": "3907264723700362662", "username": "mm_ms21", "text": "VIOの脱毛したいんだけど大体何回くらいでツルッツルになるの？？？誰か教えて〜", "permalink": "https://www.threads.com/@mm_ms21/post/DY5ZJCLky2m", "likes": 129, "velocity": 0.06, "ageHours": 2319.6, "postedAt": "2026-05-29T06:04:33+09:00", "genres": ["脱毛"], "keywords": ["医療脱毛", "VIO脱毛"]}, {"id": "3972866317908676313", "username": "lala_beauty_days", "text": "何万回でも言うわよ！！！\n自律神経が乱れてしんどい人、実際にやってよかったことまとめたから今すぐできるものから試して！！！", "permalink": "https://www.threads.com/@lala_beauty_days/post/DcidN3zD47Z", "likes": 129, "velocity": 0.88, "ageHours": 147.3, "postedAt": "2026-08-27T18:23:12+09:00", "genres": ["エステ・リラクゼーション"], "keywords": ["自律神経 整える"]}, {"id": "3961691123827812764", "username": "4mvucgbfyl44174", "text": "顎ニキビさえなくなれば\n肌綺麗なのに。\n治り悪いし、触ってしまう。", "permalink": "https://www.threads.com/@4mvucgbfyl44174/post/Db6wRZRkymc", "likes": 127, "velocity": 0.25, "ageHours": 517.4, "postedAt": "2026-08-12T08:20:06+09:00", "genres": ["毛穴・ニキビ"], "keywords": ["ニキビ 治し方", "大人ニキビ"]}, {"id": "3866945034813771995", "username": "haaruu322", "text": "今日お試しで行ったフェイシャルエステが\n過去一良くて感動。\n\n商品勧められたけど、無理な押し売り\n一切なくて尚更感動。\n\nただ、高すぎる。まじで高すぎる。\n良いのは分かる。そりゃこんだけ良かったら\n高いのもわかる。\n\nでも、こんな高いの定期的に買える\n財力の人間ってひと握りすぎないか？\n\nでも、そりゃこんだけ良ければ仕方ないか。\nって思えるくらい、やっぱ良かった。", "permalink": "https://www.threads.com/@haaruu322/post/DWqJgVuCRDb", "likes": 126, "velocity": 0.03, "ageHours": 3654.8, "postedAt": "2026-04-03T14:56:32+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["フェイシャルエステ"]}, {"id": "3937438874434808231", "username": "hara_diett", "text": "知ってほしい。ほうれい線が年々濃くなってる、マッサージしても消えないという30代・40代の方へ。美容外科分野の研究で、ほうれい線の正体は「皮膚のたるみ」だけじゃなく「骨の凹み」だと分かっている。鼻の脇の骨(梨状孔)は加齢で溶けて縁が広がり、そこに皮膚と脂肪が落ち込んでほうれい線になる。マッサージや表情筋トレで消そうとするよりも、", "permalink": "https://www.threads.com/@hara_diett/post/Dakl8t7gCmn", "likes": 126, "velocity": 0.1, "ageHours": 1320.4, "postedAt": "2026-07-09T21:15:12+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["ほうれい線"]}, {"id": "3974395098708283813", "username": "kiri.beautylog", "text": "紗栄子様の愛用スティック。気になるとこにサッと塗るだけで小ジワもほうれい線もハリが出て一気に若見えする…", "permalink": "https://www.threads.com/@kiri.beautylog/post/Dcn40j3j5Gl", "likes": 124, "velocity": 1.28, "ageHours": 96.7, "postedAt": 8-15T19:18:59+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["育毛剤"]}, {"id": "3905224365051152063", "username": "gomesu_maru", "text": "またもやスレ民の手のひらの上でクルクル踊ってみた。\nたしかに首から肩にかけてのマッサージには良かったんだよね。\n\nでも、頭皮のマッサージなら…", "permalink": "https://www.threads.com/@gomesu_maru/post/DYyJN6HEwa_", "likes": 116, "velocity": 0.05, "ageHours": 2387.2, "postedAt": "2026-05-26T10:30:43+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3898027679908351190", "username": "amu_keana", "text": "マジで1億回言うけど、美肌になりたいなら食事を見直して。\nスキンケアに1万円使う前に、スーパーで3千円使って。選ぶ食材次第で肌の状態が全然変わる。「美肌の一歩は食事から」だよ！\n美肌を叶える食材は9種類あって、￼", "permalink": "https://www.threads.com/@amu_keana/post/DYYk4Wxk8zW", "likes": 116, "velocity": 0.04, "ageHours": 2625.5, "postedAt": "2026-05-16T12:12:12+09:00", "genres": ["くすみ・美白"], "keywords": ["肌 透明感"]}, {"id": "3962410355460913813", "username": "kanamama369", "text": "小3の娘が、手足のムダ毛を気にし始めました💦\n普通に剃るのが良いのか、何かしら小学生でもできるムダ毛処理を知りませんか？", "permalink": "https://www.threads.com/@kanamama369/post/Db9Tzl7k7qV", "likes": 115, "velocity": 0.23, "ageHours": 493.5, "postedAt": "2026-08-13T08:09:05+09:00", "genres": ["脱毛"], "keywords": ["毛深い 悩み"]}, {"id": "3922859231871082104", "username": "aya.kogao", "text": "「顔がたるんできた…」という人は\nまず顔じゃなく、ここを3秒引っ張る！\n\nここにはお顔を上に引き上げる\n筋肉があります。\n\nここがガチガチだと\n頬も口角も目元も下がりやすい。\n\nここのやり方は、1番上の固定投稿\n動画3つ目です🫶", "permalink": "https://www.threads.com/@aya.kogao/post/DZwy6_riZ54", "likes": 114, "velocity": 0.06, "ageHours": 1803.2, "postedAt": "2026-06-19T18:28:03+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["小顔"]}, {"id": "3976179315415533882", "username": "haaaa___ru", "text": "顔のたるみがヤバい！\nリフトアップしなきゃ！！どうやるの？！\nハリに効果あるやつは？！\nみなさま、教えてください！🙇‍♀️💦", "permalink": "https://www.threads.com/@haaaa___ru/post/DcuOgVKmUk6", "likes": 113, "velocity": 3.0, "ageHours": 37.6, "postedAt": "2026-09-01T08:05:33+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3911169870570662144", "username": "raaamen__0141", "text": "眉毛パーマ行ってきたんだが、、、\n明らかに左右違うよな\n右だけすごい抜かれるし眉毛描かれてたから\n車戻ってソッコー拭いたらこんなことに。\nなんじゃこれ🤦‍♀️\n右だけ眉毛離れてるのでとか言われたけど、関係ある？笑\nまぁ、毛は生えてくるからいいか。", "permalink": "https://www.threads.com/@raaamen__0141/post/DZHREZnkykA", "likes": 111, "velocity": 0.05, "ageHours": 2190.3, "postedAt": "2026-06-03T15:23:23+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3907730165212631734", "username": "ra_ra_item", "text": "クマやほうれい線でお悩みの方へ。この方法なら「5歳若返った？」って褒められるかも。ぜひ試してみてね✨", "permalink": "https://www.threads.com/@ra_ra_item/post/DY7C-GXk9K2", "likes": 111, "velocity": 0.05, "ageHours": 2304.2, "postedAt": "2026-05-29T21:29:18+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["ほうれい線"]}, {"id": "3867450358696742065", "username": "calm_0915", "text": "フェイシャルエステされてる方、自宅サロンされてる方\nまだオープンしたばかりなので認知も薄くお客様も中々平日や土日予約入りません。集客方法色々教えてください。\n宜しくお願いします😊", "permalink": "https://www.threads.com/@calm_0915/post/DWr8ZxQk4yx", "likes": 109, "velocity": 0.03, "ageHours": 3638.0, "postedAt": "2026-04-04T07:40:31+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["フェイシャルエステ"]}, {"id": "3880501030316834708", "username": "ichiko1001", "text": "このほうれい線はもう医療じゃないと無理よね？", "permalink": "https://www.threads.com/@ichiko1001/post/DXaTyCWkn-U", "likes": 109, "velocity": 0.03, "ageHours": 3205.9, "postedAt": "2026-04-22T07:49:52+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["ほうれい線"]}, {"id": "3901192872272003978", "username": "jimu_neesan", "text": "なんかかわいくなった？って思われる施術5選\n※個人的な意見です\n5位：ハイフ\n→たるみが引き上がって輪郭がすっきり\n気づいたら「なんか顔小さくなった？」って言われる👀\n4位：エラボトックス\n→ハイフのあとにやると小顔効果が倍増する\nセットでやってる人が多いのわかる気がする😌\n3位：埋没\n→もともと二重の人でも幅を広げたりぱっちりさせるのにおすすめ\n目の印象が変わるだけで顔全体が変わる✨", "permalink": "https://www.threads.com/@jimu_neesan/post/DYj0j94DwOK", "likes": 108, "velocity": 0.04, "ageHours": 2520.7, "postedAt": "2026-05-20T21:00:52+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["小顔"]}, {"id": "3911301723390575607", "username": "koziwatyann_biyou", "text": "いいか、40代。\n40代で美容医療をしなかった人の50代の差をエグいほど見てきた。だから偉そうに言うで。40代が月1でやると肌質が激変する美容医療は、", "permalink": "https://www.threads.com/@koziwatyann_biyou/post/DZHvDHIEYP3", "likes": 108, "velocity": 0.05, "ageHours": 2185.9, "postedAt": "2026-06-03T19:45:21+09:00", "genres": ["フェイシャル・小顔", "たるみ・シワ"], "keywords": ["フェイシャルエステ", "エイジングケア"]}, {"id": "3958230531649885897", "username": "aaa.w25", "text": "医療脱毛でVIO脱毛をしてもらう予定が生理で急遽できなくなったんだけど、そのままVI O込みの料金で払わないといけなくて、払ったんだけど、、、\n\nやってないのに取られることある？？", "permalink": "https://www.threads.com/@aaa.w25/post/DbudbJqGNbJ", "likes": 108, "velocity": 0.17, "ageHours": 632.0, "postedAt": "2026-08-07T13:44:31+09:00", "genres": ["脱毛"], "keywords": ["医療脱毛"]}, {"id": "3972283850181943787", "username": "micco_nandemoya", "text": "1ヶ月で5キロ痩せたよ！\nなど短期間で痩せた方法教えてください涙\n\n母からは食うな！と言われましたが\n現実的に難しいので可能な方法知りたいです！\n\nとくに30代40代の人だと嬉しいです！", "permalink": "https://www.threads.com/@micco_nandemoya/post/DcgYx2dHaHr", "likes": 106, "velocity": 0.64, "ageHours": 166.6, "postedAt": "2026-08-26T23:05:57+09:00", "genres": ["ダイエット・痩身"], "keywords": ["部分痩せ"]}, {"id": "3890391113812067236", "username": "mokon_chan", "text": "たぶん、これを知っていたら何万円も無駄にしなかった。\n薄毛には育毛剤。抜け毛には頭皮マッサージ。\nそう信じて、ドラッグストアで話題の育毛シャンプーを買い続けた。口コミの良いサプリも、頭皮用美容液も、惜しみなく使った。\nそれでも、一向に変化は感じられなくて。\n転機は、国際中医師のいる育毛サロンへ行った時。頭皮を診てもらう覚悟でいたら、先生が最初に触れたのは、", "permalink": "https://www.threads.com/@mokon_chan/post/DX9chsYGsOk", "likes": 105, "velocity": 0.04, "ageHours": 2878.4, "postedAt": "2026-05-05T23:19:42+09:00", "genres": ["薄毛", "育毛・頭皮ケア"], "keywords": ["薄毛 対策", "抜け毛 対策", "育毛剤"]}, {"id": "3889503863628222282", "username": "t.masa21", "text": "50代で前半です。ハイフを2週間前に受けて何も変わらんのだけどこんなもん？？\n口横たるみとほうれい線が気になって\n-10歳とかじゃなくて、すごい若返らなくていいから、そこそこ口横のたるみがなくなればって感じで思ってるのだけど、脂肪吸引してリフトアップとか\n50万前後かかる施術ばかり言われるのだけどそうするしかないのでしょうか？数万で-5歳くらいは無理なのかなぁ。。\n誰か詳しい人ご教授お願いします！\n#美容\n#美容医療", "permalink": "https://www.threads.com/@t.masa21/post/DX6SygQEc9K", "likes": 105, "velocity": 0.04, "ageHours": 2907.8, "postedAt": "2026-05-04T17:56:54+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3943505048051602353", "username": "neurobeauty_toshi_gunma", "text": "耳の上がリフトアップの鍵。\n顔は頭皮から引き上がる。\nたるみは側頭筋で変わる。\n首肩ゆるめて若返る。\n整形級リフトアップ3選。", "permalink": "https://www.threads.com/@neurobeauty_toshi_gunma/post/Da6JPKXE1Ox", "likes": 104, "velocity": 0.09, "ageHours": 1119.6, "postedAt": "2026-07-18T06:07:56+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3910641240702634762", "username": "_nana948", "text": "まじで髪多すぎて困る\n植毛があるなら減毛（？）もできるようになってほしい\n髪をすくにしても限界があるし、すきすぎたら逆に髪広がるから毛根から根絶やしたいの〜〜〜", "permalink": "https://www.threads.com/@_nana948/post/DZFY30sEssK", "likes": 104, "velocity": 0.05, "ageHours": 2207.8, "postedAt": "2026-06-02T21:53:06+09:00", "genres": ["脱毛"], "keywords": ["毛深い 悩み"]}, {"id": "3912080653869523386", "username": "mu.__.61", "text": "閲覧注意⚠️\n汚い肌を晒して申し訳ありません、、\n美容スペシャリストの皆様にアドバイスをいただきたいです😭😭\n毛穴に赤ら顔が気になります。美容の知識はあまりなくお力添えをお願いできればと思っております。\n今Qoo10メガ割しているので、スキンケアのおすすめもしていただけると幸いです😭😭\nよろしくお願いいたします😭😭\n30代前半でございます、、", "permalink": "https://www.threads.com/@mu.__.61/post/DZKgKCqkiG6", "likes": 101, "velocity": 0.05, "ageHours": 2160.2, "postedAt": "2026-06-04T21:32:57+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["毛穴 ケア"]}, {"id": "3921395583118682652", "username": "japan_4192", "text": "更年期！！抜け毛！！\nどうしたら良いのーーーーー😭？", "permalink": "https://www.threads.com/@japan_4192/post/DZrmIGjkyoc", "likes": 99, "velocity": 0.05, "ageHours": 1851.7, "postedAt": "2026-06-17T18:00:03+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3946883293929172004", "username": "saki_kounenki_totonou", "text": "更年期になると、顔がたるみます。ほうれい線は深くなるし、鏡に映る老け顔にげんなり。何だか顔が四角くなった、なんてことも増えます。これ、老化のスピードが早いとかそういう話じゃないんです。", "permalink": "https://www.threads.com/@saki_kounenki_totonou/post/DbGJXHAkmwk", "likes": 99, "velocity": 0.1, "ageHours": 1007.7, "postedAt": "2026-07-22T21:59:35+09:00", "genres": ["フェイシャル・小顔", "たるみ・シワ"], "keywords": ["たるみ 改善", "ほうれい線"]}, {"id": "3959808674952717254", "username": "antyan_beauty", "text": "更年期の女性へ。毎朝コーヒーに5gの『ゼラチン』入れて飲んで。肌にハリがでる、髪にコシがでる、骨が丈夫になる。ただ、飲み方を間違えると効果ゼロで、", "permalink": "https://www.threads.com/@antyan_beauty/post/Db0EQKJESPG", "likes": 99, "velocity": 0.17, "ageHours": 579.7, "postedAt": "2026-08-09T18:00:00+09:00", "genres": ["たるみ・シワ"], "keywords": ["肌 ハリ"]}, {"id": "3929373008171438639", "username": "nozoko_san", "text": "VIO脱毛のIって中央部分の毛ちゃんと当てられてるんだろうか。", "permalink": "https://www.threads.com/@nozoko_san/post/DaH7-6mERIv", "likes": 97, "velocity": 0.06, "ageHours": 1587.5, "postedAt": "2026-06-28T18:09:46+09:00", "genres": ["脱毛"], "keywords": ["VIO脱毛"]}, {"id": "3917112920132314195", "username": "satochan_biyou_", "text": "皮膚科で働いてきて、ずっと言えんかったことがあります。ニキビ跡の色素沈着で通院してくる方に、本当のことを言えてなかったです。\nニキビを潰すたびに、色素沈着が倍になります。", "permalink": "https://www.threads.com/@satochan_biyou_/post/DZcYXJ1lGRT", "likes": 96, "velocity": 0.05, "ageHours": 1993.5, "postedAt": "2026-06-11T20:11:10+09:00", "genres": ["毛穴・ニキビ"], "keywords": ["大人ニキビ"]}, {"id": "3933090886112502532", "username": "kara_fulllove", "text": "ポポンSが思春期のニキビに効果あり！と言う投稿見てチャレンジしてみた👍\n高一男子、ニキビ以外にも肌や見た目を気にする年頃。\n飲みはじめたばかりだけど、少しずつ良くなってるっぽい💕今後に", "permalink": "https://www.threads.com/@kara_fulllove/post/DaVJVKQD-ME", "likes": 96, "velocity": 0.07, "ageHours": 1464.4, "postedAt": "2026-07-03T21:16:32+09:00", "genres": ["毛穴・ニキビ"], "keywords": ["大人ニキビ"]}, {"id": "3898746252405850179", "username": "coco.starry", "text": "VIO脱毛をしてみたいけど恥ずかしい💦って思いますよね？ぶっちゃけスタッフはこう思ってますよ…", "permalink": "https://www.threads.com/@coco.starry/post/DYbIQ9kCUBD", "likes": 95, "velocity": 0.04, "ageHours": 2601.7, "postedAt": "2026-05-17T11:59:52+09:00", "genres": ["脱毛"], "keywords": ["脱毛 サロン", "医療脱毛"]}, {"id": "3951198929320911262", "username": "tanukichi_jibunmigaki", "text": "すっぴんで申し訳ないのだが\n写真の通り頬のコケ ほうれい線 毛穴が気になる…\n美容医療で一応カウンセリングいくつもりだが\n他になにかオススメのやるべき事や美容液とかありませんか？？\n40代になり悩みが多すぎて追いつかない😭", "permalink": "https://www.threads.com/@tanukichi_jibunmigaki/post/DbVen3rE6Ge", "likes": 94, "velocity": 0.11, "ageHours": 864.8, "postedAt": "2026-07-28T20:53:58+09:00", "genres": ["フェイシャル・小顔", "たるみ・シワ"], "keywords": ["ほうれい線"]}, {"id": "3885181545376368938", "username": "seitailien_koga", "text": "まぶたが重い原因、\n「皮膚のたるみ」だと思ってませんか？\n\n実はこれ、\n上眼瞼挙筋という筋肉がうまく働いていないだけの可能性が高いです。\n\nこの状態が続くと\n・目が小さく見える\n・眠そうな印象になる\n・おでこのシワが増える\n・顔全体が老けて見える\n\nといった変化が起こります。\n\n逆にいうと、\nこの筋肉をしっかり使えるようにするだけで\n目の開きや印象は大きく変わります。\n\n動画内で紹介しているケア、\nまずは1週間続けてみてください。", "permalink": "https://www.threads.com/@seitailien_koga/post/DXq8AfsD8kq", "likes": 93, "velocity": 0.03, "ageHours": 3050.9, "postedAt": "2026-04-28T18:49:15+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["ほうれい線"]}, {"id": "3976294738609975408", "username": "asakatsunosusume", "text": "20代前半から、分け目ハゲ後頭部ハゲがひどくてずっと見て見ぬふりしてたけど頑張って改善してみようとロクシタンの育毛剤買って見た🥺🥺\n\nあんまりネットでビフォーアフター載ってないから経過報告もしてみる。\n\n前から見るとそこまで目立たないけど上から見られた時にはもう終わるハゲかた😭😭\n\n#若ハゲ\n#ロクシタン\n#育毛剤\n#ヘアケア\n#アドバンストスカルプケア", "permalink": "https://www.threads.com/@asakatsunosusume/post/Dcuov9ZGjBw", "likes": 93, "velocity": 2.75, "ageHours": 33.8, "postedAt": "2026-09-01T11:54:52+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["育毛剤"]}, {"id": "3880667977984607332", "username": "akko.7974", "text": "肩こりめまい眼精疲労がずっと続いてて地味にしんどい😢\nストレスからの自律神経乱れてるのかな？", "permalink": "https://www.threads.com/@akko.7974/post/DXa5vcfAYRk", "likes": 93, "velocity": 0.03, "ageHours": 3200.3, "postedAt": "2026-04-22T13:21:34+09:00", "genres": ["エステ・リラクゼーション"], "keywords": ["自律神経 整える"]}, {"id": "3858881420698638710", "username": "jimny.xlxlx", "text": "もしかしてちょっとリフトアップした方がもっとかっこよくなるのかなぁ？とたまに思います😂自分で納得した上で乗り心地\u0026純正ホイールを優先して今の状態ですが、タイヤそのままでリフトアップすると変でしょうか(´～｀)？オフロードのためではなく、あくまで見た目のため…✨", "permalink": "https://www.threads.com/@jimny.xlxlx/post/DWNgDT3GNl2", "likes": 92, "velocity": 0.02, "ageHours": 3921.8, "postedAt": "2026-03-23T11:55:34+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3974235592230277909", "username": "aabbcc5466", "text": "たるみと、ほうれい線が気になるのだけど、おすすめの美容医療を知りたいです。\nハイフ気になってるのですが、調べたら、\n頬がこける…とあったのですがどうでしょうか？", "permalink": "https://www.threads.com/@aabbcc5466/post/DcnUjb4mZMV", "likes": 92, "velocity": 0.9, "ageHours": 102.0, "postedAt": "2026-08-29T15:43:43+09:00", "genres": ["フェイシャル・小顔", "たるみ・シワ"], "keywords": ["ほうれい線"]}, {"id": "3884463631703015114", "username": "ichkyo", "text": "ケンザンで頭皮マッサージするやつ、そういや似たようなの買った買った、ってひっぱり出してきてやったら、風呂場で飛び上がるほど痛くて…\n頭皮ってこんな痛いものなの⁉️", "permalink": "https://www.threads.com/@ichkyo/post/DXoYxeelP7K", "likes": 92, "velocity": 0.03, "ageHours": 3074.7, "postedAt": "2026-04-27T19:02:51+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3939203457261747240", "username": "yokoyoko3053", "text": "48歳です。フェイスラインのたるみがやばすぎる。リフトアップしたい。", "permalink": "https://www.threads.com/@yokoyoko3053/post/Daq3KxwE7wo", "likes": 91, "velocity": 0.07, "ageHours": 1262.0, "postedAt": "2026-07-12T07:41:07+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3932207608228592015", "username": "kounenki.no.biyou", "text": "炎上覚悟で言います。頭皮マッサージはマジでヤバい習慣です💢\n育毛剤に月1万かけてたワイが、頭皮マッサージの恐ろしさに気づいた。\n何が恐ろしいかというと、", "permalink": "https://www.threads.com/@kounenki.no.biyou/post/DaSAfxnjbmP", "likes": 91, "velocity": 0.06, "ageHours": 1493.7, "postedAt": "2026-07-02T16:01:37+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3910168447749965986", "username": "ganmen.kakin", "text": "切開リフトまであと15日。\nねぇ、どうしよう、、、\n怖すぎて四六時中調べてる。\nフルフェイスリフトに決めたんだけどさ、、おぞましいDT見ちゃって、、ミニリフトにしようか迷い始めた。笑\nそもそも変更できるのか、、", "permalink": "https://www.threads.com/@ganmen.kakin/post/DZDtXx8E8ii", "likes": 90, "velocity": 0.04, "ageHours": 2223.5, "postedAt": "2026-06-02T06:13:44+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3953792717751326002", "username": "tsuya2mi", "text": "40代でもおばさん化しない人は、実は頭皮マッサージをしてる人。これは間違いない。美容業界15年いて、この効果の大きさ痛感してる。髪だけじゃなくて顔にも直結してるんだけど、頭皮マッサージの恐ろしい効果が、", "permalink": "https://www.threads.com/@tsuya2mi/post/DbesYdZGBUy", "likes": 89, "velocity": 0.11, "ageHours": 778.9, "postedAt": "2026-08-01T10:47:22+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3856206176443740622", "username": "biyou.tama", "text": "美容ナースが選ぶ、美容医療ランキング【たるみ】第3位：ジャルプロスーパーハイドロ(肌育注射)。肌を支えてる靭帯（リガメント）にアプローチしてコラーゲンとエラスチンを増やし、土台から肌を立て直す。顔を昔のように自然にリフトアップできる注射。ボリューム・ハリを出しつつたるみ感を補正。私も実際に、写真上でもたるみ改善が見えて喜んでいる人を見てきた。第2位：ボルニューマ（RF・高周波）。熱で引き締めて、自然に持ち上げるリフト治療。高周波で肌の奥を温めることで、コラーゲンが縮む＆増える。内側から引き締まる。たるみ改善、フェイスラインがすっきりする。第1位は、", "permalink": "https://www.threads.com/@biyou.tama/post/DWD_xYfmLHO", "likes": 89, "velocity": 0.02, "ageHours": 4010.4, "postedAt": "2026-03-19T19:20:20+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3976535395727075353", "username": "tapu_kounenki", "text": "1000億回でも言う。下腹がぽっこり出るのは「脂肪」か「腹筋不足」だと思ってたけど、トレーナーの友人いわく、夏までにペタンコお腹を手に入れたいなら大好きな白米をがまんするでもなく、毎日汗だくで腹筋100回やるでもなく、きついコルセットで無理やりお腹を凹ませるわけでもなく、、", "permalink": "https://www.threads.com/@tapu_kounenki/post/Dcvfd-zFGgZ", "likes": 89, "velocity": 3.45, "ageHours": 25.8, "postedAt": "2026-09-01T19:53:01+09:00", "genres": ["ダイエット・痩身"], "keywords": ["下腹 ぽっこり"]}, {"id": "3951655429692447013", "username": "chyh_beauty", "text": "毛穴に10年悩まされた女が教える、毛穴詰まりや顎下のプツプツにはサリチル酸が1番効くし肌綺麗になる！", "permalink": "https://www.threads.com/@chyh_beauty/post/DbXGa0xj9kl", "likes": 88, "velocity": 0.1, "ageHours": 849.7, "postedAt": "2026-07-29T12:00:58+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["毛穴 ケア"]}, {"id": "3965520160481072934", "username": "reela.lo7583", "text": "友だちの家で借りたヘッドスクラブ、\n想像以上によかった。\n\n頭皮のベタつきがスッと取れて、\nその後のシャンプーの泡立ちが全然違う。\n\n無印にこんなのあったんだ…\n今まで完全にノーマークだった。\n\nこれ、頭皮ケアにかなりおすすめ🛁", "permalink": "https://www.threads.com/@reela.lo7583/post/DcIW5NjH9cm", "likes": 85, "velocity": 0.22, "ageHours": 390.6, "postedAt": "2026-08-17T15:07:42+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3975134572270763361", "username": "yoshiyoshi_diary", "text": "vio脱毛ってツルツルになれるの？\nツルツルのデメリットは？\n少し残した方がいいのかしら", "permalink": "https://www.threads.com/@yoshiyoshi_diary/post/Dcqg9USkr1h", "likes": 85, "velocity": 1.18, "ageHours": 72.2, "postedAt": "2026-08-30T21:29:49+09:00", "genres": ["脱毛"], "keywords": ["医療脱毛"]}, {"id": "3948061448698290859", "username": "mayomayo420", "text": "運動嫌いの人はメモってください。\n自律神経を整える運動", "permalink": "https://www.th 実は、、", "permalink": "https://www.threads.com/@hatibeutyhair/post/DbjVF06E3IK", "likes": 71, "velocity": 0.1, "ageHours": 735.7, "postedAt": "2026-08-03T06:00:16+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["ほうれい線"]}, {"id": "3962127174409479111", "username": "mi__yu__be", "text": "シミ取り治療を始めて3年目です。\nシミそばかすだらけだった頃を見ると、\n本当に無くなったなって感無量。\n\n去年ルビーフラクショナルを3回やって、\n3回目が終わったのが6月。\n人生が変わったって言っていいほど\nシミそばかすなくなりました。\n\nその後は、ノーリスやピコトーニンを\nメンテナンス的にやり続け、\nここに来て、少しシミが再発したかな？\nそれとも取り残しが濃くなったのかな？\nという感じです。\n3回やっても残っていたシミもあるので、\n9月にノーリス、10月にルビフラ、\nという感じで、年に一度？の\n大掃除をしたいなって思ってます。\nでも出来れば、日々のスキンケアや\nピールで再発防いでいけたらいいな。\n\n肌に全振りしていますが、\nやっぱり老化も気になって…。\n\nあれもこれも気になる年頃です涙", "permalink": "https://www.threads.com/@mi__yu__be/post/Db8TaxBmWPH", "likes": 71, "velocity": 0.14, "ageHours": 502.9, "postedAt": "2026-08-12T22:46:29+09:00", "genres": ["くすみ・美白"], "keywords": ["シミ 対策"]}, {"id": "3927316346170382445", "username": "sena.vio.pro", "text": "VIO脱毛のプロです。「全部なくす（ハイジニーナ）にする人って、実際どのくらいいるの？」ってよく聞かれるの。正直に言うとね、、", "permalink": "https://www.threads.com/@sena.vio.pro/post/DaAoWi2Ehht", "likes": 71, "velocity": 0.04, "ageHours": 1655.6, "postedAt": "2026-06-25T22:03:33+09:00", "genres": ["脱毛"], "keywords": ["脱毛 サロン", "医療脱毛"]}, {"id": "3925135379586550827", "username": "ma.o__8", "text": "美容院でトリートメントしてもらって\nめちゃくちゃツルツルになってルンルンだったのに\n次の日髪の毛洗ったらパサパサの広がる髪の毛に戻ってしまって激萎え😭😭😭😭\n何が原因？シャンプー？トリートメント？それとも元々の髪のポテンシャル？\nまとまってた毛先まであっちこっち向いてて悲しい😭", "permalink": "https://www.threads.com/@ma.o__8/post/DZ44dTbkwwr", "likes": 69, "velocity": 0.04, "ageHours": 1727.9, "postedAt": "2026-06-22T21:50:21+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3911988785215374912", "username": "keana_lab_40s", "text": "「レチノールを続けても濃度を上げても毛穴が変わらない…」それ、当然です。だってレチノールが得意な毛穴は限られているから。毛穴は全部同じに見えて原因はまったく違う。だからレチノールさえ塗れば何とかなるわけではないの。\n\n【左上】おでこ・開き毛穴（皮脂主導型）\n\n・毛穴が丸い\n・大きさがほぼ均一\n・光が当たるとテカる\n\nこのタイプは皮脂の影響が大きい。コラーゲン不足やたるみが主因ではないので、レチノールで大きな変化は出にくい。必要なのは", "permalink": "https://www.threads.com/@keana_lab_40s/post/DZKLRLUEwZA", "likes": 6
