<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;900&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
  /* 明るい側を基準に全トークンを定義する。暗い側は下で上書きする。 */
  :root {
    --bg: #f6f4f5;
    --surface: #ffffff;
    --surface-2: #fbf9fa;
    --ink: #231c22;
    --muted: #6f636c;
    --border: #e4dee2;
    --accent: #8b2f5f;
    --accent-soft: #f7e9f0;
    --rising: #0f7b6c;
    --rising-soft: #e2f2ef;
    --chip: #efeaed;
    --focus: #8b2f5f;
  }
  /* OS が暗いとき。ただし閲覧者が明るいテーマを選んでいたらそちらを優先する。 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151114;
      --surface: #1f1a1e;
      --surface-2: #241e23;
      --ink: #f0eaee;
      --muted: #a3969e;
      --border: #332b31;
      --accent: #e086b0;
      --accent-soft: #3a2130;
      --rising: #4fc3ae;
      --rising-soft: #16332e;
      --chip: #2c2429;
      --focus: #e086b0;
    }
  }
  /* 閲覧者が暗いテーマを選んだとき。OS の設定に関係なく効かせる。 */
  :root[data-theme="dark"] {
    --bg: #151114;
    --surface: #1f1a1e;
    --surface-2: #241e23;
    --ink: #f0eaee;
    --muted: #a3969e;
    --border: #332b31;
    --accent: #e086b0;
    --accent-soft: #3a2130;
    --rising: #4fc3ae;
    --rising-soft: #16332e;
    --chip: #2c2429;
    --focus: #e086b0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    /* 透明のままだと閲覧側の地の色を借りてしまうので必ず塗る */
    background: var(--bg);
    color: var(--ink);
    /* 日本語本文はWebフォントを落とすと重いので、端末のフォントを使う */
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
                 -apple-system, BlinkMacSystemFont, "Yu Gothic Medium", sans-serif;
    line-height: 1.75;
    font-feature-settings: "palt" 1;
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
  }

  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px 96px; }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* --- 見出し --- */
  h1 {
    font-family: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-weight: 900;
    font-size: clamp(1.5rem, 4vw, 2.1rem);
    line-height: 1.35;
    letter-spacing: .01em;
    margin: 0;
    text-wrap: balance;
  }
  /* 対象ジャンルの但し書き。名前より一段弱く見せる */
  .ver {
    display: block;
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-weight: 400;
    font-size: .74rem;
    letter-spacing: .02em;
    color: var(--muted);
    margin-top: 6px;
  }

  /* --- 集計：詳細より先に全体像を出す --- */
  .panel {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    margin: 28px 0 8px;
  }
  /* 4枚で固定する。auto-fit だと枚数によって最後の1枚だけ次の行に
     取り残され、空いた枠が塗り残しに見えてしまうため。 */
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
  }
  @media (max-width: 620px) {
    /* 4枚なので2列でもきれいに埋まる */
    .summary { grid-template-columns: repeat(2, 1fr); }
  }
  .stat { background: var(--surface); padding: 14px 16px; }

  /* --- ジャンル別の内訳 --- */
  /* 棒にしておけば、ジャンルが何個あっても1行1本で並ぶので取り残しが出ない */
  .breakdown { padding: 15px 16px 17px; border-top: 1px solid var(--border); }
  .breakdown-title {
    font-size: .7rem; color: var(--muted); letter-spacing: .06em;
    margin: 0 0 11px; white-space: nowrap;
  }
  /* 名前の列は固定幅。名前に合わせて伸ばすと、長いジャンルの行だけ棒の
     開始位置がずれて、棒どうしの長さを目で比べられなくなる。
     収まらない名前は「・」の位置で折る（折り位置は .nb で決め打ち）。
     幅と高さは実際のジャンル名から build_html.py が計算して埋める。 */
  .bar-row {
    display: grid;
    grid-template-columns: 11.5em 1fr auto;
    gap: 12px; align-items: center;
  }
  .bar-row + .bar-row { margin-top: 8px; }
  /* 1行で収まる名前も2行の名前と同じ高さにする。混ざると行の間隔が
     ばらついて、棒の並びが読みにくくなる。
     flex にしているのは、折り返した2行をまとめて上下中央に置くため。 */
  .bar-name {
    font-size: .76rem; line-height: 1.4;
    min-height: 1.4em;
    display: flex; flex-wrap: wrap; align-content: center;
  }
  .bar-track {
    height: 6px; border-radius: 999px;
    background: var(--chip); overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 999px; background: var(--accent); }
  .bar-count {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; color: var(--muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  @media (max-width: 620px) {
    /* 幅は変えない。変えると狭い画面だけ折り返し位置が変わってしまう */
    .bar-row { gap: 9px; }
  }
  /* まだ集まっていないジャンル。対象には入っているので消さず、弱く見せる */
  .bar-row.pending .bar-name { color: var(--muted); }
  .bar-row.pending .bar-track { opacity: .55; }
  /* 「収集待ち」は日本語なので、等幅フォントに任せず本文と同じ書体で出す */
  .bar-row.pending .bar-count {
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: .7rem;
  }
  .stat-label {
    font-size: .7rem; color: var(--muted); letter-spacing: .06em;
    display: block; margin-bottom: 4px;
    /* 「表示中/の投稿」のように助詞で割れないよう、まとめて扱う */
    white-space: nowrap;
  }
  .stat-value {
    white-space: nowrap;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: 1.25rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .stat-value .unit { font-size: .72rem; font-weight: 400; color: var(--muted); margin-left: 3px; }
  .stamp {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .7rem; color: var(--muted); margin: 0 0 26px;
  }

  /* --- 操作バー --- */
  .controls {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: 12px 0 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row + .row { margin-top: 8px; }
  select, input[type=search] {
    font: inherit; font-size: .82rem;
    padding: 7px 11px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    color: var(--ink);
  }
  input[type=search] { flex: 1; min-width: 180px; }
  .chip {
    display: inline-flex; align-items: baseline; gap: 6px;
    font-size: .78rem; padding: 5px 13px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on {
    background: var(--accent-soft); border-color: var(--accent);
    color: var(--accent); font-weight: 700;
  }
  /* どちらの行を押しているのか分かるようにする。2段になると迷いやすい */
  .filter-label {
    font-size: .7rem; color: var(--muted); letter-spacing: .04em;
    white-space: nowrap; min-width: 5.5em;
  }
  /* ジャンル名は途中で割らない。「ダイエット」を「ダイ」と「エット」に分けない */
  .chip-name { white-space: nowrap; }
  /* まだ1件も無いジャンル。押しても空振りするので、選べないことを見た目で示す */
  .chip.pending {
    opacity: .45; cursor: default;
    border-style: dashed;
  }
  .chip.pending:hover { border-color: var(--border); color: var(--muted); }
  .count {
    white-space: nowrap;
    font-family: "Roboto Mono", ui-monospace, monospace;
    color: var(--muted); font-size: .76rem; margin-bottom: 14px;
    font-variant-numeric: tabular-nums;
  }

  /* --- カード --- */
  #list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid transparent;
    border-radius: 10px;
    padding: 16px 18px;
  }
  /* 伸びが速い投稿は左端の色で一目で分かるようにする */
  .card.rising { border-left-color: var(--rising); background: var(--surface-2); }

  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 9px; }
  .rank {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; color: var(--muted);
    font-variant-numeric: tabular-nums; min-width: 2.4em;
  }
  .user { font-weight: 700; font-size: .86rem; }
  .badge {
    white-space: nowrap;
    font-size: .66rem; font-weight: 700; letter-spacing: .04em;
    padding: 2px 8px; border-radius: 999px;
    background: var(--rising-soft); color: var(--rising);
  }
  .stats {
    margin-left: auto; display: flex; gap: 11px;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; font-variant-numeric: tabular-nums;
  }
  .likes { color: var(--accent); font-weight: 700; }
  .vel { color: var(--rising); font-weight: 500; }
  .age { color: var(--muted); }

  .text {
    white-space: pre-wrap;
    /* word-break: break-word は単語の途中で割るので使わない。
       overflow-wrap なら、1語が行に収まらないときだけ割る。
       line-break: strict で日本語の禁則処理を厳しい方に寄せる。 */
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
    font-size: .92rem; margin: 0 0 12px;
  }

  /* 文節のかたまり。ここで囲った範囲は途中で改行されない。
     「を」「と」などの助詞が行頭に来るのを防ぐために使う。 */
  .nb { white-space: nowrap; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag {
    white-space: nowrap;
    font-size: .7rem; padding: 3px 9px; border-radius: 4px;
    background: var(--chip); color: var(--muted);
  }
  .link {
    margin-left: auto; font-size: .76rem; color: var(--accent);
    text-decoration: none; font-weight: 700; white-space: nowrap;
  }
  .link:hover { text-decoration: underline; }

  .empty { text-align: center; color: var(--muted); padding: 64px 20px; font-size: .88rem; }
</style>

。\n\n100人中、何人がYESと言ってくれるんだろう。\n\n正直、全然分からない😂\n\nでも、自分の思い込みだけでお店をつくるより\n実際に100人の声を聞いてからつくりたい。\n\n美容師11年目。\nここからゼロから挑戦します。\n\n町田でヘッドスパ受けてみたい人、\nこのアカウント見つけてくれたら嬉しいです🌿", "permalink": "https://www.threads.com/@head_spa_yun/post/DcIJNlCkcFf", "likes": 465, "velocity": 0.75, "ageHours": 618.5, "postedAt": "2026-08-17T13:08:09+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ"], "mods": []}, {"id": "3906347737831606204", "username": "curated.pearls", "text": "ポルトガル旅行で奇跡的な出会いが、、✨🕊️✨\n抜け感のあるリングを探してて、ポメラートのマーマノンマーマというリングがあるのを知りました。\nただ、もう廃盤のため二次流通でしかゲットできなくて、日本だけじゃなくて、世界でも地金のモデルが本当に流通してないことを知って、いつか出会えるのを待つことに。\nそんな中、ネットで色々検索してると、なんととある老舗ジュエリー店に新品のものがあることを発見！！\nしかもそれが、旅行を予定してたポルトガル🇵🇹\nすぐにお店に問い合わせて、キープをお願いすると親切にオッケーしてくれました。。\nそして、、今日、、先ほど、、新品のマーマノンマーマを購入することができました😭🧡\n出会えるとしても何年後かなと思っていたのに、まさかのこんなにも早く迎えることができるとは。\nこのリングを着けるたびに、ポルトガル旅行を思い出すんだろうなぁ☺️", "permalink": "https://www.threads.com/@curated.pearls/post/DY2IpIimoe8", "likes": 451, "velocity": 0.18, "ageHours": 2576.0, "postedAt": "2026-05-27T23:42:40+09:00", "genres": ["パーマネントジュエリー"], "keywords": ["パーマネントジュエリー"], "mods": []}, {"id": "3883817936209754679", "username": "yasumi.chan2525", "text": "ここだけの話。セラピストを7年やって忘れられない言葉があります。施術台で開始5分で爆睡した40代のお客様が目を覚ましてこう言われました。「私おかしいんですかね」って。その方はピラティスに通ってジムで週3回頑張って食事も気をつけていた。\nどう見ても「健康意識が高い人」だった。\nでも体を触った瞬間わかった。", "permalink": "https://www.threads.com/@yasumi.chan2525/post/DXmF9XsEro3", "likes": 446, "velocity": 0.13, "ageHours": 3322.0, "postedAt": "2026-04-26T21:39:58+09:00", "genres": ["セラピスト"], "keywords": ["セラピスト"], "mods": []}, {"id": "3876231133575903222", "username": "cute_mi_bo", "text": "更年期って、ちょっとした事でも不安や心配なりやすい？\nこれも自律神経？", "permalink": "https://www.threads.com/@cute_mi_bo/post/DXLI63IGff2", "likes": 433, "velocity": 0.12, "ageHours": 3573.2, "postedAt": "2026-04-16T10:26:21+09:00", "genres": ["更年期ケア"], "keywords": ["更年期ケア"], "mods": []}, {"id": "3968344787942372825", "username": "_kiroku_chapter34", "text": "自宅サロンを始めて、3ヶ月\n8月は予約がなく落ち込んでたけど\nリピーター様2名が予約してくれた！！！\n嬉しい🧡初めてのリピーター様！！！" +09:00", "genres": ["パーマネントジュエリー"], "keywords": ["パーマネントジュエリー 高単価"], "mods": ["高単価"]}, {"id": "3965860089021140117", "username": "hawk.6963670", "text": "43歳、今まで仕事も好調だったのに、去年あたりから一気に下降。\n何だろう、仕事のストレスは確実にあるんだけど、思考が働かないというか…。解決思考が、進まない。家事もさぼふ。そして焦燥感、不安感。これが更年期？ブレインフォグ？\nそれとも仕事ができなくなってるだけ？\n婦人科は行くつもりですが、先輩方の体験談聞きたい…。今は元気です、みたいなの聞きたいです。\nよろしくお願いします！", "permalink": "https://www.threads.com/@hawk.6963670/post/DcJkL0rAQyV", "likes": 409, "velocity": 0.68, "ageHours": 605.3, "postedAt": "2026-08-18T02:23:05+09:00", "genres": ["更年期ケア"], "keywords": ["更年期ケア"], "mods": []}, {"id": "3856292443227135365", "username": "hirokazseki66", "text": "薄かった眉毛が韓国海苔🇰🇷みたいになった。初アートメイク👍", "permalink": "https://www.threads.com/@hirokazseki66/post/DWETYusk52F", "likes": 409, "velocity": 0.1, "ageHours": 4233.5, "postedAt": "2026-03-19T22:11:44+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク", "アートメイク スクール"], "mods": []}, {"id": "3969319889382597532", "username": "kmrsn925", "text": "6月から調子が悪かった。\n7月から呼吸が速かった。\n8月になっても呼吸は落ち着かず、病院に通って薬飲んだり点滴しても改善しなかった。一昨日胸水貯留してた。それまで、リンパ節が腫れてるって言われて何度も生検してもリンパ腫かはっきりしなかった。でも今日セカンドオピニオンで腫瘍科に行って、悪性リンパ腫の可能性が高いって言われて外注検査出しつつ、Lアスパラギナーゼ皮下注射をしてもらった。腫瘍崩壊症候群のリスクがあるから入院で経過観察。私に出来ることがなくなって、いつか輸血とかをお願いしなきゃいけない状況になる時に備えて、threadsを始める。\nこちら、都内在住です。\n猫好きさん、どうか応援よろしくお願いします。\n\n※動画は胸水抜く前です。", "permalink": "https://www.threads.com/@kmrsn925/post/DcV22i2iuOc", "likes": 407, "velocity": 0.83, "ageHours": 490.7, "postedAt": "2026-08-22T20:59:05+09:00", "genres": ["リンパ"], "keywords": ["リンパ 手技"], "mods": []}, {"id": "3879026426787247109", "username": "sachi_doctor_yoga", "text": "更年期の不調を「年のせい」にしている女性、腸を見落としています。更年期と腸内環境には密接な関係があって、それをふまえて今日からできる３つのこと、図にして詳しく説明してみたので、良かったら試してみてね！", "permalink": "https://www.threads.com/@sachi_doctor_yoga/post/DXVEfuzAbQF", "likes": 398, "velocity": 0.11, "ageHours": 3480.7, "postedAt": "2026-04-20T07:00:06+09:00", "genres": ["更年期ケア"], "keywords": ["更年期ケア メニュー"], "mods": []}, {"id": "3895915582395669063", "username": "kataoka_yuka_", "text": "今の美容学生と話すと「 15:51:33+09:00", "genres": ["パーマネントジュエリー"], "keywords": ["パーマネントジュエリー 高単価"], "mods": []}, {"id": "3858399205879025340", "username": "bihatsu_usagi", "text": "何度でも言います。\n「耳たぶマッサージ」が\n抜け毛・白髪ケアにも有効です。\nやり方は簡単で、、、￼", "permalink": "https://www.threads.com/@bihatsu_usagi/post/DWLyaKUEY68", "likes": 148, "velocity": 0.04, "ageHours": 4163.7, "postedAt": "2026-03-22T19:57:29+09:00", "genres": ["育毛"], "keywords": ["育毛 手技"], "mods": []}, {"id": "3864253645734889861", "username": "dr_breacan", "text": "『乳がんが転移するまでの7つの壁』\n\n乳がんが転移するには、\n実はいくつもの壁を乗り越える必要があります。\n\n①浸潤の壁\nまず乳がんは、\nミルクの通り道（乳管）から外の世界へ出なければなりません\n\n②血管・リンパ管への侵入の壁\n外に出た乳がんは、\n血管やリンパ管の壁を破って\n流れの中に入り込む必要があります\n\n③流れと免疫の壁\n血液やリンパの中では\n強い流れのストレスや免疫の攻撃があり、\n多くのがん細胞はここで脱落します\n\n④遠くの臓器で“止まる”壁\n血液は全身を巡っているため、\n目的の臓器にとどまること自体が簡単ではありません\n\n⑤血管の外へ出る壁\nたどり着いたとしても、\nもう一度血管の壁を破って\n臓器の中に入り込む必要があります\n\n⑥微小転移として生き残る壁\n入り込んでも、\n環境に適応できず消えてしまう細胞がほとんどです\n\n⑦そこで増え続ける壁\nその場所に根を張り、\n増え続けてはじめて「転移」となります", "permalink": "https://www.threads.com/@dr_breacan/post/DWgljeUCUmF", "likes": 148, "velocity": 0.04, "ageHours": 3969.8, "postedAt": "2026-03-30T21:49:13+09:00", "genres": ["リンパ"], "keywords": ["リンパ"], "mods": []}, {"id": "3899626831339878380", "username": "pmana0626", "text": "ピラティスと解剖学を一緒に学べる友達が欲しい~！！", "permalink": "https://www.threads.com/@pmana0626/post/DYeQfEmmHfs", "likes": 148, "velocity": 0.05, "ageHours": 2798.5, "postedAt": "2026-05-18T17:09:25+09:00", "genres": ["ピラティス"], "keywords": ["ピラティス スクール"], "mods": ["スクール"]}, {"id": "3979390632288912366", "username": "tamachan333m", "text": "４５歳から、ピラティス通うのは遅いですかね？\n標準より太ってるし、オバさんだし、\nやっぱり辞めようか悩み中\nとにかく反り腰で姿勢改善したい。\nピラティス体験した事あるかたどんな感じですか？", "permalink": "https://www.threads.com/@tamachan333m/post/Dc5orJEGQPu", "likes": 147, "velocity": 0.93, "ageHours": 157.2, "postedAt": "2026-09-05T18:25:51+09:00", "genres": ["ピラティス"], "keywords": ["ピラティス"], "mods": []}, {"id": "3868677042762413483", "username": "358.purple", "text": "やっぱり美容系で働きたいなぁ。\nまだ資格ないけど。\n手に職つけて人を癒せる仕事がしたい😌🪽\nハーブピーリングかドライヘッドスパか‥ ds": ["美容サロン"], "mods": ["経営"]}, {"id": "3951698413918734480", "username": "miey_bodymake", "text": "まあやってしまいました。\nピラティスが好きすぎる人のための空間を作りたくて小さなテナントを契約。\n銀座2丁目の完全1:1サロン、来月からインテリア工事、再来月にはクラシカルマシンが搬入。\nオープンは11月頃になるでしょう。\nクラシカルピラティスがまだ日本に浸透していないことから、まずは小さな規模で楽しく始めてみます。\nピラティス愛をこの空間に🙏✨", "permalink": "https://www.threads.com/@miey_bodymake/post/DbXQMU9GciQ", "likes": 107, "velocity": 0.1, "ageHours": 1074.2, "postedAt": "2026-07-29T13:26:22+09:00", "genres": ["ピラティス"], "keywords": ["ピラティス スクール"], "mods": []}, {"id": "3958538013458180938", "username": "omamori_39", "text": "ポーラでエステ受けてます。家での基礎化粧品はポーラからは買ってません。\n美容液や日焼け止めが新しく発売されるとお勧めされて断るのですが、ポーラ内の例えばBAから出た◯◯、次はリンクルショット、次はホワイトショット、、、などなど色々勧められます。\n何がいいか分からないなーって困ります。\nそしてもうエステ行くのも辞めたいなーって思ってます。\nポーラのエステ行ってる方、いろいろ勧められますか？", "permalink": "https://www.threads.com/@omamori_39/post/DbvjVmaDitK", "likes": 107, "velocity": 0.13, "ageHours": 847.7, "postedAt": "2026-08-07T23:55:25+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン メニュー"], "mods": []}, {"id": "3946122826733436527", "username": "momosasaji", "text": "ピラティスってなんで腹式呼吸じゃなくて胸式呼吸かしってる？", "permalink": "https://www.threads.com/@momosasaji/post/DbDcc2vgb5v", "likes": 106, "velocity": 0.08, "ageHours": 1258.9, "postedAt": "2026-07-21T20:48:40+09:00", "genres": ["ピラティス"], "keywords": ["ピラティス"], "mods": []}, {"id": "3955459663218683773", "username": "yui_colugi.tokushima", "text": "エステサロンの店販を迷っています。。。\n10月にリニューアルオープン予定ですが\nまだ全然決められていません😇\n\n自信を持ってこれがいいというものを入れたいので\n自分の肌でも試したいし、\n時間がないです🥹", "permalink": "https://www.threads.com/@yui_colugi.tokushima/post/DbknZtViS99", "likes": 106, "velocity": 0.11, "ageHours": 949.7, "postedAt": "2026-08-03T17:59:18+09:00", "genres": ["美容サロン"], "keywords": ["美容サロン"], "mods": []}, {"id": "3890391113812067236", "username": "mokon_chan", "text": "たぶん、これを知っていたら何万円も無駄にしなかった。\n薄毛には育毛剤。抜け毛には頭皮マッサージ。\nそう信じて、ドラッグストアで話題の育毛シャンプーを買い続けた。口コミの良いサプリも、頭皮用美容液も、惜しみなく使った。\nそれでも、一向に変化は感じられなくて。\n転機は、国際中医師のいる育毛サロンへ行った時。頭皮を診てもらう覚悟でいたら、先生が最初に触れたのは、", "permalink": "h At": "2026-09-06T06:00:46+09:00", "genres": ["ピラティス"], "keywords": ["ピラティス"], "mods": []}, {"id": "3885215904729095561", "username": "chi_ffon700", "text": "アートメイクやってました！とか\nアートメイク施術者です！っていう方いる？？", "permalink": "https://www.threads.com/@chi_ffon700/post/DXrD0fVE12J", "likes": 48, "velocity": 0.01, "ageHours": 3275.7, "postedAt": "2026-04-28T19:57:29+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク"], "mods": []}, {"id": "3968612177111794809", "username": "yuen_headspa", "text": "最近、ドライヘッドスパについてもっと深く勉強したい気持ちが強くなっています💆‍♀️🌿\n\n実際に施術をしていると、\n「この硬さはどこから来ているんだろう？」\n「首肩の疲れと頭の筋肉はどう繋がっているんだろう？」\n「もっとお客様のお悩みに合わせた施術ができるようになりたい」\nと思うことが増えました。\n\n技術だけではなく、頭の筋肉や血流、睡眠、自律神経、眼精疲労、むくみ、首肩との関係など、身体の知識ももっと身につけたいです。\n\n同じようにドライヘッドスパやヘッドスパをしている方、セラピストさんで、\n実際にお会いして一緒に練習したり、技術や知識を共有しながら勉強できる方がいたらぜひ繋がりたいです🥹✨\n\nお互いに施術をし合いながら、\n「ここはこうするとやりやすいよ」\n「私はこの部分を意識してる」\n「こういう時はこの筋肉を見てる」\nなど、現場で使えることを教え合えたら嬉しいです。\n\nまだまだ勉強中なので、経験年数関係なく、\nヘッドスパが好きで「もっと上手くなりたい」「もっと勉強したい」という方と繋がれたらと思っています🌿", "permalink": "https://www.threads.com/@yuen_headspa/post/DcTV7-cCcR5", "likes": 48, "velocity": 0.09, "ageHours": 514.2, "postedAt": "2026-08-21T21:30:59+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ 手技"], "mods": []}, {"id": "3946151653548447453", "username": "jb427na", "text": "ヘッドスパ行ってみたい気持ちよさそう", "permalink": "https://www.threads.com/@jb427na/post/DbDjAVzk1bd", "likes": 48, "velocity": 0.04, "ageHours": 1257.9, "postedAt": "2026-07-21T21:45:56+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ", "ヘッドスパ 手技"], "mods": []}, {"id": "3963313130843569793", "username": "kana_mmi1235", "text": "面談2つともダメでした‥\nやっぱりオンライン秘書として案件取るのはなかなか難しいですね😭\n別の柱があるのでそこまで焦りはないけど\nやっぱり案件もとってみたいので\n頑張ります！！", "permalink": "https://www.threads.com/@kana_mmi1235/post/DcAhEtBkn6B", "likes": 47, "velocity": 0.07, "ageHours": 689.6, "postedAt": "2026-08-14T14:02:44+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書"], "mods": []}, {"id": "3899684334953673552", "username": "7.pilates2", "text": "おすすめのピラティススタジオありませんか🥺\n\n来月からインストラクターデビューするんですけど mods": []}, {"id": "3960261082732237569", "username": "shingo_nagomi2014", "text": "院名を鍼灸マッサージに戻した流れで、あん摩マッサージ指圧とは何かを勉強し直しています。そうしたら、細かいところをきれいに忘れていました。お恥ずかしい話です。\n\nあん摩は中国生まれで、経絡とツボの理論。服の上から、身体の中心から手足の先へ、揉んでいきます。\n\nマッサージはフランスで体系化された西洋医学で、根拠は解剖学と生理学。オイルを使って肌に直接、手足の先から心臓に向かって擦ります。静脈やリンパにはポンプがないので、手で返すのを手伝う。だから向きが逆なんですね。\n\n指圧は大正時代の日本生まれで、いちばん新しい。古法あん摩の活法に、アメリカから入ったオステオパシーやカイロプラクティックを吸収したもの。垂直に、持続して、集中して圧す。グリグリ動かさないのが指圧です。\n\nこの3つをまとめて扱える国家資格が、あん摩マッサージ指圧師になります。\n\n正直に言うと、僕が実際にやっている手技はあん摩と指圧がメインなんです。本当だったら鍼灸あん摩指圧院と名乗るのが正確だったなと思っています。\n\n引き続き、深いところを探っていきます。今はまだ、めっちゃ浅いところです。", "permalink": "https://www.threads.com/@shingo_nagomi2014/post/Db1rHjuDxMB", "likes": 34, "velocity": 0.04, "ageHours": 790.7, "postedAt": "2026-08-10T08:58:51+09:00", "genres": ["リンパ"], "keywords": ["リンパ 手技"], "mods": ["スクール", "手技"]}, {"id": "3973797249016870237", "username": "akiho.maru", "text": "ピラティスを勉強されている方に質問です🙇‍♀️\n\nこれからピラティスを本格的に勉強して、将来的にはインストラクターになりたいと思っています！\n\n特に解剖学などの身体の知識をしっかり身につけたいのですが、実際にインストラクターをされている方は、\n\n・解剖学は何から勉強しましたか？\n・おすすめの本や教材はありますか？\n・資格取得前に勉強しておいた方がいいことはありますか？\n\nなど、勉強の進め方について教えていただけたら嬉しいです🥹\n\n実際にインストラクターになられた方の経験談、ぜひ参考にさせていただきたいです🫶", "permalink": "https://www.threads.com/@akiho.maru/post/Dclw4s9EzVd", "likes": 34, "velocity": 0.1, "ageHours": 342.5, "postedAt": "2026-08-29T01:12:48+09:00", "genres": ["ピラティス"], "keywords": ["ピラティス スクール"], "mods": ["スクール"]}, {"id": "3950404449298121830", "username": "lapilates_ikumu", "text": "自分のthreadがピラティスK批判ばっかで、\n退会したくてもさせてくれないってそんなことあるのかな？笑\n\n契約書とかに明記されてるなら\n契約した自分の責任だと思うけど...\n\nそれか、集団で依頼されてピラティスKを潰そうとしてる組織があるのか...", "permalink": "https://www.threads.com/@lapilates_ikumu/post/DbSp-qfiYRm", "likes": 34, "velocity": 0.03, "ageHours": 1117.1, "postedAt": "2026-07-27T18:35:29+09:00", "genres": ["ピラティス"], "keywords": ["ピラティス"], "mods": []}, {"id": "3975827962796680192", "username": "mori_nikki_", "text": "自律神経を整えたくて初めて鍼灸院へ\n\n昼間に行って帰ってからずーっと眠い\n1時間くらい昼寝したのにまだ眠い\nこれは鍼の効果…なのか？？", "permalink": "https://www.threads.com/@mori_nikki_/post , "likes": 27, "velocity": 0.02, "ageHours": 1509.1, "postedAt": "2026-07-11T10:36:01+09:00", "genres": ["美容サロン"], "keywords": ["美容サロン"], "mods": []}, {"id": "3898992807411401614", "username": "zen.himeji", "text": "正直に言います。\nヘッドスパは定期的にやったほうがいいです。\nなぜかというと", "permalink": "https://www.threads.com/@zen.himeji/post/DYcAUzzj0OO", "likes": 27, "velocity": 0.01, "ageHours": 2819.5, "postedAt": "2026-05-17T20:09:44+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ", "ヘッドスパ 経営", "ヘッドスパ メニュー", "ヘッドスパ 手技", "ヘッドスパ 高単価", "ヘッドスパ スクール"], "mods": []}, {"id": "3926915260834093511", "username": "y_salon_n", "text": "偏頭痛持ちの皆さん、\n頭痛ひどくないですか？😭\n個人的に昨日がここ最近で一番ひどかったです😭\n\n私は昔から偏頭痛持ちで、\nよくヘッドスパに行くのですが、\n好きが高じてヘッドスパのインストラクター資格取得しました✌️\n\n頭スッキリしたい方ぜひご来店ください🫶😊", "permalink": "https://www.threads.com/@y_salon_n/post/DZ_NJ_BE5nH", "likes": 27, "velocity": 0.01, "ageHours": 1894.9, "postedAt": "2026-06-25T08:46:40+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ 高単価"], "mods": ["スクール"]}, {"id": "3976368451967280495", "username": "miwa.chibi", "text": "素直にうれしい気持ちです☘️\n抗がん剤治療終わって3ヶ月後の状態です😊\n最近、シャンプーやコンディショナーも楽しくて\n・\n旦那さんへ『編み込みできるかしら？😆』って話すと\n・\nおーー生えてきたーやー😆\nわしは、だんだん頭のてっぺんが薄くなってきたーやー\nあんたは、生えてきてわしは抜けとや😆\n・\nこの、下りを息子に話したら\n『なんだ〜育毛剤こ〜たろか〜w🤩👍🫶』って\nそれを聞いた旦那さんは大爆笑🤣🤣🤣\n今日もいい日だ\n・\n生えはじめは、むずむずしてむずがゆくて\n生えてきたら、細い細い産毛さんが\nだんだん日に日に太くなり\n黒くなってきて\n今はちょっとだけシャンプーの量も増やしたりして🧴💕\nウィッグは楽で、ケアも簡単\n夏はちと暑い☀️😵💦\n髪の毛っていろんな役割があるんだなと思ったことは\n暑さは紫外線予防、寒さ対策、\n汗の出方やつたってくる汗の量の調整\nほこりや怪我からも守り\nいろんなことに気づいて\n髪の毛って愛しい💕\n\n#乳ガン#副作用#脱毛#ウイング#髪の毛生えてきた", "permalink": "https://www.threads.com/@miwa.chibi/post/Dcu5goTlGVv", "likes": 26, "velocity": 0.1, "ageHours": 257.3, "postedAt": "2026-09-01T14:21:21+09:00", "genres": ["育毛"], "keywords": ["育毛 手技"], "mods": []}, {"id": "3918626444318853230", "username": "ayumi.n.1025", "text": "38歳、抜け毛がひどくて髪の毛が少なくなってきて悩んでる。市販の育毛剤1年くらい同じの使ってるけどあんま効果なーい。ネットで見てても結局なにが効果あるのかわからん…\n治療するお金はないし。\nこれ効果あったよ！とかこの育毛剤おすすめ！とかあったら教えてほしいです！", "permalink": "https://www.threads.com/@ayumi.n.1025/post/DZhwf1FE8hu", "likes": 26, "velocity": 0.01, "ageHours": 2169.4, "postedAt": "2026-06-13T22:18:16+09:00", "genres": ["育毛"], "keywords": ["育毛 手技"], "mods": []}, {"id": "3978018742961396560", "username": "ume_work_sns", "text": "オンライン秘書の案件を探していると、週10時間程度という条件では案件が取れないかも、と不安になることがあります。\n\nでも、今のところ本業を辞めるつもりはないし、オンライン秘書になるために本業や自分の生活を犠牲にするのは違うと思っています。\n\nまずは今の条件で挑戦してみて、難しいと分かったら別ジャンルの副業も考える。来年3月を一つの区切りに、それでも在宅での副業が難しければ、アルバイトも選択肢に入れる。\n\nどの働き方が自分に合うか判断するためにも、まずは行動。できる範囲で小さく頑張ってみます。", "permalink": "https://www.threads.com/@ume_work_sns/post/Dc0wvhkD1tQ", "likes": 26, "velocity": 0.13, "ageHours": 202.7, "postedAt": "2026-09-03T21:00:09+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書"], "mods": []}, {"id": "3975837338440920707", "username": "erena_style2023", "text": "在宅ワーク始めたいです！怪しくないやつ教えてください。という投稿を度々みるので、その度に「オンライン秘書が簡単ですよ、クラウドワークスで探して応募してください。会社員経験があったらできる仕事がほとんどです」って言ってるのに、やらない人ばかりなんだろうなと思う。もっと簡単で、もっと楽な方法探してるんだと思うの。もしくはもっと好条件。いろんな在宅ワークやってきたけど、オンライン秘書が一番簡単で、一番仕事が多くて、一番稼ぎやすいです。", "permalink": "https://www.threads.com/@erena_style2023/post/DctAv6SgW6D", "likes": 26, "velocity": 0.09, "ageHours": 274.9, "postedAt": "2026-08-31T20:46:06+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書"], "mods": []}, {"id": "3981974859717546331", "username": "iuy_iuy_days", "text": "最近、ジュエリーって\n「欲しい順」\nで買うのがいいのか、\n「使う順」\nで買うのがいいのか分からなくなってきた😂", "permalink": "https://www.threads.com/@iuy_iuy_days/post/DdC0QmaABFb", "likes": 26, "velocity": 0.36, "ageHours": 71.7, "postedAt": "2026-09-09T08:00:15+09:00", "genres": ["パーマネントジュエリー"], "keywords": ["パーマネントジュエリー 高単価"], "mods": []}, {"id": "3976372359338242664", "username": "rabbit.17.17", "text": "ピラティスかジムかどちらかに行ってみたいんだけど、腰が悪くてヘルニア持ちだから高負荷の筋トレとかは難しいからピラティスかな？って思ってるんだけど、ピラティスって痩せるのかなー？\n筋力もないし体脂肪もかなり高いから、ちゃんと動いて痩せたい🦀", "permalink": "https://www.threads.com/@rabbit.17.17/post/Dcu6ZfVCbJo", "likes": 26, "velocity": 0.1, "ageHours": 257.2, "postedAt": "2026-09-01T14:29:05+09:00", "genres": ["ピラティス"], "keywords": ["ピラティス スクール"], "mods": []}, {"id": "398021083119 ピスト 単価UP"], "mods": []}, {"id": "3977929555926167421", "username": "sugiura7010", "text": "悲報…高単価サロンは完全に終了です", "permalink": "https://www.threads.com/@sugiura7010/post/Dc0cdrqga99", "likes": 13, "velocity": 0.06, "ageHours": 205.6, "postedAt": "2026-09-03T18:02:57+09:00", "genres": ["美容サロン", "エステティシャン", "セラピスト"], "keywords": ["美容サロン 高単価", "エステティシャン 高単価", "セラピスト 高単価"], "mods": ["高単価"]}, {"id": "3940983623033937486", "username": "syunsuke20260124", "text": "サロンオーナー兼セラピストの皆さん\n教えてください。\n\n施術時間90分のサービスを\nストレスなく\n【一日、何人までならこなせますか？】\n\n業態やサービス内容で違いはあると\n思いますが、参考までに教えてください🙇", "permalink": "https://www.threads.com/@syunsuke20260124/post/DaxL7mUkd5O", "likes": 13, "velocity": 0.01, "ageHours": 1429.0, "postedAt": "2026-07-14T18:37:59+09:00", "genres": ["セラピスト"], "keywords": ["セラピスト 単価UP"], "mods": ["経営"]}, {"id": "3860221197343216554", "username": "hogushiya_kida", "text": "「安い客は質が悪い」\nそんなマーケティングの言葉を耳にするたび、私は違和感を抱いてきました。\n\nかつて「60分2300円」という激安店の最前線にいたからこそ、断言できることがあります。\n\nそれは、お客様の質ではなく、私たちの「触れ方」ひとつで世界が変わるということ。\n\n1タッチで「信頼、安心、安全」を伝え、C触覚線維を介して相手の「ガチガチスイッチ」をオフにする。\n\nそこには、単価や効率を超えた「セラピストのプロたる所以」が詰まっていました。", "permalink": "https://www.threads.com/@hogushiya_kida/post/DWSQroGE1Oq", "likes": 13, "velocity": 0.0, "ageHours": 4103.4, "postedAt": "2026-03-25T08:17:28+09:00", "genres": ["セラピスト"], "keywords": ["セラピスト 高単価"], "mods": []}, {"id": "3978533963607036505", "username": "sasomin1001", "text": "事務経験ありますが、スクール等入った方が良いのでしょうか？\n一般事務の業務はほぼできると思います。\nSNS代行やバナー作成など、幅広くできるようになった方が良いでしょうか？\nその際はスクール入るべきですかね？", "permalink": "https://www.threads.com/@sasomin1001/post/Dc2l4-Ln9JZ", "likes": 13, "velocity": 0.07, "ageHours": 185.6, "postedAt": "2026-09-04T14:03:49+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書 スクール"], "mods": ["スクール"]}, {"id": "3977740253800470976", "username": "satoko.support", "text": "楽しそうなことを思いついてしまいました！\n\n「オンライン秘書を始めたけれど、次の一歩が見えない」\nそんな方とお話しする個別相談を、やってみることにしました✨\n\nきっかけは、フリーランス仲間と話した時のこと。自分にとってはあたり前のことも、「それ、強みですよね」と言っていただけて。\n\n自分のことって、自分では気づけないこともあるなぁと。\n\nオンライン秘書として頑張っている方とも、そんな話がしたいなと思っています😊\n気になる！という方、いますか？？", "permalink": "https://www.threads.com/@satoko.support/post/Dczxa-UjJnA", "likes": 13, "velocity": 0.06, "ageHours": 211.9, "postedAt": "2026-09-03T11:46:51+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書"], "mods": []}, {"id": "3956877733124434867", "username": "ayaka_webdesigner", "text": "【オンライン秘書募集】\nUnlyでは、オンラインスクール運営をサポートしてくださるオンライン秘書を募集します。\n\n主な業務は、スクール運営に関わる事務作業や情報整理、投稿作業などです。\n\n詳細はこちら🔻", "permalink": "https://www.threads.com/@ayaka_webdesigner/post/Dbpp1V2iOuz", "likes": 13, "velocity": 0.01, "ageHours": 902.7, "postedAt": "2026-08-05T16:56:45+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書"], "mods": ["スクール"]}, {"id": "3983781462769116376", "username": "nekopanda529", "text": "術後に確定して今日、聞いたこと\n\nグレード2\nセンチネルへの転移は1mm以下の微小転移\nその先のリンパへの転移なし\nステージ1B\nオンコDXの結果は3週間後\n\nリンパの転移なくてよかた😭\nお水も100mlだった。減っててよかた😭", "permalink": "https://www.threads.com/@nekopanda529/post/DdJPCInI6TY", "likes": 13, "velocity": 1.1, "ageHours": 11.8, "postedAt": "2026-09-11T19:49:39+09:00", "genres": ["リンパ"], "keywords": ["リンパ"], "mods": []}, {"id": "3862648400517488120", "username": "rirakusalon.mother", "text": "リンパドレナージュとリンパマッサージは\n違うもの。\n違いの説明が出来る方いますか？\nちゃんと施術者も理解して説明出来てますか？", "permalink": "https://www.threads.com/@rirakusalon.mother/post/DWa4kFNE134", "likes": 13, "velocity": 0.0, "ageHours": 4023.0, "postedAt": "2026-03-28T16:39:53+09:00", "genres": ["リンパ"], "keywords": ["リンパ"], "mods": []}, {"id": "3974420993888404736", "username": "erika.gachalife", "text": "今まであまり気にした事なかったんだけど…\n左をリンパ郭清していて、右はセンチネルリンパ生検のみ。\n左右で脇汗のニオイが違う😅\nリンパ郭清した方の左は無臭で、右は体臭独特のニオイ。\nリンパ郭清したしないで関係あるのかわからないけど、そういうものなの？", "permalink": "https://www.threads.com/@erika.gachalife/post/Dcn-tYoksUA", "likes": 13, "velocity": 0.04, "ageHours": 321.8, "postedAt": "2026-08-29T21:52:04+09:00", "genres": ["リンパ"], "keywords": ["リンパ"], "mods": []}, {"id": "3981422213298982473", "username": "aum_artmake", "text": "いかにもアートメイク！！！より\nなんかきれいになったね？！アートメイクなの？！の方が好き", "perma 的知見をぜひお聞かせいただけませんか？", "permalink": "https://www.threads.com/@yujilaluz/post/DXSu6zqjypj", "likes": 11, "velocity": 0.0, "ageHours": 3502.5, "postedAt": "2026-04-19T09:13:04+09:00", "genres": ["鍼灸"], "keywords": ["鍼灸 手技", "鍼灸"], "mods": []}, {"id": "3964867567068700084", "username": "houmon_ac", "text": "自分が働いてた激ヤバ鍼灸院、訪問鍼灸院のエピソードおせーて🙄", "permalink": "https://www.threads.com/@houmon_ac/post/DcGCgukmN20", "likes": 11, "velocity": 0.02, "ageHours": 638.1, "postedAt": "2026-08-16T17:31:07+09:00", "genres": ["鍼灸"], "keywords": ["鍼灸 メニュー", "鍼灸 スクール"], "mods": []}, {"id": "3939911262981573636", "username": "kazumi_counseling", "text": "「あっ、この人、化粧品売るの上手いな」ってエステティシャンは、商品説明の入り方が全く違います。\n\n例えば、ドラコスを使っているお客様へ提案する時。", "permalink": "https://www.threads.com/@kazumi_counseling/post/DatYGtMk8wE", "likes": 11, "velocity": 0.01, "ageHours": 1464.5, "postedAt": "2026-07-13T07:07:24+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン 単価UP"], "mods": []}, {"id": "3960601725715497118", "username": "itsumitsuitsumi3", "text": "鍼灸でグサグサやってる動画を拝見するんだが、鍼を出し入れしてる時に、指の表面に触れたものが体内に入ってるんだけど、あれは衛生的にアリなの？ナシなの？\n（多分ナシだと思うんだけどさ）\n\n本来はどうなるのが効いてる鍼なんだ⋯？", "permalink": "https://www.threads.com/@itsumitsuitsumi3/post/Db24kkOEkCe", "likes": 11, "velocity": 0.01, "ageHours": 779.4, "postedAt": "2026-08-10T20:15:39+09:00", "genres": ["鍼灸"], "keywords": ["鍼灸 スクール"], "mods": []}, {"id": "3943320324200704656", "username": "miyuki__artmake", "text": "日々、上手な方々のアートメイク技術を\n拝見させていただき目がキラキラ、、、✨️\n\n是非、症例を見てもいいよという方がいましたら\nいいねとかで残して頂けると光栄です、、、、\n目キラキラさせながら見ます！！", "permalink": "https://www.threads.com/@miyuki__artmake/post/Da5fPE3j6qQ", "likes": 11, "velocity": 0.01, "ageHours": 1351.7, "postedAt": "2026-07-18T00:00:36+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク"], "mods": []}, {"id": "3904048410194649816", "username": "hinano_salon", "text": "6月1日美田園にサロンOPEN✨\nドライヘッドスパメニューありまーす🌙\nどのメニューにも顔筋、耳周りもしっかりほぐします！\n☆セルフケア⭐︎\n耳はひっぱるだけで疲れのリセットボタンっていわれてます！\n姿勢、視線真っ直ぐでやってみてください🌱", "permalink": "https://www.threads.com/@hi 84.3, "postedAt": "2026-09-04T15:19:45+09:00", "genres": ["リンパ"], "keywords": ["リンパ"], "mods": ["メニュー"]}, {"id": "3860933611428736742", "username": "natigron0", "text": "アトラスシダー精油（Cedrus atlantica）は、「リンパ鬱滞の緩和」や「ドレナージ作用」があるとよく語られます。\n\nこの精油は木部由来の重厚な精油で、β-ヒマカレン、α-ヒマカレン、γ-ヒマカレンなどのセスキテルペン類を多く含みます。既存研究を見る限りでは、抗炎症・抗浮腫方向の性質が示されており、この点は、むくみ感や重だるさ、組織の鬱滞感の緩和を考えるうえで手がかりになります。\n\nただし、ここからそのまま「リンパを直接流す精油」「排液を直接促進する精油」とは言えません。現時点で、主要成分そのものにリンパ流を直接高める作用が明確に示されているわけではないからです。\n\nつまりアトラスシダー精油は、炎症性の停滞に補助的に関わり、結果として軽さにつながる可能性のある、間接的なドレナージ様作用をもつ精油と捉える方が、実態に近いように思います。こう考えると、単独で万能視するより、むくみや鬱滞感への手技と組み合わせて生かしやすい精油、と位置づけるのが妥当でしょう。", "permalink": "https://www.threads.com/@natigron0/post/DWUyqnak27m", "likes": 10, "velocity": 0.0, "ageHours": 4079.8, "postedAt": "2026-03-26T07:52:54+09:00", "genres": ["リンパ"], "keywords": ["リンパ 手技"], "mods": ["手技"]}, {"id": "3972915196785290776", "username": "mico_biyou_roku", "text": "足底筋膜炎の人はこれ履いてって\nピラティスの先生に勧められて、Threadsにもオススメでバズってたから履き始めたら、まじで", "permalink": "https://www.threads.com/@mico_biyou_roku/post/DcioVJzI24Y", "likes": 10, "velocity": 0.03, "ageHours": 371.7, "postedAt": "2026-08-27T20:00:19+09:00", "genres": ["ピラティス"], "keywords": ["ピラティス"], "mods": ["手技"]}, {"id": "3972611318301803410", "username": "suu_sns_", "text": "京都で不妊、妊活が得意な鍼灸院教えて下さい！！", "permalink": "https://www.threads.com/@suu_sns_/post/DchjPI6E0OS", "likes": 10, "velocity": 0.03, "ageHours": 381.7, "postedAt": "2026-08-27T09:56:34+09:00", "genres": ["鍼灸"], "keywords": ["鍼灸 スクール", "鍼灸 メニュー"], "mods": []}, {"id": "3968900291362011937", "username": "nurse_yorimichi", "text": "ドラマの医療シーンで\n「その手技はない」って言っちゃうやつ。\n家族に「静かに見て」って言われるまでが\nセットですよね笑", "permalink": "https://www.threads.com/@nurse_yorimichi/post/DcUXclvk7sh", "likes": 10, "velocity": 0.02, "ageHours": 504.6, "postedAt": "2026-08-22T07:03:25+09:00", "genres": [], "keywords": ["手技"], "mods": ["手技"]}, {"id": "3959447223583064953", "username": "morinone2026", "text": "みんな内科とか歯医者とか、かかりつけ医持ってますよね。\nドライヘッドスパもそのくらいの価値、あると思ってます💆‍♀️", "permalink "ヘッドスパ"], "keywords": ["ヘッドスパ"], "mods": []}, {"id": "3981627482546843025", "username": "liaison.design279", "text": "シンプル、視認性、設計を大事に制作。\n飾らず、自然体で自分らしくいられること。\nシンプルで甘すぎないかっこよさを\n入れ込んだロゴ。\n\n美容サロンさん、ネイルサロンさん、\nまつ毛サロンさん、鍼灸整体院さんなどの\nサロンさんのロゴやカード類、チラシを\nよくご依頼いただきます💓", "permalink": "https://www.threads.com/@liaison.design279/post/DdBlRmNIy2R", "likes": 4, "velocity": 0.05, "ageHours": 83.2, "postedAt": "2026-09-08T20:30:05+09:00", "genres": ["鍼灸"], "keywords": ["鍼灸 手技"], "mods": []}, {"id": "3981375286940338268", "username": "dryheadspa_gyp", "text": "スクールに通ってドライヘッドスパの\n講師資格までとったけど\n私の技術面は独学な部分が多い。\n正直スクールで習ったものは物足りなくて\n値段とも見合ってないなぁと感じていました。\n開業して約一年。たくさんの方に触れて\n「どこで習ったの？」「教えてほしい」\n「他のお店も行ったけどやっぱりここがいい！」\nと言ってもらえる事が増えました。\n1年前は子どもたちの先生だった私ですが\n次は頭をゆるめる先生になる。\n技術も想いもひろめていけたらいいな✨", "permalink": "https://www.threads.com/@dryheadspa_gyp/post/DdAr7qvmQhc", "likes": 4, "velocity": 0.04, "ageHours": 91.5, "postedAt": "2026-09-08T12:09:01+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ 高単価"], "mods": ["経営", "スクール"]}, {"id": "3981436374461552810", "username": "omise_no_nikki", "text": "ソウルで初ヘッドスパしたいけどどこがおすすめなんだろう💆☁️", "permalink": "https://www.threads.com/@omise_no_nikki/post/DdA50m7mZiq", "likes": 4, "velocity": 0.04, "ageHours": 89.5, "postedAt": "2026-09-08T14:10:23+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ 経営", "ヘッドスパ メニュー", "ヘッドスパ"], "mods": []}, {"id": "3979324333035132326", "username": "chachamaruuu0707", "text": "眉毛のアートメイクモニター募集", "permalink": "https://www.threads.com/@chachamaruuu0707/post/Dc5ZmXEoJWm", "likes": 4, "velocity": 0.03, "ageHours": 159.4, "postedAt": "2026-09-05T16:14:08+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク 高単価", "アートメイク 経営"], "mods": []}, {"id": "3979401099619090653", "username": "share_salon_shirogane", "text": "サロン開業のとき、いちばん後回しにされるのが「単価」だと思ってます。\n\n場所も内装も決まってるのに、\n値段だけ最後に「相場だとこのくらいかな」で決めてしまうというか🤔\n\nいくらもらうかが先に決まっていないと、家賃の上限も内装にかける額も決めにくいのかなと思ってます。\n\nみなさんは何から決めましたか？？", "permalink": "https://www.threads.com/@share_salon_shirogane/post ww.threads.com/@lanikai_hari9/post/DbFn5e-kfHN", "likes": 4, "velocity": 0.0, "ageHours": 1238.5, "postedAt": "2026-07-22T17:07:10+09:00", "genres": ["鍼灸"], "keywords": ["鍼灸 スクール"], "mods": []}, {"id": "3937074061171964610", "username": "okadashinkyu_takarazuka", "text": "🌿患者様のお声をご紹介🌿\n\n「手技＋鍼灸で足がつるのがマシになった。日中の体が軽い！！よく歩ける！嬉しい！」\n\n嬉しいお言葉をありがとうございます😊\n\n足がつる症状や体の重だるさは、筋肉の緊張や血流の低下、姿勢のバランスなどが関係していることもあります。\n\n当院では、お一人おひとりのお身体の状態に合わせて、手技と鍼灸を組み合わせた施術をご提案しています。\n\n「最近よく足がつる…」\n「歩くのがつらい…」\n「体が重くて疲れやすい…」\n\nそんなお悩みがある方は、お気軽にご相談ください✨\n\n※施術の効果には個人差があります。\n掲載は患者様のご了承をいただいております。\n\n#おかだ鍼灸整骨院 #鍼灸 #整骨院 #足がつる #こむら返り", "permalink": "https://www.threads.com/@okadashinkyu_takarazuka/post/DajS__GjzrC", "likes": 4, "velocity": 0.0, "ageHours": 1558.5, "postedAt": "2026-07-09T09:10:23+09:00", "genres": ["鍼灸"], "keywords": ["鍼灸 手技"], "mods": ["手技"]}, {"id": "3968508969585813950", "username": "slimore.machida", "text": "東京 町田で、無理なくキレイを目指す痩身・美容サロンをやってます🫧\nお客様からお土産いただきました🥹🫶\n新メニューの準備などで最近めちゃくちゃ忙しいけど、\nこういう優しさにすごく癒されます🥹✨\nありがとうございます🤍", "permalink": "https://www.threads.com/@slimore.machida/post/DcS-eG8HSm-", "likes": 4, "velocity": 0.01, "ageHours": 517.6, "postedAt": "2026-08-21T18:05:56+09:00", "genres": ["美容サロン"], "keywords": ["美容サロン メニュー"], "mods": ["メニュー"]}, {"id": "3973004710370298118", "username": "kakuregasalon.mio", "text": "こんばんは⭐️隠れ家サロン澪の紫織です。\nいつもありがとうございます。\nまたまた久しぶりの投稿となってしまい申し訳ございません。\n今回は皆さまにご報告があり、投稿しております！\n今まで、夫婦2人で美容室を経営しておりましたが\n家の諸事情により私1人で当分営業することになりました。\n詳しくは、ホットペッパーのブログに書いてあります。\nお伝えしたお客様もいらっしゃいますが、まだの方もいらしたので\n投稿させていただきます。\nなので当分は、ヘッドスパを中心としたお店になります。\nただカラーやトリートメントなども施術できますので\n詳しくはホットペッパーをご覧になってください。\n\nもっと皆さまにヘッドスパの良さが伝わるよう、これまでより、もっとご満足いただけるヘッドスパメニューにしていきます。\n時代や、そのお客様に合ったヘッドスパをご堪能ください。\n\nより、心地よいサロンを目指します！！\n\nそして、これから投稿もどんどんしていきますので\n是非ご覧になってみてください❤️\n\n美容室#石岡#東光台#和風美容室#トリートメント#ヘッドスパ", "permalink": "https://www.threads.com/@kakuregasalon.mio/post/Dci8rv0k0kG", "likes": 4, "velocity": 0.01, "ageHours": 368.7, "postedAt": "2026-08-27T22:58:11+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ 経営", "ヘッドスパ メニュー"], "mods": ["経営", "メニュー"]}, {"id": "3866951604443934372", "username": "dryheadspa_oasis", "text": "本日開業届を提出してきました！\n4/3という日にご縁があるみたいで\n再スタートとしてまた新たな気持ちで\n突き進んで行きます🏃‍♀️\n\nおととしの11月にドライヘッドスパの施術に魅了され手技を習得し、それから自宅サロンをOpenしてずっとドライヘッドスパ愛を胸に抱きコツコツやってまいりました。\n\nとにかく、ヘッドマッサージが大好きなので\nそんなヘッドスパマニアな私の施術を一度\nご体感していただきたいです💆‍♀️🫧🫧\n\nピンとインスピレーションを持っていただい方は、ぜひご予約をお待ちしております🌳❤️\n@dryheadspa_oasis \n\n#ドライヘッドスパ\n#諫早", "permalink": "https://www.threads.com/@dryheadspa_oasis/post/DWqK_8Kge6k", "likes": 4, "velocity": 0.0, "ageHours": 3880.5, "postedAt": "2026-04-03T15:09:35+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ 手技"], "mods": ["経営", "手技"]}, {"id": "3963244240272569592", "username": "mizuking_artmake", "text": "眉アートメイクの相場はいくら？", "permalink": "https://www.threads.com/@mizuking_artmake/post/DcARaNrjzT4", "likes": 4, "velocity": 0.01, "ageHours": 691.9, "postedAt": "2026-08-14T11:45:51+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク"], "mods": []}, {"id": "3900916107046445349", "username": "artmake.maki", "text": "正直に話します...\nアートメイク看護師を目指している方は", "permalink": "https://www.threads.com/@artmake.maki/post/DYi1ogLGmEl", "likes": 4, "velocity": 0.0, "ageHours": 2755.8, "postedAt": "2026-05-20T11:50:59+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク スクール"], "mods": []}, {"id": "3976287188702273178", "username": "ohana.07", "text": "産後普通に動けるんだけど、\nじっとしていられないんだけど、\nやっぱり大人しくしてた方がいいのかな？\n一度も里帰りせず、退院翌日から\n家事もできる。上の子もいるしね！\n更年期が大変って聞くけど、、\n４人目もう今更遅いよね〜💦", "permalink": "https://www.threads.com/@ohana.07/post/DcunCF_iR6a", "likes": 4, "velocity": 0.02, "ageHours": 260.0, "postedAt": "2026-09-01T11:39:52+09:00", "genres": ["更年期ケア"], "keywords": ["更年期ケア 手技"], "mods": []}, {"id": "3974188841241764190", "username": "shinkyu_ueda", "text": "そもそも\n休みも欲しい、給料も欲しい、技術も欲しい\nって無理じゃないかな。\n給料や休みが欲しいのに鍼灸業界に入るのはミスマッチな気がする。", "permalink": "https://www.threads.com/@shinkyu_ueda/post/DcnJ7HoiWFe", "likes": 4, "velocity": 0.01, "ageHours": 329.5, "postedAt": "2026-08-29T14:10:50+09:00", "genres": ["鍼灸"], "keywords": ["鍼灸 経営"], "mods": []}, {"id": "3901356937615770299", "username": "akiko__dayo", "text": "韓国で行ったクリニックでアート除去のメニューもあってお願いしたら１回でこんなに色の濃さが抜けた😭💯🫶🏻\nしかも69000wだからね🥺🇰🇷\n\n日本のクリニックでカウンセリング行った時１回35000円って言われて高いなぁと思って泣く泣く帰ったもん🥹\n美容の優先順位的に眉のアートメイク除去が低かったから🥵\n35000円あるならハイフとかしたいしね🥵\n\n過去の写真見返すとこの眉毛の濃さで生きていたのかと思って恥ずかしくなるわ、、、、(写真2枚目)\n\n眉毛が焦げかもとか注意事項言われて不安だったけど見事無事でした🥹👏🏻", "permalink": "https://www.threads.com/@akiko__dayo/post/DYkZ3bomAK7", "likes": 4, "velocity": 0.0, "ageHours": 2741.2, "postedAt": "2026-05-21T02:26:50+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク メニュー"], "mods": ["メニュー"]}, {"id": "3957340276381604979", "username": "nal_artmake_school", "text": "アートメイクスクールに3校通って、\n一番感じたこと。それは、", "permalink": "https://www.threads.com/@nal_artmake_school/post/DbrTAO1Elxz", "likes": 4, "velocity": 0.0, "ageHours": 887.4, "postedAt": "2026-08-06T08:15:44+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク 高単価"], "mods": ["スクール"]}, {"id": "3895241692673493840", "username": "hari9_glow", "text": "鍼灸GLOWの施術メニューのご案内\n\n【 鍼灸コース 】\n肩こり・腰痛などの部分的なケアから、自律神経の症状など全身を整えるオーダーメイド施術まで。\n\n● ポイント鍼灸（30分）… ¥5,500\n● スタンダード（60分）… 全身オーダーメイド\n● スペシャル（90分）… ほぐし・箱灸を含むトータルケア\n\n【 美容鍼コース 】\n気になるパーツの集中ケアから、お顔全体のバランス調整まで。\n\n● ポイント（20本）… ¥5,500（初心者の方に◎）\n● スタンダード（50本）… ¥11,000\n● スペシャル（80本）… ¥14,300（お悩み全部解決したい方に！）\n\n「最近疲れが取れないな」「お肌の調子を上げたいな」と感じたら、ぜひ一度ご相談ください🌿\n\nご予約・お問い合わせはプロフィール欄のリンク、\nまたはDMからお待ちしております💌\n\n💫鍼灸GLOW\n名古屋市東区泉1丁目22-26\nN.S.ZEAL泉701", "permalink": "https://www.threads.com/@hari9_glow/post/DYOra5-GEtQ", "likes": 4, "velocity": 0.0, "ageHours": 2943.7, "postedAt": "2026-05-12T15:56:56+09:00", "genres": ["鍼灸"], "keywords": ["鍼灸 メニュー"], "mods": ["メニュー", "手技"]}, {"id": "3978089089903201147", "username": "kogao.salon_you.osaka", "text": "箕面で大人の小顔専門サロンしています。\n100種類以上の手技を習った私はその日のお客様に合う施術を組み立てながら行います。\n一人一人の悩みも違えばお肌状態も違うから。", "permalink": "https://www.threads.com/@kogao.salon_you.osaka/post/Dc1AvNQiYt7", "likes": 3, "velocity": 0.01, "ageHours": 200.3, "postedAt": "2026-09-03T23:19:55+09:00", "genres": ["小顔"], "keywords": ["小顔 手技"], "mods": ["手技"]}, {"id": "3897688335724782165", "username": "la_lanun", "text": "イットリフトの研修でも🤭💕\nクレンジングや洗顔の基礎的な手技でも🫧\nお顔の筋肉名が共通言語🫣✨\n小頬骨筋が今日のハイライトです👏🏻", "permalink": "https://www.threads.com/@la_lanun/post/DYXXuP4DyJV", "likes": 3, "velocity": 0.0, "ageHours": 2862.7, "postedAt": "2026-05-16T00:57:59+09:00", "genres": ["小顔"], "keywords": ["小顔 手技"], "mods": ["手技"]}, {"id": "3868636632857837388", "username": "u__pa_ru_pa__", "text": "炎上覚悟で言うけど、まつ毛美容液って高ければいいと思ってる人ほど損してる。2ヶ月前までスカスカだったのに、ラッシュアディクトもエマーキットも使わずここまで伸びた。しかもプロスタグランジン類似体なし＝色素沈着の心配なし。理由はキャピキシル10%の育毛剤レベルの成分入ってる。", "permalink": "https://www.threads.com/@u__pa_ru_pa__/post/DWwKIVKjf9M", "likes": 3, "velocity": 0.0, "ageHours": 3824.7, "postedAt": "2026-04-05T22:57:26+09:00", "genres": ["育毛"], "keywords": ["育毛"], "mods": []}, {"id": "3976422299297696203", "username": "bright.hari.ikumou.diet", "text": "【抜け毛のお悩み、一緒に解決していきましょう】\n\n育毛鍼🪡に興味をもっていただき、2週間に一度の施術を継続中、\n生え際はまだまだこれから、といった感じでは\nありますが、\nシャンプー時の抜け毛が以前程気にならなくなってきたと\n嬉しい感想。\n\n頭頂部のつむじ周囲の地肌も\n確実に目立ちにくくなってきています。\n\n頭皮や首のコリを\n鍼とマッサージで丁寧にほぐしていくので、\n慢性的に悩まれていた\n頭痛😣も変化が。\n\nこの調子で色んな不調\nしっかり取り除いていきましょう✊️✊️\n\n＃育毛鍼\n＃抜け毛対策\n＃早めにスタート", "permalink": "https://www.threads.com/@bright.hari.ikumou.diet/post/DcvFwNilMnL", "likes": 3, "velocity": 0.01, "ageHours": 255.5, "postedAt": "2026-09-01T16:08:19+09:00", "genres": ["育毛"], "keywords": ["育毛 手技"], "mods": ["手技"]}, {"id": "3980181170687682285", "username": "rouka_taisaku43", "text": "43歳。\n薄毛が気になり始めた。\n\nAGAって言葉は知ってるけど、\n正直まだ何から調べればいいのかすら分かってない。\n\n同じくらいの年齢で薄毛対策してる人、\n最初に何から始めました？\n\n育毛剤？\n皮膚科？\nAGAクリニック？\n\n経験談あったら参考にしたいです。", "permalink": "https://www.threads.com/@rouka_taisaku43/post/Dc8ca_Uiabt", "likes": 3, "velocity": 0.02, "ageHours": 131.1, "postedAt": "2026-09-06T20:36:31+09:00", "genres": ["育毛"], "keywords": ["育毛 手技"], "mods": []}, {"id": "3966833175149279539", "username": "p_p.tai_massage", "text": "セラピストの求人媒体ってホットペッパーかリジョブどちらが良いんでしょ ps://www.threads.com/@karinonnontan/post/DaoVp1cAbnY", "likes": 3, "velocity": 0.0, "ageHours": 1511.5, "postedAt": "2026-07-11T08:09:47+09:00", "genres": ["リンパ"], "keywords": ["リンパ"], "mods": []}, {"id": "3904592364404946896", "username": "stella.no.kodomo", "text": "山形県庄内の小さな町の小さなお家で\nママも子どももペットもばっちこいな\nヒーリングサロンを作っております。\n\n｢(圧してないのに)なんで？！！！｣\nって言われる方がほとんどです。\n\n圧してないのに揉んでないのに、\n何で体が動きやすくなったの？\nって。\n\n白状します…\nそれはねー、\n実はレイキヒーリング“だけ”やってるんじゃないんです。\n\nレイキヒーリングをぶん回しながら、\n手当ての手技でリンパやファシア(筋膜)に働きかけてるから\n圧しても揉んでも擦ってもないのに\nこんなに体がゆるむの。\n\n一応ね、やることやってるの。\nただしゃべってるだけじゃないの(笑)\n\nレイキヒーリングだけでも十分に体はゆるむし\n手当てだけでも十分に体はゆるむんだけど、\nレイキヒーリングと手当てを掛け合わせることでお互いの効果にバフがかかるようになってるよ。\nそいで、持ちも良いって噂。\nレイキで取り入れるエネルギーは\nメイドイン地球の自然のエネルギーだから体になーんにも悪くないし、\nこんなに良いとこづくめな\nレイキヒーリング、受けて損はないでしょーよー", "permalink": "https://www.threads.com/@stella.no.kodomo/post/DYv5hFpDzfQ", "likes": 3, "velocity": 0.0, "ageHours": 2634.1, "postedAt": "2026-05-25T13:35:03+09:00", "genres": ["リンパ"], "keywords": ["リンパ 手技"], "mods": ["手技"]}, {"id": "3983752128342088089", "username": "biyou____police", "text": "エステティシャンの友人に「最近肌がゆらいでる気がする」って相談したら、「乳液パックやってみたら？」って教えてもらった。", "permalink": "https://www.threads.com/@biyou____police/post/DdJIXQzCVmZ", "likes": 3, "velocity": 0.23, "ageHours": 12.8, "postedAt": "2026-09-11T18:51:22+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン 単価UP"], "mods": []}, {"id": "3983018375483703041", "username": "medicalbrows_sugiki", "text": "アートメイクのデザインする時、\n必ずしてることがあります。", "permalink": "https://www.threads.com/@medicalbrows_sugiki/post/DdGhhwMjz8B", "likes": 3, "velocity": 0.08, "ageHours": 37.1, "postedAt": "2026-09-10T18:33:32+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク"], "mods": []}, {"id": "3982035212775351433", "username": "itosina.naha", "text": "おはようございます☀\n本日も10:00〜20:00まで営業しております！\n\n指輪の模様付け体験とパーマネントジュエリーもどちらも当日予約も大歓迎です◎\n\n指輪の仕上がりまでの待ち時間は、ウミカジテラスの他の店舗でお過ごしいただけます🍀\n\n店頭のサンプル購入も可能です♪\nぜひお立ち寄りください☺️", "permalink": "https://www.threads.com/@itosina.naha/post/DdDB-2kkmSJ", "likes": 3, hreads.com/@daisukedekakin/post/Db0f7llj1DO", "likes": 3, "velocity": 0.0, "ageHours": 801.6, "postedAt": "2026-08-09T22:01:52+09:00", "genres": ["鍼灸"], "keywords": ["鍼灸 メニュー"], "mods": ["メニュー"]}, {"id": "3880115138209122610", "username": "ayumi12107", "text": "えー今回のネイルは\nこうなりましたぁ〜❤️\n短くなったよー！！！\n初めての時もめっちゃ楽しかったけど\n2回目も笑ってばっかで\n本当にサロンに行くのが楽しくて仕方ない！\nパーマネントジュエリーもしたの💎\nしかもお姉さんとお揃いの💍\nちょー可愛い！私のむちむち手には\nよくみえないかもだけど\nお姉さんのほっそい指にはめちゃんこ\n可愛いんですよ！\nまた来月も楽しみで仕方ない！！", "permalink": "https://www.threads.com/@ayumi12107/post/DXY8CkUkgky", "likes": 3, "velocity": 0.0, "ageHours": 3444.6, "postedAt": "2026-04-21T19:03:10+09:00", "genres": ["パーマネントジュエリー"], "keywords": ["パーマネントジュエリー 高単価"], "mods": []}, {"id": "3971230905864033074", "username": "treatment_school", "text": "セラピストさんが今日から出来ること！\n\nベッド・タオル・手・室温など清潔感と快適さを再度確認する！", "permalink": "https://www.threads.com/@treatment_school/post/DccpXfpFBMy", "likes": 3, "velocity": 0.01, "ageHours": 427.4, "postedAt": "2026-08-25T12:13:56+09:00", "genres": ["リンパ"], "keywords": ["リンパ"], "mods": []}, {"id": "3864578130354115998", "username": "tetsuhirokawano", "text": "【これ、普通に安すぎる】\n\n1台で\n\n✔育毛\n✔エステ\n✔小顔\n✔肌質改善\n\n全部できる複合美容機。\n\n本来300万円のマシンが\n\n👉 120万円（1年使用）\n\nしかも\n\n✔メーカー補助1年付き\n✔使用研修付き\n\n正直これ、\n\n1メニュー作れば回収できるレベル。\n\n育毛・フェイシャルは\n高単価作りやすいので\n\n👉 新規顧客獲得\n👉 客単価アップ\n\nどっちも狙える。\n\nこういう案件は\n基本“早い者勝ち”。\n\n気になる方はご連絡ください。", "permalink": "https://www.threads.com/@tetsuhirokawano/post/DWhvVWKgBWe", "likes": 2, "velocity": 0.0, "ageHours": 3959.1, "postedAt": "2026-03-31T08:33:55+09:00", "genres": ["小顔"], "keywords": ["小顔 高単価"], "mods": ["経営", "メニュー", "高単価", "単価UP"]}, {"id": "3979468278518944769", "username": "alu_sangenjaya", "text": "「育毛」って聞くと、\n男性向けのイメージがありませんか？", "permalink": "https://www.threads.com/@alu_sangenjaya/post/Dc56VCwDpQB", "likes": 2, "velocity": 0.01, "ageHours": 154.7, "postedAt": "2026-09-05T21:00:08+09:00", "genres": ["育毛"], "keywords": ["育毛 手技"], "mods": []}, {"id": "3983696261806110663", "username": "akkey_lucky85", "text": "自分は ikes": 1, "velocity": 0.01, "ageHours": 199.4, "postedAt": "2026-09-04T00:18:08+09:00", "genres": ["小顔"], "keywords": ["小顔 高単価"], "mods": []}, {"id": "3918587327954409340", "username": "tukawanaidayon", "text": "小顔矯正は詐欺に近い。元美容ナースとして言う。骨格は手で動かせない。月2万円払って変わっているのは骨じゃない。じゃあ何が変わっているかというと、、、", "permalink": "https://www.threads.com/@tukawanaidayon/post/DZhnmnIEdd8", "likes": 1, "velocity": 0.0, "ageHours": 2170.7, "postedAt": "2026-06-13T21:00:33+09:00", "genres": ["小顔"], "keywords": ["小顔 高単価"], "mods": ["高単価"]}, {"id": "3950145275294148147", "username": "kaishinkyuuseikotuin", "text": "🌿【小顔矯正で本当に顔は小さくなる？医学的根拠から解説】\n\n「頭蓋骨を動かして小顔にする」「骨盤を締めると顔まで小さくなる」といった説明を耳にすることがあります。しかし、成人の頭蓋骨や骨盤を手の力で動かしたり変形させたりすることは、現在の解剖学では考えにくいとされています。\n\nでは、小顔矯正は意味がないのでしょうか？\n\n答えは**「いいえ」**です。\n\n小顔に見える主な理由は、骨ではなく**筋肉・むくみ・関節の位置関係（アライメント）**の変化です。\n\n✅ 咬筋・側頭筋・表情筋の緊張が和らぐ\n✅ むくみが軽減しフェイスラインがすっきりする\n✅ 顎関節や首・姿勢のバランスが整う\n✅ 血流が改善し顔色や輪郭が引き締まって見える\n\n🤲手技は筋肉やリンパへ優しくアプローチし、リラックス効果が期待できます。一方で、強い圧で骨を小さくすることはできず、過度な刺激は痛みや内出血の原因になることがあります。\n\n🪡美容鍼は表情筋や筋膜へ直接刺激を与え、筋緊張や血流改善を促します。むくみやフェイスラインの変化を感じる方もいますが、永久的に小顔になるという十分な科学的根拠はありません。", "permalink": "https://www.threads.com/@kaishinkyuuseikotuin/post/DbRvDL5GGYz", "likes": 1, "velocity": 0.0, "ageHours": 1125.7, "postedAt": "2026-07-27T10:00:33+09:00", "genres": ["小顔"], "keywords": ["小顔 手技"], "mods": ["手技"]}, {"id": "3947518277505197622", "username": "lula.kyoto", "text": "多くの患者様からご指名いただいている矢田院長による\n小顔脂肪吸引👩🏻‍⚕️✨\n\nお顔全体のバランスを見極めながら一人ひとりに合わせて\n丁寧にデザイン🌿\n\n繊細な手技で、すっきりとしたフェイスラインと自然な小顔を目指します‼️\n\nぜひ症例写真をご覧ください📸\n\n#ルラ美容クリニック", "permalink": "https://www.threads.com/@lula.kyoto/post/DbIZvVjDyY2", "likes": 1, "velocity": 0.0, "ageHours": 1212.6, "postedAt": "2026-07-23T19:01:11+09:00", "genres": ["小顔"], "keywords": ["小顔 手技"], "mods": ["手技"]}, {"id": "3977354297738525553", "username": "sharemee_official", "text": "セラピスト向けのスキルアップ会や練習会に\n参加されたことがある方\n主催されたことがある方いますか？🙋‍♀️❣️\n\n実際どのくらいいるのかな？🥹", "permalink": "https://www.threads.com/@sharemee_official/post/DcyZqkuk_tx", "likes": 1, "velocity": 0.0, "ageHours": 224.7, "postedAt": "2026-09-02T23:00:01+09:00", "genres": ["セラピスト"], "keywords": ["セラピスト"], "mods": []}, {"id": "3976303252711145460", "username": "mieruka_nori", "text": ".\n「単価を上げる」\nそう聞くと...\n\n「値上げする？」\n「高単価メニューを作る？」\n「価値をもっと伝える？」\n\nそんな方法を思い浮かべるかもしれません\nでも私は、どれもちょっと苦手です😅\n\n値上げするのも怖い\n上手に価値を伝えて納得してもらうのも大変\n\nましてや\n強いクロージングなんてできればしたくない🤣\n\nだったら...\n\n値上げしない\n売り込まない\n\nそれでも単価が上がる「仕組み」を考えた方が\n施術する側も受ける側も自然なんじゃないか...\n\n私はそんな方向から\n施術院の単価やLTVを考えています\n\nしかも...\nそれが結果として\n価格競争から離れることにもつながるとしたら？\n\n「もっと頑張って売る」以外にも\n経営の数字を変える方法はあると思うんです\n\n#施術院経営 \n#整体院経営 \n#治療院経営 \n#単価アップ \n#ノリ加藤", "permalink": "https://www.threads.com/@mieruka_nori/post/Dcuqr2xE__0", "likes": 1, "velocity": 0.0, "ageHours": 259.5, "postedAt": "2026-09-01T12:11:49+09:00", "genres": ["セラピスト", "エステティシャン"], "keywords": ["セラピスト 高単価", "エステティシャン 高単価"], "mods": ["経営", "メニュー", "高単価", "単価UP"]}, {"id": "3977757898506842051", "username": "happybetty358", "text": "🌾🌾和合の郷🌾🌾\n\n第四期修了特別講演会\n\n＼「知る」ことから、未来はつながる🤝✨／\n\n和合の郷第4期 特別講演会＆音楽ライブ♪  開催決定！\n\n今回は、子どもたちの現状や沖縄の歴史から、「これからの生き方」を学ぶ貴重な時間です。\n\n講演と音楽ライブ、盛りだくさんの内容でお届けします🎶\nぜひ、お気軽にご参加ください！😊\n--\n■日時：9月12日（土）\n 13:00～15:30\n■会場：採do所\n（福岡県田川郡香春町採銅所6095）\n■参加費：1,000縁\n （高校生以下無料）\n--\n📚【特別講演】\n講師：林 琴枝（セラピスト）\n「私の出会った子どもたちと10年後の未来」\n講師：益永 早苗（愛の伝道師）\n「知ることは、愛の始まり」\n🎶【音楽ライブ】\nmow mow sibs\n沖縄三線をベースに、ジャンルを問わず唄をたのしむ集団\n\n詳細・お申込みは、こちら\nhttps://forms.gle/tMUxYfbF9WBVw2oE7\n\n皆さまのご参加をお待ちしております！🌿", "permalink": "https://www.threads.com/@happybetty358/post/Dcz1bvPAS_D", "likes": 1, "velocity": 0.0, "ageHours": 211.3, "postedAt": "2026-09-03T12:21:55+09:00", "genres": ["セラピスト"], "keywords": ["セラピスト 高単価"], "mods": ["スクール"]}, {"id": "3977229316354399922", "username": "t_a_cieloblu", "text": "タオルワークってとても大切な手技です。ただお客さまにはかけているだけでは選りません。\n\nセラピストの想いと心を届ける大切な手技です。\n少しくらい問題ないよね?\nその気の緩みがお客さまへ伝わり、お客様の心を話してしまいます。\n大切なタオルワークについ書いた記事です。\nぜひ読んでみてくださいね。\nhttps://note.com/cielo_blu2018/n/n7fb0dc73745b", "permalink": "https://www.threads.com/@t_a_cieloblu/post/Dcx9P2vkt6y", "li 83817075905906566", "username": "naoko_pro", "text": "新人エステティシャンさん、\nそのカウンセリング…かなり損しています。\n\n一生懸命カウンセリングしているのに、", "permalink": "https://www.threads.com/@naoko_pro/post/DdJXIX7gceG", "likes": 1, "velocity": 0.09, "ageHours": 10.7, "postedAt": "2026-09-11T21:00:25+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン 単価UP"], "mods": []}, {"id": "3983697095601576625", "username": "tennisday923", "text": "🚩 テニスの日イベント紹介\n【東京】プロのクリニックと縁日が、同じ日にあります🎾\n\nネオインドアテニススクール西新井で「2026ネオ祭り」。所属プロによるクリニック、ピックルボール体験会、そして縁日を実施します。\n\n9月22日（火）開催。※スクール生・会員の方が対象です。\n\n▼詳細\nhttps://www.tennisday.jp/event/2026%e3%83%8d%e3%82%aa%e7%a5%ad%e3%82%8a/\n\n▼テニスの日イベント一覧\nhttps://www.tennisday.jp/event/", "permalink": "https://www.threads.com/@tennisday923/post/DdI72bkFlqx", "likes": 1, "velocity": 0.07, "ageHours": 14.6, "postedAt": "2026-09-11T17:02:06+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン スクール"], "mods": ["スクール"]}, {"id": "3983691239321988986", "username": "mitteicingcookie", "text": "•\n①\nこのたび、わんちゃんのスクールを開校されるにあたり、\n皆さまへのご挨拶用のアイシングクッキーを\nオーダーいただきました🐾\n\nそれぞれのわんちゃんの可愛らしさを詰め込んだ\nわんちゃんモチーフのクッキーたち🤍\n\n大切な新しい門出に、\nmitteのクッキーを選んでいただけたことを\nとても嬉しく思います🥹✨\n\nたくさんのわんちゃんと飼い主さまに愛される\n素敵なスクールになりますように🐶🍀\n\nこのたびは大切なご依頼をありがとうございました☺️🙏\n\n#アイシングクッキー専門店 #オーダーアイシングクッキー #犬アイシングクッキー", "permalink": "https://www.threads.com/@mitteicingcookie/post/DdI6hNen296", "likes": 1, "velocity": 0.07, "ageHours": 14.8, "postedAt": "2026-09-11T16:50:24+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン スクール"], "mods": ["スクール"]}, {"id": "3983689648698373883", "username": "seitai_teras", "text": "まだまだ知られてない千葉の整体屋さんです。\n\n・千葉駅徒歩6分\n・ベッド1台のコンパクトなお店\n・店の看板なしのまま５年目に突入\n・同じ建物にはヘッドスパと美容室\n\n到着すると「ここであってる？」と不安になる方も多数。勇気を出してインターホンを押してくれた方々に支えられて５年目となりました。\n\n客観的にも最後の最後であやしさがでる整体サロンですが、いつでもご予約大歓迎ですっ", "permalink": "https://www.threads.com/@seitai_teras/post/DdI6KEGETb7", "likes": 1, "velocity": 0.07, "ageHours": 14.9, "postedAt": "2026-09-11T16:47:14+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ 手技"], "mods": []}, {"id": "3983635676830911993", "username": "iwano_stocksun", "text": "技術が上がれば単価が上がると思っているなら、順番が逆だ。採用する側から見ると、専門スキルは最速3ヶ月で追いつく。追いつかないのは、期待値の握り方、レスの速さ、資料の作り方、提案の組み立ての4つだ。こちらは何年やってもできない人間がいる。大手出身者が強く見える理由も同じで、", "permalink": "https://www.threads.com/@iwano_stocksun/post/DdIt4q4FE35", "likes": 1, "velocity": 0.06, "ageHours": 16.7, "postedAt": "2026-09-11T15:00:02+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン 単価UP"], "mods": ["単価UP"]}, {"id": "3983672034030926838", "username": "allways.with.you.2025.08", "text": "📖\n9月8日（火）\n久々に来たスクール生。\n大雨すぎて、ベランダにも出にくく、窓越しに稲の観察。\n学年を戻って基礎がため学習を少々。\nその後は好きな将棋をしていました。\nお昼は食べずに帰宅な生徒さん。\n\nこんな過ごし方もあります。\n\nまた、相談に来られる保護者様も最近いらっしゃいます。\n不登校にはなってないけど、兆候がありそう。\n不登校に戻った際に行ける場所を、先に知りたい。など。\n相談内容は様々です。\n\n子どもの居場所にも、保護者の居場所でも、あります。\n\n必要な方に届きますように🙏", "permalink": "https://www.threads.com/@allways.with.you.2025.08/post/DdI2JvKEjv2", "likes": 1, "velocity": 0.06, "ageHours": 15.5, "postedAt": "2026-09-11T16:12:14+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン スクール"], "mods": ["スクール"]}, {"id": "3983534427666574345", "username": "belfine_ayn", "text": "エステティシャンになって思うこと。\n\n「月に1〜2回エステに来てるから大丈夫」\nではない。\n\nでも一番大事なのは、\nサロンケアだけでなく、ホームケア。\n\n1ヶ月のうち、残りの29日はご自宅で過ごします🏠\nだからこそ、サロンに来れない日に何をするかまで考えてもらうことも私たちの使命だと思っています🌼\n\n今日もその人の肌を見て、\nその人に合うケアを考える日♡", "permalink": "https://www.threads.com/@belfine_ayn/post/DdIW3TPmuwJ", "likes": 1, "velocity": 0.05, "ageHours": 20.0, "postedAt": "2026-09-11T11:38:50+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン 単価UP"], "mods": []}, {"id": "3983400564138680654", "username": "kazumi_counseling", "text": "「わっ、この人、リピーターが多い」って思うエステティシャンは、「通いたいです」と言われ回数券を提案すると「お支払いは次回で」と言われた時の返しが上手いです。\n\nそのまま言ってみて下さい", "permalink": "https://www.threads.com/@kazumi_counseling/post/DdH4bVHk6FO", "likes": 1, "velocity": 0.04, "ageHours": 24.5, "postedAt": "2026-09-11T07:12:52+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン 単価UP"], "mods": ["メニュー"]}, {"id": "3977787565927872162", "username": "grace_fiore_kyobashi", "text": "エラ、首、肩がコリすぎると頭まで痛くなってきませんか？\nそれらを揉みほぐして不調を改善し、お顔まで小さくスッキリさせるのが頭蓋骨小顔矯正です🧐", "permalink": "https://www.threads.com/@grace_fiore_kyobashi/post/Dcz8LdLGLai", "likes": 0, "velocity": 0.0, "ageHours": 210.3, "postedAt": "2026-09-03T13:20:51+09:00", "genres": ["小顔"], "keywords": ["小顔", "小顔 メニュー", "小顔 高単価"], "mods": ["手技"]}, {"id": "3861796178207791789", "username": "pouce_salon.1107", "text": "新小顔メニュー考案中！！", "permalink": "https://www.threads.com/@pouce_salon.1107/post/DWX2ynVCVqt", "likes": 0, "velocity": 0.0, "ageHours": 4051.2, "postedAt": "2026-03-27T12:26:49+09:00", "genres": ["小顔"], "keywords": ["小顔 メニュー"], "mods": ["メニュー"]}, {"id": "3890927925189631895", "username": "codethefuture", "text": "小顔サロンを経営するエンジニア出身の経営者が、毎日ここで書いていること。\n\nAIとスタッフと売上と、自分の顔のことを同時に考えている。\n採用で失敗した話も、補助金を通した話も、価格を上げた月の数字も、そのまま書いている。\n\n教科書じゃなく、自分の現場の話だ。", "permalink": "https://www.threads.com/@codethefuture/post/DX_WlU7k1-X", "likes": 0, "velocity": 0.0, "ageHours": 3086.6, "postedAt": "2026-05-06T17:06:23+09:00", "genres": ["小顔"], "keywords": ["小顔 経営"], "mods": ["経営"]}, {"id": "3978458128635395655", "username": "antian.asa", "text": "実は、顔が痩せている方のエラボトックスは、基本的にお断りすることが多いです\nカウンセリングで「小顔になりたい」と言われても、全員に打つわけではありません\n\n打って本当に輪郭が綺麗になるのは、この3つの条件が揃っている方だけです👇\n1️⃣ 咬筋（筋肉）がしっかり発達している\n奥歯を噛みしめた時にカチッと硬い膨らみがある方。骨格や脂肪が原因の場合は、ボトックスでは変化が出にくいです。\n2️⃣ 頬がコケていない\nここが一番重要。元々お顔が痩せている方がエラを小さくすると、頬の凹みが強調されて逆に老けて見えてしまいます。\n3️⃣ 頬骨が張りすぎていない\n下顔面を縮めた時に、相対的に頬骨が目立ってゴツゴツしないバランスが大切です。\n私が診察で一番大切にしているのは、「筋肉の大きさ」ではなく「お顔全体のバランス」。\nただ減らす（小さくする）のではなく、あなたに一番似合う自然な輪郭を整えましょう 🤍", "permalink": "https://www.threads.com/@antian.asa/post/Dc2UpbXE_5H", "likes": 0, "velocity": 0.0, "ageHours": 188.1, "postedAt": "2026-09-04T11:33:08+09:00", "genres": ["小顔"], "keywords": ["小顔 経営"], "mods": []}, {"id": "3978459281498492282", "username": "comma_rinka", "text": "顔型・骨格・髪質はもちろん、\n身長や体型、ファッションの雰囲気までトータルで見ながら\n“あなたらしく可愛くなれる”似合わせをご提案します♡\n\n髪質や顔型に合わせて、\n丁寧に繊細にデザインカット✂️✨\n\n特にこだわっているのは顔まわり。\n前髪やサイドの毛流れまで細かくデザインして、\n自然に小顔に見えるスタイルに仕上げます🫧\n\n韓国っぽい顔まわりやレイヤーカットは\nちょっとしたカットの違いで印象が変わるからこそ、\n一人ひとりに合わせた質感・シルエットを大切にしています🤍\n\n「こんな雰囲気になりたい♡」\n「自分に似合うスタイルがわからない…」\nそんな方も大歓迎です☺️\n\nなりたいイメージを一緒に相談しながら、\nあなたに似合う可愛いを見つけていきましょう🌷\n\nInstagram → @comma_rinka\nリールでもスタイルを発信しています🎀\n\nぜひ可愛くなるお手伝いをさせてください♡\nご来店お待ちしています🫶🏻\n\n#大阪美容室 #透明感カラー #似合わせカラー #パーソナルカラー診断 #赤み消しカラー", "permalink": "https://www.threads.com/@comma_rinka/post/Dc2U6NDEs16", "likes": 0, "velocity": 0.0, "ageHours": 188.1, "postedAt": "2026-09-04T11:35:28+09:00", "genres": ["小顔"], "keywords": ["小顔 経営"], "mods": []}, {"id": "3976539993733116108", "username": "serena.official428", "text": "9月、serenaは3周年を迎えます。\n\n3周年を記念して、新しいフェイシャルメニュー\n「フェイシャル小顔リフト」をスタートします。\n\n美容ナースとしてお客様のフェイシャルトリートメントを\n美容ナースとして、美容クリニックで仕事をする傍ら、\nクリニックが休みの日だけの営業にも関わらず、\n3周年を迎える9月は、毎週のようにリピートのお客様がご予約をしてくださっております。\n\n本当に感謝の気持ちでいっぱいです。\n\nserena【現役ナースがセラピストのサロン】\n営業日\n２(水)、9(水) 、16(水)、23(水㊗️)、25(金)、30(水)\n\nですが、\n9(水)と25(金)は、\nまだご予約頂けます。\n\nホットペッパービューティーからご予約頂けます。\n\n#羽田空港近くのサロン \n#穴守稲荷駅徒歩4分\n#現役ナースがセラピスト\n#フェイシャル小顔リフト\n#美容ナースが行うエステ", "permalink": "https://www.threads.com/@serena.official428/post/Dcvgg5BmLDM", "likes": 0, "velocity": 0.0, "ageHours": 251.6, "postedAt": "2026-09-01T20:02:09+09:00", "genres": ["小顔"], "keywords": ["小顔 メニュー"], "mods": ["経営", "メニュー"]}, {"id": "3979770572317988605", "username": "bupura_fuse", "text": "あの、お願いがあります\n布施で頭蓋骨小顔矯正（頭皮マッサージ×小顔マッサージ）＋美肌ケアのサロンをしているのですが、\n一度覗いてくれませんか？🌿‬✨️", "permalink": "https://www.threads.com/@bupura_fuse/post/Dc6_D_ykRb9", "likes": 0, "velocity": 0.0, "ageHours": 144.7, "postedAt": "2026-09-06T07:00:44+09:00", "genres": ["小顔"], "keywords": ["小顔 メニュー", "小顔 高単価"], "mods": []}, {"id": "3978388916638315936", "username": "atsuki_saito.hair", "text": "〈顔まわりの似合わせ〉\n〈小顔レイヤーカット〉\n〈細め上品ハイライト〉\nで多くの高評価口コミいただいてます◎\n\n「薬剤ののこだわり」\nカラーや縮毛矯正など、薬剤を使うメニューはダメージがつきものですが、髪のケア剤はもちろん、なるべくダメージさせない薬剤や配合にこだわってます！\n\n「丁寧なカウンセリング」\n「幅広い提案力」で\n必ず素敵にします！\n\nホームケアのやり方、スタイリングもレクチャーさせていただきます♪\n\nお洒落で上品なヘアはお任せください❕\n\n⚠︎黒染め、縮毛矯正の履歴がある方は、ハイライトなどのブリーチ施術をお断りさせていただく場合がございます。\n\n【場所】\nJIL BLAN 表参道\n malink": "https://www.threads.com/@honobono_seitai/post/Dc0DUPiE6fO", "likes": 0, "velocity": 0.0, "ageHours": 209.3, "postedAt": "2026-09-03T14:23:13+09:00", "genres": ["小顔"], "keywords": ["小顔 メニュー"], "mods": ["メニュー"]}, {"id": "3979739308739496952", "username": "angel_kogao_body", "text": "たるみ改善【美小顔骨格セッション】\n受けられる目的は『美小顔、美ボディになる』と言うのがコンセプトです。そして身体の調子も整っていきます。", "permalink": "https://www.threads.com/@angel_kogao_body/post/Dc639DUE4v4", "likes": 0, "velocity": 0.0, "ageHours": 145.7, "postedAt": "2026-09-06T05:58:37+09:00", "genres": ["小顔"], "keywords": ["小顔 メニュー"], "mods": []}, {"id": "3981642932951311885", "username": "etoile._.shibuya", "text": "フェイスラインぼやけてるの気になる方😳\n渋谷で小顔矯正+ドライヘッドスパ+肩甲骨剥がし\n受けてみたい方いらっしゃいませんか？", "permalink": "https://www.threads.com/@etoile._.shibuya/post/DdBoybhAeYN", "likes": 0, "velocity": 0.0, "ageHours": 82.7, "postedAt": "2026-09-08T21:00:47+09:00", "genres": ["小顔"], "keywords": ["小顔 手技"], "mods": []}]</script>

<script>
(function () {
  var readJSON = function (id) { return JSON.parse(document.getElementById(id).textContent); };
  var POSTS = readJSON('data');
  var GENRES = readJSON('genre-list');
  var MODIFIERS = readJSON('modifier-list');
  var SUMMARY = readJSON('summary-data');
  var RISING = 0.48;   // 伸び率の上位10%にあたる値

  var activeGenres = new Set();
  var activeMods = new Set();   // 掛け合わせ語。ジャンルとはANDで効かせる
  var els = {
    sort: document.getElementById('sort'),
    period: document.getElementById('period'),
    q: document.getElementById('q'),
    genres: document.getElementById('genres'),
    modifiers: document.getElementById('modifiers'),
    list: document.getElementById('list'),
    count: document.getElementById('count'),
    summary: document.getElementById('summary'),
    breakdown: document.getElementById('breakdown')
  };

  function mk(tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  // 文節を1かたまりとして置く。途中で改行されないので、
  // 「を」「と」などの助詞が行頭に来ることがなくなる。
  function phrases(parent, list) {
    list.forEach(function (t) { parent.appendChild(mk('span', 'nb', t)); });
    return parent;
  }

  // --- 集計 ---
  // タイルは必ず4枚。ジャンルはここに混ぜず、下の棒グラフで見せる。
  (function renderSummary() {
    var tiles = [
      ['表示中の投稿', SUMMARY.total, '件'],
      ['直近7日の投稿', SUMMARY.thisWeek, '件'],
      ['1000いいね超え', SUMMARY.over1000, '件'],
      ['投稿者', SUMMARY.authors, '人']
    ];
    tiles.forEach(function (t) {
      var box = mk('div', 'stat');
      box.appendChild(mk('span', 'stat-label', t[0]));
      var v = mk('div', 'stat-value', t[1].toLocaleString());
      v.appendChild(mk('span', 'unit', t[2]));
      box.appendChild(v);
      els.summary.appendChild(box);
    });
  })();

  // --- ジャンル別の内訳 ---
  // 棒の長さは最多ジャンルを100%とした相対値。1つの投稿が複数ジャンルに
  // 入ることがあり、合計が総数と一致しないため、全体に対する割合としては見せない。
  (function renderBreakdown() {
    if (!SUMMARY.genres.length) { els.breakdown.remove(); return; }

    els.breakdown.appendChild(mk('p', 'breakdown-title', 'ジャンル別'));
    var max = SUMMARY.genres.reduce(function (m, p) { return Math.max(m, p[1]); }, 0);

    // 長いジャンル名は固定幅の列に1行では収まらない。
    // 「・」の位置だけで折り、カタカナ語の途中では絶対に割らない。
    function nameParts(name) {
      var parts = name.split('・');
      return parts.map(function (t, i) {
        // 「・」は前の語にくっつける。行頭に落とさないため
        return i < parts.length - 1 ? t + '・' : t;
      });
    }

    SUMMARY.genres.forEach(function (pair) {
      var row = mk('div', 'bar-row');
      if (pair[1] === 0) row.classList.add('pending');
      row.appendChild(phrases(mk('span', 'bar-name'), nameParts(pair[0])));

      var track = mk('div', 'bar-track');
      var fill = mk('div', 'bar-fill');
      fill.style.width = (max > 0 ? (pair[1] / max) * 100 : 0) + '%';
      track.appendChild(fill);
      row.appendChild(track);

      // 数字は出さない。棒の長さで強弱は足りる。
      // まだ集まっていないものだけ、空の棒の理由が分かるよう言葉を添える
      row.appendChild(mk('span', 'bar-count', pair[1] === 0 ? '収集待ち' : ''));
      els.breakdown.appendChild(row);
    });
  })();

  // 何件のうち何件を見ているのかを明示する。
  // 「最終収集」は実際に収集した時刻。HTMLを作り直しただけでは進まない。
  (function renderStamp() {
    var stamp = document.getElementById('stamp');
    var collectedAt = SUMMARY.updatedAt || '2026-09-12 07:40';
    var units = ['最終収集 ' + collectedAt];
    if (SUMMARY.archived > SUMMARY.total) {
      units.push('　/　蓄積 ' + SUMMARY.archived.toLocaleString() + ' 件のうち ');
      units.push(SUMMARY.total.toLocaleString() + ' 件を表示');
    }
    phrases(stamp, units);
  })();

  // --- 絞り込みのチップ（2段構え） ---
  // 上段: 主ジャンル。単独で検索して意味のある語。
  // 下段: 掛け合わせ語。「経営」「メニュー」のように単独だと飲食や一般ビジネスを
  //       拾ってしまう語で、本文に該当語があるかで絞る。
  // どちらも対象を全部並べる。今日まだ回っていないものを隠すと、
  // 扱う範囲が狭まったように見えるため。
  var chipStates = [];

  function makeChip(row, label, onActivate) {
    var b = mk('span', 'chip');
    b.appendChild(mk('span', 'chip-name', label));
    if (onActivate) {
      b.tabIndex = 0;
      b.setAttribute('role', 'button');
      b.addEventListener('click', onActivate);
      b.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onActivate(); }
      });
    } else {
      // 1件も無いので押しても何も起きない。操作対象から外す
      b.classList.add('pending');
      b.setAttribute('aria-disabled', 'true');
      b.title = '該当する投稿がまだありません';
    }
    row.appendChild(b);
    return b;
  }

  function syncChips() {
    chipStates.forEach(function (s) {
      var on = s.isOn();
      s.el.classList.toggle('on', on);
      s.el.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  // 選んだ集合を切り替えるチップを1つ作る。上段と下段で作りが同じなのでまとめる
  function addToggleChip(row, name, active) {
    var chip = makeChip(row, name, function () {
      if (active.has(name)) active.delete(name);
      else active.add(name);
      syncChips();
      render();
    });
    chipStates.push({ el: chip, isOn: function () { return active.has(name); } });
  }

  function addAllChip(row, active) {
    var chip = makeChip(row, 'すべて', function () {
      active.clear();
      syncChips();
      render();
    });
    chipStates.push({ el: chip, isOn: function () { return active.size === 0; } });
  }

  addAllChip(els.genres, activeGenres);
  GENRES.forEach(function (pair) {
    if (pair[1] === 0) { makeChip(els.genres, pair[0], null); return; }
    addToggleChip(els.genres, pair[0], activeGenres);
  });

  if (MODIFIERS.length === 0) {
    els.modifiers.remove();
  } else {
    addAllChip(els.modifiers, activeMods);
    MODIFIERS.forEach(function (pair) {
      if (pair[1] === 0) { makeChip(els.modifiers, pair[0], null); return; }
      addToggleChip(els.modifiers, pair[0], activeMods);
    });
  }

  syncChips();

  function fmtAge(h) {
    if (h === null || h === undefined) return '不明';
    if (h < 24) return Math.round(h) + '時間前';
    return Math.round(h / 24) + '日前';
  }

  function filtered() {
    var days = parseInt(els.period.value, 10);
    var q = els.q.value.trim().toLowerCase();

    return POSTS.filter(function (p) {
      if (days > 0) {
        if (p.ageHours === null || p.ageHours > days * 24) return false;
      }
      if (activeGenres.size > 0) {
        var hit = p.genres.some(function (g) { return activeGenres.has(g); });
        if (!hit) return false;
      }
      // 掛け合わせはジャンルとAND。「オンライン秘書」かつ「経営」を出すため。
      // 掛け合わせ語どうしはOR（複数選ぶと候補が広がる）
      if (activeMods.size > 0) {
        var mods = p.mods || [];
        var hitMod = mods.some(function (m) { return activeMods.has(m); });
        if (!hitMod) return false;
      }
      if (q) {
        var hay = (p.text + ' ' + p.username).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function sorted(rows) {
    var mode = els.sort.value;
    var copy = rows.slice();
    if (mode === 'likes') copy.sort(function (a, b) { return b.likes - a.likes; });
    else if (mode === 'newest') copy.sort(function (a, b) {
      var av = a.ageHours === null ? Infinity : a.ageHours;
      var bv = b.ageHours === null ? Infinity : b.ageHours;
      return av - bv;
    });
    else copy.sort(function (a, b) { return b.velocity - a.velocity; });
    return copy;
  }

  function render() {
    var rows = sorted(filtered());
    els.count.textContent = rows.length + ' 件を表示';
    els.list.textContent = '';

    if (rows.length === 0) {
      // 「絞り込みを」を1かたまりにして、「を」が行頭に来ないようにする
      els.list.appendChild(phrases(mk('div', 'empty'), [
        '条件に合う投稿が', 'ありません。', '絞り込みを', '緩めてください。'
      ]));
      return;
    }

    var frag = document.createDocumentFragment();
    rows.forEach(function (p, i) {
      var isRising = p.velocity >= RISING;
      var card = mk('div', 'card' + (isRising ? ' rising' : ''));

      var head = mk('div', 'card-head');
      head.appendChild(mk('span', 'rank', String(i + 1)));
      head.appendChild(mk('span', 'user', '@' + p.username));
      if (isRising) head.appendChild(mk('span', 'badge', '伸び中'));

      var stats = mk('div', 'stats');
      stats.appendChild(mk('span', 'likes', p.likes.toLocaleString() + ' likes'));
      stats.appendChild(mk('span', 'vel', p.velocity.toFixed(1) + '/h'));
      stats.appendChild(mk('span', 'age', fmtAge(p.ageHours)));
      head.appendChild(stats);
      card.appendChild(head);

      card.appendChild(mk('p', 'text', p.text));

      var tags = mk('div', 'tags');
      // 上下2段のチップと同じ「ジャンル＋掛け合わせ」を出す。
      // 検索語そのものを出すと、「オンライン秘書」と「オンライン秘書 経営」が
      // 並んで冗長になり、1ジャンル1語のときは同じ語が二重に出る
      var seenTags = {};
      p.genres.concat(p.mods || []).forEach(function (t) {
        if (seenTags[t]) return;
        seenTags[t] = true;
        tags.appendChild(mk('span', 'tag', t));
      });
      if (p.permalink) {
        var a = mk('a', 'link', '元投稿を開く →');
        a.href = p.permalink;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        tags.appendChild(a);
      }
      card.appendChild(tags);
      frag.appendChild(card);
    });
    els.list.appendChild(frag);
  }

  [els.sort, els.period].forEach(function (el) {
    el.addEventListener('change', render);
  });
  els.q.addEventListener('input', render);

  render();
})();
</script>
