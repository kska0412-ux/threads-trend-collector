<title>Threads Research Tool（美容ビジネス ver）</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;900&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
  /* 明るい側を基準に全トークンを定義する。暗い側は下で上書きする。 */
  :root {
    --bg: #f6f4f5;
    --surface: #ffffff;
    --surface-2: #fbf9fa;
    --ink: #231c22;
    --muted: #6f636c;
    --border: #e4dee2;
    --accent: #8b2f5f;
    --accent-soft: #f7e9f0;
    --rising: #0f7b6c;
    --rising-soft: #e2f2ef;
    --chip: #efeaed;
    --focus: #8b2f5f;
  }
  /* OS が暗いとき。ただし閲覧者が明るいテーマを選んでいたらそちらを優先する。 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151114;
      --surface: #1f1a1e;
      --surface-2: #241e23;
      --ink: #f0eaee;
      --muted: #a3969e;
      --border: #332b31;
      --accent: #e086b0;
      --accent-soft: #3a2130;
      --rising: #4fc3ae;
      --rising-soft: #16332e;
      --chip: #2c2429;
      --focus: #e086b0;
    }
  }
  /* 閲覧者が暗いテーマを選んだとき。OS の設定に関係なく効かせる。 */
  :root[data-theme="dark"] {
    --bg: #151114;
    --surface: #1f1a1e;
    --surface-2: #241e23;
    --ink: #f0eaee;
    --muted: #a3969e;
    --border: #332b31;
    --accent: #e086b0;
    --accent-soft: #3a2130;
    --rising: #4fc3ae;
    --rising-soft: #16332e;
    --chip: #2c2429;
    --focus: #e086b0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    /* 透明のままだと閲覧側の地の色を借りてしまうので必ず塗る */
    background: var(--bg);
    color: var(--ink);
    /* 日本語本文はWebフォントを落とすと重いので、端末のフォントを使う */
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
                 -apple-system, BlinkMacSystemFont, "Yu Gothic Medium", sans-serif;
    line-height: 1.75;
    font-feature-settings: "palt" 1;
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
  }

  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px 96px; }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* --- 見出し --- */
  h1 {
    font-family: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-weight: 900;
    font-size: clamp(1.5rem, 4vw, 2.1rem);
    line-height: 1.35;
    letter-spacing: .01em;
    margin: 0;
    text-wrap: balance;
  }
  /* 対象ジャンルの但し書き。名前より一段弱く見せる */
  .ver {
    display: block;
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-weight: 400;
    font-size: .74rem;
    letter-spacing: .02em;
    color: var(--muted);
    margin-top: 6px;
  }

  /* --- 集計：詳細より先に全体像を出す --- */
  .panel {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    margin: 28px 0 8px;
  }
  /* 4枚で固定する。auto-fit だと枚数によって最後の1枚だけ次の行に
     取り残され、空いた枠が塗り残しに見えてしまうため。 */
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
  }
  @media (max-width: 620px) {
    /* 4枚なので2列でもきれいに埋まる */
    .summary { grid-template-columns: repeat(2, 1fr); }
  }
  .stat { background: var(--surface); padding: 14px 16px; }

  /* --- ジャンル別の内訳 --- */
  /* 棒にしておけば、ジャンルが何個あっても1行1本で並ぶので取り残しが出ない */
  .breakdown { padding: 15px 16px 17px; border-top: 1px solid var(--border); }
  .breakdown-title {
    font-size: .7rem; color: var(--muted); letter-spacing: .06em;
    margin: 0 0 11px; white-space: nowrap;
  }
  /* 名前の列は固定幅。名前に合わせて伸ばすと、長いジャンルの行だけ棒の
     開始位置がずれて、棒どうしの長さを目で比べられなくなる。
     収まらない名前は「・」の位置で折る（折り位置は .nb で決め打ち）。
     幅と高さは実際のジャンル名から build_html.py が計算して埋める。 */
  .bar-row {
    display: grid;
    grid-template-columns: 11.5em 1fr auto;
    gap: 12px; align-items: center;
  }
  .bar-row + .bar-row { margin-top: 8px; }
  /* 1行で収まる名前も2行の名前と同じ高さにする。混ざると行の間隔が
     ばらついて、棒の並びが読みにくくなる。
     flex にしているのは、折り返した2行をまとめて上下中央に置くため。 */
  .bar-name {
    font-size: .76rem; line-height: 1.4;
    min-height: 1.4em;
    display: flex; flex-wrap: wrap; align-content: center;
  }
  .bar-track {
    height: 6px; border-radius: 999px;
    background: var(--chip); overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 999px; background: var(--accent); }
  .bar-count {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; color: var(--muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  @media (max-width: 620px) {
    /* 幅は変えない。変えると狭い画面だけ折り返し位置が変わってしまう */
    .bar-row { gap: 9px; }
  }
  /* まだ集まっていないジャンル。対象には入っているので消さず、弱く見せる */
  .bar-row.pending .bar-name { color: var(--muted); }
  .bar-row.pending .bar-track { opacity: .55; }
  /* 「収集待ち」は日本語なので、等幅フォントに任せず本文と同じ書体で出す */
  .bar-row.pending .bar-count {
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: .7rem;
  }
  .stat-label {
    font-size: .7rem; color: var(--muted); letter-spacing: .06em;
    display: block; margin-bottom: 4px;
    /* 「表示中/の投稿」のように助詞で割れないよう、まとめて扱う */
    white-space: nowrap;
  }
  .stat-value {
    white-space: nowrap;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: 1.25rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .stat-value .unit { font-size: .72rem; font-weight: 400; color: var(--muted); margin-left: 3px; }
  .stamp {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .7rem; color: var(--muted); margin: 0 0 26px;
  }

  /* --- 操作バー --- */
  .controls {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: 12px 0 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row + .row { margin-top: 8px; }
  select, input[type=search] {
    font: inherit; font-size: .82rem;
    padding: 7px 11px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    color: var(--ink);
  }
  input[type=search] { flex: 1; min-width: 180px; }
  .chip {
    display: inline-flex; align-items: baseline; gap: 6px;
    font-size: .78rem; padding: 5px 13px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on {
    background: var(--accent-soft); border-color: var(--accent);
    color: var(--accent); font-weight: 700;
  }
  /* どちらの行を押しているのか分かるようにする。2段になると迷いやすい */
  .filter-label {
    font-size: .7rem; color: var(--muted); letter-spacing: .04em;
    white-space: nowrap; min-width: 5.5em;
  }
  /* ジャンル名は途中で割らない。「ダイエット」を「ダイ」と「エット」に分けない */
  .chip-name { white-space: nowrap; }
  /* まだ1件も無いジャンル。押しても空振りするので、選べないことを見た目で示す */
  .chip.pending {
    opacity: .45; cursor: default;
    border-style: dashed;
  }
  .chip.pending:hover { border-color: var(--border); color: var(--muted); }
  .count {
    white-space: nowrap;
    font-family: "Roboto Mono", ui-monospace, monospace;
    color: var(--muted); font-size: .76rem; margin-bottom: 14px;
    font-variant-numeric: tabular-nums;
  }

  /* --- カード --- */
  #list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid transparent;
    border-radius: 10px;
    padding: 16px 18px;
  }
  /* 伸びが速い投稿は左端の色で一目で分かるようにする */
  .card.rising { border-left-color: var(--rising); background: var(--surface-2); }

  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 9px; }
  .rank {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; color: var(--muted);
    font-variant-numeric: tabular-nums; min-width: 2.4em;
  }
  .user { font-weight: 700; font-size: .86rem; }
  .badge {
    white-space: nowrap;
    font-size: .66rem; font-weight: 700; letter-spacing: .04em;
    padding: 2px 8px; border-radius: 999px;
    background: var(--rising-soft); color: var(--rising);
  }
  .stats {
    margin-left: auto; display: flex; gap: 11px;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; font-variant-numeric: tabular-nums;
  }
  .likes { color: var(--accent); font-weight: 700; }
  .vel { color: var(--rising); font-weight: 500; }
  .age { color: var(--muted); }

  .text {
    white-space: pre-wrap;
    /* word-break: break-word は単語の途中で割るので使わない。
       overflow-wrap なら、1語が行に収まらないときだけ割る。
       line-break: strict で日本語の禁則処理を厳しい方に寄せる。 */
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
    font-size: .92rem; margin: 0 0 12px;
  }

  /* 文節のかたまり。ここで囲った範囲は途中で改行されない。
     「を」「と」などの助詞が行頭に来るのを防ぐために使う。 */
  .nb { white-space: nowrap; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag {
    white-space: nowrap;
    font-size: .7rem; padding: 3px 9px; border-radius: 4px;
    background: var(--chip); color: var(--muted);
  }
  .link {
    margin-left: auto; font-size: .76rem; color: var(--accent);
    text-decoration: none; font-weight: 700; white-space: nowrap;
  }
  .link:hover { text-decoration: underline; }

  .empty { text-align: center; color: var(--muted); padding: 64px 20px; font-size: .88rem; }
</style>

name": "kounenki_yuko", "text": "ちょっとエグいから聞いてほしい。仲のいい友人が循環器科の医者に「更年期でお腹だけ出てきて痩せない」って相談したら、「かかと上げを1日3回やってみて。食前に30秒ね」って言われて、半信半疑でかかと上げを続けて3週間。ホントにお腹周りが引き締まって、パンツがぶかぶかになったと言い出した。「かかと上げで？」って先生に報告したら、にやりと笑って、、、", "permalink": "https://www.threads.com/@kounenki_yuko/post/DXn9BmukWzS", "likes": 15701, "velocity": 4.26, "ageHours": 3688.4, "postedAt": "2026-04-27T15:00:23+09:00", "genres": ["更年期ケア"], "keywords": ["更年期ケア", "更年期ケア 手技", "更年期ケア メニュー"], "mods": []}, {"id": "3972591698302859471", "username": "noitsume", "text": "美人な人に聞きたいんですけど\n　\n美容院でシャンプーした後に頭にタオル巻いて席に戻るじゃないですか　\n美人はその時に鏡見て「今日も可愛いわー」とか思うんですかね？\n　\n私はブサイクすぎて毎回びっくりします", "permalink": "https://www.threads.com/@noitsume/post/DchexoXAfjP", "likes": 15160, "velocity": 19.79, "ageHours": 766.1, "postedAt": "2026-08-27T09:17:35+09:00", "genres": ["美容サロン"], "keywords": ["美容サロン"], "mods": []}, {"id": "3911727833454613409", "username": "lilyage.nail", "text": "いつも「俺ハゲてきとる？｣\nって聞かれたら\n「そんなことないけどなぁ」\n言うてたけど、\n\n風呂上がりの育毛トニックを\n見当違いなところにつけてたから\n\n「ハゲてんのそこじゃねぇて!!もっと後ろ!!」\n\nって教えたら\n「ハゲとるんかい!!」\nって言われたって話。", "permalink": "https://www.threads.com/@lilyage.nail/post/DZJP71DEhOh", "likes": 14664, "velocity": 5.27, "ageHours": 2781.5, "postedAt": "2026-06-04T09:51:57+09:00", "genres": ["育毛"], "keywords": ["育毛"], "mods": []}, {"id": "3922161421656400347", "username": "riri.r.r828", "text": "更年期になったらさ\n朝まで熟睡出来ないんだけど\n皆さんも一緒？", "permalink": "https://www.threads.com/@riri.r.r828/post/DZuUQhRkiHb", "likes": 13251, "velocity": 5.44, "ageHours": 2436.1, "postedAt": "2026-06-18T19:21:38+09:00", "genres": ["更年期ケア"], "keywords": ["更年期ケア 手技", "更年期ケア", "更年期ケア メニュー"], "mods": []}, {"id": "3869904824947512837", "username": "4.yonyon.4", "text": "自分の顔って脳内で勝手に美女加工されてるよね？？？息子の卒園式、いつもより丁寧にメイクして今田美桜みたいなニコニコ笑顔で過ごしてたのに、上がってきたデータにパワフルな肉まんじゅうが写っててびっくらこいた。", "permalink": "https://www.threads.com/@4.yonyon.4/post/DW0qe9FkRYF", "likes": 10856, "velocity": 2.61, "ageHours": 4166.5, "postedAt": "2026-04-07T16:57:06+09:00", "genres": ["小顔"], "keywords": ["小顔 メニ 期で不調が増えた53歳の叔母が、9年飲み続けた結果、叔母が変わったのは、、、", "permalink": "https://www.threads.com/@shizu_onkatsu/post/DZWX3pJCg1e", "likes": 462, "velocity": 0.17, "ageHours": 2659.2, "postedAt": "2026-06-09T12:11:25+09:00", "genres": ["更年期ケア"], "keywords": ["更年期ケア 手技", "更年期ケア メニュー"], "mods": []}, {"id": "3885281577731619354", "username": "wankononki", "text": "あの、ヘッドマッサージ教えてくれた方にお礼を言いたい！\n\nヘッドマッサージしたら頭が軽くなっただけでなく、顔のたるみも首の皮膚も持ち上がったのだが‼️\n\nリフトアップ‼️‼️\nもうやめられないし、ヘッドスパ行かなくて良くなっちゃった\n\n本当にありがとうございますm(_ _)m", "permalink": "https://www.threads.com/@wankononki/post/DXrSwKFD_oa", "likes": 455, "velocity": 0.12, "ageHours": 3657.3, "postedAt": "2026-04-28T22:07:58+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ メニュー", "ヘッドスパ"], "mods": []}, {"id": "3906347737831606204", "username": "curated.pearls", "text": "ポルトガル旅行で奇跡的な出会いが、、✨🕊️✨\n抜け感のあるリングを探してて、ポメラートのマーマノンマーマというリングがあるのを知りました。\nただ、もう廃盤のため二次流通でしかゲットできなくて、日本だけじゃなくて、世界でも地金のモデルが本当に流通してないことを知って、いつか出会えるのを待つことに。\nそんな中、ネットで色々検索してると、なんととある老舗ジュエリー店に新品のものがあることを発見！！\nしかもそれが、旅行を予定してたポルトガル🇵🇹\nすぐにお店に問い合わせて、キープをお願いすると親切にオッケーしてくれました。。\nそして、、今日、、先ほど、、新品のマーマノンマーマを購入することができました😭🧡\n出会えるとしても何年後かなと思っていたのに、まさかのこんなにも早く迎えることができるとは。\nこのリングを着けるたびに、ポルトガル旅行を思い出すんだろうなぁ☺️", "permalink": "https://www.threads.com/@curated.pearls/post/DY2IpIimoe8", "likes": 451, "velocity": 0.15, "ageHours": 2959.7, "postedAt": "2026-05-27T23:42:40+09:00", "genres": ["パーマネントジュエリー"], "keywords": ["パーマネントジュエリー"], "mods": []}, {"id": "3883817936209754679", "username": "yasumi.chan2525", "text": "ここだけの話。セラピストを7年やって忘れられない言葉があります。施術台で開始5分で爆睡した40代のお客様が目を覚ましてこう言われました。「私おかしいんですかね」って。その方はピラティスに通ってジムで週3回頑張って食事も気をつけていた。\nどう見ても「健康意識が高い人」だった。\nでも体を触った瞬間わかった。", "permalink": "https://www.threads.com/@yasumi.chan2525/post/DXmF9XsEro3", "likes": 449, "velocity": 0.12, "ageHours": 3705.7, "postedAt": "2026-04-26T21:39:58+09:00", "genres": ["セラピスト"], "keywords": ["セラピスト"], "mods": []}, {"id": "3971348675761913755", "username": "asiestaasmr", "text": "ヘッドスパ無料で受けませんかー？", "permalink": "https://www.threads.com/@asi : ["パーマネントジュエリー"], "keywords": ["パーマネントジュエリー"], "mods": []}, {"id": "3971161718269109521", "username": "endo_motohira", "text": "Threadsを始めて気づいたこと。\n\nドライヘッドスパやヘッドマッサージをやっているセラピストさん、かなり多くないですか？\n専門サロンをやっている方も多い。\n僕が不勉強だっただけなのか、\n最近かなり人気なのでしょうか？\n\nそういえば……うちも企業でヘッドスパ、結構やってました（笑）\n\nパソコン仕事で頭も目も疲れているオフィスワーカーには、かなり相性がいいんですよね。\n\nなのでヘッドセラピストさん、「企業への出張施術」という選択肢も、結構可能性あると思います。\n\nただ、実際に企業でやっていると、「首もやってほしい」「肩もやってほしい」というリクエストはやっぱり出ます。\n\nなので、ヘッド＋首＋肩までできるようになると、企業に提案できる幅はかなり広がると思います。\n\nヘッドセラピストの皆さん、\nオフィス出張も面白いですよ😊\n\nこれからもいろんな施術師さん、セラピストさんと繋がりもてたら嬉しいです！", "permalink": "https://www.threads.com/@endo_motohira/post/DccZorrD2UR", "likes": 120, "velocity": 0.15, "ageHours": 813.5, "postedAt": "2026-08-25T09:56:28+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ"], "mods": []}, {"id": "3955698189211295248", "username": "yoco99ababab", "text": "ピラティス良さそうだなと、最近感じているのですが…お店がありすぎて、値段もそこそこ違うし。\n\n良いピラティスと悪いピラティスの見極め方ってあるのかな？とりあえず行かないと分からないか。", "permalink": "https://www.threads.com/@yoco99ababab/post/Dbldot-mF4Q", "likes": 119, "velocity": 0.09, "ageHours": 1325.5, "postedAt": "2026-08-04T01:53:12+09:00", "genres": ["ピラティス"], "keywords": ["ピラティス スクール", "ピラティス"], "mods": []}, {"id": "3894658349015463660", "username": "mai_mama88", "text": "本間に肌を整えたくて、美容モニターとかしてみたい🥺\nもう肌ボロボロ🤣", "permalink": "https://www.threads.com/@mai_mama88/post/DYMmyI2k3bs", "likes": 119, "velocity": 0.04, "ageHours": 3346.8, "postedAt": "2026-05-11T20:37:56+09:00", "genres": ["美容サロン"], "keywords": ["美容サロン"], "mods": []}, {"id": "3899552206836284961", "username": "iizuka_chomomi_akane", "text": "ヘッドスパしてる時に\n「ぎゅるるる」とお客様のお腹がなりだすと\nよしよしっ！ってなります🥹🤍\n\nセラピストあるあるじゃないかな？🤭", "permalink": "https://www.threads.com/@iizuka_chomomi_akane/post/DYd_hJHkT4h", "likes": 119, "velocity": 0.04, "ageHours": 3184.7, "postedAt": "2026-05-18T14:41:09+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ", "ヘッドスパ 手技"], "mods": []}, {"id": "3899749303220561155", "username": "seiko._.pilates", "text": "約2年半ピラティストレーナーと看護師をWワークで続けていましたが、\n先日、看護師を辞めてピ "], "mods": []}, {"id": "3884864389657063304", "username": "hitomi5132", "text": "40代後半です。\nこれから先、持っていると便利だよー\nっていうジュエリー浴びたいので、皆様のジュエリーをお願いします🙏", "permalink": "https://www.threads.com/@hitomi5132/post/DXpz5RaEu-I", "likes": 110, "velocity": 0.03, "ageHours": 3671.1, "postedAt": "2026-04-28T08:19:05+09:00", "genres": ["パーマネントジュエリー"], "keywords": ["パーマネントジュエリー スクール"], "mods": []}, {"id": "3891038405908403096", "username": "rcrcrcuc", "text": "とりあえず、公園にはピアスも含めジュエリーはつけて行かないことにします\nまた、帰宅と同時にジュエリーはジュエリーboxにしまいます\n\n家族での外出時は自分より子供中心で、自分はおろかジュエリーには構えず\n文字にすると当たり前のことなのですが、せっかく買ったお気に入りをつけることばかりに目がいっていました\n手元を離れたのは恐らく数時間ですが、失くして家や公園を探す間血の気がひきました……\n\n場所を選び、着け外しを習慣化して、ジュエリーをこれまで以上に大切にしたいと思います", "permalink": "https://www.threads.com/@rcrcrcuc/post/DX_vtCHkpOY", "likes": 110, "velocity": 0.03, "ageHours": 3466.6, "postedAt": "2026-05-06T20:45:45+09:00", "genres": ["パーマネントジュエリー"], "keywords": ["パーマネントジュエリー"], "mods": []}, {"id": "3968434121466830064", "username": "mochico_diet_100", "text": "ピラティス月3回は少ない？意味ない？\n経験者の方教えてください🙏🌟", "permalink": "https://www.threads.com/@mochico_diet_100/post/DcStc7Mkdzw", "likes": 110, "velocity": 0.12, "ageHours": 903.8, "postedAt": "2026-08-21T15:37:13+09:00", "genres": ["ピラティス"], "keywords": ["ピラティス", "ピラティス スクール"], "mods": []}, {"id": "3914821452419973886", "username": "saki_kounenki_totonou", "text": "更年期に入ると首筋がこわばったり、リンパが詰まったような違和感や朝起きると首が重だるく、顔もむくむ。これ、首こりだけじゃなくてエストロゲン低下も深く関係しています。でもこれ対処法があります。まず、", "permalink": "https://www.threads.com/@saki_kounenki_totonou/post/DZUPV6OkkL-", "likes": 110, "velocity": 0.04, "ageHours": 2679.1, "postedAt": "2026-06-08T16:18:25+09:00", "genres": ["更年期ケア", "リンパ"], "keywords": ["更年期ケア 手技", "リンパ"], "mods": []}, {"id": "3867450358696742065", "username": "calm_0915", "text": "フェイシャルエステされてる方、自宅サロンされてる方\nまだオープンしたばかりなので認知も薄くお客様も中々平日や土日予約入りません。集客方法色々教えてください。\n宜しくお願いします😊", "permalink": "https://www.threads.com/@calm_0915/post/DWr8ZxQk4yx", "likes": 110, "velocity": 0.03, "ageHours": 4247.7, "postedAt": "2026-04-04T07:40:31+09:00", "genres": ["美容サロン"], "keywords": ["美容サロン経営"], "mods": ["経営"]}, {"id": "3928788358533920797", "username": "salon_r7", "text": "はじめまして🦋✨\n\n少しずつですが、サロンを始める準備をしています🫧🤍\n\nまだまだ勉強中で練習の毎日ですが、たくさんの方に喜んでいただけるサロンを目指して頑張ります✨\n\n美容のことや日々のこともゆるく発信していきたいと思っています🌿\n\nこれからよろしくお願いします🤍", "permalink": "https://www.threads.com/@salon_r7/post/DaF3DJMGrgd", "likes": 110, "velocity": 0.05, "ageHours": 2216.6, "postedAt": "2026-06-27T22:48:10+09:00", "genres": ["美容サロン"], "keywords": ["美容サロン 経営", "美容サロン メニュー", "美容サロン 高単価", "美容サロン"], "mods": []}, {"id": "3969106095533249502", "username": "yukimi_artmake", "text": "9月から、愛西市のクリニックで\nアートメイクをスタートすることになりました✨\n\n「眉を描くのが毎朝大変」\n「すっぴんでも自然な眉でいたい」\nそんな方に寄り添えるアートメイクを\n届けていきたいと思っています▓\n\n愛西市周辺の方、ぜひよろしくお願いいたします☺️🤍", "permalink": "https://www.threads.com/@yukimi_artmake/post/DcVGPb0GNPe", "likes": 110, "velocity": 0.12, "ageHours": 881.5, "postedAt": "2026-08-22T13:52:19+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク"], "mods": []}, {"id": "3975060702676078670", "username": "co.ffee_05", "text": "50代でも髪の毛綺麗にされてる方、具体的にどんなケアされてますか？\n美容院でこれやったらいいよ！ってのありますか？\nパサパサのウネウネで困ってます😭", "permalink": "https://www.threads.com/@co.ffee_05/post/DcqQKX3n1BO", "likes": 110, "velocity": 0.16, "ageHours": 684.4, "postedAt": "2026-08-30T19:03:04+09:00", "genres": ["更年期ケア"], "keywords": ["更年期ケア 手技", "更年期ケア メニュー"], "mods": []}, {"id": "3953773739976602289", "username": "fujimiya_tpk", "text": "男性セラピストのオイルマッサージというと、女性向けの風俗店だと思われることが多いですが、所属するサロンは非風俗店です😌\nホットペッパーから予約できるリラクゼーションなので、価格もお手頃ですし、女風に興味はあるけどハードルが高い、、\n\nというような方はぜひご検討ください💆‍♀️\nリンクはデビュー後に掲載しますね✨", "permalink": "https://www.threads.com/@fujimiya_tpk/post/DbeoES9krKx", "likes": 109, "velocity": 0.08, "ageHours": 1389.2, "postedAt": "2026-08-01T10:09:40+09:00", "genres": ["セラピスト"], "keywords": ["セラピスト 高単価", "セラピスト 単価UP", "セラピスト スクール", "セラピスト 手技", "セラピスト"], "mods": []}, {"id": "3993166886580858786", "username": "maa___gr", "text": "ピラティスやパーソナルトレーニングの体験行きたーい！！🏋️！！\n\nおすすめ教えてください🧡🙏", "permalink": "https://www.threads も楽しくて\n・\n旦那さんへ『編み込みできるかしら？😆』って話すと\n・\nおーー生えてきたーやー😆\nわしは、だんだん頭のてっぺんが薄くなってきたーやー\nあんたは、生えてきてわしは抜けとや😆\n・\nこの、下りを息子に話したら\n『なんだ〜育毛剤こ〜たろか〜w🤩👍🫶』って\nそれを聞いた旦那さんは大爆笑🤣🤣🤣\n今日もいい日だ\n・\n生えはじめは、むずむずしてむずがゆくて\n生えてきたら、細い細い産毛さんが\nだんだん日に日に太くなり\n黒くなってきて\n今はちょっとだけシャンプーの量も増やしたりして🧴💕\nウィッグは楽で、ケアも簡単\n夏はちと暑い☀️😵💦\n髪の毛っていろんな役割があるんだなと思ったことは\n暑さは紫外線予防、寒さ対策、\n汗の出方やつたってくる汗の量の調整\nほこりや怪我からも守り\nいろんなことに気づいて\n髪の毛って愛しい💕\n\n#乳ガン#副作用#脱毛#ウイング#髪の毛生えてきた", "permalink": "https://www.threads.com/@miwa.chibi/post/Dcu5goTlGVv", "likes": 26, "velocity": 0.04, "ageHours": 641.1, "postedAt": "2026-09-01T14:21:21+09:00", "genres": ["育毛"], "keywords": ["育毛 手技"], "mods": []}, {"id": "3918626444318853230", "username": "ayumi.n.1025", "text": "38歳、抜け毛がひどくて髪の毛が少なくなってきて悩んでる。市販の育毛剤1年くらい同じの使ってるけどあんま効果なーい。ネットで見てても結局なにが効果あるのかわからん…\n治療するお金はないし。\nこれ効果あったよ！とかこの育毛剤おすすめ！とかあったら教えてほしいです！", "permalink": "https://www.threads.com/@ayumi.n.1025/post/DZhwf1FE8hu", "likes": 26, "velocity": 0.01, "ageHours": 2553.1, "postedAt": "2026-06-13T22:18:16+09:00", "genres": ["育毛"], "keywords": ["育毛 手技"], "mods": []}, {"id": "3993719377937802422", "username": "yuka30409", "text": "10月1日(木)名古屋店(高岳)にてカルサイネイザン(ジャップカサイ)講習モデルさんを募集します。\n\n新人セラピストAkira(男性)の新人研修です。\nモデル参加料金は無料です。\n\n11時〜19時の間で約3時間\n(お好きな時間を選べます)\n\nご希望の方はメッセージください。", "permalink": "https://www.threads.com/@yuka30409/post/Ddsip1Wk6S2", "likes": 26, "velocity": 0.39, "ageHours": 66.5, "postedAt": "2026-09-25T12:54:31+09:00", "genres": ["セラピスト"], "keywords": ["セラピスト 手技"], "mods": []}, {"id": "3993888902360581809", "username": "asakatsuonna", "text": "分け目ハゲ後頭部ハゲに続けてます！\n見た目もニオイも良いロクシタンの育毛剤！\nコツコツ続けるのみですね！！", "permalink": "https://www.threads.com/@asakatsuonna/post/DdtJMvRk8ax", "likes": 25, "velocity": 0.41, "ageHours": 60.9, "postedAt": "2026-09-25T18:31:20+09:00", "genres": ["育毛"], "keywords": ["育毛 手技"], "mods": []}, {"id": "3902368431622663518", "username": "kamonohasi.aga", "text": "知らなかった。\n「亜鉛は抜け毛に効く」と聞いて\nサプリを飲み続けた結果、\nむしろ抜け毛が増えた。\n皮膚科で正直に話したら\n「それ、男性にすごく多いですよ」と即答された。\n亜鉛は確かに髪に必要なミネラル。\nでも”頑張って補おう”とした瞬間、\n体の中でまったく逆のことが起きる。\nその理由が、", "permalink": "https://www.threads.com/@kamonohasi.aga/post/DYn_2m1kS1e", "likes": 25, "velocity": 0.01, "ageHours": 3091.5, "postedAt": "2026-05-22T11:56:30+09:00", "genres": ["育毛"], "keywords": ["育毛 手技"], "mods": []}, {"id": "3994604865891963545", "username": "kimagule.photo.art", "text": "個室から大部屋に移動 ｼｭｯ =͟͟͞͞ ( ˙꒳​˙)\n⁡\n昨日突然「明日移動してもらいます」と言われたので\n「息子と同じ？」と聞いたら\n「そうです。次の人が入ります」とのこと。\n⁡\n1ヶ月半前のあの日を思い出しましたねぇ。\n⁡\n個室では「息子のエリアだけ空調を設置する」と言われていたので、ビニールのカーテンで全面を囲っているようなのを想像していました。\n\nですが、実際は画像のように息子の背後にどデカいフィルターがあるという「え、ほんとに？これでええの？」みたいな設備で笑っちゃいました笑\n⁡\n息子は人見知りすぎて、人の気配があるだけで気分がダダ下がり🫩\n\nですが、状況を受け入れるスピードが相変わらず爆速なので、すでにニコニコで動画を見てます。\n⁡\nそれでもストレスは感じると思うので、少しでもストレス軽く過ごせるよう工夫したいですね👩🏻‍🔧\n⁡\n#急性リンパ性白血病\n#思ってたんと違う", "permalink": "https://www.threads.com/@kimagule.photo.art/post/Ddvr_YRiZKZ", "likes": 25, "velocity": 0.67, "ageHours": 37.2, "postedAt": "2026-09-26T18:13:50+09:00", "genres": ["リンパ"], "keywords": ["リンパ スクール"], "mods": []}, {"id": "3993914480216285941", "username": "npngbeats", "text": "私は今年20年目で鍼灸のみです！\n\nあん摩、マッサージ、指圧を取っておけばよかったという声をよく聞きます。\n\n実際臨床で困った事はなんでしょうか？\n\n私から", "permalink": "https://www.threads.com/@npngbeats/post/DdtPA8glKL1", "likes": 25, "velocity": 0.42, "ageHours": 60.0, "postedAt": "2026-09-25T19:22:09+09:00", "genres": ["鍼灸"], "keywords": ["鍼灸 スクール"], "mods": ["手技"]}, {"id": "3993202461938821022", "username": "artmake___sayaka", "text": "10/6(火)銀座で眉アートメイクモニターしたい方いらっしゃいますか？😳\nアートメイク初めての方限定です🔰\n\n費用は無料です！交通費のみ自己負担でお願いします🙇🏻‍♀️", "permalink": "https://www.threads.com/@artmake___sayaka/post/DdqtHt0FCee", "likes": 25, "velocity": 0.3, "ageHours": 83.6, "postedAt": "2026-09-24T19:47:30+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク 高単価"], "mods": []}, {"id": "3935341596204033760", "username": "growx_inc", "text": "オンライン秘書ってどうなんだ！？", "permalink": "https://www.threads.com/@growx_inc/post/DadJFTXj2bg", "likes": 24, "velocity": 0.01, "ageHours": 1999.6, "postedAt": "2026-07-06T23:48:17+09:00", "genres": ["オンライン秘 s": []}, {"id": "3991816784290492166", "username": "tommyfeb1984", "text": "先日の美容室でのもやもや、吐き出させてください。\n\nホットペッパービューティーのメニューを見て「カット込み」のヘッドスパと思い予約しましたが、実際はヘッドスパのみでした。(写真ご参照ください)\n\n予約時に表示される施術時間は1時間半だったため、この時点でもカット込みで妥当かなと疑いませんでした。\n\nお店に入った時は特にメニューの確認なく、すぐにヘッドスパの説明(頭皮ケアの大切さを懇切丁寧に説明される)、そしてシャンプー、ヘッドスパの流れでした。\n\nヘッドスパが終わった時点でなかなかの時間で(前説長すぎ)、敢えてカットの確認は自分からしませんでした。(ここでカットお願いしても、私の時間がなかったので諦めました)\n\n一応予定時間ぴったりに終わりましたが、最後はゆ〜〜っくりアイロンあててくれて、時間調整したのかな？という感じでした。\n\n後でメニュー見直しても、やはり「カット」の文字はあるし、クーポン選択で「カット」で絞ってもメニューに表示されます。\n\nそれにカット込みの値段だからと思って予約しましたし、こんな髪型にしてもらおうと色々検索して楽しみにしていたので、非常に残念です。", "permalink": "https://www.threads.com/@tommyfeb1984/post/DdlyDc8E68G", "likes": 14, "velocity": 0.11, "ageHours": 129.5, "postedAt": "2026-09-22T21:54:24+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ 手技"], "mods": ["メニュー"]}, {"id": "3994567220386588204", "username": "_shiori_1114", "text": "セラピスト、エステティシャンの方にお聞きしたい。\nちょっと怪しい話\nお相手の悪いもの吸い取ってしまいませんか？\n何か対策されて良くなったよって方おられたら知りたいです…\n人にうつす(自分がエステに通う)もやったけど\n最初の方は良くなってたのに最近さっぱり変わらずで😢\n話すだけじゃなく直接触れるぶん、すごくもらいやすい…", "permalink": "https://www.threads.com/@_shiori_1114/post/DdvjbkKj-Ys", "likes": 13, "velocity": 0.34, "ageHours": 38.4, "postedAt": "2026-09-26T16:59:02+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン"], "mods": []}, {"id": "3992499491278815149", "username": "private_salon_chouchou", "text": "名古屋で全身リンパケア🌿\nリンパの詰まりにイタ気持ちよくアプローチ。身体の歪みを整えて、脂肪の定着を無くすオールハンドトリートメント。受けたい女性募集🌟\n新規限定\n80分　9,800円→4,000円\n100分　12,800円→5,000円", "permalink": "https://www.threads.com/@private_salon_chouchou/post/DdoNSJXmf-t", "likes": 12, "velocity": 0.11, "ageHours": 106.9, "postedAt": "2026-09-23T20:30:49+09:00", "genres": ["リンパ"], "keywords": ["リンパ 手技"], "mods": ["メニュー"]}, {"id": "3994352848460137976", "username": "hazudesu85", "text": "千葉県南柏　柏　松戸　流山\nこれから肌寒くなる季節\n雨☔ばかりでなんとなく体がスッキリしない。重だるい。\n当店人気No.1メニューのよもぎ蒸し×アロマ経絡リンパマッサージでリセットしませんか？\nしっかりと温まった体に心地良い圧の経絡リンパマッサージでしっかり流してコリをほぐします！\n施術した後は体がすごく軽く、夜はすっごい熟睡💤できた。というお声をよくいただきます☺️", "permalink": "https://www.threa <script>
(function () {
  var readJSON = function (id) { return JSON.parse(document.getElementById(id).textContent); };
  var POSTS = readJSON('data');
  var GENRES = readJSON('genre-list');
  var MODIFIERS = readJSON('modifier-list');
  var SUMMARY = readJSON('summary-data');
  var RISING = 0.76;   // 伸び率の上位10%にあたる値

  var activeGenres = new Set();
  var activeMods = new Set();   // 掛け合わせ語。ジャンルとはANDで効かせる
  var els = {
    sort: document.getElementById('sort'),
    period: document.getElementById('period'),
    q: document.getElementById('q'),
    genres: document.getElementById('genres'),
    modifiers: document.getElementById('modifiers'),
    list: document.getElementById('list'),
    count: document.getElementById('count'),
    summary: document.getElementById('summary'),
    breakdown: document.getElementById('breakdown')
  };

  function mk(tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  // 文節を1かたまりとして置く。途中で改行されないので、
  // 「を」「と」などの助詞が行頭に来ることがなくなる。
  function phrases(parent, list) {
    list.forEach(function (t) { parent.appendChild(mk('span', 'nb', t)); });
    return parent;
  }

  // --- 集計 ---
  // タイルは必ず4枚。ジャンルはここに混ぜず、下の棒グラフで見せる。
  (function renderSummary() {
    var tiles = [
      ['表示中の投稿', SUMMARY.total, '件'],
      ['直近7日の投稿', SUMMARY.thisWeek, '件'],
      ['1000いいね超え', SUMMARY.over1000, '件'],
      ['投稿者', SUMMARY.authors, '人']
    ];
    tiles.forEach(function (t) {
      var box = mk('div', 'stat');
      box.appendChild(mk('span', 'stat-label', t[0]));
      var v = mk('div', 'stat-value', t[1].toLocaleString());
      v.appendChild(mk('span', 'unit', t[2]));
      box.appendChild(v);
      els.summary.appendChild(box);
    });
  })();

  // --- ジャンル別の内訳 ---
  // 棒の長さは最多ジャンルを100%とした相対値。1つの投稿が複数ジャンルに
  // 入ることがあり、合計が総数と一致しないため、全体に対する割合としては見せない。
  (function renderBreakdown() {
    if (!SUMMARY.genres.length) { els.breakdown.remove(); return; }

    els.breakdown.appendChild(mk('p', 'breakdown-title', 'ジャンル別'));
    var max = SUMMARY.genres.reduce(function (m, p) { return Math.max(m, p[1]); }, 0);

    // 長いジャンル名は固定幅の列に1行では収まらない。
    // 「・」の位置だけで折り、カタカナ語の途中では絶対に割らない。
    function nameParts(name) {
      var parts = name.split('・');
      return parts.map(function (t, i) {
        // 「・」は前の語にくっつける。行頭に落とさないため
        return i < parts.length - 1 ? t + '・' : t;
      });
    }

    SUMMARY.genres.forEach(function (pair) {
      var row = mk('div', 'bar-row');
      if (pair[1] === 0) row.classList.add('pending');
      row.appendChild(phrases(mk('span', 'bar-name'), nameParts(pair[0])));

      var track = mk('div', 'bar-track');
      var fill = mk('div', 'bar-fill');
      fill.style.width = (max > 0 ? (pair[1] / max) * 100 : 0) + '%';
      track.appendChild(fill);
      row.appendChild(track);

      // 数字は出さない。棒の長さで強弱は足りる。
      // まだ集まっていないものだけ、空の棒の理由が分かるよう言葉を添える
      row.appendChild(mk('span', 'bar-count', pair[1] === 0 ? '収集待ち' : ''));
      els.breakdown.appendChild(row);
    });
  })();

  // 何件のうち何件を見ているのかを明示する。
  // 「最終収集」は実際に収集した時刻。HTMLを作り直しただけでは進まない。
  (function renderStamp() {
    var stamp = document.getElementById('stamp');
    var collectedAt = SUMMARY.updatedAt || '2026-09-28 07:24';
    var units = ['最終収集 ' + collectedAt];
    if (SUMMARY.archived > SUMMARY.total) {
      units.push('　/　蓄積 ' + SUMMARY.archived.toLocaleString() + ' 件のうち ');
      units.push(SUMMARY.total.toLocaleString() + ' 件を表示');
    }
    phrases(stamp, units);
  })();

  // --- 絞り込みのチップ（2段構え） ---
  // 上段: 主ジャンル。単独で検索して意味のある語。
  // 下段: 掛け合わせ語。「経営」「メニュー」のように単独だと飲食や一般ビジネスを
  //       拾ってしまう語で、本文に該当語があるかで絞る。
  // どちらも対象を全部並べる。今日まだ回っていないものを隠すと、
  // 扱う範囲が狭まったように見えるため。
  var chipStates = [];

  function makeChip(row, label, onActivate) {
    var b = mk('span', 'chip');
    b.appendChild(mk('span', 'chip-name', label));
    if (onActivate) {
      b.tabIndex = 0;
      b.setAttribute('role', 'button');
      b.addEventListener('click', onActivate);
      b.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onActivate(); }
      });
    } else {
      // 1件も無いので押しても何も起きない。操作対象から外す
      b.classList.add('pending');
      b.setAttribute('aria-disabled', 'true');
      b.title = '該当する投稿がまだありません';
    }
    row.appendChild(b);
    return b;
  }

  function syncChips() {
    chipStates.forEach(function (s) {
      var on = s.isOn();
      s.el.classList.toggle('on', on);
      s.el.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  // 選んだ集合を切り替えるチップを1つ作る。上段と下段で作りが同じなのでまとめる
  function addToggleChip(row, name, active) {
    var chip = makeChip(row, name, function () {
      if (active.has(name)) active.delete(name);
      else active.add(name);
      syncChips();
      render();
    });
    chipStates.push({ el: chip, isOn: function () { return active.has(name); } });
  }

  function addAllChip(row, active) {
    var chip = makeChip(row, 'すべて', function () {
      active.clear();
      syncChips();
      render();
    });
    chipStates.push({ el: chip, isOn: function () { return active.size === 0; } });
  }

  addAllChip(els.genres, activeGenres);
  GENRES.forEach(function (pair) {
    if (pair[1] === 0) { makeChip(els.genres, pair[0], null); return; }
    addToggleChip(els.genres, pair[0], activeGenres);
  });

  if (MODIFIERS.length === 0) {
    els.modifiers.remove();
  } else {
    addAllChip(els.modifiers, activeMods);
    MODIFIERS.forEach(function (pair) {
      if (pair[1] === 0) { makeChip(els.modifiers, pair[0], null); return; }
      addToggleChip(els.modifiers, pair[0], activeMods);
    });
  }

  syncChips();

  function fmtAge(h) {
    if (h === null || h === undefined) return '不明';
    if (h < 24) return Math.round(h) + '時間前';
    return Math.round(h / 24) + '日前';
  }

  function filtered() {
    var days = parseInt(els.period.value, 10);
    var q = els.q.value.trim().toLowerCase();

    return POSTS.filter(function (p) {
      if (days > 0) {
        if (p.ageHours === null || p.ageHours > days * 24) return false;
      }
      if (activeGenres.size > 0) {
        var hit = p.genres.some(function (g) { return activeGenres.has(g); });
        if (!hit) return false;
      }
      // 掛け合わせはジャンルとAND。「オンライン秘書」かつ「経営」を出すため。
      // 掛け合わせ語どうしはOR（複数選ぶと候補が広がる）
      if (activeMods.size > 0) {
        var mods = p.mods || [];
        var hitMod = mods.some(function (m) { return activeMods.has(m); });
        if (!hitMod) return false;
      }
      if (q) {
        var hay = (p.text + ' ' + p.username).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function sorted(rows) {
    var mode = els.sort.value;
    var copy = rows.slice();
    if (mode === 'likes') copy.sort(function (a, b) { return b.likes - a.likes; });
    else if (mode === 'newest') copy.sort(function (a, b) {
      var av = a.ageHours === null ? Infinity : a.ageHours;
      var bv = b.ageHours === null ? Infinity : b.ageHours;
      return av - bv;
    });
    else copy.sort(function (a, b) { return b.velocity - a.velocity; });
    return copy;
  }

  function render() {
    var rows = sorted(filtered());
    els.count.textContent = rows.length + ' 件を表示';
    els.list.textContent = '';

    if (rows.length === 0) {
      // 「絞り込みを」を1かたまりにして、「を」が行頭に来ないようにする
      els.list.appendChild(phrases(mk('div', 'empty'), [
        '条件に合う投稿が', 'ありません。', '絞り込みを', '緩めてください。'
      ]));
      return;
    }

    var frag = document.createDocumentFragment();
    rows.forEach(function (p, i) {
      var isRising = p.velocity >= RISING;
      var card = mk('div', 'card' + (isRising ? ' rising' : ''));

      var head = mk('div', 'card-head');
      head.appendChild(mk('span', 'rank', String(i + 1)));
      head.appendChild(mk('span', 'user', '@' + p.username));
      if (isRising) head.appendChild(mk('span', 'badge', '伸び中'));

      var stats = mk('div', 'stats');
      stats.appendChild(mk('span', 'likes', p.likes.toLocaleString() + ' likes'));
      stats.appendChild(mk('span', 'vel', p.velocity.toFixed(1) + '/h'));
      stats.appendChild(mk('span', 'age', fmtAge(p.ageHours)));
      head.appendChild(stats);
      card.appendChild(head);

      card.appendChild(mk('p', 'text', p.text));

      var tags = mk('div', 'tags');
      // 上下2段のチップと同じ「ジャンル＋掛け合わせ」を出す。
      // 検索語そのものを出すと、「オンライン秘書」と「オンライン秘書 経営」が
      // 並んで冗長になり、1ジャンル1語のときは同じ語が二重に出る
      var seenTags = {};
      p.genres.concat(p.mods || []).forEach(function (t) {
        if (seenTags[t]) return;
        seenTags[t] = true;
        tags.appendChild(mk('span', 'tag', t));
      });
      if (p.permalink) {
        var a = mk('a', 'link', '元投稿を開く →');
        a.href = p.permalink;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        tags.appendChild(a);
      }
      card.appendChild(tags);
      frag.appendChild(card);
    });
    els.list.appendChild(frag);
  }

  [els.sort, els.period].forEach(function (el) {
    el.addEventListener('change', render);
  });
  els.q.addEventListener('input', render);

  render();
})();
</script>
