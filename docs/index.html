<title>Threads Research Tool（美容ビジネス ver）</title>

<style>
  /* 明るい側を基準に全トークンを定義する。暗い側は下で上書きする。 */
  :root {
    --bg: #f6f4f5;
    --surface: #ffffff;
    --surface-2: #fbf9fa;
    --ink: #231c22;
    --muted: #6f636c;
    --border: #e4dee2;
    --accent: #8b2f5f;
    --accent-soft: #f7e9f0;
    --rising: #0f7b6c;
    --rising-soft: #e2f2ef;
    --chip: #efeaed;
    --focus: #8b2f5f;
  }
  /* OS が暗いとき。ただし閲覧者が明るいテーマを選んでいたらそちらを優先する。 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151114;
      --surface: #1f1a1e;
      --surface-2: #241e23;
      --ink: #f0eaee;
      --muted: #a3969e;
      --border: #332b31;
      --accent: #e086b0;
      --accent-soft: #3a2130;
      --rising: #4fc3ae;
      --rising-soft: #16332e;
      --chip: #2c2429;
      --focus: #e086b0;
    }
  }
  /* 閲覧者が暗いテーマを選んだとき。OS の設定に関係なく効かせる。 */
  :root[data-theme="dark"] {
    --bg: #151114;
    --surface: #1f1a1e;
    --surface-2: #241e23;
    --ink: #f0eaee;
    --muted: #a3969e;
    --border: #332b31;
    --accent: #e086b0;
    --accent-soft: #3a2130;
    --rising: #4fc3ae;
    --rising-soft: #16332e;
    --chip: #2c2429;
    --focus: #e086b0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    /* 透明のままだと閲覧側の地の色を借りてしまうので必ず塗る */
    background: var(--bg);
    color: var(--ink);
    /* 日本語本文はWebフォントを落とすと重いので、端末のフォントを使う */
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
                 -apple-system, BlinkMacSystemFont, "Yu Gothic Medium", sans-serif;
    line-height: 1.75;
    font-feature-settings: "palt" 1;
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
  }

  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px 96px; }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* --- 見出し --- */
  h1 {
    font-family: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-weight: 900;
    font-size: clamp(1.5rem, 4vw, 2.1rem);
    line-height: 1.35;
    letter-spacing: .01em;
    margin: 0;
    text-wrap: balance;
  }
  /* 対象ジャンルの但し書き。名前より一段弱く見せる */
  .ver {
    display: block;
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-weight: 400;
    font-size: .74rem;
    letter-spacing: .02em;
    color: var(--muted);
    margin-top: 6px;
  }

  /* --- 集計：詳細より先に全体像を出す --- */
  .panel {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    margin: 28px 0 8px;
  }
  /* 4枚で固定する。auto-fit だと枚数によって最後の1枚だけ次の行に
     取り残され、空いた枠が塗り残しに見えてしまうため。 */
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
  }
  @media (max-width: 620px) {
    /* 4枚なので2列でもきれいに埋まる */
    .summary { grid-template-columns: repeat(2, 1fr); }
  }
  .stat { background: var(--surface); padding: 14px 16px; }

  /* --- ジャンル別の内訳 --- */
  /* 棒にしておけば、ジャンルが何個あっても1行1本で並ぶので取り残しが出ない */
  .breakdown { padding: 15px 16px 17px; border-top: 1px solid var(--border); }
  .breakdown-title {
    font-size: .7rem; color: var(--muted); letter-spacing: .06em;
    margin: 0 0 11px; white-space: nowrap;
  }
  /* 名前の列は固定幅。名前に合わせて伸ばすと、長いジャンルの行だけ棒の
     開始位置がずれて、棒どうしの長さを目で比べられなくなる。
     収まらない名前は「・」の位置で折る（折り位置は .nb で決め打ち）。
     幅と高さは実際のジャンル名から build_html.py が計算して埋める。 */
  .bar-row {
    display: grid;
    grid-template-columns: 11.5em 1fr auto;
    gap: 12px; align-items: center;
  }
  .bar-row + .bar-row { margin-top: 8px; }
  /* 1行で収まる名前も2行の名前と同じ高さにする。混ざると行の間隔が
     ばらついて、棒の並びが読みにくくなる。
     flex にしているのは、折り返した2行をまとめて上下中央に置くため。 */
  .bar-name {
    font-size: .76rem; line-height: 1.4;
    min-height: 1.4em;
    display: flex; flex-wrap: wrap; align-content: center;
  }
  .bar-track {
    height: 6px; border-radius: 999px;
    background: var(--chip); overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 999px; background: var(--accent); }
  .bar-count {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; color: var(--muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  @media (max-width: 620px) {
    /* 幅は変えない。変えると狭い画面だけ折り返し位置が変わってしまう */
    .bar-row { gap: 9px; }
  }
  /* まだ集まっていないジャンル。対象には入っているので消さず、弱く見せる */
  .bar-row.pending .bar-name { color: var(--muted); }
  .bar-row.pending .bar-track { opacity: .55; }
  /* 「収集待ち」は日本語なので、等幅フォントに任せず本文と同じ書体で出す */
  .bar-row.pending .bar-count {
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: .7rem;
  }
  .stat-label {
    font-size: .7rem; color: var(--muted); letter-spacing: .06em;
    display: block; margin-bottom: 4px;
    /* 「表示中/の投稿」のように助詞で割れないよう、まとめて扱う */
    white-space: nowrap;
  }
  .stat-value {
    white-space: nowrap;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: 1.25rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .stat-value .unit { font-size: .72rem; font-weight: 400; color: var(--muted); margin-left: 3px; }
  .stamp {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .7rem; color: var(--muted); margin: 0 0 26px;
  }

  /* --- 操作バー --- */
  .controls {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: 12px 0 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row + .row { margin-top: 8px; }
  select, input[type=search] {
    font: inherit; font-size: .82rem;
    padding: 7px 11px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    color: var(--ink);
  }
  input[type=search] { flex: 1; min-width: 180px; }
  .chip {
    display: inline-flex; align-items: baseline; gap: 6px;
    font-size: .78rem; padding: 5px 13px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on {
    background: var(--accent-soft); border-color: var(--accent);
    color: var(--accent); font-weight: 700;
  }
  /* どちらの行を押しているのか分かるようにする。2段になると迷いやすい */
  .filter-label {
    font-size: .7rem; color: var(--muted); letter-spacing: .04em;
    white-space: nowrap; min-width: 5.5em;
  }
  /* ジャンル名は途中で割らない。「ダイエット」を「ダイ」と「エット」に分けない */
  .chip-name { white-space: nowrap; }
  /* まだ1件も無いジャンル。押しても空振りするので、選べないことを見た目で示す */
  .chip.pending {
    opacity: .45; cursor: default;
    border-style: dashed;
  }
  .chip.pending:hover { border-color: var(--border); color: var(--muted); }
  .count {
    white-space: nowrap;
    font-family: "Roboto Mono", ui-monospace, monospace;
    color: var(--muted); font-size: .76rem; margin-bottom: 14px;
    font-variant-numeric: tabular-nums;
  }

  /* --- カード --- */
  #list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid transparent;
    border-radius: 10px;
    padding: 16px 18px;
  }
  /* 伸びが速い投稿は左端の色で一目で分かるようにする */
  .card.rising { border-left-color: var(--rising); background: var(--surface-2); }

  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 9px; }
  .rank {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; color: var(--muted);
    font-variant-numeric: tabular-nums; min-width: 2.4em;
  }
  .user { font-weight: 700; font-size: .86rem; }
  .badge {
    white-space: nowrap;
    font-size: .66rem; font-weight: 700; letter-spacing: .04em;
    padding: 2px 8px; border-radius: 999px;
    background: var(--rising-soft); color: var(--rising);
  }
  .stats {
    margin-left: auto; display: flex; gap: 11px;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; font-variant-numeric: tabular-nums;
  }
  .likes { color: var(--accent); font-weight: 700; }
  .vel { color: var(--rising); font-weight: 500; }
  .age { color: var(--muted); }

  .text {
    white-space: pre-wrap;
    /* word-break: break-word は単語の途中で割るので使わない。
       overflow-wrap なら、1語が行に収まらないときだけ割る。
       line-break: strict で日本語の禁則処理を厳しい方に寄せる。 */
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
    font-size: .92rem; margin: 0 0 12px;
  }

  /* 文節のかたまり。ここで囲った範囲は途中で改行されない。
     「を」「と」などの助詞が行頭に来るのを防ぐために使う。 */
  .nb { white-space: nowrap; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag {
    white-space: nowrap;
    font-size: .7rem; padding: 3px 9px; border-radius: 4px;
    background: var(--chip); color: var(--muted);
  }
  .link {
    margin-left: auto; font-size: .76rem; color: var(--accent);
    text-decoration: none; font-weight: 700; white-space: nowrap;
  }
  .link:hover { text-decoration: underline; }

  .empty { text-align: center; color: var(--muted); padding: 64px 20px; font-size: .88rem; }
</style>

://www.threads.com/@a.y.a_____8/post/DbuEMknk5D8", "likes": 2341, "velocity": 3.59, "ageHours": 652.5, "postedAt": "2026-08-07T10:04:04+09:00", "genres": ["ピラティス"], "keywords": ["ピラティス"], "mods": []}, {"id": "3945012059792668472", "username": "hitomi.kaiteki", "text": "更年期ってこんなに体が重くなるものなの？", "permalink": "https://www.threads.com/@hitomi.kaiteki/post/Da_f5Eakvc4", "likes": 2153, "velocity": 1.98, "ageHours": 1086.6, "postedAt": "2026-07-20T08:01:46+09:00", "genres": ["更年期ケア"], "keywords": ["更年期ケア"], "mods": []}, {"id": "3948026866662685911", "username": "mikotomochato", "text": "更年期って閉経してからが本番なの…？え？", "permalink": "https://www.threads.com/@mikotomochato/post/DbKNYSHILzX", "likes": 1994, "velocity": 2.02, "ageHours": 986.8, "postedAt": "2026-07-24T11:51:39+09:00", "genres": ["更年期ケア"], "keywords": ["更年期ケア"], "mods": []}, {"id": "3972746804991318752", "username": "mamiryu1127", "text": "更年期症状が辛すぎて心折れる😭体がだるくて、つい横になってしまう。眠たくてたまらなく、長時間布団の中にいたり。頭痛、めまい、もう色々。こんな自分が嫌で仕方ないです。同じようやな方いらっしゃいますか？", "permalink": "https://www.threads.com/@mamiryu1127/post/DciCCuuE1rg", "likes": 1895, "velocity": 11.27, "ageHours": 168.2, "postedAt": "2026-08-27T14:25:45+09:00", "genres": ["更年期ケア"], "keywords": ["更年期ケア"], "mods": []}, {"id": "3962707820818390667", "username": "heart_assist", "text": "鍼灸師として言います。\n\n性格によって、不調が出る場所は\nだいたい決まっています。", "permalink": "https://www.threads.com/@heart_assist/post/Db-XcSIit6L", "likes": 1843, "velocity": 3.68, "ageHours": 500.6, "postedAt": "2026-08-13T18:00:05+09:00", "genres": ["鍼灸"], "keywords": ["鍼灸", "鍼灸 経営"], "mods": []}, {"id": "3866112362743516296", "username": "yakimaro_5", "text": "更年期を見事に乗り越えたお姉様達に伺いたい！\n更年期が明けた後の体調ってどんな感じですか？\n今絶賛肩こり、腰痛、たまに動悸があるのでこういう症状も良くなるのか知りたいです。\n更年期にやって良かった事などありましたら伺いたい！！(切実😢)", "permalink": "https://www.threads.com/@yakimaro_5/post/DWnMLXbEsyI", "likes": 1724, "velocity": 0.47, "ageHours": 3699.2, "postedAt": "2026-04-02T11:22:09+09:00", "genres": ["更年期ケア"], "keywords": ["更年期ケア メニュー"], "mods": []}, {"id": "3924164202411440305", "username": "chiho_chico", "text": "今、韓国でバズってる小顔マッサージ。\n1日5分やるだけで、マジでみんなに｢顔小さくなった!?｣って褒められる🥹￼", "permalink": "https://www.threads.com/@chiho_chico/post/DZ1bo0NCbix", "likes": 1644, "velocity": 0.93, "ageHours": 1776.9, "postedAt": "2026-06-21T13:40:48+09:00", "genres": ["小顔"], "keywords": ["小顔"], "mods": []}, {"id": "3965426496924331356", "username": "rikatchinotamago", "text": "更年期？　47歳\n気分が落ち込む　イライラ　\nとにかく何もかもが面倒。買い物に行くのも掃除も。横になってスマホ見て寝ていたい。\n\nプラセンタと加味逍遙散飲んでる　\nホットフラッシュなし　髪の毛パサパサあり\nとにかくメンタル悪化が半端ない", "permalink": "https://www.threads.com/@rikatchinotamago/post/DcIBmOkGK1c", "likes": 1575, "velocity": 3.84, "ageHours": 410.6, "postedAt": "2026-08-17T12:01:37+09:00", "genres": ["更年期ケア"], "keywords": ["更年期ケア", "更年期ケア メニュー"], "mods": []}, {"id": "3964233170199451554", "username": "heart_assist", "text": "鍼灸師として言います。\n推し活は、\n私が知る中で最強の養生法です。\n\n真面目に言っています。", "permalink": "https://www.threads.com/@heart_assist/post/DcDyRCcjxei", "likes": 1513, "velocity": 3.36, "ageHours": 450.1, "postedAt": "2026-08-15T20:30:41+09:00", "genres": ["鍼灸"], "keywords": ["鍼灸"], "mods": []}, {"id": "3944360551245850524", "username": "sakippo05", "text": "ヘッドスパ専門店で働いてるんですが、お客様が続くとすごい眠くなるのと、何かしら吸い取られてヘロヘロになります。これってセラピストさんはみんなこうなりますか？ヘロヘロな時と、何か受け取って重い時もあります。\n眠気を覚ます方法、吸い取られたり受け取らなくする方法があれば知りたいです", "permalink": "https://www.threads.com/@sakippo05/post/Da9LwXzEqec", "likes": 1292, "velocity": 1.17, "ageHours": 1108.2, "postedAt": "2026-07-19T10:27:20+09:00", "genres": ["セラピスト", "エステティシャン"], "keywords": ["セラピスト", "エステティシャン メニュー"], "mods": []}, {"id": "3889643204932386777", "username": "xman31924", "text": "中国エステのブランド化粧品はカーテン裏で混ぜながら作る店も有るから儲かるのかな？🤣", "permalink": "https://www.threads.com/@xman31924/post/DX6yeL9Ab_Z", "likes": 1285, "velocity": 0.44, "ageHours": 2920.1, "postedAt": "2026-05-04T22:33:53+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン 単価UP"], "mods": []}, {"id": "3968193316894472669", "username": "saki_kounenki_totonou", "text": "更年期になってから、驚くほどやる気が出ない。少し歩くとソファに座る。何をするにも面倒くさいが先 ty": 0.01, "ageHours": 1435.5, "postedAt": "2026-07-05T19:06:11+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク スクール"], "mods": ["メニュー", "スクール"]}, {"id": "3973657355791579541", "username": "mama_baby_harelu", "text": "鍼灸院 HP作成 相場 🔍", "permalink": "https://www.threads.com/@mama_baby_harelu/post/DclRE_PEzmV", "likes": 20, "velocity": 0.14, "ageHours": 138.0, "postedAt": "2026-08-28T20:34:52+09:00", "genres": ["鍼灸"], "keywords": ["鍼灸 スクール"], "mods": []}, {"id": "3972613462295527549", "username": "matsudo_houwakai", "text": "施術などの手技においては、力を伝えるために「関節の遊びを取る」という考え方があります。\nこれは、関節がゆるんでいると力がうまく伝わらない、という考え方に基づくものです。\n\nしかし、脱力においては、発想を逆にしてみる必要があります。\n\n関節は、常に遊びを残しておく。\n\n関節の遊びをなくせば、力を一点に集中させることはできるかもしれません。\nしかし、それは身体を固定されたモノとしてとらえた力の出し方です。\n\n関節に遊びを残しておくことで、身体はそのつど形を変えながら必要な力を必要な場所へと受け渡していくことができます。\n\nたとえば鎖は、一つひとつの輪が固定されずに自由に動けるからこそ、ムチのようにその動きが次々と先端まで伝わっていきます。\n\n身体を固定して使うのではなく遊びを残したまま使う。\nそうすることで身体の中を力が止まらずに受け渡されていく感覚が生まれてきます。\n\n関節を固めることで伝わる力だけでなく、関節をゆるめることで初めて伝わる力もあります。その違いを、ぜひ身体で感じてみてください。", "permalink": "https://www.threads.com/@matsudo_houwakai/post/DchjuVqD0B9", "likes": 19, "velocity": 0.11, "ageHours": 172.6, "postedAt": "2026-08-27T10:00:50+09:00", "genres": [], "keywords": ["手技"], "mods": ["手技"]}, {"id": "3951762558122144029", "username": "colore0116", "text": "エステティシャンを「先生」って呼ぶ文化、なんでなんだろう？ 私は名字や「オーナー」のほうがしっくりくるんだけど、みなさんはどう思いますか？", "permalink": "https://www.threads.com/@colore0116/post/DbXexv5jzEd", "likes": 19, "velocity": 0.02, "ageHours": 863.1, "postedAt": "2026-07-29T15:33:48+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン"], "mods": ["経営"]}, {"id": "3974467368487447175", "username": "soibloom_hikaru", "text": "お盆明けからなんだか予約がなかなかはいりづらく…😱\n当サロンだけでしょうか…💦", "permalink": "https://www.threads.com/@soibloom_hikaru/post/DcoJQOWE2qH", "likes": 19, "velocity": 0.17, "ageHours": 111.2, "postedAt": "2026-08-29T23:24:13+09:00", "genres": ["美容サロン"], "keywords": ["美容サロン"], "mods": []}, {"id": "3976969251495451622", "username": "n.0604", "text": "未経験からネイリストを目指そうと思っていま locity": 0.0, "ageHours": 524.5, "postedAt": "2026-08-12T18:05:22+09:00", "genres": ["美容サロン"], "keywords": ["美容サロン 経営"], "mods": ["経営"]}, {"id": "3910926521490150219", "username": "tetsuhirokawano", "text": "【これ、次の高単価メニューになるかもしれません。】\n\n令和の虎出演で話題になった\n頭皮専門タトゥー「ヘアルプ」。\n\n正直、\n最初聞いた時は「どうなんだろ？」と思ってました。\n\nでも内容聞くと、\n美容業界の新しい選択肢としてかなり面白い。\n\n✔ 圧倒的差別化\n✔ 紹介で新規が来る構造\n✔ 短時間・高単価\n✔ 技術習得しやすい\n✔ 資格不要\n\n「今の延長だけだと不安」\n「新しい柱ほしい」\n\nそんなサロンには一回聞いてみる価値あると思います。\n\n説明会は30分だけ。\n\n導入前提じゃなく、\nまず知るために参加でも全然あり。\n\n6/11（木）\n9:00〜9:30\nオンライン開催\n\n気になる方はDMください", "permalink": "https://www.threads.com/@tetsuhirokawano/post/DZGZvNIExNL", "likes": 1, "velocity": 0.0, "ageHours": 2215.3, "postedAt": "2026-06-03T07:19:53+09:00", "genres": ["美容サロン"], "keywords": ["美容サロン 高単価"], "mods": ["メニュー", "高単価", "スクール", "手技"]}, {"id": "3977621812838328715", "username": "takeshi_pilates", "text": "ピラティスの創設者\nジョセフ・ピラティス氏が本当にこだわったのは、「吸う」ことより「吐く」ことだった。", "permalink": "https://www.threads.com/@takeshi_pilates/post/DczWfblEumL", "likes": 1, "velocity": 0.15, "ageHours": 6.8, "postedAt": "2026-09-03T07:51:32+09:00", "genres": ["ピラティス"], "keywords": ["ピラティス 経営"], "mods": []}, {"id": "3977596283509709982", "username": "drop_kobe.tarumi.salon", "text": "おはようございます。\n1年が早い・・・気が付けは9月も3日目。ちょっと息ついている間にどんどん時間が過ぎていく。私だけでしょうか。秋に向けて、【更年期女性】のための講座を開講予定です。\n薬剤師の知識と、サロンでお伝えしている養生の知恵をギュッと詰め込んで、皆さんの「ゆらぎ」を全力でサポートする内容を絶賛構築中です。\n「こんなこと知りたい！」というリクエストがあれば、ぜひリプライで教えてください！\n病院にいって対策するものもちろん大賛成ですが、病院に行くほどになる前に自分でケアできる女性を増やしたい・・・そんな願いがあります。", "permalink": "https://www.threads.com/@drop_kobe.tarumi.salon/post/DczQr7igpye", "likes": 1, "velocity": 0.13, "ageHours": 7.6, "postedAt": "2026-09-03T07:00:48+09:00", "genres": ["更年期ケア"], "keywords": ["更年期ケア メニュー"], "mods": ["スクール"]}, {"id": "3977578443768587753", "username": "ikumounogakkou", "text": "育毛・ヘッドスパを導入したサロンの投稿を見ていると、なぜか「効果が出ました」しか出てきません。\n\nうまくいった話しか、表に出てこない業界だなと、ずっと思っていました。\n\n美容師歴33年、今も現場に立ちながら、こういうメニュー導入のお手伝いもしています。\n\nなので今日は、営業トークじゃなくて、都合の悪い話から始めます。\n\n・機器を入れただけでは売れない話\n・売上より先に伝えていること\n・それでも導入する意味があるとしたら何か\n\nこの3つを、正直に話します。", "permalink": "https://www.threads.com/@ikumounogakkou/post/DczMoU_E-Xp", "likes": 1, "velocity": 0.12, "ageHours": 8.2, "postedAt": "2026-09-03T06:25:32+09:00", "genres": ["育毛"], "keywords": ["育毛 メニュー"], "mods": ["経営", "メニュー"]}, {"id": "3976303252711145460", "username": "mieruka_nori", "text": ".\n「単価を上げる」\nそう聞くと...\n\n「値上げする？」\n「高単価メニューを作る？」\n「価値をもっと伝える？」\n\nそんな方法を思い浮かべるかもしれません\nでも私は、どれもちょっと苦手です😅\n\n値上げするのも怖い\n上手に価値を伝えて納得してもらうのも大変\n\nましてや\n強いクロージングなんてできればしたくない🤣\n\nだったら...\n\n値上げしない\n売り込まない\n\nそれでも単価が上がる「仕組み」を考えた方が\n施術する側も受ける側も自然なんじゃないか...\n\n私はそんな方向から\n施術院の単価やLTVを考えています\n\nしかも...\nそれが結果として\n価格競争から離れることにもつながるとしたら？\n\n「もっと頑張って売る」以外にも\n経営の数字を変える方法はあると思うんです\n\n#施術院経営 \n#整体院経営 \n#治療院経営 \n#単価アップ \n#ノリ加藤", "permalink": "https://www.threads.com/@mieruka_nori/post/Dcuqr2xE__0", "likes": 1, "velocity": 0.02, "ageHours": 50.4, "postedAt": "2026-09-01T12:11:49+09:00", "genres": ["セラピスト"], "keywords": ["セラピスト 高単価"], "mods": ["経営", "メニュー", "高単価", "単価UP"]}, {"id": "3977757898506842051", "username": "happybetty358", "text": "🌾🌾和合の郷🌾🌾\n\n第四期修了特別講演会\n\n＼「知る」ことから、未来はつながる🤝✨／\n\n和合の郷第4期 特別講演会＆音楽ライブ♪  開催決定！\n\n今回は、子どもたちの現状や沖縄の歴史から、「これからの生き方」を学ぶ貴重な時間です。\n\n講演と音楽ライブ、盛りだくさんの内容でお届けします🎶\nぜひ、お気軽にご参加ください！😊\n--\n■日時：9月12日（土）\n 13:00～15:30\n■会場：採do所\n（福岡県田川郡香春町採銅所6095）\n■参加費：1,000縁\n （高校生以下無料）\n--\n📚【特別講演】\n講師：林 琴枝（セラピスト）\n「私の出会った子どもたちと10年後の未来」\n講師：益永 早苗（愛の伝道師）\n「知ることは、愛の始まり」\n🎶【音楽ライブ】\nmow mow sibs\n沖縄三線をベースに、ジャンルを問わず唄をたのしむ集団\n\n詳細・お申込みは、こちら\nhttps://forms.gle/tMUxYfbF9WBVw2oE7\n\n皆さまのご参加をお待ちしております！🌿", "permalink": "https://www.threads.com/@happybetty358/post/Dcz1bvPAS_D", "likes": 1, "velocity": 0.17, "ageHours": 2.3, "postedAt": "2026-09-03T12:21:55+09:00", "genres": ["セラピスト"], "keywords": ["セラピスト 高単価"], "mods": ["スクール"]}, {"id": "3969722344419822231", "username": "akane.__artmake", "text": "【📍銀座の技術を群馬へ】\n先日、医療アートメイクスクールを\n卒業しました✨\n現在、活動する準備を進めています。\n・銀座で習得した技術を地元群馬へ！！\n・地元の方にもっとアートメイクを身近に感じてもらいたい！！\nそんな想いで準備中です☺️\n\nデビューしたてなので、\n少しの間モニター価格で\nお得に受けていただ <script>
(function () {
  var readJSON = function (id) { return JSON.parse(document.getElementById(id).textContent); };
  var POSTS = readJSON('data');
  var GENRES = readJSON('genre-list');
  var MODIFIERS = readJSON('modifier-list');
  var SUMMARY = readJSON('summary-data');
  var RISING = 1.01;   // 伸び率の上位10%にあたる値

  var activeGenres = new Set();
  var activeMods = new Set();   // 掛け合わせ語。ジャンルとはANDで効かせる
  var els = {
    sort: document.getElementById('sort'),
    period: document.getElementById('period'),
    q: document.getElementById('q'),
    genres: document.getElementById('genres'),
    modifiers: document.getElementById('modifiers'),
    list: document.getElementById('list'),
    count: document.getElementById('count'),
    summary: document.getElementById('summary'),
    breakdown: document.getElementById('breakdown')
  };

  function mk(tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  // 文節を1かたまりとして置く。途中で改行されないので、
  // 「を」「と」などの助詞が行頭に来ることがなくなる。
  function phrases(parent, list) {
    list.forEach(function (t) { parent.appendChild(mk('span', 'nb', t)); });
    return parent;
  }

  // --- 集計 ---
  // タイルは必ず4枚。ジャンルはここに混ぜず、下の棒グラフで見せる。
  (function renderSummary() {
    var tiles = [
      ['表示中の投稿', SUMMARY.total, '件'],
      ['直近7日の投稿', SUMMARY.thisWeek, '件'],
      ['1000いいね超え', SUMMARY.over1000, '件'],
      ['投稿者', SUMMARY.authors, '人']
    ];
    tiles.forEach(function (t) {
      var box = mk('div', 'stat');
      box.appendChild(mk('span', 'stat-label', t[0]));
      var v = mk('div', 'stat-value', t[1].toLocaleString());
      v.appendChild(mk('span', 'unit', t[2]));
      box.appendChild(v);
      els.summary.appendChild(box);
    });
  })();

  // --- ジャンル別の内訳 ---
  // 棒の長さは最多ジャンルを100%とした相対値。1つの投稿が複数ジャンルに
  // 入ることがあり、合計が総数と一致しないため、全体に対する割合としては見せない。
  (function renderBreakdown() {
    if (!SUMMARY.genres.length) { els.breakdown.remove(); return; }

    els.breakdown.appendChild(mk('p', 'breakdown-title', 'ジャンル別'));
    var max = SUMMARY.genres.reduce(function (m, p) { return Math.max(m, p[1]); }, 0);

    // 長いジャンル名は固定幅の列に1行では収まらない。
    // 「・」の位置だけで折り、カタカナ語の途中では絶対に割らない。
    function nameParts(name) {
      var parts = name.split('・');
      return parts.map(function (t, i) {
        // 「・」は前の語にくっつける。行頭に落とさないため
        return i < parts.length - 1 ? t + '・' : t;
      });
    }

    SUMMARY.genres.forEach(function (pair) {
      var row = mk('div', 'bar-row');
      if (pair[1] === 0) row.classList.add('pending');
      row.appendChild(phrases(mk('span', 'bar-name'), nameParts(pair[0])));

      var track = mk('div', 'bar-track');
      var fill = mk('div', 'bar-fill');
      fill.style.width = (max > 0 ? (pair[1] / max) * 100 : 0) + '%';
      track.appendChild(fill);
      row.appendChild(track);

      // 数字は出さない。棒の長さで強弱は足りる。
      // まだ集まっていないものだけ、空の棒の理由が分かるよう言葉を添える
      row.appendChild(mk('span', 'bar-count', pair[1] === 0 ? '収集待ち' : ''));
      els.breakdown.appendChild(row);
    });
  })();

  // 何件のうち何件を見ているのかを明示する。
  // 「最終収集」は実際に収集した時刻。HTMLを作り直しただけでは進まない。
  (function renderStamp() {
    var stamp = document.getElementById('stamp');
    var collectedAt = SUMMARY.updatedAt || '2026-09-03 14:36';
    var units = ['最終収集 ' + collectedAt];
    if (SUMMARY.archived > SUMMARY.total) {
      units.push('　/　蓄積 ' + SUMMARY.archived.toLocaleString() + ' 件のうち ');
      units.push(SUMMARY.total.toLocaleString() + ' 件を表示');
    }
    phrases(stamp, units);
  })();

  // --- 絞り込みのチップ（2段構え） ---
  // 上段: 主ジャンル。単独で検索して意味のある語。
  // 下段: 掛け合わせ語。「経営」「メニュー」のように単独だと飲食や一般ビジネスを
  //       拾ってしまう語で、本文に該当語があるかで絞る。
  // どちらも対象を全部並べる。今日まだ回っていないものを隠すと、
  // 扱う範囲が狭まったように見えるため。
  var chipStates = [];

  function makeChip(row, label, onActivate) {
    var b = mk('span', 'chip');
    b.appendChild(mk('span', 'chip-name', label));
    if (onActivate) {
      b.tabIndex = 0;
      b.setAttribute('role', 'button');
      b.addEventListener('click', onActivate);
      b.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onActivate(); }
      });
    } else {
      // 1件も無いので押しても何も起きない。操作対象から外す
      b.classList.add('pending');
      b.setAttribute('aria-disabled', 'true');
      b.title = '該当する投稿がまだありません';
    }
    row.appendChild(b);
    return b;
  }

  function syncChips() {
    chipStates.forEach(function (s) {
      var on = s.isOn();
      s.el.classList.toggle('on', on);
      s.el.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  // 選んだ集合を切り替えるチップを1つ作る。上段と下段で作りが同じなのでまとめる
  function addToggleChip(row, name, active) {
    var chip = makeChip(row, name, function () {
      if (active.has(name)) active.delete(name);
      else active.add(name);
      syncChips();
      render();
    });
    chipStates.push({ el: chip, isOn: function () { return active.has(name); } });
  }

  function addAllChip(row, active) {
    var chip = makeChip(row, 'すべて', function () {
      active.clear();
      syncChips();
      render();
    });
    chipStates.push({ el: chip, isOn: function () { return active.size === 0; } });
  }

  addAllChip(els.genres, activeGenres);
  GENRES.forEach(function (pair) {
    if (pair[1] === 0) { makeChip(els.genres, pair[0], null); return; }
    addToggleChip(els.genres, pair[0], activeGenres);
  });

  if (MODIFIERS.length === 0) {
    els.modifiers.remove();
  } else {
    addAllChip(els.modifiers, activeMods);
    MODIFIERS.forEach(function (pair) {
      if (pair[1] === 0) { makeChip(els.modifiers, pair[0], null); return; }
      addToggleChip(els.modifiers, pair[0], activeMods);
    });
  }

  syncChips();

  function fmtAge(h) {
    if (h === null || h === undefined) return '不明';
    if (h < 24) return Math.round(h) + '時間前';
    return Math.round(h / 24) + '日前';
  }

  function filtered() {
    var days = parseInt(els.period.value, 10);
    var q = els.q.value.trim().toLowerCase();

    return POSTS.filter(function (p) {
      if (days > 0) {
        if (p.ageHours === null || p.ageHours > days * 24) return false;
      }
      if (activeGenres.size > 0) {
        var hit = p.genres.some(function (g) { return activeGenres.has(g); });
        if (!hit) return false;
      }
      // 掛け合わせはジャンルとAND。「オンライン秘書」かつ「経営」を出すため。
      // 掛け合わせ語どうしはOR（複数選ぶと候補が広がる）
      if (activeMods.size > 0) {
        var mods = p.mods || [];
        var hitMod = mods.some(function (m) { return activeMods.has(m); });
        if (!hitMod) return false;
      }
      if (q) {
        var hay = (p.text + ' ' + p.username).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function sorted(rows) {
    var mode = els.sort.value;
    var copy = rows.slice();
    if (mode === 'likes') copy.sort(function (a, b) { return b.likes - a.likes; });
    else if (mode === 'newest') copy.sort(function (a, b) {
      var av = a.ageHours === null ? Infinity : a.ageHours;
      var bv = b.ageHours === null ? Infinity : b.ageHours;
      return av - bv;
    });
    else copy.sort(function (a, b) { return b.velocity - a.velocity; });
    return copy;
  }

  function render() {
    var rows = sorted(filtered());
    els.count.textContent = rows.length + ' 件を表示';
    els.list.textContent = '';

    if (rows.length === 0) {
      // 「絞り込みを」を1かたまりにして、「を」が行頭に来ないようにする
      els.list.appendChild(phrases(mk('div', 'empty'), [
        '条件に合う投稿が', 'ありません。', '絞り込みを', '緩めてください。'
      ]));
      return;
    }

    var frag = document.createDocumentFragment();
    rows.forEach(function (p, i) {
      var isRising = p.velocity >= RISING;
      var card = mk('div', 'card' + (isRising ? ' rising' : ''));

      var head = mk('div', 'card-head');
      head.appendChild(mk('span', 'rank', String(i + 1)));
      head.appendChild(mk('span', 'user', '@' + p.username));
      if (isRising) head.appendChild(mk('span', 'badge', '伸び中'));

      var stats = mk('div', 'stats');
      stats.appendChild(mk('span', 'likes', p.likes.toLocaleString() + ' likes'));
      stats.appendChild(mk('span', 'vel', p.velocity.toFixed(1) + '/h'));
      stats.appendChild(mk('span', 'age', fmtAge(p.ageHours)));
      head.appendChild(stats);
      card.appendChild(head);

      card.appendChild(mk('p', 'text', p.text));

      var tags = mk('div', 'tags');
      // 上下2段のチップと同じ「ジャンル＋掛け合わせ」を出す。
      // 検索語そのものを出すと、「オンライン秘書」と「オンライン秘書 経営」が
      // 並んで冗長になり、1ジャンル1語のときは同じ語が二重に出る
      var seenTags = {};
      p.genres.concat(p.mods || []).forEach(function (t) {
        if (seenTags[t]) return;
        seenTags[t] = true;
        tags.appendChild(mk('span', 'tag', t));
      });
      if (p.permalink) {
        var a = mk('a', 'link', '元投稿を開く →');
        a.href = p.permalink;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        tags.appendChild(a);
      }
      card.appendChild(tags);
      frag.appendChild(card);
    });
    els.list.appendChild(frag);
  }

  [els.sort, els.period].forEach(function (el) {
    el.addEventListener('change', render);
  });
  els.q.addEventListener('input', render);

  render();
})();
</script>
