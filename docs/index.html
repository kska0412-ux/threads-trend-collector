<title>Threads Research Tool（美容ビジネス ver）</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;900&family=Roboto+Mono:wght@400;500;700&display=swap">
<style>
  /* 明るい側を基準に全トークンを定義する。暗い側は下で上書きする。 */
  :root {
    --bg: #f6f4f5;
    --surface: #ffffff;
    --surface-2: #fbf9fa;
    --ink: #231c22;
    --muted: #6f636c;
    --border: #e4dee2;
    --accent: #8b2f5f;
    --accent-soft: #f7e9f0;
    --rising: #0f7b6c;
    --rising-soft: #e2f2ef;
    --chip: #efeaed;
    --focus: #8b2f5f;
  }
  /* OS が暗いとき。ただし閲覧者が明るいテーマを選んでいたらそちらを優先する。 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151114;
      --surface: #1f1a1e;
      --surface-2: #241e23;
      --ink: #f0eaee;
      --muted: #a3969e;
      --border: #332b31;
      --accent: #e086b0;
      --accent-soft: #3a2130;
      --rising: #4fc3ae;
      --rising-soft: #16332e;
      --chip: #2c2429;
      --focus: #e086b0;
    }
  }
  /* 閲覧者が暗いテーマを選んだとき。OS の設定に関係なく効かせる。 */
  :root[data-theme="dark"] {
    --bg: #151114;
    --surface: #1f1a1e;
    --surface-2: #241e23;
    --ink: #f0eaee;
    --muted: #a3969e;
    --border: #332b31;
    --accent: #e086b0;
    --accent-soft: #3a2130;
    --rising: #4fc3ae;
    --rising-soft: #16332e;
    --chip: #2c2429;
    --focus: #e086b0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    /* 透明のままだと閲覧側の地の色を借りてしまうので必ず塗る */
    background: var(--bg);
    color: var(--ink);
    /* 日本語本文はWebフォントを落とすと重いので、端末のフォントを使う */
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
                 -apple-system, BlinkMacSystemFont, "Yu Gothic Medium", sans-serif;
    line-height: 1.75;
    font-feature-settings: "palt" 1;
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
  }

  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px 96px; }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* --- 見出し --- */
  h1 {
    font-family: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-weight: 900;
    font-size: clamp(1.5rem, 4vw, 2.1rem);
    line-height: 1.35;
    letter-spacing: .01em;
    margin: 0;
    text-wrap: balance;
  }
  /* 対象ジャンルの但し書き。名前より一段弱く見せる */
  .ver {
    display: block;
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-weight: 400;
    font-size: .74rem;
    letter-spacing: .02em;
    color: var(--muted);
    margin-top: 6px;
  }

  /* --- 集計：詳細より先に全体像を出す --- */
  .panel {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    margin: 28px 0 8px;
  }
  /* 4枚で固定する。auto-fit だと枚数によって最後の1枚だけ次の行に
     取り残され、空いた枠が塗り残しに見えてしまうため。 */
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
  }
  @media (max-width: 620px) {
    /* 4枚なので2列でもきれいに埋まる */
    .summary { grid-template-columns: repeat(2, 1fr); }
  }
  .stat { background: var(--surface); padding: 14px 16px; }

  /* --- ジャンル別の内訳 --- */
  /* 棒にしておけば、ジャンルが何個あっても1行1本で並ぶので取り残しが出ない */
  .breakdown { padding: 15px 16px 17px; border-top: 1px solid var(--border); }
  .breakdown-title {
    font-size: .7rem; color: var(--muted); letter-spacing: .06em;
    margin: 0 0 11px; white-space: nowrap;
  }
  /* 名前の列は固定幅。名前に合わせて伸ばすと、長いジャンルの行だけ棒の
     開始位置がずれて、棒どうしの長さを目で比べられなくなる。
     収まらない名前は「・」の位置で折る（折り位置は .nb で決め打ち）。
     幅と高さは実際のジャンル名から build_html.py が計算して埋める。 */
  .bar-row {
    display: grid;
    grid-template-columns: 11.5em 1fr auto;
    gap: 12px; align-items: center;
  }
  .bar-row + .bar-row { margin-top: 8px; }
  /* 1行で収まる名前も2行の名前と同じ高さにする。混ざると行の間隔が
     ばらついて、棒の並びが読みにくくなる。
     flex にしているのは、折り返した2行をまとめて上下中央に置くため。 */
  .bar-name {
    font-size: .76rem; line-height: 1.4;
    min-height: 1.4em;
    display: flex; flex-wrap: wrap; align-content: center;
  }
  .bar-track {
    height: 6px; border-radius: 999px;
    background: var(--chip); overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 999px; background: var(--accent); }
  .bar-count {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; color: var(--muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  @media (max-width: 620px) {
    /* 幅は変えない。変えると狭い画面だけ折り返し位置が変わってしまう */
    .bar-row { gap: 9px; }
  }
  /* まだ集まっていないジャンル。対象には入っているので消さず、弱く見せる */
  .bar-row.pending .bar-name { color: var(--muted); }
  .bar-row.pending .bar-track { opacity: .55; }
  /* 「収集待ち」は日本語なので、等幅フォントに任せず本文と同じ書体で出す */
  .bar-row.pending .bar-count {
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: .7rem;
  }
  .stat-label {
    font-size: .7rem; color: var(--muted); letter-spacing: .06em;
    display: block; margin-bottom: 4px;
    /* 「表示中/の投稿」のように助詞で割れないよう、まとめて扱う */
    white-space: nowrap;
  }
  .stat-value {
    white-space: nowrap;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: 1.25rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .stat-value .unit { font-size: .72rem; font-weight: 400; color: var(--muted); margin-left: 3px; }
  .stamp {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .7rem; color: var(--muted); margin: 0 0 26px;
  }

  /* --- 操作バー --- */
  .controls {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: 12px 0 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row + .row { margin-top: 8px; }
  select, input[type=search] {
    font: inherit; font-size: .82rem;
    padding: 7px 11px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    color: var(--ink);
  }
  input[type=search] { flex: 1; min-width: 180px; }
  .chip {
    display: inline-flex; align-items: baseline; gap: 6px;
    font-size: .78rem; padding: 5px 13px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on {
    background: var(--accent-soft); border-color: var(--accent);
    color: var(--accent); font-weight: 700;
  }
  /* どちらの行を押しているのか分かるようにする。2段になると迷いやすい */
  .filter-label {
    font-size: .7rem; color: var(--muted); letter-spacing: .04em;
    white-space: nowrap; min-width: 5.5em;
  }
  /* ジャンル名は途中で割らない。「ダイエット」を「ダイ」と「エット」に分けない */
  .chip-name { white-space: nowrap; }
  /* まだ1件も無いジャンル。押しても空振りするので、選べないことを見た目で示す */
  .chip.pending {
    opacity: .45; cursor: default;
    border-style: dashed;
  }
  .chip.pending:hover { border-color: var(--border); color: var(--muted); }
  .count {
    white-space: nowrap;
    font-family: "Roboto Mono", ui-monospace, monospace;
    color: var(--muted); font-size: .76rem; margin-bottom: 14px;
    font-variant-numeric: tabular-nums;
  }

  /* --- カード --- */
  #list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid transparent;
    border-radius: 10px;
    padding: 16px 18px;
  }
  /* 伸びが速い投稿は左端の色で一目で分かるようにする */
  .card.rising { border-left-color: var(--rising); background: var(--surface-2); }

  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 9px; }
  .rank {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; color: var(--muted);
    font-variant-numeric: tabular-nums; min-width: 2.4em;
  }
  .user { font-weight: 700; font-size: .86rem; }
  .badge {
    white-space: nowrap;
    font-size: .66rem; font-weight: 700; letter-spacing: .04em;
    padding: 2px 8px; border-radius: 999px;
    background: var(--rising-soft); color: var(--rising);
  }
  .stats {
    margin-left: auto; display: flex; gap: 11px;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; font-variant-numeric: tabular-nums;
  }
  .likes { color: var(--accent); font-weight: 700; }
  .vel { color: var(--rising); font-weight: 500; }
  .age { color: var(--muted); }

  .text {
    white-space: pre-wrap;
    /* word-break: break-word は単語の途中で割るので使わない。
       overflow-wrap なら、1語が行に収まらないときだけ割る。
       line-break: strict で日本語の禁則処理を厳しい方に寄せる。 */
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
    font-size: .92rem; margin: 0 0 12px;
  }

  /* 文節のかたまり。ここで囲った範囲は途中で改行されない。
     「を」「と」などの助詞が行頭に来るのを防ぐために使う。 */
  .nb { white-space: nowrap; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag {
    white-space: nowrap;
    font-size: .7rem; padding: 3px 9px; border-radius: 4px;
    background: var(--chip); color: var(--muted);
  }
  .link {
    margin-left: auto; font-size: .76rem; color: var(--accent);
    text-decoration: none; font-weight: 700; white-space: nowrap;
  }
  .link:hover { text-decoration: underline; }

  .empty { text-align: center; color: var(--muted); padding: 64px 20px; font-size: .88rem; }
</style>

+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク"], "mods": ["スクール"]}, {"id": "3898992807411401614", "username": "zen.himeji", "text": "正直に言います。\nヘッドスパは定期的にやったほうがいいです。\nなぜかというと", "permalink": "https://www.threads.com/@zen.himeji/post/DYcAUzzj0OO", "likes": 27, "velocity": 0.01, "ageHours": 2747.3, "postedAt": "2026-05-17T20:09:44+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ", "ヘッドスパ 経営", "ヘッドスパ メニュー", "ヘッドスパ 手技", "ヘッドスパ 高単価"], "mods": []}, {"id": "3960686464917102993", "username": "jrajujeg", "text": "夫婦サロンで200万売り上げ\n悪くはないがもう10パー売り上げ伸ばしたい\n現在単価は14000円\n何か策はありませんか？", "permalink": "https://www.threads.com/@jrajujeg/post/Db3L1rwFOGR", "likes": 27, "velocity": 0.04, "ageHours": 704.4, "postedAt": "2026-08-10T23:04:01+09:00", "genres": ["美容サロン"], "keywords": ["美容サロン 単価UP"], "mods": []}, {"id": "3926915260834093511", "username": "y_salon_n", "text": "偏頭痛持ちの皆さん、\n頭痛ひどくないですか？😭\n個人的に昨日がここ最近で一番ひどかったです😭\n\n私は昔から偏頭痛持ちで、\nよくヘッドスパに行くのですが、\n好きが高じてヘッドスパのインストラクター資格取得しました✌️\n\n頭スッキリしたい方ぜひご来店ください🫶😊", "permalink": "https://www.threads.com/@y_salon_n/post/DZ_NJ_BE5nH", "likes": 27, "velocity": 0.01, "ageHours": 1822.7, "postedAt": "2026-06-25T08:46:40+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ 高単価"], "mods": ["スクール"]}, {"id": "3959161416233609706", "username": "hbl_sss", "text": "エステサロンされてる方\nブランケット何使ってますか？参考にさせてください🫣🥺", "permalink": "https://www.threads.com/@hbl_sss/post/DbxxFTfCWnq", "likes": 27, "velocity": 0.04, "ageHours": 754.9, "postedAt": "2026-08-08T20:34:01+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン 手技"], "mods": []}, {"id": "3938566710744320969", "username": "view_nishiyama", "text": "美容室行って\n \n(この担当無いわー。。)\n\nって時どんな時ですか？", "permalink": "https://www.threads.com/@view_nishiyama/post/DaomY5WGAvJ", "likes": 27, "velocity": 0.02, "ageHours": 1436.8, "postedAt": "2026-07-11T10:36:01+09:00", "genres": ["美容サロン"], "keywords": ["美容サロン"], "mods": []}, {"id": "3964100894694421053", "username": "daiki__sns", "text": "美容サロン経営されてる方に聞きたいのですが\n0からサロンをオープンした時、どうやって集客していましたか？\n\n友人が5月に独立してサロンをオープンしたんですけど、なかなかうまくいかないみたいです。", "permalink": "https://www.threads.com/@daiki__sns/post/DcDUMLSEbI9", "likes": 26, "velocity": 0.04, "ageHours": 591.3, "postedAt": "2026-08-15T16:07:53+09:00", "genres": ["美容サロン"], "keywords": ["美容サロン経営", "美容サロン"], "mods": ["経営"]}, {"id": "3977215383346057496", "username": "squirrel.3952203", "text": "眉毛、アートメイクのリタッチやりたいです。\n都内で平日可能、個人サロンの方が行きやすいなと思ってます。\n私のお店で是非！等いらっしゃいましたらお願いします！", "permalink": "https://www.threads.com/@squirrel.3952203/post/Dcx6FGnj5EY", "likes": 26, "velocity": 0.17, "ageHours": 157.0, "postedAt": "2026-09-02T18:24:01+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク 高単価"], "mods": []}, {"id": "3978018742961396560", "username": "ume_work_sns", "text": "オンライン秘書の案件を探していると、週10時間程度という条件では案件が取れないかも、と不安になることがあります。\n\nでも、今のところ本業を辞めるつもりはないし、オンライン秘書になるために本業や自分の生活を犠牲にするのは違うと思っています。\n\nまずは今の条件で挑戦してみて、難しいと分かったら別ジャンルの副業も考える。来年3月を一つの区切りに、それでも在宅での副業が難しければ、アルバイトも選択肢に入れる。\n\nどの働き方が自分に合うか判断するためにも、まずは行動。できる範囲で小さく頑張ってみます。", "permalink": "https://www.threads.com/@ume_work_sns/post/Dc0wvhkD1tQ", "likes": 26, "velocity": 0.2, "ageHours": 130.4, "postedAt": "2026-09-03T21:00:09+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書"], "mods": []}, {"id": "3975837338440920707", "username": "erena_style2023", "text": "在宅ワーク始めたいです！怪しくないやつ教えてください。という投稿を度々みるので、その度に「オンライン秘書が簡単ですよ、クラウドワークスで探して応募してください。会社員経験があったらできる仕事がほとんどです」って言ってるのに、やらない人ばかりなんだろうなと思う。もっと簡単で、もっと楽な方法探してるんだと思うの。もしくはもっと好条件。いろんな在宅ワークやってきたけど、オンライン秘書が一番簡単で、一番仕事が多くて、一番稼ぎやすいです。", "permalink": "https://www.threads.com/@erena_style2023/post/DctAv6SgW6D", "likes": 26, "velocity": 0.13, "ageHours": 202.7, "postedAt": "2026-08-31T20:46:06+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書"], "mods": []}, {"id": "3968404160614020303", "username": "yugo_celes_1125", "text": "業務委託で完全成果報酬で集客してくれる人いないかな？\n集客に自信あります！って人の話聞いても広告費に10万かけます！\nって感じの人多い気がするし。。。\n個人サロンで10万も成果がわからないのに広告費にかけられない。。。", "permalink": "https://www.threads.com/@yugo_celes_1125/post/DcSmo7-lLTP", "likes": 26, "velocity": 0.06, "ageHours": 448.8, "postedAt": "2026-08-21T14:37:42+09:00", "genres": ["美容サロン"], "keywords": ["美容サロン 高単価", "美容サロン 単価UP"], "mods": ["経営"]}, {"id": "3952252267600696542", "username": "met_manami", "text": "ㅤㅤ\nずっと自分にできる事は何かと考えていました。\n\n私は医療従事者ではありません。\n大きな支援ができるわけでもありません。\n\nでも、エステティシャンとして\n「体をほぐし、少しでも心を軽くすること」\nならできるかもしれないと思いました。\n\n避難生活や車中泊では、\n首や肩、背中、腰に負担がかかり、\n心も知らないうちに疲れてしまいます。\n\n40分という短い時間ですが、\n少しでも安心して体を休める時間になれば嬉しいです！\nお飲み物とおやつもご用意しております。\n\n必要な方や、お近くに困っている方がいらっしゃいましたら、この投稿を届けていただけると嬉しいです。\n\n#熊本エステ", "permalink": "https://www.threads.com/@met_manami/post/DbZOH9ZElTe", "likes": 26, "velocity": 0.03, "ageHours": 983.7, "postedAt": "2026-07-30T07:46:46+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン 手技"], "mods": ["手技"]}, {"id": "3976368451967280495", "username": "miwa.chibi", "text": "素直にうれしい気持ちです☘️\n抗がん剤治療終わって3ヶ月後の状態です😊\n最近、シャンプーやコンディショナーも楽しくて\n・\n旦那さんへ『編み込みできるかしら？😆』って話すと\n・\nおーー生えてきたーやー😆\nわしは、だんだん頭のてっぺんが薄くなってきたーやー\nあんたは、生えてきてわしは抜けとや😆\n・\nこの、下りを息子に話したら\n『なんだ〜育毛剤こ〜たろか〜w🤩👍🫶』って\nそれを聞いた旦那さんは大爆笑🤣🤣🤣\n今日もいい日だ\n・\n生えはじめは、むずむずしてむずがゆくて\n生えてきたら、細い細い産毛さんが\nだんだん日に日に太くなり\n黒くなってきて\n今はちょっとだけシャンプーの量も増やしたりして🧴💕\nウィッグは楽で、ケアも簡単\n夏はちと暑い☀️😵💦\n髪の毛っていろんな役割があるんだなと思ったことは\n暑さは紫外線予防、寒さ対策、\n汗の出方やつたってくる汗の量の調整\nほこりや怪我からも守り\nいろんなことに気づいて\n髪の毛って愛しい💕\n\n#乳ガン#副作用#脱毛#ウイング#髪の毛生えてきた", "permalink": "https://www.threads.com/@miwa.chibi/post/Dcu5goTlGVv", "likes": 26, "velocity": 0.14, "ageHours": 185.1, "postedAt": "2026-09-01T14:21:21+09:00", "genres": ["育毛"], "keywords": ["育毛 手技"], "mods": []}, {"id": "3893176782263288453", "username": "aya_beautynurse", "text": "助けてください😭アートメイク2日目にして、すでに心が折れそうです...\nデザインが難しすぎて、気づいたら泣きそうになっていました。\n周りのみんなが器用に見えて、自分だけが置いていかれている気がして焦りしかありません…。\n土曜日までに「毛並みとデザイン」の課題提出があるのに、今のままだと本当にまずい😭\n先輩方は、この時期どうやって乗り越えましたか？\n「この練習方法が効いた！」「これだけはやっておけ！」というアドバイスがあれば、藁にもすがる思いで教えていただきたいです😢🥲😭", "permalink": "https://www.threads.com/@aya_beautynurse/post/DYHV6gSmgKF", "likes": 26, "velocity": 0.01, "ageHours": 2939.9, "postedAt": "2026-05-09T19:34:20+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク", "アートメイク 高単価", "アートメイク スクール"], "mods": []}, {"id": "3979404571639235082", "username": "mi33316", "text": "アートメイクしたいと思って調べてたら8月31日までに予約したら半額だったって知って落胆😂", "permalink": "https://www.threads.com/@mi33316/post/Dc5r1_GH0IK", "likes": 26, "velocity": 0.31, "ageHours": 84.5, "postedAt": "2026-09-05T18:53:33+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク 高単価"], "mods": []}, {"id": "3976372359338242664", "username": "rabbit.17.17", "text": "ピラティスかジムかどちらかに行ってみたいんだけど、腰が悪くてヘルニア持ちだから高負荷の筋トレとかは難しいからピラティスかな？って思ってるんだけど、ピラティスって痩せるのかなー？\n筋力もないし体脂肪もかなり高いから、ちゃんと動いて痩せたい🦀", "permalink": "https://www.threads.com/@rabbit.17.17/post/Dcu6ZfVCbJo", "likes": 26, "velocity": 0.14, "ageHours": 184.9, "postedAt": "2026-09-01T14:29:05+09:00", "genres": ["ピラティス"], "keywords": ["ピラティス スクール"], "mods": []}, {"id": "3966426620710152551", "username": "_seraa1221", "text": "美容鍼って効果あるかな？", "permalink": "https://www.threads.com/@_seraa1221/post/DcLk_8bFOln", "likes": 26, "velocity": 0.05, "ageHours": 514.3, "postedAt": "2026-08-18T21:08:41+09:00", "genres": ["鍼灸"], "keywords": ["鍼灸 スクール"], "mods": []}, {"id": "3918626444318853230", "username": "ayumi.n.1025", "text": "38歳、抜け毛がひどくて髪の毛が少なくなってきて悩んでる。市販の育毛剤1年くらい同じの使ってるけどあんま効果なーい。ネットで見てても結局なにが効果あるのかわからん…\n治療するお金はないし。\nこれ効果あったよ！とかこの育毛剤おすすめ！とかあったら教えてほしいです！", "permalink": "https://www.threads.com/@ayumi.n.1025/post/DZhwf1FE8hu", "likes": 26, "velocity": 0.01, "ageHours": 2097.1, "postedAt": "2026-06-13T22:18:16+09:00", "genres": ["育毛"], "keywords": ["育毛 手技"], "mods": []}, {"id": "3916852928128709429", "username": "teleayumin", "text": "更年期かなと思ったらすぐ病院受診してもいいんですか？更年期と診断された方の経緯がしりたいです。", "permalink": "https://www.threads.com/@teleayumin/post/DZbdPxaj3M1", "likes": 26, "velocity": 0.01, "ageHours": 2155.9, "postedAt": "2026-06-11T11:34:36+09:00", "genres": ["更年期ケア"], "keywords": ["更年期ケア"], "mods": []}, {"id": "3963117959333680310", "username": "kazumi_counseling", "text": "リピーターが多いエステティシャンは、施術中に「ここ、すごく凝っているので、多めにやりますね」と絶対に言いません。\n\n例えば、思っているより、状態が悪いなって感じた時。", "permalink": "https://www.threads.com/@kazumi_counseling/post/Db_0slZDhS2", "likes": 25, "velocity": 0.04, "ageHours": 623.8, "postedAt": "2026-08-14T07:34:58+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン メニュー", "エステティシャン スクール"], "mods": []}, {"id": "3930754809410455029", "username": "tomatofu56", "text": "大阪の緑地公園にある一鍼堂っていう鍼灸院に通われてる方いらっしゃいますか？\n体のあちこちが次々に痛くて、辛いのですが、整形外科では異常なくて整骨院では治らなくて迷子になってます…\n鍼に行ってみようかと思うのですが、初めてなので怖くて、信頼出来るところを探しています。\nご存知の方がいらしたら教えてください", "permalink": "https://www.threads.com/@tomatofu56/post/DaM2KxSEYX1", "likes": 25, "velocity": 0.01, "ageHours": 1695.5, "postedAt": "2026-06-30T15:55:09+09:00", "genres": ["鍼灸"], "keywords": ["鍼灸 スクール"], "mods": []}, {"id": "3912638990558329863", "username": "saki_kounenki_totonou", "text": "更年期にいいと言われるエクオール。でも実は、日本人の約半数は大豆イソフラボンからエクオールを作れない体質です。そんな人にこそ知ってほしい成分があります。それが、", "permalink": "https://www.threads.com/@saki_kounenki_totonou/post/DZMfG6OknwH", "likes": 25, "velocity": 0.01, "ageHours": 2295.4, "postedAt": "2026-06-05T16:02:16+09:00", "genres": ["更年期ケア"], "keywords": ["更年期ケア メニュー"], "mods": []}, {"id": "3972641329905924172", "username": "amane.diary.112", "text": "個人エステ店のエステティシャンが店でマルチ商法の商品を扱ってるとするじゃん？\n\nで、エステ店のお客が販売員にはならなくても愛用者としてマルチの会社に登録して安く買えてるなら\n紹介したエステティシャンのピラミッドの下につくわけよね？？\n\nで、エステ店の客が登録は面倒くさいからエステに来た時にエステティシャンから買うわ～ってなったら\nエステティシャンが大量に買い込んだものを転売って形で売るのは\nこれはマルチ商法の取引にはならないの？？\n近所のエステ店がインスタで\n商品はババーーンと出してるのに\n商品名はちゃんと言わないし\n\nなんかモヤモヤする😣", "permalink": "https://www.threads.com/@amane.diary.112/post/DchqD3ZE_hM", "likes": 25, "velocity": 0.08, "ageHours": 308.5, "postedAt": "2026-08-27T10:56:12+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン 手技"], "mods": []}, {"id": "3913122858352745944", "username": "1965yok", "text": "乳がんからリンパ浮腫になって3ヶ月ちょっと。太さは1センチ程度差のままだけれど近頃ダルさと違和感が増している。来月形成外科受診。吻合手術を前向きに考えるべきか。もう少し様子を見た方が良いのか。とりあえず早く検査して欲しい。", "permalink": "https://www.threads.com/@1965yok/post/DZONIHOk53Y", "likes": 25, "velocity": 0.01, "ageHours": 227 ds": ["経営", "単価UP"]}, {"id": "3902355514584022304", "username": "ieaka.urakata0003", "text": "【 契約後に費用が爆増する打合せ 】\n\n第5位　外壁材\n・営業マンの「良い外壁で予算取ってあります」に注意\n・タイルや吹付は単価UPが大きい\n・面積が大きいからあっという間に数十万単位で増える\n\n→契約前にサンプルで確認は必須\n\n第4位　水回り設備\n・ショールーム行くとついつい欲しくなる...\n・「これくらいなら...」が積み重なる\n・気づけば数十万UP\n\n→出来れば契約前にショールーム行っとけ！\n\n第3位 ↓↓↓", "permalink": "https://www.threads.com/@ieaka.urakata0003/post/DYn86o6ET0g", "likes": 13, "velocity": 0.0, "ageHours": 2635.9, "postedAt": "2026-05-22T11:30:50+09:00", "genres": [], "keywords": ["単価UP"], "mods": ["単価UP"]}, {"id": "3940983623033937486", "username": "syunsuke20260124", "text": "サロンオーナー兼セラピストの皆さん\n教えてください。\n\n施術時間90分のサービスを\nストレスなく\n【一日、何人までならこなせますか？】\n\n業態やサービス内容で違いはあると\n思いますが、参考までに教えてください🙇", "permalink": "https://www.threads.com/@syunsuke20260124/post/DaxL7mUkd5O", "likes": 13, "velocity": 0.01, "ageHours": 1356.8, "postedAt": "2026-07-14T18:37:59+09:00", "genres": ["セラピスト"], "keywords": ["セラピスト 単価UP"], "mods": ["経営"]}, {"id": "3946916949343301153", "username": "hairmakekimkim", "text": "なんで集団サロンの生産性100万と1人サロンの生産性100万が『同じ』なんだよ。\n『生産性』という言葉だけ浅〜く齧った美容師はこういう発想になる。\n生産性なんて数々ある数字のほんの一つでしかなくて、\nそれだけじゃ美容室の事なんて何もわからんよ。", "permalink": "https://www.threads.com/@hairmakekimkim/post/DbGRA3Dk24h", "likes": 13, "velocity": 0.01, "ageHours": 1160.3, "postedAt": "2026-07-22T23:06:27+09:00", "genres": ["美容サロン"], "keywords": ["美容サロン 単価UP"], "mods": []}, {"id": "3964772965607412208", "username": "y.md_personal.trainer", "text": "ピラティスインストラクターの皆さん！\nレッスンの中で1番最後に持ってくるエクササイズって何が多いですか⁇ \nこれだけはやっときたい、やるべき😠\nみたいなやつ\n\nクライアントの主訴、ニーズが前提にあると思うけど。\nリフォーマーで！", "permalink": "https://www.threads.com/@y.md_personal.trainer/post/DcFtAGGGhHw", "likes": 13, "velocity": 0.02, "ageHours": 569.0, "postedAt": "2026-08-16T14:23:10+09:00", "genres": ["ピラティス"], "keywords": ["ピラティス スクール"], "mods": []}, {"id": "3956877733124434867", "username": "ayaka_webdesigner", "text": "【オンライン秘書募集】\nUnlyでは、オンラインスクール運営をサポートしてくださるオンライン秘書を募集します。\n\n主な業務は、スクール運営に関わる事務作業や情報整理、投稿作業などです。\n\n詳細はこちら🔻", "permalink": "https://www.threads.com/@ayaka_webdesigner/post/Dbpp1V2iOuz", "likes": 13, "velocity": 0.02, "ageHours": 830.5, "postedAt": "2026-08-05T16:56:45+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書"], "mods": ["スクール"]}, {"id": "3977936060445311341", "username": "kazumi_counseling", "text": "「あっ、この人、化粧品バンバン売るな」って思うエステティシャンは、商品説明から入りません。\n\n例えば、ドラコスの化粧水を使っているお客様に提案する時。", "permalink": "https://www.threads.com/@kazumi_counseling/post/Dc0d8VeD0Ft", "likes": 13, "velocity": 0.1, "ageHours": 133.2, "postedAt": "2026-09-03T18:15:53+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン 高単価", "エステティシャン 単価UP"], "mods": []}, {"id": "3977740253800470976", "username": "satoko.support", "text": "楽しそうなことを思いついてしまいました！\n\n「オンライン秘書を始めたけれど、次の一歩が見えない」\nそんな方とお話しする個別相談を、やってみることにしました✨\n\nきっかけは、フリーランス仲間と話した時のこと。自分にとってはあたり前のことも、「それ、強みですよね」と言っていただけて。\n\n自分のことって、自分では気づけないこともあるなぁと。\n\nオンライン秘書として頑張っている方とも、そんな話がしたいなと思っています😊\n気になる！という方、いますか？？", "permalink": "https://www.threads.com/@satoko.support/post/Dczxa-UjJnA", "likes": 13, "velocity": 0.09, "ageHours": 139.6, "postedAt": "2026-09-03T11:46:51+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書"], "mods": []}, {"id": "3978657392586476463", "username": "prima_body_tokyo", "text": "都内でブリーチしてても縮毛矯正ができる美容室ありますか？🥹🥹", "permalink": "https://www.threads.com/@prima_body_tokyo/post/Dc3B9GYGUuv", "likes": 13, "velocity": 0.12, "ageHours": 109.3, "postedAt": "2026-09-04T18:09:02+09:00", "genres": ["美容サロン"], "keywords": ["美容サロン"], "mods": []}, {"id": "3977929555926167421", "username": "sugiura7010", "text": "悲報…高単価サロンは完全に終了です", "permalink": "https://www.threads.com/@sugiura7010/post/Dc0cdrqga99", "likes": 13, "velocity": 0.1, "ageHours": 133.4, "postedAt": "2026-09-03T18:02:57+09:00", "genres": ["美容サロン", "エステティシャン", "セラピスト"], "keywords": ["美容サロン 高単価", "エステティシャン 高単価", "セラピスト 高単価"], "mods": ["高単価"]}, {"id": "3979965959389757993", "username": "ayaka__artmake", "text": "アートメイク 5,000症例して分かった🤔\n\n\"自然な眉”を希望する人ほど、最初に確認したいことがあります。\n\nそれは、すっぴんの時に自然 教えてもらえると嬉しいです！コメントお待ちしてます🙇‍♀️✨", "permalink": "https://www.threads.com/@lien_facial.salon/post/DcdeemfEhjj", "likes": 11, "velocity": 0.03, "ageHours": 347.5, "postedAt": "2026-08-25T19:58:02+09:00", "genres": ["美容サロン", "エステティシャン"], "keywords": ["美容サロン 単価UP", "エステティシャン", "エステティシャン 経営", "エステティシャン メニュー", "エステティシャン スクール"], "mods": []}, {"id": "3967562219146772868", "username": "sen_pilatescare", "text": "昨日ついに、新しく始めたピラティスインストラクターのスタジオがオープンして、3レッスンした！もう帰る頃にはくったくた。", "permalink": "https://www.threads.com/@sen_pilatescare/post/DcPnNE4gQGE", "likes": 11, "velocity": 0.02, "ageHours": 476.7, "postedAt": "2026-08-20T10:44:55+09:00", "genres": ["ピラティス"], "keywords": ["ピラティス スクール"], "mods": []}, {"id": "3964261347945043727", "username": "5fiveone1", "text": "なんかスレッズ見てると\nサロンや整体院を閉める人が多いね\n技術がある人は特に勿体ない…", "permalink": "https://www.threads.com/@5fiveone1/post/DcD4rFBE1cP", "likes": 11, "velocity": 0.02, "ageHours": 586.0, "postedAt": "2026-08-15T21:26:40+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン 手技"], "mods": []}, {"id": "3952168643085400125", "username": "massagesalontete", "text": "最近　お客様をマッサージしてて　\nリンパマッサージって\nすごいなあと思ったことが\nあります　それは…", "permalink": "https://www.threads.com/@massagesalontete/post/DbY7HD_ivg9", "likes": 11, "velocity": 0.01, "ageHours": 986.4, "postedAt": "2026-07-30T05:00:37+09:00", "genres": ["リンパ"], "keywords": ["リンパ 手技"], "mods": []}, {"id": "3878368580463438435", "username": "yujilaluz", "text": "鍼にどれだけ科学的根拠があったところで、\n鍼に特異的な化学的根拠がないことが問題なんですよね。\n\n私はかれこれ15年ほど、鍼灸の化学的作用機序に興味をもち生化学を学び続けてきました。\nその結論が「鍼に特異的な化学的根拠がない」です。\nその上で先の投稿なので「東洋医学に振り切れ」は逃げではなく、15年かけて辿り着いた鍼灸が生き残るための意見です。\n\n「医学として同一」とありますが、私はこの化学的な作用機序をクリアせずして、西洋医学と同列に語れることはないと考えています。\n\nちなみに「西洋医学観点でしっかりと鍼灸を考え」とおっしゃるからには、当然その基盤となる生化学は学ばれているかと思います。\n\nもしよろしければ、現時点での鍼灸の生化学的知見をぜひお聞かせいただけませんか？", "permalink": "https://www.threads.com/@yujilaluz/post/DXSu6zqjypj", "likes": 11, "velocity": 0.0, "ageHours": 3430.2, "postedAt": "2026-04-19T09:13:04+09:00", "genres": ["鍼灸"], "keywords": ["鍼灸 手技", "鍼灸" ": "2026-07-25T12:02:49+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書", "オンライン秘書 スクール"], "mods": []}, {"id": "3976862050597614146", "username": "natsumi_shinmama", "text": "オンライン秘書って何するの？とよく聞かれるので、\n実際にやっている作業を公開します📝\n\n特別なことは何もしてないよ！\n\n1つ目は、請求書の作成と入金の記録。\n\n決まったフォーマットに入力して、\n入金されたかを確認して印をつける作業です。\n（簿記の資格は要りませんでした）\n\n2つ目は、", "permalink": "https://www.threads.com/@natsumi_shinmama/post/Dcwpvb2mjJC", "likes": 10, "velocity": 0.06, "ageHours": 168.7, "postedAt": "2026-09-02T06:42:09+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書"], "mods": ["スクール"]}, {"id": "3968900291362011937", "username": "nurse_yorimichi", "text": "ドラマの医療シーンで\n「その手技はない」って言っちゃうやつ。\n家族に「静かに見て」って言われるまでが\nセットですよね笑", "permalink": "https://www.threads.com/@nurse_yorimichi/post/DcUXclvk7sh", "likes": 10, "velocity": 0.02, "ageHours": 432.4, "postedAt": "2026-08-22T07:03:25+09:00", "genres": [], "keywords": ["手技"], "mods": ["手技"]}, {"id": "3959447223583064953", "username": "morinone2026", "text": "みんな内科とか歯医者とか、かかりつけ医持ってますよね。\nドライヘッドスパもそのくらいの価値、あると思ってます💆‍♀️", "permalink": "https://www.threads.com/@morinone2026/post/DbyyEWUk0N5", "likes": 10, "velocity": 0.01, "ageHours": 745.4, "postedAt": "2026-08-09T06:01:52+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ"], "mods": []}, {"id": "3941131414645216341", "username": "arise.higashihiroshima", "text": "やはり、美容鍼\n通常料金6,500円は高いのでしょうか？", "permalink": "https://www.threads.com/@arise.higashihiroshima/post/DaxtiP_D5RV", "likes": 10, "velocity": 0.01, "ageHours": 1351.9, "postedAt": "2026-07-14T23:31:37+09:00", "genres": ["鍼灸"], "keywords": ["鍼灸 スクール"], "mods": []}, {"id": "3860933611428736742", "username": "natigron0", "text": "アトラスシダー精油（Cedrus atlantica）は、「リンパ鬱滞の緩和」や「ドレナージ作用」があるとよく語られます。\n\nこの精油は木部由来の重厚な精油で、β-ヒマカレン、α-ヒマカレン、γ-ヒマカレンなどのセスキテルペン類を多く含みます。既存研究を見る限りでは、抗炎症・抗浮腫方向の性質が示されており、この点は、むくみ感や重だるさ、組織の鬱滞感の緩和を考えるうえで手がかりになります。\n\nただし、ここからそのまま「リンパを直接流す精油」「排液を直接促進する精油」とは言えません。現時点で、主要成分そのものにリンパ流を直接高める作用が明確に示されているわけではないからです。\n\nつまりアトラスシダー精油は、炎症性の停滞に補助的に関わり、結果として軽さにつながる可能性のある、間接的なドレナージ様作用をもつ精油と捉える方が、実態に近いように思います。こう考えると、単独で万能視するより、むくみや鬱滞感への手技と組み合わせて生かしやすい精油、と位置づけるのが妥当でしょう。", "permalink": "https://www.threads.com/@natigron0/post/DWUyqnak27m", "likes": 10, "velocity": 0.0, "ageHours": 4007.5, "postedAt": "2026-03-26T07:52:54+09:00", "genres": ["リンパ"], "keywords": ["リンパ 手技"], "mods": ["手技"]}, {"id": "3851920030859205325", "username": "mimii___room", "text": "ブティックでの高揚感か、二次流通の合理性か。ブシュロンのリズレ。一生モノのジュエリーを巡る、\"リアルな葛藤\"", "permalink": "https://www.threads.com/@mimii___room/post/DV0xNwWkxrN", "likes": 10, "velocity": 0.0, "ageHours": 4306.0, "postedAt": "2026-03-13T21:24:32+09:00", "genres": ["パーマネントジュエリー"], "keywords": ["パーマネントジュエリー 経営"], "mods": []}, {"id": "3978572189402708423", "username": "oteteya", "text": "リンパマッサージというのが流行ってると聞きます。\n\nアロマトリートメントは\n全部リンパの流れ促進します。\n\nリンパマッサージと謳うのは\n優しいマッサージが多いです。\nリンパ液は\n表層を流れてるので。\n\nリンパマッサージと言われてなくても\nオイルマッサージはどれも\nリンパ流しますよ。", "permalink": "https://www.threads.com/@oteteya/post/Dc2ulOumLnH", "likes": 10, "velocity": 0.09, "ageHours": 112.1, "postedAt": "2026-09-04T15:19:45+09:00", "genres": ["リンパ"], "keywords": ["リンパ"], "mods": ["メニュー"]}, {"id": "3889673439859007535", "username": "molek_lymph", "text": "志摩市で自律神経を整える\n・リンパマッサージ\n・筋膜リリース整体\n・ヘッドスパ\nを経営しています。\n\n本日も嬉しいお客様の変化♪\n四十肩で上がらなかった腕が…", "permalink": "https://www.threads.com/@molek_lymph/post/DX65WKbEWAv", "likes": 10, "velocity": 0.0, "ageHours": 3055.9, "postedAt": "2026-05-04T23:33:49+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ 経営"], "mods": ["経営", "手技"]}, {"id": "3885103313285414250", "username": "em.mo.t.r", "text": "アートメイク看護師を取得するか悩んでいます。\n実際何か補助や助成金、開業してから新たに資格をと思えば個人事業主でも何か受けられる制度はありますでしょうか⁉️\n\nご存知の方、またおススメのアートメイクスクールなど教えて頂けると助かります💕🙏", "permalink": "https://www.threads.com/@em.mo.t.r/post/DXqqOEYEf1q", "likes": 10, "velocity": 0.0, "ageHours": 3207.2, "postedAt": "2026-04-28T16:13:47+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク スクール"], "mods": ["経営", "スクール"]}, {"id": "3909262277195317636", "username": "nami_be.you", "text text": "本日開業届を提出してきました！\n4/3という日にご縁があるみたいで\n再スタートとしてまた新たな気持ちで\n突き進んで行きます🏃‍♀️\n\nおととしの11月にドライヘッドスパの施術に魅了され手技を習得し、それから自宅サロンをOpenしてずっとドライヘッドスパ愛を胸に抱きコツコツやってまいりました。\n\nとにかく、ヘッドマッサージが大好きなので\nそんなヘッドスパマニアな私の施術を一度\nご体感していただきたいです💆‍♀️🫧🫧\n\nピンとインスピレーションを持っていただい方は、ぜひご予約をお待ちしております🌳❤️\n@dryheadspa_oasis \n\n#ドライヘッドスパ\n#諫早", "permalink": "https://www.threads.com/@dryheadspa_oasis/post/DWqK_8Kge6k", "likes": 4, "velocity": 0.0, "ageHours": 3808.3, "postedAt": "2026-04-03T15:09:35+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ 手技"], "mods": ["経営", "手技"]}, {"id": "3869100553708786457", "username": "milkmoyashi_936", "text": "抜毛症だった方に聞きたいんですけど、\nどうやって治しましたか？一度はじめるとなかなか治らなくなりませんか？", "permalink": "https://www.threads.com/@milkmoyashi_936/post/DWxznRIFFMZ", "likes": 4, "velocity": 0.0, "ageHours": 3737.1, "postedAt": "2026-04-06T14:19:09+09:00", "genres": ["育毛"], "keywords": ["育毛"], "mods": []}, {"id": "3963244240272569592", "username": "mizuking_artmake", "text": "眉アートメイクの相場はいくら？", "permalink": "https://www.threads.com/@mizuking_artmake/post/DcARaNrjzT4", "likes": 4, "velocity": 0.01, "ageHours": 619.7, "postedAt": "2026-08-14T11:45:51+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク"], "mods": []}, {"id": "3981375286940338268", "username": "dryheadspa_gyp", "text": "スクールに通ってドライヘッドスパの\n講師資格までとったけど\n私の技術面は独学な部分が多い。\n正直スクールで習ったものは物足りなくて\n値段とも見合ってないなぁと感じていました。\n開業して約一年。たくさんの方に触れて\n「どこで習ったの？」「教えてほしい」\n「他のお店も行ったけどやっぱりここがいい！」\nと言ってもらえる事が増えました。\n1年前は子どもたちの先生だった私ですが\n次は頭をゆるめる先生になる。\n技術も想いもひろめていけたらいいな✨", "permalink": "https://www.threads.com/@dryheadspa_gyp/post/DdAr7qvmQhc", "likes": 4, "velocity": 0.21, "ageHours": 19.3, "postedAt": "2026-09-08T12:09:01+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ 高単価"], "mods": ["経営", "スクール"]}, {"id": "3981395997968238510", "username": "asian_sanook", "text": "セラピストの仕事はなくならないとよく聞きますがそんなことはないと思ってます。\nマッサージ機はどんどん進化して安くていいものが買えるようになってきました。現に私もハンドマッサージャーを持っていて親指が痛い時など毎日使ってました。\n\n目の前の集客はもちろんですが今後もっと必要になってくるのは『この人に会いたい』『この人でないとほぐれない』と思ってもらえる人柄、ホスピタリティ、技術だと思 rmalink": "https://www.threads.com/@mi_to.2025/post/Dcv9TNIE78w", "likes": 3, "velocity": 0.02, "ageHours": 175.2, "postedAt": "2026-09-02T00:13:41+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書"], "mods": []}, {"id": "3959835274985524157", "username": "kazumi_counseling", "text": "「あっ、この人、リピーターが多いな」と思うエステティシャンは、アドバイスの仕方が違います。\n\n例えば、「冷たいものを控えてください」と言いたい時。\n\n売れているエステティシャンは、そのまま言いません。", "permalink": "https://www.threads.com/@kazumi_counseling/post/Db0KTPWksu9", "likes": 3, "velocity": 0.0, "ageHours": 732.5, "postedAt": "2026-08-09T18:52:51+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン 手技"], "mods": []}, {"id": "3978089089903201147", "username": "kogao.salon_you.osaka", "text": "箕面で大人の小顔専門サロンしています。\n100種類以上の手技を習った私はその日のお客様に合う施術を組み立てながら行います。\n一人一人の悩みも違えばお肌状態も違うから。", "permalink": "https://www.threads.com/@kogao.salon_you.osaka/post/Dc1AvNQiYt7", "likes": 3, "velocity": 0.02, "ageHours": 128.1, "postedAt": "2026-09-03T23:19:55+09:00", "genres": ["小顔"], "keywords": ["小顔 手技"], "mods": ["手技"]}, {"id": "3851520479648190372", "username": "eri_therapist313", "text": "「小顔になりたいから、骨をグイグイ押してください」\n\nセラピストを17年やってきて\n一番多く聞く言葉です。\nでも、はっきり言います。\n成人の頭蓋骨は、手技で動くことはありません。\n\n骨を無理に押すよりも\n食いしばりで硬くなった「咬筋」を緩める方が\n何倍も早くフェイスラインは変わります。\n\n「骨格矯正」という言葉に惑わされず\n筋肉と筋膜のバランスを整えること☝🏼\n\nこれが「本来のあなた」の美しさを\n引き出す最短ルートです🫶🏼\n\n五次元整顔は、5つの次元を整えます👶🏻", "permalink": "https://www.threads.com/@eri_therapist313/post/DVzWXhSko-k", "likes": 3, "velocity": 0.0, "ageHours": 4319.3, "postedAt": "2026-03-13T08:10:41+09:00", "genres": ["小顔"], "keywords": ["小顔 手技"], "mods": ["手技"]}, {"id": "3868636632857837388", "username": "u__pa_ru_pa__", "text": "炎上覚悟で言うけど、まつ毛美容液って高ければいいと思ってる人ほど損してる。2ヶ月前までスカスカだったのに、ラッシュアディクトもエマーキットも使わずここまで伸びた。しかもプロスタグランジン類似体なし＝色素沈着の心配なし。理由はキャピキシル10%の育毛剤レベルの成分入ってる。", "permalink": "https://www.threads.com/@u__pa_ru_pa__/post/DWwKIVKjf9M", "likes": 3, "velocity": 0.0, "ageHours": 3752.5, "postedAt": "2026-04-05T22:57:26+09:00", "genres": ["育毛"], "keywords": ["育毛"], "mods": []}, {"id": "3959930406615077070", "username": "daisukedekakin", "text": "久しぶりの投稿です！\n最近、いろいろ環境が変わり、自分自身は仕事を変え、\n奥さんは自宅に鍼灸院を開院する運びとなりました。\n\n下記、院のPRです。\n\namicahari 施術所を開設いたしました。\n京成津田沼駅より徒歩10分です。\n民家になりますので、ご予約の際に詳しい住所をお伝えいたします。\n施術所が二階になります。\n階段の昇り降りが難しい方は、これまでのように出張鍼灸をご利用ください。\n「鍼灸治療は受けたいけれど、家に人を呼ぶのは抵抗がある』そんな時にご利用いただければ幸いです。\n施術所も女性専用になります。\n男性は患者様の紹介のみ受け付けております。\n女性専用出張鍼灸amicaと合わせて\n鍼灸院 amicaもよろしくお願いいたします。\nレディース専門出張鍼灸\namica\n■10時～20時（不定休）\nロ千葉・東京・神奈川を中心に全国出張\nロ女性専門で出張鍼灸治療いたします\nロご予約、お問い合わせ\nDM、公式LINE、ホームページよりお待ちしております\nロメニュー\n・鍼灸治療\n・美容鍼灸\n• 美容鍼＋鍼灸治療\n\n#amica #鍼灸 #美容鍼 #千葉鍼灸 #美容", "permalink": "https://www.threads.com/@daisukedekakin/post/Db0f7llj1DO", "likes": 3, "velocity": 0.0, "ageHours": 729.4, "postedAt": "2026-08-09T22:01:52+09:00", "genres": ["鍼灸"], "keywords": ["鍼灸 メニュー"], "mods": ["メニュー"]}, {"id": "3880115138209122610", "username": "ayumi12107", "text": "えー今回のネイルは\nこうなりましたぁ〜❤️\n短くなったよー！！！\n初めての時もめっちゃ楽しかったけど\n2回目も笑ってばっかで\n本当にサロンに行くのが楽しくて仕方ない！\nパーマネントジュエリーもしたの💎\nしかもお姉さんとお揃いの💍\nちょー可愛い！私のむちむち手には\nよくみえないかもだけど\nお姉さんのほっそい指にはめちゃんこ\n可愛いんですよ！\nまた来月も楽しみで仕方ない！！", "permalink": "https://www.threads.com/@ayumi12107/post/DXY8CkUkgky", "likes": 3, "velocity": 0.0, "ageHours": 3372.4, "postedAt": "2026-04-21T19:03:10+09:00", "genres": ["パーマネントジュエリー"], "keywords": ["パーマネントジュエリー 高単価"], "mods": []}, {"id": "3904592364404946896", "username": "stella.no.kodomo", "text": "山形県庄内の小さな町の小さなお家で\nママも子どももペットもばっちこいな\nヒーリングサロンを作っております。\n\n｢(圧してないのに)なんで？！！！｣\nって言われる方がほとんどです。\n\n圧してないのに揉んでないのに、\n何で体が動きやすくなったの？\nって。\n\n白状します…\nそれはねー、\n実はレイキヒーリング“だけ”やってるんじゃないんです。\n\nレイキヒーリングをぶん回しながら、\n手当ての手技でリンパやファシア(筋膜)に働きかけてるから\n圧しても揉んでも擦ってもないのに\nこんなに体がゆるむの。\n\n一応ね、やることやってるの。\nただしゃべってるだけじゃないの(笑)\n\nレイキヒーリングだけでも十分に体はゆるむし\n手当てだけでも十分に体はゆるむんだけど、\nレイキヒーリングと手当てを掛け合わせることでお互いの効果にバフがかかるようになってるよ。\nそいで、持ちも良いって噂。\nレイキで取り入れるエネルギーは\nメイドイン地球の自然のエネルギーだから体になーんにも悪くないし、\nこんなに良いとこづくめな\nレイキヒーリング、受けて損はないでしょーよー", "permalink": "https://www.threads.com/@stella.no.kodomo/post/DYv5hFpDzfQ", "likes": 3, "velocity": 0.0, "ageHours": 2561.8, "postedAt": "2026-05-25T13:35:03+09:00", "genres": ["リンパ"], "keywords": ["リンパ 手技"], "mods": ["手技"]}, {"id": "3971230905864033074", "username": "treatment_school", "text": "セラピストさんが今日から出来ること！\n\nベッド・タオル・手・室温など清潔感と快適さを再度確認する！", "permalink": "https://www.threads.com/@treatment_school/post/DccpXfpFBMy", "likes": 3, "velocity": 0.01, "ageHours": 355.2, "postedAt": "2026-08-25T12:13:56+09:00", "genres": ["リンパ"], "keywords": ["リンパ"], "mods": []}, {"id": "3976422299297696203", "username": "bright.hari.ikumou.diet", "text": "【抜け毛のお悩み、一緒に解決していきましょう】\n\n育毛鍼🪡に興味をもっていただき、2週間に一度の施術を継続中、\n生え際はまだまだこれから、といった感じでは\nありますが、\nシャンプー時の抜け毛が以前程気にならなくなってきたと\n嬉しい感想。\n\n頭頂部のつむじ周囲の地肌も\n確実に目立ちにくくなってきています。\n\n頭皮や首のコリを\n鍼とマッサージで丁寧にほぐしていくので、\n慢性的に悩まれていた\n頭痛😣も変化が。\n\nこの調子で色んな不調\nしっかり取り除いていきましょう✊️✊️\n\n＃育毛鍼\n＃抜け毛対策\n＃早めにスタート", "permalink": "https://www.threads.com/@bright.hari.ikumou.diet/post/DcvFwNilMnL", "likes": 3, "velocity": 0.02, "ageHours": 183.3, "postedAt": "2026-09-01T16:08:19+09:00", "genres": ["育毛"], "keywords": ["育毛 手技"], "mods": ["手技"]}, {"id": "3979856797283505228", "username": "nati_feliz_", "text": "眉アートメイクした後って、自分の毛はどうするの？カットしたり抜くだけでいいイメージですか？", "permalink": "https://www.threads.com/@nati_feliz_/post/Dc7SqvDAdRM", "likes": 3, "velocity": 0.04, "ageHours": 69.6, "postedAt": "2026-09-06T09:52:03+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク 高単価"], "mods": []}, {"id": "3970817821589334213", "username": "seido_net", "text": "【整動鍼を１日でサクッと学ぶセミナー】\n\nお申込み受付開始しました！\n\n◎日時：9月27日（日）11:00〜17:30\n◎定員：16名（会場）\n◎料金：一般43,000／会員38000\n\nオンライン同時開催です。\n\n申し込みURL\n会場 https://seidonet.or.jp/seminars/260927_seido_beginner/\nオンライン https://seidonet.or.jp/semi.../260927_seido_beginner_online/", "permalink": "https://www.threads.com/@seido_net/post/DcbLcU7n2jF", "likes": 3, "velocity": 0.01, "ageHours": 368.9, "postedAt": "2026-08-24T22:33:13+09:00", "genres": ["鍼灸"], "keywords": ["鍼灸 手技"], "mods": []}, {"id": "3980181170687682285", "username": "rouka_taisaku43", "text": "43歳。\n薄毛が気になり始めた。\n\nAGAって言葉は知ってるけど、 : 1, "velocity": 0.0, "ageHours": 2352.1, "postedAt": "2026-06-03T07:19:53+09:00", "genres": ["美容サロン"], "keywords": ["美容サロン 高単価"], "mods": ["メニュー", "高単価", "スクール", "手技"]}, {"id": "3977621812838328715", "username": "takeshi_pilates", "text": "ピラティスの創設者\nジョセフ・ピラティス氏が本当にこだわったのは、「吸う」ことより「吐く」ことだった。", "permalink": "https://www.threads.com/@takeshi_pilates/post/DczWfblEumL", "likes": 1, "velocity": 0.01, "ageHours": 143.6, "postedAt": "2026-09-03T07:51:32+09:00", "genres": ["ピラティス"], "keywords": ["ピラティス 経営"], "mods": []}, {"id": "3977596283509709982", "username": "drop_kobe.tarumi.salon", "text": "おはようございます。\n1年が早い・・・気が付けは9月も3日目。ちょっと息ついている間にどんどん時間が過ぎていく。私だけでしょうか。秋に向けて、【更年期女性】のための講座を開講予定です。\n薬剤師の知識と、サロンでお伝えしている養生の知恵をギュッと詰め込んで、皆さんの「ゆらぎ」を全力でサポートする内容を絶賛構築中です。\n「こんなこと知りたい！」というリクエストがあれば、ぜひリプライで教えてください！\n病院にいって対策するものもちろん大賛成ですが、病院に行くほどになる前に自分でケアできる女性を増やしたい・・・そんな願いがあります。", "permalink": "https://www.threads.com/@drop_kobe.tarumi.salon/post/DczQr7igpye", "likes": 1, "velocity": 0.01, "ageHours": 144.4, "postedAt": "2026-09-03T07:00:48+09:00", "genres": ["更年期ケア"], "keywords": ["更年期ケア メニュー"], "mods": ["スクール"]}, {"id": "3977578443768587753", "username": "ikumounogakkou", "text": "育毛・ヘッドスパを導入したサロンの投稿を見ていると、なぜか「効果が出ました」しか出てきません。\n\nうまくいった話しか、表に出てこない業界だなと、ずっと思っていました。\n\n美容師歴33年、今も現場に立ちながら、こういうメニュー導入のお手伝いもしています。\n\nなので今日は、営業トークじゃなくて、都合の悪い話から始めます。\n\n・機器を入れただけでは売れない話\n・売上より先に伝えていること\n・それでも導入する意味があるとしたら何か\n\nこの3つを、正直に話します。", "permalink": "https://www.threads.com/@ikumounogakkou/post/DczMoU_E-Xp", "likes": 1, "velocity": 0.01, "ageHours": 145.0, "postedAt": "2026-09-03T06:25:32+09:00", "genres": ["育毛"], "keywords": ["育毛 メニュー"], "mods": ["経営", "メニュー"]}, {"id": "3976303252711145460", "username": "mieruka_nori", "text": ".\n「単価を上げる」\nそう聞くと...\n\n「値上げする？」\n「高単価メニューを作る？」\n「価値をもっと伝える？」\n\nそんな方法を思い浮かべるかもしれません\nでも私は、どれもちょっと苦手です😅\n\n値上げするのも怖い\n上手に価値を伝えて納得してもらうのも大変\n\nましてや\n強いクロージングなんてできればしたくない🤣\n\nだったら...\n\n値上げしない\n売り込まない\n\nそれでも単価が上がる「仕組み」を考えた方が\n施術する側も受ける側も自然なんじゃないか...\n\n私はそんな方向から\n施術院の単価やLTVを考えています ​水音に包まれる圧倒的な没入感：目を閉じると耳元に流れるせせらぎの音だけで、日々の雑念がスーッと消えて「無」になれる時間。 ​施術後はそのまま爆睡確定：深く癒された後はご自宅のお布団へダイブできます。 ​「自分の時間なんて贅沢…」なんて思わないでください。 たった数分、頭と心を空っぽにするだけで、明日からの笑顔と軽やかさが戻ってきます。 ​今夜は、あなた自身を一番に癒してあげませんか？ 🌿 ​最近「頭が休まっていないな」と感じる方は、ぜひ保存して見返してみてくださいね。", "permalink": "https://www.threads.com/@ohana_to_nukumori/post/Dcw1UhSk_rP", "likes": 1, "velocity": 0.01, "ageHours": 167.0, "postedAt": "2026-09-02T08:24:56+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ 手技"], "mods": ["手技"]}, {"id": "3978118385246664250", "username": "te54499", "text": "せっかく小顔で鼻も高くて肌も綺麗で髪もサラサラ、手足の長い美女に産んでもらったのに若くしてしょうもない男と結婚してしまった自分が憎い。", "permalink": "https://www.threads.com/@te54499/post/Dc1HZgrE_Y6", "likes": 1, "velocity": 0.01, "ageHours": 127.1, "postedAt": "2026-09-04T00:18:08+09:00", "genres": ["小顔"], "keywords": ["小顔 高単価"], "mods": []}, {"id": "3918587327954409340", "username": "tukawanaidayon", "text": "小顔矯正は詐欺に近い。元美容ナースとして言う。骨格は手で動かせない。月2万円払って変わっているのは骨じゃない。じゃあ何が変わっているかというと、、、", "permalink": "https://www.threads.com/@tukawanaidayon/post/DZhnmnIEdd8", "likes": 1, "velocity": 0.0, "ageHours": 2098.4, "postedAt": "2026-06-13T21:00:33+09:00", "genres": ["小顔"], "keywords": ["小顔 高単価"], "mods": ["高単価"]}, {"id": "3978539086612379155", "username": "maki_therapist", "text": "秋のサロンのテーマは\n\n・深眠\n・自律神経\n・深呼吸 \n\n🧘‍♀️\n\n✅なかなか寝付けない\n✅朝起きてもなんかだるい\n✅夏の疲れを引きずっている\n\nそんな方はぜひ👌", "permalink": "https://www.threads.com/@maki_therapist/post/Dc2nDhWibYT", "likes": 1, "velocity": 0.01, "ageHours": 113.2, "postedAt": "2026-09-04T14:13:59+09:00", "genres": ["セラピスト"], "keywords": ["セラピスト"], "mods": []}, {"id": "3977013734179126468", "username": "efu.ikumou", "text": "今日の育毛鍼のお客様とのやり取り。\n\n「髪が増えたんですけど、増えたからこそ、まだ満足できていないところが気になってしょうがないです。」\n\nそんなお話をしてくださいました。\n\nこれ、すごくよく分かります。", "permalink": "https://www.threads.com/@efu.ikumou/post/DcxMOuMmLzE", "likes": 1, "velocity": 0.01, "ageHours": 163.7, "postedAt": "2026-09-02T11:43:23+09:00", "genres": ["育毛"], "keywords": ["育毛 手技"], "mods": []}, {"id": "3977067338281839510", "username": "efu.ikumou", "text": "【育毛鍼を受けてくださっている方の変化】\n生えてくる髪の毛が元気になって前より髪の毛が立ち上がってる", "permalink": "https://www.threads.com/@efu.ikumou/post/DcxYaw6GOuW", "likes": 1, "velocity": 0.01, "ageHours": 161.9, "postedAt": "2026-09-02T13:29:53+09:00", "genres": ["育毛"], "keywords": ["育毛 手技"], "mods": []}, {"id": "3977762756207149620", "username": "motoyuca_support88", "text": "個人クライアントの秘書が消耗する、本当の理由。\n19時、5分目を離しただけなのに、\nLINEの未読が3→12→43…とどんどん増えていく。\n\n個人クライアントのオンライン秘書時代、\n土日も夜も関係ないのが日常だった。\n「単価が低いから仕方ない」って、\nあの頃は視野が狭かったな。\n\n契約の相手を「企業」に変えるだけでよかったのに。", "permalink": "https://www.threads.com/@motoyuca_support88/post/Dcz2ibUgYI0", "likes": 1, "velocity": 0.01, "ageHours": 138.9, "postedAt": "2026-09-03T12:31:33+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書"], "mods": []}, {"id": "3979051404480401190", "username": "ikumounogakkou", "text": "「頭皮がスッキリして、体まで軽くなった」\n\nこれ、お客様が書いてくれた感想なんです。\n\nヘッドスパのあと、こういう言葉をいただくことがよくあります。「髪がサラサラになった」だけじゃなくて、「体が軽い」「翌朝のスタイリングが楽だった」って、髪より先に体の変化を口にされる方、実は結構多いんですよね。\n\n頭皮って顔や首とつながっているので、そこがこり固まっていると全身の巡りにも影響が出やすいんです。逆に言うと、頭皮の状態を整えることは、見た目のツヤ感だけじゃなく「軽さ」という体感の満足にもつながる。\n\nうちではこの変化を、マイクロスコープで頭皮の状態を見ながらお客様と一緒に確認しています。「なんとなく良くなった気がする」で終わらせず、「ここがこう変わってきていますね」と見て伝えられると、お客様の納得感も、次回の来店動機も全然違ってくるんですよね。\n\nサロン経営の話をすると、こういう\"言葉にできる変化\"を提供できるメニューって、実は単価アップの相談を受けるときによく出てくるテーマなんです。カットやカラーだけだと、どうしても価格の説明で終わってしまう。でも「体まで軽くなった」なんて感想が出るメ…", "permalink": "https://www.threads.com/@ikumounogakkou/post/Dc4biujEs8m", "likes": 1, "velocity": 0.01, "ageHours": 96.2, "postedAt": "2026-09-05T07:12:11+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ 経営"], "mods": ["経営", "メニュー", "単価UP"]}, {"id": "3978171746976121839", "username": "kobebaysidebusinesslink", "text": "ヘッドスパ専門店muladhara spa(ムーラ・アダーラ スパ)を経営されている\n永峰麻里さん。\n頑張ることや我慢が当たり前になっている方へ。\n“整うと、日常が変わる”\nその場だけのリラクゼーションではなく\n整った状態が日常に続くことが大切だとおっしゃってます。\n是非ご覧くださいませ!!\n↓↓↓↓↓↓\nhttps://youtu.be/bHqBMT83_2k\n↑↑↑↑↑↑\n\n撮影は永峰麻里さんのお店「muladhara spa」にて行なってます。\nhttps://www.instagram.com/muladhara.spa.kobe/", "permalink": "https://www.threads.com/@ko ords": ["パーマネントジュエリー スクール"], "mods": []}, {"id": "3963852921384274130", "username": "tetsuhirokawano", "text": "美容室の売上を増やす方法は、\n新規客を増やすことだけじゃない。\n\n今いるお客様に、\n「髪＋目元」という新しい提案ができたらどうでしょう？\n\n今回、ご紹介するのは、\n約30分で提供できる、新しいまつ毛カールメニュー。\n\nヘアメニューとの組み合わせはもちろん、\nマツエク・アイラッシュサロンの新メニューとしても\n導入できます。\n\nそして、すでに直営店では、\n\n月間利用者 約250〜300名\n月間売上 約120万円\n\nという実績。\n\nしかも、15時までの営業・日曜定休です。\n\n新規集客だけに頼るのではなく、\n既存のお客様に新しい来店理由をつくり、\n客単価・来店機会・売上を増やしていく。\n\n「うちのサロンでもできる？」\nと思った美容室・マツエクサロン経営者の方は、\nご相談ください。\n\n導入店舗を募集しています。\n\nhttps://unite.alfa-sync.net/sakura/", "permalink": "https://www.threads.com/@tetsuhirokawano/post/DcCbzsJAQjS", "likes": 1, "velocity": 0.0, "ageHours": 599.5, "postedAt": "2026-08-15T07:55:12+09:00", "genres": ["美容サロン"], "keywords": ["美容サロン 単価UP"], "mods": ["経営", "メニュー", "高単価"]}, {"id": "3978597995680662721", "username": "warmal_facial", "text": "セルフケアは 「自分が努力して綺麗になる時間」\nサロンは 「自分を休ませながら綺麗になる時間」\n\n身も心も癒される場所でありつづけたいですね😌💕", "permalink": "https://www.threads.com/@warmal_facial/post/Dc20cwsoITB", "likes": 1, "velocity": 0.01, "ageHours": 111.2, "postedAt": "2026-09-04T16:11:02+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ"], "mods": []}, {"id": "3980918229019018068", "username": "efu.ikumou", "text": "【育毛が上手くいく人の共通点】\n\n育毛鍼を受けていて増毛実感される方には、\n共通点があります。\n\nそれは、", "permalink": "https://www.threads.com/@efu.ikumou/post/Dc_EAmYjkNU", "likes": 1, "velocity": 0.03, "ageHours": 34.4, "postedAt": "2026-09-07T21:00:55+09:00", "genres": ["育毛"], "keywords": ["育毛 手技", "育毛"], "mods": []}, {"id": "3950145275294148147", "username": "kaishinkyuuseikotuin", "text": "🌿【小顔矯正で本当に顔は小さくなる？医学的根拠から解説】\n\n「頭蓋骨を動かして小顔にする」「骨盤を締めると顔まで小さくなる」といった説明を耳にすることがあります。しかし、成人の頭蓋骨や骨盤を手の力で動かしたり変形させたりすることは、現在の解剖学では考えにくいとされています。\n\nでは、小顔矯正は意味がないのでしょうか？\n\n答えは**「いいえ」**です。\n\n小顔に見える主な理由は、骨ではなく**筋肉・むくみ・関節の位置関係（アライメント）**の変化です。\n\n✅ 咬筋・側頭筋・表情筋の緊張が和らぐ\n✅ むくみが軽減しフェイスラインがすっきりする\n✅ 顎関節や首・姿勢のバランスが整う\n✅ 血流が改善し顔色や輪郭が引き締まって見える\n\n🤲手技は筋肉やリンパへ優しくアプローチし、リラックス効果が期待できます。一方で、強い圧で骨を小さくすることはできず、過度な刺激は痛みや内出血の原因になることがあります。\n\n🪡美容鍼は表情筋や筋膜へ直接刺激を与え、筋緊張や血流改善を促します。むくみやフェイスラインの変化を感じる方もいますが、永久的に小顔になるという十分な科学的根拠はありません。", "permalink": "https://www.threads.com/@kaishinkyuuseikotuin/post/DbRvDL5GGYz", "likes": 1, "velocity": 0.0, "ageHours": 1053.4, "postedAt": "2026-07-27T10:00:33+09:00", "genres": ["小顔"], "keywords": ["小顔 手技"], "mods": ["手技"]}, {"id": "3980953639942641095", "username": "_261509.u_", "text": "来年にウェディングフォトと\n結婚式やりたいなと思ってて\n本格的にダイエット頑張りたいのですが、\nジムとピラティスどっちが痩せますかーーー？！\n産後、体重が戻らないまま\n9ヶ月が過ぎました！！！！！🐷", "permalink": "https://www.threads.com/@_261509.u_/post/Dc_MD5YFFXH", "likes": 1, "velocity": 0.03, "ageHours": 33.2, "postedAt": "2026-09-07T22:11:16+09:00", "genres": ["ピラティス"], "keywords": ["ピラティス"], "mods": []}, {"id": "3978541971505674837", "username": "motoschan_biyou_numa", "text": "元エステティシャンだから、正直に言う。\n\n高い美容液じゃなくても、\n成分さえ合ってればプチプラで十分。\n\n私のおすすめは、", "permalink": "https://www.threads.com/@motoschan_biyou_numa/post/Dc2ntgHk_pV", "likes": 1, "velocity": 0.01, "ageHours": 113.1, "postedAt": "2026-09-04T14:19:43+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン 高単価"], "mods": []}, {"id": "3978108659209732804", "username": "dryheadspa_nature", "text": "「美容室でヘッドスパを受けたことはあるけど、ドライヘッドスパはやったことがない」\nそんな声をよくいただきます。\n\nドライヘッドスパは…", "permalink": "https://www.threads.com/@dryheadspa_nature/post/Dc1FL-mGgLE", "likes": 1, "velocity": 0.01, "ageHours": 127.5, "postedAt": "2026-09-03T23:58:48+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ 経営", "ヘッドスパ メニュー", "ヘッドスパ 高単価"], "mods": []}, {"id": "3889268156360778388", "username": "asai.k_artmake", "text": "🩶アートメイクメニュー🩶改訂\n4月末で、クーポンの配布は終了しましたがお得な割引メニューを追加いたしました☺️\n2部位同日施術、もしくは2部位同時ご予約にて初回¥11000off、ご家族やご友人、職場の方にご紹介で、ご紹介者・被紹介者どちらも初回¥5500off✨\n\nメニューについて、ご不明な点がございましたらご遠慮なくLINEか DMよりメッセージお願いいたします🙇‍♀️\n\n#アートメイク熊本 #メラニンケア#眉アートメイク熊本#アマラピンク熊本", "permalink": "https://www.threads.com/@asai.k_artmake/post/DX5dMgwH2KU", "likes": 1, "velocity": 0.0, "ageHours": 3069.3, "postedAt": "2026-05-04T10:08:35+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク メニュー"], "mods": ["メニュー  "mods": ["手技"]}, {"id": "3890927925189631895", "username": "codethefuture", "text": "小顔サロンを経営するエンジニア出身の経営者が、毎日ここで書いていること。\n\nAIとスタッフと売上と、自分の顔のことを同時に考えている。\n採用で失敗した話も、補助金を通した話も、価格を上げた月の数字も、そのまま書いている。\n\n教科書じゃなく、自分の現場の話だ。", "permalink": "https://www.threads.com/@codethefuture/post/DX_WlU7k1-X", "likes": 0, "velocity": 0.0, "ageHours": 3014.3, "postedAt": "2026-05-06T17:06:23+09:00", "genres": ["小顔"], "keywords": ["小顔 経営"], "mods": ["経営"]}, {"id": "3978458128635395655", "username": "antian.asa", "text": "実は、顔が痩せている方のエラボトックスは、基本的にお断りすることが多いです\nカウンセリングで「小顔になりたい」と言われても、全員に打つわけではありません\n\n打って本当に輪郭が綺麗になるのは、この3つの条件が揃っている方だけです👇\n1️⃣ 咬筋（筋肉）がしっかり発達している\n奥歯を噛みしめた時にカチッと硬い膨らみがある方。骨格や脂肪が原因の場合は、ボトックスでは変化が出にくいです。\n2️⃣ 頬がコケていない\nここが一番重要。元々お顔が痩せている方がエラを小さくすると、頬の凹みが強調されて逆に老けて見えてしまいます。\n3️⃣ 頬骨が張りすぎていない\n下顔面を縮めた時に、相対的に頬骨が目立ってゴツゴツしないバランスが大切です。\n私が診察で一番大切にしているのは、「筋肉の大きさ」ではなく「お顔全体のバランス」。\nただ減らす（小さくする）のではなく、あなたに一番似合う自然な輪郭を整えましょう 🤍", "permalink": "https://www.threads.com/@antian.asa/post/Dc2UpbXE_5H", "likes": 0, "velocity": 0.0, "ageHours": 115.9, "postedAt": "2026-09-04T11:33:08+09:00", "genres": ["小顔"], "keywords": ["小顔 経営"], "mods": []}, {"id": "3978459281498492282", "username": "comma_rinka", "text": "顔型・骨格・髪質はもちろん、\n身長や体型、ファッションの雰囲気までトータルで見ながら\n“あなたらしく可愛くなれる”似合わせをご提案します♡\n\n髪質や顔型に合わせて、\n丁寧に繊細にデザインカット✂️✨\n\n特にこだわっているのは顔まわり。\n前髪やサイドの毛流れまで細かくデザインして、\n自然に小顔に見えるスタイルに仕上げます🫧\n\n韓国っぽい顔まわりやレイヤーカットは\nちょっとしたカットの違いで印象が変わるからこそ、\n一人ひとりに合わせた質感・シルエットを大切にしています🤍\n\n「こんな雰囲気になりたい♡」\n「自分に似合うスタイルがわからない…」\nそんな方も大歓迎です☺️\n\nなりたいイメージを一緒に相談しながら、\nあなたに似合う可愛いを見つけていきましょう🌷\n\nInstagram → @comma_rinka\nリールでもスタイルを発信しています🎀\n\nぜひ可愛くなるお手伝いをさせてください♡\nご来店お待ちしています🫶🏻\n\n#大阪美容室 #透明感カラー #似合わせカラー #パーソナルカラー診断 #赤み消しカラー", "permalink": "https://www.threads.com/@comma_rinka/post/Dc2U6NDEs16", "likes": 0, "velocity": 0.0, "ageHours": 115.8, "postedAt": "2026-09-04T11:35:28+09:00", "genres": ["小顔"], "keywords": ["小顔 経営"], "mods": []}, {"id": "3924158423709631025", "username": "kamonohasi.aga", "text": "怖い話。\n育毛剤を1年続けた奴に\n言いにくいことを言う。", " こそ、まずは話して整理する。\n「自分にもできるのかな」 \n「何から始めたらいいのかな」\n\nその気持ちを、そのまま持ってきてください。RW相談室「はじめのいっぽ」は、 \n無理に背中を押す場所ではなく、一緒に考える場所です。", "permalink": "https://www.threads.com/@rw_first_step/post/DYLsgF4EZ4v", "likes": 0, "velocity": 0.0, "ageHours": 2899.3, "postedAt": "2026-05-11T12:08:40+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書"], "mods": ["スクール"]}, {"id": "3972226783370712810", "username": "kaori__therapist", "text": "知識×技術で、睡眠美容のセラピストへ\n\n「眠っているのに、なんだか疲れが取れない」\n\nそんな現代の頑張る人に寄り添う\n睡眠美容セラピストという新しい選択🌱\n\n美容だけでもなく\n癒しだけでもない\n\n睡眠の知識を学び、\n身体への確かな技術を身につけることで、\n\n「美しくなる」と「よく眠る」を\nひとつにつなげていきます。\n\n🌿 睡眠美容セラピスト講座 福岡開催\n\n✔︎ 睡眠についての基礎知識\n✔︎ 美容と睡眠の関係\n✔︎ 心身をゆるめるためのアプローチ\n✔︎ セラピストとして活かせる技術\n✔︎ お客様の「眠り」に寄り添うための知識と実践\n\nただ「気持ちいい」だけでは終わらない\n\n知識があるから、できること🌙\n技術があるから、届けられること💞\n\nあなたのセラピストとしての可能性を\nもう一歩広げてみませんか？\n\n「癒す」から\n「眠りを整え、美しさを引き出す」へ🌃\n\n✨睡眠美容セラピスト講座✨\n受講生募集いたします。\n\n再受講の方もぜひ☺️\n\n#睡眠美容セラピスト\n#睡眠美容\n#セラピスト講座\n#its福岡校", "permalink": "https://www.threads.com/@kaori__therapist/post/DcgLza2Gpbq", "likes": 0, "velocity": 0.0, "ageHours": 322.2, "postedAt": "2026-08-26T21:12:35+09:00", "genres": ["セラピスト"], "keywords": ["セラピスト"], "mods": ["スクール"]}, {"id": "3979026453982421008", "username": "yoko_beauty_labo", "text": "おはようございます。\n今日も皮膚について深める1日にしましょう！\n気になるエステティシャンはフォローしてね\n\nでは早速ですが、\nエステティシャンからの質問をいただきました。\n\n「化粧品が真皮にも浸透するというのは本当ですか?\n角層までじゃないの?」", "permalink": "https://www.threads.com/@yoko_beauty_labo/post/Dc4V3plgSAQ", "likes": 0, "velocity": 0.0, "ageHours": 97.1, "postedAt": "2026-09-05T06:22:18+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン 手技"], "mods": []}, {"id": "3979049126671366403", "username": "05_omisa", "text": "よもぎ蒸しとリンパの後はしばらくお肌の調子よき🩷", "permalink": "https://www.threads.com/@05_omisa/post/Dc4bBlLEzkD", "likes": 0, "velocity": 0.0, "ageHours": 96.3, "postedAt": "2026-09-05T07:07:21+09:00", "genres": ["リンパ"], "keywords": ["リンパ 手技", "リンパ"], "mods": []}, {"id": "3958090891542085247", "username": "en_houkan_kumamoto", "text": "🌿【学びを、安心につなげる。】\n\nえん訪問看護ステーション熊本では、\n に毛穴の詰まりや黒ずみが目立っていますが、施術後は毛穴まわりがすっきりし、肌表面もなめらかな印象に。\n\n韓国式3D毛穴洗浄は、普段のクレンジングや洗顔だけでは落としきれない毛穴汚れを丁寧にケアしていきます。\n\n「毛穴ケアは痛そう」\n「肌への負担が気になる」\n「初めてなので少し不安」\n\nそんな方にもおすすめの毛穴ケアです。\n\n毛穴汚れを無理に押し出したり、ゴシゴシこすったりするのではなく、サロンで定期的にケアすることで、清潔感のあるなめらかな肌を目指します。\n\nまた、毛穴は一度きれいにして終わりではありません。\n\n皮脂や古い角質などは日々蓄積するため、きれいな状態を保つには定期的なメンテナンスがおすすめです。\n\n「最近、鼻の毛穴が気になる」\n「ファンデーションを塗っても毛穴が目立つ」\n「自宅での毛穴ケアに限界を感じている」\n\nそんな方は、ぜひ一度韓国式3D毛穴洗浄をお試しください。", "permalink": "https://www.threads.com/@salon_de.cascade/post/DcfMrHmAcVM", "likes": 0, "velocity": 0.0, "ageHours": 331.4, "postedAt": "2026-08-26T12:00:56+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ"], "mods": []}, {"id": "3966428206407439117", "username": "yutaka_haircare", "text": "薄毛改善は、1つのマッサージだけで進んだわけではありません。\n\n私の場合、今は、\n\n・ブラッシング\u0026タッピング\n・毛根プッシュ洗い バージョン2\n・首上オールマッサージ\n\nこの3つを続けています。\n\n30年以上試してきた中で、下から上へ動かすだけではなく、上から下にも動かすこと。\n頭皮だけではなく、首から上を満遍なくマッサージすること。\nこれらこそが育毛にとって大事なんだということに気づきました。\n\n今回、その流れをトータルケア版としてnoteにまとめています。\n\nどこを、どの方向へ、どう動かすか。私が薄毛改善につながったと感じるポイントを、できるだけ具体的に書いています。\n\n※あくまでも私自身の体験に基づく内容です。\n\nhttps://note.com/yutaka_haircare/n/naa3e86f7153d", "permalink": "https://www.threads.com/@yutaka_haircare/post/DcLlXBOAVMN", "likes": 0, "velocity": 0.0, "ageHours": 514.2, "postedAt": "2026-08-18T21:11:50+09:00", "genres": ["育毛"], "keywords": ["育毛 手技"], "mods": []}, {"id": "3980948209920044826", "username": "mizu_artmake", "text": "アートメイクって消えないから怖い、\nって思ってる人も多いです。\n\nだから\n流行より「その人に似合う」を選びたい。", "permalink": "https://www.threads.com/@mizu_artmake/post/Dc_K04Rgu8a", "likes": 0, "velocity": 0.0, "ageHours": 33.4, "postedAt": "2026-09-07T22:00:29+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク"], "mods": []}, {"id": "3942540065965222938", "username": "aer_permanentjewelry", "text": "ネイリストが8月よりあたらしく\nパーマネントジュエリー始めます⛓️✨\n長崎 大阪 東京 出張可能です🙆🏻‍♀️ ̖́-‬\n是非これを機に留め具のないアクセサリー✨\nブレスレット リング トゥリング ピアス アンクレット…etc.\nご興味ある方是非ご連絡ください😊\nオープン価格もご用意しております！", "permalink": "https://www.threads.com/@aer_permanentjewelry/post/Da2t00wmiwa", "likes": 0, "velocity": <script>
(function () {
  var readJSON = function (id) { return JSON.parse(document.getElementById(id).textContent); };
  var POSTS = readJSON('data');
  var GENRES = readJSON('genre-list');
  var MODIFIERS = readJSON('modifier-list');
  var SUMMARY = readJSON('summary-data');
  var RISING = 0.59;   // 伸び率の上位10%にあたる値

  var activeGenres = new Set();
  var activeMods = new Set();   // 掛け合わせ語。ジャンルとはANDで効かせる
  var els = {
    sort: document.getElementById('sort'),
    period: document.getElementById('period'),
    q: document.getElementById('q'),
    genres: document.getElementById('genres'),
    modifiers: document.getElementById('modifiers'),
    list: document.getElementById('list'),
    count: document.getElementById('count'),
    summary: document.getElementById('summary'),
    breakdown: document.getElementById('breakdown')
  };

  function mk(tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  // 文節を1かたまりとして置く。途中で改行されないので、
  // 「を」「と」などの助詞が行頭に来ることがなくなる。
  function phrases(parent, list) {
    list.forEach(function (t) { parent.appendChild(mk('span', 'nb', t)); });
    return parent;
  }

  // --- 集計 ---
  // タイルは必ず4枚。ジャンルはここに混ぜず、下の棒グラフで見せる。
  (function renderSummary() {
    var tiles = [
      ['表示中の投稿', SUMMARY.total, '件'],
      ['直近7日の投稿', SUMMARY.thisWeek, '件'],
      ['1000いいね超え', SUMMARY.over1000, '件'],
      ['投稿者', SUMMARY.authors, '人']
    ];
    tiles.forEach(function (t) {
      var box = mk('div', 'stat');
      box.appendChild(mk('span', 'stat-label', t[0]));
      var v = mk('div', 'stat-value', t[1].toLocaleString());
      v.appendChild(mk('span', 'unit', t[2]));
      box.appendChild(v);
      els.summary.appendChild(box);
    });
  })();

  // --- ジャンル別の内訳 ---
  // 棒の長さは最多ジャンルを100%とした相対値。1つの投稿が複数ジャンルに
  // 入ることがあり、合計が総数と一致しないため、全体に対する割合としては見せない。
  (function renderBreakdown() {
    if (!SUMMARY.genres.length) { els.breakdown.remove(); return; }

    els.breakdown.appendChild(mk('p', 'breakdown-title', 'ジャンル別'));
    var max = SUMMARY.genres.reduce(function (m, p) { return Math.max(m, p[1]); }, 0);

    // 長いジャンル名は固定幅の列に1行では収まらない。
    // 「・」の位置だけで折り、カタカナ語の途中では絶対に割らない。
    function nameParts(name) {
      var parts = name.split('・');
      return parts.map(function (t, i) {
        // 「・」は前の語にくっつける。行頭に落とさないため
        return i < parts.length - 1 ? t + '・' : t;
      });
    }

    SUMMARY.genres.forEach(function (pair) {
      var row = mk('div', 'bar-row');
      if (pair[1] === 0) row.classList.add('pending');
      row.appendChild(phrases(mk('span', 'bar-name'), nameParts(pair[0])));

      var track = mk('div', 'bar-track');
      var fill = mk('div', 'bar-fill');
      fill.style.width = (max > 0 ? (pair[1] / max) * 100 : 0) + '%';
      track.appendChild(fill);
      row.appendChild(track);

      // 数字は出さない。棒の長さで強弱は足りる。
      // まだ集まっていないものだけ、空の棒の理由が分かるよう言葉を添える
      row.appendChild(mk('span', 'bar-count', pair[1] === 0 ? '収集待ち' : ''));
      els.breakdown.appendChild(row);
    });
  })();

  // 何件のうち何件を見ているのかを明示する。
  // 「最終収集」は実際に収集した時刻。HTMLを作り直しただけでは進まない。
  (function renderStamp() {
    var stamp = document.getElementById('stamp');
    var collectedAt = SUMMARY.updatedAt || '2026-09-09 07:25';
    var units = ['最終収集 ' + collectedAt];
    if (SUMMARY.archived > SUMMARY.total) {
      units.push('　/　蓄積 ' + SUMMARY.archived.toLocaleString() + ' 件のうち ');
      units.push(SUMMARY.total.toLocaleString() + ' 件を表示');
    }
    phrases(stamp, units);
  })();

  // --- 絞り込みのチップ（2段構え） ---
  // 上段: 主ジャンル。単独で検索して意味のある語。
  // 下段: 掛け合わせ語。「経営」「メニュー」のように単独だと飲食や一般ビジネスを
  //       拾ってしまう語で、本文に該当語があるかで絞る。
  // どちらも対象を全部並べる。今日まだ回っていないものを隠すと、
  // 扱う範囲が狭まったように見えるため。
  var chipStates = [];

  function makeChip(row, label, onActivate) {
    var b = mk('span', 'chip');
    b.appendChild(mk('span', 'chip-name', label));
    if (onActivate) {
      b.tabIndex = 0;
      b.setAttribute('role', 'button');
      b.addEventListener('click', onActivate);
      b.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onActivate(); }
      });
    } else {
      // 1件も無いので押しても何も起きない。操作対象から外す
      b.classList.add('pending');
      b.setAttribute('aria-disabled', 'true');
      b.title = '該当する投稿がまだありません';
    }
    row.appendChild(b);
    return b;
  }

  function syncChips() {
    chipStates.forEach(function (s) {
      var on = s.isOn();
      s.el.classList.toggle('on', on);
      s.el.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  // 選んだ集合を切り替えるチップを1つ作る。上段と下段で作りが同じなのでまとめる
  function addToggleChip(row, name, active) {
    var chip = makeChip(row, name, function () {
      if (active.has(name)) active.delete(name);
      else active.add(name);
      syncChips();
      render();
    });
    chipStates.push({ el: chip, isOn: function () { return active.has(name); } });
  }

  function addAllChip(row, active) {
    var chip = makeChip(row, 'すべて', function () {
      active.clear();
      syncChips();
      render();
    });
    chipStates.push({ el: chip, isOn: function () { return active.size === 0; } });
  }

  addAllChip(els.genres, activeGenres);
  GENRES.forEach(function (pair) {
    if (pair[1] === 0) { makeChip(els.genres, pair[0], null); return; }
    addToggleChip(els.genres, pair[0], activeGenres);
  });

  if (MODIFIERS.length === 0) {
    els.modifiers.remove();
  } else {
    addAllChip(els.modifiers, activeMods);
    MODIFIERS.forEach(function (pair) {
      if (pair[1] === 0) { makeChip(els.modifiers, pair[0], null); return; }
      addToggleChip(els.modifiers, pair[0], activeMods);
    });
  }

  syncChips();

  function fmtAge(h) {
    if (h === null || h === undefined) return '不明';
    if (h < 24) return Math.round(h) + '時間前';
    return Math.round(h / 24) + '日前';
  }

  function filtered() {
    var days = parseInt(els.period.value, 10);
    var q = els.q.value.trim().toLowerCase();

    return POSTS.filter(function (p) {
      if (days > 0) {
        if (p.ageHours === null || p.ageHours > days * 24) return false;
      }
      if (activeGenres.size > 0) {
        var hit = p.genres.some(function (g) { return activeGenres.has(g); });
        if (!hit) return false;
      }
      // 掛け合わせはジャンルとAND。「オンライン秘書」かつ「経営」を出すため。
      // 掛け合わせ語どうしはOR（複数選ぶと候補が広がる）
      if (activeMods.size > 0) {
        var mods = p.mods || [];
        var hitMod = mods.some(function (m) { return activeMods.has(m); });
        if (!hitMod) return false;
      }
      if (q) {
        var hay = (p.text + ' ' + p.username).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function sorted(rows) {
    var mode = els.sort.value;
    var copy = rows.slice();
    if (mode === 'likes') copy.sort(function (a, b) { return b.likes - a.likes; });
    else if (mode === 'newest') copy.sort(function (a, b) {
      var av = a.ageHours === null ? Infinity : a.ageHours;
      var bv = b.ageHours === null ? Infinity : b.ageHours;
      return av - bv;
    });
    else copy.sort(function (a, b) { return b.velocity - a.velocity; });
    return copy;
  }

  function render() {
    var rows = sorted(filtered());
    els.count.textContent = rows.length + ' 件を表示';
    els.list.textContent = '';

    if (rows.length === 0) {
      // 「絞り込みを」を1かたまりにして、「を」が行頭に来ないようにする
      els.list.appendChild(phrases(mk('div', 'empty'), [
        '条件に合う投稿が', 'ありません。', '絞り込みを', '緩めてください。'
      ]));
      return;
    }

    var frag = document.createDocumentFragment();
    rows.forEach(function (p, i) {
      var isRising = p.velocity >= RISING;
      var card = mk('div', 'card' + (isRising ? ' rising' : ''));

      var head = mk('div', 'card-head');
      head.appendChild(mk('span', 'rank', String(i + 1)));
      head.appendChild(mk('span', 'user', '@' + p.username));
      if (isRising) head.appendChild(mk('span', 'badge', '伸び中'));

      var stats = mk('div', 'stats');
      stats.appendChild(mk('span', 'likes', p.likes.toLocaleString() + ' likes'));
      stats.appendChild(mk('span', 'vel', p.velocity.toFixed(1) + '/h'));
      stats.appendChild(mk('span', 'age', fmtAge(p.ageHours)));
      head.appendChild(stats);
      card.appendChild(head);

      card.appendChild(mk('p', 'text', p.text));

      var tags = mk('div', 'tags');
      // 上下2段のチップと同じ「ジャンル＋掛け合わせ」を出す。
      // 検索語そのものを出すと、「オンライン秘書」と「オンライン秘書 経営」が
      // 並んで冗長になり、1ジャンル1語のときは同じ語が二重に出る
      var seenTags = {};
      p.genres.concat(p.mods || []).forEach(function (t) {
        if (seenTags[t]) return;
        seenTags[t] = true;
        tags.appendChild(mk('span', 'tag', t));
      });
      if (p.permalink) {
        var a = mk('a', 'link', '元投稿を開く →');
        a.href = p.permalink;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        tags.appendChild(a);
      }
      card.appendChild(tags);
      frag.appendChild(card);
    });
    els.list.appendChild(frag);
  }

  [els.sort, els.period].forEach(function (el) {
    el.addEventListener('change', render);
  });
  els.q.addEventListener('input', render);

  render();
})();
</script>
