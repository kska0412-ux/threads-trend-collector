yto", "text": "自己免疫疾患で、髪の毛が9割抜けた過去があります。でも今は完全に自毛が生え戻り、寛解してから15年間、一度も症状が出ていません。治すためにお金も時間も膨大に費やしたけど、本質的にやったことは1つだけ。", "permalink": "https://www.threads.com/@mayukaphyto/post/DaKp47dkg11", "likes": 17, "velocity": 0.01, "ageHours": 1548.1, "postedAt": "2026-06-29T19:29:23+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3937780355793379848", "username": "tonton_3389", "text": "誰か教えて欲しい。\n40代になって、髪がゴワゴワ！\n縮毛もなんか限界を迎えて、ボリュームは落ちるもののゴワゴワ感がすごい😭\nヘアケアで何とかなる？", "permalink": "https://www.threads.com/@tonton_3389/post/Dalzl7Ok2II", "likes": 17, "velocity": 0.01, "ageHours": 1295.0, "postedAt": "2026-07-10T08:33:40+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3957528106475029968", "username": "nemui0o_", "text": "肌治療何したらいいでしょうか、、、\n黒い毛穴？毛？がフェイシャルワックスしても消えないです😭", "permalink": "https://www.threads.com/@nemui0o_/post/Dbr9thPEYXQ", "likes": 17, "velocity": 0.03, "ageHours": 641.1, "postedAt": "2026-08-06T14:28:55+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3858928374362907176", "username": "40skin_change", "text": "今までで、受けて一番良かった（効果があった）エステの施術ってなんですか？", "permalink": "https://www.threads.com/@40skin_change/post/DWNquk3k6Io", "likes": 17, "velocity": 0.0, "ageHours": 3906.1, "postedAt": "2026-03-23T13:28:51+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3926896700921449966", "username": "shinsuke_chigasaki", "text": "ランクルFJの丸目ランプについて、国内での発売と配車が27年1月に決定された模様\n\n丸目ランプに併せて、形状の異なる交換用バンパー（前後）も純正アクセサリーに加わる。こちらはデザインが微妙に異なり、標準装着されているバンパーよりリフトアップ感が強い。\n\nそれにしても、発売翌月に丸目ランプの追加導入が商談で明かされるくらいなら、発売時に「27年からは丸目ランプも導入します。待ってもらえれば買えますよ」と公表したほうが良心的だったのではないだろうか。。。。ほんまやで\n\nhttps://mag-x.jp/2026/06/24/32866/", "permalink": "https://www.threads.com/@shinsuke_chigasaki/post/DZ_I75wE43u", "likes": 17, "velocity": 0.01, "ageHours": 1655.4, "postedAt": "2026-06-25T08:09:47+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3937064498016420231", "username": "fusafusa_gingin", "text": "ハゲへ。AGAクリニックの医師が患者には絶対に言わない真実がある。それが、", "permalink": "https://www.threads.com/@fusafusa_gingin/post/DajQ00uEgGH", "likes": 16, "velocity": 0.01, "ageHours": 1318.7, "postedAt": "2026-07-09T08:51:23+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策", "AGA"]}, {"id": "3856603886757479504", "username": "tsudobarai.keana", "text": "フェイシャルエステは美容師免許必要ってほんと？", "permalink": "https://www.threads.com/@tsudobarai.keana/post/DWFaM1FkgRQ", "likes": 16, "velocity": 0.0, "ageHours": 3983.1, "postedAt": "2026-03-20T08:30:31+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3911758093780724610", "username": "ru_ru_.26", "text": "ローソン限定品\n\n♡無印良品の頭皮のマッサージもできるブナ材\nヘアコーム\n\n1個持ってるけど…数日前にローソンを駆けずりまわって見つけて2個目、買いました。\nなぜかというと1個は確実に自宅用。\nもう1個は車に置いておく専用として。\n\nこのコーム今さらだけど、是非お手元にある人には試してほしいです…\n\n頭皮以外にも耳つぼが、すっご〜い、すっご〜い気持ちよくて…車の運転中の信号待ちなどでやると、ある意味ヤバい顔に…（個人差はあります)\nやり方はコームの1番外側の部分で耳つぼかな？って思う部分に気持ちいい強さで10秒前後押すだけ。\n力を入れすぎず気持ちいい強さで押すのがポイントです。\n\nお風呂でやるのも気持ちいいです♪\n\n↓黒丸の部分で…", "permalink": "https://www.threads.com/@ru_ru_.26/post/DZJW0LLDyuC", "likes": 16, "velocity": 0.01, "ageHours": 2156.7, "postedAt": "2026-06-04T10:52:04+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3959757111446056861", "username": "pinkyribbon60", "text": "脱毛のピークがようやく落ち着きました😅\n一時期は本当に抜け毛がすごくて掃除がエンドレスだったから、ちょっと楽になってホッとしてます。\nそこで先輩方に質問なのですが、脱毛後の頭皮って何で洗うのが正解ですか？🤔\n今はとにかく乾燥対策が気になってて…おすすめのシャンプーや保湿ローション、ケア方法があればぜひ教えてほしいです！🙇‍♀️", "permalink": "https://www.threads.com/@pinkyribbon60/post/Dbz4hz4ka-d", "likes": 16, "velocity": 0.03, "ageHours": 567.3, "postedAt": "2026-08-09T16:17:33+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3959932933775107560", "username": "mis0shiruumai", "text": "結局角栓毛穴に良いクレンジングってどれなん？", "permalink": "https://www.threads.com/@mis0shiruumai/post/Db0ggXMCSXo", "likes": 16, "velocity": 0.03, "ageHours": 561.5, "postedAt": "2026-08-09T22:06:53+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3975762463865518474", "username": "cocoabicke", "text": "off\u0026Relax 早速使ってみてのレポ\n💜SILKY NIGHT REPAIR💜\nシャンプーは洗っている時に少しだけキシみがあったので、洗浄力がそこそこありそう。頭皮ケアに関して３種類の中だと1番低いけど、洗い上がりのさっぱり感はありました。\n\nバイオレットムスクの香りが結構しっかりあるなという印象。こればかりは好みだろうな..🤔\n私は可もなく不可もなく...\nただウォンビンと同じ香りという付加価値が付いてるので正直何でも良いw\n\nトリートメントは個人的にそこまでしっとり感は無いけど、どんな髪質の人でも使いやすいテクスチャーだと思う。\n\nチラシには載ってなかったけど、個人的に1番良いと思ったのが最後に使うヘアマスク！\n結構重めで洗い流しもしっとりします。ダメージヘアの人は絶対使うべき！\n\n〜ドライ後〜\nアウトバス用トリートメント無しでそのまま乾かしましたが、ヘアマスクのおかげでしっとり重めの仕上がりになりました。髪がペタっとしやすい人は他の種類の方が良さそう\n癖毛や髪が太くボリュームが出やすい人はこの紫のシリーズが良いのでは..と思います。\nハイダメージの人はヘアマスク必須かと", "permalink": "https://www.threads.com/@cocoabicke/post/DcsvuV6CTmK", "likes": 16, "velocity": 0.43, "ageHours": 37.3, "postedAt": "2026-08-31T18:17:20+09:00", "genres": ["薄毛", "育毛"], "keywords": ["髪 ボリューム", "頭皮ケア"]}, {"id": "3921961880286087354", "username": "biyou_karakuchi", "text": "『皮脂フィラメント』の投稿が28万人に見られてる🫣毛穴が気になる人はまず鏡で自分の鼻をよーくみてみて？\n皮脂フィラメントの特徴は\n①鼻全体に均一に分泌されている\n②触っても凹凸はない\n③白っぽい糸状のものがでてくる\n画像の毛穴タイプは、皮脂フィラメント×メラニン毛穴で、皮脂フィラメントを指で押し出したり毛穴パックなどの過度な刺激で、毛穴の周りがリング状に色素沈着している。ハイドラやピーリングなどで綺麗にしてもまた同じように目立ってくる。じゃあ根本改善するにはどうしたらいいかというと、", "permalink": "https://www.threads.com/@biyou_karakuchi/post/DZtm4z5E0i6", "likes": 16, "velocity": 0.01, "ageHours": 1818.8, "postedAt": "2026-06-18T12:45:11+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3863077459378524349", "username": "bananafish326", "text": "TOYOTA RAV4\n3.5inc リフトアップ 仕上がりました～", "permalink": "https://www.threads.com/@bananafish326/post/DWcaHtaE1C9", "likes": 16, "velocity": 0.0, "ageHours": 3768.7, "postedAt": "2026-03-29T06:52:21+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3884821040006938925", "username": "hairsalon.kinu", "text": "２ヶ月の変化。まだまだ続けます\n育毛は《予防ケア》が1番大切☝️\n早ければ早いスタートほど良いし、回数と量は重要ですね。\n育毛剤、サプリ、AGA薬に頼らない最新の育毛、白髪改善方法をマニアックに研究しているオタク美容師です。\n常に自分が実験台。\n髪とボリュームは頭皮の奥から変える必要があります😊土台こそが全て👍", "permalink": "https://www.threads.com/@hairsalon.kinu/post/DXpqCc5k8Et", "likes": 15, "velocity": 0.0, "ageHours": 3048.7, "postedAt": "2026-04-28T06:52:57+09:00", "genres": ["薄毛", "育毛"], "keywords": ["髪 ボリューム", "育毛剤", "AGA", "頭皮ケア", "薄毛 対策"]}, {"id": "3907677224859001842", "username": "mokon_chan", "text": "45歳を過ぎてから、「1日3食きっちり食べる人」ほど髪のボリュームに悩みやすい。\n朝は豆乳、昼はヘルシーな定食、夜もしっかり、間食にナッツ。そんな「模範的な食生活」のはずなのに、抜け毛が変わらない。夕方になると顔がくすむし、疲れが抜けきらない。\n良かれと思ったその習慣が、大人の髪に必要な「ある若返りシステム」を1日中潰し続けている可能性がある。\nそのシステムとは、", "permalink": "https://www.threads.com/@mokon_chan/post/DY627t0muPy", "likes": 15, "velocity": 0.01, "ageHours": 2291.9, "postedAt": "2026-05-29T19:44:07+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3879123545183788222", "username": "afuro_ya_a", "text": "元々毛量多めの私なんだけど、若い頃に比べるとめちゃくちゃ髪の毛減った!!!\nってかシャンプーする度抜け毛がすごい...って思ってたのね。\n\nこのブラシを毎日使うようになって2ヶ月。\n\nアホ毛が増えた(毛が生えた)気がする\n\nめっちゃ頭皮まで届く。\n\nこれ使いだしたらタン〇ルティーザー全然髪の根元に届かないじゃん...っ思って使えなくなった...。", "permalink": "https://www.threads.com/@afuro_ya_a/post/DXVak_WiJy-", "likes": 15, "velocity": 0.0, "ageHours": 3237.4, "postedAt": "2026-04-20T10:13:03+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3900206838755548451", "username": "3____amae", "text": "糸リフトやってみたい\n\n糸リフト初日、翌日ってどんな感じですか？\nパンパンに腫れますか？\n\n片側3本ずつ入れる予定です。", "permalink": "https://www.threads.com/@3____amae/post/DYgUXSmkt0j", "likes": 15, "velocity": 0.01, "ageHours": 2539.2, "postedAt": "2026-05-19T12:21:48+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3963174429891190197", "username": "mari_kimiwada", "text": "薄毛白髪専門家からハッキリ言っておきます！\n無印の商品が白髪・育毛にいいとか流行ってるが…\nそれに飛びついてる人、老化加速します！だって", "permalink": "https://www.threads.com/@mari_kimiwada/post/DcABiVsk121", "likes": 14, "velocity": 0.03, "ageHours": 454.1, "postedAt": "2026-08-14T09:27:09+09:00", "genres": ["薄毛", "育毛"], "keywords": ["薄毛 対策", "つむじ 薄毛", "発毛", "抜け毛 対策"]}, {"id": "3949043241849074623", "username": "emuji_ikumou", "text": "AGAクリニックに怒られそうだけど、ハッキリ言います。\nまともなAGA治療薬は、たった3つしかありません。それ以外を「これも効きますよ」って勧めてくるクリニックは、正直警戒したほうがいい。その3つっていうのが、", "permalink": "https://www.threads.com/@emuji_ikumou/post/DbN0efREjO_", "likes": 14, "velocity": 0.02, "ageHours": 922.1, "postedAt": "2026-07-25T21:31:03+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策", "AGA"]}, {"id": "3974032757189840293", "username": "biyou_honto_rinaa", "text": "ペプチド最強なのに、なんでみんな使わないの。美容クリニックで8年働いてきて、ずっと疑問だった。たるみが改善した人って、、", "permalink": "https://www.threads.com/@biyou_honto_rinaa/post/DcmmbzCEQ2l", "likes": 14, "velocity": 0.15, "ageHours": 94.6, "postedAt": "2026-08-29T09:00:43+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3946335969519840252", "username": "kaori_yoga_instructor", "text": "頭皮マッサージ、ちゃんとやってますか?🌿\n\n頭皮と顔の皮膚は繋がっているから、頭皮のコリをほぐすだけで顔のむくみもスッと軽くなります。\n\n✅育毛・抜け毛予防(血流アップで毛母細胞に栄養が届く)\n✅髪にコシとツヤ\n✅リフトアップ・小顔効果\n✅疲労回復・自律神経を整える\n\n【やり方】\n・力加減は「生卵を持つ感覚」で、爪を立てずに指の腹で\n・入浴中や就寝前に1回3〜5分\n・やりすぎ注意!強く揉みすぎると頭皮や毛根を傷めます\n\n今日のバスタイムから、指の腹でやさしく試してみて✨\n\nーーーーーーーーーーー\n\n頭皮のマッサージもできるブナ材ヘアコーム（税込548円）\nこちらのコームは通常の無印良品店舗やネットストアで販売されている「ブナ材ヘアコーム」とは異なり\nローソン（LAWSON）でのみ購入できる限定商品となっています🏪\n\n#頭皮マッサージ #無印良品 #muji", "permalink": "https://www.threads.com/@kaori_yoga_instructor/post/DbEM6fbk6v8", "likes": 14, "velocity": 0.01, "ageHours": 1011.7, "postedAt": "2026-07-22T03:52:11+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3965774925014082060", "username": "___me_mn", "text": "結局のところ毛穴に有効なケアって何ですか❔\nThreadsはPRばっかりで何を信じたら良いのかわからない😖❗", "permalink": "https://www.threads.com/@___me_mn/post/DcJQ0hgnaIM", "likes": 14, "velocity": 0.04, "ageHours": 368.0, "postedAt": "2026-08-17T23:33:53+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3973618067486069758", "username": "emi_alphaz_uotami", "text": "@alphaz.domi \n頭頂部薄毛でげんなりしてたところ\nオススメしてもらったリリーイブ使用前から2本使い切るところ…\n\n多少分け目が違うけど、どうだろうか？\n実感としては頭頂部ぺちゃだったのがしっかり立ち上がる気がする🥹\nブラシで頭皮マッサージしてるからかしっかり頭皮が真っ白黄ばんでない🥹\n健康な頭皮を維持してる証拠だね🥳\nこれは続ける価値がある💕\n\n今日からメガ割だから買い足そう💇‍♀️\ndomiさんオススメありがとうございました～🫶🫶🫶‪‪💕", "permalink": "https://www.threads.com/@emi_alphaz_uotami/post/DclIJRJlNP-", "likes": 14, "velocity": 0.13, "ageHours": 108.3, "postedAt": "2026-08-28T19:16:48+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3897412681645146114", "username": "aya_biyouiryou", "text": "本当は教えたくないんですが。ほうれい線、頭皮マッサージだけで変わります。美容クリニックが絶対言わないやつ。でも言います。", "permalink": "https://www.threads.com/@aya_biyouiryou/post/DYWZC9Aj8AC", "likes": 14, "velocity": 0.01, "ageHours": 2631.8, "postedAt": "2026-05-15T15:50:18+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3933045399363323074", "username": "oyausuge", "text": "薄毛で来られる方の8割が、\n\n頭皮の血流が\n普通の人の半分以下、\n\nという結果でした", "permalink": "https://www.threads.com/@oyausuge/post/DaU-_PaiQTC", "likes": 13, "velocity": 0.01, "ageHours": 1451.8, "postedAt": "2026-07-03T19:46:09+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3933813718883432112", "username": "fusafusa_gingin", "text": "知ってるか。発毛に使うミノキシジル、仕組みとしては「血流を良くする」だけなんだ。逆に言うと体温を上げるだけで同等の効果が期待できる。まず、", "permalink": "https://www.threads.com/@fusafusa_gingin/post/DaXtrwumvaw", "likes": 13, "velocity": 0.01, "ageHours": 1426.4, "postedAt": "2026-07-04T21:12:40+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3964196686776284739", "username": "niisa233", "text": "教えてください。\n\n夫が薄毛治療をはじめたいと言い出して\nみなさん、どこでお薬をもらっていますか？\n\n皮膚科？\nAGA外来？\nオンライン？\n\n10年前から薄くなり始めて\nM字と後頭部が薄いです。\n\n検索魔になってしまい、余計にわからなくなりました💦", "permalink": "https://www.threads.com/@niisa233/post/DcDp-InFLZD", "likes": 13, "velocity": 0.03, "ageHours": 420.3, "postedAt": "2026-08-15T19:18:12+09:00", "genres": ["育毛", "薄毛"], "keywords": ["発毛", "AGA"]}, {"id": "3916412780484384939", "username": "natsumi19870912", "text": "久しぶりの投稿です！\nプロファイロを打って1ヶ月。\nむくみもなくなり完成かな？\n確かに肌艶はよくなります。\nすっぴんですがツヤッとします。\nただ…\nリフトアップ効果はないかな？\nただ3週間は顔がむくみますので\n失敗！？ええええ😭！？\nとなりますが、見事にひきました笑", "permalink": "https://www.threads.com/@natsumi19870912/post/DZZ5Kx-klir", "likes": 13, "velocity": 0.01, "ageHours": 2002.6, "postedAt": "2026-06-10T21:00:06+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3901645536818740003", "username": "jimu_neesan", "text": "20代のうちにやっておきたい施術3選\n※個人的な意見です\n\n3位：ボトックス（予防打ち）\n→シワになる前に打つのが正解\n早めにケアするほどコスパがいい💉\n2位：ハイフ（HIFU）\n→たるみケアは20代から始めると全然違う\nリフトアップ効果で輪郭がすっきり✨", "permalink": "https://www.threads.com/@jimu_neesan/post/DYlbfGlkbsj", "likes": 13, "velocity": 0.01, "ageHours": 2491.6, "postedAt": "2026-05-21T12:00:14+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3918253653606257793", "username": "maro_n0505", "text": "【無印良品　ヘアコーム】\n\nここで見て気になって数ヶ月前に購入。\n本来は頭皮マッサージ用のブナ材へアコームです。\n私の場合は頭皮のマッサージよりも、首筋や耳の下を優しく押す使い方にどハマり中。\n本来の使い方ではないかもしれないけど、私には\n『首筋専用・そこそこコーム」』になってます。🤭\n\n❣️私の撮った写真を元に､チャッピーがわかりやすく作ってくれました😊", "permalink": "https://www.threads.com/@maro_n0505/post/DZgbvArE9SB", "likes": 13, "velocity": 0.01, "ageHours": 1941.6, "postedAt": "2026-06-13T09:57:36+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3858417719134330519", "username": "uka_marikotomo", "text": ".\n頭皮ケア、ヘアセット\n後頭部までできてますか？\n\n自分では見えないけど意外と見られてる後頭部！\n\n特につむじは自分が思ってるより少し後ろにあります！\n\nつむじ周りは生え癖が強く、\n髪がパックリ割れやすかったり\n根本から潰れてペチャンコになりやすいです！\n\nそんな【つむじ割れ】を改善させてくれるのが、\nukaの頭皮用美容液　リセラム\nスタイリングミスト　ペチャンコ\nこのセットが最強です👍\n\n頭皮用美容液\"リセラム\"は\n発売から約３ヶ月経って、\n【髪の立ち上がりが良くなった！】\n【つむじ割れがしにくくなった！】\nとお客様からのお声を頂くことが増えてきました！\n\nリセラムで髪の毛本来の立ち上がりを良くして、\nペチャンコでさらに根本からふんわり感をキープ✨\n\n髪のボリュームダウンが気になる方、\nつむじや生え癖で髪が割れる、ペタンとする方、\n是非このセットで使ってみてください💁‍♀️\n\n#つむじ割れ解消 #髪のボリュームアップ \n#頭皮用美容液 #スカルプセラム \n#リセラムフォースカルプ", "permalink": "https://www.threads.com/@uka_marikotomo/post/DWL2nkIEx6X", "likes": 13, "velocity": 0.0, "ageHours": 3923.0, "postedAt": "2026-03-22T20:34:18+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3936799114923055600", "username": "richan_dn", "text": "生後2ヶ月半にしてついに恐れていた\n産後の抜け毛が来た😭😭😭\n女としてすでに体ボロボロなのにさらに抜け毛もなんて悲しい！😇", "permalink": "https://www.threads.com/@richan_dn/post/DaiUe_dD5nw", "likes": 13, "velocity": 0.01, "ageHours": 1327.5, "postedAt": "2026-07-09T00:04:07+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3931338810072501021", "username": "kami_neesan_", "text": "縮毛矯正をかけようとしてる更年期以降の人、先に確認することがあるで。エイジング毛は内部のケラチンが流出して空洞状態になってることが多い。空洞の髪に強い薬剤を当てると耐えられんでビビリ毛になることがある。何をするかっていうと、", "permalink": "https://www.threads.com/@kami_neesan_/post/DaO69GSFAsd", "likes": 13, "velocity": 0.01, "ageHours": 1508.3, "postedAt": "2026-07-01T11:15:33+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3953244721345851195", "username": "af.hustler", "text": "走行距離3．5万km、最近乗り心地が悪い😅　\nおそらくショックがヘタっていると思われます。\nオススメのショックアブソーバーありますか？40ミリリフトアップです。\njb64", "permalink": "https://www.threads.com/@af.hustler/post/DbcvyD-Ae87", "likes": 13, "velocity": 0.02, "ageHours": 783.0, "postedAt": "2026-07-31T16:38:36+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3901201845230418032", "username": "horumi_yuragibiyou", "text": "前髪に白髪が多い人が、一番やりがちなミスを言います。前髪・生え際の白髪は、胃腸の疲れのサイン。だから亜鉛サプリを飲んでも、頭皮マッサージをしても変わらない。胃腸が整っていないと、栄養が髪に届く前になくなっているんです。私も最初、白髪の生える場所を気にせずに亜鉛サプリを半年飲み続けました。でも変わらず....(泣)婦人科医の夫に話したら、￼", "permalink": "https://www.threads.com/@horumi_yuragibiyou/post/DYj2mimDrhw", "likes": 12, "velocity": 0.0, "ageHours": 2506.3, "postedAt": "2026-05-20T21:18:42+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3950447004606259158", "username": "temari.yakuzen", "text": "抜け毛や薄毛が気になる人、\n頭のてっぺんを\n指で押してみて。\n\nブヨブヨしてるか\nガチガチに硬いなら\n頭皮の血行が\n滞っているサインで、", "permalink": "https://www.threads.com/@temari.yakuzen/post/DbSzp7Nj9_W", "likes": 12, "velocity": 0.01, "ageHours": 875.6, "postedAt": "2026-07-27T20:00:02+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3889144170669810257", "username": "chie.kogao.design", "text": "小顔にならない女性には、共通する特徴がある。\n当てはまってないよね？\n\n1.足が…￼", "permalink": "https://www.threads.com/@chie.kogao.design/post/DX5BASFDiJR", "likes": 12, "velocity": 0.0, "ageHours": 2905.6, "postedAt": "2026-05-04T06:02:15+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3872674739408320906", "username": "tiki.scalpink", "text": "頑張って薄毛改善しました！\n\n長年のコンプレックス。\n\nどの位の期間で改善したかというと、、", "permalink": "https://www.threads.com/@tiki.scalpink/post/DW-gSg9D7mK", "likes": 12, "velocity": 0.0, "ageHours": 3450.9, "postedAt": "2026-04-11T12:40:26+09:00", "genres": ["薄毛"], "keywords": ["AGA", "薄毛 対策", "つむじ 薄毛"]}, {"id": "3895429377073331696", "username": "ha._.zu085", "text": "産後3ヶ月たって最近抜け毛酷い🥹\n同じくらいの産後のママさん達で同じかたいますか🥹\nそれとも人によりますか?、、\n対策教えてください🥹💗", "permalink": "https://www.threads.com/@ha._.zu085/post/DYPWGEsE73w", "likes": 12, "velocity": 0.0, "ageHours": 2697.4, "postedAt": "2026-05-12T22:09:50+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3911037356156837559", "username": "ooyashinkyu134", "text": "薄毛鍼、3年やってきて分かったこと、全部書きます。", "permalink": "https://www.threads.com/@ooyashinkyu134/post/DZGy8D9At63", "likes": 12, "velocity": 0.01, "ageHours": 2180.6, "postedAt": "2026-06-03T11:00:06+09:00", "genres": ["育毛", "薄毛"], "keywords": ["発毛", "薄毛 対策", "つむじ 薄毛"]}, {"id": "3961464099766944854", "username": "nemui0o_", "text": "メラニン毛穴におすすめのスキンケアってなんだろう、、クレンジングも悩ましい、、", "permalink": "https://www.threads.com/@nemui0o_/post/Db58pwpEkRW", "likes": 12, "velocity": 0.02, "ageHours": 510.8, "postedAt": "2026-08-12T00:49:02+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3955802012336228494", "username": "029_mzk_", "text": "この1ヶ月足らずで\nすごい抜け毛で一気にハゲてきた\n頭頂部が前から後ろまでめっちゃ透けてる\nこれって原因とかあるん？\nハゲって突然くるもんなん？\n毎日めっちゃ抜けるねん\nほんまいやや……", "permalink": "https://www.threads.com/@029_mzk_/post/Dbl1PizE4iO", "likes": 12, "velocity": 0.02, "ageHours": 698.3, "postedAt": "2026-08-04T05:19:29+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3943511063564344793", "username": "kumi_zaki", "text": "子供が蛇行性脱毛症で2年間局所免疫療法で治療してました。改善してきたのでここ半年は通院回数を2、3ヶ月に一度の流れになり6月上旬に行ったのが最後で次回は8月下旬の受診です。\nこの2年、時折抜け毛が多いなと感じる時がありましたが１ヶ月もすれば落ち着いていました。3月の中旬より抜け毛が増えたなと感じていて、と言ってもシャンプーの時やブラッシングで5〜10本程度。枕にもほぼ抜け毛はついてません。\nこれでも抜け毛がほぼ０だった時が通常なのを知ってるので抜け期かなと思って見守ってきました（抜け毛は私の方が多いです）\n今現在は同じような抜け毛の量です。\n私しかわからないレベルですが、眉毛も薄くなってます。\nゆっくりと脱毛が進んでる印象なのですが、、医師に言っても健康な人でも1日50〜100本抜ける、気にしてるのはお母さんだけど言われたり、、通院を拒む娘の気持ちを優先して受診してません。\nでも、めくるとスカスカですし、短い毛も見えず…地肌が目立つポイントもいくつかあります。一昨年の秋に後頭部にできた爪の先程の脱毛班も全く変化がありません。抜け毛は多くないけど生えてこない印象。", "permalink": "https://www.threads.com/@kumi_zaki/post/Da6Kmsvk13Z", "likes": 12, "velocity": 0.01, "ageHours": 1105.3, "postedAt": "2026-07-18T06:19:33+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3923655913131746324", "username": "kami_neesan_", "text": "ヘッドスパで「うわ、頭皮カチカチですね」言われた時、マジで凍りついた。指で動かんくらい固かってん。頭皮が硬いと血流が落ちて、白髪も薄毛も進みやすい。けどお金かけてスパ通わんでも家で柔らかくできるで。家でできる方法がな、めっちゃ簡単で、", "permalink": "https://www.threads.com/@kami_neesan_/post/DZzoEO7FCQU", "likes": 12, "velocity": 0.01, "ageHours": 1762.7, "postedAt": "2026-06-20T20:50:57+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3968343506338552313", "username": "nana_beautylife39", "text": "で、結局ほうれい線には何がオススメですか？\n\nマッサージは毎日してるので、\n美容医療編をこっそり聞いてみたいです！！", "permalink": "https://www.threads.com/@nana_beautylife39/post/DcSY2TSCZn5", "likes": 12, "velocity": 0.04, "ageHours": 283.0, "postedAt": "2026-08-21T12:37:11+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3976535778658615720", "username": "ganmen.kakin", "text": "切開リフト後2ヶ月すぎて、今日夫に「えっ⁇小顔になった⁇」とめちゃくちゃ驚かれた。\n久しぶりに顔見たのかしら💦\nまぁ、嬉しいは嬉しい😆", "permalink": "https://www.threads.com/@ganmen.kakin/post/DcvfjjblAGo", "likes": 12, "velocity": 1.03, "ageHours": 11.7, "postedAt": "2026-09-01T19:53:46+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3878653271968366560", "username": "yuu_mens_beauty", "text": "【M字ハゲの男性に似合う髪型がこの5つ👇️】\n\n・アップバング（前髪上げスタイル）\n・ソフトモヒカン（トップに高さ）\n・ツーブロック＋ショート（メリハリ型）\n・ナチュラルパーマ（動きでぼかす）\n・ベリーショート（潔く短く）\n\nM字ハゲ・生え際後退タイプは、「隠す」よりも活かす・ぼかす・視線を分散させるのがポイント！\n\nソフトモヒカンやツーブロックのようにして、トップにボリュームを持たせるのもおすすめ。", "permalink": "https://www.threads.com/@yuu_mens_beauty/post/DXTvpnSlL_g", "likes": 11, "velocity": 0.0, "ageHours": 3253.0, "postedAt": "2026-04-19T18:38:42+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3935292630062401860", "username": "hair_nayami_koharu", "text": "ミノキシジルを使わずに薄毛が変わった体験を、正直に全部話したいと思っている。「薬を使わなければ変わらない」と思い込んでいた自分が変わったのが、", "permalink": "https://www.threads.com/@hair_nayami_koharu/post/Dac98wGFQlE", "likes": 11, "velocity": 0.01, "ageHours": 1377.4, "postedAt": "2026-07-06T22:11:02+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3963622786812045945", "username": "hitomi.takizawa13", "text": "目の下のたるみが毎日気になってはいるけど…整形しないで年相応にたるんで行こうと思う。ダメ？笑", "permalink": "https://www.threads.com/@hitomi.takizawa13/post/DcBneynk2p5", "likes": 11, "velocity": 0.03, "ageHours": 439.3, "postedAt": "2026-08-15T00:17:58+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3961261069842652924", "username": "opa_biyou32", "text": "全女性に伝えたい。高い美容医療なしで毛穴・くすみを改善するのに『ナイアシンアミド』は最強なんだけど、単体で使うともったいない。この4つの組み合わせで使って、", "permalink": "https://www.threads.com/@opa_biyou32/post/Db5OfSSjh78", "likes": 10, "velocity": 0.02, "ageHours": 517.5, "postedAt": "2026-08-11T18:05:39+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3968491265637085659", "username": "megan_jpn", "text": "美容に詳しい人〜👋\n実体験で、リフトアップに効いた化粧品を教えてください。👏✨\nたるみがすんごい気になる。\n今年40才だもん、重力に負けるわ。🛸👽", "permalink": "https://www.threads.com/@megan_jpn/post/DcS6ce2ifHb", "likes": 10, "velocity": 0.04, "ageHours": 278.1, "postedAt": "2026-08-21T17:30:46+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3914621358046285032", "username": "nekotoseiten", "text": "女性の皆様にお聞きします\n市販されている育毛剤で効果あったよー！って人いますか？\n\n20代の娘が仕事中ヘルメットを被る仕事で\n最近髪の毛が薄くなってきたと悩んでいるので\n育毛剤を買ってあげたくてしたくて…", "permalink": "https://www.threads.com/@nekotoseiten/post/DZTh2J0gYzo", "likes": 10, "velocity": 0.0, "ageHours": 2061.9, "postedAt": "2026-06-08T09:40:52+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3975078729919614933", "username": "mt__.s2", "text": "頭皮が💦\n\nアロベビー合わないのかな？😭", "permalink": "https://www.threads.com/@mt__.s2/post/DcqUQtDEc_V", "likes": 10, "velocity": 0.17, "ageHours": 60.0, "postedAt": "2026-08-30T19:38:53+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ", "頭皮ケア"]}, {"id": "3960576141024073178", "username": "nori_jinsei_lab", "text": "AGA治療、始めて1年3ヶ月。\n正直な経過を書く。", "permalink": "https://www.threads.com/@nori_jinsei_lab/post/Db2ywQnoJXa", "likes": 10, "velocity": 0.02, "ageHours": 540.2, "postedAt": "2026-08-10T19:24:59+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3923995465620842337", "username": "50hayasu", "text": "52歳。生え際が後退している現実を認めることにした。\n\n中学の頃からハゲるのが怖かった。\n\n実家が美容室だったこともあって、\n育毛剤だけはずっと身近にあった。\n\nそれでも50代になると、\n鏡を見るたびに生え際が気になる。\n\nだから今は、現実から目を逸らさずに記録していく。", "permalink": "https://www.threads.com/@50hayasu/post/DZ01RX0kudh", "likes": 9, "velocity": 0.01, "ageHours": 1751.5, "postedAt": "2026-06-21T08:05:33+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3974049657139754232", "username": "takahashishota.co.jp", "text": "そして、アワード表彰式。\n今回、エクセルグロー（三和紙工）賞で和多くの作品が商品化されることになり感動。\nみんなで考えた甲斐あったな！\nエクセルグローさま、素晴らしい企画とご支援を誠にありがとうございます！\nお披露目は松山、文具フェスタで！！\n個人的MVPはAGAと色部さんのツーショットでした笑", "permalink": "https://www.threads.com/@takahashishota.co.jp/post/DcmqRuVk_T4", "likes": 9, "velocity": 0.1, "ageHours": 94.0, "postedAt": "2026-08-29T09:34:17+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3965496045186761382", "username": "usagiwarabbit", "text": "夫の抜け毛が多くて心配…。\nストレス？加齢？ホルモンバランス？\nシャンプー変えたらいいのかな？💦", "permalink": "https://www.threads.com/@usagiwarabbit/post/DcIRaSbksKm", "likes": 9, "velocity": 0.02, "ageHours": 377.3, "postedAt": "2026-08-17T14:19:48+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3928313790945547905", "username": "atmdjhw", "text": "薄毛？ハゲ？の薬ってやはりリスクあるよね。\n夫に予防で使ったらと思ってたけど危ないよな。", "permalink": "https://www.threads.com/@atmdjhw/post/DaELJRrk9aB", "likes": 9, "velocity": 0.01, "ageHours": 1608.5, "postedAt": "2026-06-27T07:05:17+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3853413489067414787", "username": "ai.2jan", "text": "間も無く1歳半。これより薄毛族な方いらっしゃいますか？ \n中々髪の毛が生えてこないので、今日も男の子に間違えられた🤣  わたし おんなのこ です👶", "permalink": "https://www.threads.com/@ai.2jan/post/DV6Eybsj9UD", "likes": 9, "velocity": 0.0, "ageHours": 4088.7, "postedAt": "2026-03-15T22:51:46+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策", "つむじ 薄毛"]}, {"id": "3903849939520915242", "username": "shinosan_beauty", "text": "ぶっちゃけるね。40代女性、美容医療は全部やる必要ない。やるべきとやらなくていい、ハッキリ分けた。\nやらなくていい↓\n① 高額エステ → 医療じゃないから効果が限定的。同じ金額をクリニックに使う方が100倍結果が出る。\n② 糸リフト → 効果が1〜2年で切れる。コスパが悪すぎる。\nやるべきは、", "permalink": "https://www.threads.com/@shinosan_beauty/post/DYtQtYlkwcq", "likes": 9, "velocity": 0.0, "ageHours": 2418.6, "postedAt": "2026-05-24T12:59:59+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3964157219180756668", "username": "oyausuge", "text": "これまで100名以上の薄毛の方を診てきて、\n気づいたことのひとつが、\n\n薬で生やした髪と、\n自分の血流で生やした髪は、", "permalink": "https://www.threads.com/@oyausuge/post/DcDg_zjEb68", "likes": 8, "velocity": 0.02, "ageHours": 421.6, "postedAt": "2026-08-15T17:59:47+09:00", "genres": ["薄毛", "育毛"], "keywords": ["つむじ 薄毛", "発毛"]}, {"id": "3950394602281379588", "username": "lello_salon", "text": "【エステティシャン募集】\n⁡\n⁡\nアルバイトスタッフを1名募集いたします😌\n⁡\nカウンセリング、施術、スキンケアのアドバイスまで、肌質改善に専門特化した仕事内容になります✨\n⁡\n【勤務時間】\n11:30〜20:00まで（終わり次第早上がり可能）\n⁡\n【勤務日数】\n週2日以上で応相談\n⁡\n【応募条件】\n美容の知識や経験がある人（美容・化粧品業界での勤務経験がある、美容専門学校を卒業している、化粧品検定1級などの資格を持っている etc...）\n⁡\n面接希望者様は、\n⁡\n⚫︎氏名\n⚫︎生年月日\n⁡\nご記載の上、DMまでご連絡をお待ちしております✉️\n⁡\n⁡\n#肌質改善サロン #エステティシャン", "permalink": "https://www.threads.com/@lello_salon/post/DbSnvXvmicE", "likes": 8, "velocity": 0.01, "ageHours": 877.3, "postedAt": "2026-07-27T18:15:56+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3895169013588789653", "username": "rui.fphl", "text": "FAGA治療を始めて1年が経過した。\n服用＋塗り薬。\n半年すぎたくらいで薬は飲んだり飲み忘れたり...ズボラに過ごしたけど間違いなく薄毛の変化はあった！今のところ服用による副作用はなさそう。\n久しぶりに髪の毛の様子を撮影した💇‍♀️\n\n左：開始1ヶ月　右：開始1年後", "permalink": "https://www.threads.com/@rui.fphl/post/DYOa5STEYmV", "likes": 8, "velocity": 0.0, "ageHours": 2706.1, "postedAt": "2026-05-12T13:32:32+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3864724754155137989", "username": "beautysalon__my", "text": "はじめまして☺️🤍\n\n豊川市でフェイシャルサロンをしています。\n\nご来店くださるお客様にとって\n「ほっとできる場所」でありながら\nしっかりお肌の変化も感じていただけるように\n心を込めて施術しています🌿\n\nこれから少しずつ発信していきます🫶🏻\nよろしくお願いします🌷", "permalink": "https://www.threads.com/@beautysalon__my/post/DWiQrAOE2vF", "likes": 8, "velocity": 0.0, "ageHours": 3714.2, "postedAt": "2026-03-31T13:25:13+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3923559715796769072", "username": "sacai.norico", "text": "ほうれい線って、\n口の横からあごにまで伸びるから\n嫌なんだよね。\n\nでも、顔の筋肉意識したら\nこんなに変わったよ✨", "permalink": "https://www.threads.com/@sacai.norico/post/DZzSMYLGVkw", "likes": 8, "velocity": 0.0, "ageHours": 1765.9, "postedAt": "2026-06-20T17:39:47+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線", "小顔"]}, {"id": "3970026373267988448", "username": "chocolate513choco", "text": "成果でてるーーー🫪✨\n\nキメが細かくなってる😭\n冷蔵庫で冷やした日本酒コットンパックか？\nびっくらこいた😭🤣🥳\n消しゴムで消したかのよう\n嬉しいー\n\n久しぶりにキメの細かい肌を見た😂\n冷やしたのが良かったのか？\n日本酒が合ってるのか？\nアゼライン酸がいいのか？\n\nとにかく嬉しい🤤✨", "permalink": "https://www.threads.com/@chocolate513choco/post/DcYXfPPkh_g", "likes": 8, "velocity": 0.04, "ageHours": 227.3, "postedAt": "2026-08-23T20:20:45+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3962013470232976305", "username": "dot_tattoo_artist", "text": "何億回でも言うね…。\n本気で薄毛を防ぎたいなら、これやってください。", "permalink": "https://www.threads.com/@dot_tattoo_artist/post/Db75kJwjJux", "likes": 8, "velocity": 0.02, "ageHours": 492.6, "postedAt": "2026-08-12T19:00:32+09:00", "genres": ["薄毛", "育毛"], "keywords": ["薄毛 対策", "つむじ 薄毛", "発毛"]}, {"id": "3967216212664473134", "username": "babyomame_1217", "text": "8ヶ月　髪増えない伸びないねぇ☺️\n\n薄毛の大爆発\nお風呂上がりの保湿後\nぽわぽわ\n\n致死量の薄毛ベビーのぽわぽわください！", "permalink": "https://www.threads.com/@babyomame_1217/post/DcOYiBPCVYu", "likes": 8, "velocity": 0.02, "ageHours": 320.3, "postedAt": "2026-08-19T23:17:27+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3976570484552455349", "username": "etsu_bodymake_", "text": "46歳　たるみ改善したルーティン\n\n①耳の下(耳下腺)に人差し指の第一関節を\n押し当てて癒着を剥がすように\n20回ほぐす\n\n② 顎の骨の最後（耳の下）をつまんで\n揺らしながらほぐす\n\n②小鼻の横(頬骨の下)に指を押しあてて\n癒着を剥がすように20回ほぐす \n\n⚠️肌をこすらない事\n肌の奥の骨に当てていた気持ちいい程度にやってね\n\n隙間時間でできるセルフケアを発信してます😊\nフォローして他のケアもやって見てね😊", "permalink": "https://www.threads.com/@etsu_bodymake_/post/Dcvncl0DVS1", "likes": 8, "velocity": 0.76, "ageHours": 10.6, "postedAt": "2026-09-01T21:02:46+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3890230248268776824", "username": "yuu_mens_beauty", "text": "【薄毛対策ミスる人多すぎ🤚】\n\n■ハゲる人の習慣↓\n・気になり始めて育毛剤を使う\n・頭皮マッサージをする\n・まだ若いからと放置\n・タバコ吸ってる\n\n■ハゲない人の習慣がこれ↓", "permalink": "https://www.threads.com/@yuu_mens_beauty/post/DX838yqikV4", "likes": 7, "velocity": 0.0, "ageHours": 2869.6, "postedAt": "2026-05-05T18:00:05+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3900468080970567150", "username": "biyou_sake", "text": "3年ずっと頭皮マッサージを続けてるのに\n顔がたるむ40代の方から相談を受けた。\n\n相談者「毎日ヘッドスパみたいに頭皮を揉んでます」\n私「揉むのは続けていいです」\n\n相「シャンプー前に5分しっかりほぐしてます」\n私「でも、たぶん抜けてる工程が1つあります」\n\n相「え…頭皮ケアって揉めばいいんですよね…」\n私「半分は合ってるんです。ただ、\n順番というより、もう1つの方が、」", "permalink": "https://www.threads.com/@biyou_sake/post/DYhPw3YAA3u", "likes": 7, "velocity": 0.0, "ageHours": 2530.6, "postedAt": "2026-05-19T21:00:50+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3952596579676819673", "username": "outidesekkotsuin", "text": "美容鍼されてる鍼灸師さん\n美容鍼はどこで学ばれましたか？\nパルスの電気は入れず\nリフトアップを立体動態波の中にある\n電気を使ってやっていこうと思ってます😌\n同業者様もし教えていただけるのであれば\n教えて頂きたいです🙇‍♀️", "permalink": "https://www.threads.com/@outidesekkotsuin/post/DbacaXAD5DZ", "likes": 7, "velocity": 0.01, "ageHours": 804.4, "postedAt": "2026-07-30T19:10:51+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3940647696519523783", "username": "dandism01", "text": "薄毛治療を始めたいけど、何の薬を飲めばいいのかわからなくて、結局また先延ばしにしてしまった。\n調べれば調べるほど混乱する。\n同じ経験した人いますか？", "permalink": "https://www.threads.com/@dandism01/post/Dav_jOYAe3H", "likes": 7, "velocity": 0.01, "ageHours": 1200.1, "postedAt": "2026-07-14T07:30:34+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策", "つむじ 薄毛"]}, {"id": "3954734055019321927", "username": "zabee_l.28", "text": "最近抜け毛エグい\nストレスでハゲてるのか😭！？", "permalink": "https://www.threads.com/@zabee_l.28/post/DbiCauCkRpH", "likes": 7, "velocity": 0.01, "ageHours": 733.6, "postedAt": "2026-08-02T17:57:38+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3958359554655956265", "username": "usuge_matome", "text": "頭皮って、強く洗わなくて大丈夫です。\n\nやりがちな洗い方と、頭皮にやさしい洗い方を4つ並べてみました。", "permalink": "https://www.threads.com/@usuge_matome/post/Dbu6wrsiq0p", "likes": 7, "velocity": 0.01, "ageHours": 613.6, "postedAt": "2026-08-07T18:00:52+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3951969546941419165", "username": "ca_youna", "text": "頭皮の臭い匂い撲滅！！！\n\nアラサーの皆様、頭皮こすってみたら臭ったり\n頭皮がかゆくなったりしていない？\n毎日髪をきつくしばるCAだからこそ、髪の毛、頭皮の治安が悪化して、実際に使って改善した頭皮ケアを皆様に共有します！地肌から整えると顔色までよくなるよ！", "permalink": "https://www.threads.com/@ca_youna/post/DbYN11Qms6d", "likes": 7, "velocity": 0.01, "ageHours": 825.2, "postedAt": "2026-07-29T22:25:03+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3958384025032021383", "username": "yururu.selfcare", "text": "40代後半から「髪が細くなった」「抜け毛が増えた」は更年期の典型的な変化。でも頭皮だけをケアしようとすると、根本を外す。エストロゲンが減ると頭皮への血流が変わって、毛母細胞に届く栄養が変わる。シャンプーや育毛剤を変えても変わらない人は、血流から見直すタイミングかもしれないんだけど、", "permalink": "https://www.threads.com/@yururu.selfcare/post/DbvAUxgnVWH", "likes": 7, "velocity": 0.01, "ageHours": 612.8, "postedAt": "2026-08-07T18:49:29+09:00", "genres": ["育毛", "薄毛"], "keywords": ["抜け毛 対策", "薄毛 対策"]}, {"id": "3957015352307198023", "username": "the.2nd_star", "text": "縮毛矯正ってどのくらい髪痛む？？\nカラー入りにくくなったり髪乾きずらくなったりするかな", "permalink": "https://www.threads.com/@the.2nd_star/post/DbqJH9tCahH", "likes": 7, "velocity": 0.01, "ageHours": 658.1, "postedAt": "2026-08-05T21:30:10+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3939597789609340210", "username": "cherrypick_8183", "text": "‼️話題の\n「リードルショット」からヘア用が出てて、即ゲットしちゃった😂✨\nブラシ付きだから手を汚さずに頭皮ケアできるのが、\n忙しい毎日には本当にありがたい🥹💆‍♀️\n抜け毛対策も今のうちから始めようと思う✨", "permalink": "https://www.threads.com/@cherrypick_8183/post/DasQ1EXlC0y", "likes": 7, "velocity": 0.01, "ageHours": 1234.9, "postedAt": "2026-07-12T20:44:35+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3949431610433236071", "username": "claw.cats.resort", "text": "茶トラ猫のちゃちゃちゃん🐈🧡\n\n今日は家族猫ちゃんの付き添い…\nのはずが、まさかのシャンプーデビュー🤭💕\n\n「えっ！？今日は付き添いって聞いてたよー！」\nそんな声が聞こえてきそうなくらい、お手入れは全力でイヤイヤ😂\n\nでも、いざシャンプーが始まると…\n「あれ？なんだか気持ちいいかも…❤️」\n\n終わる頃にはスッキリふわふわ✨\nとっても可愛いちゃちゃちゃんでした🥰\n\n頑張ってくれてありがとう😊\nまた遊びに来てね♪\n\n🐾 「うちの子、シャンプーできるかな？」\nそんな飼い主様も大丈夫✨\n猫ちゃんの性格に合わせて、できるだけ負担の少ないグルーミングを心がけています😊\n\n📩 ご予約・お問い合わせはDMまたは公式LINEからお気軽にどうぞ♪\n換毛期のお手入れ・皮脂汚れ・抜け毛対策のご予約も受付中です🐈🫧\n\n#猫シャンプー \n#茶トラ \n#猫専門サロン \n#猫トリミング \n#トリミング", "permalink": "https://www.threads.com/@claw.cats.resort/post/DbPMx_skmxn", "likes": 7, "velocity": 0.01, "ageHours": 909.2, "postedAt": "2026-07-26T10:22:40+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3964854656144932556", "username": "yohei1130", "text": "TXガソリン車5人乗り\nボディリフト4インチリフトアップ\nラフカン6インチリフトアップ\n計10インチリフトアップ\n37インチタイヤ\nサンルーフ有\nバックフォグ有\n\n実走行16000キロ\nワンオーナー\n車検令和9年４月\n\nいくらなら出しますか？", "permalink": "https://www.threads.com/@yohei1130/post/DcF_k2Vkn7M", "likes": 7, "velocity": 0.02, "ageHours": 398.5, "postedAt": "2026-08-16T17:05:28+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3851817834803983628", "username": "sinkyuins2", "text": "つむじ薄毛の方を\n5回鍼灸で治療✨\n\n劇的な発毛ではないですが\nつむじの地肌の面積は\n少し減りました🍀\n\n頭皮に直接鍼をして血流を良くし、\n手足のツボも使いながら\n自律神経を整えて\n\n髪が生えやすい環境を作っていきます🍀", "permalink": "https://www.threads.com/@sinkyuins2/post/DV0Z-m3AXUM", "likes": 7, "velocity": 0.0, "ageHours": 4141.6, "postedAt": "2026-03-13T18:01:29+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3945947716446524830", "username": "o_dai_o_dai", "text": "断言するけど、薄毛で一番の犯人はシャンプーじゃない。前髪やつむじが気になる人ほど、真っ先に育毛剤と頭皮マッサージを始める。でも止まらない。じゃあ何が原因か。頭皮の表面ではなく、毛根で髪が細くなっていることが多い。", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbC0oqlDxWe", "likes": 6, "velocity": 0.01, "ageHours": 1024.6, "postedAt": "2026-07-21T15:00:45+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "つむじ 薄毛"]}, {"id": "3863169070821183460", "username": "8181.asobana", "text": "50代女性、\nトップの薄毛で悩んでます😭\n\n全体はまだ大丈夫なんですが、つむじ〜分け目あたりが気になってきて💦\n\nレディースウィッグ（特に部分用・ヘアピース）を探してるんですが、\nネットで調べても種類が多すぎて\nどれがいいのか分からず…\n\n「エクステシートタイプ（約28,000円）」が気になってたんですが在庫切れでした🥲\n\nできれば\n・お財布に優しめ\n・装着が簡単\n・今ある髪に負担が少ない\n・できれば手入れも楽\n\nこんな感じのウィッグやヘアピースで\n「これ良かったよ！」っていうのがあれば教えてほしいです🙏\n\n実際に使ってる方のリアルな感想も聞きたいです✨", "permalink": "https://www.threads.com/@8181.asobana/post/DWcu81Nko_k", "likes": 6, "velocity": 0.0, "ageHours": 3765.7, "postedAt": "2026-03-29T09:54:22+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛", "薄毛 対策"]}, {"id": "3958339096946684226", "username": "biyou_mochi", "text": "炎上覚悟で言います。「頭皮マッサージ」はマジでヤバい習慣です。高いリフトアップ美容液買い替えてきて、頭皮マッサージの恐ろしさにようやく気づいた。\n何が恐ろしいかというと、", "permalink": "https://www.threads.com/@biyou_mochi/post/Dbu2G--DDFC", "likes": 6, "velocity": 0.01, "ageHours": 614.3, "postedAt": "2026-08-07T17:20:13+09:00", "genres": ["フェイシャル", "育毛"], "keywords": ["リフトアップ", "頭皮マッサージ"]}, {"id": "3885258187575591083", "username": "kounenki___chan", "text": "信じられないけど、ワイは「ウカ スカルプブラシ」より「満天社 ハンドプロ」を毎日欠かさない。トレンドの、頭皮臭対策にはもちろんウカなんだけど、", "permalink": "https://www.threads.com/@kounenki___chan/post/DXrNbyTHwCr", "likes": 6, "velocity": 0.0, "ageHours": 3034.2, "postedAt": "2026-04-28T21:21:30+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3907337910302656782", "username": "mika_no_tsubuyaki", "text": "東京都中央区銀座で\nフェイシャルエステのセラピストしてます！", "permalink": "https://www.threads.com/@mika_no_tsubuyaki/post/DY5pyChAckO", "likes": 6, "velocity": 0.0, "ageHours": 2303.1, "postedAt": "2026-05-29T08:29:58+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3945513420242020080", "username": "wasakaragram", "text": "高周波種類ありすぎどれがいいのか🥺\nソフウェーブが非常に気になるが痛そうだし高いな〜\nザーフも気になるけど通ってるクリニックにはまだ導入されてないので、まずはボルニューマを予約してみた！\nたるみ改善したい〜🥺", "permalink": "https://www.threads.com/@wasakaragram/post/DbBR40uD-bw", "likes": 6, "velocity": 0.01, "ageHours": 1039.0, "postedAt": "2026-07-21T00:37:53+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3911105535332688298", "username": "sana_oniku", "text": "ずっと品切れだった毛穴洗浄をようやくゲット。使ってみたら、鼻の黒ずみがすっきりして洗い上がりに感動した…✨\nこれ使ったことある人いますか？皆さんの毛穴ケアのおすすめも知りたいです！", "permalink": "https://www.threads.com/@sana_oniku/post/DZHCcMwkaGq", "likes": 6, "velocity": 0.0, "ageHours": 2178.3, "postedAt": "2026-06-03T13:15:39+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3903433002685469048", "username": "fusafusa_gingin", "text": "ゾッとした。AGAを5年治療していた先輩が「副作用が怖くなってフィナステリドをやめた」と言っていた。その後どうなったか聞いてみたら、", "permalink": "https://www.threads.com/@fusafusa_gingin/post/DYrx6J5mpF4", "likes": 6, "velocity": 0.0, "ageHours": 2432.4, "postedAt": "2026-05-23T23:11:36+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3951505021833800246", "username": "tokyo.hyhyakn", "text": "最近相談されるけど薄毛ってしんどいよな😓同じに悩みの人いる？", "permalink": "https://www.threads.com/@tokyo.hyhyakn/post/DbWkOGik2o2", "likes": 6, "velocity": 0.01, "ageHours": 840.6, "postedAt": "2026-07-29T07:02:08+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3974026599414803572", "username": "cheetah.2381256", "text": "ハイフってどうなんだろ？\n一般人でやった事ある人っている？？\n\nAbemaTV見てたらEXITの人がやってる！って言ってて\n切らないでリフトアップできるんだよね？私もやってみたいなー！\n\nでもきっとデメリットもあるよね？\n🥺", "permalink": "https://www.threads.com/@cheetah.2381256/post/DcmlCMKEqx0", "likes": 6, "velocity": 0.06, "ageHours": 94.8, "postedAt": "2026-08-29T08:48:29+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3945404087814795321", "username": "o_dai_o_dai", "text": "薄毛治療10年以上やって気づいた。\nホントにやめたほうがいいのは、「スカルプシャンプー」や「育毛剤」ではなくて、", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbA5B09kzA5", "likes": 5, "velocity": 0.0, "ageHours": 1042.6, "postedAt": "2026-07-20T21:00:40+09:00", "genres": ["薄毛", "育毛"], "keywords": ["薄毛 対策", "抜け毛 対策", "つむじ 薄毛"]}, {"id": "3964640865481275240", "username": "o_dai_o_dai", "text": "実際にやって良かった薄毛対策10選😳\n\n・10位：月1で前髪とつむじを撮影\n（毎日の鏡より変化が分かる）\n・9位：抜け毛の本数を数えない\n（短く細い毛を見る）\n・8位：高級シャンプー探しをやめる\n（AGA治療とは別物）\n・7位：タンパク質・鉄・亜鉛を不足させない\n（髪の土台）\n・6位：個人輸入をやめる\n（薬は医師に相談できる環境で）\n・5位：外用ミノキシジルを用法どおり使う\n（多く塗っても早く生えない）", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DcFO9yRAjdo", "likes": 5, "velocity": 0.01, "ageHours": 405.6, "postedAt": "2026-08-16T10:00:42+09:00", "genres": ["薄毛", "育毛"], "keywords": ["つむじ 薄毛", "抜け毛 対策"]}, {"id": "3936372328049802326", "username": "sana_oniku", "text": "紗栄子さんや小田切ヒロさんが推してたプライマー使ってみたら、鼻の毛穴が隠れて感動した✨\n肌の凸凹をきれいに埋めてくれる感じがします。\nみなさんが手放せないお気に入りの化粧下地ってありますか？", "permalink": "https://www.threads.com/@sana_oniku/post/DagzcbNFfxW", "likes": 5, "velocity": 0.0, "ageHours": 1341.7, "postedAt": "2026-07-08T09:56:15+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3962804029931859326", "username": "chii_gokigen_na_kurashi", "text": "ちょっとーー！！バズってる無印のコームすごすぎる！！\nこれで頭皮マッサージしたら、翌朝のむくみがマシになった✨\n効果的な使い方は", "permalink": "https://www.threads.com/@chii_gokigen_na_kurashi/post/Db-tUT2ky1-", "likes": 5, "velocity": 0.01, "ageHours": 466.4, "postedAt": "2026-08-13T21:11:14+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ", "頭皮ケア"]}, {"id": "3937714600641030596", "username": "1253252aaa", "text": "薄毛に悩んでる方に聞きたいんですけど、\n今現在使ってる発毛剤とかありますか？\nまた効果は実感しましたか？", "permalink": "https://www.threads.com/@1253252aaa/post/DalkpD-E-nE", "likes": 5, "velocity": 0.0, "ageHours": 1297.2, "postedAt": "2026-07-10T06:23:01+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3948240956009514395", "username": "dot_tattoo_artist", "text": "ごめんなさい…。\n一生言い続けます。本気で薄毛を防ぎたいなら、これやってください。", "permalink": "https://www.threads.com/@dot_tattoo_artist/post/DbK-DsWmIWb", "likes": 5, "velocity": 0.01, "ageHours": 948.6, "postedAt": "2026-07-24T18:57:01+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策", "つむじ 薄毛"]}, {"id": "3959035272826628297", "username": "aska_ito", "text": "薄毛や抜け毛が気になっている女性で、\n意外と足りていないことが多い栄養素。\n\nそれは…", "permalink": "https://www.threads.com/@aska_ito/post/DbxUZrSEqjJ", "likes": 5, "velocity": 0.01, "ageHours": 591.2, "postedAt": "2026-08-08T16:23:23+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3968744709703266804", "username": "kitemlab", "text": "一晩貼って寝るだけで、翌朝の鏡が楽しみになるなんて思わなかった。正直、ほうれい線が目に見えて薄くなっててマジで感動したんだよね。「最近疲れてる？」って言われなくなるだけで、こんなに自信が持てるんだね。", "permalink": "https://www.threads.com/@kitemlab/post/DcT0ElCEvH0", "likes": 5, "velocity": 0.02, "ageHours": 269.7, "postedAt": "2026-08-22T01:54:18+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3965140650216892924", "username": "key_kun_mom", "text": "もうすぐ1歳半になる娘が見事な薄毛です。\n早生まれなので七五三は満3歳でやればあと2年ちょっと猶予があるとは思いつつ、これほどまでに薄毛ガールはいつになったら髪の毛伸びてくるもんなんでしょうか？\n似たようや薄毛ガールの方の情報教えて欲しいです！", "permalink": "https://www.threads.com/@key_kun_mom/post/DcHAmnEo6n8", "likes": 4, "velocity": 0.01, "ageHours": 389.0, "postedAt": "2026-08-17T02:33:41+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3957024109753863483", "username": "official_paramiclinic", "text": "同一人物です。\n変わったのは、生え際だけ🌸\n\n#植毛 #AGA #薄毛治療 #ビフォーアフター", "permalink": "https://www.threads.com/@official_paramiclinic/post/DbqLHZtiQ07", "likes": 4, "velocity": 0.01, "ageHours": 657.8, "postedAt": "2026-08-05T21:47:34+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3974338122259557934", "username": "masa.agabye", "text": "ハゲたくないならこれ覚えとけ10選👊\n\n① 抜け毛だけ見るな。毛の細さも見ろ\n② AGAは進行性。様子見はおすすめしない\n③ DHTは覚えとけ。AGAに関わる男性ホルモン\n④ フィナは進行を抑える薬。DHTの生成を抑える\n⑤ デュタは作用範囲が広い。フィナとの違いはここ\n⑥ ミノキは発毛を促す。フィナとは役割が違う\n⑦ 育毛と発毛は別だ。ごっちゃにするな\n⑧ シャンプーだけに期待するな。AGA治療とは別物\n⑨ 遺伝でも諦めるな。親父の頭＝お前の未来じゃない\n⑩ 薬は自己判断するな。医師と相談して決めろ\n\n今年こそハゲ辞めるぞ", "permalink": "https://www.threads.com/@masa.agabye/post/Dcnr3caku4u", "likes": 4, "velocity": 0.05, "ageHours": 84.5, "postedAt": "2026-08-29T19:07:25+09:00", "genres": ["薄毛", "育毛"], "keywords": ["AGA", "発毛"]}, {"id": "3960653623860373756", "username": "momo_biyo321", "text": "バズってるこれ。毛穴消えるでお馴染みらしいけど正直に言うね。「一瞬で毛穴消えて神〜」はごめんけどない🙅🏻でもね…", "permalink": "https://www.threads.com/@momo_biyo321/post/Db3EXyIj6j8", "likes": 4, "velocity": 0.01, "ageHours": 537.6, "postedAt": "2026-08-10T21:58:46+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3967000691760349439", "username": "mimi2025jewelry", "text": "今までずっとハイトーン派で\nブリーチやめて髪質改善方向へきて数年\n最近白髪マジで増えてきて😨\nカラーしても1ヶ月持たないし‥‥\n\nでもめちゃくちゃ癖毛だし髪質改善して\n髪綺麗なったし🤔\nどっちを優先すべきなのか🥹\n\n来年50代突入だし🫨\nめちゃくちゃ悩むところ😮‍💨\n\nみんなはどんな感じ？？", "permalink": "https://www.threads.com/@mimi2025jewelry/post/DcNnhxwGsD_", "likes": 4, "velocity": 0.01, "ageHours": 327.4, "postedAt": "2026-08-19T16:09:15+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3945536592672966072", "username": "ms0101n", "text": "産後の抜け毛がすっごい。ハゲてる絶対😭\nお風呂場と髪の毛乾かした時すっごい。\n部屋中抜け毛だらけですっごい。\nこれいつ頃落ち着くのでしょうか🥹", "permalink": "https://www.threads.com/@ms0101n/post/DbBXKBuk8W4", "likes": 4, "velocity": 0.0, "ageHours": 1038.2, "postedAt": "2026-07-21T01:23:55+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3909986649644187846", "username": "ham__yur", "text": "あの、、、まじで声を大にして言わないといけないことがありまして、、頭皮マッサージとかしてない人ほんと顔たるむんで、まじでこれ使ってほしい、、テレビで女優さんが使ってたやつなんですけどほんとこういうのが1番いいぞ…", "permalink": "https://www.threads.com/@ham__yur/post/DZDECRQj8DG", "likes": 4, "velocity": 0.0, "ageHours": 2215.4, "postedAt": "2026-06-02T00:12:32+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3949405248637032355", "username": "chizureen", "text": "髪🪮　血行促進　頭皮マッサージ", "permalink": "https://www.threads.com/@chizureen/post/DbPGyYXEtej", "likes": 4, "velocity": 0.0, "ageHours": 910.1, "postedAt": "2026-07-26T09:30:15+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3958195644905738254", "username": "yumi.twins02", "text": "髪の毛かき集めたツインテール（？）", "permalink": "https://www.threads.com/@yumi.twins02/post/DbuVfe2GtAO", "likes": 4, "velocity": 0.01, "ageHours": 619.0, "postedAt": "2026-08-07T12:35:12+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3952375987086396397", "username": "miiii.2598", "text": "薄毛なのにぃーーーー\nハゲてきた😭😭\nとりあえず枕にシルクカバーつけたけど😭\n女の子なのに😭😭\n対策ありますか？", "permalink": "https://www.threads.com/@miiii.2598/post/DbZqQUJEYvt", "likes": 4, "velocity": 0.0, "ageHours": 811.7, "postedAt": "2026-07-30T11:52:35+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3899708760751567882", "username": "oyausuge", "text": "頭皮マッサージは、\nやればやるほど\n逆効果になることがあります。\n\n触りすぎる頭皮は、", "permalink": "https://www.threads.com/@oyausuge/post/DYejHTUE3QK", "likes": 4, "velocity": 0.0, "ageHours": 2555.7, "postedAt": "2026-05-18T19:52:12+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3961172200761926796", "username": "eeeeen.faaaam", "text": "毛穴おだまりクリームってどうなってんの？\nなんで毛穴消滅するの！！？\n毛穴に比べて気にならなかったシミが気になるようになってきた🤣", "permalink": "https://www.threads.com/@eeeeen.faaaam/post/Db46SEgkSSM", "likes": 4, "velocity": 0.01, "ageHours": 520.4, "postedAt": "2026-08-11T15:09:05+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3962838810660904009", "username": "non.biyouu", "text": "女性の薄毛って男性みたいに前頭部からごっそり後退するパターンは少なくて、実はほとんどの人がまず頭頂部の分け目からじわじわ進行するらしい。初期サインは抜け毛の本数が増えることより先に、1本1本の髪が細くなること。分け目が広がって地肌が透けて見えるようになった時点で、実はけっこう進行してるサインらしくて、これ知った時ゾッとした。しかも自分では毎日鏡を見てるからこそ変化に気づきにくくて、はっきり気づいた時にはもう分け目全体が薄くなってるパターンが多い。", "permalink": "https://www.threads.com/@non.biyouu/post/Db-1Ob7kxxJ", "likes": 4, "velocity": 0.01, "ageHours": 465.3, "postedAt": "2026-08-13T22:20:20+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3961138022981494974", "username": "emyi.02", "text": "え、これ同一人物…？😳\n自分でも写真並べてびっくりした。\n\n毎日ケア＋スペシャルケアを続けてたら、\n肌にハリ感が出てきて\n気になってたほうれい線までなんか違う…！✨\n\n毛穴汚れもスッキリして、キメもなめらかに。\nツヤ・透明感も出てきた気がする🥹🤍", "permalink": "https://www.threads.com/@emyi.02/post/Db4ygt-Gui-", "likes": 4, "velocity": 0.01, "ageHours": 521.6, "postedAt": "2026-08-11T14:01:11+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3976203907399607229", "username": "iemny_ja12", "text": "なんか前回、林道を久しぶりに走ってからなんか目覚めたイエムニーす\n⁡\n外見、内装あーしよこーしよみたいな\n考えがあった私です\n⁡\n久しぶりに林道走って\nやっぱり私のジムニーは\n悪路走ってこそのジムニーだと\n思いました☺️\n⁡\n悪路を走るドキドキ感が\n正直、勃起しそうになりました\n⁡\n女子、すいません\n⁡\nでも、この興奮こそが\nビンビンに来るアレと\n一緒で大興奮でした\n⁡\nこの車壊すと思うけど\n大事に乗るからね♡\n⁡\n#Jimny\n#ジムニー\n#ja12\n#jb23\n#jb64リフトアップ", "permalink": "https://www.threads.com/@iemny_ja12/post/DcuUGMPEuO9", "likes": 4, "velocity": 0.18, "ageHours": 22.7, "postedAt": "2026-09-01T08:54:24+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3957849577261012925", "username": "sak_i00511", "text": "元々長年コンプレックスでどうやっても生えてこなかったM字ハゲが、ケア頑張ってるおかげか2ヶ月も経ってないのにかなり良くなってきた気がする🤔\nなんかおでこの生え際も産毛が健やかに育ってきてフサフサしてきた🌱\nでも未だに産後の抜け毛全然治らんの悲しい", "permalink": "https://www.threads.com/@sak_i00511/post/DbtGziPEpe9", "likes": 4, "velocity": 0.01, "ageHours": 630.5, "postedAt": "2026-08-07T01:07:38+09:00", "genres": ["薄毛", "育毛"], "keywords": ["薄毛 対策", "抜け毛 対策"]}, {"id": "3976556784479935854", "username": "soracoromai", "text": "抗がん剤TC療法ラストケモからちょうど半年くらい\n頭部冷却は自己流で、前頭葉部分が発毛しにくいと聞いてたから重点的に冷却\n効果出てるかわからないけど、半年でこのくらいは普通なのかな？\nベリーショートならいけそうかも\n皆さんいかがでしたか？", "permalink": "https://www.threads.com/@soracoromai/post/DcvkVOoGJ1u", "likes": 4, "velocity": 0.36, "ageHours": 11.0, "postedAt": "2026-09-01T20:35:30+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3967904305457883229", "username": "miwa.electronic38", "text": "10月で39歳になります。\n夏場は汗かいて毛がまとまると毛が細いのでちらかります。\nAGA治療を考えてます。\n\nこんなとこでこんな醜態晒すのもどうかと思いますが、Threads民は優しいと評判なので教えて下さい！\n\n現在ペソッド使ってます！\n令和の虎のやつです！\nピンクのやつ！\n効能はよくわかってません！\n\n飲み薬を考えてます。\nいいのないですか😭\nボサボサになりたいです🫣😅😭🤣🫣😭", "permalink": "https://www.threads.com/@miwa.electronic38/post/DcQ0_Flj2hd", "likes": 4, "velocity": 0.01, "ageHours": 297.5, "postedAt": "2026-08-20T22:04:35+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3947971002407333380", "username": "o_dai_o_dai", "text": "早く知ればよかった薄毛対策↓\n\n🥉論外（金ドブになりやすい）\n・高いだけのスカルプシャンプー\n・根拠の弱い発毛サプリ\n・頭皮を強く刺激するマッサージ器\n\n🥈惜しい（悪くないけど役割が違う）\n・低刺激シャンプー\n・亜鉛やビオチンのサプリ\n・育毛トニックの単品使い\n・頭皮用美容液だけ\n・タンパク質を意識した食事\n\n🥇ガチで将来に差がつく対策", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbKArWeCC4E", "likes": 3, "velocity": 0.0, "ageHours": 957.6, "postedAt": "2026-07-24T10:00:40+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3935068598268699007", "username": "firstpenguin_is", "text": "最近「髪ツヤツヤだね」って言われること増えたんだけど、絶対これのおかげだと思う✨\n以前は朝起きるたびに枕見て落ち込んでたのに、今はボリュームも出てきて\n\n同じ悩みあった人いる？もっと早く出会いたかったやつ", "permalink": "https://www.threads.com/@firstpenguin_is/post/DacLAqOmaF_", "likes": 3, "velocity": 0.0, "ageHours": 1384.8, "postedAt": "2026-07-06T14:45:53+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3953834512312565986", "username": "days_mo_ni", "text": "高いオイルもバームも何使っても癖毛大ボリュームヤチボウズハグリッドになってたんだけど\n同じく癖毛の子に相談したら「ベビーオイルがいいよ〜」って教えてもらって。\nお風呂後に揉み込んで寝たら\n朝起きてまとまりすぎてて感動した😭😭(寿司がアフターね)\n頑張って伸ばせそう〜", "permalink": "https://www.threads.com/@days_mo_ni/post/Dbe14pnEgDi", "likes": 3, "velocity": 0.0, "ageHours": 763.4, "postedAt": "2026-08-01T12:10:24+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3966416118433329123", "username": "yasunari_akiba_peace", "text": "ペロリコオススメです。\n使ってみてください。\n発毛クリニックでも使われてる世界的特許の機能性ペプチドを高配合されてるシャンプー、コンディショナー、育毛剤です。\n当店でも90%以上のお客様にしっかりとした効果があります。\nお近くに取り扱いの理美容室があれば1度ご相談してみて下さい。", "permalink": "https://www.threads.com/@yasunari_akiba_peace/post/DcLinHami_j", "likes": 3, "velocity": 0.01, "ageHours": 346.8, "postedAt": "2026-08-18T20:47:49+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3906998884375885979", "username": "festa201206", "text": "「毛穴消えるわよぉ〜」って\n小田切ヒロさんの聞いて即ポチ。🥹\nこれ当たりだった…。\n1ヶ月続けたらお肌つるんつるん。w\n毛穴ケアって、こーゆー事ね。", "permalink": "https://www.threads.com/@festa201206/post/DY4cskBEnib", "likes": 3, "velocity": 0.0, "ageHours": 2314.3, "postedAt": "2026-05-28T21:16:23+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3970626307495381579", "username": "nori_jinsei_lab", "text": "AGA治療、始めて1年3ヶ月経過。", "permalink": "https://www.threads.com/@nori_jinsei_lab/post/Dcaf5biFUpL", "likes": 3, "velocity": 0.01, "ageHours": 207.4, "postedAt": "2026-08-24T16:12:52+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3973970177821925130", "username": "o_dai_o_dai", "text": "お願いですから、メモってください。 \n薄毛治療10年以上、育毛剤でかなり遠回りした俺からのお願いです。\n\n・育毛剤は「AGAの進行を止める薬ではありません」\n・育毛シャンプーは「頭皮を洗うもの。発毛治療ではありません」\n・頭皮マッサージは「気持ちいい。でもAGA治療の代わりにはなりません」\n・亜鉛サプリは「不足を補うもの。AGAを治すものではありません」\n・フィナステリドは「AGAの進行を抑える“守り”です」\n・デュタステリドは「作用範囲が違う“守り”の選択肢です」\n・外用ミノキシジルは「", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DcmYNJdEl8K", "likes": 3, "velocity": 0.03, "ageHours": 96.7, "postedAt": "2026-08-29T06:56:23+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3964920156567757171", "username": "aru.pska.no.suke", "text": "AGAの治療したいんだけど、トランスジェンダーで毎月男性ホルモン注射打ちながらって意味あるんかな....", "permalink": "https://www.threads.com/@aru.pska.no.suke/post/DcGOeAXAeFz", "likes": 3, "velocity": 0.01, "ageHours": 396.3, "postedAt": "2026-08-16T19:15:36+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3887433089312117504", "username": "sacchan_moto_biyou", "text": "小田切ヒロ様が「毛穴消えるわよ〜！！！」って言ってたクレンジング、黒ずみ＆角栓まとめて崩壊した。1回で変化出るのに、使い続けたら毛穴どこ？状態。これで2000円以下は意味わからん。", "permalink": "https://www.threads.com/@sacchan_moto_biyou/post/DXy78xYjFMA", "likes": 3, "velocity": 0.0, "ageHours": 2962.2, "postedAt": "2026-05-01T21:22:38+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3864961581343943305", "username": "akari_scalp_sleep", "text": "抜け毛、薄毛で悩む方へ。美容師歴18年の私が、頭皮を見続けて気づいたこと10選", "permalink": "https://www.threads.com/@akari_scalp_sleep/post/DWjGhSuiaqJ", "likes": 3, "velocity": 0.0, "ageHours": 3706.3, "postedAt": "2026-03-31T21:15:46+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3955149705345416087", "username": "salon_bluete", "text": "髪を明るくしたとたん、顔がぼやけて見えるようになった方。美容室の色が悪かったのではありません。髪は、顔のすぐ横にあるいちばん面積の大きい色です。ここを動かすと顔の印象がまるごと変わります。効いているのは、", "permalink": "https://www.threads.com/@salon_bluete/post/Dbjg7OkmruX", "likes": 3, "velocity": 0.0, "ageHours": 719.9, "postedAt": "2026-08-03T07:43:35+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3856276255931331587", "username": "ngmyuka", "text": "産後抜け毛もびびったけど、9ヶ月にして。頭皮のかゆみとフケ。、(汚、すいません💦)まじで聞いてない✋💫💫\nシャンプー薬用とかにしたら効果あるのかな。、？？😭\n頭皮で悩んだこととかないって✋。。、", "permalink": "https://www.threads.com/@ngmyuka/post/DWEPtLGj3QD", "likes": 3, "velocity": 0.0, "ageHours": 3993.9, "postedAt": "2026-03-19T21:39:34+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3940253102187818655", "username": "datsumo_science", "text": "★★脱毛初心者向け、その4★★\n\n「10回コース中残り2回。毎回あまり抜けずに普通に生えてきます。少し毛が柔らかくなって、生えるペース遅くなってきたけど、あと1回で本当に毛が減るのか不安です。」\n↑\nこれは手遅れ、", "permalink": "https://www.threads.com/@datsumo_science/post/Daul1HxCS6f", "likes": 3, "velocity": 0.0, "ageHours": 1213.2, "postedAt": "2026-07-13T18:26:34+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3884909349173334006", "username": "lily.bihouse", "text": "まっっっっっじで続けててよかったーーーーー\nと思ったアラサー続けててよかったNo1！！！！\n\nマツパのお姉さんに\n「何使ってます？まつ毛綺麗ですね」って言われたまつ毛美容液！！！", "permalink": "https://www.threads.com/@lily.bihouse/post/DXp-HhOEg_2", "likes": 3, "velocity": 0.0, "ageHours": 3045.8, "postedAt": "2026-04-28T09:48:25+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3972242964609224572", "username": "berrie_luby", "text": "韓国のオリーブヤングで人気って聞いて使ってみたんだけど、\nこれ、続けて使ってたら\n産毛っぽい短い毛がふわっと見えるようになってきた気がする。\nやっぱりこういう頭皮ケアは継続が大事かも。", "permalink": "https://www.threads.com/@berrie_luby/post/DcgPe4zE898", "likes": 3, "velocity": 0.02, "ageHours": 153.9, "postedAt": "2026-08-26T21:44:43+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3943821416273790778", "username": "ly.kaiq", "text": "｢たるみ毛穴が酷くなってきたんです…｣そう皮膚科の先生に話したんだけど｢スキンケアならペプチドが入ってるのがいいけどこのブースターが最強でしかもね…｣って", "permalink": "https://www.threads.com/@ly.kaiq/post/Da7RK7Ok8c6", "likes": 3, "velocity": 0.0, "ageHours": 1095.0, "postedAt": "2026-07-18T16:36:10+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3953423519023459453", "username": "hari.kyu_tsumugi", "text": "髪の調子いいんです！\n\n「食べるアンチエイジング美容液」", "permalink": "https://www.threads.com/@hari.kyu_tsumugi/post/DbdYb6SEWx9", "likes": 3, "velocity": 0.0, "ageHours": 777.0, "postedAt": "2026-07-31T22:33:50+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3915741662005908105", "username": "kuruta_kun11", "text": "実はあまり知られてない。\n\n薄毛が気になる人ほど、\nAGA治療ばかり見ている。\n\nでも本音では、、、", "permalink": "https://www.threads.com/@kuruta_kun11/post/DZXgkuMD1KJ", "likes": 3, "velocity": 0.0, "ageHours": 2024.8, "postedAt": "2026-06-09T22:46:43+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3976567831697437993", "username": "pitalabo_japan", "text": "この間ふと横顔のフェイスラインみて、ギョッ😱😱としたので急いで超音波リフトしました。\n\n祭り前のかけこみ美容いかがでしょう？💜\n週1ペースでもOKなくらい優しい施術🙋‍♀️\n\nHIFUで顎裏の脂肪だいぶ減って油断してたら…😂😂\nたるみ、浮腫のもたつきはふいに登場して老けてみえるので嫌ですねぇ🤢\n\n#岸和田たるみ　#岸和田小顔　#痛みゼロ　\n#LDM #保湿　#しわ", "permalink": "https://www.threads.com/@pitalabo_japan/post/Dcvm1_JkjUp", "likes": 3, "velocity": 0.28, "ageHours": 10.6, "postedAt": "2026-09-01T20:57:27+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3976569428695266603", "username": "dr.sayakanagao", "text": "輪郭3点、頬脂肪吸収、鼻フルから4ヶ月！！\n\n顔がなくなるくらい\n小顔になりたかったから\nめちゃくちゃ嬉しい！！\n\nしんじ先生ありがとう🥹", "permalink": "https://www.threads.com/@dr.sayakanagao/post/DcvnNOeDzUr", "likes": 3, "velocity": 0.28, "ageHours": 10.6, "postedAt": "2026-09-01T21:00:38+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3960306316438628992", "username": "raaaaai.21", "text": "肌育てに精神的豊かさをともに育みながら\nハッピーホルモン放出中😆🩷\n寝起きの顔笑→のケア後は\n涙袋もぷっくりしてリフトアップ\nほっぺも上がったりなんせ艶がすごい😍🩷\nさてさてhealyの「つやめき」もやっていくよー🩷", "permalink": "https://www.threads.com/@raaaaai.21/post/Db11Zy5D2qA", "likes": 3, "velocity": 0.01, "ageHours": 549.1, "postedAt": "2026-08-10T10:28:44+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3921078652708670087", "username": "biyou.tama", "text": "ヒアルロン酸を考えてる人、全員読んで。美容ナース12年の私が見た症例を話す。頬にヒアルロン酸を3ccも入れていた患者さん。リフトアップ目的のつもりが、", "permalink": "https://www.threads.com/@biyou.tama/post/DZqeEKHEUqH", "likes": 3, "velocity": 0.0, "ageHours": 1848.1, "postedAt": "2026-06-17T07:30:22+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3913390761543049032", "username": "tachibana_wakahage", "text": "【薄毛の人によくある初期症状】\n\n1. 枕や排水溝の抜け毛が増えた\n2. 抜け毛の毛先が細い\n3. 抜け毛が短い\n4. なんとなく髪のボリュームか減った\n5. 前髪やつむじが透けて地肌か見える\n6. 髪の分け目がくっきりする\n7. 頭皮を揉んだ時に硬い\n8. 頭皮の皮脂が増えてベタつく\n9. 頭皮の臭いが気になる\n10. 髪のうねりやくせ毛が増えた\n\n3つ以上当てはまるなら\n薄毛が進行してる可能性があるかも…", "permalink": "https://www.threads.com/@tachibana_wakahage/post/DZPKCnhEZ9I", "likes": 3, "velocity": 0.0, "ageHours": 2102.7, "postedAt": "2026-06-06T16:55:54+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3962561635323706386", "username": "toiro_personal_salon", "text": "見えてる髪より、\n見えない頭皮。\n\n髪は毎日見てるのに、\n頭皮って意外と見てない。\n\nでも、\nきれいな髪を育てる土台は頭皮🌿\n\n「最近、髪の変化が気になる」\nその前に、頭皮を見てみませんか？", "permalink": "https://www.threads.com/@toiro_personal_salon/post/Db92NASD3wS", "likes": 3, "velocity": 0.01, "ageHours": 474.4, "postedAt": "2026-08-13T13:09:39+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3880031307468573493", "username": "noar_hairatelier", "text": "私が20代半ばで抜け毛で悩み、改善できた方法↓\n正直安心しました。", "permalink": "https://www.threads.com/@noar_hairatelier/post/DXYo-q3Dws1", "likes": 2, "velocity": 0.0, "ageHours": 3207.3, "postedAt": "2026-04-21T16:16:37+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3925082250320752128", "username": "kamonohasi.aga", "text": "怖い話。\n生え際が1cm後退したら、\n放置した証拠だ。\nちなみに\n\nただ、知らない奴が多くて、", "permalink": "https://www.threads.com/@kamonohasi.aga/post/DZ4sYK8jy4A", "likes": 2, "velocity": 0.0, "ageHours": 1715.5, "postedAt": "2026-06-22T20:04:48+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3955165887045281884", "username": "kirary_jewels", "text": "この程度で言わないほうが良いのかなと思いつつ、お金も払ったし…という気持ちで相談です\n\n昨日の夕方、初めての美容室へ行きました\nヘアカラーとヘアカット、トリートメント、ヘッドマッサージのコースで予約しました\n\n口コミがとても良かったので期待して行き、カットもマッサージも大満足で帰りました\n\nしかし、帰宅後に切ってもらった前髪を上げたところ、おでこの真ん中の生え際が染まっていないことに気が付きました\n（画像が見づらく申し訳ありません、恥ずかしいですが白髪画像付けました）\n\n細い毛なので染まりきらなかったのか、それとも塗り残しなのか、前髪は下ろすので多少染まらなくても問題視されないものなのか…？\n\n今日は美容室が休みで連絡が出来ない\u0026私は明日から義両親が泊まりに来るなど連日予定がびっしりで、そのためにも綺麗にしたくて、限られた時間の中で行ったのでどうしたら良いものか…\n\nこういった少しの白髪が残るのは致し方ないのでしょうか\nお店に連絡して、お盆明けなどに染めてもらうなどの対応はしていただけるものなのでしょうか？", "permalink": "https://www.threads.com/@kirary_jewels/post/Dbjkms9E6hc", "likes": 2, "velocity": 0.0, "ageHours": 719.3, "postedAt": "2026-08-03T08:15:37+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3961073548542286049", "username": "tsubasa.agataisaku", "text": "友人に撮ってもらった集合写真。\nいつもと違う角度から見た自分の生え際に、\n正直かなりゾッとした。\n\n「あれ、こんなに後退してたっけ」\n\nその日から今日まで、7年かかりました。\n\nこれから数回に分けて、\n薄毛に気づいてから今に至るまでの\nリアルな話をしていこうと思います。\n\n長くなるので、興味ある人だけ\nゆっくり読んでもらえたら嬉しいです🧵", "permalink": "https://www.threads.com/@tsubasa.agataisaku/post/Db4j2feDxjh", "likes": 2, "velocity": 0.0, "ageHours": 523.7, "postedAt": "2026-08-11T11:53:05+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3944620318039775049", "username": "non.biyouu", "text": "薄毛、気づいた時にはもう進んでる。これ、薄毛に悩んでる人にとって一番怖い現実。分け目が目立ってきた、つむじが透けて見える、抜け毛が増えた。そう感じ始めたら、今すぐ動いてほしい。", "permalink": "https://www.threads.com/@non.biyouu/post/Da-G0eejJdJ", "likes": 2, "velocity": 0.0, "ageHours": 1068.5, "postedAt": "2026-07-19T19:03:27+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "つむじ 薄毛"]}, {"id": "3936585794424861571", "username": "o_dai_o_dai", "text": "40代入ってヤバいくらい髪が薄くなった人いる？\n「前髪が割れるようになった」「つむじが白く透ける」「過去最高にセットが決まらない」などなど...\n同じ人が多いから原因を話すね。", "permalink": "https://www.threads.com/@o_dai_o_dai/post/Dahj-xQivOD", "likes": 2, "velocity": 0.0, "ageHours": 1334.6, "postedAt": "2026-07-08T17:00:17+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3901094220890448589", "username": "usuge_cut_kurita", "text": "つむじハゲのカットはブロッキングがめちゃ大事！\n毛流れに合わせて切ったらこうならない。\n美容師はキレイにコーミングして切っちゃうから薄毛の人が切れない。", "permalink": "https://www.threads.com/@usuge_cut_kurita/post/DYjeIZngSLN", "likes": 2, "velocity": 0.0, "ageHours": 2509.9, "postedAt": "2026-05-20T17:44:52+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3929287258855961203", "username": "o_r_i__sa", "text": "朝アイロンしても、数十分したらうねり出し、すぐにこうなります。\n産後１年経っているので生えてきた毛が短い毛が内側にあります。\nそしておでこの生え際につむじが有り、立ち上がる癖があります。\n前髪を伸ばしてたのですが、産後の抜け毛からの伸びてきた毛が嫌過ぎて前髪を切ってしまい扱いがしづらくて悩んでます。\n前髪ストレートパーマかければ解消しますか？\nもし解決するならストレートパーマをかけたいのですが、\nつむじがある場合、立ち上がるのが強過ぎてストレートかけたら尚更立ち上がってしまいますか？\n朝にあまり自分に時間をかけたくないため、ストレートかけるか悩んでます。\n先月美容室行ったばかりだし、まだ産後でなかなか時間が取れないため美容室で質問もできず、もしスレッズでわかる方がいれば…と質問しています。\nよろしくお願いします。", "permalink": "https://www.threads.com/@o_r_i__sa/post/DaHofGUk_Jz", "likes": 2, "velocity": 0.0, "ageHours": 1576.3, "postedAt": "2026-06-28T15:19:24+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3916245030018163288", "username": "hairofseoul_jp", "text": "こちらは非切開植毛（FUE法）で3,200毛を移植し、1年後の経過を撮影したお写真です🌿\n\n元々の髪の流れに合わせ、違和感のない自然なヘアラインに仕上げました✨\n\n非切開は切らない手術のため、ダウンタイムも短く、施術後すぐの日常生活もOK！\n\nまた、出血や痛みも少なく、手術への負担も少ないので安心です😊\n\n負担の少ない非切開植毛で、自然なヘアラインを試してみませんか❓\n\n＃植毛 ＃自毛植毛 ＃薄毛 ＃つむじ ＃韓国アートメイク", "permalink": "https://www.threads.com/@hairofseoul_jp/post/DZZTBsLnyJY", "likes": 2, "velocity": 0.0, "ageHours": 2008.2, "postedAt": "2026-06-10T15:26:50+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3872563938756619916", "username": "akari_scalp_sleep", "text": "9割の人が知らない。髪がペタっとしてボリュームが出ないのは、脳のオーバーヒートが原因", "permalink": "https://www.threads.com/@akari_scalp_sleep/post/DW-HGJzk26M", "likes": 2, "velocity": 0.0, "ageHours": 3454.6, "postedAt": "2026-04-11T09:00:17+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3913273380674089271", "username": "kogao.aya.okayama", "text": "抜け毛が増えてきて、落ち武者感が増してきた。\n\n40代になってから、\n髪のボリュームが減った気がする。\n\n分け目は目立つし、\n鏡を見るたびに悲しい\n\nそれが解決できる唯一の方法が", "permalink": "https://www.threads.com/@kogao.aya.okayama/post/DZOvWgEEjE3", "likes": 2, "velocity": 0.0, "ageHours": 2106.6, "postedAt": "2026-06-06T13:02:41+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3958812231022379451", "username": "usuge_matome", "text": "妊娠中の女性が、パートナーのAGA治療薬に触れてしまったとき。\n慌てなくていい場合と、気をつけたい場合があります。", "permalink": "https://www.threads.com/@usuge_matome/post/Dbwhr_aj4G7", "likes": 2, "velocity": 0.0, "ageHours": 598.6, "postedAt": "2026-08-08T09:00:15+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3974368208588711256", "username": "masa.agabye", "text": "俺はM字ハゲでした\n\n20代後半、「ん？デコ広くなってね？」\nから俺の薄毛人生がスタート。\n\nそこから色々試した。アホみたいに金も使った。\n検索も死ぬほどした。そして普通に遠回りした。\n\n現在はAGA治療5年目。\n\nだからここでは昔の俺が知りたかったことを全部置いていく。\n\nAGAの知識も実際に試した薄毛対策も\n微妙だったものは微妙って言う。\n\n最近、生え際が怪しい。\nでも何すりゃいいか分からん。\n\nそんな奴はついてこい。\n俺が先に失敗しといたからな！！！", "permalink": "https://www.threads.com/@masa.agabye/post/DcnytQfiSVY", "likes": 2, "velocity": 0.02, "ageHours": 83.5, "postedAt": "2026-08-29T20:07:12+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3970431376109526883", "username": "chienom1", "text": "２１時前にアラームしといたらいいのかな🤔⏰\n\nhttps://x.com/aoringohuzin/status/2091678141618282520?s=12\u0026t=vO7HLec5pulgP197xt2AGA", "permalink": "https://www.threads.com/@chienom1/post/DcZzkziEt9j", "likes": 2, "velocity": 0.01, "ageHours": 213.8, "postedAt": "2026-08-24T09:45:25+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3921410368199582501", "username": "kazumi_counseling", "text": "「あっ、このサロンまた来たいな」と思わせるエステティシャンは、施術中の『会話』が全く違います。\n例えば、施術中にお客様とお話しする時。", "permalink": "https://www.threads.com/@kazumi_counseling/post/DZrpfQPEeMl", "likes": 2, "velocity": 0.0, "ageHours": 1837.1, "postedAt": "2026-06-17T18:29:25+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3972119387856080364", "username": "therapist.mori", "text": "📍新宿｜🪞完全予約制プライベートサロン\n男女ともにご利用いただけます！\n\nオールハンドで、顔も身体もすっきり軽やかに。\nリラクゼーションとして、自分にご褒美のリラックスタイムを…\n\n【全身オイルトリートメント】\n首から下をオイルで丁寧にトリートメント。首・肩まわり、背中、脚など、疲れやむくみが気になる方に…\nゆったりとした時間の中で、全身を心地よく整えていきます。\n\n【小顔リフトアップトリートメント】\nデコルテ・首・お顔までしっかりケア。\n顔まわりの筋肉をほぐし、筋肉を元の位置に戻していきます。むくみやフェイスラインが気になる方にオススメです♪\n\n※すべてのメニューにドライヘッドケア付き。\n\n完全個室のプライベート空間で、ゆっくりお過ごしください𓂃𓈒𓏸\n\n📍新宿\n👩🏻👨🏻 男女OK\n🌿 オールハンド施術\n💌 ご予約・お問い合わせはDM・公式LINEから\n\n#新宿リラクゼーション#新宿オイルトリートメント #オイルトリートメント #小顔リフトアップ #小顔ケア", "permalink": "https://www.threads.com/@therapist.mori/post/DcfzYm-mo3s", "likes": 2, "velocity": 0.01, "ageHours": 157.9, "postedAt": "2026-08-26T17:39:11+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3859836024263897866", "username": "k.to711", "text": "宣伝しまーす\n昨日今日と講習会に行ってました！\n髪が薄くなって気になってる方は是非！\n頭皮に極小の点のタトゥーを入れると薄毛対策出来ます！\n気になる方はDMをください！\n1-4枚目は施術前\n5-8枚目は施術後\n施術後はワザとかなり光を飛ばしてのコレです！\n今ならお試し価格で出来ます^_^", "permalink": "https://www.threads.com/@k.to711/post/DWQ5GntgXMK", "likes": 2, "velocity": 0.0, "ageHours": 3876.1, "postedAt": "2026-03-24T19:32:11+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3935381989213999540", "username": "pakupaku437", "text": "自分のうなじの生え際？が嫌すぎる…\nうなじの産毛は脱毛してるけど、髪の毛の始まりが下すぎてアップしても綺麗にならないし、ミニボブとかしたいのにバリカン入れられるし、みん Hours": 85.9, "postedAt": "2026-08-29T17:40:30+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3929320680738884976", "username": "withglint_ikumou.aga", "text": "髪は年齢だけが原因で変わるわけではありません。\n\n睡眠不足、ストレス、食生活、頭皮環境など、毎日の積み重ねが髪にも影響を与えることがあります。\n\n「最近なんとなく髪が元気ない」\nそんな小さな変化を感じたら、頭皮ケアを始めるサインかもしれません。\n\n将来も自分の髪で過ごすために、今できるケアを始めませんか？\n\n名古屋・伏見で育毛・頭皮ケアならお気軽にご相談ください🌿\n\n#名古屋育毛 #伏見育毛 #名古屋AGA #伏見AGA #育毛サロン #頭皮改善 #頭皮環境 #抜け毛予防 #薄毛予防 #ボリュームアップ #スカルプケア #ヘッドケア #育毛ケア #髪の悩み #美髪ケア #髪質改善 #名古屋美容 #伏見美容", "permalink": "https://www.threads.com/@withglint_ikumou.aga/post/DaHwFc4CY1w", "likes": 2, "velocity": 0.0, "ageHours": 1575.2, "postedAt": "2026-06-28T16:25:48+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3913974030869726607", "username": "efu.ikumou", "text": "育毛鍼で薄毛が改善\n「前髪が透けなくなりました！」\nやったことはたったの2つ！", "permalink": "https://www.threads.com/@efu.ikumou/post/DZROqTaGAWP", "likes": 1, "velocity": 0.0, "ageHours": 2083.4, "postedAt": "2026-06-07T12:14:45+09:00", "genres": ["薄毛", "育毛"], "keywords": ["薄毛 対策", "育毛剤"]}, {"id": "3966465529431640204", "username": "trinsachi", "text": "産後の抜け毛、本当に助けてください😭😭\n\n3人目にしてここまでの抜け毛は初めて😭\n想像してた産後の抜け毛レベルを完全に超えて、毎日数百本単位で抜けてます。\nもう本当に絶望してます😭\n\n床も布団も服も、子どものおもちゃも、\n家中どこもかしこも髪の毛だらけ。\n掃除しても掃除しても髪の毛が落ちてて、\n抜け毛を見るたびにイライラするし、メンタルが🥲\n\n生え際もどんどん薄くなってきて、前髪もほぼ消滅して\n鏡を見るたびに泣きそう😭\n\n産後の抜け毛を経験した方、\nいつ頃から落ち着きましたか？ちゃんと元に戻りましたか？😭\n\n「これやったらマシになった！」\n「これ飲んだ・食べた」\n「このシャンプーや育毛剤よかった」\n「何もしなくても○ヶ月で戻った」\n\n本当に何でもいいので教えてほしいです🙏🏻😭\nちゃんと髪が戻るっていう希望が欲しいです🥲\n\n経験談でも改善策でも何でもいいです。\n産後ハゲを経験した方、どうか知恵を貸してください😭🙏🏻\n\n#産後抜け毛 #産後ハゲ #抜け毛 #薄毛 #産後ママ #産後ケア #産後の悩み #育児ママ #ママさんと繋がりたい #先輩ママ教えて #産後抜け毛対策", "permalink": "https://www.threads.com/@trinsachi/post/DcLt2I_msiM", "likes": 1, "velocity": 0.0, "ageHours": 345.2, "postedAt": "2026-08-18T22:25:59+09:00", "genres": ["薄毛", "育毛"], "keywords": ["つむじ 薄い", "育毛剤"]}, {"id": "3928401702374209631", "username": "kami_neesan_", "text": "【需要返信】分け目とつむじの薄毛、家でなんとかする方法をまとめてほしいてリクエストが多かったから本気で出すで。まず大前提：女の薄毛は男と根本的に違う。ここ間違えると一生遠回りするで。何がちゃうかっていうとな、", "permalink": "https://www.threads.com/@kami_neesan_/post/DaEfIjlDfhf", "likes": 1, "velocity": 0.0, "ageHours": 1605.6, "postedAt": "2026-06-27T09:59:59+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "つむじ 薄毛"]}, {"id": "3952942593289076435", "username": "o_dai_o_dai", "text": "髪が薄い人って、実は頭皮が悪い😭\nそう思って高級シャンプーや育毛剤を増やしがち。でも、前髪が割れる、つむじが透ける、短く細い毛が増えるなら、頭皮の汚れではなくAGAが進んでいる可能性があります。薄毛治療10年以上の俺も、商品に課金する前にこれを知りたかった。やることは💁こちら", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbbrFhSgb7T", "likes": 1, "velocity": 0.0, "ageHours": 793.0, "postedAt": "2026-07-31T06:38:19+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3883632420122207577", "username": "zero_xxcxx_", "text": "娘のヘアアレンジが難しすぎる😭\nくせ毛+薄毛ちゃん+つむじ後ろで前髪の境目も分からん😂\n\nいつもはちょんまげか後ろで二つ結びとかです、、\nどなたか…不器用にでもできる\n薄毛ちゃんのヘアアレンジ教えてくださーい💦\nもしよければお写真付きだと嬉しいです😭✨", "permalink": "https://www.threads.com/@zero_xxcxx_/post/DXlbxwXkyVZ", "likes": 1, "velocity": 0.0, "ageHours": 3088.1, "postedAt": "2026-04-26T15:31:23+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3932859251756872984", "username": "dr.mackerel", "text": "何回も言うけど、髪のボリュームをだしたいならこれ！", "permalink": "https://www.threads.com/@dr.mackerel/post/DaUUqb8k7UY", "likes": 1, "velocity": 0.0, "ageHours": 1458.0, "postedAt": "2026-07-03T13:36:19+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3973614916657324099", "username": "w_clinic_", "text": "大阪にある美容クリニックです👩‍⚕️\nオーダーメイドであなたに合ったたるみ改善したい方、", "permalink": "https://www.threads.com/@w_clinic_/post/DclHbatjaBD", "likes": 1, "velocity": 0.01, "ageHours": 108.4, "postedAt": "2026-08-28T19:10:32+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3924023011686638958", "username": "biyou_sake", "text": "たるみケアの順番\n\n🥉やめとけ\n・高い美顔器から始める（土台ノーケア）\n・顔だけ揉む（頭皮放置で逆戻り）\n・引き上げ塗り（靭帯を痛める）\n\n🥈無難\n・保湿を強化する（土台作りにはなる）\n・日焼け止め徹底（柱を折らせない）\n・表情筋を使う（衰え止め）\n\n🥇ナースが本気で勧める1番目は…", "permalink": "https://www.threads.com/@biyou_sake/post/DZ07iOGCmVu", "likes": 1, "velocity": 0.0, "ageHours": 1750.6, "postedAt": "2026-06-21T09:00:17+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3970029865513157880", "username": "hana_scalp_oyama", "text": "【栃木｜スカルプインク取材】\n\nprivate salon HANAは「小山市でスカルプインク専門サロン」として4月にopenいたしました⭐︎\n\nスカルプインクを、まだ知らない方にまず知ってもらいたい。そして、薄毛で悩んでいる方が『自分にもできることがある』と思えるきっかけになれば嬉しいです。\n\n気になる方は、ぜひ公式LINEまたはInstagramからお問合せください。\n\n💎サロン情報💎\nprivate salon HANA（ハナ）\n\nSCALP INK 頭皮タトゥー\n【国際認証ISO9001取得】\n@hana_scalp_oyama\n\n▶小山市八幡町\n（ご予約確定後詳細お送りします）\n*  090-5553-7001\n*  完全予約制\n*  JR小山駅から車で5分\n*  お問い合わせ・ご予約は【公式ライン】or 【お電話】で受付中！\n\n#栃木県薄毛サロン\n#スカルプインク\n#TV取材\n#小山駅 \n#AGA", "permalink": "https://www.threads.com/@hana_scalp_oyama/post/DcYYSDpmoT4", "likes": 1, "velocity": 0.0, "ageHours": 227.1, "postedAt": "2026-08-23T20:27:43+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3968537498436145408", "username": "hana_scalp_oyama", "text": "【栃木｜スカルプインクインクで小顔効果】\n\n「生え際、薄くなった？」\n実はこれ、髪が減っただけじゃない。\n\n生え際の“透け感”を\nスカルプインクで自然にカバー。\n\n近くで見ても不自然にならないように\n極小ドットで仕上げます。\n\n「髪型が決まらない…」\n「おでこが広く見える…」\nそんな悩みに。\n\n生え際が変わると、顔の印象も変わる。\n\n💎サロン情報💎\nprivate salon HANA（ハナ）\n\nSCALP INK 頭皮タトゥー\n【国際認証ISO9001取得】\n@hana_scalp_oyama\n\n▶小山市八幡町\n（ご予約確定後詳細お送りします）\n*  090-5553-7001\n*  完全予約制\n*  JR小山駅から車で5分\n*  お問い合わせ・ご予約は【公式ライン】or 【お電話】で受付中！\n\n#小顔効果\n#栃木薄毛\n#AGA\n#小山駅 \n#スカルプインク", "permalink": "https://www.threads.com/@hana_scalp_oyama/post/DcTE9QgGpEA", "likes": 1, "velocity": 0.0, "ageHours": 276.6, "postedAt": "2026-08-21T19:02:38+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3972775728214834711", "username": "coruli_scalp_ink", "text": "いつもパーマのお客さんが2回続けて、カットとヘッドスパ、なんでかって？スカルプインクで頭皮透けにくくなったから、違うところにメンテナンス☝️タトゥーの技術で毛根をかいてるの（まだ施術中）、パーマお休みした分、髪も薬剤の休憩でき次回しっかり根元から綺麗なパーマあてれるの☝️自然なボリューム感演出、髪型のように印象チェンジ、本サービスは発毛、育毛、治療を目的としたものではありません、タトゥー技術を応用した審美的なデザイン、医療行為ではなく美容目的の施術です。☝️効果には個人差あります☝️ちょっとしたお悩み、ちょっとの勇気でお気軽にカウセリングどうぞ#スカルプインク #天神橋筋六丁目", "permalink": "https://www.threads.com/@coruli_scalp_ink/post/DciInnkif4X", "likes": 1, "velocity": 0.01, "ageHours": 136.2, "postedAt": "2026-08-27T15:23:15+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3972957522554245862", "username": "calla.esthetic_relaxation", "text": ".\n\n💫HBL(ハリウッドブロウリフト)って？\n\n眉毛の毛流れそのものを整える、日本初の眉癖改善技術。\n\n•自分の眉毛でナチュラルに盛れる\n•細眉・薄眉もふっくら見せる\n•1回で「垢抜けたね」と言われる\n•メイク時間が半分になる\n•顔全体がリフトアップした印象に✨\n\n💡こんな人にこそ試してほしい！\n\n✔︎ 眉の形がいつも決まらない\n✔︎ 左右非対称が気になる\n✔︎ 毎朝メイクが面倒\n✔︎ 自分に似合う眉がわからない\n✔︎ 薄眉・細眉に悩んでいる\n✔︎アートメイクしたままで放置している\n\nご興味のある方は、お気軽にお問い合わせください😊❣️", "permalink": "https://www.threads.com/@calla.esthetic_relaxation/post/Dcix9Evj9Lm", "likes": 1, "velocity": 0.01, "ageHours": 130.2, "postedAt": "2026-08-27T21:24:25+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3974477987953202033", "username": "sbc_jun", "text": "糸リフトでこめかみ上の方から縦に入れて、\nカマキリみたいに不自然にリフトアップするのはアンチエイジング的には不向きです😭\n正しいリフトは、、、", "permalink": "https://www.threads.com/@sbc_jun/post/DcoLqwfj1Nx", "likes": 1, "velocity": 0.01, "ageHours": 79.8, "postedAt": "2026-08-29T23:45:19+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3967848997830335409", "username": "kamomi_rutea", "text": "最近、髪洗ったり乾かしたりしてる時の抜け毛がすごくてつらい🥲前髪が薄く後退してる気がする…。\n産後の抜け毛って、時間が経ったら治るものなのかこのままなの？何かいいヘアケアとかあれば知りたい🥲🥲", "permalink": "https://www.threads.com/@kamomi_rutea/post/DcQoaQWERux", "likes": 1, "velocity": 0.0, "ageHours": 299.4, "postedAt": "2026-08-20T20:14:41+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退", "髪 ボリューム"]}, {"id": "3973348963969364670", "username": "hears.mikami", "text": "いつも有難うございます。\n８月が終わり９月になります。\n９月のお休みカレンダーです。\n９／８日火曜は、TOＰmaster MODEの為臨時休業させて頂きます。２２日２３日の\n祝日も営業します。\nご予約お待ちしております。\n#人も髪も輝き続けるサロンドハーズ出雲、\n#出雲市プレミアム商品券加盟店サロンドハーズ、\n\n#髪質改善出雲市、\n＃カラーパーマ匂いしない店出雲、\n＃hears.jp、\n＃髪の薄毛対策出雲市、\n#上級着付け師出雲、\n\n＃ラ・カスタシステム、\n＃つむじ割れ薄毛ケア、\n＃骨格診断出雲市、\n＃復元フォースカット出雲市、\n＃パーソナルカラー診断出雲市、\n\n＃野草カラー、\n＃くせ毛改善カラー、\n＃髪を健康にするヘアーカラー、\n＃復元ドライヤープロ8販売店、\n#心結び詩人敏、", "permalink": "https://www.threads.com/@hears.mikami/post/DckK9S-D3K-", "likes": 1, "velocity": 0.01, "ageHours": 117.2, "postedAt": "2026-08-28T10:22:08+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3909019245481102830", "username": "emi_sangocare", "text": "現役助産師でも衝撃だった話する。産後3ヶ月のママ友から「抜け毛がすごすぎて排水溝が詰まる」って連絡がきて、夫（産婦人科医）に話したら「それ、止める方法を知らないまま過ごしてるから悪化してるだけだよ」って言われたんだけど、", "permalink": "https://www.threads.com/@emi_sangocare/post/DY_oEr7EQ3u", "likes": 1, "velocity": 0.0, "ageHours": 2247.4, "postedAt": "2026-05-31T16:10:28+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3974737667279696171", "username": "iyasheep.akashi", "text": "頭皮って、押した瞬間に音がしそうなくらい硬い人いるんですよね。\n\nさっきのお客様、こめかみのあたりが本当にカッチカチで、触った瞬間わたしのほうが「うわ」って声出そうになりました。5分ほぐしたら、耳の上がふにゃっと沈んだんです。\n\nその瞬間に寝息。あれが一番うれしいやつなんです。\n\n70分でここまで変わるんやから、頭皮って正直やなあと思いました✨", "permalink": "https://www.threads.com/@iyasheep.akashi/post/DcpGtltkjEr", "likes": 1, "velocity": 0.01, "ageHours": 71.2, "postedAt": "2026-08-30T08:21:20+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3925145149236346734", "username": "kami_neesan_", "text": "つむじの薄さは、本人が一番気づかへん。自分で見えへん後頭部から、更年期の薄毛は始まるんや。美容師に後ろ向きの鏡で「地肌見えてますね」言われた時、ワテ血の気引いた。見るべきは、", "permalink": "https://www.threads.com/@kami_neesan_/post/DZ46reIFH9u", "likes": 1, "velocity": 0.0, "ageHours": 1713.4, "postedAt": "2026-06-22T22:09:50+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3974163225370041081", "username": "mii1030.kyoyuno", "text": "知り合いが今度オリヤン？？（韓国）に行って化粧品や、洗顔等、美容関係を買ってきてくれるらしいのですが\n無知すぎて全くわからず、、、アドバイスください！！\nニキビはできにくいが、顎下やなどにはごくたまにポツポツ白いぶつぶつできる程度で混合肌です。\n毛穴は気になります。全滅して欲しいです。\n\n詳しい方いませんか😌", "permalink": "https://www.threads.com/@mii1030.kyoyuno/post/DcnEGW_mhr5", "likes": 1, "velocity": 0.01, "ageHours": 90.3, "postedAt": "2026-08-29T13:19:56+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3955593690198135431", "username": "official_paramiclinic", "text": "額縮小術✨\n\n生え際を下げて額を狭くするお手術です。\n\n効果は即効性があり、額がとても広い場合にお勧めです🩵\n\nパラミの額縮小は傷跡からも毛が生える技術で傷跡を最小化✨\n\n額縮小10年以上のノウハウ✅", "permalink": "https://www.threads.com/@official_paramiclinic/post/DblF4DsCVKH", "likes": 1, "velocity": 0.0, "ageHours": 705.2, "postedAt": "2026-08-0
