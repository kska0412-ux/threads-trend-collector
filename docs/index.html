ム低下」を実感しているのに、食事で対策できると知っている人はほとんどいない。私もそうだった。\n\n46歳を過ぎた頃から、シャワーのたびに排水口に溜まる髪。こんなものかなと諦めてた。でも明らかに側頭部が透けてきて、このままハゲていくのは嫌！と思って、薄毛改善を自分で調べ始めた。\nそこでたどり着いたのが、", "permalink": "https://www.threads.com/@mokon_chan/post/DX38RMwEV7n", "likes": 33, "velocity": 0.01, "ageHours": 2929.7, "postedAt": "2026-05-03T20:01:38+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3940338799519925772", "username": "kotsukatsu_gishi", "text": "耳を疑った。顔のたるみがどんどん進む人。皮膚科の先生いわく、たるみを止めたいなら、高い美容液でもなく、マッサージでもなく、コラーゲンでもなく、", "permalink": "https://www.threads.com/@kotsukatsu_gishi/post/Dau5ULoEwYM", "likes": 33, "velocity": 0.03, "ageHours": 1224.4, "postedAt": "2026-07-13T21:16:50+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["たるみ 改善"]}, {"id": "3969200931874967307", "username": "honey_haircare_chan", "text": "女の美意識レベルは「頭皮への向き合い方」でわかる\n\n🔻低め\n・シャンプーは適当に泡立てて頭頂部からゴシゴシ\n・自然乾燥で放置\n・頭皮のベタつきは体質だと思ってる\n\n🔻普通\n・シャンプー前にブラッシングする\n・お風呂上がりすぐドライヤー\n・たまに指で頭皮マッサージ\n\n🔻高い↓", "permalink": "https://www.threads.com/@honey_haircare_chan/post/DcVbzfCjo8L", "likes": 33, "velocity": 0.12, "ageHours": 268.7, "postedAt": "2026-08-22T17:00:44+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3874323839086347961", "username": "penginpenpen2026", "text": "メナードに通われている方に質問です！\n\n今さらですがエステ体験に行こうと思っております！！\n昔々の知り合いで運良くラインが繋がったのでさっそく今週土曜日に予約を入れました！\n\n初回3,300円！と思っていたのですが、年齢的にもデコルテや背中もやったほうがいい！と言うことで流れで4,950円で予約。\n\n実際通われてる方でメリットデメリット教えて欲しいです！\n人それぞれだと思いますが、きっと今後の話にもなると思うので参考にさせていただければと思っております✨", "permalink": "https://www.threads.com/@penginpenpen2026/post/DXEXQEtkca5", "likes": 33, "velocity": 0.01, "ageHours": 3410.4, "postedAt": "2026-04-13T19:16:54+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["フェイシャルエステ"]}, {"id": "3872798494310896527", "username": "swan.4564804", "text": "いいとこないかなーて初回価格で2店舗ほど小顔矯正行ってきたけど、その後が高い！！\nほんとは痩身エステも行きたいけど、高い！\nもうエステいくのは諦めようかと思い始めてきた😂\n小顔も痩身も自分の努力でなんとかするとして、スキンケアだけ通おうかなあ。", "permalink": "https://www.threads.com/@swan.4564804/post/DW-8bYsEZOP", "likes": 33, "velocity": 0.01, "ageHours": 3460.9, "postedAt": "2026-04-11T16:46:18+09:00", "genres": ["ダイエット・痩身"], "keywords": ["痩身エステ"]}, {"id": "3932124957061586707", "username": "moose.40807391", "text": "自律神経が狂いまくってて不調が続いてるんですけどこれガチで効いたとか治し方なんかないですか…", "permalink": "https://www.threads.com/@moose.40807391/post/DaRttCuGp8T", "likes": 33, "velocity": 0.02, "ageHours": 1496.4, "postedAt": "2026-07-02T13:17:24+09:00", "genres": ["エステ・リラクゼーション"], "keywords": ["自律神経 整える"]}, {"id": "3927759074242935620", "username": "ochi_haircare", "text": "薄毛がほんとに悩みだけど薄毛治療薬のデメリットがデカ過ぎて絶対使わないと決めてる私。\nまだまだ薄毛だけど、地道に毎日頭皮ケア頑張ってここまできた🥹", "permalink": "https://www.threads.com/@ochi_haircare/post/DaCNBFfkTtE", "likes": 32, "velocity": 0.02, "ageHours": 1641.0, "postedAt": "2026-06-26T12:43:10+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3924174837640487981", "username": "kami_neesan_", "text": "分け目とつむじの薄毛、家でなんとかする方法。マジで知らん人多すぎるんよwww ワテも後頭部の透けにヒヤッとしたクチやから、本気で調べた保存版を作りたい。読みたい人はコメントかいいねで教えて。反応多かったら最優先でツリーにまとめるで。", "permalink": "https://www.threads.com/@kami_neesan_/post/DZ1eDlCFmQt", "likes": 32, "velocity": 0.02, "ageHours": 1759.7, "postedAt": "2026-06-21T14:02:01+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3932400016103283829", "username": "aaa0102aaaaa", "text": "アラフォー抜け毛に悩んでます…\n切実な悩みです…\n元々髪が細く毛量少なめです。\n年齢のせいなのか出産で色んなものを置いてきたのか年々元気がなくなってます〜\nセルフケアは思い立った時にする頭皮マッサージくらいです(しかも1分くらいで終わる)\n\nオススメのケアを教えてくださいまし😭😭\nそれとも課金して育毛サロンに通うのが近道でしょうか😭😭😭", "permalink": "https://www.threads.com/@aaa0102aaaaa/post/DaSsPrak5x1", "likes": 32, "velocity": 0.02, "ageHours": 1487.3, "postedAt": "2026-07-02T22:23:53+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["発毛"]}, {"id": "3937744560596360053", "username": "clair__miho", "text": "ぶっちゃけ一番効果があった「たるみ治療」って\n何でしたか？👀", "permalink": "https://www.threads.com/@clair__miho/post/DalrdCWkpt1", "likes": 32, "velocity": 0.02, "ageHours": 1310.3, "postedAt": "2026-07-10T07:22:33+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["たるみ 改善"]}, {"id": "3933728520908498227", "username": "yuran_music", "text": "ねえねえ、アンチエイジングできる\nすごく効果が出たスキンケア\n教えてほしい✨️\nたるみとかたるみとかたるみ笑", "permalink": "https://www.threads.com/@yuran_music/post/DaXaT97kuUz", "likes": 32, "velocity": 0.02, "ageHours": 1443.3, "postedAt": "2026-07-04T18:23:23+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["たるみ 改善"]}, {"id": "3928762109765771178", "username": "mer_365no_fande", "text": "頭皮マッサージが良くない、じゃなくて「手でやる頭皮マッサージ」が良くないって話。指の腹でやると力が均一にかからないし、摩擦で頭皮にダメージが入る。美容部員だったとき、「マッサージでかえって薄毛が進んだ」って相談を山ほど聞いた。\n\n頭皮と顔の皮膚は一枚で繋がってるから頭皮をほぐすとフェイスラインが引き上がる、このメカニズムは本物。ただ、摩擦と圧力の加え方を間違えると逆効果になるよ。正しいやり方は、", "permalink": "https://www.threads.com/@mer_365no_fande/post/DaFxFLHml-q", "likes": 32, "velocity": 0.02, "ageHours": 1607.8, "postedAt": "2026-06-27T21:56:06+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3965992105428604055", "username": "chie.kogao.design", "text": "小顔になりたい人は「ベロ体操」がマジで効きます。舌が正しい位置にないと、 顎が後退し、二重あごや顔のたるみの原因になります。舌の筋肉を鍛えることで、 顎の位置が整い、顔のバランスが良くなる ため、小顔に。１週間続けてフェイスラインが出てきた。さらに骨から小顔になる方法があって…￼", "permalink": "https://www.threads.com/@chie.kogao.design/post/DcKCM6iE1SX", "likes": 32, "velocity": 0.09, "ageHours": 374.9, "postedAt": "2026-08-18T06:45:22+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["小顔"]}, {"id": "3919114397088318895", "username": "hide.d.o.g", "text": "大手のランクル専門販売店で3インチリフトアップって記載されてるんだけど、素人目から見て純正のショックに見えるんだけど分かる人います？3インチリフトアップだと純正のショックだと伸びとか足りなくなるんじゃないのかな", "permalink": "https://www.threads.com/@hide.d.o.g/post/DZjfcegkYWv", "likes": 32, "velocity": 0.02, "ageHours": 1927.2, "postedAt": "2026-06-14T14:27:44+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3922679550496647539", "username": "trendbeauty_log", "text": "面長さん、このチークの入れ方おすすめ🥹\nほっぺの位置を少し意識するだけで、\n顔の余白が埋まってリフトアップしたみたいに見える。", "permalink": "https://www.threads.com/@trendbeauty_log/post/DZwKESXCqlz", "likes": 32, "velocity": 0.02, "ageHours": 1809.2, "postedAt": "2026-06-19T12:31:04+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3935278693933925925", "username": "sudoasami_inst", "text": "痩身エステってほんとに痩せるん？一時的なもの？", "permalink": "https://www.threads.com/@sudoasami_inst/post/Dac6x9EGEYl", "likes": 32, "velocity": 0.02, "ageHours": 1392.0, "postedAt": "2026-07-06T21:43:19+09:00", "genres": ["ダイエット・痩身"], "keywords": ["痩身エステ"]}, {"id": "3973480570643064624", "username": "kae.de902", "text": "いとこに教えたら感謝された\nガチで人生変わった頭皮ケアの組み合わせ🥹\n\n毎日髪抜けるのがストレスだったけど\nこれ続けてたら前より気にならなくなった😭", "permalink": "https://www.threads.com/@kae.de902/post/Dcko4bPGKcw", "likes": 31, "velocity": 0.24, "ageHours": 127.0, "postedAt": "2026-08-28T14:43:37+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3848917960052533146", "username": "yua_style_", "text": "【本当に“顔を小さく見せる”ための習慣】\n\n❌ ほぼ関係ない\n\n・強い力で顔を押す\n・毎日ゴリゴリほぐす\n・小顔グッズを増やす\n・むくみ＝水分だけと思う\n\n※輪郭を横に広げる原因になることも。\n\n⭕️本当に“顔を小さく見せる”ための習慣↓↓↓", "permalink": "https://www.threads.com/@yua_style_/post/DVqGn4CjWea", "likes": 31, "velocity": 0.01, "ageHours": 4251.7, "postedAt": "2026-03-09T17:59:57+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["小顔"]}, {"id": "3872543417553892717", "username": "clearly_kobe", "text": "人生初の円形脱毛症になりました、しかも4箇所も\nメンタル強いし楽観的だと自負していたからかなりびっくり、さすがに落ち込みました🤣\n去年の秋からハードすぎたのかな？\n育毛ケアの施術も自分のサロンであるからこれから本格的にやっていく、でも治療もいるかな？？\n\nなったことある方、現在なっている方\n色々お話してみたい", "permalink": "https://www.threads.com/@clearly_kobe/post/DW-Cbh8k7Vt", "likes": 31, "velocity": 0.01, "ageHours": 3469.4, "postedAt": "2026-04-11T08:19:31+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["育毛剤"]}, {"id": "3862176496337623802", "username": "stillu_face_body", "text": "渋谷/松濤で小顔矯正サロンをオープンしました✨️\n\n3回～5回で劇的に変化する小顔矯正を\n受けて見たい方いませんか？☺️\n\n3回モニターさん募集しています！\n気になる方はDMください😌\n\n#小顔矯正\n#渋谷サロン", "permalink": "https://www.threads.com/@stillu_face_body/post/DWZNQ-MERr6", "likes": 31, "velocity": 0.01, "ageHours": 3812.7, "postedAt": "2026-03-28T01:02:18+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["小顔"]}, {"id": "3966011417606442300", "username": "mina.hadakanri", "text": "肝斑がある人は、摩擦で一生消えません。洗顔で頬を動かしてる人、ファンデをしっかり伸ばしてる人、全員悪化させてるからな。しかも「美白ケアしてるのに消えない」って人の大半、使う成分が間違ってる。ビタミンCもハイドロキノンも肝斑には効かない。元美容部員10年の私がどうケアしてるかっていうと、", "permalink": "https://www.threads.com/@mina.hadakanri/post/DcKGl8Zk008", "likes": 31, "velocity": 0.08, "ageHours": 374.3, "postedAt": "2026-08-18T07:23:45+09:00", "genres": ["くすみ・美白"], "keywords": ["美白 ケア"]}, {"id": "3900556282176864002", "username": "esthe_beauties_kobe", "text": "明石、神戸でアロマオイル施術、リンパマッサージ施術のモニターさん、モデルさんお願いできる方～！！！自律神経整えたい、PMS等のホルモンバランスの乱れに悩んでいる、産後の体質の変化が気になる、肌荒れが気になるなどなど、体の中から整えませんか？？？", "permalink": "https://www.threads.com/@esthe_beauties_kobe/post/DYhj0XJkf8C", "likes": 31, "velocity": 0.01, "ageHours": 2541.8, "postedAt": "2026-05-19T23:56:05+09:00", "genres": ["むくみ・冷え"], "keywords": ["リンパ マッサージ"]}, {"id": "3938914461637265103", "username": "jan_42012", "text": "脱毛そろそろしようかなオススメどこかなー", "permalink": "https://www.threads.com/@jan_42012/post/Dap1dVmicbP", "likes": 31, "velocity": 0.02, "ageHours": 1271.6, "postedAt": "2026-07-11T22:06:56+09:00", "genres": ["脱毛"], "keywords": ["脱毛 サロン"]}, {"id": "3917771413847691846", "username": "taku87116", "text": "育毛・発毛・頭皮ケア・スカルプケア得意な方\nいらっしゃいますか？\n\nコミュニティに薄毛や抜け毛、頭皮ケア\nに悩んでいる方がいらっしゃるので💦\n集客のお役に立てるかもです🤝", "permalink": "https://www.threads.com/@taku87116/post/DZeuFf5klJG", "likes": 30, "velocity": 0.02, "ageHours": 1971.7, "postedAt": "2026-06-12T17:59:28+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["発毛"]}, {"id": "3949605823726561373", "username": "sally__525", "text": "美容鍼のビフォーアフター流れてきて、めちゃリフトアップされてたけど、美容鍼って1週間もしないうちに元通りよね？\nずっと続けてると上がったままの状態維持できる？\n私も月イチくらいで通ってた時もあったけど、鍼の効果VS老化は勝負にならなかったよ😅", "permalink": "https://www.threads.com/@sally__525/post/DbP0ZIeCShd", "likes": 30, "velocity": 0.03, "ageHours": 917.6, "postedAt": "2026-07-26T16:08:45+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3908375957727676313", "username": "m34673tdm", "text": "なんとか10月までに頬コケとリフトアップしたくて、いろんな施術やらクリニック調べてるけど、自分に合う施術をするにはやっぱり実際にカウンセリング行くしかないのかなぁ💭\n美容クリニックありすぎて結局どこがいいかわからない😭\n大阪でおすすめのクリニックないですか💧\nフェイスラインでコケすぎた経験があるから怖い…", "permalink": "https://www.threads.com/@m34673tdm/post/DY9VznhCQeZ", "likes": 30, "velocity": 0.01, "ageHours": 2282.8, "postedAt": "2026-05-30T18:52:22+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3918611015059847669", "username": "shoko_akanuke", "text": "小顔の人にお聞きしたい。\n\n何したらそんなに顔小さくなりますか？", "permalink": "https://www.threads.com/@shoko_akanuke/post/DZhs_Tdkzn1", "likes": 30, "velocity": 0.02, "ageHours": 1943.9, "postedAt": "2026-06-13T21:47:36+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["小顔"]}, {"id": "3953981889265654651", "username": "hiromi_biyoukoushi", "text": "みなさん教えてください…！\n\n額のシワが気になっています！！\nボトックスはする予定なのですが、目が重くならないよう上の方に打つので、眉上くらいのシワにはあまり効果ないんです…😭\n\n額のシワに効果的だった美容施術があったらおしえてください！\n\nちなみに品川の美肌注射はあまり効果なかった…(私には)", "permalink": "https://www.threads.com/@hiromi_biyoukoushi/post/DbfXZRGAdt7", "likes": 30, "velocity": 0.04, "ageHours": 772.6, "postedAt": "2026-08-01T17:03:13+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["たるみ 改善"]}, {"id": "3973945004909607804", "username": "fire_9works", "text": "全身脱毛(VIO)を考えてるのですが\n女性の方からの意見教えてほしいです", "permalink": "https://www.threads.com/@fire_9works/post/DcmSe1Wkzt8", "likes": 30, "velocity": 0.27, "ageHours": 111.6, "postedAt": "2026-08-29T06:06:22+09:00", "genres": ["脱毛"], "keywords": ["医療脱毛"]}, {"id": "3971527451494436386", "username": "agtmagtm2684", "text": "39歳　最近抜け毛が凄くて悩んでいます。\nセミロングですが、1回の洗髪で、排水溝が詰まるくらい抜けていると思います。\n鏡で見た感じでは、薄毛なのかは自分では分かりません。\n前より分け目が目立っていたり、頭皮が透けて見える気もします。\n\nこういう場合、皮膚科に行けば良いのでしょうか？\n\nまた、抜け毛予防に良いことがあれば教えてください！！", "permalink": "https://www.threads.com/@agtmagtm2684/post/DcdsyzSCc4i", "likes": 29, "velocity": 0.15, "ageHours": 191.6, "postedAt": "2026-08-25T22:03:07+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["抜け毛 対策"]}, {"id": "3966390065480910070", "username": "oto.kurashi", "text": "最近使い始めたヘアケアアイテムが２つとも大ヒットだったので、今私が使ってるアイテムたちぜーんぶまとめたよ🙋‍♀️\n\n「年齢は髪に出る」を肝に銘じて\n髪のツヤだけは忘れずに整えるようにしてるよ！\n\n40すぎたら急にうねりやクセ、パサつきに悩まされ\n色々回り道したけど、今はこれらで落ち着いてます！\n\n特にケラチンとスカルプブラシ！\nビフォアフがはっきり分かるくらい効果テキメン✨\nブラシは既に愛用してるフォロワーさんも多いし、\n本当使ってみて欲しい🥹\n\nちなみに縮毛矯正は弱いやつ（酸性ストレート）はかけてるよ！（去年初めてかけてからもうやめられない💦）", "permalink": "https://www.threads.com/@oto.kurashi/post/DcLcr_toMT2", "likes": 29, "velocity": 0.08, "ageHours": 361.8, "postedAt": "2026-08-18T19:56:03+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3934804271577257334", "username": "mayukaphyto", "text": "むくみ解消と高血圧予防したい人には、とにかくカリウム摂ってほしいから、カリウム含有量順に飲むべきお茶3つ置いときますね", "permalink": "https://www.threads.com/@mayukaphyto/post/DabO6M0DVV2", "likes": 29, "velocity": 0.02, "ageHours": 1407.7, "postedAt": "2026-07-06T06:00:43+09:00", "genres": ["むくみ・冷え"], "keywords": ["むくみ 解消"]}, {"id": "3930141141102752169", "username": "raro_salon", "text": "ぎゃー。サロンで使う脱毛器かなり迷う😑💭\nどこの脱毛器にしよーーー。\n\nオススメありますか😭？", "permalink": "https://www.threads.com/@raro_salon/post/DaKqouIk_Gp", "likes": 29, "velocity": 0.02, "ageHours": 1562.1, "postedAt": "2026-06-29T19:35:54+09:00", "genres": ["脱毛"], "keywords": ["脱毛 サロン"]}, {"id": "3912671413283929564", "username": "ch_ha_us", "text": "長年ひどい眼精疲労と、からの頭痛に本気で悩まされ…もはや一生付き合っていくもんだと半ば諦めていたけれど😢\n\nダメ元で眼科に行ったら、秒で「あ、これはドライアイですね〜」と診断👨‍⚕️\n\n処方されたこの目薬を差して3カ月、ほんと劇的に楽になった✨️\n\nなんなら人生の幸福度が4割ほど増したまである勢い😇\n似たような方は是非一度眼科へ🏥\n\nちなみにこれは目薬入れのくりまんじゅう先輩🌰\n\n差したあとの気分はまさに\nハァ〜〜〜ッ！！", "permalink": "https://www.threads.com/@ch_ha_us/post/DZMmeuPnT3c", "likes": 29, "velocity": 0.01, "ageHours": 2140.6, "postedAt": "2026-06-05T17:06:41+09:00", "genres": ["エステ・リラクゼーション"], "keywords": ["眼精疲労"]}, {"id": "3925401531663416738", "username": "o_dai_o_dai", "text": "炎上覚悟で言います。亜鉛はマジでヤバい習慣です。薄毛治療10年以上向き合ってきて、亜鉛の重要性に気づいた。何がヤバいかというと、", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DZ50-U3kn2i", "likes": 28, "velocity": 0.02, "ageHours": 1719.0, "postedAt": "2026-06-23T06:39:09+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "薄毛 対策", "生え際 後退"]}, {"id": "3937525056789324352", "username": "warewarewa_r", "text": "旦那が髪の毛薄くなってきたの気にしてて\nAGA飲み薬試してみる？？って話になってるけど\n副採用と実際の効果が気になるみたいで。\n\nやってる人いたら感想教えてくださいーーーーー\nちなみにまだ30代前半です\n\nがっつりハゲとかじゃなくて\nM字にデコ広がってきて普段は目立たないです\n前髪あげるとまぁまぁキツイです😅", "permalink": "https://www.threads.com/@warewarewa_r/post/Dak5i1gIKJA", "likes": 28, "velocity": 0.02, "ageHours": 1317.6, "postedAt": "2026-07-10T00:06:26+09:00", "genres": ["薄毛", "育毛・頭皮ケア"], "keywords": ["つむじ 薄い", "AGA", "発毛"]}, {"id": "3969148609929365994", "username": "nerui0029", "text": "美容医療に詳しい方🙏🥹\nわたしはこの方に似た輪郭なのですが、\n面長をマシにして小顔に近づくにはどのような施術がお勧めですか？（骨切り以外）\n・薄肌\n・顔の脂肪少なめです。\n\n【気になるところ】\n・下顔面の長さ、面長（普段は前髪あり）\n・口横のもたつき、マリオネットライン\n・頬こけ\n\nまだ糸リフトまでは考えていなくて、「オリジオX」あたりはどうかな？と気になっています💭\nおすすめの施術やクリニックがあればぜひ教えてください！🙇‍♀️✨\n※画像は本人ではなくAIのイメージ画像なので、髪型などは面長に見えないスタイルにしています。", "permalink": "https://www.threads.com/@nerui0029/post/DcVP6Gbk0nq", "likes": 28, "velocity": 0.1, "ageHours": 270.4, "postedAt": "2026-08-22T15:16:47+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["小顔"]}, {"id": "3954429799804678402", "username": "m_a_i_m_a_i1101", "text": "ぜっっったいに顔痩せてやるー😂😂\n\nえらが張って、めっちゃ顔が大きくて、写真を撮って自分の顔を見るたびにへこむ😂😂\n本当に顔が大きい😂\n\nどうしたら顔って小さく見えるの？\n顔痩せどうしたらいいのー？😂", "permalink": "https://www.threads.com/@m_a_i_m_a_i1101/post/Dbg9POSk7EC", "likes": 28, "velocity": 0.04, "ageHours": 757.8, "postedAt": "2026-08-02T07:53:08+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["小顔"]}, {"id": "3972839980321929964", "username": "lufeli_yuko", "text": "頭皮マッサージを頑張るほど、目の下のたるみとほうれい線は濃くなります。", "permalink": "https://www.threads.com/@lufeli_yuko/post/DciXOnAjvrs", "likes": 28, "velocity": 0.19, "ageHours": 148.2, "postedAt": "2026-08-27T17:30:53+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3956607519132025747", "username": "kotsuko288", "text": "糸リフトは金ドブとかネガティブな投稿をよく見かけますが、私は糸リフトおすすめです。\nあきらかにたるむ速度は遅くなってるし、リフトアップ効果というよりたるみ予防の目的が大きいからかな。\nアラフィフですが、30代後半よりあきらかに顔の輪郭は今の方がスッキリしてる。\n美顔施術は自己満足。\nそれで少しでも前向きに楽しく生きれたらそれでいいのさ。", "permalink": "https://www.threads.com/@kotsuko288/post/DbosZNdgQOT", "likes": 28, "velocity": 0.04, "ageHours": 685.7, "postedAt": "2026-08-05T07:59:53+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3942384174237610374", "username": "satomi_dokudashi.ayurveda", "text": "白髪はお湯で頭洗うと増えてプラス10歳老けて見えます。白髪が急に増えた人は、", "permalink": "https://www.threads.com/@satomi_dokudashi.ayurveda/post/Da2KYTRjfGG", "likes": 28, "velocity": 0.02, "ageHours": 1156.7, "postedAt": "2026-07-16T17:00:38+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3882800336352530983", "username": "ken_nikibi_finish", "text": "断言する。ニキビが全然治らない人、これのどれかやってる", "permalink": "https://www.threads.com/@ken_nikibi_finish/post/DXielV-D1In", "likes": 28, "velocity": 0.01, "ageHours": 3129.7, "postedAt": "2026-04-25T11:58:11+09:00", "genres": ["毛穴・ニキビ"], "keywords": ["ニキビ 治し方"]}, {"id": "3937793873012256031", "username": "yobo_chokin", "text": "ずっと黙っててんけど、もう言うわ🫩寝てる間に下半身のむくみと脂肪をためこまへん意外な5つ。『夜に水を抜く』ちゃうで。骨格ウェーブの友達が、むくみで悩んで整体で聞いてきたら、朝の脚の重さが消えて太もももスッキリしたらしい。そのやり方が、", "permalink": "https://www.threads.com/@yobo_chokin/post/Dal2qoHmu0f", "likes": 28, "velocity": 0.02, "ageHours": 1308.7, "postedAt": "2026-07-10T09:00:36+09:00", "genres": ["むくみ・冷え"], "keywords": ["脚 むくみ"]}, {"id": "3936540250642397119", "username": "emochan_358", "text": "30歳女です。\n髪の毛がストレスとかでごっそり抜けちゃってから1年経つんですが、頭頂部分が中々生えなくてずっと悩んでます。\n亜鉛のサプリは摂ってます。ジムも週1で通って、毎朝プロテイン、鶏胸肉もかなり食べてます。\nその他、何かいい手立て、アイテム、薬はないでしょうか。出来ることは全てやりたいです。", "permalink": "https://www.threads.com/@emochan_358/post/DahZoBTkTe_", "likes": 27, "velocity": 0.02, "ageHours": 1350.2, "postedAt": "2026-07-08T15:29:48+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["抜け毛 対策"]}, {"id": "3913160491611150334", "username": "ponnokiroku", "text": "【肌荒れ写真注意です⚠️】\n写真はファンデ後なのでさらに汚らしくてすみません…\n自分の記録用に撮ったのでお見苦しいと思います🙏\n\nどなたか助けてください…\n元々ニキビはできにくい肌質だったのですが、出産して母になってから数年、不定期で顎に吹き出物ができます😭\n奥のほうにしこりができて痛痒く、無意識に掻いてしまって痕が残ります…\n今回試したことは、「バンドエイド 顔用パッチで触らないようにする」です。\n\n使ってるものは\n・クレンジング　センテラのオイル\n・洗顔　センテラ or なめらか本舗の泡洗顔\n・Anua PDRN ヒアルロン酸ブースタートナー\n・エリクシール リフトモイストローション\n・センテラ プロバイオシカインテンシブアンプル\nです。\n\n最近は白ニキビのようなものがポツポツ出てきて、原因は毛穴の詰まりのような気がしています…\nクレンジングやスキンケアを変えても治りません…\n母も昔、同じように顎だけ荒れていました。\n\n自分の取り柄は荒れない肌だけと思っていたので、自己肯定感下がりまくりでつらいです…\n人の視線が顎に行くのも分かるので隠したいのですが、マスクは必ず荒れるので出来ず…😭", "permalink": "https://www.threads.com/@ponnokiroku/post/DZOVrv7k1f-", "likes": 27, "velocity": 0.01, "ageHours": 2124.4, "postedAt": "2026-06-06T09:18:23+09:00", "genres": ["毛穴・ニキビ"], "keywords": ["肌荒れ 原因"]}, {"id": "3882419245020346537", "username": "3key.ch", "text": "痩身エステというものを体験してきたけど\nおかげさまで背中あざだらけ😇\nしかも肩が揉み返しきてて痛いし、もうこの肩こりとは一生付き合えってこと？たまらーん！！！", "permalink": "https://www.threads.com/@3key.ch/post/DXhH7vAk_ip", "likes": 27, "velocity": 0.01, "ageHours": 3142.3, "postedAt": "2026-04-24T23:21:01+09:00", "genres": ["ダイエット・痩身"], "keywords": ["痩身エステ"]}, {"id": "3898992807411401614", "username": "zen.himeji", "text": "正直に言います。\nヘッドスパは定期的にやったほうがいいです。\nなぜかというと", "permalink": "https://www.threads.com/@zen.himeji/post/DYcAUzzj0OO", "likes": 27, "velocity": 0.01, "ageHours": 2593.5, "postedAt": "2026-05-17T20:09:44+09:00", "genres": ["エステ・リラクゼーション"], "keywords": ["ヘッドスパ"]}, {"id": "3943124510736281979", "username": "uvuooouvu", "text": "私、びまん性脱毛症だ。\n\nつむじの分け目が、目立つようになった。\n髪の毛のボリュームが減った。\n\n悲しい〜〜。", "permalink": "https://www.threads.com/@uvuooouvu/post/Da4ytnXknF7", "likes": 26, "velocity": 0.02, "ageHours": 1132.2, "postedAt": "2026-07-17T17:31:33+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛", "髪 ボリューム"]}, {"id": "3935306704618702075", "username": "nnnaminn", "text": "８ヶ月。換毛期のニニです。\n皆さん、抜け毛対策どうされてますか🫣", "permalink": "https://www.threads.com/@nnnaminn/post/DadBJkDAsT7", "likes": 26, "velocity": 0.02, "ageHours": 1391.0, "postedAt": "2026-07-06T22:41:02+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["抜け毛 対策"]}, {"id": "3954870783080267656", "username": "kana_wellness.diary", "text": "2年前から抜け毛がひどく、最近は少し落ち着いて来ましたが、更年期は抜け毛がひどいようですね。\n何か対策されてるからいらっしゃいますか？", "permalink": "https://www.threads.com/@kana_wellness.diary/post/DbihgX-Ef-I", "likes": 26, "velocity": 0.03, "ageHours": 743.2, "postedAt": "2026-08-02T22:29:18+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3961404768643548539", "username": "rezalt_8888", "text": "ニキビが早く治る方法教えてほしい", "permalink": "https://www.threads.com/@rezalt_8888/post/Db5vKYOiYV7", "likes": 26, "velocity": 0.05, "ageHours": 526.8, "postedAt": "2026-08-11T22:51:09+09:00", "genres": ["毛穴・ニキビ"], "keywords": ["ニキビ 治し方"]}, {"id": "3898926444697316308", "username": "ken_nikibi_finish", "text": "何度でも言うけど、赤いニキビ跡は色素沈着じゃない。毛細血管が皮膚の外から透けて見えてるだけだ。だから美白成分をいくら塗っても赤みは消えない。「メラニンを消す」と「血管を治す」は、治し方が根本から違う。「トラネキサム酸入り化粧水を使い続けてるのに消えない」って人、正直に言っておくと、", "permalink": "https://www.threads.com/@ken_nikibi_finish/post/DYbxPGtj2vU", "likes": 26, "velocity": 0.01, "ageHours": 2595.7, "postedAt": "2026-05-17T17:57:53+09:00", "genres": ["毛穴・ニキビ"], "keywords": ["ニキビ 治し方"]}, {"id": "3958284511075731694", "username": "rururuikun._.b", "text": "顎に白ニキビがめっちゃできるんだけどどうしたらいいの〜😭😭😭😭\n皮膚科もいったけど治らない、、\nおすすめの洗顔やスキンケアとか教えてください😭", "permalink": "https://www.threads.com/@rururuikun._.b/post/Dbupsp6mYju", "likes": 26, "velocity": 0.04, "ageHours": 630.2, "postedAt": "2026-08-07T15:31:46+09:00", "genres": ["毛穴・ニキビ"], "keywords": ["ニキビ 治し方"]}, {"id": "3955588209510167394", "username": "__glacee", "text": "数え切れないくらいニキビ大量発生🥺ストレス\n肌治療 始めたい （´-`）.｡oO（なにしたらいいの?）", "permalink": "https://www.threads.com/@__glacee/post/DblEoTZk7Ni", "likes": 26, "velocity": 0.04, "ageHours": 719.5, "postedAt": "2026-08-03T22:14:41+09:00", "genres": ["毛穴・ニキビ"], "keywords": ["大人ニキビ"]}, {"id": "3962630067918434218", "username": "resort_salon_stera", "text": "エステティシャンあるある\n痩身エステ施術しながら自分が滝汗で痩せる。🤣", "permalink": "https://www.threads.com/@resort_salon_stera/post/Db-Fw1Gj2-q", "likes": 26, "velocity": 0.05, "ageHours": 486.3, "postedAt": "2026-08-13T15:25:36+09:00", "genres": ["ダイエット・痩身"], "keywords": ["痩身エステ"]}, {"id": "3900832925591550994", "username": "genkai_mukumi_chan", "text": "ちょっとエグい話する。3年前の私、むくみがひどすぎて、毎朝体重計に乗るのが怖かった。着圧ソックス・リンパマッサージ・むくみ茶・岩盤浴。全部試して全部取れなかった。「もうむくみ体質だから諦めるしかないか・・」って本気で思ってた。そんな時に10年通ってる整体の先生に、脚を触られてこう言われた、、、", "permalink": "https://www.threads.com/@genkai_mukumi_chan/post/DYiiuDaCDwS", "likes": 26, "velocity": 0.01, "ageHours": 2532.6, "postedAt": "2026-05-20T09:05:43+09:00", "genres": ["むくみ・冷え"], "keywords": ["むくみ 解消", "脚 むくみ"]}, {"id": "3902368431622663518", "username": "kamonohasi.aga", "text": "知らなかった。\n「亜鉛は抜け毛に効く」と聞いて\nサプリを飲み続けた結果、\nむしろ抜け毛が増えた。\n皮膚科で正直に話したら\n「それ、男性にすごく多いですよ」と即答された。\n亜鉛は確かに髪に必要なミネラル。\nでも”頑張って補おう”とした瞬間、\n体の中でまったく逆のことが起きる。\nその理由が、", "permalink": "https://www.threads.com/@kamonohasi.aga/post/DYn_2m1kS1e", "likes": 25, "velocity": 0.01, "ageHours": 2481.8, "postedAt": "2026-05-22T11:56:30+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3959248830806875973", "username": "sakura2029pink", "text": "がーーーーーーん\nそんな気してたけど、やっぱりめっちゃ薄くなってる。。。\n\n一昨年くらいから尋常じゃないくらい抜け始めてハゲるんじゃないかと思ってて。\n昨夜、コンタクトもメガネもしてない状態で鏡に光るものが見えた。\n\nえ。。まさか。。。\n眼鏡かけたら。。。\n私の頭皮ーっ😭！\n分け目が。。😭😭\nそしてどこを分けても、分け目の主張がすごい。。。\n\n34くらいから年齢を感じるようになったけど、\n薄毛はもっと後だと思ってたよ😭！？\n37でこんな薄くなるの。。嘘でしょ。。。嘘と言って。。。。。\n毎日が忙し過ぎて抜けてるんか😇？\n年取ったらロングはできなくなるって聞くから、ラストスパートと思ってロングを楽しんでたけど、本当にあと少しかもだなんて信じたくない。。。\n薄毛対策しなきゃダメかな。。😞", "permalink": "https://www.threads.com/@sakura2029pink/post/DbyE9Wpn99F", "likes": 25, "velocity": 0.04, "ageHours": 598.2, "postedAt": "2026-08-08T23:27:42+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3864597131835960115", "username": "yamaguchi_nana__", "text": "リフトアップ手術について他の方にコメントしたところ、反応があったので38歳から６回以上のリフトアップ手術、糸、レーザー、ボト、ヒアルなど様々な美容医療をした私に質問があれば、お答えします🖐️\nちなみに、７回目は来月くらいにします☺️", "permalink": "https://www.threads.com/@yamaguchi_nana__/post/DWhzp2rE2sz", "likes": 25, "velocity": 0.01, "ageHours": 3732.5, "postedAt": "2026-03-31T09:11:40+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3927611893364254628", "username": "c.8592670", "text": "フェイシャルエステに行くとしたら　どのくらいのペースで行くんだろう\nマツエクとかみたいに　見た目が極端に変わらないから　毎月は行かないのかな", "permalink": "https://www.threads.com/@c.8592670/post/DaBrjUnk2ek", "likes": 25, "velocity": 0.02, "ageHours": 1645.9, "postedAt": "2026-06-26T07:50:45+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["フェイシャルエステ"]}, {"id": "3973632909551186668", "username": "mika.n4574", "text": "筋トレ始めた頃から薄毛が\n始まったんだけど\n同じひといますか🥲？\nタンパク質不足なのかな😭\n女です😭", "permalink": "https://www.threads.com/@mika.n4574/post/DclLhP5mbLs", "likes": 25, "velocity": 0.21, "ageHours": 121.9, "postedAt": "2026-08-28T19:46:17+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3956721743847096208", "username": "sparkline789", "text": "Threadsかインスタで見た、\nローリング頭皮マッサージャー💆\n\n頭皮ほぐすだけで\n顔の印象まで変わるなんて。\n\n転がすだけで超気持ちいいし\n脱毛にも良いらしい🥹✨", "permalink": "https://www.threads.com/@sparkline789/post/DbpGXZhEf-Q", "likes": 25, "velocity": 0.04, "ageHours": 681.9, "postedAt": "2026-08-05T11:46:49+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3934867682516745664", "username": "sari.yomogi", "text": "肌質改善エステ　見かけるけど\nどういうことをやってくれるんやろう", "permalink": "https://www.threads.com/@sari.yomogi/post/DabdU82kz3A", "likes": 25, "velocity": 0.02, "ageHours": 1405.6, "postedAt": "2026-07-06T08:06:42+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["フェイシャルエステ"]}, {"id": "3954010598429168145", "username": "kumi_biyo_official", "text": "何回言わせるのよ！！！アラフォーで顔がくすむ人と明るい人の差は、美白美容液の差じゃないのよ！！\nいい、くすみには種類があるのよ。今からでも遅くないわ、自分のくすみ見極めて、次の順に手を打って！￼", "permalink": "https://www.threads.com/@kumi_biyo_official/post/Dbfd7ClgBIR", "likes": 25, "velocity": 0.03, "ageHours": 771.7, "postedAt": "2026-08-01T18:00:16+09:00", "genres": ["くすみ・美白"], "keywords": ["美白 ケア"]}, {"id": "3951701785483763884", "username": "kaho_interviewer", "text": "ここ最近、むくみがひどくて辛いです。むくみ解消におすすめなもの、ことを教えてくださる方はいませんか？\n即効性のあるとうれしいです。むくみって、更年期の症状なのでしょうか？🤔", "permalink": "https://www.threads.com/@kaho_interviewer/post/DbXQ9Y-CWCs", "likes": 25, "velocity": 0.03, "ageHours": 848.1, "postedAt": "2026-07-29T13:33:04+09:00", "genres": ["むくみ・冷え"], "keywords": ["むくみ 解消", "脚 むくみ"]}, {"id": "3926194054697678879", "username": "yui_ensoleille", "text": "1〜2ヶ月前くらいからかな？\nめっちゃ毛が抜ける。\nシャンプーとドライヤーの後、引くくらい抜ける。\n髪の毛のボリュームがすごい減ってきて落ち込む。\nとりあえず皮膚科受診したらいいんですかね？\n髪は女の命というけれど、本当にごっそり抜けると気持ちが滅入る…", "permalink": "https://www.threads.com/@yui_ensoleille/post/DZ8pLDdgXgf", "likes": 24, "velocity": 0.01, "ageHours": 1692.8, "postedAt": "2026-06-24T08:53:45+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["抜け毛 対策", "発毛"]}, {"id": "3862078009944202044", "username": "beautyblog3010", "text": "無印の頭皮スプレー、ほんとに良いです👍\n長期使用してみて、頭皮の臭いがなくなった感じがします。\n\nピンク：育毛エッセンス（髪の根元を強化して、髪を長く育てる）\nグレー：乾燥した敏感な頭皮の調整、フケの改善。", "permalink": "https://www.threads.com/@beautyblog3010/post/DWY23zlkls8", "likes": 24, "velocity": 0.01, "ageHours": 3815.9, "postedAt": "2026-03-27T21:46:37+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["育毛剤", "頭皮ケア"]}, {"id": "3971383449697977823", "username": "komemecchasuki", "text": "9月から肌管始めようとしている\n30代半ばです\n迷走しすぎて何からやろうか決まらないです\nホクロ取りは冬くらいにやろうかなと思っています\nその他はほうれい線毛穴皮膚のタルミなどが気になっていて今のところやりたいなと思う施術が\nジャルプロ/モフィウス/リジュラン\nルメッカ/プルリアル/ウルセラ\nです\nどこをどうしたらいいか…\n図々しくて本当にすみません有識者の方アドバイス頂けますと幸いです", "permalink": "https://www.threads.com/@komemecchasuki/post/DcdMDTKHQXf", "likes": 24, "velocity": 0.12, "ageHours": 196.4, "postedAt": "2026-08-25T17:17:01+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["ほうれい線"]}, {"id": "3854022483351542729", "username": "sirosiba.kohaku", "text": "犬を飼ってる方、部屋や服の抜け毛対策どうしてますか！ベッドで一緒に寝てる方はパジャマは毛だらけ覚悟ということですか？\n洗濯の時は部屋着の毛だらけと外出する時の服と分てしてるんですか", "permalink": "https://www.threads.com/@sirosiba.kohaku/post/DV8PQd0iZvJ", "likes": 24, "velocity": 0.01, "ageHours": 4082.7, "postedAt": "2026-03-16T19:01:43+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["抜け毛 対策"]}, {"id": "3969112260052455462", "username": "ynm1432", "text": "髪サラサラにするには\n縮毛矯正がいいのか\n髪質改善トリートメントか\nはたまたそれ以外かー\nなにしたらいいのー\nとぅるとぅるになりたい", "permalink": "https://www.threads.com/@ynm1432/post/DcVHpI-ExAm", "likes": 24, "velocity": 0.09, "ageHours": 271.6, "postedAt": "2026-08-22T14:04:34+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3944949331585660689", "username": "noa.beauty2", "text": "フェイスラインを変えたいなら、\n顔だけを一生懸命マッサージするより、\n首や鎖骨まわりから整えるのがおすすめ😊\n\nむくみやすい朝や、お風呂上がりにも\n取り入れやすい1分ケアです✨\n\n📍鎖骨の上 30秒\n📍耳下腺 30秒\n📍耳の後ろから首・フェイスラインへ流す\n📍首を斜め上に10秒伸ばす\n\n毎日コツコツ続けることが一番の近道。\n\n保存して習慣にしてくださいね💕\n「やっ  "username": "___lipps_", "text": "フェイスラインのたるみ改善なにがいいんだろ。\nマッサージとか自力でやるのは絶対続かないから\nお金かかっても美容医療に頼りたい…", "permalink": "https://www.threads.com/@___lipps_/post/DaeczD-kipZ", "likes": 19, "velocity": 0.01, "ageHours": 1377.7, "postedAt": "2026-07-07T11:59:48+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["たるみ 改善"]}, {"id": "3968616650094854085", "username": "0n0n1o1o", "text": "毎回ひどい顎ニキビが…🥲皮膚科に行ってもべピオを塗る、化粧をしない…色々言われるのですがなかなか治らず…毎月悩まされる🥲🥲", "permalink": "https://www.threads.com/@0n0n1o1o/post/DcTW9EOmr_F", "likes": 19, "velocity": 0.07, "ageHours": 288.0, "postedAt": "2026-08-21T21:39:53+09:00", "genres": ["毛穴・ニキビ"], "keywords": ["大人ニキビ"]}, {"id": "3963103515007138629", "username": "okann_biyoo", "text": "あごと口周りにできるニキビ、順番間違えてる人が9割。赤く腫れてる初日から、ビタミンC美容液とピーリングで跡を消しにいく人が本当に多いけど、それ完全に逆走なの。炎症中の肌に攻めのケアをすると、悪化して色素沈着がひどく残る。コンシーラーで密閉するのも、アクネ菌が増えて逆効果。ニキビには「炎症期」と「色素沈着期」の2フェーズがあって、やることが全然違うの。正しい順番、書いておくね↓", "permalink": "https://www.threads.com/@okann_biyoo/post/Db_xaZEGjtF", "likes": 19, "velocity": 0.04, "ageHours": 470.6, "postedAt": "2026-08-14T07:06:21+09:00", "genres": ["毛穴・ニキビ"], "keywords": ["大人ニキビ"]}, {"id": "3893941066718098739", "username": "cheetah.5377416", "text": "threadの皆様のお力添えいただけたらと思いまして…\n33歳です。若い頃から肌荒れに悩まされてきました。良くなってきた時もありましたが、本当に治らないんです…日々新たなボコボコっとしたものが増えまして…かゆみもあります。\nこの肌に何かアドバイスありましたらください…お見苦しくて申し訳ありません！\n\nちなみに皮膚科に通っていて、朝ビラノア、夜エバスチンを服用しています。。。", "permalink": "https://www.threads.com/@cheetah.5377416/post/DYKDsTqCbUz", "likes": 19, "velocity": 0.01, "ageHours": 2760.8, "postedAt": "2026-05-10T20:52:49+09:00", "genres": ["毛穴・ニキビ"], "keywords": ["肌荒れ 原因"]}, {"id": "3945359004155012084", "username": "onma_beauty63", "text": "「ハトムギ茶」、本気でやばい飲み物です。皮膚科の先生に「コーヒーやめてハトムギ茶にするとお肌ピカピカになるのに」って言われて、63歳オンマが半年飲み続けたら、肌トーンアップ、ニキビ跡が薄くなって、朝のむくみもなくなったんです。中でも、レモンを入れてほんのり甘くして美味しいジュースみたいに飲める「ハトムギ茶」があって、", "permalink": "https://www.threads.com/@onma_beauty63/post/DbAuxxiDGP0", "likes": 19, "velocity": 0.02, "ageHours": 1058.2, "postedAt": "2026-07-20T19:31:05+09:00", "genres": ["くすみ・美白" 026-08-31T18:17:20+09:00", "genres": ["薄毛", "育毛・頭皮ケア"], "keywords": ["髪 ボリューム", "頭皮ケア"]}, {"id": "3921961880286087354", "username": "biyou_karakuchi", "text": "『皮脂フィラメント』の投稿が28万人に見られてる🫣毛穴が気になる人はまず鏡で自分の鼻をよーくみてみて？\n皮脂フィラメントの特徴は\n①鼻全体に均一に分泌されている\n②触っても凹凸はない\n③白っぽい糸状のものがでてくる\n画像の毛穴タイプは、皮脂フィラメント×メラニン毛穴で、皮脂フィラメントを指で押し出したり毛穴パックなどの過度な刺激で、毛穴の周りがリング状に色素沈着している。ハイドラやピーリングなどで綺麗にしてもまた同じように目立ってくる。じゃあ根本改善するにはどうしたらいいかというと、", "permalink": "https://www.threads.com/@biyou_karakuchi/post/DZtm4z5E0i6", "likes": 16, "velocity": 0.01, "ageHours": 1832.9, "postedAt": "2026-06-18T12:45:11+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["ほうれい線"]}, {"id": "3863077459378524349", "username": "bananafish326", "text": "TOYOTA RAV4\n3.5inc リフトアップ 仕上がりました～", "permalink": "https://www.threads.com/@bananafish326/post/DWcaHtaE1C9", "likes": 16, "velocity": 0.0, "ageHours": 3782.8, "postedAt": "2026-03-29T06:52:21+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3898614928639221884", "username": "root_higashiurawa", "text": "頭皮の血流改善で一番手軽なのって何か知ってる？マッサージじゃないんよ、、、", "permalink": "https://www.threads.com/@root_higashiurawa/post/DYaqZ8xk2B8", "likes": 16, "velocity": 0.01, "ageHours": 2606.0, "postedAt": "2026-05-17T07:39:02+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア", "頭皮マッサージ"]}, {"id": "3857604902127152212", "username": "biyou.tama", "text": "断言するけど、顎下すっきりしたい人はXERF（ザーフ）。脂肪層の深くまで高周波を浸透することが可能。切らないリフトアップとして注目されている。ポイントは、一人ひとりの肌の状態、顔のたるみの状態に応じて3段階の深さ、エネルギーレベルを設定ができる。一人ひとりの肌の状態に合ったカスタマイズ治療ができる。実際やってみて、XERFは痛みが少なく、あたたかい～ちよっと熱いくらい。効果は、", "permalink": "https://www.threads.com/@biyou.tama/post/DWI9zhTGCxU", "likes": 16, "velocity": 0.0, "ageHours": 3964.0, "postedAt": "2026-03-21T17:39:21+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3969774771818870945", "username": "nikibi_neki", "text": "本当にもったいない。亜鉛って皮膚の回復や炎症に関わってて、赤ニキビに悩む人ほど意識したい栄養素なのよ。ただニキビ歴長めの私が調べまくったら、摂り方を間違えると金ドブ。そのピッタリな摂り方とは、、", "permalink": "https://www.threads.com/@nikibi_neki/post/DcXeR9Ikjih", "likes": 16, "velocity": 0.06, "ageHours": 249.7, "postedAt": "2026-08-23T12:00:51+09:00", "genres": ["毛穴・ニキビ"], "keywords": ["大人ニキビ"]}, {"id": "3922182879102197877", "username": "xli_q23", "text": "使ってる化粧品をちょっと変えて、\n・Anua 100+の化粧水(PDRN)\n・なめらか本舗　豆乳イソフラボン含有の薬用エイジングケア美容液(ナイアシンアミド) ←🆕\n・肌ラボ　白潤プレミアムの薬用美白乳液\nを数日前から寝る時使っていて、\n\nAnua 100+(PDRN)でキメが一気に整う感じを感じたけどナイアシンアミドでさらに肌が一様に光を反射できるようになった気がする\n\n顔全体の肌美しくできるように頑張る🔥✊🏻", "permalink": "https://www.threads.com/@xli_q23/post/DZuZIxFAWB1", "likes": 16, "velocity": 0.01, "ageHours": 1825.5, "postedAt": "2026-06-18T20:13:48+09:00", "genres": ["たるみ・シワ"], "keywords": ["エイジングケア"]}, {"id": "3973759280154221004", "username": "beautiful_days2026", "text": "肌の透明感が上がって、\n気持ち肝斑が薄くなった。\nやっぱり資生堂。\n\nお肌が綺麗な友達が、お金かけるなら美容液って言ってる子がいたけど、納得〜。", "permalink": "https://www.threads.com/@beautiful_days2026/post/DcloQLsgRnM", "likes": 16, "velocity": 0.14, "ageHours": 117.7, "postedAt": "2026-08-28T23:57:22+09:00", "genres": ["くすみ・美白"], "keywords": ["肌 透明感"]}, {"id": "3884821040006938925", "username": "hairsalon.kinu", "text": "２ヶ月の変化。まだまだ続けます\n育毛は《予防ケア》が1番大切☝️\n早ければ早いスタートほど良いし、回数と量は重要ですね。\n育毛剤、サプリ、AGA薬に頼らない最新の育毛、白髪改善方法をマニアックに研究しているオタク美容師です。\n常に自分が実験台。\n髪とボリュームは頭皮の奥から変える必要があります😊土台こそが全て👍", "permalink": "https://www.threads.com/@hairsalon.kinu/post/DXpqCc5k8Et", "likes": 15, "velocity": 0.0, "ageHours": 3062.8, "postedAt": "2026-04-28T06:52:57+09:00", "genres": ["薄毛", "育毛・頭皮ケア"], "keywords": ["髪 ボリューム", "育毛剤", "AGA", "頭皮ケア", "薄毛 対策"]}, {"id": "3907677224859001842", "username": "mokon_chan", "text": "45歳を過ぎてから、「1日3食きっちり食べる人」ほど髪のボリュームに悩みやすい。\n朝は豆乳、昼はヘルシーな定食、夜もしっかり、間食にナッツ。そんな「模範的な食生活」のはずなのに、抜け毛が変わらない。夕方になると顔がくすむし、疲れが抜けきらない。\n良かれと思ったその習慣が、大人の髪に必要な「ある若返りシステム」を1日中潰し続けている可能性がある。\nそのシステムとは、", "permalink": "https://www.threads.com/@mokon_chan/post/DY627t0muPy", "likes": 15, "velocity": 0.01, "ageHours": 2306.0, "postedAt": "2026-05-29T19:44:07+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3879123545183788222", "username": "afuro_ya_a", "text": "元々毛量多めの私なんだけど、若い頃に比べるとめちゃくちゃ髪の毛減った!!!\nってかシャンプーする度抜け毛がすごい...って思ってたのね。\n\nこのブラシを毎日使うようになって2ヶ月。\n\nアホ毛が増えた(毛が生えた)気がする\n\nめっちゃ頭皮まで届く。\n\nこれ使いだしたらタン〇ルティーザー全然髪の根元に届かないじゃん...っ思って使えなくなった...。", "permalink": "https://www.threads.com/@afuro_ya_a/post/DXVak_WiJy-", "likes": 15, "velocity": 0.0, "ageHours": 3251.5, "postedAt": "2026-04-20T10:13:03+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["発毛"]}, {"id": "3900206838755548451", "username": "3____amae", "text": "糸リフトやってみたい\n\n糸リフト初日、翌日ってどんな感じですか？\nパンパンに腫れますか？\n\n片側3本ずつ入れる予定です。", "permalink": "https://www.threads.com/@3____amae/post/DYgUXSmkt0j", "likes": 15, "velocity": 0.01, "ageHours": 2553.3, "postedAt": "2026-05-19T12:21:48+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3973763237774172384", "username": "pupupumama2026", "text": "汚いお肌を晒してすみません、、\n\n若い頃にひどいニキビで、いまだに生理前はたまに顎辺りにニキビが出来たりします😭\n\nとにかく肌荒れしないように今までケアしてしてきましたが、すっぴんだと毛穴が目立ち過ぎてどんなホームケアをしたらいいか悩んでいます😣\n表面がざらついているわけではないのですが、スキンケアに詳しい方がいらっしゃいましたら是非教えてください🙏💦", "permalink": "https://www.threads.com/@pupupumama2026/post/DclpJxhCSDg", "likes": 15, "velocity": 0.13, "ageHours": 117.6, "postedAt": "2026-08-29T00:05:14+09:00", "genres": ["毛穴・ニキビ"], "keywords": ["大人ニキビ"]}, {"id": "3973448212158619017", "username": "shino_____75", "text": "50歳の女性の皆さまお肌のケア\nどうされてますかー？", "permalink": "https://www.threads.com/@shino_____75/post/DckhhjDIB2J", "likes": 15, "velocity": 0.12, "ageHours": 128.0, "postedAt": "2026-08-28T13:39:20+09:00", "genres": ["たるみ・シワ"], "keywords": ["エイジングケア"]}, {"id": "3974159077757473713", "username": "i__109", "text": "医療脱毛終わったけど全然生えてる▓、、、", "permalink": "https://www.threads.com/@i__109/post/DcnDKAOoNOx", "likes": 15, "velocity": 0.14, "ageHours": 104.5, "postedAt": "2026-08-29T13:11:41+09:00", "genres": ["脱毛"], "keywords": ["医療脱毛"]}, {"id": "3945014958828512742", "username": "graf_eyebrow_ny", "text": "だらか言ったじゃない...\n眉毛の自己処理をしすぎたらこーなるって...", "permalink": "https://www.threads.com/@graf_eyebrow_ny/post/Da_gjQWk2Xm", "likes": 15, "velocity": 0.01, "ageHours": 1069. alink": "https://www.threads.com/@kaori_yoga_instructor/post/DbEM6fbk6v8", "likes": 14, "velocity": 0.01, "ageHours": 1025.8, "postedAt": "2026-07-22T03:52:11+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3965774925014082060", "username": "___me_mn", "text": "結局のところ毛穴に有効なケアって何ですか❔\nThreadsはPRばっかりで何を信じたら良いのかわからない😖❗", "permalink": "https://www.threads.com/@___me_mn/post/DcJQ0hgnaIM", "likes": 14, "velocity": 0.04, "ageHours": 382.1, "postedAt": "2026-08-17T23:33:53+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["毛穴 ケア"]}, {"id": "3973618067486069758", "username": "emi_alphaz_uotami", "text": "@alphaz.domi \n頭頂部薄毛でげんなりしてたところ\nオススメしてもらったリリーイブ使用前から2本使い切るところ…\n\n多少分け目が違うけど、どうだろうか？\n実感としては頭頂部ぺちゃだったのがしっかり立ち上がる気がする🥹\nブラシで頭皮マッサージしてるからかしっかり頭皮が真っ白黄ばんでない🥹\n健康な頭皮を維持してる証拠だね🥳\nこれは続ける価値がある💕\n\n今日からメガ割だから買い足そう💇‍♀️\ndomiさんオススメありがとうございました～🫶🫶🫶‪‪💕", "permalink": "https://www.threads.com/@emi_alphaz_uotami/post/DclIJRJlNP-", "likes": 14, "velocity": 0.11, "ageHours": 122.4, "postedAt": "2026-08-28T19:16:48+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3897412681645146114", "username": "aya_biyouiryou", "text": "本当は教えたくないんですが。ほうれい線、頭皮マッサージだけで変わります。美容クリニックが絶対言わないやつ。でも言います。", "permalink": "https://www.threads.com/@aya_biyouiryou/post/DYWZC9Aj8AC", "likes": 14, "velocity": 0.01, "ageHours": 2645.9, "postedAt": "2026-05-15T15:50:18+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3963184406286452718", "username": "i_am_smile_123", "text": "ハイライトって生え際こんな感じだっけ？\nこれで1万3000円ってひどくない😢", "permalink": "https://www.threads.com/@i_am_smile_123/post/DcADzg8Ekfu", "likes": 14, "velocity": 0.03, "ageHours": 467.9, "postedAt": "2026-08-14T09:46:59+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3923565549996603666", "username": "_naho.house_", "text": "てかさ、\n2年ダイエットしてて結局体重止まってしまってこれ以上痩せられないのが続いてて、これダイエットしてなかったら どうなってたんだろう🐷怖い😱\nアラフォーは体型維持むずいね、、、", "permalink": "https://www.threads.com/@_naho.house_/post/DZzThRsgfkS", "likes": 14, "velocity": 0.01, "ageHours": 1779.8, "postedAt": "2026-06-20T17:51:23+09:00", "genres": ["ダイエット・痩身"], "keywords": ["部分痩せ"]}, {"id": "3906906061953637109", "username": "kazu.peace.life", "text": "自律神経失調症の人ほど「もっと頑張ってセルフケアすれば昔みたいに戻れる」って考えて、逆に症状を悪化させてる。サプリ、運動、睡眠改善、マインドフルネスとか、", "permalink": "https://www.threads.com/@kazu.peace.life/post/DY4Hl0ZkRr1", "likes": 14, "velocity": 0.01, "ageHours": 2331.5, "postedAt": "2026-05-28T18:11:57+09:00", "genres": ["エステ・リラクゼーション"], "keywords": ["自律神経 整える"]}, {"id": "3933045399363323074", "username": "oyausuge", "text": "薄毛で来られる方の8割が、\n\n頭皮の血流が\n普通の人の半分以下、\n\nという結果でした", "permalink": "https://www.threads.com/@oyausuge/post/DaU-_PaiQTC", "likes": 13, "velocity": 0.01, "ageHours": 1465.9, "postedAt": "2026-07-03T19:46:09+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3933813718883432112", "username": "fusafusa_gingin", "text": "知ってるか。発毛に使うミノキシジル、仕組みとしては「血流を良くする」だけなんだ。逆に言うと体温を上げるだけで同等の効果が期待できる。まず、", "permalink": "https://www.threads.com/@fusafusa_gingin/post/DaXtrwumvaw", "likes": 13, "velocity": 0.01, "ageHours": 1440.5, "postedAt": "2026-07-04T21:12:40+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["発毛"]}, {"id": "3964196686776284739", "username": "niisa233", "text": "教えてください。\n\n夫が薄毛治療をはじめたいと言い出して\nみなさん、どこでお薬をもらっていますか？\n\n皮膚科？\nAGA外来？\nオンライン？\n\n10年前から薄くなり始めて\nM字と後頭部が薄いです。\n\n検索魔になってしまい、余計にわからなくなりました💦", "permalink": "https://www.threads.com/@niisa233/post/DcDp-InFLZD", "likes": 13, "velocity": 0.03, "ageHours": 434.4, "postedAt": "2026-08-15T19:18:12+09:00", "genres": ["育毛・頭皮ケア", "薄毛"], "keywords": ["発毛", "AGA"]}, {"id": "3916412780484384939", "username": "natsumi19870912", "text": "久しぶりの投稿です！\nプロファイロを打って1ヶ月。\nむくみもなくなり完成かな？\n確かに肌艶はよくなります。\nすっぴんですがツヤッとします。\nただ…\nリフトアップ効果はないかな？\nただ3週間は顔がむくみますので\n失敗！？ええええ😭！？\nとなりますが、見事にひきました笑", "permalink": "https://www.threads.com/@natsumi19870912/post/DZZ5Kx-klir", "likes": 13, "velocity": 0.01, "ageHours": 2016.7, "postedAt": "2026-06-10T21:00:06+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3901645536818740003", "username": "jimu_neesan", "text": "20代のうちにやっておきたい施術3選\n※個人的な意見です\n\n3位：ボトックス（予防打ち）\n→シワになる前に打つのが正解\n早めにケアするほどコスパがいい💉\n2位：ハイフ（HIFU）\n→たるみケアは20代から始めると全然違う\nリフトアップ効果で輪郭がすっきり✨", "permalink": "https://www.threads.com/@jimu_neesan/post/DYlbfGlkbsj", "likes": 13, "velocity": 0.01, "ageHours": 2505.7, "postedAt": "2026-05-21T12:00:14+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3918253653606257793", "username": "maro_n0505", "text": "【無印良品　ヘアコーム】\n\nここで見て気になって数ヶ月前に購入。\n本来は頭皮マッサージ用のブナ材へアコームです。\n私の場合は頭皮のマッサージよりも、首筋や耳の下を優しく押す使い方にどハマり中。\n本来の使い方ではないかもしれないけど、私には\n『首筋専用・そこそこコーム」』になってます。🤭\n\n❣️私の撮った写真を元に､チャッピーがわかりやすく作ってくれました😊", "permalink": "https://www.threads.com/@maro_n0505/post/DZgbvArE9SB", "likes": 13, "velocity": 0.01, "ageHours": 1955.7, "postedAt": "2026-06-13T09:57:36+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3858417719134330519", "username": "uka_marikotomo", "text": ".\n頭皮ケア、ヘアセット\n後頭部までできてますか？\n\n自分では見えないけど意外と見られてる後頭部！\n\n特につむじは自分が思ってるより少し後ろにあります！\n\nつむじ周りは生え癖が強く、\n髪がパックリ割れやすかったり\n根本から潰れてペチャンコになりやすいです！\n\nそんな【つむじ割れ】を改善させてくれるのが、\nukaの頭皮用美容液　リセラム\nスタイリングミスト　ペチャンコ\nこのセットが最強です👍\n\n頭皮用美容液\"リセラム\"は\n発売から約３ヶ月経って、\n【髪の立ち上がりが良くなった！】\n【つむじ割れがしにくくなった！】\nとお客様からのお声を頂くことが増えてきました！\n\nリセラムで髪の毛本来の立ち上がりを良くして、\nペチャンコでさらに根本からふんわり感をキープ✨\n\n髪のボリュームダウンが気になる方、\nつむじや生え癖で髪が割れる、ペタンとする方、\n是非このセットで使ってみてください💁‍♀️\n\n#つむじ割れ解消 #髪のボリュームアップ \n#頭皮用美容液 #スカルプセラム \n#リセラムフォースカルプ", "permalink": "https://www.threads.com/@uka_marikotomo/post/DWL2nkIEx6X", "likes": 13, "velocity": 0.0, "ageHours": 3937.1, "postedAt": "2026-03-22T20:34:18+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3936799114923055600", "username": "richan_dn", "text": "生後2ヶ月半にしてついに恐れていた\n産後の抜け毛が来た😭😭😭\n女としてすでに体ボロボロなのにさらに抜け毛もなんて悲しい！😇", "permalink": "https://www.threads.com/@richan_dn/post/DaiUe_dD5nw", "likes": 13, "velocity": 0.01, "ageHours": 1341.6, "postedAt": "2026-07-09T00:04:07+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["抜け毛 対策"]}, {"id": "3931338810072501021", "username": "kami_neesan_", "text": "縮毛矯正をかけようとしてる更年期以降の人、先に確認することがあるで。エイジング毛は内部のケラチンが流出して空洞状態になってることが多い。空洞の髪に強い薬剤を当てると耐えられんでビビリ毛になることがある。何をするかっていうと、", "permalink": "https://www.threads.com/@kami_neesan_/post/DaO69GSFAsd", "likes": 13, "velocity": 0.01, "ageHours": 1522.4, "postedAt": "2026-07-01T11:15:33+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["抜け毛 対策"]}, {"id": "3953244721345851195", "username": "af.hustler", "text": "走行距離3．5万km、最近乗り心地が悪い😅　\nおそらくショックがヘタっていると思われます。\nオススメのショックアブソーバーありますか？40ミリリフトアップです。\njb64", "permalink": "https://www.threads.com/@af.hustler/post/DbcvyD-Ae87", "likes": 13, "velocity": 0.02, "ageHours": 797.1, "postedAt": "2026-07-31T16:38:36+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3958079596096884271", "username": "chihiro_mois.shuri", "text": "もうね、本当に人生変わるレベルじゃない？😭\n常にコンシーラーで隠していた赤ら顔と、くり返すニキビ。\nたった6ヶ月でタマゴ肌になりました🥹\n\nあることを変えただけなのですが、知りたい方いますかー？🙋🏻‍♀️", "permalink": "https://www.threads.com/@chihiro_mois.shuri/post/Dbt7Gv-E44v", "likes": 13, "velocity": 0.02, "ageHours": 637.0, "postedAt": "2026-08-07T08:44:38+09:00", "genres": ["毛穴・ニキビ"], "keywords": ["大人ニキビ"]}, {"id": "3883082513975465900", "username": "nono910.n", "text": "ほうれい線と戦い数年。(スッピン写真もあるのでモザイクします)\n👇過去の施術👇\nHIFU(複数回)\nデンシティ(2025.6)\nポテンツァダイアモンドチップ(2025.10〜4回)\n脂肪溶解注射2ccカベリン(2026.3)\n脂肪溶解注射2回目に突入しようと思った矢先、チャッピーに、私の顔はコケて老ける！ヒアルロン酸を頬に少し足すことを勧められました。\nどう思いますか？😣😭😣", "permalink": "https://www.threads.com/@nono910.n/post/DXjevkXCdes", "likes": 13, "velocity": 0.0, "ageHours": 3120.4, "postedAt": "2026-04-25T21:18:49+09:00", "genres": ["たるみ・シワ"], "keywords": ["ほうれい線"]}, {"id": "3854025236937869788", "username": "minami_734", "text": "正直、これ仕込むだけで肌ランク1段上がる。\n資生堂さん、またやらかしてる。これ仕込むだけでツヤ肌＋透明感まで底上げされるのバグすぎる。「元から肌きれいな人」を偽装できるやつ。", "permalink": "https://www.threads.com/@minami_734/post/DV8P4iTEonc", "likes": 13, "velocity": 0.0, "ageHours": 4082.6, "postedAt": "2026-03-16T19:07:12+09:00", "genres": ["くすみ・美白"], "keywords": ["肌 透明感"]}, {"id": "3901201845230418032", "username": "horumi_yuragibiyou", "text": "前髪に白髪が多い人が、一番やりがちなミスを言います。前髪・生え際の白髪は、胃腸の疲れのサイン。だから亜鉛サプリを飲んでも、頭皮マッサージをしても変わらない。胃腸が整っていないと、栄養が髪に届く前になくなっているんです。私も最初、白髪の生える場所を気にせずに亜鉛サプリを半年飲み続けました。でも変わらず....(泣)婦人科医の夫に話したら、￼", "permalink": "https://www.threads.com/@horumi_yuragibiyou/post/DYj2mimDrhw", "likes": 12, "velocity": 0.0, "ageHours": 2520.4, "postedAt": "2026-05-20T21:18:42+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3950447004606259158", "username": "temari.yakuzen", "text": "抜け毛や薄毛が気になる人、\n頭のてっぺんを\n指で押してみて。\n\nブヨブヨしてるか\nガチガチに硬いなら\n頭皮の血行が\n滞っているサインで、", "permalink": "https://www.threads.com/@temari.yakuzen/post/DbSzp7Nj9_W", "likes": 12, "velocity": 0.01, "ageHours": 889.7, "postedAt": "2026-07-27T20:00:02+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3889144170669810257", "username": "chie.kogao.design", "text": "小顔にならない女性には、共通する特徴がある。\n当てはまってないよね？\n\n1.足が…￼", "permalink": "https://www.threads.com/@chie.kogao.design/post/DX5BASFDiJR", "likes": 12, "velocity": 0.0, "ageHours": 2919.7, "postedAt": "2026-05-04T06:02:15+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["小顔"]}, {"id": "3872674739408320906", "username": "tiki.scalpink", "text": "頑張って薄毛改善しました！\n\n長年のコンプレックス。\n\nどの位の期間で改善したかというと、、", "permalink": "https://www.threads.com/@tiki.scalpink/post/DW-gSg9D7mK", "likes": 12, "velocity": 0.0, "ageHours": 3465.0, "postedAt": "2026-04-11T12:40:26+09:00", "genres": ["薄毛"], "keywords": ["AGA", "薄毛 対策", "つむじ 薄毛"]}, {"id": "3895429377073331696", "username": "ha._.zu085", "text": "産後3ヶ月たって最近抜け毛酷い🥹\n同じくらいの産後のママさん達で同じかたいますか🥹\nそれとも人によりますか?、、\n対策教えてください🥹💗", "permalink": "https://www.threads.com/@ha._.zu085/post/DYPWGEsE73w", "likes": 12, "velocity": 0.0, "ageHours": 2711.5, "postedAt": "2026-05-12T22:09:50+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["抜け毛 対策"]}, {"id": "3911037356156837559", "username": "ooyashinkyu134", "text": "薄毛鍼、3年やってきて分かったこと、全部書きます。", "permalink": "https://www.threads.com/@ooyashinkyu134/post/DZGy8D9At63", "likes": 12, "velocity": 0.01, "ageHours": 2194.7, "postedAt": "2026-06-03T11:00:06+09:00", "genres": ["育毛・頭皮ケア", "薄毛"], "keywords": ["発毛", "薄毛 対策", "つむじ 薄毛"]}, {"id": "3961464099766944854", "username": "nemui0o_", "text": "メラニン毛穴におすすめのスキンケアってなんだろう、、クレンジングも悩ましい、、", "permalink": "https://www.threads.com/@nemui0o_/post/Db58pwpEkRW", "likes": 12, "velocity": 0.02, "ageHours": 524.9, "postedAt": "2026-08-12T00:49:02+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["毛穴 ケア"]}, {"id": "3955802012336228494", "username": "029_mzk_", "text": "この1ヶ月足らずで\nすごい抜け毛で一気にハゲてきた\n頭頂部が前から後ろまでめっちゃ透けてる\nこれって原因とかあるん？\nハゲって突然くるもんなん？\n毎日めっちゃ抜けるねん\nほんまいやや……", "permalink": "https://www.threads.com/@029_mzk_/post/Dbl1PizE4iO", "likes": 12, "velocity": 0.02, "ageHours": 712.4, "postedAt": "2026-08-04T05:19:29+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3943511063564344793", "username": "kumi_zaki", "text": "子供が蛇行性脱毛症で2年間局所免疫療法で治療してました。改善してきたのでここ半年は通院回数を2、3ヶ月に一度の流れになり6月上旬に行ったのが最後で次回は8月下旬の受診です。\nこの2年、時折抜け毛が多いなと感じる時がありましたが１ヶ月もすれば落ち着いていました。3月の中旬より抜け毛が増えたなと感じていて、と言ってもシャンプーの時やブラッシングで5〜10本程度。枕にもほぼ抜け毛はついてません。\nこれでも抜け毛がほぼ０だった時が通常なのを知ってるので抜け期かなと思って見守ってきました（抜け毛は私の方が多いです）\n今現在は同じような抜け毛の量です。\n私しかわからないレベルですが、眉毛も薄くなってます。\nゆっくりと脱毛が進んでる印象なのですが、、医師に言っても健康な人でも1日50〜100本抜ける、気にしてるのはお母さんだけど言われたり、、通院を拒む娘の気持ちを優先して受診してません。\nでも、めくるとスカスカですし、短い毛も見えず…地肌が目立つポイントもいくつかあります。一昨年の秋に後頭部にできた爪の先程の脱毛班も全く変化がありません。抜け毛は多くないけど生えてこない印象。", "permalink": "https://www.threads.com/@kumi_zaki/post/Da6Kmsvk13Z", "likes": 12, "velocity": 0.01, "ageHours": 1119.4, "postedAt": "2026-07-18T06:19:33+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["発毛"]}, {"id": "3923655913131746324", "username": "kami_neesan_", "text": "ヘッドスパで「うわ、頭皮カチカチですね」言われた時、マジで凍りついた。指で動かんくらい固かってん。頭皮が硬いと血流が落ちて、白髪も薄毛も進みやすい。けどお金かけてスパ通わんでも家で柔らかくできるで。家でできる方法がな、めっちゃ簡単で、", "permalink": "https://www.threads.com/@kami_neesan_/post/DZzoEO7FCQU", "likes": 12, "velocity": 0.01, "ageHours": 1776.9, "postedAt": "2026-06-20T20:50:57+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3968343506338552313", "username": "nana_beautylife39", "text": "で、結局ほうれい線には何がオススメですか？\n\nマッサージは毎日してるので、\n美容医療編をこっそり聞いてみたいです！！", "permalink": "https://www.threads.com/@nana_beautylife39/post/DcSY2TSCZn5", "likes": 12, "velocity": 0.04, "ageHours": 297.1, "postedAt": "2026-08-21T12:37:11+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["ほうれい線"]}, {"id": "3976535778658615720", "username": "ganmen.kakin", "text": "切開リフト後2ヶ月すぎて、今日夫に「えっ⁇小顔になった⁇」とめちゃくちゃ驚かれた。\n久しぶりに顔見たのかしら💦\nまぁ、嬉しいは嬉しい😆", "permalink": "https://www.threads.com/@ganmen.kakin/post/DcvfjjblAGo", "likes": 12, "velocity": 0.47, "ageHours": 25.8, "postedAt": "2026-09-01T19:53:46+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3946648429590170442", "username": "mochi_mochi_life_", "text": "美容垢の先輩方‼️大変恐縮ですがアドバイスください🙇🏻‍♀️,,\nお見苦しい写真で申し訳ないですが、このような毛穴には何をしたら良いのでしょうか。\n中学生の頃に角栓とったり、ニキビ潰してました👊💥\n直近では2回、co2フラクショナルレーザーを受けました。過去にはダーマペン、フェイシャル、顔脱毛(5回)。\n今気になっているのはジュベルックと毛穴が詰まっている感じがあるのでハイドラフェイシャルです。\n脂性肌です。 \nお忙しいところ恐れ入りますが、よろしくお願いします‼️🙏\n※光の加減で1枚目と2枚目の肌の色味がちがいます💦", "permalink": "https://www.threads.com/@mochi_mochi_life_/post/DbFT9YjE0tK", "likes": 12, "velocity": 0.01, "ageHours": 1015.5, "postedAt": "2026-07-22T14:12:57+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["フェイシャルエステ"]}, {"id": "3971900154731254714", "username": "ruuta.chomo", "text": "ケア後なので肌てっかてかですが\n気になってるけど高くて買えない\n嘘だと思ってる方の参考になればと思って\n投稿させて頂きます✨️\n初めて使った日から効果有りなので\n毎日続けられてます。\nこれ使ってから\nリフトアップケア\nケア引き締め\n肌つるっつる\n実感出来る(*•̀ㅂ•́)و✧\n肌汚れは紹介されてる程黒くなかったです。\n\n個人差はありますが\n神アイテムだと思います▓", "permalink": "https://www.threads.com/@ruuta.chomo/post/DcfBiWOE1O6", "likes": 12, "velocity": 0.07, "ageHours": 179.3, "postedAt": "2026-08-26T10:23:37+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3944701265867014868", "username": "memu_321", "text": "美容に詳しい方に質問です🥲\n\n写真のような顎の吹き出物が、6週間くらいずっと治りません。\n悪化もせず、引きもせずという状態が続いています。\n\n・30代後半\n・敏感肌\n・アレルギー体質\n・20年以上ニキビに悩んできた\n・顎ニキビを繰り返しやすい\n\n半年前にアレルギー皮膚科に出会って肌が落ち着いたのですが、最近またこの吹き出物が出てきました。\n\n吹き出物ができてからは、2枚目のスキンケアだけにしていて、攻めのスキンケアはしていません。\nスキンケアが原因なのか、インナーケアなのか、ホルモンバランスなのか…原因が分からず悩んでいます。\n\n美容に詳しい方がいらっしゃいましたら、\n「これなら改善が期待できそう」というものがあれば教えていただきたいです🙇‍♀️\n\nレーザー治療、サプリ、スキンケア、インナーケアなど、ジャンルは問いません。\nできることは試してみたいと思っています。", "permalink": "https://www.threads.com/@memu_321/post/Da-ZObBCYLU", "likes": 12, "velocity": 0.01, "ageHours": 1080.0, "postedAt": "2026-07-19T21:44:17+09:00", "genres": ["毛穴・ニキビ"], "keywords": ["大人ニキビ"]}, {"id": "3970113285195158447", "username": "kirakira10x10", "text": "ホットペッパービューティーのクーポン使ってヘッドスパしに行こうと思ったらクーポンのジャンルがエステだった！！！ヘッドスパて大体リラクなんだよね、、、、はあ😭", "permalink": "https://www.threads.com/@kirakira10x10/post/DcYrP-SHdOv", "likes": 12, "velocity": 0.05, "ageHours": 238.5, "postedAt": "2026-08-23T23:13:25+09:00", "genres": ["エステ・リラクゼーション"], "keywords": ["ヘッドスパ"]}, {"id": "3878653271968366560", "username": "yuu_mens_beauty", "text": "【M字ハゲの男性に似合う髪型がこの5つ👇️】\n\n・アップバング（前髪上げスタイル）\n・ソフトモヒカン（トップに高さ）\n・ツーブロック＋ショート（メリハリ型）\n・ナチュラルパーマ（動きでぼかす）\n・ベリーショート（潔く短く）\n\nM字ハゲ・生え際後退タイプは、「隠す」よりも活かす・ぼかす・視線を分散させるのがポイント！\n\nソフトモヒカンやツーブロックのようにして、トップにボリュームを持たせるのもおすすめ。", "permalink": "https://www.threads.com/@yuu_mens_beauty/post/DXTvpnSlL_g", "likes": 11, "velocity": 0.0, "ageHours": 3267.1, "postedAt": "2026-04-19T18:38:42+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3935292630062401860", "username": "hair_nayami_koharu", "text": "ミノキシジルを使わずに薄毛が変わった体験を、正直に全部話したいと思っている。「薬を使わなければ変わらない」と思い込んでいた自分が変わったのが、", "permalink": "https://www.threads.com/@hair_nayami_koharu/post/Dac98wGFQlE", "likes": 11, "velocity": 0.01, "ageHours": 1391.5, "postedAt": "2026-07-06T22:11:02+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3963622786812045945", "username": "hitomi.takizawa13", "text": "目の下のたるみが毎日気になってはいるけど…整形しないで年相応にたるんで行こうと思う。ダメ？笑", "permalink": "https://www.threads.com/@hitomi.takizawa13/post/DcBneynk2p5", "likes": 11, "velocity": 0.02, "ageHours": 453.4, "postedAt": "2026-08-15T00:17:58+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["たるみ 改善"]}, {"id": "3952168643085400125", "username": "mas om/@50hayasu/post/DZ01RX0kudh", "likes": 9, "velocity": 0.01, "ageHours": 1765.6, "postedAt": "2026-06-21T08:05:33+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3974049657139754232", "username": "takahashishota.co.jp", "text": "そして、アワード表彰式。\n今回、エクセルグロー（三和紙工）賞で和多くの作品が商品化されることになり感動。\nみんなで考えた甲斐あったな！\nエクセルグローさま、素晴らしい企画とご支援を誠にありがとうございます！\nお披露目は松山、文具フェスタで！！\n個人的MVPはAGAと色部さんのツーショットでした笑", "permalink": "https://www.threads.com/@takahashishota.co.jp/post/DcmqRuVk_T4", "likes": 9, "velocity": 0.08, "ageHours": 108.1, "postedAt": "2026-08-29T09:34:17+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3965496045186761382", "username": "usagiwarabbit", "text": "夫の抜け毛が多くて心配…。\nストレス？加齢？ホルモンバランス？\nシャンプー変えたらいいのかな？💦", "permalink": "https://www.threads.com/@usagiwarabbit/post/DcIRaSbksKm", "likes": 9, "velocity": 0.02, "ageHours": 391.4, "postedAt": "2026-08-17T14:19:48+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["抜け毛 対策"]}, {"id": "3928313790945547905", "username": "atmdjhw", "text": "薄毛？ハゲ？の薬ってやはりリスクあるよね。\n夫に予防で使ったらと思ってたけど危ないよな。", "permalink": "https://www.threads.com/@atmdjhw/post/DaELJRrk9aB", "likes": 9, "velocity": 0.01, "ageHours": 1622.6, "postedAt": "2026-06-27T07:05:17+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3853413489067414787", "username": "ai.2jan", "text": "間も無く1歳半。これより薄毛族な方いらっしゃいますか？ \n中々髪の毛が生えてこないので、今日も男の子に間違えられた🤣  わたし おんなのこ です👶", "permalink": "https://www.threads.com/@ai.2jan/post/DV6Eybsj9UD", "likes": 9, "velocity": 0.0, "ageHours": 4102.8, "postedAt": "2026-03-15T22:51:46+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策", "つむじ 薄毛"]}, {"id": "3903849939520915242", "username": "shinosan_beauty", "text": "ぶっちゃけるね。40代女性、美容医療は全部やる必要ない。やるべきとやらなくていい、ハッキリ分けた。\nやらなくていい↓\n① 高額エステ → 医療じゃないから効果が限定的。同じ金額をクリニックに使う方が100倍結果が出る。\n② 糸リフト → 効果が1〜2年で切れる。コスパが悪すぎる。\nやるべきは、", "permalink": "https://www.threads.com/@shinosan_beauty/post/DYtQtYlkwcq", "likes": 9, "velocity": 0.0, "ageHours": 2432.7, "postedAt": "2026-05-24T12:59:59+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3960270872581321711", "username": "mika.yoshida.art", "text": "顔マッサージ、特にリンパマッサージしすぎると逆に顔って大きくなりますか？💦", "permalink": "https://www.threads.com/@mika.yoshida.art/post/Db1tWBOiTPv", "likes": 9, "velocity": 0.02, "ageHours": 564.4, "postedAt": "2026-08-10T09:18:18+09:00", "genres": ["むくみ・冷え"], "keywords": ["リンパ マッサージ"]}, {"id": "3964157219180756668", "username": "oyausuge", "text": "これまで100名以上の薄毛の方を診てきて、\n気づいたことのひとつが、\n\n薬で生やした髪と、\n自分の血流で生やした髪は、", "permalink": "https://www.threads.com/@oyausuge/post/DcDg_zjEb68", "likes": 8, "velocity": 0.02, "ageHours": 435.7, "postedAt": "2026-08-15T17:59:47+09:00", "genres": ["薄毛", "育毛・頭皮ケア"], "keywords": ["つむじ 薄毛", "発毛"]}, {"id": "3950394602281379588", "username": "lello_salon", "text": "【エステティシャン募集】\n⁡\n⁡\nアルバイトスタッフを1名募集いたします😌\n⁡\nカウンセリング、施術、スキンケアのアドバイスまで、肌質改善に専門特化した仕事内容になります✨\n⁡\n【勤務時間】\n11:30〜20:00まで（終わり次第早上がり可能）\n⁡\n【勤務日数】\n週2日以上で応相談\n⁡\n【応募条件】\n美容の知識や経験がある人（美容・化粧品業界での勤務経験がある、美容専門学校を卒業している、化粧品検定1級などの資格を持っている etc...）\n⁡\n面接希望者様は、\n⁡\n⚫︎氏名\n⚫︎生年月日\n⁡\nご記載の上、DMまでご連絡をお待ちしております✉️\n⁡\n⁡\n#肌質改善サロン #エステティシャン", "permalink": "https://www.threads.com/@lello_salon/post/DbSnvXvmicE", "likes": 8, "velocity": 0.01, "ageHours": 891.4, "postedAt": "2026-07-27T18:15:56+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["フェイシャルエステ"]}, {"id": "3895169013588789653", "username": "rui.fphl", "text": "FAGA治療を始めて1年が経過した。\n服用＋塗り薬。\n半年すぎたくらいで薬は飲んだり飲み忘れたり...ズボラに過ごしたけど間違いなく薄毛の変化はあった！今のところ服用による副作用はなさそう。\n久しぶりに髪の毛の様子を撮影した💇‍♀️\n\n左：開始1ヶ月　右：開始1年後", "permalink": "https://www.threads.com/@rui.fphl/post/DYOa5STEYmV", "likes": 8, "velocity": 0.0, "ageHours": 2720.2, "postedAt": "2026-05-12T13:32:32+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3864724754155137989", "username": "beautysalon__my", "text": "はじめまして☺️🤍\n\n豊川市でフェイシャルサロンをしています。\n\nご来店くださるお客様にとって\n「ほっとできる場所」でありながら\nしっかりお肌の変化も感じていただけるように\n心を込めて施術しています🌿\n\nこれから少しずつ発信していきます🫶🏻\nよろしくお願いします🌷", "permalink": "https://www.threads.com/@beautysalon__my/post/DWiQrAOE2vF", "likes": 8, "velocity": 0.0, "ageHours": 3728.3, "postedAt": "2026-03-31T13:25:13+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["フェイシャルエステ"]}, {"id": "3923559715796769072", "username": "sacai.norico", "text": "ほうれい線って、\n口の横からあごにまで伸びるから\n嫌なんだよね。\n\nでも、顔の筋肉意識したら\nこんなに変わったよ✨", "permalink": "https://www.threads.com/@sacai.norico/post/DZzSMYLGVkw", "likes": 8, "velocity": 0.0, "ageHours": 1780.0, "postedAt": "2026-06-20T17:39:47+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["ほうれい線", "小顔"]}, {"id": "3970026373267988448", "username": "chocolate513choco", "text": "成果でてるーーー🫪✨\n\nキメが細かくなってる😭\n冷蔵庫で冷やした日本酒コットンパックか？\nびっくらこいた😭🤣🥳\n消しゴムで消したかのよう\n嬉しいー\n\n久しぶりにキメの細かい肌を見た😂\n冷やしたのが良かったのか？\n日本酒が合ってるのか？\nアゼライン酸がいいのか？\n\nとにかく嬉しい🤤✨", "permalink": "https://www.threads.com/@chocolate513choco/post/DcYXfPPkh_g", "likes": 8, "velocity": 0.03, "ageHours": 241.4, "postedAt": "2026-08-23T20:20:45+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["毛穴 ケア"]}, {"id": "3962013470232976305", "username": "dot_tattoo_artist", "text": "何億回でも言うね…。\n本気で薄毛を防ぎたいなら、これやってください。", "permalink": "https://www.threads.com/@dot_tattoo_artist/post/Db75kJwjJux", "likes": 8, "velocity": 0.02, "ageHours": 506.7, "postedAt": "2026-08-12T19:00:32+09:00", "genres": ["薄毛", "育毛・頭皮ケア"], "keywords": ["薄毛 対策", "つむじ 薄毛", "発毛"]}, {"id": "3967216212664473134", "username": "babyomame_1217", "text": "8ヶ月　髪増えない伸びないねぇ☺️\n\n薄毛の大爆発\nお風呂上がりの保湿後\nぽわぽわ\n\n致死量の薄毛ベビーのぽわぽわください！", "permalink": "https://www.threads.com/@babyomame_1217/post/DcOYiBPCVYu", "likes": 8, "velocity": 0.02, "ageHours": 334.4, "postedAt": "2026-08-19T23:17:27+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3976570484552455349", "username": "etsu_bodymake_", "text": "46歳　たるみ改善したルーティン\n\n①耳の下(耳下腺)に人差し指の第一関節を\n押し当てて癒着を剥がすように\n20回ほぐす\n\n② 顎の骨の最後（耳の下）をつまんで\n揺らしながらほぐす\n\n②小鼻の横(頬骨の下)に指を押しあてて\n癒着を剥がすように20回ほぐす \n\n⚠️肌をこすらない事\n肌の奥の骨に当てていた気持ちいい程度にやってね\n\n隙間時間でできるセルフケアを発信してます😊\nフォローして他のケアもやって見てね😊", "permalink": "https://www.threads.com/@etsu_bodymake_/post/Dcvncl0DVS1", "likes": 8, "velocity": 0.32, "ageHours": 24.7, "postedAt": "2026-09-01T21:02:46+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["たるみ 改善"]}, {"id": "3971497556240930155", "username": "hydrology_rinorino", "text": "自律神経を整えるために意識してやっていること教えてください🙌🏻🌿", "permalink": "https://www.threads.com/@hydrology_rinorino/post/Dcdl_xKEpVr", "likes": 8, "velocity": 0.04, "ageHours": 192.6, "postedAt": "2026-08-25T21:03:43+09:00", "genres": ["エステ・リラクゼーション"], "keywords": ["自律神経 整える"]}, {"id": "3890230248268776824", "username": "yuu_mens_beauty", "text": "【薄毛対策ミスる人多すぎ🤚】\n\n■ハゲる人の習慣↓\n・気になり始めて育毛剤を使う\n・頭皮マッサージをする\n・まだ若いからと放置\n・タバコ吸ってる\n\n■ハゲない人の習慣がこれ↓", "permalink": "https://www.threads.com/@yuu_mens_beauty/post/DX838yqikV4", "likes": 7, "velocity": 0.0, "ageHours": 2883.7, "postedAt": "2026-05-05T18:00:05+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3900468080970567150", "username": "biyou_sake", "text": "3年ずっと頭皮マッサージを続けてるのに\n顔がたるむ40代の方から相談を受けた。\n\n相談者「毎日ヘッドスパみたいに頭皮を揉んでます」\n私「揉むのは続けていいです」\n\n相「シャンプー前に5分しっかりほぐしてます」\n私「でも、たぶん抜けてる工程が1つあります」\n\n相「え…頭皮ケアって揉めばいいんですよね…」\n私「半分は合ってるんです。ただ、\n順番というより、もう1つの方が、」", "permalink": "https://www.threads.com/@biyou_sake/post/DYhPw3YAA3u", "likes": 7, "velocity": 0.0, "ageHours": 2544.7, "postedAt": "2026-05-19T21:00:50+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮マッサージ"]}, {"id": "3952596579676819673", "username": "outidesekkotsuin", "text": "美容鍼されてる鍼灸師さん\n美容鍼はどこで学ばれましたか？\nパルスの電気は入れず\nリフトアップを立体動態波の中にある\n電気を使ってやっていこうと思ってます😌\n同業者様もし教えていただけるのであれば\n教えて頂きたいです🙇‍♀️", "permalink": "https://www.threads.com/@outidesekkotsuin/post/DbacaXAD5DZ", "likes": 7, "velocity": 0.01, "ageHours": 818.5, "postedAt": "2026-07-30T19:10:51+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3940647696519523783", "username": "dandism01", "text": "薄毛治療を始めたいけど、何の薬を飲めばいいのかわからなくて、結局また先延ばしにしてしまった。\n調べれば調べるほど混乱する。\n同じ経験した人いますか？", "permalink": "https://www.threads.com/@dandism01/post/Dav_jOYAe3H", "likes": 7, "velocity": 0.01, "ageHours": 1214.2, "postedAt": "2026-07-14T07:30:34+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策", "つむじ 薄毛"]}, {"id": "3954734055019321927", "username": "zabee_l.28", "text": "最近抜け毛エグい\nストレスでハゲてるのか😭！？", "permalink": "https://www.threads.com/@zabee_l.28/post/DbiCauCkRpH", "likes": 7, "velocity": 0.01, "ageHours": 747.7, "postedAt": "2026-08-02T17:57:38+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3958359554655956265", "username": "usuge_matome", "text": "頭皮って、強く洗わなくて大丈夫です。\n\nやりがちな洗い方と、頭皮にやさしい洗い方を4つ並べてみました。", "permalink": "https://www.threads.com/@usuge_matome/post/Dbu6wrsiq0p", "likes": 7, "velocity": 0.01, "ageHours": 627.7, "postedAt": "2026-08-07T18:00:52+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3951969546941419165", "username": "ca_youna", "text": "頭皮の臭い匂い撲滅！！！\n\nアラサーの皆様、頭皮こすってみたら臭ったり\n頭皮がかゆくなったりしていない？\n毎日髪をきつくしばるCAだからこそ、髪の毛、頭皮の治安が悪化して、実際に使って改善した頭皮ケアを皆様に共有します！地肌から整えると顔色までよくなるよ！", "permalink": "https://www.threads.com/@ca_youna/post/DbYN11Qms6d", "likes": 7, "velocity": 0.01, "ageHours": 839.3, "postedAt": "2026-07-29T22:25:03+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3958384025032021383", "username": "yururu.selfcare", "text": "40代後半から「髪が細くなった」「抜け毛が増えた」は更年期の典型的な変化。でも頭皮だけをケアしようとすると、根本を外す。エストロゲンが減ると頭皮への血流が変わって、毛母細胞に届く栄養が変わる。シャンプーや育毛剤を変えても変わらない人は、血流から見直すタイミングかもしれないんだけど、", "permalink": "https://www.threads.com/@yururu.selfcare/post/DbvAUxgnVWH", "likes": 7, "velocity": 0.01, "ageHours": 626.9, "postedAt": "2026-08-07T18:49:29+09:00", "genres": ["育毛・頭皮ケア", "薄毛"], "keywords": ["抜け毛 対策", "薄毛 対策"]}, {"id": "3957015352307198023", "username": "the.2nd_star", "text": "縮毛矯正ってどのくらい髪痛む？？\nカラー入りにくくなったり髪乾きずらくなったりするかな", "permalink": "https://www.threads.com/@the.2nd_star/post/DbqJH9tCahH", "likes": 7, "velocity": 0.01, "ageHours": 672.2, "postedAt": "2026-08-05T21:30:10+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3939597789609340210", "username": "cherrypick_8183", "text": "‼️話題の\n「リードルショット」からヘア用が出てて、即ゲットしちゃった😂✨\nブラシ付きだから手を汚さずに頭皮ケアできるのが、\n忙しい毎日には本当にありがたい🥹💆‍♀️\n抜け毛対策も今のうちから始めようと思う✨", "permalink": "https://www.threads.com/@cherrypick_8183/post/DasQ1EXlC0y", "likes": 7, "velocity": 0.01, "ageHours": 1249.0, "postedAt": "2026-07-12T20:44:35+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["抜け毛 対策"]}, {"id": "3949431610433236071", "username": "claw.cats.resort", "text": "茶トラ猫のちゃちゃちゃん🐈🧡\n\n今日は家族猫ちゃんの付き添い…\nのはずが、まさかのシャンプーデビュー🤭💕\n\n「えっ！？今日は付き添いって聞いてたよー！」\nそんな声が聞こえてきそうなくらい、お手入れは全力でイヤイヤ😂\n\nでも、いざシャンプーが始まると…\n「あれ？なんだか気持ちいいかも…❤️」\n\n終わる頃にはスッキリふわふわ✨\nとっても可愛いちゃちゃちゃんでした🥰\n\n頑張ってくれてありがとう😊\nまた遊びに来てね♪\n\n🐾 「うちの子、シャンプーできるかな？」\nそんな飼い主様も大丈夫✨\n猫ちゃんの性格に合わせて、できるだけ負担の少ないグルーミングを心がけています😊\n\n📩 ご予約・お問い合わせはDMまたは公式LINEからお気軽にどうぞ♪\n換毛期のお手入れ・皮脂汚れ・抜け毛対策のご予約も受付中です🐈🫧\n\n#猫シャンプー \n#茶トラ \n#猫専門サロン \n#猫トリミング \n#トリミング", "permalink": "https://www.threads.com/@claw.cats.resort/post/DbPMx_skmxn", "likes": 7, "velocity": 0.01, "ageHours": 923.3, "postedAt": "2026-07-26T10:22:40+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["抜け毛 対策"]}, {"id": "3964854656144932556", "username": "yohei1130", "text": "TXガソリン車5人乗り\nボディリフト4インチリフトアップ\nラフカン6インチリフトアップ\n計10インチリフトアップ\n37インチタイヤ\nサンルーフ有\nバックフォグ有\n\n実走行16000キロ\nワンオーナー\n車検令和9年４月\n\nいくらなら出しますか？", "permalink": "https://www.threads.com/@yohei1130/post/DcF_k2Vkn7M", "likes": 7, "velocity": 0.02, "ageHours": 412.6, "postedAt": "2026-08-16T17:05:28+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["リフトアップ"]}, {"id": "3851817834803983628", "username": "sinkyuins2", "text": "つむじ薄毛の方を\n5回鍼灸で治療✨\n\n劇的な発毛ではないですが\nつむじの地肌の面積は\n少し減りました🍀\n\n頭皮に直接鍼をして血流を良くし、\n手足のツボも使いながら\n自律神経を整えて\n\n髪が生えやすい環境を作っていきます🍀", "permalink": "https://www.threads.com/@sinkyuins2/post/DV0Z-m3AXUM", "likes": 7, "velocity": 0.0, "ageHours": 4155.7, "postedAt": "2026-03-13T18:01:29+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3962130401976340729", "username": "moz_onakasuita", "text": "子宮とった後から下腹ぽっこりが加速した気がする😢どうしたら引っ込むのかなぁ…", "permalink": "https://www.threads.com/@moz_onakasuita/post/Db8UJu7k1D5", "likes": 7, "velocity": 0.01, "ageHours": 502.8, "postedAt": "2026-08-12T22:52:52+09:00", "genres": ["ダイエット・痩身"], "keywords": ["下腹 ぽっこり"]}, {"id": "3910185582127688521", "username": "aikikue", "text": "むくみにいいトウモロコシの食べ方🌽\n\n🥉やめとけ\n・たっぷりの湯で茹でる\n→カリウムやビタミンB群が水に溶け出して大幅流出…むくみ解消パワーや体質改善効果が半減しやすい。\n\n🥈無難\n・レンチン\n→手軽だけど、熱に弱い栄養は一部減りやすく、加熱ムラも起きやすい。\n\n🥇本当におすすめは\n「フライパン蒸し」\n・少ないお水で蒸すから、カリウムが逃げにくい\n・トウモロコシの甘み・旨みがぎゅっと凝縮\n・むくみに効くカリウム・マグネシウム・食物繊維を効率よく丸ごと摂取\n・皮まで柔らかくなって食べやすく、むくみ解消効果が段違い \n\n【フライパン蒸しとうもろこしの作り方🌽】\n①トウモロコシは皮を1〜2枚残したままフライパンに並べ、200mlの水と小さじ2/3の塩を入れる。\n③ふたをして中火、沸騰したら上下を返し、5分ほど蒸す。\n\n・むくみやすい夏〜梅雨にいい旬野菜。\n・冷めても美味しいから作り置きにも◎ \n・ヒゲにもカリウムが多いので、無農薬ならおひたしにして食べてね。\nむくみを本気でケアしたいなら「たっぷり茹で卒業」でフライパン蒸しが一番オススメです。\n\n#むくみ #トウモロコシ", "permalink": "https://www.threads.com/@aikikue/post/DZDxRHkkytJ", "likes": 7, "velocity": 0.0, "ageHours": 2222.9, "postedAt": "2026-06-02T06:47:49+09:00", "genres": ["むくみ・冷え"], "keywords": ["むくみ 解消"]}, {"id": "3945947716446524830", "username": "o_dai_o_dai", "text": "断言するけど、薄毛で一番の犯人はシャンプーじゃない。前髪やつむじが気になる人ほど、真っ先に育毛剤と頭皮マッサージを始める。でも止まらない。じゃあ何が原因か。頭皮の表面ではなく、毛根で髪が細くなっていることが多い。", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbC0oqlDxWe", "likes": 6, "velocity": 0.01, "ageHours": 1038.7, "postedAt": "2026-07-21T15:00:45+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "つむじ 薄毛"]}, {"id": "3863169070821183460", "username": "8181.asobana", "text": "50代女性、\nトップの薄毛で悩んでます😭\n\n全体はまだ大丈夫なんですが、つむじ〜分け目あたりが気になってきて💦\n\nレディースウィッグ（特に部分用・ヘアピース）を探してるんですが、\nネットで調べても種類が多すぎて\nどれがいいのか分からず…\n\n「エクステシートタイプ（約28,000円）」が気になってたんですが在庫切れでした🥲\n\nできれば\n・お財布に優しめ\n・装着が簡単\n・今ある髪に負担が少ない\n・できれば手入れも楽\n\nこんな感じのウィッグやヘアピースで\n「これ良かったよ！」っていうのがあれば教えてほしいです🙏\n\n実際に使ってる方のリアルな感想も聞きたいです✨", "permalink": "https://www.threads.com/@8181.asobana/post/DWcu81Nko_k", "likes": 6, "velocity": 0.0, "ageHours": 3779.8, "postedAt": "2026-03-29T09:54:22+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛", "薄毛 対策"]}, {"id": "3958339096946684226", "username": "biyou_mochi", "text": "炎上覚悟で言います。「頭皮マッサージ」はマジでヤバい習慣です。高いリフトアップ美容液買い替えてきて、頭皮マッサージの恐ろしさにようやく気づいた。\n何が恐ろしいかというと、", "permalink": "https://www.threads.com/@biyou_mochi/post/Dbu2G--DDFC", "likes": 6, "velocity": 0.01, "ageHours": 628.4, "postedAt": "2026-08-07T17:20:13+09:00", "genres": ["フェイシャル・小顔", "育毛・頭皮ケア"], "keywords": ["リフトアップ", "頭皮マッサージ"]}, {"id": "3885258187575591083", "username": "kounenki___chan", "text": "信じられないけど、ワイは「ウカ スカルプブラシ」より「満天社 ハンドプロ」を毎日欠かさない。トレンドの、頭皮臭対策にはもちろんウカなんだけど、", "permalink": "https://www.threads.com/@kounenki___chan/post/DXrNbyTHwCr", "likes": 6, "velocity": 0.0, "ageHours": 3048.3, "postedAt": "2026-04-28T21:21:30+09:00", "genres": ["育毛・頭皮ケア"], "keywords": ["頭皮ケア"]}, {"id": "3907337910302656782", "username": "mika_no_tsubuyaki", "text": "東京都中央区銀座で\nフェイシャルエステのセラピストしてます！", "permalink": "https://www.threads.com/@mika_no_tsubuyaki/post/DY5pyChAckO", "likes": 6, "velocity": 0.0, "ageHours": 2317.2, "postedAt": "2026-05-29T08:29:58+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["フェイシャルエステ"]}, {"id": "3945513420242020080", "username": "wasakaragram", "text": "高周波種類ありすぎどれがいいのか🥺\nソフウェーブが非常に気になるが痛そうだし高いな〜\nザーフも気になるけど通ってるクリニックにはまだ導入されてないので、まずはボルニューマを予約してみた！\nたるみ改善したい〜🥺", "permalink": "https://www.threads.com/@wasakaragram/post/DbBR40uD-bw", "likes": 6, "velocity": 0.01, "ageHours": 1053.1, "postedAt": "2026-07-21T00:37:53+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["たるみ 改善"]}, {"id": "3911105535332688298", "username": "sana_oniku", "text": "ずっと品切れだった毛穴洗浄をようやくゲット。使ってみたら、鼻の黒ずみがすっきりして洗い上がりに感動した…✨\nこれ使ったことある人いますか？皆さんの毛穴ケアのおすすめも知りたいです！", "permalink": "https://www.threads.com/@sana_oniku/post/DZHCcMwkaGq", "likes": 6, "velocity": 0.0, "ageHours": 2192.4, "postedAt": "2026-06-03T13:15:39+09:00", "genres": ["フェイシャル・小顔"], "keywords": ["毛穴 ケア"]}, {"id": "3903433002685469048", "username": "fusafusa_gingin", "text": "ゾッとした。AGAを5年治療していた先輩が「副作用が怖くなってフィナステリドをやめた」と言っていた。その後どうなったか聞いてみたら、", "permalink": "https://www.threads.com/@fusafusa_gingin/post/DYrx6J5mpF4", "likes": 6, "velocity": 0.0, "ageHours": 2446.5, "postedAt": "2026-05-23T23:11:36+09:00", "genres": ["薄毛"], "keywords": ["AGA"]},
