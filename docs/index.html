": ["育毛剤"]}, {"id": "3917771413847691846", "username": "taku87116", "text": "育毛・発毛・頭皮ケア・スカルプケア得意な方\nいらっしゃいますか？\n\nコミュニティに薄毛や抜け毛、頭皮ケア\nに悩んでいる方がいらっしゃるので💦\n集客のお役に立てるかもです🤝", "permalink": "https://www.threads.com/@taku87116/post/DZeuFf5klJG", "likes": 30, "velocity": 0.02, "ageHours": 1910.3, "postedAt": "2026-06-12T17:59:28+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3949605823726561373", "username": "sally__525", "text": "美容鍼のビフォーアフター流れてきて、めちゃリフトアップされてたけど、美容鍼って1週間もしないうちに元通りよね？\nずっと続けてると上がったままの状態維持できる？\n私も月イチくらいで通ってた時もあったけど、鍼の効果VS老化は勝負にならなかったよ😅", "permalink": "https://www.threads.com/@sally__525/post/DbP0ZIeCShd", "likes": 30, "velocity": 0.04, "ageHours": 856.2, "postedAt": "2026-07-26T16:08:45+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3908375957727676313", "username": "m34673tdm", "text": "なんとか10月までに頬コケとリフトアップしたくて、いろんな施術やらクリニック調べてるけど、自分に合う施術をするにはやっぱり実際にカウンセリング行くしかないのかなぁ💭\n美容クリニックありすぎて結局どこがいいかわからない😭\n大阪でおすすめのクリニックないですか💧\nフェイスラインでコケすぎた経験があるから怖い…", "permalink": "https://www.threads.com/@m34673tdm/post/DY9VznhCQeZ", "likes": 30, "velocity": 0.01, "ageHours": 2221.4, "postedAt": "2026-05-30T18:52:22+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3918611015059847669", "username": "shoko_akanuke", "text": "小顔の人にお聞きしたい。\n\n何したらそんなに顔小さくなりますか？", "permalink": "https://www.threads.com/@shoko_akanuke/post/DZhs_Tdkzn1", "likes": 30, "velocity": 0.02, "ageHours": 1882.5, "postedAt": "2026-06-13T21:47:36+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3953981889265654651", "username": "hiromi_biyoukoushi", "text": "みなさん教えてください…！\n\n額のシワが気になっています！！\nボトックスはする予定なのですが、目が重くならないよう上の方に打つので、眉上くらいのシワにはあまり効果ないんです…😭\n\n額のシワに効果的だった美容施術があったらおしえてください！\n\nちなみに品川の美肌注射はあまり効果なかった…(私には)", "permalink": "https://www.threads.com/@hiromi_biyoukoushi/post/DbfXZRGAdt7", "likes": 30, "velocity": 0.04, "ageHours": 711.3, "postedAt": "2026-08-01T17:03:13+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3971527451494436386", "username": "agtmagtm2684", "text": "39歳　最近抜け毛が凄くて悩んでいます。\nセミロングですが、1回の洗髪で、排水溝が詰まるくらい抜けていると思います。\n鏡で見た感じでは、薄毛なのかは自分では分かりません。\n前より分け目が目立っていたり、頭皮が透けて見える気もします。\n\nこういう場合、皮膚科に行けば良いのでしょうか？\n\nまた、抜け毛予防に良いことがあれば教えてください！！", "permalink": "https://www.threads.com/@agtmagtm2684/post/DcdsyzSCc4i", "likes": 29, "velocity": 0.22, "ageHours": 130.3, "postedAt": "2026-08-25T22:03:07+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3925401531663416738", "username": "o_dai_o_dai", "text": "炎上覚悟で言います。亜鉛はマジでヤバい習慣です。薄毛治療10年以上向き合ってきて、亜鉛の重要性に気づいた。何がヤバいかというと、", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DZ50-U3kn2i", "likes": 28, "velocity": 0.02, "ageHours": 1657.7, "postedAt": "2026-06-23T06:39:09+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "薄毛 対策", "生え際 後退"]}, {"id": "3937525056789324352", "username": "warewarewa_r", "text": "旦那が髪の毛薄くなってきたの気にしてて\nAGA飲み薬試してみる？？って話になってるけど\n副採用と実際の効果が気になるみたいで。\n\nやってる人いたら感想教えてくださいーーーーー\nちなみにまだ30代前半です\n\nがっつりハゲとかじゃなくて\nM字にデコ広がってきて普段は目立たないです\n前髪あげるとまぁまぁキツイです😅", "permalink": "https://www.threads.com/@warewarewa_r/post/Dak5i1gIKJA", "likes": 28, "velocity": 0.02, "ageHours": 1256.2, "postedAt": "2026-07-10T00:06:26+09:00", "genres": ["薄毛", "育毛"], "keywords": ["つむじ 薄い", "AGA", "発毛"]}, {"id": "3969148609929365994", "username": "nerui0029", "text": "美容医療に詳しい方🙏🥹\nわたしはこの方に似た輪郭なのですが、\n面長をマシにして小顔に近づくにはどのような施術がお勧めですか？（骨切り以外）\n・薄肌\n・顔の脂肪少なめです。\n\n【気になるところ】\n・下顔面の長さ、面長（普段は前髪あり）\n・口横のもたつき、マリオネットライン\n・頬こけ\n\nまだ糸リフトまでは考えていなくて、「オリジオX」あたりはどうかな？と気になっています💭\nおすすめの施術やクリニックがあればぜひ教えてください！🙇‍♀️✨\n※画像は本人ではなくAIのイメージ画像なので、髪型などは面長に見えないスタイルにしています。", "permalink": "https://www.threads.com/@nerui0029/post/DcVP6Gbk0nq", "likes": 28, "velocity": 0.13, "ageHours": 209.0, "postedAt": "2026-08-22T15:16:47+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3936540250642397119", "username": "emochan_358", "text": "30歳女です。\n髪の毛がストレスとかでごっそり抜けちゃってから1年経つんですが、頭頂部分が中々生えなくてずっと悩んでます。\n亜鉛のサプリは摂ってます。ジムも週1で通って、毎朝プロテイン、鶏胸肉もかなり食べてます。\nその他、何かいい手立て、アイテム、薬はないでしょうか。出来ることは全てやりたいです。", "permalink": "https://www.threads.com/@emochan_358/post/DahZoBTkTe_", "likes": 27, "velocity": 0.02, "ageHours": 1288.8, "postedAt": "2026-07-08T15:29:48+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3943124510736281979", "username": "uvuooouvu", "text": "私、びまん性脱毛症だ。\n\nつむじの分け目が、目立つようになった。\n髪の毛のボリュームが減った。\n\n悲しい〜〜。", "permalink": "https://www.threads.com/@uvuooouvu/post/Da4ytnXknF7", "likes": 26, "velocity": 0.02, "ageHours": 1070.8, "postedAt": "2026-07-17T17:31:33+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛", "髪 ボリューム"]}, {"id": "3902368431622663518", "username": "kamonohasi.aga", "text": "知らなかった。\n「亜鉛は抜け毛に効く」と聞いて\nサプリを飲み続けた結果、\nむしろ抜け毛が増えた。\n皮膚科で正直に話したら\n「それ、男性にすごく多いですよ」と即答された。\n亜鉛は確かに髪に必要なミネラル。\nでも”頑張って補おう”とした瞬間、\n体の中でまったく逆のことが起きる。\nその理由が、", "permalink": "https://www.threads.com/@kamonohasi.aga/post/DYn_2m1kS1e", "likes": 25, "velocity": 0.01, "ageHours": 2420.4, "postedAt": "2026-05-22T11:56:30+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3959248830806875973", "username": "sakura2029pink", "text": "がーーーーーーん\nそんな気してたけど、やっぱりめっちゃ薄くなってる。。。\n\n一昨年くらいから尋常じゃないくらい抜け始めてハゲるんじゃないかと思ってて。\n昨夜、コンタクトもメガネもしてない状態で鏡に光るものが見えた。\n\nえ。。まさか。。。\n眼鏡かけたら。。。\n私の頭皮ーっ😭！\n分け目が。。😭😭\nそしてどこを分けても、分け目の主張がすごい。。。\n\n34くらいから年齢を感じるようになったけど、\n薄毛はもっと後だと思ってたよ😭！？\n37でこんな薄くなるの。。嘘でしょ。。。嘘と言って。。。。。\n毎日が忙し過ぎて抜けてるんか😇？\n年取ったらロングはできなくなるって聞くから、ラストスパートと思ってロングを楽しんでたけど、本当にあと少しかもだなんて信じたくない。。。\n薄毛対策しなきゃダメかな。。😞", "permalink": "https://www.threads.com/@sakura2029pink/post/DbyE9Wpn99F", "likes": 25, "velocity": 0.05, "ageHours": 536.8, "postedAt": "2026-08-08T23:27:42+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3864597131835960115", "username": "yamaguchi_nana__", "text": "リフトアップ手術について他の方にコメントしたところ、反応があったので38歳から６回以上のリフトアップ手術、糸、レーザー、ボト、ヒアルなど様々な美容医療をした私に質問があれば、お答えします🖐️\nちなみに、７回目は来月くらいにします☺️", "permalink": "https://www.threads.com/@yamaguchi_nana__/post/DWhzp2rE2sz", "likes": 25, "velocity": 0.01, "ageHours": 3671.1, "postedAt": "2026-03-31T09:11:40+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3927611893364254628", "username": "c.8592670", "text": "フェイシャルエステに行くとしたら　どのくらいのペースで行くんだろう\nマツエクとかみたいに　見た目が極端に変わらないから　毎月は行かないのかな", "permalink": "https://www.threads.com/@c.8592670/post/DaBrjUnk2ek", "likes": 25, "velocity": 0.02, "ageHours": 1584.5, "postedAt": "2026-06-26T07:50:45+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3973632909551186668", "username": "mika.n4574", "text": "筋トレ始めた頃から薄毛が\n始まったんだけど\n同じひといますか🥲？\nタンパク質不足なのかな😭\n女です😭", "permalink": "https://www.threads.com/@mika.n4574/post/DclLhP5mbLs", "likes": 25, "velocity": 0.41, "ageHours": 60.5, "postedAt": "2026-08-28T19:46:17+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3926194054697678879", "username": "yui_ensoleille", "text": "1〜2ヶ月前くらいからかな？\nめっちゃ毛が抜ける。\nシャンプーとドライヤーの後、引くくらい抜ける。\n髪の毛のボリュームがすごい減ってきて落ち込む。\nとりあえず皮膚科受診したらいいんですかね？\n髪は女の命というけれど、本当にごっそり抜けると気持ちが滅入る…", "permalink": "https://www.threads.com/@yui_ensoleille/post/DZ8pLDdgXgf", "likes": 24, "velocity": 0.01, "ageHours": 1631.4, "postedAt": "2026-06-24T08:53:45+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策", "発毛"]}, {"id": "3862078009944202044", "username": "beautyblog3010", "text": "無印の頭皮スプレー、ほんとに良いです👍\n長期使用してみて、頭皮の臭いがなくなった感じがします。\n\nピンク：育毛エッセンス（髪の根元を強化して、髪を長く育てる）\nグレー：乾燥した敏感な頭皮の調整、フケの改善。", "permalink": "https://www.threads.com/@beautyblog3010/post/DWY23zlkls8", "likes": 24, "velocity": 0.01, "ageHours": 3754.5, "postedAt": "2026-03-27T21:46:37+09:00", "genres": ["育毛"], "keywords": ["育毛剤", "頭皮ケア"]}, {"id": "3854022483351542729", "username": "sirosiba.kohaku", "text": "犬を飼ってる方、部屋や服の抜け毛対策どうしてますか！ベッドで一緒に寝てる方はパジャマは毛だらけ覚悟ということですか？\n洗濯の時は部屋着の毛だらけと外出する時の服と分てしてるんですか", "permalink": "https://www.threads.com/@sirosiba.kohaku/post/DV8PQd0iZvJ", "likes": 24, "velocity": 0.01, "ageHours": 4021.3, "postedAt": "2026-03-16T19:01:43+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3969112260052455462", "username": "ynm1432", "text": "髪サラサラにするには\n縮毛矯正がいいのか\n髪質改善トリートメントか\nはたまたそれ以外かー\nなにしたらいいのー\nとぅるとぅるになりたい", "permalink": "https://www.threads.com/@ynm1432/post/DcVHpI-ExAm", "likes": 24, "velocity": 0.11, "ageHours": 210.2, "postedAt": "2026-08-22T14:04:34+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3953023054477507212", "username": "forcehair_kanayama", "text": "髪質改善ストレートってなんですか？", "permalink": "https://www.threads.com/@forcehair_kanayama/post/Dbb9YYnD7qM", "likes": 23, "velocity": 0.03, "ageHours": 743.0, "postedAt": "2026-07-31T09:18:11+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム", "つむじ 薄毛"]}, {"id": "3913590855387305615", "username": "___18grm", "text": "某フェイシャルエステサロンでの出来事。\n約1年前、子ども向けの商業施設に子どもを連れて遊びに行った時に、「ハンドマッサージ無料でやります」と某サロンが来ていて、やってもらいました。\nその後フェイシャルエステのお試し体験に誘われ、育児で疲れていたのもあり受けることにし、うまいこと誘導されてマッサージクリームを購入しその後も定期的にフェイシャルエステに通っています。\nエステ後は効果を実感し、自分の肌の綺麗さに驚くのですが、某サロンの商品のライン使いを勧められますが金銭的な問題でやんわり断っていました。\nですが今日、エステに行くと店長も同席で「1年通っているけど肌の状態が向上しないのは自宅でのケアが自己流だからだ。どういう思いでこれまで通ってきた？自社の製品のライン使いについてどう思ってる？」という主旨のことを言われ、「金銭的なこともありライン使いには手を出せないのが現状です」ということを伝えました（過去にも同じことを伝えてます）\nすると１つグレードを下げたシリーズの提案をされ、「この金額ならどうだろう？手出せそうかな？」と…。", "permalink": "https://www.threads.com/@___18grm/post/DZP3iXbk9aP", "likes": 23, "velocity": 0.01, "ageHours": 2048.8, "postedAt": "2026-06-06T23:33:27+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3974047356673407607", "username": "ch1_r0nne", "text": "どうしよう、、、嬉しいより先にひよってる😂あのお肌つるつるお目目ぱっちりお鼻たっか唇ぷりっぷり小顔顔整いを目の前にする訳！？人生狂うど、、、", "permalink": "https://www.threads.com/@ch1_r0nne/post/DcmpwP3GTp3", "likes": 23, "velocity": 0.49, "ageHours": 46.8, "postedAt": "2026-08-29T09:29:43+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3917151782078485948", "username": "kumi_biyo_official", "text": "40代イチゴ鼻がガチで治らん人に断言するで🔥原因知らんとケアしてる。毛穴の中の皮脂を溶かして排出するために、サリチル酸洗顔を夜だけやって！だから、、、", "permalink": "https://www.threads.com/@kumi_biyo_official/post/DZchMq2E5W8", "likes": 22, "velocity": 0.01, "ageHours": 1930.8, "postedAt": "2026-06-11T21:28:22+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3966694252285519634", "username": "o_dai_o_dai", "text": "お願いですから、メモってください。\n\n・フィナステリドは「AGAの進行を抑える“守り”。発毛剤とは役割が違う」\n・デュタステリドは「フィナステリドとは作用範囲が違う。自己判断で乗り換えるな」\n・外用ミノキシジルは「発毛を促す“攻め”。多く塗っても早く生えるわけじゃない」\n・高濃度ミノキシジルは「", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DcMh2fwD-cS", "likes": 22, "velocity": 0.08, "ageHours": 290.3, "postedAt": "2026-08-19T06:00:25+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3962641985229039978", "username": "partage_877kobe_facial", "text": "質問ーーーー！！！\n\nフェイシャルエステに行こって思うタイミングってなんですか？🤔", "permalink": "https://www.threads.com/@partage_877kobe_facial/post/Db-IeP9oClq", "likes": 22, "velocity": 0.05, "ageHours": 424.5, "postedAt": "2026-08-13T15:49:17+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3926986628183055036", "username": "sakadatimama", "text": "美容おばけの千賀くんも、小田切ヒロさんも2人で鬼推ししてる！セラムなんだけど、ニキビ跡もシミもやばい目立たなくなるの控えめに言って神がかってる。", "permalink": "https://www.threads.com/@sakadatimama/post/DZ_dYhCj1q8", "likes": 22, "velocity": 0.01, "ageHours": 1605.2, "postedAt": "2026-06-25T11:08:27+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3905311393914779936", "username": "umi.___.life", "text": "40代だけど白髪ほぼなし\n頭皮も美容師さんに褒められる\n\n20代から地味にずっと続けてるのが\nシャンプーのときの頭皮マッサージ\n\n地味だけど続けるって大事かも！", "permalink": "https://www.threads.com/@umi.___.life/post/DYydAWDk3kg", "likes": 22, "velocity": 0.01, "ageHours": 2322.9, "postedAt": "2026-05-26T13:23:38+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3904118491964472164", "username": "lilly_tsuyahada", "text": "姉のほうれい線が【２日】で。すご。", "permalink": "https://www.threads.com/@lilly_tsuyahada/post/DYuNxVik3tk", "likes": 22, "velocity": 0.01, "ageHours": 2362.4, "postedAt": "2026-05-24T21:53:33+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3971383449697977823", "username": "komemecchasuki", "text": "9月から肌管始めようとしている\n30代半ばです\n迷走しすぎて何からやろうか決まらないです\nホクロ取りは冬くらいにやろうかなと思っています\nその他はほうれい線毛穴皮膚のタルミなどが気になっていて今のところやりたいなと思う施術が\nジャルプロ/モフィウス/リジュラン\nルメッカ/プルリアル/ウルセラ\nです\nどこをどうしたらいいか…\n図々しくて本当にすみません有識者の方アドバイス頂けますと幸いです", "permalink": "https://www.threads.com/@komemecchasuki/post/DcdMDTKHQXf", "likes": 22, "velocity": 0.16, "ageHours": 135.0, "postedAt": "2026-08-25T17:17:01+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3969868044885397396", "username": "ikuta2323", "text": "左が5月に撮影したつむじ。 そして2枚目が8月7日。\nそして3枚目が8月16日に撮影したつむじ。\n\nちょっとつむじ周辺の髪の毛の立ち上がりが気になる。\nデュタスタステリドの初期脱毛はなかなか手強かった。\n2枚目とかかなり焦った1枚ですね😂", "permalink": "https://www.threads.com/@ikuta2323/post/DcXzfQckY-U", "likes": 21, "velocity": 0.11, "ageHours": 185.2, "postedAt": "2026-08-23T15:06:10+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3958047541321494858", "username": "ketsuryu.chan2", "text": "急に抜け毛が増えた人には、ある共通点がある。体の中で、糖化が進んでいるケースがとても多い。糖化とは、", "permalink": "https://www.threads.com/@ketsuryu.chan2/post/Dbtz0Sok3FK", "likes": 21, "velocity": 0.04, "ageHours": 576.6, "postedAt": "2026-08-07T07:40:57+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3945118889738994278", "username": "eclart.ceo", "text": "ハゲそう👨‍🦲", "permalink": "https://www.threads.com/@eclart.ceo/post/Da_4Lpjk4Jm", "likes": 21, "velocity": 0.02, "ageHours": 1004.7, "postedAt": "2026-07-20T11:34:01+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3913332851081290446", "username": "yumi__i_am", "text": "重盛さとみときほちゃんが紹介してた美顔器、即効性ありすぎてすごい‼️\nお肌ケアというよりも、リフトアップ効果重視💆‍♀️\nアラフォーの私には今すぐに必要...と思ってすぐポチった🤭🤭この2人憧れだから私も頑張ろう〜", "permalink": "https://www.threads.com/@yumi__i_am/post/DZO836MkSLO", "likes": 21, "velocity": 0.01, "ageHours": 2057.3, "postedAt": "2026-06-06T15:01:15+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3954969084555879590", "username": "gappy.5", "text": "顔痩せに一番効果的なのはなんでしょうか？？\n当方30代女性です。\n\n痩せたい.....横顔がとくに...二重顎と顔の余白が多いです。\n\n脂肪吸引や、脂肪溶解注射、ボトックス、糸リフト、ハイフ、オンダリフト？\nなにがいいのーーーーー\n\n有識者さまお助けください😭😭", "permalink": "https://www.threads.com/@gappy.5/post/Dbi322WmuSm", "likes": 21, "velocity": 0.03, "ageHours": 678.6, "postedAt": "2026-08-03T01:44:36+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3896912088157205689", "username": "chan_mumemo", "text": "#脱毛症 \n\n脱毛症と診断されて、運が良ければ3ヶ月くらいで生え始めると言われたけれど、運が悪かったみたい。\n\n抜けていく一方。\n\n脱毛症のかたや有識者のかたとお話したいです🥲\n\nこの程度の脱毛で落ち込むのはヤワなのかな？", "permalink": "https://www.threads.com/@chan_mumemo/post/DYUnOW_iTS5", "likes": 21, "velocity": 0.01, "ageHours": 2601.0, "postedAt": "2026-05-14T23:15:43+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3874391194701345206", "username": "horumi_yuragibiyou", "text": "正直に言います。亜鉛サプリを3ヶ月飲んで、何も変わらなかった。はい、過去の私です。前髪の白髪が気になりはじめて、「亜鉛不足が原因」という情報を見てすぐサプリを買いました。3ヶ月、毎日飲み続けました。、、、変わりませんでした😢諦めかけていた頃、婦人科医の夫に話したら、一言だけ言われたことがあって、", "permalink": "https://www.threads.com/@horumi_yuragibiyou/post/DXEmkOhEzG2", "likes": 20, "velocity": 0.01, "ageHours": 3346.8, "postedAt": "2026-04-13T21:30:43+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3967962167130529882", "username": "masao_miyoshi", "text": "カットしたばかりだが、やっぱり薄毛か？😱\n最近抜け毛が目立つような気がするし😇\nAGA治療でも始めてみようかな？😅", "permalink": "https://www.threads.com/@masao_miyoshi/post/DcRCJFeASBa", "likes": 19, "velocity": 0.08, "ageHours": 248.3, "postedAt": "2026-08-20T23:59:33+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3951503992139379535", "username": "motemen_fusafusa", "text": "炎上覚悟で言います。『頭皮マッサージ』はマジでヤバい習慣だよ😳\nふさふさのまま年齢を重ねてる人と、20代で生え際が後退していく人。その差を何度も聞いてきて、頭皮マッサージの恐ろしさに気づいたの。\n何が恐ろしいかっていうと、誰でもできるのに効果がありすぎること。", "permalink": "https://www.threads.com/@motemen_fusafusa/post/DbWj_HkAXNP", "likes": 19, "velocity": 0.02, "ageHours": 793.3, "postedAt": "2026-07-29T07:00:05+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3877278326930355717", "username": "m_midori_molecular", "text": "急増する若い女性の薄毛。\n最近、10代や20代といった若い女性の間で「抜け毛」や「分け目の薄さ」に悩む人が急増している。実はその背景には、現代のライフスタイルが引き起こす深刻な栄養エラーと体からのSOSが隠されている。\n\n若くして髪の薄毛を気にする女性たちは、主に以下の3つの「エラー」が起きていることが多い。", "permalink": "https://www.threads.com/@m_midori_molecular/post/DXO3Bh8ATYF", "likes": 19, "velocity": 0.01, "ageHours": 3251.2, "postedAt": "2026-04-17T21:06:56+09:00", "genres": ["育毛", "薄毛"], "keywords": ["抜け毛 対策", "薄毛 対策", "つむじ 薄毛"]}, {"id": "3946719935133301151", "username": "mami_nslove", "text": "【世間が思うたるみ改善】\n・ハイフ\n・糸リフト\n・小顔矯正\n・美顔器\n・マッサージ\n\n【本当のたるみ改善】￼", "permalink": "https://www.threads.com/@mami_nslove/post/DbFkN7Rkrmf", "likes": 19, "velocity": 0.02, "ageHours": 951.7, "postedAt": "2026-07-22T16:35:01+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3935709778635008601", "username": "___lipps_", "text": "フェイスラインのたるみ改善なにがいいんだろ。\nマッサージとか自力でやるのは絶対続かないから\nお金かかっても美容医療に頼りたい…", "permalink": "https://www.threads.com/@___lipps_/post/DaeczD-kipZ", "likes": 19, "velocity": 0.01, "ageHours": 1316.3, "postedAt": "2026-07-07T11:59:48+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3968729454902176678", "username": "sakuramochitabetai30", "text": "この前初めてフェイシャルエステに行ってきたんだけど、こんな顔こすられていいのかなって感想で今後も継続するか悩む。みんなどんなお手入れしてるの？高周波とかピーリングとかも気になる", "permalink": "https://www.threads.com/@sakuramochitabetai30/post/DcTwml5Euum", "likes": 18, "velocity": 0.08, "ageHours": 222.9, "postedAt": "2026-08-22T01:24:00+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3952405508224806858", "username": "nako_healthybeauty", "text": "美容皮膚科の先生に教えてもらった….\nこういう毛穴の開きには医療の前にまずこれ試してって言われた2つがまっっっっじで効果あった。レチノールを夜→朝はナイアシンアミドで毛穴を引き締める。美容医療行く前に、絶対一回試してみて。", "permalink": "https://www.threads.com/@nako_healthybeauty/post/DbZw952CW_K", "likes": 18, "velocity": 0.02, "ageHours": 763.5, "postedAt": "2026-07-30T12:51:14+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3930137856878710133", "username": "mayukaphyto", "text": "自己免疫疾患で、髪の毛が9割抜けた過去があります。でも今は完全に自毛が生え戻り、寛解してから15年間、一度も症状が出ていません。治すためにお金も時間も膨大に費やしたけど、本質的にやったことは1つだけ。", "permalink": "https://www.threads.com/@mayukaphyto/post/DaKp47dkg11", "likes": 17, "velocity": 0.01, "ageHours": 1500.8, "postedAt": "2026-06-29T19:29:23+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3937780355793379848", "username": "tonton_3389", "text": "誰か教えて欲しい。\n40代になって、髪がゴワゴワ！\n縮毛もなんか限界を迎えて、ボリュームは落ちるもののゴワゴワ感がすごい😭\nヘアケアで何とかなる？", "permalink": "https://www.threads.com/@tonton_3389/post/Dalzl7Ok2II", "likes": 17, "velocity": 0.01, "ageHours": 1247.7, "postedAt": "2026-07-10T08:33:40+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3957528106475029968", "username": "nemui0o_", "text": "肌治療何したらいいでしょうか、、、\n黒い毛穴？毛？がフェイシャルワックスしても消えないです😭", "permalink": "https://www.threads.com/@nemui0o_/post/Dbr9thPEYXQ", "likes": 17, "velocity": 0.03, "ageHours": 593.8, "postedAt": "2026-08-06T14:28:55+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3858928374362907176", "username": "40skin_change", "text": "今までで、受けて一番良かった（効果があった）エステの施術ってなんですか？", "permalink": "https://www.threads.com/@40skin_change/post/DWNquk3k6Io", "likes": 17, "velocity": 0.0, "ageHours": 3858.8, "postedAt": "2026-03-23T13:28:51+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3937064498016420231", "username": "fusafusa_gingin", "text": "ハゲへ。AGAクリニックの医師が患者には絶対に言わない真実がある。それが、", "permalink": "https://www.threads.com/@fusafusa_gingin/post/DajQ00uEgGH", "likes": 16, "velocity": 0.01, "ageHours": 1271.5, "postedAt": "2026-07-09T08:51:23+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3856603886757479504", "username": "tsudobarai.keana", "text": "フェイシャルエステは美容師免許必要ってほんと？", "permalink": "https://www.threads.com/@tsudobarai.keana/post/DWFaM1FkgRQ", "likes": 16, "velocity": 0.0, "ageHours": 3935.8, "postedAt": "2026-03-20T08:30:31+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3911758093780724610", "username": "ru_ru_.26", "text": "ローソン限定品\n\n♡無印良品の頭皮のマッサージもできるブナ材\nヘアコーム\n\n1個持ってるけど…数日前にローソンを駆けずりまわって見つけて2個目、買いました。\nなぜかというと1個は確実に自宅用。\nもう1個は車に置いておく専用として。\n\nこのコーム今さらだけど、是非お手元にある人には試してほしいです…\n\n頭皮以外にも耳つぼが、すっご〜い、すっご〜い気持ちよくて…車の運転中の信号待ちなどでやると、ある意味ヤバい顔に…（個人差はあります)\nやり方はコームの1番外側の部分で耳つぼかな？って思う部分に気持ちいい強さで10秒前後押すだけ。\n力を入れすぎず気持ちいい強さで押すのがポイントです。\n\nお風呂でやるのも気持ちいいです♪\n\n↓黒丸の部分で…", "permalink": "https://www.threads.com/@ru_ru_.26/post/DZJW0LLDyuC", "likes": 16, "velocity": 0.01, "ageHours": 2109.4, "postedAt": "2026-06-04T10:52:04+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3959757111446056861", "username": "pinkyribbon60", "text": "脱毛のピークがようやく落ち着きました😅\n一時期は本当に抜け毛がすごくて掃除がエンドレスだったから、ちょっと楽になってホッとしてます。\nそこで先輩方に質問なのですが、脱毛後の頭皮って何で洗うのが正解ですか？🤔\n今はとにかく乾燥対策が気になってて…おすすめのシャンプーや保湿ローション、ケア方法があればぜひ教えてほしいです！🙇‍♀️", "permalink": "https://www.threads.com/@pinkyribbon60/post/Dbz4hz4ka-d", "likes": 16, "velocity": 0.03, "ageHours": 520.0, "postedAt": "2026-08-09T16:17:33+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3959932933775107560", "username": "mis0shiruumai", "text": "結局角栓毛穴に良いクレンジングってどれなん？", "permalink": "https://www.threads.com/@mis0shiruumai/post/Db0ggXMCSXo", "likes": 16, "velocity": 0.03, "ageHours": 514.2, "postedAt": "2026-08-09T22:06:53+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3884821040006938925", "username": "hairsalon.kinu", "text": "２ヶ月の変化。まだまだ続けます\n育毛は《予防ケア》が1番大切☝️\n早ければ早いスタートほど良いし、回数と量は重要ですね。\n育毛剤、サプリ、AGA薬に頼らない最新の育毛、白髪改善方法をマニアックに研究しているオタク美容師です。\n常に自分が実験台。\n髪とボリュームは頭皮の奥から変える必要があります😊土台こそが全て👍", "permalink": "https://www.threads.com/@hairsalon.kinu/post/DXpqCc5k8Et", "likes": 15, "velocity": 0.0, "ageHours": 3001.4, "postedAt": "2026-04-28T06:52:57+09:00", "genres": ["薄毛", "育毛"], "keywords": ["髪 ボリューム", "育毛剤", "AGA", "頭皮ケア"]}, {"id": "3907677224859001842", "username": "mokon_chan", "text": "45歳を過ぎてから、「1日3食きっちり食べる人」ほど髪のボリュームに悩みやすい。\n朝は豆乳、昼はヘルシーな定食、夜もしっかり、間食にナッツ。そんな「模範的な食生活」のはずなのに、抜け毛が変わらない。夕方になると顔がくすむし、疲れが抜けきらない。\n良かれと思ったその習慣が、大人の髪に必要な「ある若返りシステム」を1日中潰し続けている可能性がある。\nそのシステムとは、", "permalink": "https://www.threads.com/@mokon_chan/post/DY627t0muPy", "likes": 15, "velocity": 0.01, "ageHours": 2244.6, "postedAt": "2026-05-29T19:44:07+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3963174429891190197", "username": "mari_kimiwada", "text": "薄毛白髪専門家からハッキリ言っておきます！\n無印の商品が白髪・育毛にいいとか流行ってるが…\nそれに飛びついてる人、老化加速します！だって", "permalink": "https://www.threads.com/@mari_kimiwada/post/DcABiVsk121", "likes": 14, "velocity": 0.03, "ageHours": 406.9, "postedAt": "2026-08-14T09:27:09+09:00", "genres": ["薄毛", "育毛"], "keywords": ["薄毛 対策", "つむじ 薄毛", "発毛", "抜け毛 対策"]}, {"id": "3949043241849074623", "username": "emuji_ikumou", "text": "AGAクリニックに怒られそうだけど、ハッキリ言います。\nまともなAGA治療薬は、たった3つしかありません。それ以外を「これも効きますよ」って勧めてくるクリニックは、正直警戒したほうがいい。その3つっていうのが、", "permalink": "https://www.threads.com/@emuji_ikumou/post/DbN0efREjO_", "likes": 14, "velocity": 0.02, "ageHours": 874.8, "postedAt": "2026-07-25T21:31:03+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3974032757189840293", "username": "biyou_honto_rinaa", "text": "ペプチド最強なのに、なんでみんな使わないの。美容クリニックで8年働いてきて、ずっと疑問だった。たるみが改善した人って、、", "permalink": "https://www.threads.com/@biyou_honto_rinaa/post/DcmmbzCEQ2l", "likes": 14, "velocity": 0.3, "ageHours": 47.3, "postedAt": "2026-08-29T09:00:43+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3946335969519840252", "username": "kaori_yoga_instructor", "text": "頭皮マッサージ、ちゃんとやってますか?🌿\n\n頭皮と顔の皮膚は繋がっているから、頭皮のコリをほぐすだけで顔のむくみもスッと軽くなります。\n\n✅育毛・抜け毛予防(血流アップで毛母細胞に栄養が届く)\n✅髪にコシとツヤ\n✅リフトアップ・小顔効果\n✅疲労回復・自律神経を整える\n\n【やり方】\n・力加減は「生卵を持つ感覚」で、爪を立てずに指の腹で\n・入浴中や就寝前に1回3〜5分\n・やりすぎ注意!強く揉みすぎると頭皮や毛根を傷めます\n\n今日のバスタイムから、指の腹でやさしく試してみて✨\n\nーーーーーーーーーーー\n\n頭皮のマッサージもできるブナ材ヘアコーム（税込548円）\nこちらのコームは通常の無印良品店舗やネットストアで販売されている「ブナ材ヘアコーム」とは異なり\nローソン（LAWSON）でのみ購入できる限定商品となっています🏪\n\n#頭皮マッサージ #無印良品 #muji", "permalink": "https://www.threads.com/@kaori_yoga_instructor/post/DbEM6fbk6v8", "likes": 14, "velocity": 0.01, "ageHours": 964.4, "postedAt": "2026-07-22T03:52:11+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3965774925014082060", "username": "___me_mn", "text": "結局のところ毛穴に有効なケアって何ですか❔\nThreadsはPRばっかりで何を信じたら良いのかわからない😖❗", "permalink": "https://www.threads.com/@___me_mn/post/DcJQ0hgnaIM", "likes": 14, "velocity": 0.04, "ageHours": 320.7, "postedAt": "2026-08-17T23:33:53+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3933045399363323074", "username": "oyausuge", "text": "薄毛で来られる方の8割が、\n\n頭皮の血流が\n普通の人の半分以下、\n\nという結果でした", "permalink": "https://www.threads.com/@oyausuge/post/DaU-_PaiQTC", "likes": 13, "velocity": 0.01, "ageHours": 1404.5, "postedAt": "2026-07-03T19:46:09+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3933813718883432112", "username": "fusafusa_gingin", "text": "知ってるか。発毛に使うミノキシジル、仕組みとしては「血流を良くする」だけなんだ。逆に言うと体温を上げるだけで同等の効果が期待できる。まず、", "permalink": "https://www.threads.com/@fusafusa_gingin/post/DaXtrwumvaw", "likes": 13, "velocity": 0.01, "ageHours": 1379.1, "postedAt": "2026-07-04T21:12:40+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3964196686776284739", "username": "niisa233", "text": "教えてください。\n\n夫が薄毛治療をはじめたいと言い出して\nみなさん、どこでお薬をもらっていますか？\n\n皮膚科？\nAGA外来？\nオンライン？\n\n10年前から薄くなり始めて\nM字と後頭部が薄いです。\n\n検索魔になってしまい、余計にわからなくなりました💦", "permalink": "https://www.threads.com/@niisa233/post/DcDp-InFLZD", "likes": 13, "velocity": 0.03, "ageHours": 373.0, "postedAt": "2026-08-15T19:18:12+09:00", "genres": ["育毛", "薄毛"], "keywords": ["発毛", "AGA"]}, {"id": "3916412780484384939", "username": "natsumi19870912", "text": "久しぶりの投稿です！\nプロファイロを打って1ヶ月。\nむくみもなくなり完成かな？\n確かに肌艶はよくなります。\nすっぴんですがツヤッとします。\nただ…\nリフトアップ効果はないかな？\nただ3週間は顔がむくみますので\n失敗！？ええええ😭！？\nとなりますが、見事にひきました笑", "permalink": "https://www.threads.com/@natsumi19870912/post/DZZ5Kx-klir", "likes": 13, "velocity": 0.01, "ageHours": 1955.3, "postedAt": "2026-06-10T21:00:06+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3901645536818740003", "username": "jimu_neesan", "text": "20代のうちにやっておきたい施術3選\n※個人的な意見です\n\n3位：ボトックス（予防打ち）\n→シワになる前に打つのが正解\n早めにケアするほどコスパがいい💉\n2位：ハイフ（HIFU）\n→たるみケアは20代から始めると全然違う\nリフトアップ効果で輪郭がすっきり✨", "permalink": "https://www.threads.com/@jimu_neesan/post/DYlbfGlkbsj", "likes": 13, "velocity": 0.01, "ageHours": 2444.3, "postedAt": "2026-05-21T12:00:14+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3918253653606257793", "username": "maro_n0505", "text": "【無印良品　ヘアコーム】\n\nここで見て気になって数ヶ月前に購入。\n本来は頭皮マッサージ用のブナ材へアコームです。\n私の場合は頭皮のマッサージよりも、首筋や耳の下を優しく押す使い方にどハマり中。\n本来の使い方ではないかもしれないけど、私には\n『首筋専用・そこそこコーム」』になってます。🤭\n\n❣️私の撮った写真を元に､チャッピーがわかりやすく作ってくれました😊", "permalink": "https://www.threads.com/@maro_n0505/post/DZgbvArE9SB", "likes": 13, "velocity": 0.01, "ageHours": 1894.3, "postedAt": "2026-06-13T09:57:36+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3901201845230418032", "username": "horumi_yuragibiyou", "text": "前髪に白髪が多い人が、一番やりがちなミスを言います。前髪・生え際の白髪は、胃腸の疲れのサイン。だから亜鉛サプリを飲んでも、頭皮マッサージをしても変わらない。胃腸が整っていないと、栄養が髪に届く前になくなっているんです。私も最初、白髪の生える場所を気にせずに亜鉛サプリを半年飲み続けました。でも変わらず....(泣)婦人科医の夫に話したら、￼", "permalink": "https://www.threads.com/@horumi_yuragibiyou/post/DYj2mimDrhw", "likes": 12, "velocity": 0.0, "ageHours": 2459.0, "postedAt": "2026-05-20T21:18:42+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3950447004606259158", "username": "temari.yakuzen", "text": "抜け毛や薄毛が気になる人、\n頭のてっぺんを\n指で押してみて。\n\nブヨブヨしてるか\nガチガチに硬いなら\n頭皮の血行が\n滞っているサインで、", "permalink": "https://www.threads.com/@temari.yakuzen/post/DbSzp7Nj9_W", "likes": 12, "velocity": 0.01, "ageHours": 828.3, "postedAt": "2026-07-27T20:00:02+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3889144170669810257", "username": "chie.kogao.design", "text": "小顔にならない女性には、共通する特徴がある。\n当てはまってないよね？\n\n1.足が…￼", "permalink": "https://www.threads.com/@chie.kogao.design/post/DX5BASFDiJR", "likes": 12, "velocity": 0.0, "ageHours": 2858.3, "postedAt": "2026-05-04T06:02:15+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3872674739408320906", "username": "tiki.scalpink", "text": "頑張って薄毛改善しました！\n\n長年のコンプレックス。\n\nどの位の期間で改善したかというと、、", "permalink": "https://www.threads.com/@tiki.scalpink/post/DW-gSg9D7mK", "likes": 12, "velocity": 0.0, "ageHours": 3403.6, "postedAt": "2026-04-11T12:40:26+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3895429377073331696", "username": "ha._.zu085", "text": "産後3ヶ月たって最近抜け毛酷い🥹\n同じくらいの産後のママさん達で同じかたいますか🥹\nそれとも人によりますか?、、\n対策教えてください🥹💗", "permalink": "https://www.threads.com/@ha._.zu085/post/DYPWGEsE73w", "likes": 12, "velocity": 0.0, "ageHours": 2650.1, "postedAt": "2026-05-12T22:09:50+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3911037356156837559", "username": "ooyashinkyu134", "text": "薄毛鍼、3年やってきて分かったこと、全部書きます。", "permalink": "https://www.threads.com/@ooyashinkyu134/post/DZGy8D9At63", "likes": 12, "velocity": 0.01, "ageHours": 2133.3, "postedAt": "2026-06-03T11:00:06+09:00", "genres": ["育毛", "薄毛"], "keywords": ["発毛", "薄毛 対策", "つむじ 薄毛"]}, {"id": "3961464099766944854", "username": "nemui0o_", "text": "メラニン毛穴におすすめのスキンケアってなんだろう、、クレンジングも悩ましい、、", "permalink": "https://www.threads.com/@nemui0o_/post/Db58pwpEkRW", "likes": 12, "velocity": 0.03, "ageHours": 463.5, "postedAt": "2026-08-12T00:49:02+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3878653271968366560", "username": "yuu_mens_beauty", "text": "【M字ハゲの男性に似合う髪型がこの5つ👇️】\n\n・アップバング（前髪上げスタイル）\n・ソフトモヒカン（トップに高さ）\n・ツーブロック＋ショート（メリハリ型）\n・ナチュラルパーマ（動きでぼかす）\n・ベリーショート（潔く短く）\n\nM字ハゲ・生え際後退タイプは、「隠す」よりも活かす・ぼかす・視線を分散させるのがポイント！\n\nソフトモヒカンやツーブロックのようにして、トップにボリュームを持たせるのもおすすめ。", "permalink": "https://www.threads.com/@yuu_mens_beauty/post/DXTvpnSlL_g", "likes": 11, "velocity": 0.0, "ageHours": 3205.7, "postedAt": "2026-04-19T18:38:42+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3935292630062401860", "username": "hair_nayami_koharu", "text": "ミノキシジルを使わずに薄毛が変わった体験を、正直に全部話したいと思っている。「薬を使わなければ変わらない」と思い込んでいた自分が変わったのが、", "permalink": "https://www.threads.com/@hair_nayami_koharu/post/Dac98wGFQlE", "likes": 11, "velocity": 0.01, "ageHours": 1330.1, "postedAt": "2026-07-06T22:11:02+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3963622786812045945", "username": "hitomi.takizawa13", "text": "目の下のたるみが毎日気になってはいるけど…整形しないで年相応にたるんで行こうと思う。ダメ？笑", "permalink": "https://www.threads.com/@hitomi.takizawa13/post/DcBneynk2p5", "likes": 11, "velocity": 0.03, "ageHours": 392.0, "postedAt": "2026-08-15T00:17:58+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3961261069842652924", "username": "opa_biyou32", "text": "全女性に伝えたい。高い美容医療なしで毛穴・くすみを改善するのに『ナイアシンアミド』は最強なんだけど、単体で使うともったいない。この4つの組み合わせで使って、", "permalink": "https://www.threads.com/@opa_biyou32/post/Db5OfSSjh78", "likes": 10, "velocity": 0.02, "ageHours": 470.2, "postedAt": "2026-08-11T18:05:39+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3968491265637085659", "username": "megan_jpn", "text": "美容に詳しい人〜👋\n実体験で、リフトアップに効いた化粧品を教えてください。👏✨\nたるみがすんごい気になる。\n今年40才だもん、重力に負けるわ。🛸👽", "permalink": "https://www.threads.com/@megan_jpn/post/DcS6ce2ifHb", "likes": 10, "velocity": 0.04, "ageHours": 230.8, "postedAt": "2026-08-21T17:30:46+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3914621358046285032", "username": "nekotoseiten", "text": "女性の皆様にお聞きします\n市販されている育毛剤で効果あったよー！って人いますか？\n\n20代の娘が仕事中ヘルメットを被る仕事で\n最近髪の毛が薄くなってきたと悩んでいるので\n育毛剤を買ってあげたくてしたくて…", "permalink": "https://www.threads.com/@nekotoseiten/post/DZTh2J0gYzo", "likes": 10, "velocity": 0.0, "ageHours": 2014.6, "postedAt": "2026-06-08T09:40:52+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3923995465620842337", "username": "50hayasu", "text": "52歳。生え際が後退している現実を認めることにした。\n\n中学の頃からハゲるのが怖かった。\n\n実家が美容室だったこともあって、\n育毛剤だけはずっと身近にあった。\n\nそれでも50代になると、\n鏡を見るたびに生え際が気になる。\n\nだから今は、現実から目を逸らさずに記録していく。", "permalink": "https://www.threads.com/@50hayasu/post/DZ01RX0kudh", "likes": 9, "velocity": 0.01, "ageHours": 1704.2, "postedAt": "2026-06-21T08:05:33+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3974049657139754232", "username": "takahashishota.co.jp", "text": "そして、アワード表彰式。\n今回、エクセルグロー（三和紙工）賞で和多くの作品が商品化されることになり感動。\nみんなで考えた甲斐あったな！\nエクセルグローさま、素晴らしい企画とご支援を誠にありがとうございます！\nお披露目は松山、文具フェスタで！！\n個人的MVPはAGAと色部さんのツーショットでした笑", "permalink": "https://www.threads.com/@takahashishota.co.jp/post/DcmqRuVk_T4", "likes": 9, "velocity": 0.19, "ageHours": 46.7, "postedAt": "2026-08-29T09:34:17+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3965496045186761382", "username": "usagiwarabbit", "text": "夫の抜け毛が多くて心配…。\nストレス？加齢？ホルモンバランス？\nシャンプー変えたらいいのかな？💦", "permalink": "https://www.threads.com/@usagiwarabbit/post/DcIRaSbksKm", "likes": 9, "velocity": 0.03, "ageHours": 330.0, "postedAt": "2026-08-17T14:19:48+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3928313790945547905", "username": "atmdjhw", "text": "薄毛？ハゲ？の薬ってやはりリスクあるよね。\n夫に予防で使ったらと思ってたけど危ないよな。", "permalink": "https://www.threads.com/@atmdjhw/post/DaELJRrk9aB", "likes": 9, "velocity": 0.01, "ageHours": 1561.2, "postedAt": "2026-06-27T07:05:17+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3964157219180756668", "username": "oyausuge", "text": "これまで100名以上の薄毛の方を診てきて、\n気づいたことのひとつが、\n\n薬で生やした髪と、\n自分の血流で生やした髪は、", "permalink": "https://www.threads.com/@oyausuge/post/DcDg_zjEb68", "likes": 8, "velocity": 0.02, "ageHours": 374.3, "postedAt": "2026-08-15T17:59:47+09:00", "genres": ["薄毛", "育毛"], "keywords": ["つむじ 薄毛", "発毛"]}, {"id": "3950394602281379588", "username": "lello_salon", "text": "【エステティシャン募集】\n⁡\n⁡\nアルバイトスタッフを1名募集いたします😌\n⁡\nカウンセリング、施術、スキンケアのアドバイスまで、肌質改善に専門特化した仕事内容になります✨\n⁡\n【勤務時間】\n11:30〜20:00まで（終わり次第早上がり可能）\n⁡\n【勤務日数】\n週2日以上で応相談\n⁡\n【応募条件】\n美容の知識や経験がある人（美容・化粧品業界での勤務経験がある、美容専門学校を卒業している、化粧品検定1級などの資格を持っている etc...）\n⁡\n面接希望者様は、\n⁡\n⚫︎氏名\n⚫︎生年月日\n⁡\nご記載の上、DMまでご連絡をお待ちしております✉️\n⁡\n⁡\n#肌質改善サロン #エステティシャン", "permalink": "https://www.threads.com/@lello_salon/post/DbSnvXvmicE", "likes": 8, "velocity": 0.01, "ageHours": 830.0, "postedAt": "2026-07-27T18:15:56+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3895169013588789653", "username": "rui.fphl", "text": "FAGA治療を始めて1年が経過した。\n服用＋塗り薬。\n半年すぎたくらいで薬は飲んだり飲み忘れたり...ズボラに過ごしたけど間違いなく薄毛の変化はあった！今のところ服用による副作用はなさそう。\n久しぶりに髪の毛の様子を撮影した💇‍♀️\n\n左：開始1ヶ月　右：開始1年後", "permalink": "https://www.threads.com/@rui.fphl/post/DYOa5STEYmV", "likes": 8, "velocity": 0.0, "ageHours": 2658.8, "postedAt": "2026-05-12T13:32:32+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3864724754155137989", "username": "beautysalon__my", "text": "はじめまして☺️🤍\n\n豊川市でフェイシャルサロンをしています。\n\nご来店くださるお客様にとって\n「ほっとできる場所」でありながら\nしっかりお肌の変化も感じていただけるように\n心を込めて施術しています🌿\n\nこれから少しずつ発信していきます🫶🏻\nよろしくお願いします🌷", "permalink": "https://www.threads.com/@beautysalon__my/post/DWiQrAOE2vF", "likes": 8, "velocity": 0.0, "ageHours": 3666.9, "postedAt": "2026-03-31T13:25:13+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3923559715796769072", "username": "sacai.norico", "text": "ほうれい線って、\n口の横からあごにまで伸びるから\n嫌なんだよね。\n\nでも、顔の筋肉意識したら\nこんなに変わったよ✨", "permalink": "https://www.threads.com/@sacai.norico/post/DZzSMYLGVkw", "likes": 8, "velocity": 0.0, "ageHours": 1718.6, "postedAt": "2026-06-20T17:39:47+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3970026373267988448", "username": "chocolate513choco", "text": "成果でてるーーー🫪✨\n\nキメが細かくなってる😭\n冷蔵庫で冷やした日本酒コットンパックか？\nびっくらこいた😭🤣🥳\n消しゴムで消したかのよう\n嬉しいー\n\n久しぶりにキメの細かい肌を見た😂\n冷やしたのが良かったのか？\n日本酒が合ってるのか？\nアゼライン酸がいいのか？\n\nとにかく嬉しい🤤✨", "permalink": "https://www.threads.com/@chocolate513choco/post/DcYXfPPkh_g", "likes": 8, "velocity": 0.04, "ageHours": 180.0, "postedAt": "2026-08-23T20:20:45+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3962013470232976305", "username": "dot_tattoo_artist", "text": "何億回でも言うね…。\n本気で薄毛を防ぎたいなら、これやってください。", "permalink": "https://www.threads.com/@dot_tattoo_artist/post/Db75kJwjJux", "likes": 8, "velocity": 0.02, "ageHours": 445.3, "postedAt": "2026-08-12T19:00:32+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策", "つむじ 薄毛"]}, {"id": "3890230248268776824", "username": "yuu_mens_beauty", "text": "【薄毛対策ミスる人多すぎ🤚】\n\n■ハゲる人の習慣↓\n・気になり始めて育毛剤を使う\n・頭皮マッサージをする\n・まだ若いからと放置\n・タバコ吸ってる\n\n■ハゲない人の習慣がこれ↓", "permalink": "https://www.threads.com/@yuu_mens_beauty/post/DX838yqikV4", "likes": 7, "velocity": 0.0, "ageHours": 2822.3, "postedAt": "2026-05-05T18:00:05+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3900468080970567150", "username": "biyou_sake", "text": "3年ずっと頭皮マッサージを続けてるのに\n顔がたるむ40代の方から相談を受けた。\n\n相談者「毎日ヘッドスパみたいに頭皮を揉んでます」\n私「揉むのは続けていいです」\n\n相「シャンプー前に5分しっかりほぐしてます」\n私「でも、たぶん抜けてる工程が1つあります」\n\n相「え…頭皮ケアって揉めばいいんですよね…」\n私「半分は合ってるんです。ただ、\n順番というより、もう1つの方が、」", "permalink": "https://www.threads.com/@biyou_sake/post/DYhPw3YAA3u", "likes": 7, "velocity": 0.0, "ageHours": 2483.3, "postedAt": "2026-05-19T21:00:50+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3952596579676819673", "username": "outidesekkotsuin", "text": "美容鍼されてる鍼灸師さん\n美容鍼はどこで学ばれましたか？\nパルスの電気は入れず\nリフトアップを立体動態波の中にある\n電気を使ってやっていこうと思ってます😌\n同業者様もし教えていただけるのであれば\n教えて頂きたいです🙇‍♀️", "permalink": "https://www.threads.com/@outidesekkotsuin/post/DbacaXAD5DZ", "likes": 7, "velocity": 0.01, "ageHours": 757.1, "postedAt": "2026-07-30T19:10:51+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3940647696519523783", "username": "dandism01", "text": "薄毛治療を始めたいけど、何の薬を飲めばいいのかわからなくて、結局また先延ばしにしてしまった。\n調べれば調べるほど混乱する。\n同じ経験した人いますか？", "permalink": "https://www.threads.com/@dandism01/post/Dav_jOYAe3H", "likes": 7, "velocity": 0.01, "ageHours": 1152.8, "postedAt": "2026-07-14T07:30:34+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策", "つむじ 薄毛"]}, {"id": "3954734055019321927", "username": "zabee_l.28", "text": "最近抜け毛エグい\nストレスでハゲてるのか😭！？", "permalink": "https://www.threads.com/@zabee_l.28/post/DbiCauCkRpH", "likes": 7, "velocity": 0.01, "ageHours": 686.3, "postedAt": "2026-08-02T17:57:38+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3958359554655956265", "username": "usuge_matome", "text": "頭皮って、強く洗わなくて大丈夫です。\n\nやりがちな洗い方と、頭皮にやさしい洗い方を4つ並べてみました。", "permalink": "https://www.threads.com/@usuge_matome/post/Dbu6wrsiq0p", "likes": 7, "velocity": 0.01, "ageHours": 566.3, "postedAt": "2026-08-07T18:00:52+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3951969546941419165", "username": "ca_youna", "text": "頭皮の臭い匂い撲滅！！！\n\nアラサーの皆様、頭皮こすってみたら臭ったり\n頭皮がかゆくなったりしていない？\n毎日髪をきつくしばるCAだからこそ、髪の毛、頭皮の治安が悪化して、実際に使って改善した頭皮ケアを皆様に共有します！地肌から整えると顔色までよくなるよ！", "permalink": "https://www.threads.com/@ca_youna/post/DbYN11Qms6d", "likes": 7, "velocity": 0.01, "ageHours": 777.9, "postedAt": "2026-07-29T22:25:03+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3958384025032021383", "username": "yururu.selfcare", "text": "40代後半から「髪が細くなった」「抜け毛が増えた」は更年期の典型的な変化。でも頭皮だけをケアしようとすると、根本を外す。エストロゲンが減ると頭皮への血流が変わって、毛母細胞に届く栄養が変わる。シャンプーや育毛剤を変えても変わらない人は、血流から見直すタイミングかもしれないんだけど、", "permalink": "https://www.threads.com/@yururu.selfcare/post/DbvAUxgnVWH", "likes": 7, "velocity": 0.01, "ageHours": 565.5, "postedAt": "2026-08-07T18:49:29+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3957015352307198023", "username": "the.2nd_star", "text": "縮毛矯正ってどのくらい髪痛む？？\nカラー入りにくくなったり髪乾きずらくなったりするかな", "permalink": "https://www.threads.com/@the.2nd_star/post/DbqJH9tCahH", "likes": 7, "velocity": 0.01, "ageHours": 610.8, "postedAt": "2026-08-05T21:30:10+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3945947716446524830", "username": "o_dai_o_dai", "text": "断言するけど、薄毛で一番の犯人はシャンプーじゃない。前髪やつむじが気になる人ほど、真っ先に育毛剤と頭皮マッサージを始める。でも止まらない。じゃあ何が原因か。頭皮の表面ではなく、毛根で髪が細くなっていることが多い。", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbC0oqlDxWe", "likes": 6, "velocity": 0.01, "ageHours": 977.3, "postedAt": "2026-07-21T15:00:45+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "つむじ 薄毛"]}, {"id": "3863169070821183460", "username": "8181.asobana", "text": "50代女性、\nトップの薄毛で悩んでます😭\n\n全体はまだ大丈夫なんですが、つむじ〜分け目あたりが気になってきて💦\n\nレディースウィッグ（特に部分用・ヘアピース）を探してるんですが、\nネットで調べても種類が多すぎて\nどれがいいのか分からず…\n\n「エクステシートタイプ（約28,000円）」が気になってたんですが在庫切れでした🥲\n\nできれば\n・お財布に優しめ\n・装着が簡単\n・今ある髪に負担が少ない\n・できれば手入れも楽\n\nこんな感じのウィッグやヘアピースで\n「これ良かったよ！」っていうのがあれば教えてほしいです🙏\n\n実際に使ってる方のリアルな感想も聞きたいです✨", "permalink": "https://www.threads.com/@8181.asobana/post/DWcu81Nko_k", "likes": 6, "velocity": 0.0, "ageHours": 3718.4, "postedAt": "2026-03-29T09:54:22+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛", "薄毛 対策"]}, {"id": "3958339096946684226", "username": "biyou_mochi", "text": "炎上覚悟で言います。「頭皮マッサージ」はマジでヤバい習慣です。高いリフトアップ美容液買い替えてきて、頭皮マッサージの恐ろしさにようやく気づいた。\n何が恐ろしいかというと、", "permalink": "https://www.threads.com/@biyou_mochi/post/Dbu2G--DDFC", "likes": 6, "velocity": 0.01, "ageHours": 567.0, "postedAt": "2026-08-07T17:20:13+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3885258187575591083", "username": "kounenki___chan", "text": "信じられないけど、ワイは「ウカ スカルプブラシ」より「満天社 ハンドプロ」を毎日欠かさない。トレンドの、頭皮臭対策にはもちろんウカなんだけど、", "permalink": "https://www.threads.com/@kounenki___chan/post/DXrNbyTHwCr", "likes": 6, "velocity": 0.0, "ageHours": 2987.0, "postedAt": "2026-04-28T21:21:30+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3907337910302656782", "username": "mika_no_tsubuyaki", "text": "東京都中央区銀座で\nフェイシャルエステのセラピストしてます！", "permalink": "https://www.threads.com/@mika_no_tsubuyaki/post/DY5pyChAckO", "likes": 6, "velocity": 0.0, "ageHours": 2255.8, "postedAt": "2026-05-29T08:29:58+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3945513420242020080", "username": "wasakaragram", "text": "高周波種類ありすぎどれがいいのか🥺\nソフウェーブが非常に気になるが痛そうだし高いな〜\nザーフも気になるけど通ってるクリニックにはまだ導入されてないので、まずはボルニューマを予約してみた！\nたるみ改善したい〜🥺", "permalink": "https://www.threads.com/@wasakaragram/post/DbBR40uD-bw", "likes": 6, "velocity": 0.01, "ageHours": 991.7, "postedAt": "2026-07-21T00:37:53+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3911105535332688298", "username": "sana_oniku", "text": "ずっと品切れだった毛穴洗浄をようやくゲット。使ってみたら、鼻の黒ずみがすっきりして洗い上がりに感動した…✨\nこれ使ったことある人いますか？皆さんの毛穴ケアのおすすめも知りたいです！", "permalink": "https://www.threads.com/@sana_oniku/post/DZHCcMwkaGq", "likes": 6, "velocity": 0.0, "ageHours": 2131.0, "postedAt": "2026-06-03T13:15:39+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3903433002685469048", "username": "fusafusa_gingin", "text": "ゾッとした。AGAを5年治療していた先輩が「副作用が怖くなってフィナステリドをやめた」と言っていた。その後どうなったか聞いてみたら、", "permalink": "https://www.threads.com/@fusafusa_gingin/post/DYrx6J5mpF4", "likes": 6, "velocity": 0.0, "ageHours": 2385.1, "postedAt": "2026-05-23T23:11:36+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3951505021833800246", "username": "tokyo.hyhyakn", "text": "最近相談されるけど薄毛ってしんどいよな😓同じに悩みの人いる？", "permalink": "https://www.threads.com/@tokyo.hyhyakn/post/DbWkOGik2o2", "likes": 6, "velocity": 0.01, "ageHours": 793.3, "postedAt": "2026-07-29T07:02:08+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3945404087814795321", "username": "o_dai_o_dai", "text": "薄毛治療10年以上やって気づいた。\nホントにやめたほうがいいのは、「スカルプシャンプー」や「育毛剤」ではなくて、", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbA5B09kzA5", "likes": 5, "velocity": 0.01, "ageHours": 995.3, "postedAt": "2026-07-20T21:00:40+09:00", "genres": ["薄毛", "育毛"], "keywords": ["薄毛 対策", "抜け毛 対策", "つむじ 薄毛"]}, {"id": "3964640865481275240", "username": "o_dai_o_dai", "text": "実際にやって良かった薄毛対策10選😳\n\n・10位：月1で前髪とつむじを撮影\n（毎日の鏡より変化が分かる）\n・9位：抜け毛の本数を数えない\n（短く細い毛を見る）\n・8位：高級シャンプー探しをやめる\n（AGA治療とは別物）\n・7位：タンパク質・鉄・亜鉛を不足させない\n（髪の土台）\n・6位：個人輸入をやめる\n（薬は医師に相談できる環境で）\n・5位：外用ミノキシジルを用法どおり使う\n（多く塗っても早く生えない）", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DcFO9yRAjdo", "likes": 5, "velocity": 0.01, "ageHours": 358.3, "postedAt": "2026-08-16T10:00:42+09:00", "genres": ["薄毛", "育毛"], "keywords": ["つむじ 薄毛", "抜け毛 対策"]}, {"id": "3936372328049802326", "username": "sana_oniku", "text": "紗栄子さんや小田切ヒロさんが推してたプライマー使ってみたら、鼻の毛穴が隠れて感動した✨\n肌の凸凹をきれいに埋めてくれる感じがします。\nみなさんが手放せないお気に入りの化粧下地ってありますか？", "permalink": "https://www.threads.com/@sana_oniku/post/DagzcbNFfxW", "likes": 5, "velocity": 0.0, "ageHours": 1294.4, "postedAt": "2026-07-08T09:56:15+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3962804029931859326", "username": "chii_gokigen_na_kurashi", "text": "ちょっとーー！！バズってる無印のコームすごすぎる！！\nこれで頭皮マッサージしたら、翌朝のむくみがマシになった✨\n効果的な使い方は", "permalink": "https://www.threads.com/@chii_gokigen_na_kurashi/post/Db-tUT2ky1-", "likes": 5, "velocity": 0.01, "ageHours": 419.1, "postedAt": "2026-08-13T21:11:14+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ", "頭皮ケア"]}, {"id": "3937714600641030596", "username": "1253252aaa", "text": "薄毛に悩んでる方に聞きたいんですけど、\n今現在使ってる発毛剤とかありますか？\nまた効果は実感しましたか？", "permalink": "https://www.threads.com/@1253252aaa/post/DalkpD-E-nE", "likes": 5, "velocity": 0.0, "ageHours": 1249.9, "postedAt": "2026-07-10T06:23:01+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3948240956009514395", "username": "dot_tattoo_artist", "text": "ごめんなさい…。\n一生言い続けます。本気で薄毛を防ぎたいなら、これやってください。", "permalink": "https://www.threads.com/@dot_tattoo_artist/post/DbK-DsWmIWb", "likes": 5, "velocity": 0.01, "ageHours": 901.4, "postedAt": "2026-07-24T18:57:01+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策", "つむじ 薄毛"]}, {"id": "3965140650216892924", "username": "key_kun_mom", "text": "もうすぐ1歳半になる娘が見事な薄毛です。\n早生まれなので七五三は満3歳でやればあと2年ちょっと猶予があるとは思いつつ、これほどまでに薄毛ガールはいつになったら髪の毛伸びてくるもんなんでしょうか？\n似たようや薄毛ガールの方の情報教えて欲しいです！", "permalink": "https://www.threads.com/@key_kun_mom/post/DcHAmnEo6n8", "likes": 4, "velocity": 0.01, "ageHours": 341.7, "postedAt": "2026-08-17T02:33:41+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3957024109753863483", "username": "official_paramiclinic", "text": "同一人物です。\n変わったのは、生え際だけ🌸\n\n#植毛 #AGA #薄毛治療 #ビフォーアフター", "permalink": "https://www.threads.com/@official_paramiclinic/post/DbqLHZtiQ07", "likes": 4, "velocity": 0.01, "ageHours": 610.5, "postedAt": "2026-08-05T21:47:34+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3974338122259557934", "username": "masa.agabye", "text": "ハゲたくないならこれ覚えとけ10選👊\n\n① 抜け毛だけ見るな。毛の細さも見ろ\n② AGAは進行性。様子見はおすすめしない\n③ DHTは覚えとけ。AGAに関わる男性ホルモン\n④ フィナは進行を抑える薬。DHTの生成を抑える\n⑤ デュタは作用範囲が広い。フィナとの違いはここ\n⑥ ミノキは発毛を促す。フィナとは役割が違う\n⑦ 育毛と発毛は別だ。ごっちゃにするな\n⑧ シャンプーだけに期待するな。AGA治療とは別物\n⑨ 遺伝でも諦めるな。親父の頭＝お前の未来じゃない\n⑩ 薬は自己判断するな。医師と相談して決めろ\n\n今年こそハゲ辞めるぞ", "permalink": "https://www.threads.com/@masa.agabye/post/Dcnr3caku4u", "likes": 4, "velocity": 0.11, "ageHours": 37.2, "postedAt": "2026-08-29T19:07:25+09:00", "genres": ["薄毛", "育毛"], "keywords": ["AGA", "発毛"]}, {"id": "3960653623860373756", "username": "momo_biyo321", "text": "バズってるこれ。毛穴消えるでお馴染みらしいけど正直に言うね。「一瞬で毛穴消えて神〜」はごめんけどない🙅🏻でもね…", "permalink": "https://www.threads.com/@momo_biyo321/post/Db3EXyIj6j8", "likes": 4, "velocity": 0.01, "ageHours": 490.3, "postedAt": "2026-08-10T21:58:46+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3967000691760349439", "username": "mimi2025jewelry", "text": "今までずっとハイトーン派で\nブリーチやめて髪質改善方向へきて数年\n最近白髪マジで増えてきて😨\nカラーしても1ヶ月持たないし‥‥\n\nでもめちゃくちゃ癖毛だし髪質改善して\n髪綺麗なったし🤔\nどっちを優先すべきなのか🥹\n\n来年50代突入だし🫨\nめちゃくちゃ悩むところ😮‍💨\n\nみんなはどんな感じ？？", "permalink": "https://www.threads.com/@mimi2025jewelry/post/DcNnhxwGsD_", "likes": 4, "velocity": 0.01, "ageHours": 280.2, "postedAt": "2026-08-19T16:09:15+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3945536592672966072", "username": "ms0101n", "text": "産後の抜け毛がすっごい。ハゲてる絶対😭\nお風呂場と髪の毛乾かした時すっごい。\n部屋中抜け毛だらけですっごい。\nこれいつ頃落ち着くのでしょうか🥹", "permalink": "https://www.threads.com/@ms0101n/post/DbBXKBuk8W4", "likes": 4, "velocity": 0.0, "ageHours": 990.9, "postedAt": "2026-07-21T01:23:55+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3909986649644187846", "username": "ham__yur", "text": "あの、、、まじで声を大にして言わないといけないことがありまして、、頭皮マッサージとかしてない人ほんと顔たるむんで、まじでこれ使ってほしい、、テレビで女優さんが使ってたやつなんですけどほんとこういうのが1番いいぞ…", "permalink": "https://www.threads.com/@ham__yur/post/DZDECRQj8DG", "likes": 4, "velocity": 0.0, "ageHours": 2168.1, "postedAt": "2026-06-02T00:12:32+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3949405248637032355", "username": "chizureen", "text": "髪🪮　血行促進　頭皮マッサージ", "permalink": "https://www.threads.com/@chizureen/post/DbPGyYXEtej", "likes": 4, "velocity": 0.0, "ageHours": 862.8, "postedAt": "2026-07-26T09:30:15+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3958195644905738254", "username": "yumi.twins02", "text": "髪の毛かき集めたツインテール（？）", "permalink": "https://www.threads.com/@yumi.twins02/post/DbuVfe2GtAO", "likes": 4, "velocity": 0.01, "ageHours": 571.7, "postedAt": "2026-08-07T12:35:12+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3952375987086396397", "username": "miiii.2598", "text": "薄毛なのにぃーーーー\nハゲてきた😭😭\nとりあえず枕にシルクカバーつけたけど😭\n女の子なのに😭😭\n対策ありますか？", "permalink": "https://www.threads.com/@miiii.2598/post/DbZqQUJEYvt", "likes": 4, "velocity": 0.01, "ageHours": 764.4, "postedAt": "2026-07-30T11:52:35+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3899708760751567882", "username": "oyausuge", "text": "頭皮マッサージは、\nやればやるほど\n逆効果になることがあります。\n\n触りすぎる頭皮は、", "permalink": "https://www.threads.com/@oyausuge/post/DYejHTUE3QK", "likes": 4, "velocity": 0.0, "ageHours": 2508.4, "postedAt": "2026-05-18T19:52:12+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3961172200761926796", "username": "eeeeen.faaaam", "text": "毛穴おだまりクリームってどうなってんの？\nなんで毛穴消滅するの！！？\n毛穴に比べて気にならなかったシミが気になるようになってきた🤣", "permalink": "https://www.threads.com/@eeeeen.faaaam/post/Db46SEgkSSM", "likes": 4, "velocity": 0.01, "ageHours": 473.2, "postedAt": "2026-08-11T15:09:05+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3962838810660904009", "username": "non.biyouu", "text": "女性の薄毛って男性みたいに前頭部からごっそり後退するパターンは少なくて、実はほとんどの人がまず頭頂部の分け目からじわじわ進行するらしい。初期サインは抜け毛の本数が増えることより先に、1本1本の髪が細くなること。分け目が広がって地肌が透けて見えるようになった時点で、実はけっこう進行してるサインらしくて、これ知った時ゾッとした。しかも自分では毎日鏡を見てるからこそ変化に気づきにくくて、はっきり気づいた時にはもう分け目全体が薄くなってるパターンが多い。", "permalink": "https://www.threads.com/@non.biyouu/post/Db-1Ob7kxxJ", "likes": 4, "velocity": 0.01, "ageHours": 418.0, "postedAt": "2026-08-13T22:20:20+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3947971002407333380", "username": "o_dai_o_dai", "text": "早く知ればよかった薄毛対策↓\n\n🥉論外（金ドブになりやすい）\n・高いだけのスカルプシャンプー\n・根拠の弱い発毛サプリ\n・頭皮を強く刺激するマッサージ器\n\n🥈惜しい（悪くないけど役割が違う）\n・低刺激シャンプー\n・亜鉛やビオチンのサプリ\n・育毛トニックの単品使い\n・頭皮用美容液だけ\n・タンパク質を意識した食事\n\n🥇ガチで将来に差がつく対策", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbKArWeCC4E", "likes": 3, "velocity": 0.0, "ageHours": 910.3, "postedAt": "2026-07-24T10:00:40+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3935068598268699007", "username": "firstpenguin_is", "text": "最近「髪ツヤツヤだね」って言われること増えたんだけど、絶対これのおかげだと思う✨\n以前は朝起きるたびに枕見て落ち込んでたのに、今はボリュームも出てきて\n\n同じ悩みあった人いる？もっと早く出会いたかったやつ", "permalink": "https://www.threads.com/@firstpenguin_is/post/DacLAqOmaF_", "likes": 3, "velocity": 0.0, "ageHours": 1337.5, "postedAt": "2026-07-06T14:45:53+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3953834512312565986", "username": "days_mo_ni", "text": "高いオイルもバームも何使っても癖毛大ボリュームヤチボウズハグリッドになってたんだけど\n同じく癖毛の子に相談したら「ベビーオイルがいいよ〜」って教えてもらって。\nお風呂後に揉み込んで寝たら\n朝起きてまとまりすぎてて感動した😭😭(寿司がアフターね)\n頑張って伸ばせそう〜", "permalink": "https://www.threads.com/@days_mo_ni/post/Dbe14pnEgDi", "likes": 3, "velocity": 0.0, "ageHours": 716.1, "postedAt": "2026-08-01T12:10:24+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3966416118433329123", "username": "yasunari_akiba_peace", "text": "ペロリコオススメです。\n使ってみてください。\n発毛クリニックでも使われてる世界的特許の機能性ペプチドを高配合されてるシャンプー、コンディショナー、育毛剤です。\n当店でも90%以上のお客様にしっかりとした効果があります。\nお近くに取り扱いの理美容室があれば1度ご相談してみて下さい。", "permalink": "https://www.threads.com/@yasunari_akiba_peace/post/DcLinHami_j", "likes": 3, "velocity": 0.01, "ageHours": 299.5, "postedAt": "2026-08-18T20:47:49+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3906998884375885979", "username": "festa201206", "text": "「毛穴消えるわよぉ〜」って\n小田切ヒロさんの聞いて即ポチ。🥹\nこれ当たりだった…。\n1ヶ月続けたらお肌つるんつるん。w\n毛穴ケアって、こーゆー事ね。", "permalink": "https://www.threads.com/@festa201206/post/DY4cskBEnib", "likes": 3, "velocity": 0.0, "ageHours": 2267.0, "postedAt": "2026-05-28T21:16:23+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3970626307495381579", "username": "nori_jinsei_lab", "text": "AGA治療、始めて1年3ヶ月経過。", "permalink": "https://www.threads.com/@nori_jinsei_lab/post/Dcaf5biFUpL", "likes": 3, "velocity": 0.02, "ageHours": 160.1, "postedAt": "2026-08-24T16:12:52+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3973970177821925130", "username": "o_dai_o_dai", "text": "お願いですから、メモってください。 \n薄毛治療10年以上、育毛剤でかなり遠回りした俺からのお願いです。\n\n・育毛剤は「AGAの進行を止める薬ではありません」\n・育毛シャンプーは「頭皮を洗うもの。発毛治療ではありません」\n・頭皮マッサージは「気持ちいい。でもAGA治療の代わりにはなりません」\n・亜鉛サプリは「不足を補うもの。AGAを治すものではありません」\n・フィナステリドは「AGAの進行を抑える“守り”です」\n・デュタステリドは「作用範囲が違う“守り”の選択肢です」\n・外用ミノキシジルは「", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DcmYNJdEl8K", "likes": 3, "velocity": 0.06, "ageHours": 49.4, "postedAt": "2026-08-29T06:56:23+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3964920156567757171", "username": "aru.pska.no.suke", "text": "AGAの治療したいんだけど、トランスジェンダーで毎月男性ホルモン注射打ちながらって意味あるんかな....", "permalink": "https://www.threads.com/@aru.pska.no.suke/post/DcGOeAXAeFz", "likes": 3, "velocity": 0.01, "ageHours": 349.0, "postedAt": "2026-08-16T19:15:36+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3887433089312117504", "username": "sacchan_moto_biyou", "text": "小田切ヒロ様が「毛穴消えるわよ〜！！！」って言ってたクレンジング、黒ずみ＆角栓まとめて崩壊した。1回で変化出るのに、使い続けたら毛穴どこ？状態。これで2000円以下は意味わからん。", "permalink": "https://www.threads.com/@sacchan_moto_biyou/post/DXy78xYjFMA", "likes": 3, "velocity": 0.0, "ageHours": 2914.9, "postedAt": "2026-05-01T21:22:38+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3864961581343943305", "username": "akari_scalp_sleep", "text": "抜け毛、薄毛で悩む方へ。美容師歴18年の私が、頭皮を見続けて気づいたこと10選", "permalink": "https://www.threads.com/@akari_scalp_sleep/post/DWjGhSuiaqJ", "likes": 3, "velocity": 0.0, "ageHours": 3659.0, "postedAt": "2026-03-31T21:15:46+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3955149705345416087", "username": "salon_bluete", "text": "髪を明るくしたとたん、顔がぼやけて見えるようになった方。美容室の色が悪かったのではありません。髪は、顔のすぐ横にあるいちばん面積の大きい色です。ここを動かすと顔の印象がまるごと変わります。効いているのは、", "permalink": "https://www.threads.com/@salon_bluete/post/Dbjg7OkmruX", "likes": 3, "velocity": 0.0, "ageHours": 672.6, "postedAt": "2026-08-03T07:43:35+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3856276255931331587", "username": "ngmyuka", "text": "産後抜け毛もびびったけど、9ヶ月にして。頭皮のかゆみとフケ。、(汚、すいません💦)まじで聞いてない✋💫💫\nシャンプー薬用とかにしたら効果あるのかな。、？？😭\n頭皮で悩んだこととかないって✋。。、", "permalink": "https://www.threads.com/@ngmyuka/post/DWEPtLGj3QD", "likes": 3, "velocity": 0.0, "ageHours": 3946.6, "postedAt": "2026-03-19T21:39:34+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3940253102187818655", "username": "datsumo_science", "text": "★★脱毛初心者向け、その4★★\n\n「10回コース中残り2回。毎回あまり抜けずに普通に生えてきます。少し毛が柔らかくなって、生えるペース遅くなってきたけど、あと1回で本当に毛が減るのか不安です。」\n↑\nこれは手遅れ、", "permalink": "https://www.threads.com/@datsumo_science/post/Daul1HxCS6f", "likes": 3, "velocity": 0.0, "ageHours": 1165.9, "postedAt": "2026-07-13T18:26:34+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3884909349173334006", "username": "lily.bihouse", "text": "まっっっっっじで続けててよかったーーーーー\nと思ったアラサー続けててよかったNo1！！！！\n\nマツパのお姉さんに\n「何使ってます？まつ毛綺麗ですね」って言われたまつ毛美容液！！！", "permalink": "https://www.threads.com/@lily.bihouse/post/DXp-HhOEg_2", "likes": 3, "velocity": 0.0, "ageHours": 2998.5, "postedAt": "2026-04-28T09:48:25+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3972242964609224572", "username": "berrie_luby", "text": "韓国のオリーブヤングで人気って聞いて使ってみたんだけど、\nこれ、続けて使ってたら\n産毛っぽい短い毛がふわっと見えるようになってきた気がする。\nやっぱりこういう頭皮ケアは継続が大事かも。", "permalink": "https://www.threads.com/@berrie_luby/post/DcgPe4zE898", "likes": 3, "velocity": 0.03, "ageHours": 106.6, "postedAt": "2026-08-26T21:44:43+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3846028612298438514", "username": "0527_kumataro_1015", "text": "抜毛症ってどうしたら治るかしら", "permalink": "https://www.threads.com/@0527_kumataro_1015/post/DVf1qVQCXdy", "likes": 3, "velocity": 0.0, "ageHours": 4286.0, "postedAt": "2026-03-05T18:19:20+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3943821416273790778", "username": "ly.kaiq", "text": "｢たるみ毛穴が酷くなってきたんです…｣そう皮膚科の先生に話したんだけど｢スキンケアならペプチドが入ってるのがいいけどこのブースターが最強でしかもね…｣って", "permalink": "https://www.threads.com/@ly.kaiq/post/Da7RK7Ok8c6", "likes": 3, "velocity": 0.0, "ageHours": 1047.7, "postedAt": "2026-07-18T16:36:10+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3880031307468573493", "username": "noar_hairatelier", "text": "私が20代半ばで抜け毛で悩み、改善できた方法↓\n正直安心しました。", "permalink": "https://www.threads.com/@noar_hairatelier/post/DXYo-q3Dws1", "likes": 2, "velocity": 0.0, "ageHours": 3160.0, "postedAt": "2026-04-21T16:16:37+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3925082250320752128", "username": "kamonohasi.aga", "text": "怖い話。\n生え際が1cm後退したら、\n放置した証拠だ。\nちなみに\n\nただ、知らない奴が多くて、", "permalink": "https://www.threads.com/@kamonohasi.aga/post/DZ4sYK8jy4A", "likes": 2, "velocity": 0.0, "ageHours": 1668.2, "postedAt": "2026-06-22T20:04:48+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3955165887045281884", "username": "kirary_jewels", "text": "この程度で言わないほうが良いのかなと思いつつ、お金も払ったし…という気持ちで相談です\n\n昨日の夕方、初めての美容室へ行きました\nヘアカラーとヘアカット、トリートメント、ヘッドマッサージのコースで予約しました\n\n口コミがとても良かったので期待して行き、カットもマッサージも大満足で帰りました\n\nしかし、帰宅後に切ってもらった前髪を上げたところ、おでこの真ん中の生え際が染まっていないことに気が付きました\n（画像が見づらく申し訳ありません、恥ずかしいですが白髪画像付けました）\n\n細い毛なので染まりきらなかったのか、それとも塗り残しなのか、前髪は下ろすので多少染まらなくても問題視されないものなのか…？\n\n今日は美容室が休みで連絡が出来ない\u0026私は明日から義両親が泊まりに来るなど連日予定がびっしりで、そのためにも綺麗にしたくて、限られた時間の中で行ったのでどうしたら良いものか…\n\nこういった少しの白髪が残るのは致し方ないのでしょうか\nお店に連絡して、お盆明けなどに染めてもらうなどの対応はしていただけるものなのでしょうか？", "permalink": "https://www.threads.com/@kirary_jewels/post/Dbjkms9E6hc", "likes": 2, "velocity": 0.0, "ageHours": 672.0, "postedAt": "2026-08-03T08:15:37+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3961073548542286049", "username": "tsubasa.agataisaku", "text": "友人に撮ってもらった集合写真。\nいつもと違う角度から見た自分の生え際に、\n正直かなりゾッとした。\n\n「あれ、こんなに後退してたっけ」\n\nその日から今日まで、7年かかりました。\n\nこれから数回に分けて、\n薄毛に気づいてから今に至るまでの\nリアルな話をしていこうと思います。\n\n長くなるので、興味ある人だけ\nゆっくり読んでもらえたら嬉しいです🧵", "permalink": "https://www.threads.com/@tsubasa.agataisaku/post/Db4j2feDxjh", "likes": 2, "velocity": 0.0, "ageHours": 476.4, "postedAt": "2026-08-11T11:53:05+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3944620318039775049", "username": "non.biyouu", "text": "薄毛、気づいた時にはもう進んでる。これ、薄毛に悩んでる人にとって一番怖い現実。分け目が目立ってきた、つむじが透けて見える、抜け毛が増えた。そう感じ始めたら、今すぐ動いてほしい。", "permalink": "https://www.threads.com/@non.biyouu/post/Da-G0eejJdJ", "likes": 2, "velocity": 0.0, "ageHours": 1021.3, "postedAt": "2026-07-19T19:03:27+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3936585794424861571", "username": "o_dai_o_dai", "text": "40代入ってヤバいくらい髪が薄くなった人いる？\n「前髪が割れるようになった」「つむじが白く透ける」「過去最高にセットが決まらない」などなど...\n同じ人が多いから原因を話すね。", "permalink": "https://www.threads.com/@o_dai_o_dai/post/Dahj-xQivOD", "likes": 2, "velocity": 0.0, "ageHours": 1287.3, "postedAt": "2026-07-08T17:00:17+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3901094220890448589", "username": "usuge_cut_kurita", "text": "つむじハゲのカットはブロッキングがめちゃ大事！\n毛流れに合わせて切ったらこうならない。\n美容師はキレイにコーミングして切っちゃうから薄毛の人が切れない。", "permalink": "https://www.threads.com/@usuge_cut_kurita/post/DYjeIZngSLN", "likes": 2, "velocity": 0.0, "ageHours": 2462.6, "postedAt": "2026-05-20T17:44:52+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3929287258855961203", "username": "o_r_i__sa", "text": "朝アイロンしても、数十分したらうねり出し、すぐにこうなります。\n産後１年経っているので生えてきた毛が短い毛が内側にあります。\nそしておでこの生え際につむじが有り、立ち上がる癖があります。\n前髪を伸ばしてたのですが、産後の抜け毛からの伸びてきた毛が嫌過ぎて前髪を切ってしまい扱いがしづらくて悩んでます。\n前髪ストレートパーマかければ解消しますか？\nもし解決するならストレートパーマをかけたいのですが、\nつむじがある場合、立ち上がるのが強過ぎてストレートかけたら尚更立ち上がってしまいますか？\n朝にあまり自分に時間をかけたくないため、ストレートかけるか悩んでます。\n先月美容室行ったばかりだし、まだ産後でなかなか時間が取れないため美容室で質問もできず、もしスレッズでわかる方がいれば…と質問しています。\nよろしくお願いします。", "permalink": "https://www.threads.com/@o_r_i__sa/post/DaHofGUk_Jz", "likes": 2, "velocity": 0.0, "ageHours": 1529.0, "postedAt": "2026-06-28T15:19:24+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3916245030018163288", "username": "hairofseoul_jp", "text": "こちらは非切開植毛（FUE法）で3,200毛を移植し、1年後の経過を撮影したお写真です🌿\n\n元々の髪の流れに合わせ、違和感のない自然なヘアラインに仕上げました✨\n\n非切開は切らない手術のため、ダウンタイムも短く、施術後すぐの日常生活もOK！\n\nまた、出血や痛みも少なく、手術への負担も少ないので安心です😊\n\n負担の少ない非切開植毛で、自然なヘアラインを試してみませんか❓\n\n＃植毛 ＃自毛植毛 ＃薄毛 ＃つむじ ＃韓国アートメイク", "permalink": "https://www.threads.com/@hairofseoul_jp/post/DZZTBsLnyJY", "likes": 2, "velocity": 0.0, "ageHours": 1960.9, "postedAt": "2026-06-10T15:26:50+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3872563938756619916", "username": "akari_scalp_sleep", "text": "9割の人が知らない。髪がペタっとしてボリュームが出ないのは、脳のオーバーヒートが原因", "permalink": "https://www.threads.com/@akari_scalp_sleep/post/DW-HGJzk26M", "likes": 2, "velocity": 0.0, "ageHours": 3407.3, "postedAt": "2026-04-11T09:00:17+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3913273380674089271", "username": "kogao.aya.okayama", "text": "抜け毛が増えてきて、落ち武者感が増してきた。\n\n40代になってから、\n髪のボリュームが減った気がする。\n\n分け目は目立つし、\n鏡を見るたびに悲しい\n\nそれが解決できる唯一の方法が", "permalink": "https://www.threads.com/@kogao.aya.okayama/post/DZOvWgEEjE3", "likes": 2, "velocity": 0.0, "ageHours": 2059.3, "postedAt": "2026-06-06T13:02:41+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3958812231022379451", "username": "usuge_matome", "text": "妊娠中の女性が、パートナーのAGA治療薬に触れてしまったとき。\n慌てなくていい場合と、気をつけたい場合があります。", "permalink": "https://www.threads.com/@usuge_matome/post/Dbwhr_aj4G7", "likes": 2, "velocity": 0.0, "ageHours": 551.3, "postedAt": "2026-08-08T09:00:15+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3974368208588711256", "username": "masa.agabye", "text": "俺はM字ハゲでした\n\n20代後半、「ん？デコ広くなってね？」\nから俺の薄毛人生がスタート。\n\nそこから色々試した。アホみたいに金も使った。\n検索も死ぬほどした。そして普通に遠回りした。\n\n現在はAGA治療5年目。\n\nだからここでは昔の俺が知りたかったことを全部置いていく。\n\nAGAの知識も実際に試した薄毛対策も\n微妙だったものは微妙って言う。\n\n最近、生え際が怪しい。\nでも何すりゃいいか分からん。\n\nそんな奴はついてこい。\n俺が先に失敗しといたからな！！！", "permalink": "https://www.threads.com/@masa.agabye/post/DcnytQfiSVY", "likes": 2, "velocity": 0.06, "ageHours": 36.2, "postedAt": "2026-08-29T20:07:12+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3970431376109526883", "username": "chienom1", "text": "２１時前にアラームしといたらいいのかな🤔⏰\n\nhttps://x.com/aoringohuzin/status/2091678141618282520?s=12\u0026t=vO7HLec5pulgP197xt2AGA", "permalink": "https://www.threads.com/@chienom1/post/DcZzkziEt9j", "likes": 2, "velocity": 0.01, "ageHours": 166.6, "postedAt": "2026-08-24T09:45:25+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3921410368199582501", "username": "kazumi_counseling", "text": "「あっ、このサロンまた来たいな」と思わせるエステティシャンは、施術中の『会話』が全く違います。\n例えば、施術中にお客様とお話しする時。", "permalink": "https://www.threads.com/@kazumi_counseling/post/DZrpfQPEeMl", "likes": 2, "velocity": 0.0, "ageHours": 1789.8, "postedAt": "2026-06-17T18:29:25+09:00", "
