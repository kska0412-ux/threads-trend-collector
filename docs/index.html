": ["生え際 後退"]}, {"id": "3861938492158826093", "username": "dr.uchida_almo", "text": "【植毛 症例更新】\n20代男性｜生え際・M字1300グラフト アルモUn-SHAVEN法\n\n連日のモニター様検診です。\n\nM字部分を中心に、生え際への植毛を行いました。\n1年後、完成形です！\n\n＃植毛　＃自毛植毛　＃AGA　＃薄毛改善　＃アルモ形成クリニック", "permalink": "https://www.threads.com/@dr.uchida_almo/post/DWYXJjhiNZt", "likes": 2, "velocity": 0.0, "ageHours": 3759.1, "postedAt": "2026-03-27T17:10:33+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3950166167298058661", "username": "cureha38hena", "text": "【ヘッドスパ専門　cureha】\n\n新アイテムは髪の毛にも頭皮にも最高です！\n\nタカラベルモントの活泡泉さ\n大小の泡が髪の毛と頭皮の余分な皮脂を取り除き\n髪の毛の立ち上がりよくなり\n髪の毛がおさまりとてもよくなります\n\nシャワーヘッドにつけるだけで\n頭皮優しくマッサージできたり\nトルネードの刺激で頭皮の血行がよくなります\n\nハンドマッサージと新アイテムで\n最高のヘッドスパになりましたーー♡\n\n✏︎...........................................\n\n【ヘッドスパ専門 cureha】\n\n🗓️営業時間　10時〜17時\n😴定休日　日、月\n\n❣️1日1組限定（お一人様でもOKです）\n予約する時に1日1組限定ですので\n10時か11時の枠しか作っていませんので\nお気軽に予約したい時間と人数をご連絡下さい\n\n🏡隠れ家サロンですので女性限定になります\n\n⭐️オープン価格\nはじめてご来店のお客さま\n\\ヘッドスパ 20%OFF/\n\n炭酸ヘッドスパ\n8800円→7040円\n\n💠ご予約は公式LINEからどうぞ💠\n〜お気軽にご相談ください〜", "permalink": "https://www.threads.com/@cureha38hena/post/DbRzzNFkSml", "likes": 2, "velocity": 0.0, "ageHours": 837.6, "postedAt": "2026-07-27T10:42:06+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3950571132894708006", "username": "r_medical_toyama", "text": "たるみケアといえば、\n「ハイフやってました」が当たり前。\n今のたるみケアと言えば、あのデバイスよね。", "permalink": "https://www.threads.com/@r_medical_toyama/post/DbTP4OsGgEm", "likes": 2, "velocity": 0.0, "ageHours": 824.2, "postedAt": "2026-07-28T00:06:39+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3968963357319599630", "username": "squirrel.36662590", "text": "29歳です。\n25歳ごろからずっとほうれい線が気になってます。\nこのタイプのほうれい線をヒアルロン酸以外でどうにかする方法はありませんか？\nあと毛穴もやばいですよね…これでも月1でハーブしてます🥲\n何をしたらいいですか？😭", "permalink": "https://www.threads.com/@squirrel.36662590/post/DcUlyUfk5YO", "likes": 2, "velocity": 0.01, "ageHours": 215.2, "postedAt": "2026-08-22T09:08:43+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3951470877716228571", "username": "o_dai_o_dai", "text": "AGA治療の先生に言われた一言が、ずっと頭に残っている。\n「薄毛が進んでいる人は、抜け毛より先にここが変わります。よく見てみてください」\n先生が指さしたのは、意外な場所だった、、", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbWcdPWk6nb", "likes": 2, "velocity": 0.0, "ageHours": 794.4, "postedAt": "2026-07-29T05:54:17+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3969307297411179874", "username": "rainbow_star.100", "text": "か、髪が最近貧相になってきて、悩んでいる。セットも決まらない、、年には勝てないのか！？\n僕もここまでなのか！？\n\nFTMの薄毛治療の情報求む！！！！", "permalink": "https://www.threads.com/@rainbow_star.100/post/DcVz_TqjyVi", "likes": 2, "velocity": 0.01, "ageHours": 203.8, "postedAt": "2026-08-22T20:32:04+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3913974030869726607", "username": "efu.ikumou", "text": "育毛鍼で薄毛が改善\n「前髪が透けなくなりました！」\nやったことはたったの2つ！", "permalink": "https://www.threads.com/@efu.ikumou/post/DZROqTaGAWP", "likes": 1, "velocity": 0.0, "ageHours": 2036.1, "postedAt": "2026-06-07T12:14:45+09:00", "genres": ["薄毛", "育毛"], "keywords": ["薄毛 対策", "育毛剤"]}, {"id": "3966465529431640204", "username": "trinsachi", "text": "産後の抜け毛、本当に助けてください😭😭\n\n3人目にしてここまでの抜け毛は初めて😭\n想像してた産後の抜け毛レベルを完全に超えて、毎日数百本単位で抜けてます。\nもう本当に絶望してます😭\n\n床も布団も服も、子どものおもちゃも、\n家中どこもかしこも髪の毛だらけ。\n掃除しても掃除しても髪の毛が落ちてて、\n抜け毛を見るたびにイライラするし、メンタルが🥲\n\n生え際もどんどん薄くなってきて、前髪もほぼ消滅して\n鏡を見るたびに泣きそう😭\n\n産後の抜け毛を経験した方、\nいつ頃から落ち着きましたか？ちゃんと元に戻りましたか？😭\n\n「これやったらマシになった！」\n「これ飲んだ・食べた」\n「このシャンプーや育毛剤よかった」\n「何もしなくても○ヶ月で戻った」\n\n本当に何でもいいので教えてほしいです🙏🏻😭\nちゃんと髪が戻るっていう希望が欲しいです🥲\n\n経験談でも改善策でも何でもいいです。\n産後ハゲを経験した方、どうか知恵を貸してください😭🙏🏻\n\n#産後抜け毛 #産後ハゲ #抜け毛 #薄毛 #産後ママ #産後ケア #産後の悩み #育児ママ #ママさんと繋がりたい #先輩ママ教えて #産後抜け毛対策", "permalink": "https://www.threads.com/@trinsachi/post/DcLt2I_msiM", "likes": 1, "velocity": 0.0, "ageHours": 297.9, "postedAt": "2026-08-18T22:25:59+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3928401702374209631", "username": "kami_neesan_", "text": "【需要返信】分け目とつむじの薄毛、家でなんとかする方法をまとめてほしいてリクエストが多かったから本気で出すで。まず大前提：女の薄毛は男と根本的に違う。ここ間違えると一生遠回りするで。何がちゃうかっていうとな、", "permalink": "https://www.threads.com/@kami_neesan_/post/DaEfIjlDfhf", "likes": 1, "velocity": 0.0, "ageHours": 1558.3, "postedAt": "2026-06-27T09:59:59+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "つむじ 薄毛"]}, {"id": "3952942593289076435", "username": "o_dai_o_dai", "text": "髪が薄い人って、実は頭皮が悪い😭\nそう思って高級シャンプーや育毛剤を増やしがち。でも、前髪が割れる、つむじが透ける、短く細い毛が増えるなら、頭皮の汚れではなくAGAが進んでいる可能性があります。薄毛治療10年以上の俺も、商品に課金する前にこれを知りたかった。やることは💁こちら", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbbrFhSgb7T", "likes": 1, "velocity": 0.0, "ageHours": 745.7, "postedAt": "2026-07-31T06:38:19+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3883632420122207577", "username": "zero_xxcxx_", "text": "娘のヘアアレンジが難しすぎる😭\nくせ毛+薄毛ちゃん+つむじ後ろで前髪の境目も分からん😂\n\nいつもはちょんまげか後ろで二つ結びとかです、、\nどなたか…不器用にでもできる\n薄毛ちゃんのヘアアレンジ教えてくださーい💦\nもしよければお写真付きだと嬉しいです😭✨", "permalink": "https://www.threads.com/@zero_xxcxx_/post/DXlbxwXkyVZ", "likes": 1, "velocity": 0.0, "ageHours": 3040.8, "postedAt": "2026-04-26T15:31:23+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3932859251756872984", "username": "dr.mackerel", "text": "何回も言うけど、髪のボリュームをだしたいならこれ！", "permalink": "https://www.threads.com/@dr.mackerel/post/DaUUqb8k7UY", "likes": 1, "velocity": 0.0, "ageHours": 1410.7, "postedAt": "2026-07-03T13:36:19+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3973614916657324099", "username": "w_clinic_", "text": "大阪にある美容クリニックです👩‍⚕️\nオーダーメイドであなたに合ったたるみ改善したい方、", "permalink": "https://www.threads.com/@w_clinic_/post/DclHbatjaBD", "likes": 1, "velocity": 0.02, "ageHours": 61.1, "postedAt": "2026-08-28T19:10:32+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3924023011686638958", "username": "biyou_sake", "text": "たるみケアの順番\n\n🥉やめとけ\n・高い美顔器から始める（土台ノーケア）\n・顔だけ揉む（頭皮放置で逆戻り）\n・引き上げ塗り（靭帯を痛める）\n\n🥈無難\n・保湿を強化する（土台作りにはなる）\n・日焼け止め徹底（柱を折らせない）\n・表情筋を使う（衰え止め）\n\n🥇ナースが本気で勧める1番目は…", "permalink": "https://www.threads.com/@biyou_sake/post/DZ07iOGCmVu", "likes": 1, "velocity": 0.0, "ageHours": 1703.3, "postedAt": "2026-06-21T09:00:17+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3970029865513157880", "username": "hana_scalp_oyama", "text": "【栃木｜スカルプインク取材】\n\nprivate salon HANAは「小山市でスカルプインク専門サロン」として4月にopenいたしました⭐︎\n\nスカルプインクを、まだ知らない方にまず知ってもらいたい。そして、薄毛で悩んでいる方が『自分にもできることがある』と思えるきっかけになれば嬉しいです。\n\n気になる方は、ぜひ公式LINEまたはInstagramからお問合せください。\n\n💎サロン情報💎\nprivate salon HANA（ハナ）\n\nSCALP INK 頭皮タトゥー\n【国際認証ISO9001取得】\n@hana_scalp_oyama\n\n▶小山市八幡町\n（ご予約確定後詳細お送りします）\n*  090-5553-7001\n*  完全予約制\n*  JR小山駅から車で5分\n*  お問い合わせ・ご予約は【公式ライン】or 【お電話】で受付中！\n\n#栃木県薄毛サロン\n#スカルプインク\n#TV取材\n#小山駅 \n#AGA", "permalink": "https://www.threads.com/@hana_scalp_oyama/post/DcYYSDpmoT4", "likes": 1, "velocity": 0.01, "ageHours": 179.8, "postedAt": "2026-08-23T20:27:43+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3968537498436145408", "username": "hana_scalp_oyama", "text": "【栃木｜スカルプインクインクで小顔効果】\n\n「生え際、薄くなった？」\n実はこれ、髪が減っただけじゃない。\n\n生え際の“透け感”を\nスカルプインクで自然にカバー。\n\n近くで見ても不自然にならないように\n極小ドットで仕上げます。\n\n「髪型が決まらない…」\n「おでこが広く見える…」\nそんな悩みに。\n\n生え際が変わると、顔の印象も変わる。\n\n💎サロン情報💎\nprivate salon HANA（ハナ）\n\nSCALP INK 頭皮タトゥー\n【国際認証ISO9001取得】\n@hana_scalp_oyama\n\n▶小山市八幡町\n（ご予約確定後詳細お送りします）\n*  090-5553-7001\n*  完全予約制\n*  JR小山駅から車で5分\n*  お問い合わせ・ご予約は【公式ライン】or 【お電話】で受付中！\n\n#小顔効果\n#栃木薄毛\n#AGA\n#小山駅 \n#スカルプインク", "permalink": "https://www.threads.com/@hana_scalp_oyama/post/DcTE9QgGpEA", "likes": 1, "velocity": 0.0, "ageHours": 229.3, "postedAt": "2026-08-21T19:02:38+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3972775728214834711", "username": "coruli_scalp_ink", "text": "いつもパーマのお客さんが2回続けて、カットとヘッドスパ、なんでかって？スカルプインクで頭皮透けにくくなったから、違うところにメンテナンス☝️タトゥーの技術で毛根をかいてるの（まだ施術中）、パーマお休みした分、髪も薬剤の休憩でき次回しっかり根元から綺麗なパーマあてれるの☝️自然なボリューム感演出、髪型のように印象チェンジ、本サービスは発毛、育毛、治療を目的としたものではありません、タトゥー技術を応用した審美的なデザイン、医療行為ではなく美容目的の施術です。☝️効果には個人差あります☝️ちょっとしたお悩み、ちょっとの勇気でお気軽にカウセリングどうぞ#スカルプインク #天神橋筋六丁目", "permalink": "https://www.threads.com/@coruli_scalp_ink/post/DciInnkif4X", "likes": 1, "velocity": 0.01, "ageHours": 88.9, "postedAt": "2026-08-27T15:23:15+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3972957522554245862", "username": "calla.esthetic_relaxation", "text": ".\n\n💫HBL(ハリウッドブロウリフト)って？\n\n眉毛の毛流れそのものを整える、日本初の眉癖改善技術。\n\n•自分の眉毛でナチュラルに盛れる\n•細眉・薄眉もふっくら見せる\n•1回で「垢抜けたね」と言われる\n•メイク時間が半分になる\n•顔全体がリフトアップした印象に✨\n\n💡こんな人にこそ試してほしい！\n\n✔︎ 眉の形がいつも決まらない\n✔︎ 左右非対称が気になる\n✔︎ 毎朝メイクが面倒\n✔︎ 自分に似合う眉がわからない\n✔︎ 薄眉・細眉に悩んでいる\n✔︎アートメイクしたままで放置している\n\nご興味のある方は、お気軽にお問い合わせください😊❣️", "permalink": "https://www.threads.com/@calla.esthetic_relaxation/post/Dcix9Evj9Lm", "likes": 1, "velocity": 0.01, "ageHours": 82.9, "postedAt": "2026-08-27T21:24:25+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3974477987953202033", "username": "sbc_jun", "text": "糸リフトでこめかみ上の方から縦に入れて、\nカマキリみたいに不自然にリフトアップするのはアンチエイジング的には不向きです😭\n正しいリフトは、、、", "permalink": "https://www.threads.com/@sbc_jun/post/DcoLqwfj1Nx", "likes": 1, "velocity": 0.03, "ageHours": 32.6, "postedAt": "2026-08-29T23:45:19+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3967848997830335409", "username": "kamomi_rutea", "text": "最近、髪洗ったり乾かしたりしてる時の抜け毛がすごくてつらい🥲前髪が薄く後退してる気がする…。\n産後の抜け毛って、時間が経ったら治るものなのかこのままなの？何かいいヘアケアとかあれば知りたい🥲🥲", "permalink": "https://www.threads.com/@kamomi_rutea/post/DcQoaQWERux", "likes": 1, "velocity": 0.0, "ageHours": 252.1, "postedAt": "2026-08-20T20:14:41+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退", "髪 ボリューム"]}, {"id": "3973348963969364670", "username": "hears.mikami", "text": "いつも有難うございます。\n８月が終わり９月になります。\n９月のお休みカレンダーです。\n９／８日火曜は、TOＰmaster MODEの為臨時休業させて頂きます。２２日２３日の\n祝日も営業します。\nご予約お待ちしております。\n#人も髪も輝き続けるサロンドハーズ出雲、\n#出雲市プレミアム商品券加盟店サロンドハーズ、\n\n#髪質改善出雲市、\n＃カラーパーマ匂いしない店出雲、\n＃hears.jp、\n＃髪の薄毛対策出雲市、\n#上級着付け師出雲、\n\n＃ラ・カスタシステム、\n＃つむじ割れ薄毛ケア、\n＃骨格診断出雲市、\n＃復元フォースカット出雲市、\n＃パーソナルカラー診断出雲市、\n\n＃野草カラー、\n＃くせ毛改善カラー、\n＃髪を健康にするヘアーカラー、\n＃復元ドライヤープロ8販売店、\n#心結び詩人敏、", "permalink": "https://www.threads.com/@hears.mikami/post/DckK9S-D3K-", "likes": 1, "velocity": 0.01, "ageHours": 69.9, "postedAt": "2026-08-28T10:22:08+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3909019245481102830", "username": "emi_sangocare", "text": "現役助産師でも衝撃だった話する。産後3ヶ月のママ友から「抜け毛がすごすぎて排水溝が詰まる」って連絡がきて、夫（産婦人科医）に話したら「それ、止める方法を知らないまま過ごしてるから悪化してるだけだよ」って言われたんだけど、", "permalink": "https://www.threads.com/@emi_sangocare/post/DY_oEr7EQ3u", "likes": 1, "velocity": 0.0, "ageHours": 2200.1, "postedAt": "2026-05-31T16:10:28+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3974737667279696171", "username": "iyasheep.akashi", "text": "頭皮って、押した瞬間に音がしそうなくらい硬い人いるんですよね。\n\nさっきのお客様、こめかみのあたりが本当にカッチカチで、触った瞬間わたしのほうが「うわ」って声出そうになりました。5分ほぐしたら、耳の上がふにゃっと沈んだんです。\n\nその瞬間に寝息。あれが一番うれしいやつなんです。\n\n70分でここまで変わるんやから、頭皮って正直やなあと思いました✨", "permalink": "https://www.threads.com/@iyasheep.akashi/post/DcpGtltkjEr", "likes": 1, "velocity": 0.04, "ageHours": 24.0, "postedAt": "2026-08-30T08:21:20+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3925145149236346734", "username": "kami_neesan_", "text": "つむじの薄さは、本人が一番気づかへん。自分で見えへん後頭部から、更年期の薄毛は始まるんや。美容師に後ろ向きの鏡で「地肌見えてますね」言われた時、ワテ血の気引いた。見るべきは、", "permalink": "https://www.threads.com/@kami_neesan_/post/DZ46reIFH9u", "likes": 1, "velocity": 0.0, "ageHours": 1666.1, "postedAt": "2026-06-22T22:09:50+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3975078729919614933", "username": "mt__.s2", "text": "頭皮が💦\n\nアロベビー合わないのかな？😭", "permalink": "https://www.threads.com/@mt__.s2/post/DcqUQtDEc_V", "likes": 1, "velocity": 0.08, "ageHours": 12.7, "postedAt": "2026-08-30T19:38:53+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3974163225370041081", "username": "mii1030.kyoyuno", "text": "知り合いが今度オリヤン？？（韓国）に行って化粧品や、洗顔等、美容関係を買ってきてくれるらしいのですが\n無知すぎて全くわからず、、、アドバイスください！！\nニキビはできにくいが、顎下やなどにはごくたまにポツポツ白いぶつぶつできる程度で混合肌です。\n毛穴は気になります。全滅して欲しいです。\n\n詳しい方いませんか😌", "permalink": "https://www.threads.com/@mii1030.kyoyuno/post/DcnEGW_mhr5", "likes": 1, "velocity": 0.02, "ageHours": 43.0, "postedAt": "2026-08-29T13:19:56+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3955593690198135431", "username": "official_paramiclinic", "text": "額縮小術✨\n\n生え際を下げて額を狭くするお手術です。\n\n効果は即効性があり、額がとても広い場合にお勧めです🩵\n\nパラミの額縮小は傷跡からも毛が生える技術で傷跡を最小化✨\n\n額縮小10年以上のノウハウ✅", "permalink": "https://www.threads.com/@official_paramiclinic/post/DblF4DsCVKH", "likes": 1, "velocity": 0.0, "ageHours": 657.9, "postedAt": "2026-08-03T22:25:35+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3892337009905759167", "username": "sho_lask", "text": "ぶっちゃけます。AGAクリニックに駆け込むのは、一番最後でいいんです。\n「最近、生え際が後退してきた気がする……」\n「とにかく手っ取り早く薬で増やしたい！」\nその焦る気持ち、本当によくわかります。\nだけど、、、\n実は、体の中が「酸化」してボロボロなままだと、せっかく薬で髪を生やしても、砂上の楼閣のようにすぐ崩れてしまうんです。", "permalink": "https://www.threads.com/@sho_lask/post/DYEW-NVifO_", "likes": 0, "velocity": 0.0, "ageHours": 2752.5, "postedAt": "2026-05-08T15:45:51+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3968213940773803163", "username": "kana_ruana", "text": "生え癖やつむじ割れ、もう悩まなくても大丈夫！\n何故かというと、、、", "permalink": "https://www.threads.com/@kana_ruana/post/DcR7Y38k1Sb", "likes": 0, "velocity": 0.0, "ageHours": 240.0, "postedAt": "2026-08-21T08:19:46+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3974017261317395523", "username": "hair_nayami_koharu", "text": "ずっと後退していく一方だった生え際が、ある時期からそれ以上下がらなくなった気がしました。増えたとまでは言えない。でも、進む一方だったものが、", "permalink": "https://www.threads.com/@hair_nayami_koharu/post/Dcmi6TYGBRD", "likes": 0, "velocity": 0.0, "ageHours": 47.8, "postedAt": "2026-08-29T08:29:59+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3903277987902793975", "username": "tumuji_senpai", "text": "つむじが3年で2倍に広がって、ようやく気づいた。\n「ハゲる」より先に、必ず\"前兆\"が来てる。\n\n29歳でつむじ薄毛、3年で育毛剤8本・サプリ12種類試した俺。\n当時の写真を見返すと、見るべきサインは1年前から出てた。\n\n❌ 当時の俺が、見逃してたサイン\n・風呂上がり、洗面台の正面からしか鏡を見ない\n・ドライヤーで乾かしてる途中、地肌の見え方を直視しない\n・抜け毛の\"長さ\"を見てない（短い抜け毛は危険サイン）\n・つむじを\"写真\"じゃなく\"記憶\"で比較する\n\n⭕ 1年前の俺に教えたい、月1チェック↓", "permalink": "https://www.threads.com/@tumuji_senpai/post/DYrOqZIjCj3", "likes": 0, "velocity": 0.0, "ageHours": 2390.2, "postedAt": "2026-05-23T18:03:37+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3950870096793181195", "username": "o_dai_o_dai", "text": "何度でも言います。\n前髪・つむじの薄毛が気になる人が優先すべき\n遠回りしないAGA対策ランキングTOP10\n10位 頭皮に合うシャンプーを使う\n9位 タンパク質不足を避ける\n8位 睡眠時間を確保する\n7位 前髪とつむじを毎月撮影する\n6位 短く細い毛が増えていないか見る\n5位 個人輸入の治療薬を避ける\n4位 副作用を医師に相談できる環境を選ぶ\n3位 外用ミノキシジルで発毛を促す\n2位 フィナステリドで進行を抑える\n1位は、、、", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbUT2uhEhwL", "likes": 0, "velocity": 0.0, "ageHours": 814.3, "postedAt": "2026-07-28T10:00:39+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3879364627721967767", "username": "biyou_saki", "text": "髪が細くなってきた、ボリュームが出ない。\n\nそう感じてる人、まず頭皮の硬さを確認してみて。\n\nこれ、本当に大事なサインだから。", "permalink": "https://www.threads.com/@biyou_saki/post/DXWRZM9lViX", "likes": 0, "velocity": 0.0, "ageHours": 3182.1, "postedAt": "2026-04-20T18:12:07+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3933717331873430338", "username": "kami_neesan_", "text": "更年期に差し掛かった頃から急に髪のボリュームが減って、婦人科に相談したら意外なことを言われてな、", "permalink": "https://www.threads.com/@kami_neesan_/post/DaXXxJVHPtC", "likes": 0, "velocity": 0.0, "ageHours": 1382.3, "postedAt": "2026-07-04T18:01:12+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3880664592830219826", "username": "yuu41b", "text": "左　スキンケア始める前\n右　スキンケア始めて1カ月\n\n目の下のたるみが改善されてる🥹嬉しい🥹", "permalink": "https://www.threads.com/@yuu41b/post/DXa4-L0FMYy", "likes": 0, "velocity": 0.0, "ageHours": 3139.1, "postedAt": "2026-04-22T13:14:50+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3974469531758019583", "username": "keiko_biyou50", "text": "えええ！！！！先生それ言っていいのwww 更年期になってから生え際が薄くなってきて、本気で1万円の育毛剤買おうとしてたアラフィフの私。AGAクリニックの先生に相談したら、こっそり「メンズベーシックの育毛剤、3,680円ですけど1万円クラス並みに効果ありますよ」って！！！！いやいやいや！！！！それ先に知りたかったわwwww", "permalink": "https://www.threads.com/@keiko_biyou50/post/DcoJvtDDMP_", "likes": 0, "velocity": 0.0, "ageHours": 32.8, "postedAt": "2026-08-29T23:28:30+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3974254541223423288", "username": "ekimae_aga_clinic_okayama", "text": "今回は駅前AGAクリニック岡山院に通院中の患者様にインタビュー🎤しちゃいました💖✨\n\nご協力くださった患者様🥰本当にありがとうございました🙇‍♀️✨\nこれからも私達と一緒に楽しく頑張っていきましょうね✌️✨よろしくお願いします✨\n\n💁‍♀️髪の毛の事でお悩みの方はお一人で悩まず、まずは駅前AGAクリニック岡山院へお気軽にご相談ください😊\n初回カウンセリングは無料ですので、安心してご来院下さいませ💖\nお一人お一人に合った治療をご案内いたします🧑‍⚕️\n\n@ekimae_aga_clinic_okayama .\n#駅前AGAクリニック岡山院\n#美容男子 \n#薄毛治療\n#AGA\n#FAGA\n\n円形脱毛\n女性薄毛\n男性薄毛\n産後脱毛\nメソセラピー", "permalink": "https://www.threads.com/@ekimae_aga_clinic_okayama/post/DcnY3Lgmu04", "likes": 0, "velocity": 0.0, "ageHours": 40.0, "postedAt": "2026-08-29T16:21:24+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3974346177393984670", "username": "mayune_hb", "text": "ええええええええーーーー！！！！！！AGAクリニックの先生！！！！それ言ってええんかwwwww 薄毛気にし始めた旦那が「やっぱ1万円くらいする育毛剤じゃないとダメですか？」って聞いたら、先生がこっそり「いや、メンズベーシックの3,680円の育毛剤でも1万円クラス並みに効果ありますよ」って！！！！旦那から聞いた瞬間「はぁぁぁぁ！？！？！？」って声出たwww その値段差知ったら高い方買えんやろ！！！！", "permalink": "https://www.threads.com/@mayune_hb/post/DcntsqWAASe", "likes": 0, "velocity": 0.0, "ageHours": 36.9, "postedAt": "2026-08-29T19:23:25+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3973972036846605116", "username": "thecellclinic_official", "text": "薄毛の悩みあるけど、AGA治療はしていない方に聞いてみたいです。\n\n治療しない理由って、何ですか？🤔\n\n費用が高い？\n薬を飲み続けることへの抵抗？\n副作用が心配？\nクリニックに行くほどではない？\n何をしたらいいのかわからない？\nそれとも、効果があるのか半信半疑？\n\n「これだったら治療してみたい」もあれば、ぜひ聞いてみたいです。\n\nリアルな本音を教えてください🙏", "permalink": "https://www.threads.com/@thecellclinic_official/post/DcmYoMzk9M8", "likes": 0, "velocity": 0.0, "ageHours": 49.3, "postedAt": "2026-08-29T07:00:04+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3966822263450803124", "username": "efu.ikumou", "text": "「育毛剤の〇〇ップを半年使ったけど全く薄毛が改善しなかった」\n\nそんな人が半年間、eFu式育毛鍼を続けたら、\n\n「髪セットした時に髪の毛がスカスカにならず良い感じになるようになりました✨️」\n\nこんな嬉しいコメントをいただきました😄\n\n何をしたかというと、", "permalink": "https://www.threads.com/@efu.ikumou/post/DcM-9TcGJu0", "likes": 0, "velocity": 0.0, "ageHours": 286.1, "postedAt": "2026-08-19T10:14:45+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3924158423709631025", "username": "kamonohasi.aga", "text": "怖い話。\n育毛剤を1年続けた奴に\n言いにくいことを言う。", "permalink": "https://www.threads.com/@kamonohasi.aga/post/DZ1aUuXkcIx", "likes": 0, "velocity": 0.0, "ageHours": 1698.8, "postedAt": "2026-06-21T13:29:19+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3937975966329069544", "username": "suncy_salon", "text": "「抜け毛が1日何本以上だったら異常ですか？」\n\nよく聞かれる質問です。\n\n正直に言うと、\n本数よりも「抜けた毛の状態」の方が\n大事なことが多いです。", "permalink": "https://www.threads.com/@suncy_salon/post/DamgEbvEd_o", "likes": 0, "velocity": 0.0, "ageHours": 1241.3, "postedAt": "2026-07-10T15:02:51+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3949814384932127005", "username": "kami_neesan_", "text": "夜、美容室の帰りにバス停で信号待ちしとったら、隣に立っとった女性が風でうねりが広がった前髪を気にしながら、鞄から小さいボトルを取り出して指先に少しだけ乗せとってん。何しとるんか気になって見てたら、", "permalink": "https://www.threads.com/@kami_neesan_/post/DbQj0GOm4Ed", "likes": 0, "velocity": 0.0, "ageHours": 849.3, "postedAt": "2026-07-26T23:03:11+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3948949794860951618", "username": "withglint_ikumou.aga", "text": "「最近、抜け毛が増えた気がする…」\n「分け目やつむじが目立ってきたかも。」\n「髪のボリュームが以前より少なくなった気がする。」\n\nそんな変化を感じたら、早めのケアがおすすめです。\n\n当店では、医師監修の育毛成分を使用し、お客様一人ひとりの頭皮状態やお悩みに合わせた施術をご提供しています。\n\n施術前には丁寧なカウンセリングと頭皮チェックを行い、現在の頭皮環境をしっかり確認。一人ひとりに合わせた施術をご提案し、理想の髪を目指してサポートいたします。\n\n完全予約制のため、人目を気にせずリラックスしてお過ごしいただける空間をご用意。育毛サロンが初めての方でも、安心して施術を受けていただけます！\n\n初回体験は5,000円。\n\n「いつか始めよう」ではなく、「気になった今」がケアを始めるタイミングです。\n\n未来の髪のために、あなたに合った育毛ケアを始めてみませんか？✨\n#名古屋育毛 #名古屋育毛サロン #伏見育毛 #伏見育毛サロン #伏見AGA #名古屋AGA #AGA対策", "permalink": "https://www.threads.com/@withglint_ikumou.aga/post/DbNfOp-iehC", "likes": 0, "velocity": 0.0, "ageHours": 877.9, "postedAt": "2026-07-25T18:25:21+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3930886167496140908", "username": "hana_scalp_oyama", "text": "【宇都宮でつむじの薄毛が気になる方】\n\n「分け目が広がってきた…」\n「頭頂部の透け感が気になる…」\nそんなお悩みはありませんか？\n\nスカルプインクは、頭皮に自然な陰影をつくることで、髪が増えたような印象へ導く施術です。\n\n✔ 女性の分け目\n✔ 頭頂部の薄毛\n✔ つむじの透け感\n\n「薬は続けたくない」\n「ウィッグには抵抗がある」\nそんな方にも選ばれています。\n\n当サロンには宇都宮からも多くのお客様にご来店いただいています。\n\nまずはお気軽にDM・LINEからご相談ください😊\n\n#栃木薄毛\n#宇都宮美容\n#宇都宮薄毛\n#つむじハゲ\n#スカルプインク", "permalink": "https://www.threads.com/@hana_scalp_oyama/post/DaNUCSCGqhs", "likes": 0, "velocity": 0.0, "ageHours": 1476.0, "postedAt": "2026-06-30T20:16:09+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3948122023154810064", "username": "o_dai_o_dai", "text": "ちょっとエロい話します｡\n薄毛治療10年以上の俺が気づいたんですけど、抜け毛って一括りにされがちだけど、実はAGAと一時的な脱毛では原因が全然違う｡AGAは前髪やつむじの毛が少しずつ細く短くなるのに対して、休止期脱毛は発熱、強いストレス、急激な減量などの後に、頭全体から急に抜けることがあります｡だから、育毛剤を頑張ってもなかなか変わらない場合は、", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbKjA_gCfzQ", "likes": 0, "velocity": 0.0, "ageHours": 905.3, "postedAt": "2026-07-24T15:00:43+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3915685699513177489", "username": "tachibana_wakahage", "text": "AGAの原因は、\nただの「老化」ではありません。\n\n体内の「5αリダクターゼ」\nという酵素が男性ホルモンと結びつき、\n\n髪の成長期をガクンと\n短くしてしまうのが主なメカニズム\n\nつまり、髪が太く育つ前に\n抜け落ちてしまう状態ということ。\n\nここにストレスや睡眠不足が重なると\nさらに拍車がかかることも。\n\n遺伝の要素もありますが、\n\n日々の生活習慣や適切な頭皮ケアで\nアプローチできることはたくさんあります。\n\n「あれ？」と思ったら、\n早めの対策をするのがおすすめです。", "permalink": "https://www.threads.com/@tachibana_wakahage/post/DZXT2XDj1WR", "likes": 0, "velocity": 0.0, "ageHours": 1979.4, "postedAt": "2026-06-09T20:55:32+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3974727200300699015", "username": "wakistyle_health", "text": "洗面台とかお風呂で髪の毛が落ちてると、\n\n「抜け毛が増えたのかな？」\n\nって気になりますよね。\n\nでも、考えてみれば当たり前なんですけど、\n\n根元から抜けた毛と、途中で切れた毛って同じじゃないんですよね。\n\n気になってる時って、落ちてる髪を見て「抜け毛が増えたのかも」って思うこともありますよね。\n\nまず「何を見て抜け毛が増えたと思ったんだろう？」ってところを、分けて考えた方がよさそうです。", "permalink": "https://www.threads.com/@wakistyle_health/post/DcpEVRlAY2H", "likes": 0, "velocity": 0.0, "ageHours": 24.3, "postedAt": "2026-08-30T08:00:27+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3952302095530101822", "username": "sana_oniku", "text": "夕方のぺたんこ髪が悩みで無印のヘアエッセンスを使ってみたら、ふわっとして良かったです。母も気に入って一緒に愛用中…。皆さんは髪のボリューム対策、何かおすすめありますか？💋", "permalink": "https://www.threads.com/@sana_oniku/post/DbZZdDRGow-", "likes": 0, "velocity": 0.0, "ageHours": 766.9, "postedAt": "2026-07-30T09:25:51+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3972461052822753571", "username": "sukinamo_no713", "text": "40代になって、少しずつ自分を大事にするようになった。\n30代は子育てと仕事で毎日いっぱいいっぱい。自分のことはいつも後回し🥺\nでも40代になって、子どもも少し手が離れて。\n美容やファッション、健康のことを考える時間が久々に楽しくなってきた♡\nちゃんとお手入れしてあげると、\n少しずつだけど自分が磨かれていく感じがして🤏\n髪も肌も、健康でキレイにしておくと\nそれだけで自分の気分が上がるんだよね☺️\n‥とはいえ、私は根っからのズボラ😂\nだから「頑張りすぎずにキレイになれるもの」が好き。\n最近のお気に入りは、リファのブラシ♡\n髪をとかすだけじゃなくて、\n頭皮をほぐすような感覚も気持ちよくて、\n毎日のブラッシングがちょっとした癒しになってる🌿\nこういう「使ってよかった♡」を\n愛用品や気になっているものは楽天ROOMにまとめています🫶\n気になるものがあれば、ROOMから見てみてください♡\n\n#40代主婦 #40代美容 #40代自分磨き #ズボラ美容 #美容好き #大人美容 #ヘアケア #美髪ケア #楽天ROOM #楽天アフィリエイト\nhttps://a.r10.to/hPCif6", "permalink": "https://www.threads.com/@sukinamo_no713/post/DchBEfRkxEj", "likes": 0, "velocity": 0.0, "ageHours": 99.3, "postedAt": "2026-08-27T04:58:01+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3937437301413544226", "username": "kami_neesan_", "text": "ショックで言葉が出なかった。「更年期の抜け毛は歳のせいやから仕方ない」って思って、特に対策せず諦めてた。鏡を見るたび気が重いし、抜け毛の量にもため息つくし。たまたまスポーツトレーナーをしてる友人に会う機会があって話したら、言われたのがまさかの一言で、", "permalink": "https://www.threads.com/@kami_neesan_/post/Dakll08IIEi", "likes": 0, "velocity": 0.0, "ageHours": 1259.1, "postedAt": "2026-07-09T21:12:11+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3867729936462713345", "username": "esthetics911_yokohama", "text": "当サロンは2回目からは決まった間隔でご来店頂き\n改善させるためにコースで通って頂いておりますが、\n年齢に合わせたケアをしております。\nこの方はたるみが気になるということで\nドライヘットスパと高周波でCETとRETでケア。\n10分で引き上がりました。血色も良くなります。", "permalink": "https://www.threads.com/@esthetics911_yokohama/post/DWs7-KWARIB", "likes": 0, "velocity": 0.0, "ageHours": 3567.4, "postedAt": "2026-04-04T16:55:59+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3935784638279002401", "username": "mizuki.c5", "text": "インナードライ混合肌(鼻、頬にテカリ)\n赤み\nニキビ\n毛穴\n\nこの悩みを伝えてチャッピーにスキンケアのアドバイス出してもらったら「乳液をこれに変えてみて！」って言われて試して1週間。\nとりあえず1ヶ月は様子見るけどどうなんだろう？\n美容に詳しい方ならどうすか教えてほしい！", "permalink": "https://www.threads.com/@mizuki.c5/post/Daet0adDykh", "likes": 0, "velocity": 0.0, "ageHours": 1313.8, "postedAt": "2026-07-07T14:28:32+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3963554961752606702", "username": "watanabeseitai", "text": "「睡眠時間は足りているのに、疲れやだるさが抜けない…」\n\nその不調、骨格や筋肉の問題ではなく【体質・栄養・ホルモンバランス】といった身体の内側に原因があるかもしれません。\n当院では手技による施術にとどまらず、身体の内側からもお悩みを解決できるよう、スマホで医師に相談できる「シェアクリニック東京」と提携を開始しました。\n・ダイエットの成果が出にくい\n・髪のボリュームや肌荒れが気になる\n・理由のない体の重さやホルモンの乱れ", "permalink": "https://www.threads.com/@watanabeseitai/post/DcBYDznAEfu", "likes": 0, "velocity": 0.0, "ageHours": 394.3, "postedAt": "2026-08-14T22:03:12+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3973737421598208889", "username": "coruli_scalp_ink", "text": "４０代女性スカルプインク1回目7日後グレイカラーでご来店、頭皮上空✈️髪質硬め毛量多め　動機理由→毎日同じ分け目だったのでその分け目が薄毛に見える　良く質問されますがスカルプインク施術後1週間後くらい←個人差ありますがヘアカラー可能です😊なのでそんなにカラータイミングご心配ないですよ☝️本施術は医療行為ではありません。本サービスは発毛、育毛、治療を目的としたものではありません、自然なボリューム感を演出、髪型のように印象チェンジ、タトゥー技術を応用した審美的なデザイン、医療行為ではなく美容目的の施術です、☝️効果には個人差あります#スカルプインク #大阪市北区", "permalink": "https://www.threads.com/@coruli_scalp_ink/post/DcljSGVCbN5", "likes": 0, "velocity": 0.0, "ageHours": 57.1, "postedAt": "2026-08-28T23:13:58+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3975126110640642687", "username": "mio__beauty__", "text": "私42歳で白髪が一本もないんだだけど、これを使ってきたのが大きいと思ってる。紗栄子さんやMEGUMIさんも愛用ってバズってたケンザン。美髪と小顔だけじゃない。頭皮ケアって、日々の少しずつの積み重ねが未来の自分を変えると思ってる。", "permalink": "https://www.threads.com/@mio__beauty__/post/DcqfCLyHZp_", "likes": 0, "velocity": 0.0, "ageHours": 11.1, "postedAt": "2026-08-30T21:13:01+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3974999694250814129", "username": "retreathari", "text": "むくみ顔とお別れ！10年前の自分に戻る魔法のリフトアップ術\n\n毎日鏡を見るたびに、「なんだか顔がすっきりしない」「朝のむくみが夕方になっても取れない」と感じていま…...\n\nhttps://sns.retreathari.jp/%e3%82%80%e3%81%8f%e3%81%bf%e9%a1%94%e3%81%a8%e3%81%8a%e5%88%a5%e3%82%8c%ef%bc%8110%e5%b9%b4%e5%89%8d%e3%81%ae%e8%87%aa%e5%88%86%e3%81%ab%e6%88%bb%e3%82%8b%e9%ad%94%e6%b3%95%e3%81%ae%e3%83%aa%e3%83%95/", "permalink": "https://www.threads.com/@retreathari/post/DcqCSlWGyqx", "likes": 0, "velocity": 0.0, "ageHours": 15.3, "postedAt": "2026-08-30T17:02:03+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3975116903043769015", "username": "kyon1228.har", "text": "みんな「ぶす」「ばばあ」と言われた事件が1年半前におこったんだけど、(意味わからなくてOK)\nその時、ある人をマスク外しても「綺麗」とみんなが言ったそのある人。\nわたしすっごい期待していたんだけど、\n外した瞬間唖然としたわ！\n鼻が顔から飛び出すデカさだし、口元飛び出し半開きの口ゴボだし、顎がない。ほうれい線やばくない？\nなにそれ！わざとみんな言ったん？\nだって、どこをどう見たら「綺麗」なのよ？\nあーびっくり！あーがっかり！", "permalink": "https://www.threads.com/@kyon1228.har/post/Dcqc8MikyK3", "likes": 0, "velocity": 0.0, "ageHours": 11.4, "postedAt": "2026-08-30T20:54:43+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3975421621938587376", "username": "ikuta2323", "text": "2年前まではAGAガイドラインでも推奨度Aのミノキシジル外用（塗りミノ）を使っていました！ \n\n 内服薬のフィナステリドとミノキシジルの副作用が怖い人には良い選択肢ですよね！ \n\nただし、発毛剤の説明書や注意書きにもあるように、半年以上継続しても効果を実感できない場合は、他の薄毛対策への切り替えも検討ですね😅", "permalink": "https://www.threads.com/@ikuta2323/post/DcriOcIDobw", "likes": 0, "velocity": 0.0, "ageHours": 1.3, "postedAt": "2026-08-31T07:00:08+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3975408092028596757", "username": "scalp.ink.rui.osaka.city", "text": "はじめまして✨\n大阪市生野区「今里」ディープな街…🌇\n看護師による安心安全な施術を🪄\n\n頭皮タトゥー🆗治療ではない魅せる技術✨\n\n薄毛、傷痕、円形脱毛症などなど…頭皮タトゥーでお悩み軽減できます！\n\n失敗ないスカルプインク最高ですよっ！！\n\n眉毛、アイラインタトゥーも🆗✨症例たくさんあるので良かったら覗いてください✨\n\nたぶん今里近隣では当店だけ！！\n当日も空きあれば🉑夜も可能🉑夜得🉐\n特に夜は比較的ご案内しやすいです✨\nぜひご縁がありますように✨\n@scalp.ink.rui.osaka.city \n症例もあり！無料カウンセリングも\nあります✨ぜひフォローよろしく\nお願いします🤲", "permalink": "https://www.threads.com/@scalp.ink.rui.osaka.city/post/DcrfJjak_IV", "likes": 0, "velocity": 0.0, "ageHours": 1.8, "postedAt": "2026-08-31T06:33:16+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3975391820032938688", "username": "o_dai_o_dai", "text": "もう言い切るよ。\nAGAは、抜け毛が増えてから始まるとは限らない。\nそれより先に見てほしい場所が、頭に3か所ある、、", "permalink": "https://www.threads.com/@o_dai_o_dai/post/Dcrbcw8DpLA", "likes": 0, "velocity": 0.0, "ageHours": 2.3, "postedAt": "2026-08-31T06:00:56+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}]</script>

<script id="summary-data" type="application/json">{"total": 417, "archived": 646, "genres": [["フェイシャル", 167], ["薄毛", 163], ["育毛", 110]], "over1000": 19, "thisWeek": 43, "authors": 352, "updatedAt": "2026-08-31 08:18"}</script>
<script>
(function () {
  var readJSON = function (id) { return JSON.parse(document.getElementById(id).textContent); };
  var POSTS = readJSON('data');
  var GENRES = readJSON('genre-list');
  var KEYWORDS = readJSON('keyword-list');
  var SUMMARY = readJSON('summary-data');
  var RISING = 0.86;   // 伸び率の上位10%にあたる値

  var activeGenres = new Set();
  var els = {
    sort: document.getElementById('sort'),
    period: document.getElementById('period'),
    keyword: document.getElementById('keyword'),
    q: document.getElementById('q'),
    genres: document.getElementById('genres'),
    list: document.getElementById('list'),
    count: document.getElementById('count'),
    summary: document.getElementById('summary'),
    breakdown: document.getElementById('breakdown')
  };

  function mk(tag, cls, text) {
    var el = document.createElement(tag);
    if (cls) el.className = cls;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  // 文節を1かたまりとして置く。途中で改行されないので、
  // 「を」「と」などの助詞が行頭に来ることがなくなる。
  function phrases(parent, list) {
    list.forEach(function (t) { parent.appendChild(mk('span', 'nb', t)); });
    return parent;
  }

  // --- 集計 ---
  // タイルは必ず4枚。ジャンルはここに混ぜず、下の棒グラフで見せる。
  (function renderSummary() {
    var tiles = [
      ['表示中の投稿', SUMMARY.total, '件'],
      ['直近7日の投稿', SUMMARY.thisWeek, '件'],
      ['1000いいね超え', SUMMARY.over1000, '件'],
      ['投稿者', SUMMARY.authors, '人']
    ];
    tiles.forEach(function (t) {
      var box = mk('div', 'stat');
      box.appendChild(mk('span', 'stat-label', t[0]));
      var v = mk('div', 'stat-value', t[1].toLocaleString());
      v.appendChild(mk('span', 'unit', t[2]));
      box.appendChild(v);
      els.summary.appendChild(box);
    });
  })();

  // --- ジャンル別の内訳 ---
  // 棒の長さは最多ジャンルを100%とした相対値。1つの投稿が複数ジャンルに
  // 入ることがあり、合計が総数と一致しないため、全体に対する割合としては見せない。
  (function renderBreakdown() {
    if (!SUMMARY.genres.length) { els.breakdown.remove(); return; }

    els.breakdown.appendChild(mk('p', 'breakdown-title', 'ジャンル別'));
    var max = SUMMARY.genres.reduce(function (m, p) { return Math.max(m, p[1]); }, 0);

    SUMMARY.genres.forEach(function (pair) {
      var row = mk('div', 'bar-row');
      row.appendChild(mk('span', 'bar-name', pair[0]));

      var track = mk('div', 'bar-track');
      var fill = mk('div', 'bar-fill');
      fill.style.width = (max > 0 ? (pair[1] / max) * 100 : 0) + '%';
      track.appendChild(fill);
      row.appendChild(track);

      row.appendChild(mk('span', 'bar-count', pair[1].toLocaleString() + ' 件'));
      els.breakdown.appendChild(row);
    });
  })();

  // 何件のうち何件を見ているのかを明示する。
  // 「最終収集」は実際に収集した時刻。HTMLを作り直しただけでは進まない。
  (function renderStamp() {
    var stamp = document.getElementById('stamp');
    var collectedAt = SUMMARY.updatedAt || '2026-08-31 08:18';
    var units = ['最終収集 ' + collectedAt];
    if (SUMMARY.archived > SUMMARY.total) {
      units.push('　/　蓄積 ' + SUMMARY.archived.toLocaleString() + ' 件のうち ');
      units.push(SUMMARY.total.toLocaleString() + ' 件を表示');
    }
    phrases(stamp, units);
  })();

  KEYWORDS.forEach(function (k) {
    var o = document.createElement('option');
    o.value = k; o.textContent = 'キーワード: ' + k;
    els.keyword.appendChild(o);
  });

  GENRES.forEach(function (g) {
    var b = mk('span', 'chip', g);
    b.tabIndex = 0;
    var toggle = function () {
      if (activeGenres.has(g)) { activeGenres.delete(g); b.classList.remove('on'); }
      else { activeGenres.add(g); b.classList.add('on'); }
      render();
    };
    b.addEventListener('click', toggle);
    b.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
    els.genres.appendChild(b);
  });

  function fmtAge(h) {
    if (h === null || h === undefined) return '不明';
    if (h < 24) return Math.round(h) + '時間前';
    return Math.round(h / 24) + '日前';
  }

  function filtered() {
    var days = parseInt(els.period.value, 10);
    var kw = els.keyword.value;
    var q = els.q.value.trim().toLowerCase();

    return POSTS.filter(function (p) {
      if (days > 0) {
        if (p.ageHours === null || p.ageHours > days * 24) return false;
      }
      if (kw && p.keywords.indexOf(kw) === -1) return false;
      if (activeGenres.size > 0) {
        var hit = p.genres.some(function (g) { return activeGenres.has(g); });
        if (!hit) return false;
      }
      if (q) {
        var hay = (p.text + ' ' + p.username).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function sorted(rows) {
    var mode = els.sort.value;
    var copy = rows.slice();
    if (mode === 'likes') copy.sort(function (a, b) { return b.likes - a.likes; });
    else if (mode === 'newest') copy.sort(function (a, b) {
      var av = a.ageHours === null ? Infinity : a.ageHours;
      var bv = b.ageHours === null ? Infinity : b.ageHours;
      return av - bv;
    });
    else copy.sort(function (a, b) { return b.velocity - a.velocity; });
    return copy;
  }

  function render() {
    var rows = sorted(filtered());
    els.count.textContent = rows.length + ' 件を表示';
    els.list.textContent = '';

    if (rows.length === 0) {
      // 「絞り込みを」を1かたまりにして、「を」が行頭に来ないようにする
      els.list.appendChild(phrases(mk('div', 'empty'), [
        '条件に合う投稿が', 'ありません。', '絞り込みを', '緩めてください。'
      ]));
      return;
    }

    var frag = document.createDocumentFragment();
    rows.forEach(function (p, i) {
      var isRising = p.velocity >= RISING;
      var card = mk('div', 'card' + (isRising ? ' rising' : ''));

      var head = mk('div', 'card-head');
      head.appendChild(mk('span', 'rank', String(i + 1)));
      head.appendChild(mk('span', 'user', '@' + p.username));
      if (isRising) head.appendChild(mk('span', 'badge', '伸び中'));

      var stats = mk('div', 'stats');
      stats.appendChild(mk('span', 'likes', p.likes.toLocaleString() + ' likes'));
      stats.appendChild(mk('span', 'vel', p.velocity.toFixed(1) + '/h'));
      stats.appendChild(mk('span', 'age', fmtAge(p.ageHours)));
      head.appendChild(stats);
      card.appendChild(head);

      card.appendChild(mk('p', 'text', p.text));

      var tags = mk('div', 'tags');
      p.genres.concat(p.keywords).forEach(function (t) {
        tags.appendChild(mk('span', 'tag', t));
      });
      if (p.permalink) {
        var a = mk('a', 'link', '元投稿を開く →');
        a.href = p.permalink;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        tags.appendChild(a);
      }
      card.appendChild(tags);
      frag.appendChild(card);
    });
    els.list.appendChild(frag);
  }

  [els.sort, els.period, els.keyword].forEach(function (el) {
    el.addEventListener('change', render);
  });
  els.q.addEventListener('input', render);

  render();
})();
</script>
