<style>
  /* 明るい側を基準に全トークンを定義する。暗い側は下で上書きする。 */
  :root {
    --bg: #f6f4f5;
    --surface: #ffffff;
    --surface-2: #fbf9fa;
    --ink: #231c22;
    --muted: #6f636c;
    --border: #e4dee2;
    --accent: #8b2f5f;
    --accent-soft: #f7e9f0;
    --rising: #0f7b6c;
    --rising-soft: #e2f2ef;
    --chip: #efeaed;
    --focus: #8b2f5f;
  }
  /* OS が暗いとき。ただし閲覧者が明るいテーマを選んでいたらそちらを優先する。 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151114;
      --surface: #1f1a1e;
      --surface-2: #241e23;
      --ink: #f0eaee;
      --muted: #a3969e;
      --border: #332b31;
      --accent: #e086b0;
      --accent-soft: #3a2130;
      --rising: #4fc3ae;
      --rising-soft: #16332e;
      --chip: #2c2429;
      --focus: #e086b0;
    }
  }
  /* 閲覧者が暗いテーマを選んだとき。OS の設定に関係なく効かせる。 */
  :root[data-theme="dark"] {
    --bg: #151114;
    --surface: #1f1a1e;
    --surface-2: #241e23;
    --ink: #f0eaee;
    --muted: #a3969e;
    --border: #332b31;
    --accent: #e086b0;
    --accent-soft: #3a2130;
    --rising: #4fc3ae;
    --rising-soft: #16332e;
    --chip: #2c2429;
    --focus: #e086b0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    /* 透明のままだと閲覧側の地の色を借りてしまうので必ず塗る */
    background: var(--bg);
    color: var(--ink);
    /* 日本語本文はWebフォントを落とすと重いので、端末のフォントを使う */
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
                 -apple-system, BlinkMacSystemFont, "Yu Gothic Medium", sans-serif;
    line-height: 1.75;
    font-feature-settings: "palt" 1;
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
  }

  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px 96px; }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* --- 見出し --- */
  h1 {
    font-family: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-weight: 900;
    font-size: clamp(1.5rem, 4vw, 2.1rem);
    line-height: 1.35;
    letter-spacing: .01em;
    margin: 0;
    text-wrap: balance;
  }
  /* 対象ジャンルの但し書き。名前より一段弱く見せる */
  .ver {
    display: block;
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-weight: 400;
    font-size: .74rem;
    letter-spacing: .02em;
    color: var(--muted);
    margin-top: 6px;
  }

  /* --- 集計サマリ：詳細より先に全体像を出す --- */
  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin: 28px 0 8px;
  }
  .stat { background: var(--surface); padding: 14px 16px; }
  .stat-label {
    font-size: .7rem; color: var(--muted); letter-spacing: .06em;
    display: block; margin-bottom: 4px;
    /* 「表示中/の投稿」のように助詞で割れないよう、まとめて扱う */
    white-space: nowrap;
  }
  .stat-value {
    white-space: nowrap;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: 1.25rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .stat-value .unit { font-size: .72rem; font-weight: 400; color: var(--muted); margin-left: 3px; }
  .stamp {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .7rem; color: var(--muted); margin: 0 0 26px;
  }

  /* --- 操作バー --- */
  .controls {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: 12px 0 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row + .row { margin-top: 8px; }
  select, input[type=search] {
    font: inherit; font-size: .82rem;
    padding: 7px 11px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    color: var(--ink);
  }
  input[type=search] { flex: 1; min-width: 180px; }
  .chip {
    font-size: .78rem; padding: 5px 13px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on {

    color: var(--accent); font-weight: 700;
  }
  .count {
    white-space: nowrap;
    font-family: "Roboto Mono", ui-monospace, monospace;
    color: var(--muted); font-size: .76rem; margin-bottom: 14px;
    font-variant-numeric: tabular-nums;
  }

  /* --- カード --- */
  #list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid transparent;
    border-radius: 10px;
    padding: 16px 18px;
  }
  /* 伸びが速い投稿は左端の色で一目で分かるようにする */
  .card.rising { border-left-color: var(--rising); background: var(--surface-2); }

  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 9px; }
  .rank {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; color: var(--muted);
    font-variant-numeric: tabular-nums; min-width: 2.4em;
  }
  .user { font-weight: 700; font-size: .86rem; }
  .badge {
    white-space: nowrap;
    font-size: .66rem; font-weight: 700; letter-spacing: .04em;
    padding: 2px 8px; border-radius: 999px;
    background: var(--rising-soft); color: var(--rising);
  }
  .stats {
    margin-left: auto; display: flex; gap: 11px;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; font-variant-numeric: tabular-nums;
  }
  .likes { color: var(--accent); font-weight: 700; }
  .vel { color: var(--rising); font-weight: 500; }
  .age { color: var(--muted); }

  .text {
    white-space: pre-wrap;
    /* word-break: break-word は単語の途中で割るので使わない。
       overflow-wrap なら、1語が行に収まらないときだけ割る。
       line-break: strict で日本語の禁則処理を厳しい方に寄せる。 */
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
    font-size: .92rem; margin: 0 0 12px;
  }

  /* 文節のかたまり。ここで囲った範囲は途中で改行されない。
     「を」「と」などの助詞が行頭に来るのを防ぐために使う。 */
  .nb { white-space: nowrap; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag {
    white-space: nowrap;
    font-size: .7rem; padding: 3px 9px; border-radius: 4px;
    background: var(--chip); color: var(--muted);
  }
  .link {
    margin-left: auto; font-size: .76rem; color: var(--accent);
    text-decoration: none; font-weight: 700; white-space: nowrap;
  }
  .link:hover { text-decoration: underline; }

  .empty { text-align: center; color: var(--muted); padding: 64px 20px; font-size: .88rem; }
</style>

つき、抜け毛、頭皮が硬いのも原因は同じ。加齢と共に毛細血管はゴースト血管化しちゃうから最優先は「血管ケア」だよ。やり方は、", "permalink": "https://www.threads.com/@atsushi_bihatsu14/post/DWiuocBEuvB", "likes": 935, "velocity": 0.26, "ageHours": 3632.2, "postedAt": "2026-03-31T17:47:01+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3958384551961143112", "username": "rira_yukari", "text": "糸リフト片側3本ずつ！今回もいい感じに自然にリフトアップできて満足の39歳女\n(わかりやすいように同じ服きて同じ場所で撮った)", "permalink": "https://www.threads.com/@rira_yukari/post/DbvAccQCadI", "likes": 868, "velocity": 1.62, "ageHours": 535.1, "postedAt": "2026-08-07T18:50:31+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3904154147415641783", "username": "escape_aira", "text": "私の顔に対して色んな事言ってくる人間沢山いるけど自分の顔嫌いじゃないし好きな自分になる為に\nまだまだ整形する予定.\n\nまつ毛は頑張って薄くするぅ.", "permalink": "https://www.threads.com/@escape_aira/post/DYuV4MRE863", "likes": 823, "velocity": 0.35, "ageHours": 2330.9, "postedAt": "2026-05-24T23:06:24+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3964932758179147968", "username": "tora_mamama", "text": "だから何度でも言うけど、こういう毛穴は朝にナイアシンアミド→夜にアゼライン酸仕込めば２週間ぐらいで見違えるってば。これ使ってみな", "permalink": "https://www.threads.com/@tora_mamama/post/DcGRVYhk_DA", "likes": 818, "velocity": 2.57, "ageHours": 318.3, "postedAt": "2026-08-16T19:40:38+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3907004974445537657", "username": "kumi_biyo_official", "text": "ちょい怖いこと言うと、、、\nすり鉢毛穴は「皮脂」でも「汚れ」でもなく炎症で地盤が凹む構造トラブルやねん。本気で卒業したい40代は、今日から3つの成分でケア始めて。￼", "permalink": "https://www.threads.com/@kumi_biyo_official/post/DY4eFL1gql5", "likes": 721, "velocity": 0.32, "ageHours": 2236.5, "postedAt": "2026-05-28T21:28:29+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3937960063256316381", "username": "antyan_beauty", "text": "ストレートネックの人！！！！！二重あごになるし、ほうれい線目立つし、顔むくむし、めっちゃ老けて見えるから、今すぐこれやって！！！！！", "permalink": "https://www.threads.com/@antyan_beauty/post/DamcdA2EUnd", "likes": 711, "velocity": 0.59, "ageHours": 1211.5, "postedAt": "2026-07-10T14:30:43+09:00", "genres": ["フェイシャル"], "keywords": ["小顔", "ほうれい線"]}, {"id": "3846752425135555048", "username": "yoshie.d58", "text": "左の写真は23歳、出産まもなくなので、顔も二重顎です。右は66歳の私です。整形などは一切しておりません。リフトアップもしていません。自分のホームケアと運動のみです。￼小鼻も広がっていません。", "permalink": "https://www.threads.com/@yoshie.d58/post/DViaPMfE8Ho", "likes": 677, "velocity": 0.16, "ageHours": 4231.7, "postedAt": "2026-03-06T18:17:25+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3967070676339993332", "username": "iikurashi_i", "text": "最短で垢抜けたいなら、この前髪真似してみ。\nセンターで分けて左右は毛量残したまま、真ん中だけシースルー。これがもう誰にでも似合う黄金垢抜け前髪なんですよ。", "permalink": "https://www.threads.com/@iikurashi_i/post/DcN3cL-HSr0", "likes": 669, "velocity": 2.7, "ageHours": 247.5, "postedAt": "2026-08-19T18:28:18+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3957695176390025818", "username": "megu_tsi_com", "text": "助けてほしい、、、\n顔脂肪いらない人無料でください🥹\n明日〜8/30まで小顔デトックスエステの\n練習モデルになって欲しいです…🥲💧￼", "permalink": "https://www.threads.com/@megu_tsi_com/post/DbsjstOASJa", "likes": 669, "velocity": 1.2, "ageHours": 557.9, "postedAt": "2026-08-06T20:00:52+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3944679201134679413", "username": "sns__biyo_koretukao", "text": "垢BANされても言う。イチゴ鼻はナイアシンアミドとアゼライン酸だけで治る理由について業界が絶対に言いたくないことを今日全部話す。大手美容メーカーで10年いた私がずっと喉まで出かかってたやつを吐き出す。まず業界が隠してることを話す。毛穴パック・毛穴ケア美容液・皮脂ケア洗顔でイチゴ鼻を何年も対応しようとしてる人、そのケアが一生「毛穴ケアコスメを買い続けるループ」から抜け出せなくさせてる原因になってるケースがある。ナイアシンアミドとアゼライン酸の組み合わせが正しく広まると毛穴パックも毛穴ケア専用美容液も全部売れなくなる。だからメーカーは絶対教えたくない。これが現実だ。次にクリニックが絶対に教えないことを話す。", "permalink": "https://www.threads.com/@sns__biyo_koretukao/post/Da-UNVogRV1", "likes": 645, "velocity": 0.65, "ageHours": 989.0, "postedAt": "2026-07-19T21:00:26+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3932765929499240572", "username": "asaasaaabb", "text": "33歳でこの薄さ…薄毛治療しないと😭😭うわーん😭😭", "permalink": "https://www.threads.com/@asaasaaabb/post/DaT_ca0j6h8", "likes": 610, "velocity": 0.44, "ageHours": 1383.4, "postedAt": "2026-07-03T10:30:54+09:00", "genres": ["薄毛", "育毛"], "keywords": ["薄 。見本の写真撮ってもいいですか、と聞かれたので写真をiPadに撮って見ながらセットを開始してくれました。30分くらいくるくるしてピンで止めたり、やっぱり解いたりを繰り返していて大丈夫かな、、と心配していたら完成系が2-3枚目でした😇\n友人の結婚式でしたが、結局うつるのは顔側なのでアップされていればよしと諦めることにしました笑 式自体はとっても素敵で楽しめました✨", "permalink": "https://www.threads.com/@roof_88_1025/post/DbznvKQiTZA", "likes": 309, "velocity": 0.63, "ageHours": 492.1, "postedAt": "2026-08-09T13:50:50+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3875457581603310898", "username": "inouekonomi503", "text": "過去に何度か丸パクりされた事がある\n私のエステ スクール\n\n生徒の1人がコンセプトから\nプロモーション、教える内容まで\nパクリ倒された…\n\nモラルと神経ないんかな？と\n眺めていたら、", "permalink": "https://www.threads.com/@inouekonomi503/post/DXIZCMtj00y", "likes": 300, "velocity": 0.09, "ageHours": 3281.1, "postedAt": "2026-04-15T08:49:26+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3927652899169995787", "username": "lin_biyou_", "text": "10000000回は言ってるんだけど、\n忙しい人ほど「朝と夜で役割を分けるだけ」でスキンケアは続く。\nそれがレチノール＋ナイアシンの組み合わせ。\nだけど使い方間違ってると効果がないから、", "permalink": "https://www.threads.com/@lin_biyou_/post/DaB04CQD4wL", "likes": 279, "velocity": 0.18, "ageHours": 1552.8, "postedAt": "2026-06-26T09:12:13+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3968590997940835342", "username": "haru.biyou_kenkyu", "text": "化学者が本音で言う。美容医療で後悔する前に、お願いだから絶対メモって。\n・トーニングは「肝斑を濃くする」\n・ハイフは「半年で切れる」\n・ボトックスは「3〜6ヶ月で切れる」\n・ダーマペンは「シミが増える」\n・白玉点滴は「完全に金ドブ」\n・FGF入りPRPは「一生ボコボコ」\n・糸リフトは「半年で消える」\n・リアル注射は「", "permalink": "https://www.threads.com/@haru.biyou_kenkyu/post/DcTRHxzE5QO", "likes": 279, "velocity": 1.42, "ageHours": 197.1, "postedAt": "2026-08-21T20:48:55+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3895303754438934900", "username": "koma.cheek", "text": "衝撃だった。\n顔が横に広がってホームベース化するのは\n「エラの骨」か「長年の食いしばり」だと思ってたけど、\nゴッドハンドの整体師いわく\n余白ゼロの「圧倒的小顔」が欲しいなら\nYouTube動画を完コピするでもなく、\nマウスピースを24時間ハメるでもなく、\nエラを拳でゴリゴリ揉むわけでもなく、、", "permalink": "https://www.threads.com/@koma.cheek/post/DYO5iBflAF0", "likes": 278, "velocity": 0.11, "ageHours": 2624.0, "postedAt": "2026-05-12T18:00:18+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3925863378431347402", "username": "nico_mina25", "text": "エステって月１回でも継続したら効果あるのかな？\n美容を放棄しすぎてて、そろそろ何か始めようかと。\n月１回、フェイシャルとボディがっつりをやろうかと思ってるんだけど。", "permalink": "https://www.threads.com/@nico_mina25/post/DZ7d_FMHYrK", "likes": 267, "velocity": 0.17, "ageHours": 1612.0, "postedAt": "2026-06-23T21:56:45+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3972909003122655535", "username": "bon50501", "text": "女性の薄毛に本当に効果のある物が知りたいです‼️\n40歳女性。小学生のころから前髪が薄いです。\n猫っ毛で細いです。", "permalink": "https://www.threads.com/@bon50501/post/Dcim7BgE8Ev", "likes": 229, "velocity": 4.23, "ageHours": 54.2, "postedAt": "2026-08-27T19:48:01+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3960978742398904396", "username": "kaname_fubuki", "text": "恐いことに気付いてしまいました。\n\n次男の髪の毛がごっそり減っているのです。\n本人が、シャンプーの時に髪がすごく抜けて恐いと言い、頭頂部を見たら、つむじ以外も地肌が露出しているのです😔\n触ると、髪全体の毛量がスカスカになっていました。次男は背が高いので、頭頂部に気付きませんでした。\n円形脱毛症という抜け方ではなく、全体的に密度が落ちている感じです。\n\n明らかにストレスだと思いますが、同じようになった方いらっしゃいますか？😢\n本人も怖がっており、可哀想です。\n明日、小児科へ行くので相談してみようとは思っています。", "permalink": "https://www.threads.com/@kaname_fubuki/post/Db4OS4Xj2hM", "likes": 228, "velocity": 0.51, "ageHours": 449.2, "postedAt": "2026-08-11T08:44:43+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3903425964852492499", "username": "dr.norimoto", "text": "美容外科界隈みんな知ってるけど、黙ってる事ひとつぶっちゃけます\n・\n糸とヒアルで小顔は作れん\nむしろ、物入れてるからデカなる", "permalink": "https://www.threads.com/@dr.norimoto/post/DYrwTvaEbjT", "likes": 220, "velocity": 0.09, "ageHours": 2355.0, "postedAt": "2026-05-23T22:57:37+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3915548706699664612", "username": "koziwatyann_biyou", "text": "いいか、40代50代。ハイフでも高周波でも取れないたるみがある。それが「皮膚の余り」。40代以降になると骨・筋肉・脂肪が減るのに皮膚の量は変わらないから、どんどん皮膚が余ってたるんでくる。この皮膚を直接引き締められる機械がたった1つだけあって、「皮膚のアイロン」って言われる", "permalink": "https://www.threads.com/@koziwatyann_biyou/post/DZW0s2jktzk", "likes": 218, "velocity": 0.11, "ageHours": 1953.6, "postedAt": "2026-06-09T16:23:21+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3926648746017336306", "username": "tsuya2mi", "text": "炎上覚悟で言うけど‼️‼️頭皮マッサージはマジでヤバい習慣です‼️‼️‼️美容業界に15年いて、頭皮マッサージの恐ろしさ痛感してる^^髪や頭皮だけじゃなくて、顔にも影響する。正直に全部話す。何がヤバいかというと、", "permalink": "https://www.threads.com/@tsuya2mi/post/DZ-QjrwGKvy", "likes": 195, "velocity": 0.12, "ageHours": 1586.0, "postedAt": "2026-06-24T23:57:09+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア", "頭皮マッサージ"]}, {"id": "3910207148408350294", "username": "nao_biyou0", "text": "ダントツで若く見える女性の共通点。\n20年皮膚科で働いていて思う。\n高い化粧品を使ってる人でもない、美容医療をしてる人でもない。なぜか年齢を感じさせない女性にはある共通点がある。\nA：友達が多い\nB：推しがいる\nC：自分の時間がある\nD：夫婦仲がいい\nあなたはどれだと思う？、", "permalink": "https://www.threads.com/@nao_biyou0/post/DZD2K8vEqZW", "likes": 192, "velocity": 0.09, "ageHours": 2130.5, "postedAt": "2026-06-02T07:30:37+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3861097823849227129", "username": "lbc.lula_dr.k.hashimoto", "text": "どちらの顔が魅力的ですか？？", "permalink": "https://www.threads.com/@lbc.lula_dr.k.hashimoto/post/DWVYAOJkSN5", "likes": 185, "velocity": 0.05, "ageHours": 3756.6, "postedAt": "2026-03-26T13:19:10+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3930846753360836398", "username": "ayu_aaa10", "text": "口横のたるみに悩んでるアラフォーたち、よく聞いてください。\n\n40歳の私が「これは効いた」と思った施術はオンダリフト。ウルトラフォーマーMPTもかなり効くけど、とにかく激痛。\nオンダリフトは、痛みに弱い人にも受けやすい施術。ほんのり温かいくらいで、効果をジワジワ実感できる。\n\nただし、何度も言っているように適応は人それぞれ。いきなりコース契約する前に、必ず信頼できる医師にしっかり相談してほしい。約束だぞ。", "permalink": "https://www.threads.com/@ayu_aaa10/post/DaNLEuwkfcu", "likes": 184, "velocity": 0.13, "ageHours": 1447.0, "postedAt": "2026-06-30T18:57:50+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3971335629623594768", "username": "lgta338", "text": "※閲覧注意\nお目汚しすみません🙇🏼スキンケア後のすっぴんです\n32歳 毛穴、くすみ、シミ、最近出来るようになった赤っぽいにきび跡が気になります､､､\nおそらく混合肌、インナードライ。\n美容に詳しい方！！qoo10メガ割や使った方が良い成分、美容医療のオススメ教えていただけたら嬉しいです😭😭\nいろいろと試してはいるものの、いまいち効果が感じられず､､､助けてください､､､", "permalink": "https://www.threads.com/@lgta338/post/DcdBLbPkQ8Q", "likes": 169, "velocity": 1.59, "ageHours": 106.3, "postedAt": "2026-08-25T15:42:00+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3946570958438411955", "username": "namu33namu", "text": "高周波しても糸リフトしても戻りが早かったけど、肌育注射するようになったら逆にリフトアップした！やっぱり肌の土台が整うのって大事だね。ヒアルロン酸みたいに不自然にならないし。今日はザーフやりにいく🙌", "permalink": "https://www.threads.com/@namu33namu/post/DbFCWB6mC6z", "likes": 169, "velocity": 0.18, "ageHours": 926.3, "postedAt": "2026-07-22T11:39:01+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3964651236226166501", "username": "yukimi_1013", "text": "汚肌失礼します。\n毛穴に悩んでいて、\n何をしたらいいか教えていただきたいです。\n\nこれまでの施術歴\nIPL10回以上•ポテンツァ（マックーム•ジュベルック）•\nシルファーム•手打ちジュベルック•ジャルプロ•\nスキンボトックスなど色々やりましたが改善しません…\n\n最近はスキンケアに\nアゼライン酸も取り入れていますが、なかなか🥹\nレチノールはかなり肌荒れしてしまいます。。", "permalink": "https://www.threads.com/@yukimi_1013/post/DcFRUsxku7l", "likes": 168, "velocity": 0.51, "ageHours": 327.6, "postedAt": "2026-08-16T10:21:18+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3930041843715362559", "username": "ritan.rinrin", "text": "高須院長の息子さんDrのYouTubeを見て買ってしまった。\n体力ない自分とハゲてきた旦那さんに。\n以前、エビオス飲ませたら1日5回ぐらい💩が出て会社で困るから飲まない！と言われたんだけど、そんな出るか？\n遺伝の薄毛には効果なしと高須ジュニアD rは言ってましたが、エビオス飲んで髪が増えた方いるかな？", "permalink": "https://www.threads.com/@ritan.rinrin/post/DaKUDwPE07_", "likes": 168, "velocity": 0.11, "ageHours": 1473.7, "postedAt": "2026-06-29T16:18:37+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3909582333872230019", "username": "tsubakimama09", "text": "2ヶ月でまつ毛激変。この長さと密度やばくない？\n1万超えのラッシュアディクトから乗り換えた、ある美容液が完全にバグ。\n色素沈着なし、値段は1/3以下なのに、キャピキシル公認マーク受賞してて育毛剤レベルの配合はエグいって", "permalink": "https://www.threads.com/@tsubakimama09/post/DZBoGs2mM6D", "likes": 162, "velocity": 0.08, "ageHours": 2151.1, "postedAt": "2026-06-01T10:49:14+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3908067115916276454", "username": "kogao_seitai", "text": "ほうれい線ベロ回してる人 みんなこれ😰", "permalink": "https://www.threads.com/@kogao_seitai/post/DY8PlYKkzLm", "likes": 159, "velocity": 0.07, "ageHours": 2201.3, "postedAt": "2026-05-30T08:38:46+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3908279219185681754", "username": "so12_10t", "text": "6畳ほどでエステサロンをされている方、お部屋を見せていただけませんか？🥺\nレイアウトや雰囲気も知りたいです🥹", "permalink": "https://www.threads.com/@so12_10t/post/DY8_z4umoVa", "likes": 157, "velocity": 0.07, "ageHours": 2194.3, "postedAt": "2026-05-30T15:40:10+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3964806846440195551", "username": "jellyfish.water0826", "text": "理想は一枚目のようなニュアンスシニヨン。ただ、毛量が多く、難しいと思うので、その場合は二枚目のような感じになると嬉しい。あまりボリューム感がありすぎたり、きっちりしすぎると顔タイプに合わないためゆるっとして欲しいとオーダーしました。結果、3枚目。もう少しゆるっとしたいと一度言ってみましたが、あまり変わらず。かなりボリューム感は抑えていただいたのでこれを最終としました。美容師さん曰く、ドレスを着たらもっと馴染む。髪色が違うから違うと印象が変わるからとのこと。ここからどのようにすれば私の理想に近づくのでしょうか…。やはり毛量多いとニュアンスは無理ですか(；；)先輩花嫁さん、美容師さん助けてください(；；)", "permalink": "https://www.threads.com/@jellyfish.water0826/post/DcF0tIFGsXf", "likes": 153, "velocity": 0.47, "ageHours": 322.5, "postedAt": "2026-08-16T15:30:29+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3962582826583434838", "username": "nana_shi_69", "text": "美容室で流すついでに頭皮マッサージを軽くしてくれるんだけど、終わると毎回頭痛がする。\nこれって私の頭がカッチコチで血流が良くなったからってこと😭？", "permalink": "https://www.threads.com/@nana_shi_69/post/Db97BYLkaZW", "likes": 135, "velocity": 0.34, "ageHours": 396.1, "postedAt": "2026-08-13T13:51:45+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3866945034813771995", "username": "haaruu322", "text": "今日お試しで行ったフェイシャルエステが\n過去一良くて感動。\n\n商品勧められたけど、無理な押し売り\n一切なくて尚更感動。\n\nただ、高すぎる。まじで高すぎる。\n良いのは分かる。そりゃこんだけ良かったら\n高いのもわかる。\n\nでも、こんな高いの定期的に買える\n財力の人間ってひと握りすぎないか？\n\nでも、そりゃこんだけ良ければ仕方ないか。\nって思えるくらい、やっぱ良かった。", "permalink": "https://www.threads.com/@haaruu322/post/DWqJgVuCRDb", "likes": 126, "velocity": 0.04, "ageHours": 3563.0, "postedAt": "2026-04-03T14:56:32+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3937438874434808231", "username": "hara_diett", "text": "知ってほしい。ほうれい線が年々濃くなってる、マッサージしても消えないという30代・40代の方へ。美容外科分野の研究で、ほうれい線の正体は「皮膚のたるみ」だけじゃなく「骨の凹み」だと分かっている。鼻の脇の骨(梨状孔)は加齢で溶けて縁が広がり、そこに皮膚と脂肪が落ち込んでほうれい線になる。マッサージや表情筋トレで消そうとするよりも、", "permalink": "https://www.threads.com/@hara_diett/post/Dakl8t7gCmn", "likes": 126, "velocity": 0.1, "ageHours": 1228.7, "postedAt": "2026-07-09T21:15:12+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3871568274438164302", "username": "__u.r.a.7__", "text": "エステ開業3ヶ月。\n広告ゼロで月140件。\n\nThreadsからご新規 月40件\nホットペッパーなし(締切)\nリピートほぼ100（幸）\n\nただの一人サロンの私が意識してること↓\n\n※最後は要注意", "permalink": "https://www.threads.com/@__u.r.a.7__/post/DW6ktVJjw9O", "likes": 117, "velocity": 0.03, "ageHours": 3409.9, "postedAt": "2026-04-10T00:02:05+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3964197078910460319", "username": "bihatsu_usagi", "text": "何度でも言います。\n白髪が増えるのは「遺伝」か「加齢」だと\n思ってたけど、\n漢方外来の先生いわく\n白髪を止めたいなら、\n高いシャンプーに変えるでもなく、\n毎月美容院で染め続けるでもなく、\nサプリを何種類も飲み続けるわけでもなく、、", "permalink": "https://www.threads.com/@bihatsu_usagi/post/DcDqD10GWGf", "likes": 116, "velocity": 0.34, "ageHours": 342.6, "postedAt": "2026-08-15T19:18:59+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3911169870570662144", "username": "raaamen__0141", "text": "眉毛パーマ行ってきたんだが、、、\n明らかに左右違うよな\n右だけすごい抜かれるし眉毛描かれてたから\n車戻ってソッコー拭いたらこんなことに。\nなんじゃこれ🤦‍♀️\n右だけ眉毛離れてるのでとか言われたけど、関係ある？笑\nまぁ、毛は生えてくるからいいか。", "permalink": "https://www.threads.com/@raaamen__0141/post/DZHREZnkykA", "likes": 111, "velocity": 0.05, "ageHours": 2098.6, "postedAt": "2026-06-03T15:23:23+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3867450358696742065", "username": "calm_0915", "text": "フェイシャルエステされてる方、自宅サロンされてる方\nまだオープンしたばかりなので認知も薄くお客様も中々平日や土日予約入りません。集客方法色々教えてください。\n宜しくお願いします😊", "permalink": "https://www.threads.com/@calm_0915/post/DWr8ZxQk4yx", "likes": 109, "velocity": 0.03, "ageHours": 3546.3, "postedAt": "2026-04-04T07:40:31+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3901192872272003978", "username": "jimu_neesan", "text": "なんかかわいくなった？って思われる施術5選\n※個人的な意見です\n5位：ハイフ\n→たるみが引き上がって輪郭がすっきり\n気づいたら「なんか顔小さくなった？」って言われる👀\n4位：エラボトックス\n→ハイフのあとにやると小顔効果が倍増する\nセットでやってる人が多いのわかる気がする😌\n3位：埋没\n→もともと二重の人でも幅を広げたりぱっちりさせるのにおすすめ\n目の印象が変わるだけで顔全体が変わる✨", "permalink": "https://www.threads.com/@jimu_neesan/post/DYj0j94DwOK", "likes": 108, "velocity": 0.04, "ageHours": 2428.9, "postedAt": "2026-05-20T21:00:52+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3890391113812067236", "username": "mokon_chan", "text": "たぶん、これを知っていたら何万円も無駄にしなかった。\n薄毛には育毛剤。抜け毛には頭皮マッサージ。\nそう信じて、ドラッグストアで話題の育毛シャンプーを買い続けた。口コミの良いサプリも、頭皮用美容液も、惜しみなく使った。\nそれでも、一向に変化は感じられなくて。\n転機は、国際中医師のいる育毛サロンへ行った時。頭皮を診てもらう覚悟でいたら、先生が最初に触れたのは、", "permalink": "https://www.threads.com/@mokon_chan/post/DX9chsYGsOk", "likes": 105, "velocity": 0.04, "ageHours": 2786.6, "postedAt": "2026-05-05T23:19:42+09:00", "genres": ["薄毛", "育毛"], "keywords": ["薄毛 対策", "抜け毛 対策", "育毛剤"]}, {"id": "3889503863628222282", "username": "t.masa21", "text": "50代で前半です。ハイフを2週間前に受けて何も変わらんのだけどこんなもん？？\n口横たるみとほうれい線が気になって\n-10歳とかじゃなくて、すごい若返らなくていいから、そこそこ口横のたるみがなくなればって感じで思ってるのだけど、脂肪吸引してリフトアップとか\n50万前後かかる施術ばかり言われるのだけどそうするしかないのでしょうか？数万で-5歳くらいは無理なのかなぁ。。\n誰か詳しい人ご教授お願いします！\n#美容\n#美容医療", "permalink": "https://www.threads.com/@t.masa21/post/DX6SygQEc9K", "likes": 105, "velocity": 0.04, "ageHours": 2816.0, "postedAt": "2026-05-04T17:56:54+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3943505048051602353", "username": "neurobeauty_toshi_gunma", "text": "耳の上がリフトアップの鍵。\n顔は頭皮から引き上がる。\nたるみは側頭筋で変わる。\n首肩ゆるめて若返る。\n整形級リフトアップ3選。", "permalink": "https://www.threads.com/@neurobeauty_toshi_gunma/post/Da6JPKXE1Ox", "likes": 104, "velocity": 0.1, "ageHours": 1027.8, "postedAt": "2026-07-18T06:07:56+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3912080653869523386", "username": "mu.__.61", "text": "閲覧注意⚠️\n汚い肌を晒して申し訳ありません、、\n美容スペシャリストの皆様にアドバイスをいただきたいです😭😭\n毛穴に赤ら顔が気になります。美容の知識はあまりなくお力添えをお願いできればと思っております。\n今Qoo10メガ割しているので、スキンケアのおすすめもしていただけると幸いです😭😭\nよろしくお願いいたします😭😭\n30代前半でございます、、", "permalink": "https://www.threads.com/@mu.__.61/post/DZKgKCqkiG6", "likes": 101, "velocity": 0.05, "ageHours": 2068.4, "postedAt": "2026-06-04T21:32:57+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3939203457261747240", "username": "yokoyoko3053", "text": "48歳です。フェイスラインのたるみがやばすぎる。リフトアップしたい。", "permalink": "https://www.threads.com/@yokoyoko3053/post/Daq3KxwE7wo", "likes": 91, "velocity": 0.08, "ageHours": 1170.3, "postedAt": "2026-07-12T07:41:07+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3953792717751326002", "username": "tsuya2mi", "text": "40代でもおばさん化しない人は、実は頭皮マッサージをしてる人。これは間違いない。美容業界15年いて、この効果の大きさ痛感してる。髪だけじゃなくて顔にも直結してるんだけど、頭皮マッサージの恐ろしい効果が、", "permalink": "https://www.threads.com/@tsuya2mi/post/DbesYdZGBUy", "likes": 89, "velocity": 0.13, "ageHours": 687.2, "postedAt": "2026-08-01T10:47:22+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3856206176443740622", "username": "biyou.tama", "text": "美容ナースが選ぶ、美容医療ランキング【たるみ】第3位：ジャルプロスーパーハイドロ(肌育注射)。肌を支えてる靭帯（リガメント）にアプローチしてコラーゲンとエラスチンを増やし、土台から肌を立て直す。顔を昔のように自然にリフトアップできる注射。ボリューム・ハリを出しつつたるみ感を補正。私も実際に、写真上でもたるみ改善が見えて喜んでいる人を見てきた。第2位：ボルニューマ（RF・高周波）。熱で引き締めて、自然に持ち上げるリフト治療。高周波で肌の奥を温めることで、コラーゲンが縮む＆増える。内側から引き締まる。たるみ改善、フェイスラインがすっきりする。第1位は、", "permalink": "https://www.threads.com/@biyou.tama/post/DWD_xYfmLHO", "likes": 89, "velocity": 0.02, "ageHours": 3918.6, "postedAt": "2026-03-19T19:20:20+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3953028024258258673", "username": "yuko_the_rebirth", "text": "ヘッドスパやってる人、気づいてる？\n皮膚、髪の毛は排泄器官です。", "permalink": "https://www.threads.com/@yuko_the_rebirth/post/Dbb-gtFE-bx", "likes": 82, "velocity": 0.12, "ageHours": 712.5, "postedAt": "2026-07-31T09:28:04+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア", "頭皮マッサージ"]}, {"id": "3942570144912916034", "username": "tsuya2mi", "text": "炎上覚悟で言うけど。頭皮マッサージはマジでヤバい習慣です‼️‼️美容業界に15年いて、頭皮マッサージの恐ろしさ痛感してる^^髪や頭皮だけじゃなくて、顔にも影響する。正直に全部話す。何がヤバいかというと", "permalink": "https://www.threads.com/@tsuya2mi/post/Da20qh9mD5C", "likes": 78, "velocity": 0.07, "ageHours": 1058.8, "postedAt": "2026-07-16T23:10:07+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3950919166870068368", "username": "kiiiikorin829", "text": "38歳。産後から4年経っても明らかに薄毛になってきて前髪スカスカ😭薄毛治療のクリニック通うしかないのかな😭これやったら改善してきたよ！ってものがあれば教えてほしいです🥲\n左➞4年前 。右➞今", "permalink": "https://www.threads.com/@kiiiikorin829/post/DbUfAylkpyQ", "likes": 74, "velocity": 0.09, "ageHours": 782.3, "postedAt": "2026-07-28T11:38:08+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3955097657144472074", "username": "hatibeutyhair", "text": "資生堂の研究者に聞いた「ほうれい線がない人」の共通点がガチで意外だった。\nコラーゲンを塗り込んでるでも、コラーゲンを飲んでるでも、美顔器で引き上げてるでもなくて。実は、、", "permalink": "https://www.threads.com/@hatibeutyhair/post/DbjVF06E3IK", "likes": 71, "velocity": 0.11, "ageHours": 644.0, "postedAt": "2026-08-03T06:00:16+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3911988785215374912", "username": "keana_lab_40s", "text": "「レチノールを続けても濃度を上げても毛穴が変わらない…」それ、当然です。だってレチノールが得意な毛穴は限られているから。毛穴は全部同じに見えて原因はまったく違う。だからレチノールさえ塗れば何とかなるわけではないの。\n\n【左上】おでこ・開き毛穴（皮脂主導型）\n\n・毛穴が丸い\n・大きさがほぼ均一\n・光が当たるとテカる\n\nこのタイプは皮脂の影響が大きい。コラーゲン不足やたるみが主因ではないので、レチノールで大きな変化は出にくい。必要なのは", "permalink": "https://www.threads.com/@keana_lab_40s/post/DZKLRLUEwZA", "likes": 68, "velocity": 0.03, "ageHours": 2071.5, "postedAt": "2026-06-04T18:30:25+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3961973690774167122", "username": "htmdajgajw99", "text": "美容師さんへ質問です🙋‍♀️\n髪の毛が広がりやすいんですけど、縮毛矯正と髪質改善ってどちらがいいんでしょうか？", "permalink": "https://www.threads.com/@htmdajgajw99/post/Db7whSQCZ5S", "likes": 64, "velocity": 0.15, "ageHours": 416.3, "postedAt": "2026-08-12T17:41:30+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3952668031113703927", "username": "chipmunk.6773308", "text": "ずーっと薄毛で悩んでます。\n毛量が多い人を見ると羨ましい😭\n薄毛治療には何十万もかかるとか‥\n育毛剤って効き目あるんですかね？\n使用者の声って本当なのかしら‥。\nクリニックで治療して大金つぎ込むより\nウイッグと思ってはいても抵抗あり。\n育毛剤‥どうなん？", "permalink": "https://www.threads.com/@chipmunk.6773308/post/DbasqHVkzH3", "likes": 64, "velocity": 0.09, "ageHours": 724.4, "postedAt": "2026-07-30T21:32:49+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3957018537905692135", "username": "1001yn_", "text": "ジャルプロ3回ちゃんとやった方に聞きたいんだけど\nリフトアップ効果ちゃんと出てますか😇", "permalink": "https://www.threads.com/@1001yn_/post/DbqJ2UhgR3n", "likes": 63, "velocity": 0.11, "ageHours": 580.4, "postedAt": "2026-08-05T21:36:30+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3946121094244258753", "username": "yknkwi", "text": "私の父は理容師でした。今は引退してます\n私も理容師です。\n\nメンズカットの色彩をきれいにグラデーションを作るポイントを教えてもらったことがあります。\n実用的な話ですが、つむじのあたりに毛がない人には\n薄いところに合わせて厚みを取ると薄いのが目立たないと言われました。\n\nそれを思い出しこないだやってみて、\nそれを説明したら、お客様に怒られました。\n父のお客様でしたので、笑って怒ってくれました。", "permalink": "https://www.threads.com/@yknkwi/post/DbDcDpPGtPB", "likes": 62, "velocity": 0.07, "ageHours": 941.2, "postedAt": "2026-07-21T20:45:13+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3911678306483953880", "username": "carry39japan", "text": "フェイシャルエステ💆‍♀️✨\n\n気になっているのですが、\nみなさんどのくらいの料金で\n通われていますか😊？", "permalink": "https://www.threads.com/@carry39japan/post/DZJErHdk-DY", "likes": 62, "velocity": 0.03, "ageHours": 2081.7, "postedAt": "2026-06-04T08:13:33+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3917839507785948196", "username": "aska_ito", "text": "美容女医に質問\n\nQ.\n「ボトックスって長年続けるとたるみますか？」", "permalink": "https://www.threads.com/@aska_ito/post/DZe9kZUkpwk", "likes": 61, "velocity": 0.03, "ageHours": 1877.7, "postedAt": "2026-06-12T20:14:46+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3916782332262998880", "username": "alligator.40717508", "text": "産後2年経ちますが産後の抜け毛が終わりません…\nもはや要因は違うかもしれないけど\n毛は細くなる一方だし、どんどん抜けるし😭\n\n細すぎるのか、髪質なのか、毎日洗ってるのに前髪は半日するとオイリーになります\n同じような方いないですよね…\n今はリーゼの前髪復活させる粉と頭皮に塗るシャドー？でしのいでます😂\n\nここからリカバリーする方法はありませんか？", "permalink": "https://www.threads.com/@alligator.40717508/post/DZbNMd5D-Ng", "likes": 58, "velocity": 0.03, "ageHours": 1912.7, "postedAt": "2026-06-11T09:14:20+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3909175862789142525", "username": "ttttt46461", "text": "34歳。ここ数年でハゲがやばいくらいに進行してきた😭\n
