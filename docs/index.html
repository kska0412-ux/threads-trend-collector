LlSKFCaMP", "likes": 46, "velocity": 0.17, "ageHours": 268.8, "postedAt": "2026-08-18T21:11:10+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策", "つむじ 薄毛"]}, {"id": "3959024523178350286", "username": "moo__biyou", "text": "毛穴詰まり悩んでる人、よーーーく聞きなっっっ！！！！！\n角栓と黒ずみ、実は攻め方が違う！！！！\n同じ「毛穴ケア」でまとめてるから一生解決しないんだよ！！！！\nまずはこれ、覚えときなぁぁぁぁぁ！！！！", "permalink": "https://www.threads.com/@moo__biyou/post/DbxR9P5GxbO", "likes": 46, "velocity": 0.09, "ageHours": 513.9, "postedAt": "2026-08-08T16:02:08+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3933046203857158909", "username": "fusafusa_gingin", "text": "薄毛対策で「亜鉛サプリ飲んでるのに効かない」って奴は飲むタイミングが間違ってる。亜鉛は「空腹時に飲むと吸収率が低い」「夜寝る前に飲むと睡眠が浅くなる」「単体では効きが薄い」。この3つの落とし穴がある。そして、￼", "permalink": "https://www.threads.com/@fusafusa_gingin/post/DaU_K8qGsL9", "likes": 43, "velocity": 0.03, "ageHours": 1374.2, "postedAt": "2026-07-03T19:47:45+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3967613879929327212", "username": "tsuki_biyou_", "text": "どんなに頑張っても毛穴の黒ずみ改善しない人ー！それ、詰まり毛穴じゃなく「皮脂フィラメント」かも。表面が平坦で茶色っぽいから詰まり毛穴と勘違いする人多いんだけど全く別物で、ケア方法も異なるから詳しく書いとく↓", "permalink": "https://www.threads.com/@tsuki_biyou_/post/DcPy81vGM5s", "likes": 39, "velocity": 0.17, "ageHours": 229.5, "postedAt": "2026-08-20T12:27:33+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3950991383465003098", "username": "___mumu___24", "text": "4歳 年長 ロン毛男子👦🏻\nつむじ2こ男子👦🏻仲間いますか？", "permalink": "https://www.threads.com/@___mumu___24/post/DbUvbriD4ha", "likes": 34, "velocity": 0.04, "ageHours": 779.9, "postedAt": "2026-07-28T14:01:37+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3908846382500351701", "username": "kmtsm.9013", "text": "やばいよー！\n日に日に薄くなってる😭\n赤い部分が特に薄くて前髪は伸びないし表面の髪も少なくなってきてる。特に左側。\n美容師だけど、私以上に薄い人みない。\n46歳このままじゃヤバい。\n同志いない？", "permalink": "https://www.threads.com/@kmtsm.9013/post/DY_AxMugQ7V", "likes": 33, "velocity": 0.02, "ageHours": 2175.5, "postedAt": "2026-05-31T10:27:01+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3888841867970830055", "username": "mokon_chan", "text": "更年期女性の62%が「髪のボリューム低下」を実感しているのに、食事で対策できると知っている人はほとんどいない。私もそうだった。\n\n46歳を過ぎた頃から、シャワーのたびに排水口に溜まる髪。こんなものかなと諦めてた。でも明らかに側頭部が透けてきて、このままハゲていくのは嫌！と思って、薄毛改善を自分で調べ始めた。\nそこでたどり着いたのが、", "permalink": "https://www.threads.com/@mokon_chan/post/DX38RMwEV7n", "likes": 33, "velocity": 0.01, "ageHours": 2837.9, "postedAt": "2026-05-03T20:01:38+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3940338799519925772", "username": "kotsukatsu_gishi", "text": "耳を疑った。顔のたるみがどんどん進む人。皮膚科の先生いわく、たるみを止めたいなら、高い美容液でもなく、マッサージでもなく、コラーゲンでもなく、", "permalink": "https://www.threads.com/@kotsukatsu_gishi/post/Dau5ULoEwYM", "likes": 33, "velocity": 0.03, "ageHours": 1132.7, "postedAt": "2026-07-13T21:16:50+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3969200931874967307", "username": "honey_haircare_chan", "text": "女の美意識レベルは「頭皮への向き合い方」でわかる\n\n🔻低め\n・シャンプーは適当に泡立てて頭頂部からゴシゴシ\n・自然乾燥で放置\n・頭皮のベタつきは体質だと思ってる\n\n🔻普通\n・シャンプー前にブラッシングする\n・お風呂上がりすぐドライヤー\n・たまに指で頭皮マッサージ\n\n🔻高い↓", "permalink": "https://www.threads.com/@honey_haircare_chan/post/DcVbzfCjo8L", "likes": 33, "velocity": 0.19, "ageHours": 177.0, "postedAt": "2026-08-22T17:00:44+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3927759074242935620", "username": "ochi_haircare", "text": "薄毛がほんとに悩みだけど薄毛治療薬のデメリットがデカ過ぎて絶対使わないと決めてる私。\nまだまだ薄毛だけど、地道に毎日頭皮ケア頑張ってここまできた🥹", "permalink": "https://www.threads.com/@ochi_haircare/post/DaCNBFfkTtE", "likes": 32, "velocity": 0.02, "ageHours": 1549.2, "postedAt": "2026-06-26T12:43:10+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3924174837640487981", "username": "kami_neesan_", "text": "分け目とつむじの薄毛、家でなんとかする方法。マジで知らん人多すぎるんよwww ワテも後頭部の透けにヒヤッとしたクチやから、本気で調べた保存版を作りたい。読みたい人はコメントかいいねで教えて。反応多かったら最優先でツリーにまとめるで。", "permalink": "https://www.threads.com/@kami_neesan_/post/DZ1eDlCFmQt", "likes": 32, "velocity": 0.02, "ageHours": 1667.9, "postedAt": "2026-06-21T14:02:01+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3932400016103283829", "username": "aaa0102aaaaa", "text": "アラフォー抜け毛に悩んでます…\n切実な悩みです…\n元々髪が細く毛量少なめです。\n年齢のせいなのか出産で色んなものを置いてきたのか年々元気がなくなってます〜\nセルフケアは思い立った時にする頭皮マッサージくらいです(しかも1分くらいで終わる)\n\nオススメのケアを教えてくださいまし😭😭\nそれとも課金して育毛サロンに通うのが近道でしょうか😭😭😭", "permalink": "https://www.threads.com/@aaa0102aaaaa/post/DaSsPrak5x1", "likes": 32, "velocity": 0.02, "ageHours": 1395.6, "postedAt": "2026-07-02T22:23:53+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3937744560596360053", "username": "clair__miho", "text": "ぶっちゃけ一番効果があった「たるみ治療」って\n何でしたか？👀", "permalink": "https://www.threads.com/@clair__miho/post/DalrdCWkpt1", "likes": 32, "velocity": 0.03, "ageHours": 1218.6, "postedAt": "2026-07-10T07:22:33+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3973480570643064624", "username": "kae.de902", "text": "いとこに教えたら感謝された\nガチで人生変わった頭皮ケアの組み合わせ🥹\n\n毎日髪抜けるのがストレスだったけど\nこれ続けてたら前より気にならなくなった😭", "permalink": "https://www.threads.com/@kae.de902/post/Dcko4bPGKcw", "likes": 31, "velocity": 0.88, "ageHours": 35.2, "postedAt": "2026-08-28T14:43:37+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3848917960052533146", "username": "yua_style_", "text": "【本当に“顔を小さく見せる”ための習慣】\n\n❌ ほぼ関係ない\n\n・強い力で顔を押す\n・毎日ゴリゴリほぐす\n・小顔グッズを増やす\n・むくみ＝水分だけと思う\n\n※輪郭を横に広げる原因になることも。\n\n⭕️本当に“顔を小さく見せる”ための習慣↓↓↓", "permalink": "https://www.threads.com/@yua_style_/post/DVqGn4CjWea", "likes": 31, "velocity": 0.01, "ageHours": 4160.0, "postedAt": "2026-03-09T17:59:57+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3917771413847691846", "username": "taku87116", "text": "育毛・発毛・頭皮ケア・スカルプケア得意な方\nいらっしゃいますか？\n\nコミュニティに薄毛や抜け毛、頭皮ケア\nに悩んでいる方がいらっしゃるので💦\n集客のお役に立てるかもです🤝", "permalink": "https://www.threads.com/@taku87116/post/DZeuFf5klJG", "likes": 30, "velocity": 0.02, "ageHours": 1880.0, "postedAt": "2026-06-12T17:59:28+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3949605823726561373", "username": "sally__525", "text": "美容鍼のビフォーアフター流れてきて、めちゃリフトアップされてたけど、美容鍼って1週間もしないうちに元通りよね？\nずっと続けてると上がったままの状態維持できる？\n私も月イチくらいで通ってた時もあったけど、鍼の効果VS老化は勝負にならなかったよ😅", "permalink": "https://www.threads.com/@sally__525/post/DbP0ZIeCShd", "likes": 30, "velocity": 0.04, "ageHours": 825.8, "postedAt": "2026-07-26T16:08:45+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3908375957727676313", "username": "m34673tdm", "text": "なんとか10月までに頬コケとリフトアップしたくて、いろんな施術やらクリニック調べてるけど、自分に合う施術をするにはやっぱり実際にカウンセリング行くしかないのかなぁ💭\n美容クリニックありすぎて結局どこがいいかわからない😭\n大阪でおすすめのクリニックないですか💧\nフェイスラインでコケすぎた経験があるから怖い…", "permalink": "https://www.threads.com/@m34673tdm/post/DY9VznhCQeZ", "likes": 30, "velocity": 0.01, "ageHours": 2191.1, "postedAt": "2026-05-30T18:52:22+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3925401531663416738", "username": "o_dai_o_dai", "text": "炎上覚悟で言います。亜鉛はマジでヤバい習慣です。薄毛治療10年以上向き合ってきて、亜鉛の重要性に気づいた。何がヤバいかというと、", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DZ50-U3kn2i", "likes": 28, "velocity": 0.02, "ageHours": 1627.3, "postedAt": "2026-06-23T06:39:09+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "薄毛 対策", "生え際 後退"]}, {"id": "3937525056789324352", "username": "warewarewa_r", "text": "旦那が髪の毛薄くなってきたの気にしてて\nAGA飲み薬試してみる？？って話になってるけど\n副採用と実際の効果が気になるみたいで。\n\nやってる人いたら感想教えてくださいーーーーー\nちなみにまだ30代前半です\n\nがっつりハゲとかじゃなくて\nM字にデコ広がってきて普段は目立たないです\n前髪あげるとまぁまぁキツイです😅", "permalink": "https://www.threads.com/@warewarewa_r/post/Dak5i1gIKJA", "likes": 28, "velocity": 0.02, "ageHours": 1225.9, "postedAt": "2026-07-10T00:06:26+09:00", "genres": ["薄毛", "育毛"], "keywords": ["つむじ 薄い", "AGA", "発毛"]}, {"id": "3969148609929365994", "username": "nerui0029", "text": "美容医療に詳しい方🙏🥹\nわたしはこの方に似た輪郭なのですが、\n面長をマシにして小顔に近づくにはどのような施術がお勧めですか？（骨切り以外）\n・薄肌\n・顔の脂肪少なめです。\n\n【気になるところ】\n・下顔面の長さ、面長（普段は前髪あり）\n・口横のもたつき、マリオネットライン\n・頬こけ\n\nまだ糸リフトまでは考えていなくて、「オリジオX」あたりはどうかな？と気になっています💭\nおすすめの施術やクリニックがあればぜひ教えてください！🙇‍♀️✨\n※画像は本人ではなくAIのイメージ画像なので、髪型などは面長に見えないスタイルにしています。", "permalink": "https://www.threads.com/@nerui0029/post/DcVP6Gbk0nq", "likes": 28, "velocity": 0.16, "ageHours": 178.7, "postedAt": "2026-08-22T15:16:47+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3936540250642397119", "username": "emochan_358", "text": "30歳女です。\n髪の毛がストレスとかでごっそり抜けちゃってから1年経つんですが、頭頂部分が中々生えなくてずっと悩んでます。\n亜鉛のサプリは摂ってます。ジムも週1で通って、毎朝プロテイン、鶏胸肉もかなり食べてます。\nその他、何かいい手立て、アイテム、薬はないでしょうか。出来ることは全てやりたいです。", "permalink": "https://www.threads.com/@emochan_358/post/DahZoBTkTe_", "likes": 27, "velocity": 0.02, "ageHours": 1258.5, "postedAt": "2026-07-08T15:29:48+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3943124510736281979", "username": "uvuooouvu", "text": "私、びまん性脱毛症だ。\n\nつむじの分け目が、目立つようになった。\n髪の毛のボリュームが減った。\n\n悲しい〜〜。", "permalink": "https://www.threads.com/@uvuooouvu/post/Da4ytnXknF7", "likes": 26, "velocity": 0.02, "ageHours": 1040.4, "postedAt": "2026-07-17T17:31:33+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3902368431622663518", "username": "kamonohasi.aga", "text": "知らなかった。\n「亜鉛は抜け毛に効く」と聞いて\nサプリを飲み続けた結果、\nむしろ抜け毛が増えた。\n皮膚科で正直に話したら\n「それ、男性にすごく多いですよ」と即答された。\n亜鉛は確かに髪に必要なミネラル。\nでも”頑張って補おう”とした瞬間、\n体の中でまったく逆のことが起きる。\nその理由が、", "permalink": "https://www.threads.com/@kamonohasi.aga/post/DYn_2m1kS1e", "likes": 25, "velocity": 0.01, "ageHours": 2390.0, "postedAt": "2026-05-22T11:56:30+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3959248830806875973", "username": "sakura2029pink", "text": "がーーーーーーん\nそんな気してたけど、やっぱりめっちゃ薄くなってる。。。\n\n一昨年くらいから尋常じゃないくらい抜け始めてハゲるんじゃないかと思ってて。\n昨夜、コンタクトもメガネもしてない状態で鏡に光るものが見えた。\n\nえ。。まさか。。。\n眼鏡かけたら。。。\n私の頭皮ーっ😭！\n分け目が。。😭😭\nそしてどこを分けても、分け目の主張がすごい。。。\n\n34くらいから年齢を感じるようになったけど、\n薄毛はもっと後だと思ってたよ😭！？\n37でこんな薄くなるの。。嘘でしょ。。。嘘と言って。。。。。\n毎日が忙し過ぎて抜けてるんか😇？\n年取ったらロングはできなくなるって聞くから、ラストスパートと思ってロングを楽しんでたけど、本当にあと少しかもだなんて信じたくない。。。\n薄毛対策しなきゃダメかな。。😞", "permalink": "https://www.threads.com/@sakura2029pink/post/DbyE9Wpn99F", "likes": 25, "velocity": 0.05, "ageHours": 506.5, "postedAt": "2026-08-08T23:27:42+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3864597131835960115", "username": "yamaguchi_nana__", "text": "リフトアップ手術について他の方にコメントしたところ、反応があったので38歳から６回以上のリフトアップ手術、糸、レーザー、ボト、ヒアルなど様々な美容医療をした私に質問があれば、お答えします🖐️\nちなみに、７回目は来月くらいにします☺️", "permalink": "https://www.threads.com/@yamaguchi_nana__/post/DWhzp2rE2sz", "likes": 25, "velocity": 0.01, "ageHours": 3640.8, "postedAt": "2026-03-31T09:11:40+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3926194054697678879", "username": "yui_ensoleille", "text": "1〜2ヶ月前くらいからかな？\nめっちゃ毛が抜ける。\nシャンプーとドライヤーの後、引くくらい抜ける。\n髪の毛のボリュームがすごい減ってきて落ち込む。\nとりあえず皮膚科受診したらいいんですかね？\n髪は女の命というけれど、本当にごっそり抜けると気持ちが滅入る…", "permalink": "https://www.threads.com/@yui_ensoleille/post/DZ8pLDdgXgf", "likes": 24, "velocity": 0.01, "ageHours": 1601.1, "postedAt": "2026-06-24T08:53:45+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3953023054477507212", "username": "forcehair_kanayama", "text": "髪質改善ストレートってなんですか？", "permalink": "https://www.threads.com/@forcehair_kanayama/post/Dbb9YYnD7qM", "likes": 23, "velocity": 0.03, "ageHours": 712.7, "postedAt": "2026-07-31T09:18:11+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3862078009944202044", "username": "beautyblog3010", "text": "無印の頭皮スプレー、ほんとに良いです👍\n長期使用してみて、頭皮の臭いがなくなった感じがします。\n\nピンク：育毛エッセンス（髪の根元を強化して、髪を長く育てる）\nグレー：乾燥した敏感な頭皮の調整、フケの改善。", "permalink": "https://www.threads.com/@beautyblog3010/post/DWY23zlkls8", "likes": 23, "velocity": 0.01, "ageHours": 3724.2, "postedAt": "2026-03-27T21:46:37+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3913590855387305615", "username": "___18grm", "text": "某フェイシャルエステサロンでの出来事。\n約1年前、子ども向けの商業施設に子どもを連れて遊びに行った時に、「ハンドマッサージ無料でやります」と某サロンが来ていて、やってもらいました。\nその後フェイシャルエステのお試し体験に誘われ、育児で疲れていたのもあり受けることにし、うまいこと誘導されてマッサージクリームを購入しその後も定期的にフェイシャルエステに通っています。\nエステ後は効果を実感し、自分の肌の綺麗さに驚くのですが、某サロンの商品のライン使いを勧められますが金銭的な問題でやんわり断っていました。\nですが今日、エステに行くと店長も同席で「1年通っているけど肌の状態が向上しないのは自宅でのケアが自己流だからだ。どういう思いでこれまで通ってきた？自社の製品のライン使いについてどう思ってる？」という主旨のことを言われ、「金銭的なこともありライン使いには手を出せないのが現状です」ということを伝えました（過去にも同じことを伝えてます）\nすると１つグレードを下げたシリーズの提案をされ、「この金額ならどうだろう？手出せそうかな？」と…。", "permalink": "https://www.threads.com/@___18grm/post/DZP3iXbk9aP", "likes": 23, "velocity": 0.01, "ageHours": 2018.4, "postedAt": "2026-06-06T23:33:27+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3917151782078485948", "username": "kumi_biyo_official", "text": "40代イチゴ鼻がガチで治らん人に断言するで🔥原因知らんとケアしてる。毛穴の中の皮脂を溶かして排出するために、サリチル酸洗顔を夜だけやって！だから、、、", "permalink": "https://www.threads.com/@kumi_biyo_official/post/DZchMq2E5W8", "likes": 22, "velocity": 0.01, "ageHours": 1900.5, "postedAt": "2026-06-11T21:28:22+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3966694252285519634", "username": "o_dai_o_dai", "text": "お願いですから、メモってください。\n\n・フィナステリドは「AGAの進行を抑える“守り”。発毛剤とは役割が違う」\n・デュタステリドは「フィナステリドとは作用範囲が違う。自己判断で乗り換えるな」\n・外用ミノキシジルは「発毛を促す“攻め”。多く塗っても早く生えるわけじゃない」\n・高濃度ミノキシジルは「", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DcMh2fwD-cS", "likes": 22, "velocity": 0.08, "ageHours": 260.0, "postedAt": "2026-08-19T06:00:25+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3962641985229039978", "username": "partage_877kobe_facial", "text": "質問ーーーー！！！\n\nフェイシャルエステに行こって思うタイミングってなんですか？🤔", "permalink": "https://www.threads.com/@partage_877kobe_facial/post/Db-IeP9oClq", "likes": 22, "velocity": 0.06, "ageHours": 394.1, "postedAt": "2026-08-13T15:49:17+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3926986628183055036", "username": "sakadatimama", "text": "美容おばけの千賀くんも、小田切ヒロさんも2人で鬼推ししてる！セラムなんだけど、ニキビ跡もシミもやばい目立たなくなるの控えめに言って神がかってる。", "permalink": "https://www.threads.com/@sakadatimama/post/DZ_dYhCj1q8", "likes": 22, "velocity": 0.01, "ageHours": 1574.8, "postedAt": "2026-06-25T11:08:27+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3969868044885397396", "username": "ikuta2323", "text": "左が5月に撮影したつむじ。 そして2枚目が8月7日。\nそして3枚目が8月16日に撮影したつむじ。\n\nちょっとつむじ周辺の髪の毛の立ち上がりが気になる。\nデュタスタステリドの初期脱毛はなかなか手強かった。\n2枚目とかかなり焦った1枚ですね😂", "permalink": "https://www.threads.com/@ikuta2323/post/DcXzfQckY-U", "likes": 21, "velocity": 0.14, "ageHours": 154.9, "postedAt": "2026-08-23T15:06:10+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3958047541321494858", "username": "ketsuryu.chan2", "text": "急に抜け毛が増えた人には、ある共通点がある。体の中で、糖化が進んでいるケースがとても多い。糖化とは、", "permalink": "https://www.threads.com/@ketsuryu.chan2/post/Dbtz0Sok3FK", "likes": 21, "velocity": 0.04, "ageHours": 546.3, "postedAt": "2026-08-07T07:40:57+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3945118889738994278", "username": "eclart.ceo", "text": "ハゲそう👨‍🦲", "permalink": "https://www.threads.com/@eclart.ceo/post/Da_4Lpjk4Jm", "likes": 21, "velocity": 0.02, "ageHours": 974.4, "postedAt": "2026-07-20T11:34:01+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3913332851081290446", "username": "yumi__i_am", "text": "重盛さとみときほちゃんが紹介してた美顔器、即効性ありすぎてすごい‼️\nお肌ケアというよりも、リフトアップ効果重視💆‍♀️\nアラフォーの私には今すぐに必要...と思ってすぐポチった🤭🤭この2人憧れだから私も頑張ろう〜", "permalink": "https://www.threads.com/@yumi__i_am/post/DZO836MkSLO", "likes": 21, "velocity": 0.01, "ageHours": 2026.9, "postedAt": "2026-06-06T15:01:15+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3967962167130529882", "username": "masao_miyoshi", "text": "カットしたばかりだが、やっぱり薄毛か？😱\n最近抜け毛が目立つような気がするし😇\nAGA治療でも始めてみようかな？😅", "permalink": "https://www.threads.com/@masao_miyoshi/post/DcRCJFeASBa", "likes": 19, "velocity": 0.09, "ageHours": 218.0, "postedAt": "2026-08-20T23:59:33+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3951503992139379535", "username": "motemen_fusafusa", "text": "炎上覚悟で言います。『頭皮マッサージ』はマジでヤバい習慣だよ😳\nふさふさのまま年齢を重ねてる人と、20代で生え際が後退していく人。その差を何度も聞いてきて、頭皮マッサージの恐ろしさに気づいたの。\n何が恐ろしいかっていうと、誰でもできるのに効果がありすぎること。", "permalink": "https://www.threads.com/@motemen_fusafusa/post/DbWj_HkAXNP", "likes": 19, "velocity": 0.02, "ageHours": 763.0, "postedAt": "2026-07-29T07:00:05+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3877278326930355717", "username": "m_midori_molecular", "text": "急増する若い女性の薄毛。\n最近、10代や20代といった若い女性の間で「抜け毛」や「分け目の薄さ」に悩む人が急増している。実はその背景には、現代のライフスタイルが引き起こす深刻な栄養エラーと体からのSOSが隠されている。\n\n若くして髪の薄毛を気にする女性たちは、主に以下の3つの「エラー」が起きていることが多い。", "permalink": "https://www.threads.com/@m_midori_molecular/post/DXO3Bh8ATYF", "likes": 19, "velocity": 0.01, "ageHours": 3220.8, "postedAt": "2026-04-17T21:06:56+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策"]}, {"id": "3946719935133301151", "username": "mami_nslove", "text": "【世間が思うたるみ改善】\n・ハイフ\n・糸リフト\n・小顔矯正\n・美顔器\n・マッサージ\n\n【本当のたるみ改善】￼", "permalink": "https://www.threads.com/@mami_nslove/post/DbFkN7Rkrmf", "likes": 19, "velocity": 0.02, "ageHours": 921.4, "postedAt": "2026-07-22T16:35:01+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3930137856878710133", "username": "mayukaphyto", "text": "自己免疫疾患で、髪の毛が9割抜けた過去があります。でも今は完全に自毛が生え戻り、寛解してから15年間、一度も症状が出ていません。治すためにお金も時間も膨大に費やしたけど、本質的にやったことは1つだけ。", "permalink": "https://www.threads.com/@mayukaphyto/post/DaKp47dkg11", "likes": 17, "velocity": 0.01, "ageHours": 1470.5, "postedAt": "2026-06-29T19:29:23+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3937064498016420231", "username": "fusafusa_gingin", "text": "ハゲへ。AGAクリニックの医師が患者には絶対に言わない真実がある。それが、", "permalink": "https://www.threads.com/@fusafusa_gingin/post/DajQ00uEgGH", "likes": 16, "velocity": 0.01, "ageHours": 1241.1, "postedAt": "2026-07-09T08:51:23+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3856603886757479504", "username": "tsudobarai.keana", "text": "フェイシャルエステは美容師免許必要ってほんと？", "permalink": "https://www.threads.com/@tsudobarai.keana/post/DWFaM1FkgRQ", "likes": 16, "velocity": 0.0, "ageHours": 3905.5, "postedAt": "2026-03-20T08:30:31+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3884821040006938925", "username": "hairsalon.kinu", "text": "２ヶ月の変化。まだまだ続けます\n育毛は《予防ケア》が1番大切☝️\n早ければ早いスタートほど良いし、回数と量は重要ですね。\n育毛剤、サプリ、AGA薬に頼らない最新の育毛、白髪改善方法をマニアックに研究しているオタク美容師です。\n常に自分が実験台。\n髪とボリュームは頭皮の奥から変える必要があります😊土台こそが全て👍", "permalink": "https://www.threads.com/@hairsalon.kinu/post/DXpqCc5k8Et", "likes": 15, "velocity": 0.01, "ageHours": 2971.1, "postedAt": "2026-04-28T06:52:57+09:00", "genres": ["薄毛", "育毛"], "keywords": ["髪 ボリューム", "育毛剤"]}, {"id": "3907677224859001842", "username": "mokon_chan", "text": "45歳を過ぎてから、「1日3食きっちり食べる人」ほど髪のボリュームに悩みやすい。\n朝は豆乳、昼はヘルシーな定食、夜もしっかり、間食にナッツ。そんな「模範的な食生活」のはずなのに、抜け毛が変わらない。夕方になると顔がくすむし、疲れが抜けきらない。\n良かれと思ったその習慣が、大人の髪に必要な「ある若返りシステム」を1日中潰し続けている可能性がある。\nそのシステムとは、", "permalink": "https://www.threads.com/@mokon_chan/post/DY627t0muPy", "likes": 15, "velocity": 0.01, "ageHours": 2214.2, "postedAt": "2026-05-29T19:44:07+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3963174429891190197", "username": "mari_kimiwada", "text": "薄毛白髪専門家からハッキリ言っておきます！\n無印の商品が白髪・育毛にいいとか流行ってるが…\nそれに飛びついてる人、老化加速します！だって", "permalink": "https://www.threads.com/@mari_kimiwada/post/DcABiVsk121", "likes": 14, "velocity": 0.04, "ageHours": 376.5, "postedAt": "2026-08-14T09:27:09+09:00", "genres": ["薄毛", "育毛"], "keywords": ["薄毛 対策", "つむじ 薄毛", "発毛", "抜け毛 対策"]}, {"id": "3949043241849074623", "username": "emuji_ikumou", "text": "AGAクリニックに怒られそうだけど、ハッキリ言います。\nまともなAGA治療薬は、たった3つしかありません。それ以外を「これも効きますよ」って勧めてくるクリニックは、正直警戒したほうがいい。その3つっていうのが、", "permalink": "https://www.threads.com/@emuji_ikumou/post/DbN0efREjO_", "likes": 14, "velocity": 0.02, "ageHours": 844.4, "postedAt": "2026-07-25T21:31:03+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3974032757189840293", "username": "biyou_honto_rinaa", "text": "ペプチド最強なのに、なんでみんな使わないの。美容クリニックで8年働いてきて、ずっと疑問だった。たるみが改善した人って、、", "permalink": "https://www.threads.com/@biyou_honto_rinaa/post/DcmmbzCEQ2l", "likes": 14, "velocity": 0.83, "ageHours": 17.0, "postedAt": "2026-08-29T09:00:43+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3933045399363323074", "username": "oyausuge", "text": "薄毛で来られる方の8割が、\n\n頭皮の血流が\n普通の人の半分以下、\n\nという結果でした", "permalink": "https://www.threads.com/@oyausuge/post/DaU-_PaiQTC", "likes": 13, "velocity": 0.01, "ageHours": 1374.2, "postedAt": "2026-07-03T19:46:09+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3933813718883432112", "username": "fusafusa_gingin", "text": "知ってるか。発毛に使うミノキシジル、仕組みとしては「血流を良くする」だけなんだ。逆に言うと体温を上げるだけで同等の効果が期待できる。まず、", "permalink": "https://www.threads.com/@fusafusa_gingin/post/DaXtrwumvaw", "likes": 13, "velocity": 0.01, "ageHours": 1348.8, "postedAt": "2026-07-04T21:12:40+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3964196686776284739", "username": "niisa233", "text": "教えてください。\n\n夫が薄毛治療をはじめたいと言い出して\nみなさん、どこでお薬をもらっていますか？\n\n皮膚科？\nAGA外来？\nオンライン？\n\n10年前から薄くなり始めて\nM字と後頭部が薄いです。\n\n検索魔になってしまい、余計にわからなくなりました💦", "permalink": "https://www.threads.com/@niisa233/post/DcDp-InFLZD", "likes": 13, "velocity": 0.04, "ageHours": 342.7, "postedAt": "2026-08-15T19:18:12+09:00", "genres": ["育毛", "薄毛"], "keywords": ["発毛", "AGA"]}, {"id": "3916412780484384939", "username": "natsumi19870912", "text": "久しぶりの投稿です！\nプロファイロを打って1ヶ月。\nむくみもなくなり完成かな？\n確かに肌艶はよくなります。\nすっぴんですがツヤッとします。\nただ…\nリフトアップ効果はないかな？\nただ3週間は顔がむくみますので\n失敗！？ええええ😭！？\nとなりますが、見事にひきました笑", "permalink": "https://www.threads.com/@natsumi19870912/post/DZZ5Kx-klir", "likes": 13, "velocity": 0.01, "ageHours": 1925.0, "postedAt": "2026-06-10T21:00:06+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3901645536818740003", "username": "jimu_neesan", "text": "20代のうちにやっておきたい施術3選\n※個人的な意見です\n\n3位：ボトックス（予防打ち）\n→シワになる前に打つのが正解\n早めにケアするほどコスパがいい💉\n2位：ハイフ（HIFU）\n→たるみケアは20代から始めると全然違う\nリフトアップ効果で輪郭がすっきり✨", "permalink": "https://www.threads.com/@jimu_neesan/post/DYlbfGlkbsj", "likes": 13, "velocity": 0.01, "ageHours": 2414.0, "postedAt": "2026-05-21T12:00:14+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3901201845230418032", "username": "horumi_yuragibiyou", "text": "前髪に白髪が多い人が、一番やりがちなミスを言います。前髪・生え際の白髪は、胃腸の疲れのサイン。だから亜鉛サプリを飲んでも、頭皮マッサージをしても変わらない。胃腸が整っていないと、栄養が髪に届く前になくなっているんです。私も最初、白髪の生える場所を気にせずに亜鉛サプリを半年飲み続けました。でも変わらず....(泣)婦人科医の夫に話したら、￼", "permalink": "https://www.threads.com/@horumi_yuragibiyou/post/DYj2mimDrhw", "likes": 12, "velocity": 0.0, "ageHours": 2428.7, "postedAt": "2026-05-20T21:18:42+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3950447004606259158", "username": "temari.yakuzen", "text": "抜け毛や薄毛が気になる人、\n頭のてっぺんを\n指で押してみて。\n\nブヨブヨしてるか\nガチガチに硬いなら\n頭皮の血行が\n滞っているサインで、", "permalink": "https://www.threads.com/@temari.yakuzen/post/DbSzp7Nj9_W", "likes": 12, "velocity": 0.02, "ageHours": 798.0, "postedAt": "2026-07-27T20:00:02+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3889144170669810257", "username": "chie.kogao.design", "text": "小顔にならない女性には、共通する特徴がある。\n当てはまってないよね？\n\n1.足が…￼", "permalink": "https://www.threads.com/@chie.kogao.design/post/DX5BASFDiJR", "likes": 12, "velocity": 0.0, "ageHours": 2827.9, "postedAt": "2026-05-04T06:02:15+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3878653271968366560", "username": "yuu_mens_beauty", "text": "【M字ハゲの男性に似合う髪型がこの5つ👇️】\n\n・アップバング（前髪上げスタイル）\n・ソフトモヒカン（トップに高さ）\n・ツーブロック＋ショート（メリハリ型）\n・ナチュラルパーマ（動きでぼかす）\n・ベリーショート（潔く短く）\n\nM字ハゲ・生え際後退タイプは、「隠す」よりも活かす・ぼかす・視線を分散させるのがポイント！\n\nソフトモヒカンやツーブロックのようにして、トップにボリュームを持たせるのもおすすめ。", "permalink": "https://www.threads.com/@yuu_mens_beauty/post/DXTvpnSlL_g", "likes": 11, "velocity": 0.0, "ageHours": 3175.3, "postedAt": "2026-04-19T18:38:42+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3961261069842652924", "username": "opa_biyou32", "text": "全女性に伝えたい。高い美容医療なしで毛穴・くすみを改善するのに『ナイアシンアミド』は最強なんだけど、単体で使うともったいない。この4つの組み合わせで使って、", "permalink": "https://www.threads.com/@opa_biyou32/post/Db5OfSSjh78", "likes": 10, "velocity": 0.02, "ageHours": 439.9, "postedAt": "2026-08-11T18:05:39+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3968491265637085659", "username": "megan_jpn", "text": "美容に詳しい人〜👋\n実体験で、リフトアップに効いた化粧品を教えてください。👏✨\nたるみがすんごい気になる。\n今年40才だもん、重力に負けるわ。🛸👽", "permalink": "https://www.threads.com/@megan_jpn/post/DcS6ce2ifHb", "likes": 10, "velocity": 0.05, "ageHours": 200.5, "postedAt": "2026-08-21T17:30:46+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3923995465620842337", "username": "50hayasu", "text": "52歳。生え際が後退している現実を認めることにした。\n\n中学の頃からハゲるのが怖かった。\n\n実家が美容室だったこともあって、\n育毛剤だけはずっと身近にあった。\n\nそれでも50代になると、\n鏡を見るたびに生え際が気になる。\n\nだから今は、現実から目を逸らさずに記録していく。", "permalink": "https://www.threads.com/@50hayasu/post/DZ01RX0kudh", "likes": 9, "velocity": 0.01, "ageHours": 1673.9, "postedAt": "2026-06-21T08:05:33+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3974049657139754232", "username": "takahashishota.co.jp", "text": "そして、アワード表彰式。\n今回、エクセルグロー（三和紙工）賞で和多くの作品が商品化されることになり感動。\nみんなで考えた甲斐あったな！\nエクセルグローさま、素晴らしい企画とご支援を誠にありがとうございます！\nお披露目は松山、文具フェスタで！！\n個人的MVPはAGAと色部さんのツーショットでした笑", "permalink": "https://www.threads.com/@takahashishota.co.jp/post/DcmqRuVk_T4", "likes": 9, "velocity": 0.55, "ageHours": 16.4, "postedAt": "2026-08-29T09:34:17+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3964157219180756668", "username": "oyausuge", "text": "これまで100名以上の薄毛の方を診てきて、\n気づいたことのひとつが、\n\n薬で生やした髪と、\n自分の血流で生やした髪は、", "permalink": "https://www.threads.com/@oyausuge/post/DcDg_zjEb68", "likes": 8, "velocity": 0.02, "ageHours": 344.0, "postedAt": "2026-08-15T17:59:47+09:00", "genres": ["薄毛", "育毛"], "keywords": ["つむじ 薄毛", "発毛"]}, {"id": "3950394602281379588", "username": "lello_salon", "text": "【エステティシャン募集】\n⁡\n⁡\nアルバイトスタッフを1名募集いたします😌\n⁡\nカウンセリング、施術、スキンケアのアドバイスまで、肌質改善に専門特化した仕事内容になります✨\n⁡\n【勤務時間】\n11:30〜20:00まで（終わり次第早上がり可能）\n⁡\n【勤務日数】\n週2日以上で応相談\n⁡\n【応募条件】\n美容の知識や経験がある人（美容・化粧品業界での勤務経験がある、美容専門学校を卒業している、化粧品検定1級などの資格を持っている etc...）\n⁡\n面接希望者様は、\n⁡\n⚫︎氏名\n⚫︎生年月日\n⁡\nご記載の上、DMまでご連絡をお待ちしております✉️\n⁡\n⁡\n#肌質改善サロン #エステティシャン", "permalink": "https://www.threads.com/@lello_salon/post/DbSnvXvmicE", "likes": 8, "velocity": 0.01, "ageHours": 799.7, "postedAt": "2026-07-27T18:15:56+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3890230248268776824", "username": "yuu_mens_beauty", "text": "【薄毛対策ミスる人多すぎ🤚】\n\n■ハゲる人の習慣↓\n・気になり始めて育毛剤を使う\n・頭皮マッサージをする\n・まだ若いからと放置\n・タバコ吸ってる\n\n■ハゲない人の習慣がこれ↓", "permalink": "https://www.threads.com/@yuu_mens_beauty/post/DX838yqikV4", "likes": 7, "velocity": 0.0, "ageHours": 2792.0, "postedAt": "2026-05-05T18:00:05+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3900468080970567150", "username": "biyou_sake", "text": "3年ずっと頭皮マッサージを続けてるのに\n顔がたるむ40代の方から相談を受けた。\n\n相談者「毎日ヘッドスパみたいに頭皮を揉んでます」\n私「揉むのは続けていいです」\n\n相「シャンプー前に5分しっかりほぐしてます」\n私「でも、たぶん抜けてる工程が1つあります」\n\n相「え…頭皮ケアって揉めばいいんですよね…」\n私「半分は合ってるんです。ただ、\n順番というより、もう1つの方が、」", "permalink": "https://www.threads.com/@biyou_sake/post/DYhPw3YAA3u", "likes": 7, "velocity": 0.0, "ageHours": 2453.0, "postedAt": "2026-05-19T21:00:50+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3952596579676819673", "username": "outidesekkotsuin", "text": "美容鍼されてる鍼灸師さん\n美容鍼はどこで学ばれましたか？\nパルスの電気は入れず\nリフトアップを立体動態波の中にある\n電気を使ってやっていこうと思ってます😌\n同業者様もし教えていただけるのであれば\n教えて頂きたいです🙇‍♀️", "permalink": "https://www.threads.com/@outidesekkotsuin/post/DbacaXAD5DZ", "likes": 7, "velocity": 0.01, "ageHours": 726.8, "postedAt": "2026-07-30T19:10:51+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3945947716446524830", "username": "o_dai_o_dai", "text": "断言するけど、薄毛で一番の犯人はシャンプーじゃない。前髪やつむじが気になる人ほど、真っ先に育毛剤と頭皮マッサージを始める。でも止まらない。じゃあ何が原因か。頭皮の表面ではなく、毛根で髪が細くなっていることが多い。", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbC0oqlDxWe", "likes": 6, "velocity": 0.01, "ageHours": 947.0, "postedAt": "2026-07-21T15:00:45+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "つむじ 薄毛"]}, {"id": "3863169070821183460", "username": "8181.asobana", "text": "50代女性、\nトップの薄毛で悩んでます😭\n\n全体はまだ大丈夫なんですが、つむじ〜分け目あたりが気になってきて💦\n\nレディースウィッグ（特に部分用・ヘアピース）を探してるんですが、\nネットで調べても種類が多すぎて\nどれがいいのか分からず…\n\n「エクステシートタイプ（約28,000円）」が気になってたんですが在庫切れでした🥲\n\nできれば\n・お財布に優しめ\n・装着が簡単\n・今ある髪に負担が少ない\n・できれば手入れも楽\n\nこんな感じのウィッグやヘアピースで\n「これ良かったよ！」っていうのがあれば教えてほしいです🙏\n\n実際に使ってる方のリアルな感想も聞きたいです✨", "permalink": "https://www.threads.com/@8181.asobana/post/DWcu81Nko_k", "likes": 6, "velocity": 0.0, "ageHours": 3688.1, "postedAt": "2026-03-29T09:54:22+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3958339096946684226", "username": "biyou_mochi", "text": "炎上覚悟で言います。「頭皮マッサージ」はマジでヤバい習慣です。高いリフトアップ美容液買い替えてきて、頭皮マッサージの恐ろしさにようやく気づいた。\n何が恐ろしいかというと、", "permalink": "https://www.threads.com/@biyou_mochi/post/Dbu2G--DDFC", "likes": 6, "velocity": 0.01, "ageHours": 536.6, "postedAt": "2026-08-07T17:20:13+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3945404087814795321", "username": "o_dai_o_dai", "text": "薄毛治療10年以上やって気づいた。\nホントにやめたほうがいいのは、「スカルプシャンプー」や「育毛剤」ではなくて、", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbA5B09kzA5", "likes": 5, "velocity": 0.01, "ageHours": 965.0, "postedAt": "2026-07-20T21:00:40+09:00", "genres": ["薄毛", "育毛"], "keywords": ["薄毛 対策", "抜け毛 対策"]}, {"id": "3964640865481275240", "username": "o_dai_o_dai", "text": "実際にやって良かった薄毛対策10選😳\n\n・10位：月1で前髪とつむじを撮影\n（毎日の鏡より変化が分かる）\n・9位：抜け毛の本数を数えない\n（短く細い毛を見る）\n・8位：高級シャンプー探しをやめる\n（AGA治療とは別物）\n・7位：タンパク質・鉄・亜鉛を不足させない\n（髪の土台）\n・6位：個人輸入をやめる\n（薬は医師に相談できる環境で）\n・5位：外用ミノキシジルを用法どおり使う\n（多く塗っても早く生えない）", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DcFO9yRAjdo", "likes": 5, "velocity": 0.02, "ageHours": 328.0, "postedAt": "2026-08-16T10:00:42+09:00", "genres": ["薄毛", "育毛"], "keywords": ["つむじ 薄毛", "抜け毛 対策"]}, {"id": "3936372328049802326", "username": "sana_oniku", "text": "紗栄子さんや小田切ヒロさんが推してたプライマー使ってみたら、鼻の毛穴が隠れて感動した✨\n肌の凸凹をきれいに埋めてくれる感じがします。\nみなさんが手放せないお気に入りの化粧下地ってありますか？", "permalink": "https://www.threads.com/@sana_oniku/post/DagzcbNFfxW", "likes": 4, "velocity": 0.0, "ageHours": 1264.0, "postedAt": "2026-07-08T09:56:15+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3965140650216892924", "username": "key_kun_mom", "text": "もうすぐ1歳半になる娘が見事な薄毛です。\n早生まれなので七五三は満3歳でやればあと2年ちょっと猶予があるとは思いつつ、これほどまでに薄毛ガールはいつになったら髪の毛伸びてくるもんなんでしょうか？\n似たようや薄毛ガールの方の情報教えて欲しいです！", "permalink": "https://www.threads.com/@key_kun_mom/post/DcHAmnEo6n8", "likes": 4, "velocity": 0.01, "ageHours": 311.4, "postedAt": "2026-08-17T02:33:41+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3957024109753863483", "username": "official_paramiclinic", "text": "同一人物です。\n変わったのは、生え際だけ🌸\n\n#植毛 #AGA #薄毛治療 #ビフォーアフター", "permalink": "https://www.threads.com/@official_paramiclinic/post/DbqLHZtiQ07", "likes": 4, "velocity": 0.01, "ageHours": 580.2, "postedAt": "2026-08-05T21:47:34+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3974338122259557934", "username": "masa.agabye", "text": "ハゲたくないならこれ覚えとけ10選👊\n\n① 抜け毛だけ見るな。毛の細さも見ろ\n② AGAは進行性。様子見はおすすめしない\n③ DHTは覚えとけ。AGAに関わる男性ホルモン\n④ フィナは進行を抑える薬。DHTの生成を抑える\n⑤ デュタは作用範囲が広い。フィナとの違いはここ\n⑥ ミノキは発毛を促す。フィナとは役割が違う\n⑦ 育毛と発毛は別だ。ごっちゃにするな\n⑧ シャンプーだけに期待するな。AGA治療とは別物\n⑨ 遺伝でも諦めるな。親父の頭＝お前の未来じゃない\n⑩ 薬は自己判断するな。医師と相談して決めろ\n\n今年こそハゲ辞めるぞ", "permalink": "https://www.threads.com/@masa.agabye/post/Dcnr3caku4u", "likes": 4, "velocity": 0.58, "ageHours": 6.8, "postedAt": "2026-08-29T19:07:25+09:00", "genres": ["薄毛", "育毛"], "keywords": ["AGA", "発毛"]}, {"id": "3960653623860373756", "username": "momo_biyo321", "text": "バズってるこれ。毛穴消えるでお馴染みらしいけど正直に言うね。「一瞬で毛穴消えて神〜」はごめんけどない🙅🏻でもね…", "permalink": "https://www.threads.com/@momo_biyo321/post/Db3EXyIj6j8", "likes": 4, "velocity": 0.01, "ageHours": 460.0, "postedAt": "2026-08-10T21:58:46+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3947971002407333380", "username": "o_dai_o_dai", "text": "早く知ればよかった薄毛対策↓\n\n🥉論外（金ドブになりやすい）\n・高いだけのスカルプシャンプー\n・根拠の弱い発毛サプリ\n・頭皮を強く刺激するマッサージ器\n\n🥈惜しい（悪くないけど役割が違う）\n・低刺激シャンプー\n・亜鉛やビオチンのサプリ\n・育毛トニックの単品使い\n・頭皮用美容液だけ\n・タンパク質を意識した食事\n\n🥇ガチで将来に差がつく対策", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbKArWeCC4E", "likes": 3, "velocity": 0.0, "ageHours": 880.0, "postedAt": "2026-07-24T10:00:40+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3935068598268699007", "username": "firstpenguin_is", "text": "最近「髪ツヤツヤだね」って言われること増えたんだけど、絶対これのおかげだと思う✨\n以前は朝起きるたびに枕見て落ち込んでたのに、今はボリュームも出てきて\n\n同じ悩みあった人いる？もっと早く出会いたかったやつ", "permalink": "https://www.threads.com/@firstpenguin_is/post/DacLAqOmaF_", "likes": 3, "velocity": 0.0, "ageHours": 1307.2, "postedAt": "2026-07-06T14:45:53+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3953834512312565986", "username": "days_mo_ni", "text": "高いオイルもバームも何使っても癖毛大ボリュームヤチボウズハグリッドになってたんだけど\n同じく癖毛の子に相談したら「ベビーオイルがいいよ〜」って教えてもらって。\nお風呂後に揉み込んで寝たら\n朝起きてまとまりすぎてて感動した😭😭(寿司がアフターね)\n頑張って伸ばせそう〜", "permalink": "https://www.threads.com/@days_mo_ni/post/Dbe14pnEgDi", "likes": 3, "velocity": 0.0, "ageHours": 685.8, "postedAt": "2026-08-01T12:10:24+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3966416118433329123", "username": "yasunari_akiba_peace", "text": "ペロリコオススメです。\n使ってみてください。\n発毛クリニックでも使われてる世界的特許の機能性ペプチドを高配合されてるシャンプー、コンディショナー、育毛剤です。\n当店でも90%以上のお客様にしっかりとした効果があります。\nお近くに取り扱いの理美容室があれば1度ご相談してみて下さい。", "permalink": "https://www.threads.com/@yasunari_akiba_peace/post/DcLinHami_j", "likes": 3, "velocity": 0.01, "ageHours": 269.2, "postedAt": "2026-08-18T20:47:49+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3906998884375885979", "username": "festa201206", "text": "「毛穴消えるわよぉ〜」って\n小田切ヒロさんの聞いて即ポチ。🥹\nこれ当たりだった…。\n1ヶ月続けたらお肌つるんつるん。w\n毛穴ケアって、こーゆー事ね。", "permalink": "https://www.threads.com/@festa201206/post/DY4cskBEnib", "likes": 3, "velocity": 0.0, "ageHours": 2236.7, "postedAt": "2026-05-28T21:16:23+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3970626307495381579", "username": "nori_jinsei_lab", "text": "AGA治療、始めて1年3ヶ月経過。", "permalink": "https://www.threads.com/@nori_jinsei_lab/post/Dcaf5biFUpL", "likes": 3, "velocity": 0.02, "ageHours": 129.7, "postedAt": "2026-08-24T16:12:52+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3973970177821925130", "username": "o_dai_o_dai", "text": "お願いですから、メモってください。 \n薄毛治療10年以上、育毛剤でかなり遠回りした俺からのお願いです。\n\n・育毛剤は「AGAの進行を止める薬ではありません」\n・育毛シャンプーは「頭皮を洗うもの。発毛治療ではありません」\n・頭皮マッサージは「気持ちいい。でもAGA治療の代わりにはなりません」\n・亜鉛サプリは「不足を補うもの。AGAを治すものではありません」\n・フィナステリドは「AGAの進行を抑える“守り”です」\n・デュタステリドは「作用範囲が違う“守り”の選択肢です」\n・外用ミノキシジルは「", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DcmYNJdEl8K", "likes": 3, "velocity": 0.16, "ageHours": 19.0, "postedAt": "2026-08-29T06:56:23+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3964920156567757171", "username": "aru.pska.no.suke", "text": "AGAの治療したいんだけど、トランスジェンダーで毎月男性ホルモン注射打ちながらって意味あるんかな....", "permalink": "https://www.threads.com/@aru.pska.no.suke/post/DcGOeAXAeFz", "likes": 3, "velocity": 0.01, "ageHours": 318.7, "postedAt": "2026-08-16T19:15:36+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3887433089312117504", "username": "sacchan_moto_biyou", "text": "小田切ヒロ様が「毛穴消えるわよ〜！！！」って言ってたクレンジング、黒ずみ＆角栓まとめて崩壊した。1回で変化出るのに、使い続けたら毛穴どこ？状態。これで2000円以下は意味わからん。", "permalink": "https://www.threads.com/@sacchan_moto_biyou/post/DXy78xYjFMA", "likes": 3, "velocity": 0.0, "ageHours": 2884.6, "postedAt": "2026-05-01T21:22:38+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3880031307468573493", "username": "noar_hairatelier", "text": "私が20代半ばで抜け毛で悩み、改善できた方法↓\n正直安心しました。", "permalink": "https://www.threads.com/@noar_hairatelier/post/DXYo-q3Dws1", "likes": 2, "velocity": 0.0, "ageHours": 3129.7, "postedAt": "2026-04-21T16:16:37+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3925082250320752128", "username": "kamonohasi.aga", "text": "怖い話。\n生え際が1cm後退したら、\n放置した証拠だ。\nちなみに\n\nただ、知らない奴が多くて、", "permalink": "https://www.threads.com/@kamonohasi.aga/post/DZ4sYK8jy4A", "likes": 2, "velocity": 0.0, "ageHours": 1637.9, "postedAt": "2026-06-22T20:04:48+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3955165887045281884", "username": "kirary_jewels", "text": "この程度で言わないほうが良いのかなと思いつつ、お金も払ったし…という気持ちで相談です\n\n昨日の夕方、初めての美容室へ行きました\nヘアカラーとヘアカット、トリートメント、ヘッドマッサージのコースで予約しました\n\n口コミがとても良かったので期待して行き、カットもマッサージも大満足で帰りました\n\nしかし、帰宅後に切ってもらった前髪を上げたところ、おでこの真ん中の生え際が染まっていないことに気が付きました\n（画像が見づらく申し訳ありません、恥ずかしいですが白髪画像付けました）\n\n細い毛なので染まりきらなかったのか、それとも塗り残しなのか、前髪は下ろすので多少染まらなくても問題視されないものなのか…？\n\n今日は美容室が休みで連絡が出来ない\u0026私は明日から義両親が泊まりに来るなど連日予定がびっしりで、そのためにも綺麗にしたくて、限られた時間の中で行ったのでどうしたら良いものか…\n\nこういった少しの白髪が残るのは致し方ないのでしょうか\nお店に連絡して、お盆明けなどに染めてもらうなどの対応はしていただけるものなのでしょうか？", "permalink": "https://www.threads.com/@kirary_jewels/post/Dbjkms9E6hc", "likes": 2, "velocity": 0.0, "ageHours": 641.7, "postedAt": "2026-08-03T08:15:37+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3961073548542286049", "username": "tsubasa.agataisaku", "text": "友人に撮ってもらった集合写真。\nいつもと違う角度から見た自分の生え際に、\n正直かなりゾッとした。\n\n「あれ、こんなに後退してたっけ」\n\nその日から今日まで、7年かかりました。\n\nこれから数回に分けて、\n薄毛に気づいてから今に至るまでの\nリアルな話をしていこうと思います。\n\n長くなるので、興味ある人だけ\nゆっくり読んでもらえたら嬉しいです🧵", "permalink": "https://www.threads.com/@tsubasa.agataisaku/post/Db4j2feDxjh", "likes": 2, "velocity": 0.0, "ageHours": 446.1, "postedAt": "2026-08-11T11:53:05+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3944620318039775049", "username": "non.biyouu", "text": "薄毛、気づいた時にはもう進んでる。これ、薄毛に悩んでる人にとって一番怖い現実。分け目が目立ってきた、つむじが透けて見える、抜け毛が増えた。そう感じ始めたら、今すぐ動いてほしい。", "permalink": "https://www.threads.com/@non.biyouu/post/Da-G0eejJdJ", "likes": 2, "velocity": 0.0, "ageHours": 990.9, "postedAt": "2026-07-19T19:03:27+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3936585794424861571", "username": "o_dai_o_dai", "text": "40代入ってヤバいくらい髪が薄くなった人いる？\n「前髪が割れるようになった」「つむじが白く透ける」「過去最高にセットが決まらない」などなど...\n同じ人が多いから原因を話すね。", "permalink": "https://www.threads.com/@o_dai_o_dai/post/Dahj-xQivOD", "likes": 2, "velocity": 0.0, "ageHours": 1257.0, "postedAt": "2026-07-08T17:00:17+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3901094220890448589", "username": "usuge_cut_kurita", "text": "つむじハゲのカットはブロッキングがめちゃ大事！\n毛流れに合わせて切ったらこうならない。\n美容師はキレイにコーミングして切っちゃうから薄毛の人が切れない。", "permalink": "https://www.threads.com/@usuge_cut_kurita/post/DYjeIZngSLN", "likes": 2, "velocity": 0.0, "ageHours": 2432.2, "postedAt": "2026-05-20T17:44:52+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3929287258855961203", "username": "o_r_i__sa", "text": "朝アイロンしても、数十分したらうねり出し、すぐにこうなります。\n産後１年経っているので生えてきた毛が短い毛が内側にあります。\nそしておでこの生え際につむじが有り、立ち上がる癖があります。\n前髪を伸ばしてたのですが、産後の抜け毛からの伸びてきた毛が嫌過ぎて前髪を切ってしまい扱いがしづらくて悩んでます。\n前髪ストレートパーマかければ解消しますか？\nもし解決するならストレートパーマをかけたいのですが、\nつむじがある場合、立ち上がるのが強過ぎてストレートかけたら尚更立ち上がってしまいますか？\n朝にあまり自分に時間をかけたくないため、ストレートかけるか悩んでます。\n先月美容室行ったばかりだし、まだ産後でなかなか時間が取れないため美容室で質問もできず、もしスレッズでわかる方がいれば…と質問しています。\nよろしくお願いします。", "permalink": "https://www.threads.com/@o_r_i__sa/post/DaHofGUk_Jz", "likes": 2, "velocity": 0.0, "ageHours": 1498.6, "postedAt": "2026-06-28T15:19:24+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3916245030018163288", "username": "hairofseoul_jp", "text": "こちらは非切開植毛（FUE法）で3,200毛を移植し、1年後の経過を撮影したお写真です🌿\n\n元々の髪の流れに合わせ、違和感のない自然なヘアラインに仕上げました✨\n\n非切開は切らない手術のため、ダウンタイムも短く、施術後すぐの日常生活もOK！\n\nまた、出血や痛みも少なく、手術への負担も少ないので安心です😊\n\n負担の少ない非切開植毛で、自然なヘアラインを試してみませんか❓\n\n＃植毛 ＃自毛植毛 ＃薄毛 ＃つむじ ＃韓国アートメイク", "permalink": "https://www.threads.com/@hairofseoul_jp/post/DZZTBsLnyJY", "likes": 2, "velocity": 0.0, "ageHours": 1930.5, "postedAt": "2026-06-10T15:26:50+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3872563938756619916", "username": "akari_scalp_sleep", "text": "9割の人が知らない。髪がペタっとしてボリュームが出ないのは、脳のオーバーヒートが原因", "permalink": "https://www.threads.com/@akari_scalp_sleep/post/DW-HGJzk26M", "likes": 2, "velocity": 0.0, "ageHours": 3377.0, "postedAt": "2026-04-11T09:00:17+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3913273380674089271", "username": "kogao.aya.okayama", "text": "抜け毛が増えてきて、落ち武者感が増してきた。\n\n40代になってから、\n髪のボリュームが減った気がする。\n\n分け目は目立つし、\n鏡を見るたびに悲しい\n\nそれが解決できる唯一の方法が", "permalink": "https://www.threads.com/@kogao.aya.okayama/post/DZOvWgEEjE3", "likes": 2, "velocity": 0.0, "ageHours": 2028.9, "postedAt": "2026-06-06T13:02:41+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3958812231022379451", "username": "usuge_matome", "text": "妊娠中の女性が、パートナーのAGA治療薬に触れてしまったとき。\n慌てなくていい場合と、気をつけたい場合があります。", "permalink": "https://www.threads.com/@usuge_matome/post/Dbwhr_aj4G7", "likes": 2, "velocity": 0.0, "ageHours": 521.0, "postedAt": "2026-08-08T09:00:15+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3974368208588711256", "username": "masa.agabye", "text": "俺はM字ハゲでした\n\n20代後半、「ん？デコ広くなってね？」\nから俺の薄毛人生がスタート。\n\nそこから色々試した。アホみたいに金も使った。\n検索も死ぬほどした。そして普通に遠回りした。\n\n現在はAGA治療5年目。\n\nだからここでは昔の俺が知りたかったことを全部置いていく。\n\nAGAの知識も実際に試した薄毛対策も\n微妙だったものは微妙って言う。\n\n最近、生え際が怪しい。\nでも何すりゃいいか分からん。\n\nそんな奴はついてこい。\n俺が先に失敗しといたからな！！！", "permalink": "https://www.threads.com/@masa.agabye/post/DcnytQfiSVY", "likes": 2, "velocity": 0.33, "ageHours": 5.8, "postedAt": "2026-08-29T20:07:12+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3970431376109526883", "username": "chienom1", "text": "２１時前にアラームしといたらいいのかな🤔⏰\n\nhttps://x.com/aoringohuzin/status/2091678141618282520?s=12\u0026t=vO7HLec5pulgP197xt2AGA", "permalink": "https://www.threads.com/@chienom1/post/DcZzkziEt9j", "likes": 2, "velocity": 0.01, "ageHours": 136.2, "postedAt": "2026-08-24T09:45:25+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3921410368199582501", "username": "kazumi_counseling", "text": "「あっ、このサロンまた来たいな」と思わせるエステティシャンは、施術中の『会話』が全く違います。\n例えば、施術中にお客様とお話しする時。", "permalink": "https://www.threads.com/@kazumi_counseling/post/DZrpfQPEeMl", "likes": 2, "velocity": 0.0, "ageHours": 1759.5, "postedAt": "2026-06-17T18:29:25+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3972119387856080364", "username": "therapist.mori", "text": "📍新宿｜🪞完全予約制プライベートサロン\n男女ともにご利用いただけます！\n\nオールハンドで、顔も身体もすっきり軽やかに。\nリラクゼーションとして、自分にご褒美のリラックスタイムを…\n\n【全身オイルトリートメント】\n首から下をオイルで丁寧にトリートメント。首・肩まわり、背中、脚など、疲れやむくみが気になる方に…\nゆったりとした時間の中で、全身を心地よく整えていきます。\n\n【小顔リフトアップトリートメント】\nデコルテ・首・お顔までしっかりケア。\n顔まわりの筋肉をほぐし、筋肉を元の位置に戻していきます。むくみやフェイスラインが気になる方にオススメです♪\n\n※すべてのメニューにドライヘッドケア付き。\n\n完全個室のプライベート空間で、ゆっくりお過ごしください𓂃𓈒𓏸\n\n📍新宿\n👩🏻👨🏻 男女OK\n🌿 オールハンド施術\n💌 ご予約・お問い合わせはDM・公式LINEから\n\n#新宿リラクゼーション#新宿オイルトリートメント #オイルトリートメント #小顔リフトアップ #小顔ケア", "permalink": "https://www.threads.com/@therapist.mori/post/DcfzYm-mo3s", "likes": 2, "velocity": 0.02, "ageHours": 80.3, "postedAt": "2026-08-26T17:39:11+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3913974030869726607", "username": "efu.ikumou", "text": "育毛鍼で薄毛が改善\n「前髪が透けなくなりました！」\nやったことはたったの2つ！", "permalink": "https://www.threads.com/@efu.ikumou/post/DZROqTaGAWP", "likes": 1, "velocity": 0.0, "ageHours": 2005.7, "postedAt": "2026-06-07T12:14:45+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3966465529431640204", "username": "trinsachi", "text": "産後の抜け毛、本当に助けてください😭😭\n\n3人目にしてここまでの抜け毛は初めて😭\n想像してた産後の抜け毛レベルを完全に超えて、毎日数百本単位で抜けてます。\nもう本当に絶望してます😭\n\n床も布団も服も、子どものおもちゃも、\n家中どこもかしこも髪の毛だらけ。\n掃除しても掃除しても髪の毛が落ちてて、\n抜け毛を見るたびにイライラするし、メンタルが🥲\n\n生え際もどんどん薄くなってきて、前髪もほぼ消滅して\n鏡を見るたびに泣きそう😭\n\n産後の抜け毛を経験した方、\nいつ頃から落ち着きましたか？ちゃんと元に戻りましたか？😭\n\n「これやったらマシになった！」\n「これ飲んだ・食べた」\n「このシャンプーや育毛剤よかった」\n「何もしなくても○ヶ月で戻った」\n\n本当に何でもいいので教えてほしいです🙏🏻😭\nちゃんと髪が戻るっていう希望が欲しいです🥲\n\n経験談でも改善策でも何でもいいです。\n産後ハゲを経験した方、どうか知恵を貸してください😭🙏🏻\n\n#産後抜け毛 #産後ハゲ #抜け毛 #薄毛 #産後ママ #産後ケア #産後の悩み #育児ママ #ママさんと繋がりたい #先輩ママ教えて #産後抜け毛対策", "permalink": "https://www.threads.com/@trinsachi/post/DcLt2I_msiM", "likes": 1, "velocity": 0.0, "ageHours": 267.5, "postedAt": "2026-08-18T22:25:59+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3928401702374209631", "username": "kami_neesan_", "text": "【需要返信】分け目とつむじの薄毛、家でなんとかする方法をまとめてほしいてリクエストが多かったから本気で出すで。まず大前提：女の薄毛は男と根本的に違う。ここ間違えると一生遠回りするで。何がちゃうかっていうとな、", "permalink": "https://www.threads.com/@kami_neesan_/post/DaEfIjlDfhf", "likes": 1, "velocity": 0.0, "ageHours": 1528.0, "postedAt": "2026-06-27T09:59:59+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "つむじ 薄毛"]}, {"id": "3952942593289076435", "username": "o_dai_o_dai", "text": "髪が薄い人って、実は頭皮が悪い😭\nそう思って高級シャンプーや育毛剤を増やしがち。でも、前髪が割れる、つむじが透ける、短く細い毛が増えるなら、頭皮の汚れではなくAGAが進んでいる可能性があります。薄毛治療10年以上の俺も、商品に課金する前にこれを知りたかった。やることは💁こちら", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbbrFhSgb7T", "likes": 1, "velocity": 0.0, "ageHours": 715.3, "postedAt": "2026-07-31T06:38:19+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3883632420122207577", "username": "zero_xxcxx_", "text": "娘のヘアアレンジが難しすぎる😭\nくせ毛+薄毛ちゃん+つむじ後ろで前髪の境目も分からん😂\n\nいつもはちょんまげか後ろで二つ結びとかです、、\nどなたか…不器用にでもできる\n薄毛ちゃんのヘアアレンジ教えてくださーい💦\nもしよければお写真付きだと嬉しいです😭✨", "permalink": "https://www.threads.com/@zero_xxcxx_/post/DXlbxwXkyVZ", "likes": 1, "velocity": 0.0, "ageHours": 3010.4, "postedAt": "2026-04-26T15:31:23+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3932859251756872984", "username": "dr.mackerel", "text": "何回も言うけど、髪のボリュームをだしたいならこれ！", "permalink": "https://www.threads.com/@dr.mackerel/post/DaUUqb8k7UY", "likes": 1, "velocity": 0.0, "ageHours": 1380.4, "postedAt": "2026-07-03T13:36:19+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3973614916657324099", "username": "w_clinic_", "text": "大阪にある美容クリニックです👩‍⚕️\nオーダーメイドであなたに合ったたるみ改善したい方、", "permalink": "https://www.threads.com/@w_clinic_/post/DclHbatjaBD", "likes": 1, "velocity": 0.03, "ageHours": 30.8, "postedAt": "2026-08-28T19:10:32+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3924023011686638958", "username": "biyou_sake", "text": "たるみケアの順番\n\n🥉やめとけ\n・高い美顔器から始める（土台ノーケア）\n・顔だけ揉む（頭皮放置で逆戻り）\n・引き上げ塗り（靭帯を痛める）\n\n🥈無難\n・保湿を強化する（土台作りにはなる）\n・日焼け止め徹底（柱を折らせない）\n・表情筋を使う（衰え止め）\n\n🥇ナースが本気で勧める1番目は…", "permalink": "https://www.threads.com/@biyou_sake/post/DZ07iOGCmVu", "likes": 1, "velocity": 0.0, "ageHours": 1673.0, "postedAt": "2026-06-21T09:00:17+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3970029865513157880", "username": "hana_scalp_oyama", "text": "【栃木｜スカルプインク取材】\n\nprivate salon HANAは「小山市でスカルプインク専門サロン」として4月にopenいたしました⭐︎\n\nスカルプインクを、まだ知らない方にまず知ってもらいたい。そして、薄毛で悩んでいる方が『自分にもできることがある』と思えるきっかけになれば嬉しいです。\n\n気になる方は、ぜひ公式LINEまたはInstagramからお問合せください。\n\n💎サロン情報💎\nprivate salon HANA（ハナ）\n\nSCALP INK 頭皮タトゥー\n【国際認証ISO9001取得】\n@hana_scalp_oyama\n\n▶小山市八幡町\n（ご予約確定後詳細お送りします）\n*  090-5553-7001\n*  完全予約制\n*  JR小山駅から車で5分\n*  お問い合わせ・ご予約は【公式ライン】or 【お電話】で受付中！\n\n#栃木県薄毛サロン\n#スカルプインク\n#TV取材\n#小山駅 \n#AGA", "permalink": "https://www.threads.com/@hana_scalp_oyama/post/DcYYSDpmoT4", "likes": 1, "velocity": 0.01, "ageHours": 149.5, "postedAt": "2026-08-23T20:27:43+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3968537498436145408", "username": "hana_scalp_oyama", "text": "【栃木｜スカルプインクインクで小顔効果】\n\n「生え際、薄くなった？」\n実はこれ、髪が減っただけじゃない。\n\n生え際の“透け感”を\nスカルプインクで自然にカバー。\n\n近くで見ても不自然にならないように\n極小ドットで仕上げます。\n\n「髪型が決まらない…」\n「おでこが広く見える…」\nそんな悩みに。\n\n生え際が変わると、顔の印象も変わる。\n\n💎サロン情報💎\nprivate salon HANA（ハナ）\n\nSCALP INK 頭皮タトゥー\n【国際認証ISO9001取得】\n@hana_scalp_oyama\n\n▶小山市八幡町\n（ご予約確定後詳細お送りします）\n*  090-5553-7001\n*  完全予約制\n*  JR小山駅から車で5分\n*  お問い合わせ・ご予約は【公式ライン】or 【お電話】で受付中！\n\n#小顔効果\n#栃木薄毛\n#AGA\n#小山駅 \n#スカルプインク", "permalink": "https://www.threads.com/@hana_scalp_oyama/post/DcTE9QgGpEA", "likes": 1, "velocity": 0.01, "ageHours": 198.9, "postedAt": "2026-08-21T19:02:38+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3972775728214834711", "username": "coruli_scalp_ink", "text": "いつもパーマのお客さんが2回続けて、カットとヘッドスパ、なんでかって？スカルプインクで頭皮透けにくくなったから、違うところにメンテナンス☝️タトゥーの技術で毛根をかいてるの（まだ施術中）、パーマお休みした分、髪も薬剤の休憩でき次回しっかり根元から綺麗なパーマあてれるの☝️自然なボリューム感演出、髪型のように印象チェンジ、本サービスは発毛、育毛、治療を目的としたものではありません、タトゥー技術を応用した審美的なデザイン、医療行為ではなく美容目的の施術です。☝️効果には個人差あります☝️ちょっとしたお悩み、ちょっとの勇気でお気軽にカウセリングどうぞ#スカルプインク #天神橋筋六丁目", "permalink": "https://www.threads.com/@coruli_scalp_ink/post/DciInnkif4X", "likes": 1, "velocity": 0.02, "ageHours": 58.6, "postedAt": "2026-08-27T15:23:15+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3972957522554245862", "username": "calla.esthetic_relaxation", "text": ".\n\n💫HBL(ハリウッドブロウリフト)って？\n\n眉毛の毛流れそのものを整える、日本初の眉癖改善技術。\n\n•自分の眉毛でナチュラルに盛れる\n•細眉・薄眉もふっくら見せる\n•1回で「垢抜けたね」と言われる\n•メイク時間が半分になる\n•顔全体がリフトアップした印象に✨\n\n💡こんな人にこそ試してほしい！\n\n✔︎ 眉の形がいつも決まらない\n✔︎ 左右非対称が気になる\n✔︎ 毎朝メイクが面倒\n✔︎ 自分に似合う眉がわからない\n✔︎ 薄眉・細眉に悩んでいる\n✔︎アートメイクしたままで放置している\n\nご興味のある方は、お気軽にお問い合わせください😊❣️", "permalink": "https://www.threads.com/@calla.esthetic_relaxation/post/Dcix9Evj9Lm", "likes": 1, "velocity": 0.02, "ageHours": 52.6, "postedAt": "2026-08-27T21:24:25+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3974477987953202033", "username": "sbc_jun", "text": "糸リフトでこめかみ上の方から縦に入れて、\nカマキリみたいに不自然にリフトアップするのはアンチエイジング的には不向きです😭\n正しいリフトは、、、", "permalink": "https://www.threads.com/@sbc_jun/post/DcoLqwfj1Nx", "likes": 1, "velocity": 0.17, "ageHours": 2.2, "postedAt": "2026-08-29T23:45:19+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3892337009905759167", "username": "sho_lask", "text": "ぶっちゃけます。AGAクリニックに駆け込むのは、一番最後でいいんです。\n「最近、生え際が後退してきた気がする……」\n「とにかく手っ取り早く薬で増やしたい！」\nその焦る気持ち、本当によくわかります。\nだけど、、、\n実は、体の中が「酸化」してボロボロなままだと、せっかく薬で髪を生やしても、砂上の楼閣のようにすぐ崩れてしまうんです。", "permalink": "https://www.threads.com/@sho_lask/post/DYEW-NVifO_", "likes": 0, "velocity": 0.0, "ageHours": 2722.2, "postedAt": "2026-05-08T15:45:51+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3968213940773803163", "username": "kana_ruana", "text": "生え癖やつむじ割れ、もう悩まなくても大丈夫！\n何故かというと、、、", "permalink": "https://www.threads.com/@kana_ruana/post/DcR7Y38k1Sb", "likes": 0, "velocity": 0.0, "ageHours": 209.6, "postedAt": "2026-08-21T08:19:46+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3974017261317395523", "username": "hair_nayami_koharu", "text": "ずっと後退していく一方だった生え際が、ある時期からそれ以上下がらなくなった気がしました。増えたとまでは言えない。でも、進む一方だったものが、", "permalink": "https://www.threads.com/@hair_nayami_koharu/post/Dcmi6TYGBRD", "likes": 0, "velocity": 0.0, "ageHours": 17.5, "postedAt": "2026-08-29T08:29:59+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3903277987902793975", "username": "tumuji_senpai", "text": "つむじが3年で2倍に広がって、ようやく気づいた。\n「ハゲる」より先に、必ず\"前兆\"が来てる。\n\n29歳でつむじ薄毛、3年で育毛剤8本・サプリ12種類試した俺。\n当時の写真を見返すと、見るべきサインは1年前から出てた。\n\n❌ 当時の俺が、見逃してたサイン\n・風呂上がり、洗面台の正面からしか鏡を見ない\n・ドライヤーで乾かしてる途中、地肌の見え方を直視しない\n・抜け毛の\"長さ\"を見てない（短い抜け毛は危険サイン）\n・つむじを\"写真\"じゃなく\"記憶\"で比較する\n\n⭕ 1年前の俺に教えたい、月1チェック↓", "permalink": "https://www.threads.com/@tumuji_senpai/post/DYrOqZIjCj3", "likes": 0, "velocity": 0.0, "ageHours": 2359.9, "postedAt": "2026-05-23T18:03:37+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3950870096793181195", "username": "o_dai_o_dai", "text": "何度でも言います。\n前髪・つむじの薄毛が気になる人が優先すべき\n遠回りしないAGA対策ランキングTOP10\n10位 頭皮に合うシャンプーを使う\n9位 タンパク質不足を避ける\n8位 睡眠時間を確保する\n7位 前髪とつむじを毎月撮影する\n6位 短く細い毛が増えていないか見る\n5位 個人輸入の治療薬を避ける\n4位 副作用を医師に相談できる環境を選ぶ\n3位 外用ミノキシジルで発毛を促す\n2位 フィナステリドで進行を抑える\n1位は、、、", "permalink": "https://www.threads.com/@o_dai_o_dai/post/DbUT2uhEhwL", "likes": 0, "velocity": 0.0, "ageHours": 784.0, "postedAt": "2026-07-28T10:00:39+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3879364627721967767", "username": "biyou_saki", "text": "髪が細くなってきた、ボリュームが出ない。\n\nそう感じてる人、まず頭皮の硬さを確認してみて。\n\nこれ、本当に大事なサインだから。", "permalink": "https://www.threads.com/@biyou_saki/post/DXWRZM9lViX", "likes": 0, "velocity": 0.0, "ageHours": 3151.8, "postedAt": "2026-04-20T18:12:07+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3933717331873430338", "username": "kami_neesan_", "text": "更年期に差し掛かった頃から急に髪のボリュームが減って、婦人科に相談したら意外なことを言われてな、", "permalink": "https://www.threads.com/@kami_neesan_/post/DaXXxJVHPtC", "likes": 0, "velocity": 0.0, "ageHours": 1351.9, "postedAt": "2026-07-04T18:01:12+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3880664592830219826", "username": "yuu41b", "text": "左　スキンケア始める前\n右　スキンケア始めて1カ月\n\n目の下のたるみが改善されてる🥹嬉しい🥹", "permalink": "https://www.threads.com/@yuu41b/post/DXa4-L0FMYy", "likes": 0, "velocity": 0.0, "ageHours": 3108.7, "postedAt": "2026-04-22T13:14:50+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3974469531758019583", "username": "keiko_biyou50", "text": "えええ！！！！先生それ言っていいのwww 更年期になってから生え際が薄くなってきて、本気で1万円の育毛剤買おうとしてたアラフィフの私。AGAクリニックの先生に相談したら、こっそり「メンズベーシックの育毛剤、3,680円ですけど1万円クラス並みに効果ありますよ」って！！！！いやいやいや！！！！それ先に知りたかったわwwww", "permalink": "https://www.threads.com/@keiko_biyou50/post/DcoJvtDDMP_", "likes": 0, "velocity": 0.0, "ageHours": 2.5, "postedAt": "2026-08-29T23:28:30+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3974254541223423288", "username": "ekimae_aga_clinic_okayama", "text": "今回は駅前AGAクリニック岡山院に通院中の患者様にインタビュー🎤しちゃいました💖✨\n\nご協力くださった患者様🥰本当にありがとうございました🙇‍♀️✨\nこれからも私達と一緒に楽しく頑張っていきましょうね✌️✨よろしくお願いします✨\n\n💁‍♀️髪の毛の事でお悩みの方はお一人で悩まず、まずは駅前AGAクリニック岡山院へお気軽にご相談ください😊\n初回カウンセリングは無料ですので、安心してご来院下さいませ💖\nお一人お一人に合った治療をご案内いたします🧑‍⚕️\n\n@ekimae_aga_clinic_okayama .\n#駅前AGAクリニック岡山院\n#美容男子 \n#薄毛治療\n#AGA\n#FAGA\n\n円形脱毛\n女性薄毛\n男性薄毛\n産後脱毛\nメソセラピー", "permalink": "https://www.threads.com/@ekimae_aga_clinic_okayama/post/DcnY3Lgmu04", "likes": 0, "velocity": 0.0, "ageHours": 9.6, "postedAt": "2026-08-29T16:21:24+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3974346177393984670", "username": "mayune_hb", "text": "ええええええええーーーー！！！！！！AGAクリニックの先生！！！！それ言ってええんかwwwww 薄毛気にし始めた旦那が「やっぱ1万円くらいする育毛剤じゃないとダメですか？」って聞いたら、先生がこっそり「いや、メンズベーシックの3,680円の育毛剤でも1万円クラス並みに効果ありますよ」って！！！！旦那から聞いた瞬間「はぁぁぁぁ！？！？！？」って声出たwww その値段差知ったら高い方買えんやろ！！！！", "permalink": "https://www.threads.com/@mayune_hb/post/DcntsqWAASe", "likes": 0, "velocity": 0.0, "ageHours": 6.6, "postedAt": "2026-08-29T19:23:25+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3973972036846605116", "username": "thecellclinic_official", "text": "薄毛の悩みあるけど、AGA治療はしていない方に聞いてみたいです。\n\n治療しない理由って、何ですか？🤔\n\n費用が高い？\n薬を飲み続けることへの抵抗？\n副作用が心配？\nクリニックに行くほどではない？\n何をしたらいいのかわからない？\nそれとも、効果があるのか半信半疑？\n\n「これだったら治療してみたい」もあれば、ぜひ聞いてみたいです。\n\nリアルな本音を教えてください🙏", "permalink": "https://www.threads.com/@thecellclinic_official/post/DcmYoMzk9M8", "likes": 0, "velocity": 0.0, "ageHours": 19.0, "postedAt": "2026-08-29T07:00:04+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3966822263450803124", "username": "efu.ikumou", "text": "「育毛剤の〇〇ップを半年使ったけど全く薄毛が改善しなかった」\n\nそんな人が半年間、eFu式育毛鍼を続けたら、\n\n「髪セットした時に髪の毛がスカスカにならず良い感じになるようになりました✨️」\n\nこんな嬉しいコメントをいただきました😄\n\n何をしたかというと、", "permalink": "https://www.threads.com/@efu.ikumou/post/DcM-9TcGJu0", "likes": 0, "velocity": 0.0, "ageHours": 255.7, "postedAt": "2026-08-19T10:14:45+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3924158423709631025", "username": "kamonohasi.aga", "text": "怖い話。\n育毛剤を1年続けた奴に\n言いにくいことを言う。", "permalink": "https://www.threads.com/@kamonohasi.aga/post/DZ1aUuXkcIx", "likes": 0, "velocity": 0.0, "ageHours": 1668.5, "postedAt": "2026-06-21T13:29:19+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3937975966329069544", "username": "suncy_salon", "text": "「抜け毛が1日何本以上だったら異常ですか？」\n\nよく聞かれる質問です。\n\n正直に言うと、\n本数よりも「抜けた毛の状態」の方が\n大事なことが多いです。", "permalink": "https://www.thre     var units = ['最終収集 2026-08-30 01:57'];
    if (SUMMARY.archived > SUMMARY.total) {
      units.push('　/　蓄積 ' + SUMMARY.archived.toLocaleString() + ' 件のうち');
      units.push(SUMMARY.total.toLocaleString() + ' 件を表示');
    }
    phrases(stamp, units);
  })();

  KEYWORDS.forEach(function (k) {
    var o = document.createElement('option');
    o.value = k; o.textContent = 'キーワード: ' + k;
    els.keyword.appendChild(o);
  });

  GENRES.forEach(function (g) {
    var b = mk('span', 'chip', g);
    b.tabIndex = 0;
    var toggle = function () {
      if (activeGenres.has(g)) { activeGenres.delete(g); b.classList.remove('on'); }
      else { activeGenres.add(g); b.classList.add('on'); }
      render();
    };
    b.addEventListener('click', toggle);
    b.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
    });
    els.genres.appendChild(b);
  });

  function fmtAge(h) {
    if (h === null || h === undefined) return '不明';
    if (h < 24) return Math.round(h) + '時間前';
    return Math.round(h / 24) + '日前';
  }

  function filtered() {
    var days = parseInt(els.period.value, 10);
    var kw = els.keyword.value;
    var q = els.q.value.trim().toLowerCase();

    return POSTS.filter(function (p) {
      if (days > 0) {
        if (p.ageHours === null || p.ageHours > days * 24) return false;
      }
      if (kw && p.keywords.indexOf(kw) === -1) return false;
      if (activeGenres.size > 0) {
        var hit = p.genres.some(function (g) { return activeGenres.has(g); });
        if (!hit) return false;
      }
      if (q) {
        var hay = (p.text + ' ' + p.username).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function sorted(rows) {
    var mode = els.sort.value;
    var copy = rows.slice();
    if (mode === 'likes') copy.sort(function (a, b) { return b.likes - a.likes; });
    else if (mode === 'newest') copy.sort(function (a, b) {
      var av = a.ageHours === null ? Infinity : a.ageHours;
      var bv = b.ageHours === null ? Infinity : b.ageHours;
      return av - bv;
    });
    else copy.sort(function (a, b) { return b.velocity - a.velocity; });
    return copy;
  }

  function render() {
    var rows = sorted(filtered());
    els.count.textContent = rows.length + ' 件を表示';
    els.list.textContent = '';

    if (rows.length === 0) {
      // 「絞り込みを」を1かたまりにして、「を」が行頭に来ないようにする
      els.list.appendChild(phrases(mk('div', 'empty'), [
        '条件に合う投稿が', 'ありません。', '絞り込みを', '緩めてください。'
      ]));
      return;
    }

    var frag = document.createDocumentFragment();
    rows.forEach(function (p, i) {
      var isRising = p.velocity >= RISING;
      var card = mk('div', 'card' + (isRising ? ' rising' : ''));

      var head = mk('div', 'card-head');
      head.appendChild(mk('span', 'rank', String(i + 1)));
      head.appendChild(mk('span', 'user', '@' + p.username));
      if (isRising) head.appendChild(mk('span', 'badge', '伸び中'));

      var stats = mk('div', 'stats');
      stats.appendChild(mk('span', 'likes', p.likes.toLocaleString() + ' likes'));
      stats.appendChild(mk('span', 'vel', p.velocity.toFixed(1) + '/h'));
      stats.appendChild(mk('span', 'age', fmtAge(p.ageHours)));
      head.appendChild(stats);
      card.appendChild(head);

      card.appendChild(mk('p', 'text', p.text));

      var tags = mk('div', 'tags');
      p.genres.concat(p.keywords).forEach(function (t) {
        tags.appendChild(mk('span', 'tag', t));
      });
      if (p.permalink) {
        var a = mk('a', 'link', '元投稿を開く →');
        a.href = p.permalink;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        tags.appendChild(a);
      }
      card.appendChild(tags);
      frag.appendChild(card);
    });
    els.list.appendChild(frag);
  }

  [els.sort, els.period, els.keyword].forEach(function (el) {
    el.addEventListener('change', render);
  });
  els.q.addEventListener('input', render);

  render();
})();
</script>
