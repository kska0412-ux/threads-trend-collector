<style>
  /* 明るい側を基準に全トークンを定義する。暗い側は下で上書きする。 */
  :root {
    --bg: #f6f4f5;
    --surface: #ffffff;
    --surface-2: #fbf9fa;
    --ink: #231c22;
    --muted: #6f636c;
    --border: #e4dee2;
    --accent: #8b2f5f;
    --accent-soft: #f7e9f0;
    --rising: #0f7b6c;
    --rising-soft: #e2f2ef;
    --chip: #efeaed;
    --focus: #8b2f5f;
  }
  /* OS が暗いとき。ただし閲覧者が明るいテーマを選んでいたらそちらを優先する。 */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151114;
      --surface: #1f1a1e;
      --surface-2: #241e23;
      --ink: #f0eaee;
      --muted: #a3969e;
      --border: #332b31;
      --accent: #e086b0;
      --accent-soft: #3a2130;
      --rising: #4fc3ae;
      --rising-soft: #16332e;
      --chip: #2c2429;
      --focus: #e086b0;
    }
  }
  /* 閲覧者が暗いテーマを選んだとき。OS の設定に関係なく効かせる。 */
  :root[data-theme="dark"] {
    --bg: #151114;
    --surface: #1f1a1e;
    --surface-2: #241e23;
    --ink: #f0eaee;
    --muted: #a3969e;
    --border: #332b31;
    --accent: #e086b0;
    --accent-soft: #3a2130;
    --rising: #4fc3ae;
    --rising-soft: #16332e;
    --chip: #2c2429;
    --focus: #e086b0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    /* 透明のままだと閲覧側の地の色を借りてしまうので必ず塗る */
    background: var(--bg);
    color: var(--ink);
    /* 日本語本文はWebフォントを落とすと重いので、端末のフォントを使う */
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
                 -apple-system, BlinkMacSystemFont, "Yu Gothic Medium", sans-serif;
    line-height: 1.75;
    font-feature-settings: "palt" 1;
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
  }

  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px 96px; }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* --- 見出し --- */
  h1 {
    font-family: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-weight: 900;
    font-size: clamp(1.5rem, 4vw, 2.1rem);
    line-height: 1.35;
    letter-spacing: .01em;
    margin: 0;
    text-wrap: balance;
  }
  /* 対象ジャンルの但し書き。名前より一段弱く見せる */
  .ver {
    display: block;
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-weight: 400;
    font-size: .74rem;
    letter-spacing: .02em;
    color: var(--muted);
    margin-top: 6px;
  }

  /* --- 集計：詳細より先に全体像を出す --- */
  .panel {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    margin: 28px 0 8px;
  }
  /* 4枚で固定する。auto-fit だと枚数によって最後の1枚だけ次の行に
     取り残され、空いた枠が塗り残しに見えてしまうため。 */
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
  }
  @media (max-width: 620px) {
    /* 4枚なので2列でもきれいに埋まる */
    .summary { grid-template-columns: repeat(2, 1fr); }
  }
  .stat { background: var(--surface); padding: 14px 16px; }

  /* --- ジャンル別の内訳 --- */
  /* 棒にしておけば、ジャンルが何個あっても1行1本で並ぶので取り残しが出ない */
  .breakdown { padding: 15px 16px 17px; border-top: 1px solid var(--border); }
  .breakdown-title {
    font-size: .7rem; color: var(--muted); letter-spacing: .06em;
    margin: 0 0 11px; white-space: nowrap;
  }
  /* 名前の列は固定幅。名前に合わせて伸ばすと、長いジャンルの行だけ棒の
     開始位置がずれて、棒どうしの長さを目で比べられなくなる。
     収まらない名前は「・」の位置で折る（折り位置は .nb で決め打ち）。
     幅と高さは実際のジャンル名から build_html.py が計算して埋める。 */
  .bar-row {
    display: grid;
    grid-template-columns: 11.5em 1fr auto;
    gap: 12px; align-items: center;
  }
  .bar-row + .bar-row { margin-top: 8px; }
  /* 1行で収まる名前も2行の名前と同じ高さにする。混ざると行の間隔が
     ばらついて、棒の並びが読みにくくなる。
     flex にしているのは、折り返した2行をまとめて上下中央に置くため。 */
  .bar-name {
    font-size: .76rem; line-height: 1.4;
    min-height: 1.4em;
    display: flex; flex-wrap: wrap; align-content: center;
  }
  .bar-track {
    height: 6px; border-radius: 999px;
    background: var(--chip); overflow: hidden;
  }
  .bar-fill { height: 100%; border-radius: 999px; background: var(--accent); }
  .bar-count {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; color: var(--muted);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  @media (max-width: 620px) {
    /* 幅は変えない。変えると狭い画面だけ折り返し位置が変わってしまう */
    .bar-row { gap: 9px; }
  }
  /* まだ集まっていないジャンル。対象には入っているので消さず、弱く見せる */
  .bar-row.pending .bar-name { color: var(--muted); }
  .bar-row.pending .bar-track { opacity: .55; }
  /* 「収集待ち」は日本語なので、等幅フォントに任せず本文と同じ書体で出す */
  .bar-row.pending .bar-count {
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-size: .7rem;
  }
  .stat-label {
    font-size: .7rem; color: var(--muted); letter-spacing: .06em;
    display: block; margin-bottom: 4px;
    /* 「表示中/の投稿」のように助詞で割れないよう、まとめて扱う */
    white-space: nowrap;
  }
  .stat-value {
    white-space: nowrap;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: 1.25rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .stat-value .unit { font-size: .72rem; font-weight: 400; color: var(--muted); margin-left: 3px; }
  .stamp {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .7rem; color: var(--muted); margin: 0 0 26px;
  }

  /* --- 操作バー --- */
  .controls {
    position: sticky; top: 0; z-index: 10;
    background: var(--bg);
    padding: 12px 0 14px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 18px;
  }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .row + .row { margin-top: 8px; }
  select, input[type=search] {
    font: inherit; font-size: .82rem;
    padding: 7px 11px;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--surface);
    color: var(--ink);
  }
  input[type=search] { flex: 1; min-width: 180px; }
  .chip {
    display: inline-flex; align-items: baseline; gap: 6px;
    font-size: .78rem; padding: 5px 13px;
    border: 1px solid var(--border); border-radius: 999px;
    background: var(--surface); color: var(--muted);
    cursor: pointer; user-select: none;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.on {
    background: var(--accent-soft); border-color: var(--accent);
    color: var(--accent); font-weight: 700;
  }
  /* ジャンル名は途中で割らない。「ダイエット」を「ダイ」と「エット」に分けない */
  .chip-name { white-space: nowrap; }
  /* まだ1件も無いジャンル。押しても空振りするので、選べないことを見た目で示す */
  .chip.pending {
    opacity: .45; cursor: default;
    border-style: dashed;
  }
  .chip.pending:hover { border-color: var(--border); color: var(--muted); }
  .count {
    white-space: nowrap;
    font-family: "Roboto Mono", ui-monospace, monospace;
    color: var(--muted); font-size: .76rem; margin-bottom: 14px;
    font-variant-numeric: tabular-nums;
  }

  /* --- カード --- */
  #list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid transparent;
    border-radius: 10px;
    padding: 16px 18px;
  }
  /* 伸びが速い投稿は左端の色で一目で分かるようにする */
  .card.rising { border-left-color: var(--rising); background: var(--surface-2); }

  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 9px; }
  .rank {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; color: var(--muted);
    font-variant-numeric: tabular-nums; min-width: 2.4em;
  }
  .user { font-weight: 700; font-size: .86rem; }
  .badge {
    white-space: nowrap;
    font-size: .66rem; font-weight: 700; letter-spacing: .04em;
    padding: 2px 8px; border-radius: 999px;
    background: var(--rising-soft); color: var(--rising);
  }
  .stats {
    margin-left: auto; display: flex; gap: 11px;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; font-variant-numeric: tabular-nums;
  }
  .likes { color: var(--accent); font-weight: 700; }
  .vel { color: var(--rising); font-weight: 500; }
  .age { color: var(--muted); }

  .text {
    white-space: pre-wrap;
    /* word-break: break-word は単語の途中で割るので使わない。
       overflow-wrap なら、1語が行に収まらないときだけ割る。
       line-break: strict で日本語の禁則処理を厳しい方に寄せる。 */
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
    font-size: .92rem; margin: 0 0 12px;
  }

  /* 文節のかたまり。ここで囲った範囲は途中で改行されない。
     「を」「と」などの助詞が行頭に来るのを防ぐために使う。 */
  .nb { white-space: nowrap; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag {
    white-space: nowrap;
    font-size: .7rem; padding: 3px 9px; border-radius: 4px;
    background: var(--chip); color: var(--muted);
  }
  .link {
    margin-left: auto; font-size: .76rem; color: var(--accent);
    text-decoration: none; font-weight: 700; white-space: nowrap;
  }
  .link:hover { text-decoration: underline; }

  .empty { text-align: center; color: var(--muted); padding: 64px 20px; font-size: .88rem; }
</style>

が予想される\n\n\"飲食店難しすぎる\"\n\nやると決めたらやってしまうこのチャレンジ精神\n将来かなり力になりそう", "permalink": "https://www.threads.com/@kj_network/post/DZL8hSZGuB6", "likes": 24, "velocity": 0.01, "ageHours": 2149.3, "postedAt": "2026-06-05T11:00:02+09:00", "genres": ["単価UP"], "keywords": ["単価UP"]}, {"id": "3959246239564972543", "username": "komugi2851", "text": "２回目のアートメイクしてきました。\n形とカラーを、少し変更。\n凄く気に入ってます。", "permalink": "https://www.threads.com/@komugi2851/post/DbyEXpXkkH_", "likes": 21, "velocity": 0.03, "ageHours": 600.9, "postedAt": "2026-08-08T23:22:33+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク"]}, {"id": "3969939189626257663", "username": "xiaolinyinghui17", "text": "眉毛のアートメイク\n失敗した方おられますか？\nお金と時間と元の顔返してほしい…\n悲しい😣\nレーザー以外で、早く薄くする方法があれば教えてください🙏\nちなみに毛並みとパウダー仕上げ。\nインスタ投稿写真と全然ちがいました😢", "permalink": "https://www.threads.com/@xiaolinyinghui17/post/DcYDqjJk0D_", "likes": 20, "velocity": 0.08, "ageHours": 246.9, "postedAt": "2026-08-23T17:27:32+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク"]}, {"id": "3972613462295527549", "username": "matsudo_houwakai", "text": "施術などの手技においては、力を伝えるために「関節の遊びを取る」という考え方があります。\nこれは、関節がゆるんでいると力がうまく伝わらない、という考え方に基づくものです。\n\nしかし、脱力においては、発想を逆にしてみる必要があります。\n\n関節は、常に遊びを残しておく。\n\n関節の遊びをなくせば、力を一点に集中させることはできるかもしれません。\nしかし、それは身体を固定されたモノとしてとらえた力の出し方です。\n\n関節に遊びを残しておくことで、身体はそのつど形を変えながら必要な力を必要な場所へと受け渡していくことができます。\n\nたとえば鎖は、一つひとつの輪が固定されずに自由に動けるからこそ、ムチのようにその動きが次々と先端まで伝わっていきます。\n\n身体を固定して使うのではなく遊びを残したまま使う。\nそうすることで身体の中を力が止まらずに受け渡されていく感覚が生まれてきます。\n\n関節を固めることで伝わる力だけでなく、関節をゆるめることで初めて伝わる力もあります。その違いを、ぜひ身体で感じてみてください。", "permalink": "https://www.threads.com/@matsudo_houwakai/post/DchjuVqD0B9", "likes": 19, "velocity": 0.12, "ageHours": 158.3, "postedAt": "2026-08-27T10:00:50+09:00", "genres": ["手技"], "keywords": ["手技"]}, {"id": "3951762558122144029", "username": "colore0116", "text": "エステティシャンを「先生」って呼ぶ文化、なんでなんだろう？ 私は名字や「オーナー」のほうがしっくりくるんだけど、みなさんはどう思いますか？", "permalink": "https://www.threads.com/@colore0116/post/DbXexv5jzEd", "likes": 19, "velocity": 0.02, "ageHours": 848.8, "postedAt": "2026-07-29T15:33:48+09:00", "genres": ["エステティシャン"], "keywords": ["エステティシャン"]}, {"id": "3974467368487447175", "username": "soibloom_hikaru", "text": "お盆明けからなんだか予約がなかなかはいりづらく…😱\n当サロンだけでしょうか…💦", "permalink": "https://www.threads.com/@soibloom_hikaru/post/DcoJQOWE2qH", "likes": 19, "velocity": 0.2, "ageHours": 96.9, "postedAt": "2026-08-29T23:24:13+09:00", "genres": ["美容サロン"], "keywords": ["美容サロン"]}, {"id": "3976969251495451622", "username": "n.0604", "text": "未経験からネイリストを目指そうと思っています。\nオススメのスクールなどありましたら教えていただきたいです🥺\n都内在住です。", "permalink": "https://www.threads.com/@n.0604/post/DcxCHaeCZvm", "likes": 19, "velocity": 1.35, "ageHours": 14.1, "postedAt": "2026-09-02T10:15:00+09:00", "genres": ["スクール"], "keywords": ["スクール"]}, {"id": "3934254404102967561", "username": "seiri_lunappi", "text": "更年期入る前にやっておかないと、後悔すること。\n生理と女性ホルモンのために、今から仕込める習慣をまとめたよ。\n保存して、できそうなやつからやってみてね", "permalink": "https://www.threads.com/@seiri_lunappi/post/DaZR4k0ktEJ", "likes": 18, "velocity": 0.01, "ageHours": 1428.5, "postedAt": "2026-07-05T11:48:14+09:00", "genres": ["更年期ケア"], "keywords": ["更年期ケア"]}, {"id": "3973444998565819391", "username": "natsuhiwawari85", "text": "会社員を辞めて、自分で仕事がしたい！私自身は施術を行える資格は無いけれど、それならオーナーとして美容サロンを経営してみたい✨", "permalink": "https://www.threads.com/@natsuhiwawari85/post/DckgyyKEXP_", "likes": 17, "velocity": 0.13, "ageHours": 130.8, "postedAt": "2026-08-28T13:32:57+09:00", "genres": ["美容サロン経営"], "keywords": ["美容サロン経営"]}, {"id": "3971405412062323975", "username": "maki_therapist", "text": "サロンオープン1年以内にホットペッパーのお気に入り登録件数が1000人超えたので、\nさすがにホットペッパー得意ということでいい？😌\n\n1000人来てね✊", "permalink": "https://www.threads.com/@maki_therapist/post/DcdRC5NCeUH", "likes": 16, "velocity": 0.08, "ageHours": 198.3, "postedAt": "2026-08-25T18:00:39+09:00", "genres": ["セラピスト"], "keywords": ["セラピスト"]}, {"id": "3969913096910746652", "username": "rezalt_8888", "text": "エステサロンですが、今月最大の閑散期なんですけどなんでだろう", "permalink": "https://www.threads.com/@rezalt_8888/post/DcX9u2aiTQc", "likes": 14, "velocity": 0.06, "ageHours": 247.7, "postedAt": "2026-08-23T16:35:41+09:00", "genres": ["美容サロン経営"], "keywords": ["美容サロン経営"]}, {"id": "3957756671531678986", "username": "hakui_youarefree", "text": "アートメイク、施術してもらうならオシャレで経験豊富な方にやってもらいたい。\nそう見えるのがこれ", "permalink": "https://www.threads.com/@hakui_youarefree/post/DbsxrlCE_0K", "likes": 14, "velocity": 0.02, "ageHours": 650.3, "postedAt": "2026-08-06T22:03:02+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク"]}, {"id": "3975676628147728142", "username": "kiiroo_00", "text": "手探りで在宅ワークを細々とやってきたけど、収入を増やすためにはどうしたら良いのか💦\n\n記帳代行（freee・マネーフォワード）や秘書業務を中心にお仕事してるのですが、オンライン秘書やバックオフィス業務って、みなさん数社掛け持ちとかでされてますよね…？\nどうやって案件を見つけてるのかすごく気になる…！", "permalink": "https://www.threads.com/@kiiroo_00/post/DcscNRKkW8O", "likes": 14, "velocity": 0.25, "ageHours": 56.9, "postedAt": "2026-08-31T15:26:48+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書"]}, {"id": "3938809188827007728", "username": "ko_rolfing22", "text": "【頚椎ヘルニアを改善する手技】\n\n頚椎に限らず【関節ワーク】では\n🔸関節面（骨と骨が合わさる）\nのイメージが大切。\n\n関節面を【圧迫】【滑らせる】などがうまくできると効果は高まる👍", "permalink": "https://www.threads.com/@ko_rolfing22/post/DapdhaqFArw", "likes": 14, "velocity": 0.01, "ageHours": 1277.7, "postedAt": "2026-07-11T18:37:46+09:00", "genres": ["手技"], "keywords": ["手技"]}, {"id": "3962798064356439059", "username": "artmake_paisen", "text": "アートメイク絶対3大やってはいけないこと\n（毛並み編）", "permalink": "https://www.threads.com/@artmake_paisen/post/Db-r9f-kjQT", "likes": 13, "velocity": 0.03, "ageHours": 483.3, "postedAt": "2026-08-13T20:59:23+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク"]}, {"id": "3954619711765982089", "username": "yusuke_hori_", "text": "集客とか、単価UPとかサロン経営のシミュレーションゲームがあったらやってみたいです？\n集客の方法とかミスると平気で潰れますよ。", "permalink": "https://www.threads.com/@yusuke_hori_/post/DbhoazlkauJ", "likes": 13, "velocity": 0.02, "ageHours": 754.1, "postedAt": "2026-08-02T14:10:28+09:00", "genres": ["単価UP"], "keywords": ["単価UP"]}, {"id": "3902355514584022304", "username": "ieaka.urakata0003", "text": "【 契約後に費用が爆増する打合せ 】\n\n第5位　外壁材\n・営業マンの「良い外壁で予算取ってあります」に注意\n・タイルや吹付は単価UPが大きい\n・面積が大きいからあっという間に数十万単位で増える\n\n→契約前にサンプルで確認は必須\n\n第4位　水回り設備\n・ショールーム行くとついつい欲しくなる...\n・「これくらいなら...」が積み重なる\n・気づけば数十万UP\n\n→出来れば契約前にショールーム行っとけ！\n\n第3位 ↓↓↓", "permalink": "https://www.threads.com/@ieaka.urakata0003/post/DYn86o6ET0g", "likes": 13, "velocity": 0.01, "ageHours": 2484.8, "postedAt": "2026-05-22T11:30:50+09:00", "genres": ["単価UP"], "keywords": ["単価UP"]}, {"id": "3953786366920484267", "username": "sana_artmake", "text": "千葉駅でアートメイクしたい人探してます👀\n7月から始めた大人気の最安値キャンペーン、\n8月もやります‼️🉐\n汗で眉なしさんになるのが気になる方、ぜひ一度DM、コメントください☺️💞", "permalink": "https://www.threads.com/@sana_artmake/post/Dbeq8CuE-Wr", "likes": 12, "velocity": 0.02, "ageHours": 781.7, "postedAt": "2026-08-01T10:34:45+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク"]}, {"id": "3930918200636541648", "username": "yukii_work", "text": "オンライン秘書3年目\n消えた人、残ってる人には特徴があって、", "permalink": "https://www.threads.com/@yukii_work/post/DaNbUbODwrQ", "likes": 11, "velocity": 0.01, "ageHours": 1539.0, "postedAt": "2026-06-30T21:19:47+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書"]}, {"id": "3965624207253009372", "username": "roko_shining", "text": "オンライン秘書を始めた瞬間から、\n仕事が途切れたことがないです。\n\nどうしているかというと、", "permalink": "https://www.threads.com/@roko_shining/post/DcIujSqAXPc", "likes": 11, "velocity": 0.03, "ageHours": 389.7, "postedAt": "2026-08-17T18:34:26+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書"]}, {"id": "3948757263574395463", "username": "atom_anvery", "text": "オンライン秘書は案件めっちゃあります\n\nけど案件取れない原因は・・", "permalink": "https://www.threads.com/@atom_anvery/post/DbMzc9PmGpH", "likes": 10, "velocity": 0.01, "ageHours": 948.3, "postedAt": "2026-07-25T12:02:49+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書"]}, {"id": "3977228590588198488", "username": "shigotoyameyo7", "text": "仕事やめたい\n転職してオンライン秘書やオンライン事務、フルリモートで働かれている方いますか？\nお仕事はどこで見つけましたか？", "permalink": "https://www.threads.com/@shigotoyameyo7/post/Dcx9FS0iX5Y", "likes": 10, "velocity": 1.67, "ageHours": 5.5, "postedAt": "2026-09-02T18:50:16+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書"]}, {"id": "3968900291362011937", "username": "nurse_yorimichi", "text": "ドラマの医療シーンで\n「その手技はない」って言っちゃうやつ。\n家族に「静かに見て」って言われるまでが\nセットですよね笑", "permalink": "https://www.threads.com/@nurse_yorimichi/post/DcUXclvk7sh", "likes": 10, "velocity": 0.04, "ageHours": 281.3, "postedAt": "2026-08-22T07:03:25+09:00", "genres": ["手技"], "keywords": ["手技"]}, {"id": "3976862050597614146", "username": "natsumi_shinmama", "text": "オンライン秘書って何するの？とよく聞かれるので、\n実際にやっている作業を公開します📝\n\n特別なことは何もしてないよ！\n\n1つ目は、請求書の作成と入金の記録。\n\n決まったフォーマットに入力して、\n入金されたかを確認して印をつける作業です。\n（簿記の資格は要りませんでした）\n\n2つ目は、", "permalink": "https://www.threads.com/@natsumi_shinmama/post/Dcwpvb2mjJC", "likes": 9, "velocity": 0.51, "ageHours": 17.6, "postedAt": "2026-09-02T06:42:09+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書"]}, {"id": "3965789645871567850", "username": "yuki_code.design", "text": "これ、いくらなら欲しいですか？\n\nAIを使って\n美容・サロン向けのHPテンプレを試作中です👇\n\nまだ細かい余白や文字サイズは\nこれから調整します。\n\n想定してるのは、\n\n「HPは欲しい」\n「でも制作会社に何十万も払うのは厳しい」\n「自分でゼロから作るのも無理」\n\nっていう人。\n\n写真と文章を変えれば使えるところまで\n仕上げる予定です。\n\n1000円？\n3000円？\n5000円？\n\nそもそも欲しくない、でも全然OK。\n率直に知りたいです。", "permalink": "https://www.threads.com/@yuki_code.design/post/DcJUKvYGNPq", "likes": 9, "velocity": 0.02, "ageHours": 384.3, "postedAt": "2026-08-18T00:03:07+09:00", "genres": ["美容サロン"], "keywords": ["美容サロン"]}, {"id": "3956909655385629315", "username": "chihiro_ha_webwriter", "text": "よくデザインスクールの広告とかで、こういうの見かける\n\nいやいやいや…現実は……", "permalink": "https://www.threads.com/@chihiro_ha_webwriter/post/DbpxF3xkuKD", "likes": 9, "velocity": 0.01, "ageHours": 678.3, "postedAt": "2026-08-05T18:00:10+09:00", "genres": ["スクール"], "keywords": ["スクール"]}, {"id": "3959197352057883776", "username": "roko_shining", "text": "あのー、実はわたし、オンライン秘書として、\n特殊な方法で仕事獲得してます。\n\nどうやっているかというと、", "permalink": "https://www.threads.com/@roko_shining/post/Dbx5QPVE8yA", "likes": 8, "velocity": 0.01, "ageHours": 602.6, "postedAt": "2026-08-08T21:45:25+09:00", "genres": ["オンライン秘書"], "keywords": ["オンライン秘書"]}, {"id": "3967531400392058097", "username": "sora_harikyu", "text": "狛江にあるお日様が燦々とふりそそぐサロン風鍼灸院です。痛みやストレスから解放され、心身共にリフレッシュ！", "permalink": "https://www.threads.com/@sora_harikyu/post/DcPgMmrk6Tx", "likes": 8, "velocity": 0.02, "ageHours": 326.6, "postedAt": "2026-08-20T09:43:41+09:00", "genres": ["鍼灸"], "keywords": ["鍼灸"]}, {"id": "3968577005985935448", "username": "lino_pj_", "text": "明日は小牧夏祭りがあるみたい✨\nパーマネントジュエリーのポップアップ\nれんがやにて14時から20時でやってます😊\n\nシール販売もしてます！\nボンドロなど🫶", "permalink": "https://www.threads.com/@lino_pj_/post/DcTN8KxkzBY", "likes": 7, "velocity": 0.02, "ageHours": 292.0, "postedAt": "2026-08-21T20:21:07+09:00", "genres": ["パーマネントジュエリー"], "keywords": ["パーマネントジュエリー"]}, {"id": "3960563676927112143", "username": "lln_spatelier", "text": "「ヘッドスパが終わったら、\n帰らないといけない。」\n\nそれって当たり前なんですかね？", "permalink": "https://www.threads.com/@lln_spatelier/post/Db2v64hjjPP", "likes": 6, "velocity": 0.01, "ageHours": 557.3, "postedAt": "2026-08-10T19:00:03+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ"]}, {"id": "3910863564903153930", "username": "holisticlabo.caapa", "text": "リンパドレナージュのご予約\n受付中です☺️\n女性専用サロンです▓", "permalink": "https://www.threads.com/@holisticlabo.caapa/post/DZGLbEPEgEK", "likes": 6, "velocity": 0.0, "ageHours": 2203.1, "postedAt": "2026-06-03T05:14:48+09:00", "genres": ["リンパ"], "keywords": ["リンパ"]}, {"id": "3977222869391306764", "username": "_becla___27", "text": "エステの施術動画とかSNSにあげてる方って誰を撮ってるの？お客様？\nあと、ひとりサロンの方は撮影はどうしてるの？？？", "permalink": "https://www.threads.com/@_becla___27/post/Dcx7yCioPAM", "likes": 6, "velocity": 1.0, "ageHours": 5.7, "postedAt": "2026-09-02T18:38:54+09:00", "genres": ["美容サロン"], "keywords": ["美容サロン"]}, {"id": "3975842195244558901", "username": "artmake_paisen", "text": "アートメイクアーティストクーイズ！！\n\n気になる皆の現在の予約状況は？\n約3人に2人が", "permalink": "https://www.threads.com/@artmake_paisen/post/DctB2lij6o1", "likes": 5, "velocity": 0.1, "ageHours": 51.4, "postedAt": "2026-08-31T20:55:45+09:00", "genres": ["アートメイク"], "k 26-09-02T22:35:22+09:00", "genres": ["ヘッドスパ"], "keywords": ["ヘッドスパ"]}, {"id": "3975557494487669554", "username": "eri_artmake", "text": "目がみにくいから眉毛描きにくいって言う悩みから解消したいとの事\n朝のメイク時短は当たり前ですが、生活が楽に豊かになります。\nそして自分に自信が持てます。\nおなじお悩みの方、アートメイクという選択肢ありますよ✨\n\n岐阜県関市早川医院で眉毛、リップ\n頭皮、ホクロアートメイクやっております。\n岐阜県民の皆様、ぜひアートメイクでお悩み解決してみてくださいね✨", "permalink": "https://www.threads.com/@eri_artmake/post/DcsBHpTFFsy", "likes": 4, "velocity": 0.07, "ageHours": 60.8, "postedAt": "2026-08-31T11:30:06+09:00", "genres": ["アートメイク"], "keywords": ["アートメイク"]}, {"id": "3869224993314304838", "username": "karen_handmade", "text": "＼勝手に／ 陳列ダメ出し企画🙏笑\n1000円は単価UP目指せるのに勿体ない！\n\nマルシェに出る人はチャレンジしてみて✨\n👇どこが勿体ないかわかりますか？", "permalink": "https://www.threads.com/@karen_handmade/post/DWyP6Gij_NG", "likes": 4, "velocity": 0.0, "ageHours": 3581.9, "postedAt": "2026-04-06T18:26:24+09:00", "genres": ["単価UP"], "keywords": ["単価UP"]}, {"id": "3962853058854241169", "username": "junkatakeuchi", "text": "パーマネントジュエリーが気になってたのでゲットしちゃいました✨\nやり出すと止まらなくなりそうな予感…\n秋にMRI予約してるからその時の再溶接時にデザイン変更とピンクゴールドの追加をお願いしようかな。", "permalink": "https://www.threads.com/@junkatakeuchi/post/Db-4dxmE8OR", "likes": 4, "velocity": 0.01, "ageHours": 481.5, "postedAt": "2026-08-13T22:48:40+09:00", "genres": ["パーマネントジュエリー"], "keywords": ["パーマネントジュエリー"]}, {"id": "3938493107988969944", "username": "karinonnontan", "text": "またなっちゃった。\nリンパ管炎だろうな。\n傷口から伸びる赤い線。\n　\n前回は足。\n今回は手。指の傷。脇が痛いなー。\n　\n免疫力落ちる更年期ね。\nたのむよ！マクロファージさん！", "permalink": "https://www.threads.com/@karinonnontan/post/DaoVp1cAbnY", "likes": 3, "velocity": 0.0, "ageHours": 1288.2, "postedAt": "2026-07-11T08:09:47+09:00", "genres": ["リンパ"], "keywords": ["リンパ"]}, {"id": "3883520238427415567", "username": "ohachi2026", "text": "ココナラ始めて2ヶ月目に20万いった、ワンオペママの私から言わせてもらうと、AI×ココナラはほんっっっっっとに簡単。初心者スキル無しでもコレほど単価高く取れるのは正直他にない。ただ1つだけ意識しないと行けないことがあって、", "permalink": "https://www.threads.com/@ohachi2026/post/DXlCRTBgaQP", "likes": 3, "velocity": 0.0, "ageHours": 3108.5, "postedAt": "2026-04-26T11:48:30+09:00", "genres": ["高単価     if (cls) el.className = cls;
    if (text !== undefined) el.textContent = text;
    return el;
  }

  // 文節を1かたまりとして置く。途中で改行されないので、
  // 「を」「と」などの助詞が行頭に来ることがなくなる。
  function phrases(parent, list) {
    list.forEach(function (t) { parent.appendChild(mk('span', 'nb', t)); });
    return parent;
  }

  // --- 集計 ---
  // タイルは必ず4枚。ジャンルはここに混ぜず、下の棒グラフで見せる。
  (function renderSummary() {
    var tiles = [
      ['表示中の投稿', SUMMARY.total, '件'],
      ['直近7日の投稿', SUMMARY.thisWeek, '件'],
      ['1000いいね超え', SUMMARY.over1000, '件'],
      ['投稿者', SUMMARY.authors, '人']
    ];
    tiles.forEach(function (t) {
      var box = mk('div', 'stat');
      box.appendChild(mk('span', 'stat-label', t[0]));
      var v = mk('div', 'stat-value', t[1].toLocaleString());
      v.appendChild(mk('span', 'unit', t[2]));
      box.appendChild(v);
      els.summary.appendChild(box);
    });
  })();

  // --- ジャンル別の内訳 ---
  // 棒の長さは最多ジャンルを100%とした相対値。1つの投稿が複数ジャンルに
  // 入ることがあり、合計が総数と一致しないため、全体に対する割合としては見せない。
  (function renderBreakdown() {
    if (!SUMMARY.genres.length) { els.breakdown.remove(); return; }

    els.breakdown.appendChild(mk('p', 'breakdown-title', 'ジャンル別'));
    var max = SUMMARY.genres.reduce(function (m, p) { return Math.max(m, p[1]); }, 0);

    // 長いジャンル名は固定幅の列に1行では収まらない。
    // 「・」の位置だけで折り、カタカナ語の途中では絶対に割らない。
    function nameParts(name) {
      var parts = name.split('・');
      return parts.map(function (t, i) {
        // 「・」は前の語にくっつける。行頭に落とさないため
        return i < parts.length - 1 ? t + '・' : t;
      });
    }

    SUMMARY.genres.forEach(function (pair) {
      var row = mk('div', 'bar-row');
      if (pair[1] === 0) row.classList.add('pending');
      row.appendChild(phrases(mk('span', 'bar-name'), nameParts(pair[0])));

      var track = mk('div', 'bar-track');
      var fill = mk('div', 'bar-fill');
      fill.style.width = (max > 0 ? (pair[1] / max) * 100 : 0) + '%';
      track.appendChild(fill);
      row.appendChild(track);

      // 数字は出さない。棒の長さで強弱は足りる。
      // まだ集まっていないものだけ、空の棒の理由が分かるよう言葉を添える
      row.appendChild(mk('span', 'bar-count', pair[1] === 0 ? '収集待ち' : ''));
      els.breakdown.appendChild(row);
    });
  })();

  // 何件のうち何件を見ているのかを明示する。
  // 「最終収集」は実際に収集した時刻。HTMLを作り直しただけでは進まない。
  (function renderStamp() {
    var stamp = document.getElementById('stamp');
    var collectedAt = SUMMARY.updatedAt || '2026-09-03 00:19';
    var units = ['最終収集 ' + collectedAt];
    if (SUMMARY.archived > SUMMARY.total) {
      units.push('　/　蓄積 ' + SUMMARY.archived.toLocaleString() + ' 件のうち ');
      units.push(SUMMARY.total.toLocaleString() + ' 件を表示');
    }
    phrases(stamp, units);
  })();

  KEYWORDS.forEach(function (k) {
    var o = document.createElement('option');
    o.value = k; o.textContent = 'キーワード: ' + k;
    els.keyword.appendChild(o);
  });

  // --- ジャンルの絞り込み ---
  // 対象の10ジャンルを全部並べる。ローテーションで今日まだ回っていないジャンルを
  // 隠すと、扱う範囲が狭まったように見えるため。
  // ジャンルが10個並ぶので、どれを押したか数えなくても戻れる「すべて」を先頭に置く。
  var chipStates = [];

  function makeChip(label, onActivate) {
    var b = mk('span', 'chip');
    b.appendChild(mk('span', 'chip-name', label));
    if (onActivate) {
      b.tabIndex = 0;
      b.setAttribute('role', 'button');
      b.addEventListener('click', onActivate);
      b.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onActivate(); }
      });
    } else {
      // 1件も無いので押しても何も起きない。操作対象から外す
      b.classList.add('pending');
      b.setAttribute('aria-disabled', 'true');
      b.title = 'まだ収集していません';
    }
    els.genres.appendChild(b);
    return b;
  }

  function syncChips() {
    chipStates.forEach(function (s) {
      var on = s.isOn();
      s.el.classList.toggle('on', on);
      s.el.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  var allChip = makeChip('すべて', function () {
    activeGenres.clear();
    syncChips();
    render();
  });
  chipStates.push({ el: allChip, isOn: function () { return activeGenres.size === 0; } });

  GENRES.forEach(function (pair) {
    var g = pair[0];
    if (pair[1] === 0) { makeChip(g, null); return; }
    var chip = makeChip(g, function () {
      if (activeGenres.has(g)) activeGenres.delete(g);
      else activeGenres.add(g);
      syncChips();
      render();
    });
    chipStates.push({ el: chip, isOn: function () { return activeGenres.has(g); } });
  });

  syncChips();

  function fmtAge(h) {
    if (h === null || h === undefined) return '不明';
    if (h < 24) return Math.round(h) + '時間前';
    return Math.round(h / 24) + '日前';
  }

  function filtered() {
    var days = parseInt(els.period.value, 10);
    var kw = els.keyword.value;
    var q = els.q.value.trim().toLowerCase();

    return POSTS.filter(function (p) {
      if (days > 0) {
        if (p.ageHours === null || p.ageHours > days * 24) return false;
      }
      if (kw && p.keywords.indexOf(kw) === -1) return false;
      if (activeGenres.size > 0) {
        var hit = p.genres.some(function (g) { return activeGenres.has(g); });
        if (!hit) return false;
      }
      if (q) {
        var hay = (p.text + ' ' + p.username).toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function sorted(rows) {
    var mode = els.sort.value;
    var copy = rows.slice();
    if (mode === 'likes') copy.sort(function (a, b) { return b.likes - a.likes; });
    else if (mode === 'newest') copy.sort(function (a, b) {
      var av = a.ageHours === null ? Infinity : a.ageHours;
      var bv = b.ageHours === null ? Infinity : b.ageHours;
      return av - bv;
    });
    else copy.sort(function (a, b) { return b.velocity - a.velocity; });
    return copy;
  }

  function render() {
    var rows = sorted(filtered());
    els.count.textContent = rows.length + ' 件を表示';
    els.list.textContent = '';

    if (rows.length === 0) {
      // 「絞り込みを」を1かたまりにして、「を」が行頭に来ないようにする
      els.list.appendChild(phrases(mk('div', 'empty'), [
        '条件に合う投稿が', 'ありません。', '絞り込みを', '緩めてください。'
      ]));
      return;
    }

    var frag = document.createDocumentFragment();
    rows.forEach(function (p, i) {
      var isRising = p.velocity >= RISING;
      var card = mk('div', 'card' + (isRising ? ' rising' : ''));

      var head = mk('div', 'card-head');
      head.appendChild(mk('span', 'rank', String(i + 1)));
      head.appendChild(mk('span', 'user', '@' + p.username));
      if (isRising) head.appendChild(mk('span', 'badge', '伸び中'));

      var stats = mk('div', 'stats');
      stats.appendChild(mk('span', 'likes', p.likes.toLocaleString() + ' likes'));
      stats.appendChild(mk('span', 'vel', p.velocity.toFixed(1) + '/h'));
      stats.appendChild(mk('span', 'age', fmtAge(p.ageHours)));
      head.appendChild(stats);
      card.appendChild(head);

      card.appendChild(mk('p', 'text', p.text));

      var tags = mk('div', 'tags');
      // ジャンル名と検索語が同じことがある（1ジャンル1語の構成）。
      // そのまま並べると「ピラティス ピラティス」と二重に出る
      var seenTags = {};
      p.genres.concat(p.keywords).forEach(function (t) {
        if (seenTags[t]) return;
        seenTags[t] = true;
        tags.appendChild(mk('span', 'tag', t));
      });
      if (p.permalink) {
        var a = mk('a', 'link', '元投稿を開く →');
        a.href = p.permalink;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        tags.appendChild(a);
      }
      card.appendChild(tags);
      frag.appendChild(card);
    });
    els.list.appendChild(frag);
  }

  [els.sort, els.period, els.keyword].forEach(function (el) {
    el.addEventListener('change', render);
  });
  els.q.addEventListener('input', render);

  render();
})();
</script>
