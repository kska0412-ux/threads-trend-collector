<style>
  /* 明るい側を基準に全トークンを定義する。暗い側は下で上書きする。 */
  :root {

  @media (prefers-color-scheme: dark) {

      --surface: #1f1a1e;
      --surface-2: #241e23;
      --ink: #f0eaee;
      --muted: #a3969e;
      --border: #332b31;
      --accent: #e086b0;
      --accent-soft: #3a2130;
      --rising: #4fc3ae;
      --rising-soft: #16332e;
      --chip: #2c2429;
      --focus: #e086b0;
    }
  }
  /* 閲覧者が暗いテーマを選んだとき。OS の設定に関係なく効かせる。 */
  :root[data-theme="dark"] {
    --bg: #151114;
    --surface: #1f1a1e;
    --surface-2: #241e23;
    --ink: #f0eaee;
    --muted: #a3969e;
    --border: #332b31;
    --accent: #e086b0;
    --accent-soft: #3a2130;
    --rising: #4fc3ae;
    --rising-soft: #16332e;
    --chip: #2c2429;
    --focus: #e086b0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    /* 透明のままだと閲覧側の地の色を借りてしまうので必ず塗る */
    background: var(--bg);
    color: var(--ink);
    /* 日本語本文はWebフォントを落とすと重いので、端末のフォントを使う */
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
                 -apple-system, BlinkMacSystemFont, "Yu Gothic Medium", sans-serif;
    line-height: 1.75;
    font-feature-settings: "palt" 1;
    word-break: normal;
    overflow-wrap: break-word;
    line-break: strict;
  }

  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px 96px; }

  :focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* --- 見出し --- */
  h1 {
    font-family: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    font-weight: 900;
    font-size: clamp(1.5rem, 4vw, 2.1rem);
    line-height: 1.35;
    letter-spacing: .01em;
    margin: 0;
    text-wrap: balance;
  }
  /* 対象ジャンルの但し書き。名前より一段弱く見せる */
  .ver {
    display: block;
    font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    font-weight: 400;
    font-size: .74rem;
    letter-spacing: .02em;
    color: var(--muted);
    margin-top: 6px;
  }

  /* --- 集計：詳細より先に全体像を出す --- */
  .panel {
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
    margin: 28px 0 8px;
  }
  /* 4枚で固定する。auto-fit だと枚数によって最後の1枚だけ次の行に
     取り残され、空いた枠が塗り残しに見えてしまうため。 */
  .summary {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
  }
  @media (max-width: 620px) {
    /* 4枚なので2列でもきれいに埋まる */
    .summary { grid-template-columns: repeat(2, 1fr); }
  }

  .breakdown { padding: 15px 16px 17px; border-top: 1px solid var(--border); }

    margin: 0 0 11px; white-space: nowrap;
  }
  .bar-row {

    grid-template-columns: 6.5em 1fr auto;
    gap: 12px; align-items: center;
  }
  .bar-row + .bar-row { margin-top: 8px; }
  .bar-name { font-size: .76rem; white-space: nowrap; }
  .bar-track {

    font-variant-numeric: tabular-nums; white-space: nowrap;

  @media (max-width: 620px) {

  .stat-label {
    font-size: .7rem; color: var(--muted); letter-spacing: .06em;

    font-size: .7rem; color: var(--muted); margin: 0 0 26px;

    border-bottom: 1px solid var(--border);

  select, input[type=search] {

  input[type=search] { flex: 1; min-width: 180px; }
  .chip {

  .count {
    white-space: nowrap;
    font-family: "Roboto Mono", ui-monospace, monospace;
    color: var(--muted); font-size: .76rem; margin-bottom: 14px;
    font-variant-numeric: tabular-nums;
  }

  /* --- カード --- */
  #list { display: flex; flex-direction: column; gap: 10px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid transparent;
    border-radius: 10px;
    padding: 16px 18px;
  }

  .card.rising { border-left-color: var(--rising); background: var(--surface-2); }

  .card-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 9px; }
  .rank {
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; color: var(--muted);
    font-variant-numeric: tabular-nums; min-width: 2.4em;

  .user { font-weight: 700; font-size: .86rem; }
  .badge {
    white-space: nowrap;
    font-size: .66rem; font-weight: 700; letter-spacing: .04em;
    padding: 2px 8px; border-radius: 999px;
    background: var(--rising-soft); color: var(--rising);
  }
  .stats {
    margin-left: auto; display: flex; gap: 11px;
    font-family: "Roboto Mono", ui-monospace, monospace;
    font-size: .74rem; font-variant-numeric: tabular-nums;

  .likes { color: var(--accent); font-weight: 700; }
  .vel { color: var(--rising); font-weight: 500; }
  .age { color: var(--muted); }

    overflow-wrap: break-word;
    line-break: strict;

  .nb { white-space: nowrap; }

  .empty { text-align: center; color: var(--muted); padding: 64px 20px; font-size: .88rem; }
</style>

"text": "今、韓国でバズってる小顔マッサージ。\n1日5分やるだけで、マジでみんなに｢顔小さくなった!?｣って褒められる🥹￼", "permalink": "https://www.threads.com/@chiho_chico/post/DZ1bo0NCbix", "likes": 1643, "velocity": 0.94, "ageHours": 1745.9, "postedAt": "2026-06-21T13:40:48+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3869041701197700953", "username": "alligator.775617", "text": "美人ってやっぱり、輪郭というか、顔の下半分だと思うのよ。\nあとは肌。", "permalink": "https://www.threads.com/@alligator.775617/post/DWxmO2dD99Z", "likes": 1578, "velocity": 0.44, "ageHours": 3571.2, "postedAt": "2026-04-06T12:22:14+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3853312978032079033", "username": "sacchan_moto_biyou", "text": "全ての顔タイプの子たちにおすすめしたい。\nどんな顔立ちでもやっぱりﾌｪｲｽﾗｲﾝ整ったら日常のモチベが確実に上がるよ…✌🏻🎀 ˎˊ˗ 盛りすぎない自然な輪郭がほんとにお気に入り🩵", "permalink": "https://www.threads.com/@sacchan_moto_biyou/post/DV5t7zgATC5", "likes": 1486, "velocity": 0.36, "ageHours": 4092.1, "postedAt": "2026-03-15T19:32:04+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3971628422360028354", "username": "cacao.chocolate.o1", "text": "これずっと毛穴だと思ってたけどクレーターの可能性でてきた？顔脱毛とか毛穴治療あんま効いてない気がする。おすすめの美容医療とか商品あれば教えてください🙇‍♀️（マツエクは2ヶ月前に付けたやつなので取れかけ失礼）", "permalink": "https://www.threads.com/@cacao.chocolate.o1/post/DceDwHunVTC", "likes": 1484, "velocity": 8.52, "ageHours": 174.2, "postedAt": "2026-08-26T01:23:44+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3938841903249422753", "username": "tomodachi_kecak", "text": "髪洗ってるときすごい量の髪の毛抜けて、ドライヤーしたらまた髪の毛抜けるじゃん\n髪伸びるのって時間かかるのに、ハゲにならんの結構不思議", "permalink": "https://www.threads.com/@tomodachi_kecak/post/Dapk9eVmvmh", "likes": 1417, "velocity": 1.12, "ageHours": 1259.9, "postedAt": "2026-07-11T19:42:46+09:00", "genres": ["薄毛", "育毛"], "keywords": ["髪 ボリューム", "発毛"]}, {"id": "3965966771765335991", "username": "yukiavatar", "text": "本当に精神が病んでる人って、「風呂キャン」「飯キャン」「既読スルー」「毎日クタクタ」「髪がボサボサ」「休日寝たきり」「部屋がグチャグチャ」「夜眠れない」「人に会いたくない」「顔が無表情」そして、精神が病んでる人には一番の特徴があって、それは、", "permalink": "https://www.threads.com/@yukiavatar/post/DcJ8cQuE1e3", "likes": 1368, "velocity": 3.78, "ageHours": 361.7, "postedAt": "2026-08-18T05:55:16+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3890294805259549504", "username": "eiburu_jiji_imoto", "text": "40歳すぎたら\nここ放置が一番老けます。\n\n実はここ👇\n👉神経と血流の“ハブ”\n\nここが詰まると\n✔ 白髪\n✔ 薄毛\n✔ たるみ\n\n全部つながってきます。\n\nだから今日は\n誰でもできる\n3つのエクササイズ入れてます👇\n\nとりあえず\n1個でもいいのでやってみてください👍\n\n👇やった人だけ変わるやつです\n\n#白髪対策\n#薄毛対策\n#頭皮ケア\n#自律神経整える\n#食いしばり改善", "permalink": "https://www.threads.com/@eiburu_jiji_imoto/post/DX9GoODCvtA", "likes": 1170, "velocity": 0.41, "ageHours": 2867.5, "postedAt": "2026-05-05T20:08:26+09:00", "genres": ["薄毛", "育毛"], "keywords": ["AGA", "頭皮マッサージ", "薄毛 対策"]}, {"id": "3919403234142850104", "username": "mafu_career", "text": "ハゲてきた男は薬呑め。\n3ヶ月で一応復活したから。", "permalink": "https://www.threads.com/@mafu_career/post/DZkhHm-mgw4", "likes": 1155, "velocity": 0.61, "ageHours": 1903.6, "postedAt": "2026-06-15T00:01:36+09:00", "genres": ["育毛"], "keywords": ["抜け毛 対策", "育毛剤"]}, {"id": "3935611355290330196", "username": "bijin_face", "text": "歯科衛生士として何万回でも言う。35歳を過ぎたら、骨が広がって目の下がたるむ。頬骨や眼窩まわりの骨は年齢とともに少しずつ広がっていく。眼窩が広がると眼輪筋が支えきれなくなって、皮膚脂肪と下に落ちる。たるみ解消するならちょっといい化粧水美容液よりも、", "permalink": "https://www.threads.com/@bijin_face/post/DaeGa0GEuRU", "likes": 1009, "velocity": 0.74, "ageHours": 1366.9, "postedAt": "2026-07-07T08:44:15+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線", "たるみ 改善"]}, {"id": "3885041921852829223", "username": "aromamion.33", "text": "ローソンで買える無印良品の\n頭皮マッサージもできるブナ材ヘアコーム。\n\nかっさセラピスト目線で、\n持ち方や流し方をお伝えしてみました。\n\nまず感じたのは、コスパのよさ。\nそして、持ちやすくて使いやすいサイズ感。\n普段使いにはとてもいいと思います。\n\n今回は撮り方が少しわかりにくくなってしまいましたが、\n参考にしていただけたら嬉しいです。\nお客様に試していただくと\n\n「やさしい感じですね」とのお声も。\nやはり水牛の角プレートとは\n浸透感の違いを感じますが\n気軽に取り入れやすいアイテムとしてはおすすめです。", "permalink": "https://www.threads.com/@aromamion.33/post/DXqcQtJie4n", "likes": 996, "velocity": 0.33, "ageHours": 3041.4, "postedAt": "2026-04-28T14:11:49+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3955495335774921795", "username": "biyoubiyou13", "text": "初めましての美容師さんに、「白髪、少なっ！！！髪にいくらかけてます？」ってめちゃくちゃ驚かれた。「実は頭皮にマグネシウムスプレーを毎日シュッシュしてるだけです」って答えたら、「え、", "permalink": "https://www.threads.com/@biyoubiyou13/post/Dbkvgz_lCRD", "likes": 961, "velocity": 1.36, "ageHours": 708.4, "postedAt": "2026-08-03T19:10:10+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3904725884317248348", "username": "mochi_bihada", "text": "ローソン限定の無印のかっさ付きコーム。\n「口が開く」「飛ぶぞ」って言われてるから解説しとく。\n\n頭皮と顔の皮膚は1枚で繋がってる。\nだから頭皮をかっさでほぐす＝顔が上がるは本当。\n\n特に効くのは↓\n・側頭筋（耳の上）→眼精疲労・目の開きUP\n・後頭筋（後頭部の下）→首肩こり・不眠\n・帽状腱膜（頭頂部）→自律神経・おでこのシワ\n・生え際→前頭筋ほぐして額のシワ予防\n\nコームタイプの良いところは、髪と一緒にケアできて続けやすいこと。お風呂場に置いて、シャンプー前に30秒やるだけで頭が軽くなる。\n\n「擦らずに、置いて揺らす」だけ覚えておいて。ちなみに顔で使うべきポイントは、", "permalink": "https://www.threads.com/@mochi_bihada/post/DYwX4DwAKtc", "likes": 947, "velocity": 0.4, "ageHours": 2389.6, "postedAt": "2026-05-25T18:00:20+09:00", "genres": ["育毛", "薄毛"], "keywords": ["頭皮ケア", "頭皮マッサージ", "生え際 後退"]}, {"id": "3864856519238675393", "username": "atsushi_bihatsu14", "text": "何度も言うけど、美容の現場にいて、血管が汚い人は、白髪がめちゃくちゃ多い。パサつき、抜け毛、頭皮が硬いのも原因は同じ。加齢と共に毛細血管はゴースト血管化しちゃうから最優先は「血管ケア」だよ。やり方は、", "permalink": "https://www.threads.com/@atsushi_bihatsu14/post/DWiuocBEuvB", "likes": 935, "velocity": 0.25, "ageHours": 3709.8, "postedAt": "2026-03-31T17:47:01+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3955856582227739427", "username": "minmin_to_milk", "text": "以前よりご意見をいただいてる目の下のたるみグマについてです。美容医療は大幅に予算オーバーだし怖いので、メイクで少しでも改善したいです。\n\n日差しのあるところで撮り直しました。\nメイクはしてません。\n\nコンシーラーの神様が降りてきますように…", "permalink": "https://www.threads.com/@minmin_to_milk/post/DbmBpo-E0Mj", "likes": 916, "velocity": 1.32, "ageHours": 696.5, "postedAt": "2026-08-04T07:07:54+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3958384551961143112", "username": "rira_yukari", "text": "糸リフト片側3本ずつ！今回もいい感じに自然にリフトアップできて満足の39歳女\n(わかりやすいように同じ服きて同じ場所で撮った)", "permalink": "https://www.threads.com/@rira_yukari/post/DbvAccQCadI", "likes": 868, "velocity": 1.42, "ageHours": 612.8, "postedAt": "2026-08-07T18:50:31+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3896127384605353984", "username": "kaho.hanarabi", "text": "衝撃的なこと言います…\n顔立ちも実は遺伝だけではありません。\n常に口呼吸だと\n鼻の高さ、顎の小ささ、目の下のクマ…\n顔の表情まで変えてしまうのです…", "permalink": "https://www.threads.com/@kaho.hanarabi/post/DYR0za3EugA", "likes": 830, "velocity": 0.31, "ageHours": 2674.3, "postedAt": "2026-05-13T21:16:39+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3904154147415641783", "username": "escape_aira", "text": "私の顔に対して色んな事言ってくる人間沢山いるけど自分の顔嫌いじゃないし好きな自分になる為に\nまだまだ整形する予定.\n\nまつ毛は頑張って薄くするぅ.", "permalink": "https://www.threads.com/@escape_aira/post/DYuV4MRE863", "likes": 823, "velocity": 0.34, "ageHours": 2408.5, "postedAt": "2026-05-24T23:06:24+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3964932758179147968", "username": "tora_mamama", "text": "だから何度でも言うけど、こういう毛穴は朝にナイアシンアミド→夜にアゼライン酸仕込めば２週間ぐらいで見違えるってば。これ使ってみな", "permalink": "https://www.threads.com/@tora_mamama/post/DcGRVYhk_DA", "likes": 818, "velocity": 2.07, "ageHours": 395.9, "postedAt": "2026-08-16T19:40:38+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3906272047135847015", "username": "sefu_chan2", "text": "胸鎖乳突筋を鍛えると顔の肉が消える。\nこれマジで革命的に効くから話す。\n首の横、耳の下から鎖骨にかけて伸びる筋肉。\nここを意識的に動かすだけで、フェイスラインが別人になる。\n2週間で輪郭が出てくる人もいる。覚えとけ。", "permalink": "https://www.threads.com/@sefu_chan2/post/DY13bsFkfJn", "likes": 813, "velocity": 0.35, "ageHours": 2338.4, "postedAt": "2026-05-27T21:12:20+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3907004974445537657", "username": "kumi_biyo_official", "text": "ちょい怖いこと言うと、、、\nすり鉢毛穴は「皮脂」でも「汚れ」でもなく炎症で地盤が凹む構造トラブルやねん。本気で卒業したい40代は、今日から3つの成分でケア始めて。￼", "permalink": "https://www.threads.com/@kumi_biyo_official/post/DY4eFL1gql5", "likes": 721, "velocity": 0.31, "ageHours": 2314.1, "postedAt": "2026-05-28T21:28:29+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3937960063256316381", "username": "antyan_beauty", "text": "ストレートネックの人！！！！！二重あごになるし、ほうれい線目立つし、顔むくむし、めっちゃ老けて見えるから、今すぐこれやって！！！！！", "permalink": "https://www.threads.com/@antyan_beauty/post/DamcdA2EUnd", "likes": 712, "velocity": 0.55, "ageHours": 1289.1, "postedAt": "2026-07-10T14:30:43+09:00", "genres": ["フェイシャル"], "keywords": ["小顔", "ほうれい線"]}, {"id": "3970561344102089602", "username": "mellow.days_7", "text": "噂の固形シャンプー、思い切って使ってみた。\n\nキシキシしそうで正直不安だったけど、\n洗い上がりの頭皮のすっきり感が想像以上でびっくり。\n\n場所取らないし、減りもゆっくりでコスパいいし、\n乾かしたあと髪がふんわりする感じも好き🛁\n\n今まで高いシャンプー探し回ってたの何だったんだろう……😂", "permalink": "https://www.threads.com/@mellow.days_7/post/DcaRIFqGkOC", "likes": 709, "velocity": 3.38, "ageHours": 209.5, "postedAt": "2026-08-24T14:03:38+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3846752425135555048", "username": "yoshie.d58", "text": "左の写真は23歳、出産まもなくなので、顔も二重顎です。右は66歳の私です。整形などは一切しておりません。リフトアップもしていません。自分のホームケアと運動のみです。￼小鼻も広がっていません。", "permalink": "https://www.threads.com/@yoshie.d58/post/DViaPMfE8Ho", "likes": 677, "velocity": 0.16, "ageHours": 4309.3, "postedAt": "2026-03-06T18:17:25+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3967070676339993332", "username": "iikurashi_i", "text": "最短で垢抜けたいなら、この前髪真似してみ。\nセンターで分けて左右は毛量残したまま、真ん中だけシースルー。これがもう誰にでも似合う黄金垢抜け前髪なんですよ。", "permalink": "https://www.threads.com/@iikurashi_i/post/DcN3cL-HSr0", "likes": 669, "velocity": 2.06, "ageHours": 325.1, "postedAt": "2026-08-19T18:28:18+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3957695176390025818", "username": "megu_tsi_com", "text": "助けてほしい、、、\n顔脂肪いらない人無料でください🥹\n明日〜8/30まで小顔デトックスエステの\n練習モデルになって欲しいです…🥲💧￼", "permalink": "https://www.threads.com/@megu_tsi_com/post/DbsjstOASJa", "likes": 669, "velocity": 1.05, "ageHours": 635.6, "postedAt": "2026-08-06T20:00:52+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3919358441610214321", "username": "kokonatukokonatu", "text": "最近一般人でもめちゃくちゃ整形顔の人多いな〜。頬パンパン、二重くっきり、唇ぽてぽて、肌テッカテカ。美人かもしれないけど、美人じゃなくても自然な顔のが良くない！？", "permalink": "https://www.threads.com/@kokonatukokonatu/post/DZkW7yrmvux", "likes": 648, "velocity": 0.34, "ageHours": 1905.1, "postedAt": "2026-06-14T22:32:37+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3944679201134679413", "username": "sns__biyo_koretukao", "text": "垢BANされても言う。イチゴ鼻はナイアシンアミドとアゼライン酸だけで治る理由について業界が絶対に言いたくないことを今日全部話す。大手美容メーカーで10年いた私がずっと喉まで出かかってたやつを吐き出す。まず業界が隠してることを話す。毛穴パック・毛穴ケア美容液・皮脂ケア洗顔でイチゴ鼻を何年も対応しようとしてる人、そのケアが一生「毛穴ケアコスメを買い続けるループ」から抜け出せなくさせてる原因になってるケースがある。ナイアシンアミドとアゼライン酸の組み合わせが正しく広まると毛穴パックも毛穴ケア専用美容液も全部売れなくなる。だからメーカーは絶対教えたくない。これが現実だ。次にクリニックが絶対に教えないことを話す。", "permalink": "https://www.threads.com/@sns__biyo_koretukao/post/Da-UNVogRV1", "likes": 645, "velocity": 0.6, "ageHours": 1066.6, "postedAt": "2026-07-19T21:00:26+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3900297135317443474", "username": "k_kumiko_k", "text": "やっと白髪染めした⸜(* ॑ ॑* )⸝📷✩*°\n顔周りにチラつく白髪はうっとうしくてたまらんっっ！\nこのまま 何処が出かけたい気分ෆ˚*\n最近  太った！パンパンや！二重アゴや！\nって言われるケド､､､たるみ、ほうれい線の方が気になる🥹‪\nどーにもならないよな､､､\n良いと言われてやってた事が逆効果だったりとか(◎_◎; )  よく分かんないや💦\n若い子が羨ましいわ(´Д｀)ﾊｧ…", "permalink": "https://www.threads.com/@k_kumiko_k/post/DYgo5R1EeOS", "likes": 621, "velocity": 0.24, "ageHours": 2536.2, "postedAt": "2026-05-19T15:21:12+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3932765929499240572", "username": "asaasaaabb", "text": "33歳でこの薄さ…薄毛治療しないと😭😭うわーん😭😭", "permalink": "https://www.threads.com/@asaasaaabb/post/DaT_ca0j6h8", "likes": 610, "velocity": 0.42, "ageHours": 1461.1, "postedAt": "2026-07-03T10:30:54+09:00", "genres": ["薄毛", "育毛"], "keywords": ["薄毛 対策", "育毛剤"]}, {"id": "3954451894341128692", "username": "pppni1220", "text": "白髪が止まらない 助けて 32歳です\n髪の毛も乾かしたてなのにバサバサ\n妊活のストレスと遺伝で凄いことになってる\n髪染めても意味がない数日で白髪復活\n\nあああどうしたらいいんだろう\n誰か同じ悩みを持つ人いらっしゃいますか…\nどう対策しているか教えて欲しいです\n\n子供欲しいけど産後もう頭真っ白になってしまうんじゃないかと思って不安でここ数ヶ月妊活に対して後ろ向きです", "permalink": "https://www.threads.com/@pppni1220/post/DbhCQvbktH0", "likes": 590, "velocity": 0.79, "ageHours": 743.0, "postedAt": "2026-08-02T08:37:02+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策", "つむじ 薄毛"]}, {"id": "3919136552105671067", "username": "yk12.20yk", "text": "やっぱ顔や頭が大きいと、美人や可愛くても何となく垢抜けない気がするんだよなー\n小顔の美人って本当最強。羨ましい\n首は長い方なんだけど、面長＆頭蓋骨大きめの私はどうすれば垢抜けられるんだ😂😂", "permalink": "https://www.threads.com/@yk12.20yk/post/DZjke3-gfmb", "likes": 585, "velocity": 0.31, "ageHours": 1912.4, "postedAt": "2026-06-14T15:11:45+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3848967851366083188", "username": "bagel_pan_o", "text": "垢抜けっていかに顔の余白部分を消せるかやと思ってる、小顔になると一気に美女感でる‼️\n系リフト、脂肪吸引なしでここまで変われたよ\n(Before →Afterの順)", "permalink": "https://www.threads.com/@bagel_pan_o/post/DVqR948kup0", "likes": 574, "velocity": 0.14, "ageHours": 4235.9, "postedAt": "2026-03-09T19:39:04+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3899766215082114387", "username": "shizuka_bodymake", "text": "たるみ治療で1番効果あったもの教えてください🫣\nできれば麻酔すれば耐えれるものがいいなぁ🥺\n糸リフト以外で🙏", "permalink": "https://www.threads.com/@shizuka_bodymake/post/DYewLX1Cf1T", "likes": 571, "velocity": 0.22, "ageHours": 2553.8, "postedAt": "2026-05-18T21:46:21+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善", "リフトアップ"]}, {"id": "3957695771513083177", "username": "mochi_bihada", "text": "ローソン限定の無印のかっさ付きコーム。\n「口が開く」「飛ぶぞ」って言われてるから解説しとく。\n\n頭皮と顔の皮膚は1枚で繋がってる。\nだから頭皮をかっさでほぐす＝顔が上がるは本当。\n\n特に効くのは↓\n・側頭筋（耳の上）→眼精疲労・目の開きUP\n・後頭筋（後頭部の下）→首肩こり・不眠\n・帽状腱膜（頭頂部）→自律神経・おでこのシワ\n・生え際→前頭筋ほぐして額のシワ予防\n\nコームタイプの良いところは、髪と一緒にケアできて続けやすいこと。お風呂場に置いて、シャンプー前に30秒やるだけで頭が軽くなる。\n\n「擦らずに、置いて揺らす」だけ覚えておいて。ちなみに顔で使うべきポイントは、", "permalink": "https://www.threads.com/@mochi_bihada/post/Dbsj1XeGlUp", "likes": 569, "velocity": 0.9, "ageHours": 635.6, "postedAt": "2026-08-06T20:02:12+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3910641552238887000", "username": "yuuu__24nn", "text": "アラフォーで美容皮膚科通ってる\n美意識高い方たちーー！！！！\nこれやってよかったよ！！っていうのが\nあれば是非教えてくださいっ✨\nちなみに皮膚科の先生からは\nポテンツァ、ハイドラあたりを進められたけど\n実際やってる方の意見も聞きたい🥹\nシミシワくすみ毛穴が悩み😇", "permalink": "https://www.threads.com/@yuuu__24nn/post/DZFY8W1FMBY", "likes": 566, "velocity": 0.26, "ageHours": 2193.7, "postedAt": "2026-06-02T21:53:42+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3851060770331818524", "username": "__ikanam__", "text": "マッサージとか色々調べて試してるけど、\nほんとに消えないここのたるみ\nもう美容医療とかプロに任せるしかないんだろうか\n自分の横顔の写真撮って精神的ダメージくらって、それをトレースしながらこの画像描いてまた精神的ダメージくらって\nもう家中の鏡割ろうかな", "permalink": "https://www.threads.com/@__ikanam__/post/DVxt13oEfoc", "likes": 563, "velocity": 0.14, "ageHours": 4166.6, "postedAt": "2026-03-12T16:57:20+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3927905001076199382", "username": "_so_poo", "text": "コスパよくて成分もいい！\n匂いもいいシャンプートリートメント！！\n\n２キロで4000円くらいだけど最高です。\nもう10数年使ってます！！！！\n\n小さいサイズもあるけど、この大容量がおすすめです！！！！まっじで！！！\n私は細くて猫っ毛です！\n旦那はしっかりの癖毛ですが、どちらにもいい感じです！！！まっっじで！！！！ま！！！！！！\n使って欲しい！！ほんとに！！！！！！！！", "permalink": "https://www.threads.com/@_so_poo/post/DaCuMmcoI_W", "likes": 559, "velocity": 0.34, "ageHours": 1622.0, "postedAt": "2026-06-26T17:33:06+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3959785921810020904", "username": "biyoubiyou13", "text": "初めましての美容師さんに、「白髪、少なっ！！！髪にいくらかけてます？」ってめちゃくちゃ驚かれた。「実は頭皮にマグネシウムスプレーを毎日シュッシュしてるだけです」って答えたら、「え、", "permalink": "https://www.threads.com/@biyoubiyou13/post/Dbz_FDoFDoo", "likes": 533, "velocity": 0.94, "ageHours": 566.4, "postedAt": "2026-08-09T17:14:48+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3850444973070771172", "username": "matsuzaki_nutrition", "text": "白髪対策には頭皮にマグネシウムスプレーを塗るのもよくて、特にストレスによる白髪にはかなり良いと思う。ストレスによって増えすぎたノルアドレナリンは白髪の大きな要因の一つ。これを分解してくれるCOMTという酵素に必要なのがマグネシウム。だから頭皮に直接揉み込むのはおすすめ。\n\nマグネシウムスプレーの作り方は簡単で、スプレーボトルに【精製水50mlとにがり小さじ1】を入れるだけ。\n\nもし頭皮に塗ってみてピリピリするなら頭皮が極度のマグネシウム不足のサインかも。もちろん経口で1日400mgくらいは合わせて摂ることもお忘れなく！", "permalink": "https://www.threads.com/@matsuzaki_nutrition/post/DVvh01vEmPk", "likes": 533, "velocity": 0.13, "ageHours": 4187.0, "postedAt": "2026-03-11T20:33:51+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3916949693180113543", "username": "clamp_810", "text": "ほうれい線が…ほうれい線が濃ゆくなったの…私はどうなっていくの…\nまだ…まだ…あともう少しだけお姉さんでいたいだけ…もう少しだけお姉さんでいさせて…お願い…待って…by34歳", "permalink": "https://www.threads.com/@clamp_810/post/DZbzP45E3KH", "likes": 513, "velocity": 0.26, "ageHours": 1984.8, "postedAt": "2026-06-11T14:46:51+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3917735488694393066", "username": "beautyblog3010", "text": "ほんと笑うしかない😂😂\n日本いるなら、このパックは軽い気持ちで買わないで！！！\nだってほうれい線ケアが優秀すぎるんだもん😭✨\n使ってから明らかに印象変わったし、\n今では会う人みんなにおすすめしてるレベル🥹💕", "permalink": "https://www.threads.com/@beautyblog3010/post/DZel6t_khjq", "likes": 508, "velocity": 0.26, "ageHours": 1958.8, "postedAt": "2026-06-12T16:48:06+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3951869047222156036", "username": "aya.kogao", "text": "ほっぺがたるんできたら、 \n耳のうしろを10秒。 \n\n骨を起こせば、顔が若返ります。\nやり方は固定にあります📍", "permalink": "https://www.threads.com/@aya.kogao/post/DbX2_XmibsE", "likes": 503, "velocity": 0.61, "ageHours": 828.5, "postedAt": "2026-07-29T19:05:23+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3915889670983145081", "username": "happyyopy", "text": "小顔になりたくてたくさん頑張ってきたけど\n今度は頬コケして、３枚目今\nバブみを目指すのも大変🤣", "permalink": "https://www.threads.com/@happyyopy/post/DZYCOiSklZ5", "likes": 495, "velocity": 0.25, "ageHours": 2019.9, "postedAt": "2026-06-10T03:40:47+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3950227892756652692", "username": "nktgpj", "text": "最近頭皮が臭い気がしてて、美容室で1ヶ月前にヘッドスパしてもらったけど、もう戻ってきた…\n家でできる対策だと何が良いんだろう…", "permalink": "https://www.threads.com/@nktgpj/post/DbSB1bZmaKU", "likes": 493, "velocity": 0.56, "ageHours": 882.9, "postedAt": "2026-07-27T12:44:42+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3943229764361300609", "username": "ibuki000602", "text": "夜の頭皮ほぐしを毎晩続けたら、4週間で顔のたるみが別人レベル。", "permalink": "https://www.threads.com/@ibuki000602/post/Da5KpQcgKqB", "likes": 480, "velocity": 0.43, "ageHours": 1114.6, "postedAt": "2026-07-17T21:00:40+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3885281577731619354", "username": "wankononki", "text": "あの、ヘッドマッサージ教えてくれた方にお礼を言いたい！\n\nヘッドマッサージしたら頭が軽くなっただけでなく、顔のたるみも首の皮膚も持ち上がったのだが‼️\n\nリフトアップ‼️‼️\nもうやめられないし、ヘッドスパ行かなくて良くなっちゃった\n\n本当にありがとうございますm(_ _)m", "permalink": "https://www.threads.com/@wankononki/post/DXrSwKFD_oa", "likes": 455, "velocity": 0.15, "ageHours": 3033.5, "postedAt": "2026-04-28T22:07:58+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3912064408498605931", "username": "etsu_bodymake_", "text": "40代ほうれい線薄くなったルーティン\n\n①耳を折って後ろに引っ張りながら\n20回回す\n\n②顎の骨の最後(耳の下)をつまんで\n上下に20回ほぐす\n\n③親指を小鼻の横に当てて\n残りの4指は1頭の後ろへ\n親指で小鼻の横を20回ほぐす\n(痛気持ちいい所を探してね)\n\n保存して ①〜③をやってみてね😊", "permalink": "https://www.threads.com/@etsu_bodymake_/post/DZKcdo_Ag9r", "likes": 442, "velocity": 0.21, "ageHours": 2146.6, "postedAt": "2026-06-04T21:00:46+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3942954760357797544", "username": "beauty_buy_memo", "text": "衝撃だった。\n二重あごって「太ったせい」か「骨格のせい」だと思ってたけど、\n整体師の友人いわく\nシュッとしたフェイスラインを手に入れたいなら\n必死に食事制限で痩せるでもなく、\n毎日あご下のマッサージを頑張るでもなく、\n小顔ローラーを転がし続けるわけでもなく、、", "permalink": "https://www.threads.com/@beauty_buy_memo/post/Da4MHbAj96o", "likes": 435, "velocity": 0.39, "ageHours": 1123.7, "postedAt": "2026-07-17T11:54:17+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3962078028164321195", "username": "mio__beauty__", "text": "「35歳過ぎて顔のたるみやほうれい線が気になる」って人、これ知らないと絶対に損。\n前田敦子さんや井川遥さんが「毎日使ってます。もう手放せない」って言ってたこれ、一日5分で本気で顔変わる。", "permalink": "https://www.threads.com/@mio__beauty__/post/Db8IPmBHU-r", "likes": 418, "velocity": 0.85, "ageHours": 490.5, "postedAt": "2026-08-12T21:08:48+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3923794456655144668", "username": "aki_eye_juno703", "text": "同じ顔です。\n\n変えたのは眉毛だけ。\n\n眉毛の位置が1〜2mm変わるだけで\n目元の見え方はここまで変わります。\n\n「眉毛サロン行ってるのに垢抜けない」\n\nそんな人ほど\n形より位置を見直した方がいい。", "permalink": "https://www.threads.com/@aki_eye_juno703/post/DZ0HkTok6bc", "likes": 414, "velocity": 0.24, "ageHours": 1758.2, "postedAt": "2026-06-21T01:26:11+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3970701333662203309", "username": "honey_haircare_chan", "text": "見たら絶対メモって。テストに出るから覚えとけ。\n・抜け毛には「亜鉛」\n・うねり・くせ毛には「トステア」\n・ボリューム不足には「タンパク質」\n・湿気のうねりには「レブリン酸」\n・ダメージ毛には「ファイバーハンス」\n・頭皮の乾燥には「頭皮ローション」\n・髪のパサつきは「", "permalink": "https://www.threads.com/@honey_haircare_chan/post/Dcaw9NGGv2t", "likes": 410, "velocity": 2.0, "ageHours": 204.9, "postedAt": "2026-08-24T18:41:46+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3955471003845363470", "username": "kenji_visual_33", "text": "嘘みたいに髪の毛\n3ヶ月でここまで生えた", "permalink": "https://www.threads.com/@kenji_visual_33/post/Dbkp-vHj4cO", "likes": 409, "velocity": 0.58, "ageHours": 709.2, "postedAt": "2026-08-03T18:21:49+09:00", "genres": ["薄毛"], "keywords": ["AGA"]}, {"id": "3949067245642018895", "username": "life_hacking_2026", "text": "井川遥の美の秘訣！！来年50歳とは思えない。\n血行を良くした上に毛穴の大掃除。使うと頭皮がジワジワとあったかくなって髪がふんわり🥰", "permalink": "https://www.threads.com/@life_hacking_2026/post/DbN57yin3BP", "likes": 403, "velocity": 0.44, "ageHours": 921.3, "postedAt": "2026-07-25T22:18:42+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3962552203164079499", "username": "naka__tama", "text": "白髪にいいって投稿、よく見かけるけど、こっち？こっち？\nどっちなんだいっ！？！？", "permalink": "https://www.threads.com/@naka__tama/post/Db90Dv5iVWL", "likes": 402, "velocity": 0.85, "ageHours": 474.8, "postedAt": "2026-08-13T12:50:54+09:00", "genres": ["育毛", "薄毛"], "keywords": ["育毛剤", "薄毛 対策"]}, {"id": "3967132249225271340", "username": "tora_mamama", "text": "だから何度でも言うけど、こういう毛穴は朝にナイアシンアミド→夜にアゼライン酸仕込めば２週間ぐらいで見違えるってば。これ使ってみな", "permalink": "https://www.threads.com/@tora_mamama/post/DcOFcMMEZgs", "likes": 396, "velocity": 1.23, "ageHours": 323.1, "postedAt": "2026-08-19T20:30:38+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3928693061983557398", "username": "linohibiki", "text": "ほうれい線スッキリまで2年ちょっと✨\nこれくらいまでくるとだいぶ満足してくる😊", "permalink": "https://www.threads.com/@linohibiki/post/DaFhYZXElcW", "likes": 395, "velocity": 0.25, "ageHours": 1596.0, "postedAt": "2026-06-27T19:38:50+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3865226662850532357", "username": "yuraran_biyou", "text": "そういえば30年現役美容師旦那がいつも言ってるけど、白髪急増する人、それ遺伝のせいじゃないよ😳‼️‼️‼️白髪が増える原因は、ほとんどの人が知らないし、美容師も教えてくれない。\n原因は主に５つあって、友達にこれを話したら、2ヶ月で白髪の増加が遅くなったって喜んでた。もう増える一方だと諦めてたらしい😭これ知りたい人いるかな？", "permalink": "https://www.threads.com/@yuraran_biyou/post/DWkCyvHkxQF", "likes": 381, "velocity": 0.1, "ageHours": 3697.6, "postedAt": "2026-04-01T06:02:26+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3967841713473696567", "username": "ginzaseitai_kento", "text": "8月銀座でお顔周りシュッとしたい方！\n小顔矯正+美容整体+ヘッドスパ\n受けたい方いらっしゃいますか🙌", "permalink": "https://www.threads.com/@ginzaseitai_kento/post/DcQmwQQk7M3", "likes": 357, "velocity": 1.19, "ageHours": 299.6, "postedAt": "2026-08-20T20:00:13+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3886606634551337764", "username": "koma.cheek", "text": "衝撃だった。\n顔がたるんで二重アゴになるのは「加齢」か「太ったせい」だと思ってたけど、\n元モデルの友人いわく\nシュッとした小顔になりたいなら\n変顔して顔ヨガがんばるでもなく、\n高い美顔器で毎日コロコロするでもなく、\n糸リフトに何十万も課金するわけでもなく、、", "permalink": "https://www.threads.com/@koma.cheek/post/DXwACRaG-Mk", "likes": 347, "velocity": 0.12, "ageHours": 2989.6, "postedAt": "2026-04-30T18:00:42+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3885235809930008969", "username": "ura_biyou_m", "text": "40代以降は絶対に読んで。頭皮マッサージ、顔のたるみに効くって現場では常識。でも正直、一般にはまだ全然広まってないと思う。撮影前、ヘアメイクさんが俳優さんの頭皮をほぐすのを何度も見てきた。顔に直接触らずに、フェイスラインが上がる。やり方はシンプル↓", "permalink": "https://www.threads.com/@ura_biyou_m/post/DXrIWJfgVmJ", "likes": 339, "velocity": 0.11, "ageHours": 3035.0, "postedAt": "2026-04-28T20:37:02+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3954601551964813908", "username": "nonchi0430", "text": "眉毛脱色してるんだけど\nいっつもこんな感じで\n脱色出来ない毛があるのなんで？\nブラシ？みたいなので塗ってコットン置いて\n放置してってSNSで調べてできることはしてるんだけど、、", "permalink": "https://www.threads.com/@nonchi0430/post/DbhkSi9EjpU", "likes": 334, "velocity": 0.45, "ageHours": 738.0, "postedAt": "2026-08-02T13:34:23+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3868557607422759081", "username": "youki_withbaby", "text": "ねえ。私の髪の毛\n白髪化が止まらない。悲しい。\n何か対策あるの？🫠", "permalink": "https://www.t くなってから私が気づき、皮膚科でもっと前からできている、カラーも本来は避けるべきと言われてその後美容師さんに確認しましたが最後まで謝らず、カラーとハゲとは関係ないですからと逆に嫌な態度をされる始末。\nハゲはすぐ治るから大丈夫とも言われました。\n美容師さんってハゲてても教えてもくれず、カラーや縮毛矯正するのでしょうか？\n毎回2万近く支払ったのになあ。\n長年信頼していたのでかなり残念です。", "permalink": "https://www.threads.com/@kurisumasurozu642/post/DYHTzZYE1kR", "likes": 271, "velocity": 0.1, "ageHours": 2772.3, "postedAt": "2026-05-09T19:15:53+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3925863378431347402", "username": "nico_mina25", "text": "エステって月１回でも継続したら効果あるのかな？\n美容を放棄しすぎてて、そろそろ何か始めようかと。\n月１回、フェイシャルとボディがっつりをやろうかと思ってるんだけど。", "permalink": "https://www.threads.com/@nico_mina25/post/DZ7d_FMHYrK", "likes": 267, "velocity": 0.16, "ageHours": 1689.7, "postedAt": "2026-06-23T21:56:45+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3910617284457271410", "username": "sugarheart_0720", "text": "お借りしたお写真、これはなんの施術をすればこうなりますか？？？ビフォーがまんますぎて、オンダリフト3回をやろうとしてますが、、、、糸リフトや脂肪吸引はNGでこれになる方法", "permalink": "https://www.threads.com/@sugarheart_0720/post/DZFTbNslBBy", "likes": 251, "velocity": 0.11, "ageHours": 2194.5, "postedAt": "2026-06-02T21:05:29+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3860948914598562984", "username": "sabutarouu", "text": "私は顔がでかいので、小さい人が羨ましいです\n顔が小さくて損することってそんなにあるか？\n顔でかくなりたい人っていないもんな", "permalink": "https://www.threads.com/@sabutarouu/post/DWU2JTmk8yo", "likes": 248, "velocity": 0.06, "ageHours": 3839.2, "postedAt": "2026-03-26T08:23:18+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3956809801825177107", "username": "mai.sys.dh04", "text": "顔にたるみが出てきた人、必死にこれやってませんか？\n舌を上につけておいてください。\nでも、その瞬間、 口の周りに力が入る人は要注意です。\n実は、それは正しい使い方ではありません。", "permalink": "https://www.threads.com/@mai.sys.dh04/post/DbpaYz5ks4T", "likes": 244, "velocity": 0.37, "ageHours": 664.9, "postedAt": "2026-08-05T14:41:47+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3921551918242791455", "username": "arma.dijo", "text": "お風呂上がり、ヘアミルクもつけてすっごい時間かけてブラシもちゃんと通しながら、ドライヤーも一方向から当てて乾かしてもこのレベル\n天使の輪なんてあったことない\n光も反射しないパサパサ髪\nちなみに母親もゴワゴワバサバサの髪質😭\n○ぬまでこの髪なのほんとに鬱", "permalink": "https://www.threads.com/@arma.dijo/post/DZsJrE_HQAf", "likes": 234, "velocity": 0.13, "ageHours": 1832.4, "postedAt": "2026-06-17T23:10:39+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3972909003122655535", "username": "bon50501", "text": "女性の薄毛に本当に効果のある物が知りたいです‼️\n40歳女性。小学生のころから前髪が薄いです。\n猫っ毛で細いです。", "permalink": "https://www.threads.com/@bon50501/post/Dcim7BgE8Ev", "likes": 229, "velocity": 1.74, "ageHours": 131.8, "postedAt": "2026-08-27T19:48:01+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "つむじ 薄毛"]}, {"id": "3960978742398904396", "username": "kaname_fubuki", "text": "恐いことに気付いてしまいました。\n\n次男の髪の毛がごっそり減っているのです。\n本人が、シャンプーの時に髪がすごく抜けて恐いと言い、頭頂部を見たら、つむじ以外も地肌が露出しているのです😔\n触ると、髪全体の毛量がスカスカになっていました。次男は背が高いので、頭頂部に気付きませんでした。\n円形脱毛症という抜け方ではなく、全体的に密度が落ちている感じです。\n\n明らかにストレスだと思いますが、同じようになった方いらっしゃいますか？😢\n本人も怖がっており、可哀想です。\n明日、小児科へ行くので相談してみようとは思っています。", "permalink": "https://www.threads.com/@kaname_fubuki/post/Db4OS4Xj2hM", "likes": 228, "velocity": 0.43, "ageHours": 526.9, "postedAt": "2026-08-11T08:44:43+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い"]}, {"id": "3903425964852492499", "username": "dr.norimoto", "text": "美容外科界隈みんな知ってるけど、黙ってる事ひとつぶっちゃけます\n・\n糸とヒアルで小顔は作れん\nむしろ、物入れてるからデカなる", "permalink": "https://www.threads.com/@dr.norimoto/post/DYrwTvaEbjT", "likes": 220, "velocity": 0.09, "ageHours": 2432.6, "postedAt": "2026-05-23T22:57:37+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3915548706699664612", "username": "koziwatyann_biyou", "text": "いいか、40代50代。ハイフでも高周波でも取れないたるみがある。それが「皮膚の余り」。40代以降になると骨・筋肉・脂肪が減るのに皮膚の量は変わらないから、どんどん皮膚が余ってたるんでくる。この皮膚を直接引き締められる機械がたった1つだけあって、「皮膚のアイロン」って言われる", "permalink": "https://www.threads.com/@koziwatyann_biyou/post/DZW0s2jktzk", "likes": 218, "velocity": 0.11, "ageHours": 2031.2, "postedAt": "2026-06-09T16:23:21+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3854065901797276079", "username": "seitailien_koga", "text": "【口まわりが老ける人の共通点】\n\nほうれい線\n口角の下がり\nマリオネットライン\nフェイスラインのぼやけ\n\n実はこれ\n「口まわりの筋肉バランスの崩れ」が原因です！\n\n口の周りには\n表情を作る筋肉が放射状に広がっています。\n\n特に影響するのがこのあたり\n\n口輪筋\n頬筋\n大頬骨筋\n小頬骨筋\n広頸筋\nオトガイ筋\n\nこれらの筋肉が\n\n使われない\n硬くなる\n下に引っ張られる\n\nこの状態になると\n顔の組織が下方向に引っ張られやすくなります。\n\n結果\n\n口角が下がる\n頬がたるむ\nフェイスラインがぼやける\n\nという「老け顔サイクル」に。\n\nでも安心してください。\n\n筋肉は\n正しく動かせば変わります。\n\n今回の動画では\n口まわり老化に関わる筋肉ケアを\nまとめて紹介しています。\n\n気になる人は\n保存して一緒にやってみてください！", "permalink": "https://www.threads.com/@seitailien_koga/post/DV8ZISZknmv", "likes": 207, "velocity": 0.05, "ageHours": 4067.1, "postedAt": "2026-03-16T20:28:02+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3968272051169391637", "username": "eririe_biyou", "text": "白髪ほぼゼロ41歳の\n頭皮ケア\nこの3つは旅行にも連れて行きます", "permalink": "https://www.threads.com/@eririe_biyou/post/DcSImfeD_QV", "likes": 204, "velocity": 0.71, "ageHours": 285.3, "postedAt": "2026-08-21T10:15:13+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3967088645752783029", "username": "yuri_migaku", "text": "無印の頭皮ケア、グレーとピンク何が違う？\n\nグレーは頭皮環境を整える育毛ローション。\nピンクは発毛促進のエイジングケアエッセンス。\n\n私は朝グレー、夜ピンクで使い分けてる。", "permalink": "https://www.threads.com/@yuri_migaku/post/DcN7hrSlIC1", "likes": 198, "velocity": 0.61, "ageHours": 324.5, "postedAt": "2026-08-19T19:04:00+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3973671572964263215", "username": "mitatan.co5", "text": "この毛穴開きまくり、たるみはどうしたらいいのでしょうか😭😨？？", "permalink": "https://www.threads.com/@mitatan.co5/post/DclUT4AmkUv", "likes": 196, "velocity": 1.84, "ageHours": 106.5, "postedAt": "2026-08-28T21:03:06+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3926648746017336306", "username": "tsuya2mi", "text": "炎上覚悟で言うけど‼️‼️頭皮マッサージはマジでヤバい習慣です‼️‼️‼️美容業界に15年いて、頭皮マッサージの恐ろしさ痛感してる^^髪や頭皮だけじゃなくて、顔にも影響する。正直に全部話す。何がヤバいかというと、", "permalink": "https://www.threads.com/@tsuya2mi/post/DZ-QjrwGKvy", "likes": 195, "velocity": 0.12, "ageHours": 1663.6, "postedAt": "2026-06-24T23:57:09+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア", "頭皮マッサージ"]}, {"id": "3955239462973068133", "username": "miu_patissier25", "text": "詳しい方、、このアホ毛を抑える方法ってるんでしょうか、、？😭\nいっつもこうなってしまって、、、😭😭😭", "permalink": "https://www.threads.com/@miu_patissier25/post/Dbj1VX4HdNl", "likes": 194, "velocity": 0.27, "ageHours": 716.9, "postedAt": "2026-08-03T10:41:48+09:00", "genres": ["薄毛", "育毛"], "keywords": ["薄毛 対策", "抜け毛 対策"]}, {"id": "3910207148408350294", "username": "nao_biyou0", "text": "ダントツで若く見える女性の共通点。\n20年皮膚科で働いていて思う。\n高い化粧品を使ってる人でもない、美容医療をしてる人でもない。なぜか年齢を感じさせない女性にはある共通点がある。\nA：友達が多い\nB：推しがいる\nC：自分の時間がある\nD：夫婦仲がいい\nあなたはどれだと思う？、", "permalink": "https://www.threads.com/@nao_biyou0/post/DZD2K8vEqZW", "likes": 192, "velocity": 0.09, "ageHours": 2208.1, "postedAt": "2026-06-02T07:30:37+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3943824363560748967", "username": "awamo.chi", "text": "トリートメントを断ったら美容師さんめっちゃ怖い顔になった。理論上髪にとっていいことはわかってるけど、髪の悩みないし、過去に効果を感じ取れんかった鈍感なので、必要ないんだよね。悩みと言えば、剛毛、多毛。熱弁されるだけこっちは引いてしまう。なかなか食い下がってくれないので、次に考えときますって言うたら次の予約して帰ってくださいって言われた。あー😩", "permalink": "https://www.threads.com/@awamo.chi/post/Da7R10Gkcen", "likes": 192, "velocity": 0.18, "ageHours": 1094.9, "postedAt": "2026-07-18T16:42:02+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3861097823849227129", "username": "lbc.lula_dr.k.hashimoto", "text": "どちらの顔が魅力的ですか？？", "permalink": "https://www.threads.com/@lbc.lula_dr.k.hashimoto/post/DWVYAOJkSN5", "likes": 185, "velocity": 0.05, "ageHours": 3834.3, "postedAt": "2026-03-26T13:19:10+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3894730200345784701", "username": "liliy_keanabukkero", "text": "【閲覧注意🚨】\n36歳、本気の毛穴撲滅運動はじめました。\n\n１週間くらい前から、ちょこちょこ毛穴をブッコロリできると噂のあれやこれやを購入して、朝晩のケアを頑張ってます。\n\n1人で頑張ってるのもアレなので、スレッズの皆さんに私の頑張りを見てもろて、モチベ上げたいと思いました！\n\n中学時代、顔中のニキビに人生詰むほど悩まされた結果なのか、頬はかっぴらき毛穴、鼻は黒ずみと穴だらけ。今はニキビはあまりできませんが、とにかく毛穴がひでぇです。\n\n大人になってもニキビが治ったことが嬉しすぎて、あんまり他のシミとかたるみとか毛穴とか気にしていなくて、紫外線ケアも怠った結果、酷い有様です🥹🥹🥹お目み汚しすまん🥹🥹🥹\n\nこれからできるだけ毎日投稿します！\nどんなの使ってるのかも載せます！\n有識者の方アドバイスください！\n日本・韓国・世界中でもいいので、コスパの良いコスメあったら買って試します💪\n\nとりあえずday1(ケアして１週間目)", "permalink": "https://www.threads.com/@liliy_keanabukkero/post/DYM3HtnmLF9", "likes": 185, "velocity": 0.07, "ageHours": 2720.6, "postedAt": "2026-05-11T23:00:41+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3930846753360836398", "username": "ayu_aaa10", "text": "口横のたるみに悩んでるアラフォーたち、よく聞いてください。\n\n40歳の私が「これは効いた」と思った施術はオンダリフト。ウルトラフォーマーMPTもかなり効くけど、とにかく激痛。\nオンダリフトは、痛みに弱い人にも受けやすい施術。ほんのり温かいくらいで、効果をジワジワ実感できる。\n\nただし、何度も言っているように適応は人それぞれ。いきなりコース契約する前に、必ず信頼できる医師にしっかり相談してほしい。約束だぞ。", "permalink": "https://www.threads.com/@ayu_aaa10/post/DaNLEuwkfcu", "likes": 184, "velocity": 0.12, "ageHours": 1524.6, "postedAt": "2026-06-30T18:57:50+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善"]}, {"id": "3899594221128070190", "username": "1068momo", "text": "ちょっとちょっと\n今日初めてフェイシャルエステをモニターで受けてみたんだけど\n\n艶がやばいです\nエステなんて、、、\nと思ってたけど課金するだけあります\nエステティシャンの方も話しやすくてあっという間でした\nこれはテンション上がる🤩", "permalink": "https://www.threads.com/@1068momo/post/DYeJEh-gTQu", "likes": 177, "velocity": 0.07, "ageHours": 2559.5, "postedAt": "2026-05-18T16:04:38+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3868481676016675408", "username": "amaimono_tabetai_na", "text": "ほうれい線、マリオネットラインに効いたなって\n施術があれば教えてください🙇🏻‍♀️🙇🏻‍♀️🙇🏻‍♀️\n\n36ですが最近気になってきました😭", "permalink": "https://www.threads.com/@amaimono_tabetai_na/post/DWvm5aXFOpQ", "likes": 174, "velocity": 0.05, "ageHours": 3589.8, "postedAt": "2026-04-05T17:49:33+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ", "ほうれい線"]}, {"id": "3971335629623594768", "username": "lgta338", "text": "※閲覧注意\nお目汚しすみません🙇🏼スキンケア後のすっぴんです\n32歳 毛穴、くすみ、シミ、最近出来るようになった赤っぽいにきび跡が気になります､､､\nおそらく混合肌、インナードライ。\n美容に詳しい方！！qoo10メガ割や使った方が良い成分、美容医療のオススメ教えていただけたら嬉しいです😭😭\nいろいろと試してはいるものの、いまいち効果が感じられず､､､助けてください､､､", "permalink": "https://www.threads.com/@lgta338/post/DcdBLbPkQ8Q", "likes": 173, "velocity": 0.94, "ageHours": 183.9, "postedAt": "2026-08-25T15:42:00+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3897569207995400678", "username": "diamante_grezzo6", "text": "小6女子の腋毛処理ってどうしてますか？💦今年に入ってから生えてきて💦\n自分の時はどうだったか思い出せず😅\nもうカミソリで剃っていいものか…\nどんどん濃くなりジョリジョリしちゃうけど仕方ない？🤔", "permalink": "https://www.threads.com/@diamante_grezzo6/post/DYW8otiEQHm", "likes": 172, "velocity": 0.07, "ageHours": 2626.6, "postedAt": "2026-05-15T21:01:18+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3964949413567364461", "username": "ginchan_26", "text": "とりあえずこれ1本使っとけ！ていう美容液教えて欲しいです。\n毛穴 シワ くすみ 諸々に効くデパコスで！！\n少し敏感肌です！\n安いのはもういいです😭笑", "permalink": "https://www.threads.com/@ginchan_26/post/DcGVHwEE31t", "likes": 171, "velocity": 0.43, "ageHours": 395.4, "postedAt": "2026-08-16T20:13:44+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3946570958438411955", "username": "namu33namu", "text": "高周波しても糸リフトしても戻りが早かったけど、肌育注射するようになったら逆にリフトアップした！やっぱり肌の土台が整うのって大事だね。ヒアルロン酸みたいに不自然にならないし。今日はザーフやりにいく🙌", "permalink": "https://www.threads.com/@namu33namu/post/DbFCWB6mC6z", "likes": 169, "velocity": 0.17, "ageHours": 1003.9, "postedAt": "2026-07-22T11:39:01+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3964651236226166501", "username": "yukimi_1013", "text": "汚肌失礼します。\n毛穴に悩んでいて、\n何をしたらいいか教えていただきたいです。\n\nこれまでの施術歴\nIPL10回以上•ポテンツァ（マックーム•ジュベルック）•\nシルファーム•手打ちジュベルック•ジャルプロ•\nスキンボトックスなど色々やりましたが改善しません…\n\n最近はスキンケアに\nアゼライン酸も取り入れていますが、なかなか🥹\nレチノールはかなり肌荒れしてしまいます。。", "permalink": "https://www.threads.com/@yukimi_1013/post/DcFRUsxku7l", "likes": 168, "velocity": 0.41, "ageHours": 405.2, "postedAt": "2026-08-16T10:21:18+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3930041843715362559", "username": "ritan.rinrin", "text": "高須院長の息子さんDrのYouTubeを見て買ってしまった。\n体力ない自分とハゲてきた旦那さんに。\n以前、エビオス飲ませたら1日5回ぐらい💩が出て会社で困るから飲まない！と言われたんだけど、そんな出るか？\n遺伝の薄毛には効果なしと高須ジュニアD rは言ってましたが、エビオス飲んで髪が増えた方いるかな？", "permalink": "https://www.threads.com/@ritan.rinrin/post/DaKUDwPE07_", "likes": 168, "velocity": 0.11, "ageHours": 1551.3, "postedAt": "2026-06-29T16:18:37+09:00", "genres": ["育毛"], "keywords": ["育毛剤", "発毛"]}, {"id": "3909582333872230019", "username": "tsubakimama09", "text": "2ヶ月でまつ毛激変。この長さと密度やばくない？\n1万超えのラッシュアディクトから乗り換えた、ある美容液が完全にバグ。\n色素沈着なし、値段は1/3以下なのに、キャピキシル公認マーク受賞してて育毛剤レベルの配合はエグいって", "permalink": "https://www.threads.com/@tsubakimama09/post/DZBoGs2mM6D", "likes": 162, "velocity": 0.07, "ageHours": 2228.8, "postedAt": "2026-06-01T10:49:14+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3958757196049864231", "username": "tora_mamama", "text": "何度でも言います。\n頭皮マッサージを毎日続けたら、4週間で顔の位置が変わる。\n初期費用ゼロで今夜からできる。\nでもやり方間違えると逆効果。正しいやり方は、", "permalink": "https://www.threads.com/@tora_mamama/post/DbwVLIGktYn", "likes": 161, "velocity": 0.27, "ageHours": 600.4, "postedAt": "2026-08-08T07:10:54+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3898927539234768837", "username": "ruru_biyou_", "text": "30本以上まつ毛美容液使ってきた中で圧倒的No.1はこれだった。", "permalink": "https://www.threads.com/@ruru_biyou_/post/DYbxfCFE4fF", "likes": 160, "velocity": 0.06, "ageHours": 2581.6, "postedAt": "2026-05-17T18:00:03+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3970026275163683494", "username": "bihatsu_usagi", "text": "何度でも言います。\n蒸しタオルを頭皮に毎晩続けたら4週間で頭皮の硬さが別人レベルに変わる。\n初期費用ゼロで今夜からできる。\nでもやり方間違えると逆効果。正しいやり方は、", "permalink": "https://www.threads.com/@bihatsu_usagi/post/DcYXdz4GTqm", "likes": 160, "velocity": 0.7, "ageHours": 227.3, "postedAt": "2026-08-23T20:20:33+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3908067115916276454", "username": "kogao_seitai", "text": "ほうれい線ベロ回してる人 みんなこれ😰", "permalink": "https://www.threads.com/@kogao_seitai/post/DY8PlYKkzLm", "likes": 159, "velocity": 0.07, "ageHours": 2279.0, "postedAt": "2026-05-30T08:38:46+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3924765147475713848", "username": "arancia.en", "text": "育毛剤飲んで２年 眉毛が濃くなった", "permalink": "https://www.threads.com/@arancia.en/post/DZ3kRt6H584", "likes": 159, "velocity": 0.09, "ageHours": 1726.0, "postedAt": "2026-06-22T09:34:46+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3961711422732389888", "username": "biyou_rui0", "text": "頭皮マッサージを毎晩1ヶ月続けたら顔が別人になった。正直「頭皮マッサージで顔が変わるわけない」と思ってたけどたるみ・ほうれい線・むくみ、全部変わった。やり方を間違えると逆効果だから正しい方法をまとめておくと、", "permalink": "https://www.threads.com/@biyou_rui0/post/Db604yGkk4A", "likes": 158, "velocity": 0.31, "ageHours": 502.6, "postedAt": "2026-08-12T09:00:25+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ", "頭皮ケア"]}, {"id": "3908279219185681754", "username": "so12_10t", "text": "6畳ほどでエステサロンをされている方、お部屋を見せていただけませんか？🥺\nレイアウトや雰囲気も知りたいです🥹", "permalink": "https://www.threads.com/@so12_10t/post/DY8_z4umoVa", "likes": 157, "velocity": 0.07, "ageHours": 2271.9, "postedAt": "2026-05-30T15:40:10+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3875915898276637689", "username": "mirei_pommy", "text": "衝撃すぎた。\n顔が大きく見えるのって「むくみ」か「脂肪」だと思い込んでたけど、横顔めっちゃ綺麗な友人いわく\n首を長く、フェイスラインをシュッと見せたいなら、リンパを強く流すでもなく、小顔矯正に通い続けるでもなく、高い美顔器に頼るでもなく、", "permalink": "https://www.threads.com/@mirei_pommy/post/DXKBPlYEWv5", "likes": 155, "velocity": 0.05, "ageHours": 3343.6, "postedAt": "2026-04-16T00:00:02+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3884312767099921305", "username": "a.s_0229", "text": "threadsこれいいよって見かけて、ローソンにあったから早速買ってみたけど…\n\nどうやって使うんやっけ😅\n\nとりあえずコームで頭マッサージしてみたけど、ただ櫛の背で頭かいてる人みたいになっちゃって、でも元投稿も見つけられず一旦髪とかしといた😂", "permalink": "https://www.threads.com/@a.s_0229/post/DXn2eG3gWOZ", "likes": 154, "velocity": 0.05, "ageHours": 3065.5, "postedAt": "2026-04-27T14:03:07+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3964806846440195551", "username": "jellyfish.water0826", "text": "理想は一枚目のようなニュアンスシニヨン。ただ、毛量が多く、難しいと思うので、その場合は二枚目のような感じになると嬉しい。あまりボリューム感がありすぎたり、きっちりしすぎると顔タイプに合わないためゆるっとして欲しいとオーダーしました。結果、3枚目。もう少しゆるっとしたいと一度言ってみましたが、あまり変わらず。かなりボリューム感は抑えていただいたのでこれを最終としました。美容師さん曰く、ドレスを着たらもっと馴染む。髪色が違うから違うと印象が変わるからとのこと。ここからどのようにすれば私の理想に近づくのでしょうか…。やはり毛量多いとニュアンスは無理ですか(；；)先輩花嫁さん、美容師さん助けてください(；；)", "permalink": "https://www.threads.com/@jellyfish.water0826/post/DcF0tIFGsXf", "likes": 153, "velocity": 0.38, "ageHours": 400.1, "postedAt": "2026-08-16T15:30:29+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3922845531412524301", "username": "kumi_biyo_official", "text": "40代にはちょいエロい話、、、ほうれい線って、単に脂肪が落ちてきてるだけ。筋肉がたら〜っとなって支えられんくて下がる。口角が下がる、二重アゴ、これ意外やけど原因は同じ。たでも3分で鍛えられる方法があってな、、、", "permalink": "https://www.threads.com/@kumi_biyo_official/post/DZwvzoIkm0N", "likes": 152, "velocity": 0.08, "ageHours": 1789.6, "postedAt": "2026-06-19T18:00:50+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3891810303192694607", "username": "miyu838383", "text": "32歳。フォトフェイシャル10回ほど当てましたがこの細かいシミが消えません😭肌が弱く定期的に全ての化粧品が沁みて赤くなる時期が来ます。\nなんの治療が最適でしょうか‥\nビタミンCなどは合いません😢", "permalink": "https://www.threads.com/@miyu838383/post/DYCfNnfAX9P", "likes": 149, "velocity": 0.05, "ageHours": 2817.3, "postedAt": "2026-05-07T22:19:23+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3954824092524340406", "username": "songyongcheng5", "text": "肥満体型の女に薄毛が多い気がするが、たまたまか?\n細身や中肉中背の女に比べて結構な確率で薄毛がいる気がする。", "permalink": "https://www.threads.com/@songyongcheng5/post/DbiW48AEeS2", "likes": 145, "velocity": 0.2, "ageHours": 730.7, "postedAt": "2026-08-02T20:56:32+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "3921396110434869033", "username": "chamama_0611", "text": "スキンケアの相談をさせてくださいませんか😭\n\n鼻はつまり毛穴、頬は開き毛穴です。\nテカリがすごくて化粧崩れが凄まじいですが、ドラッグストアの美容部員さんに『乾燥によるテカリ』と言われています。\nアイクリームは今のものが終わったらエリクシールに変えようと思っていますが、他はどうしようかと悩んでいます。\n33歳でシワとシミが気になるお年頃です😇", "permalink": "https://www.threads.com/@chamama_0611/post/DZrmPxqEZ8p", "likes": 143, "velocity": 0.08, "ageHours": 1837.6, "postedAt": "2026-06-17T18:01:06+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3970703971845360419", "username": "poteusa_biyou", "text": "嘘みたいな本当の話なんですけど、白髪は染めるより先に、作らせん方が安いんよ。紗栄子がインスタで、白髪はスキンケアと同じで仕込みの結果、って言うてて、月2回染めに行ってる人ほど効きが早い。作る材料は4つで、", "permalink": "https://www.threads.com/@poteusa_biyou/post/DcaxjmGE0sj", "likes": 140, "velocity": 0.68, "ageHours": 204.8, "postedAt": "2026-08-24T18:47:06+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3857534247078792560", "username": "u__pa_ru_pa__", "text": "ラッシュのまつ毛美容液ずっと使ってたんですけど、同じくらい伸びて色素沈着の心配もない美容液を3,000円で見つけてしまって🥹1万円が3,000円って普通に神すぎる、、", "permalink": "https://www.threads.com/@u__pa_ru_pa__/post/DWItvWqCQ1w", "likes": 137, "velocity": 0.03, "ageHours": 3952.3, "postedAt": "2026-03-21T15:18:58+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3962582826583434838", "username": "nana_shi_69", "text": "美容室で流すついでに頭皮マッサージを軽くしてくれるんだけど、終わると毎回頭痛がする。\nこれって私の頭がカッチコチで血流が良くなったからってこと😭？", "permalink": "https://www.threads.com/@nana_shi_69/post/Db97BYLkaZW", "likes": 135, "velocity": 0.28, "ageHours": 473.7, "postedAt": "2026-08-13T13:51:45+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ", "頭皮ケア"]}, {"id": "3854503247730682226", "username": "biyou._.m", "text": "断言するけど、30代は全員「糸リフト」やった方がいい🫩フェイスラインがシュッとする。ほうれい線も薄くなる。年1回でいい。「糸リフトは金ドブ」って言う人いるけど、金ドブなわけないからね🫩(ちゃんとしたドクターならねwww) あ、でも、ガチ1つだけ注意点があって、", "permalink": "https://www.threads.com/@biyou._.m/post/DV98kgik6ly", "likes": 134, "velocity": 0.03, "ageHours": 4052.6, "postedAt": "2026-03-17T10:56:55+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3959990019108383467", "username": "biyo_.honne_emi", "text": "全女性に伝えたい。美容医療なしでほうれい線を目立たなくするのに『ゼラチン』は最強なんだけど、単体で食べるともったいない。この5つの組み合わせで食べて。", "permalink": "https://www.threads.com/@biyo_.honne_emi/post/Db0tfEDDCrr", "likes": 132, "velocity": 0.24, "ageHours": 559.6, "postedAt": "2026-08-10T00:00:18+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3899603620421872216", "username": "avec_toitoitoi.303", "text": "6月から抗がん剤が始まります。１年以内に再発の可能性が半分以上…こわいな…。\n抗がん剤で脱毛もします…。まず髪の毛どうしたらいいですか？ウィッグどれがいいのかとか教えて下さい😭😭😭", "permalink": "https://www.threads.com/@avec_toitoitoi.303/post/DYeLNTwEqpY", "likes": 130, "velocity": 0.05, "ageHours": 2559.2, "postedAt": "2026-05-18T16:23:18+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3866945034813771995", "username": "haaruu322", "text": "今日お試しで行ったフェイシャルエステが\n過去一良くて感動。\n\n商品勧められたけど、無理な押し売り\n一切なくて尚更感動。\n\nただ、高すぎる。まじで高すぎる。\n良いのは分かる。そりゃこんだけ良かったら\n高いのもわかる。\n\nでも、こんな高いの定期的に買える\n財力の人間ってひと握りすぎないか？\n\nでも、そりゃこんだけ良ければ仕方ないか。\nって思えるくらい、やっぱ良かった。", "permalink": "https://www.threads.com/@haaruu322/post/DWqJgVuCRDb", "likes": 126, "velocity": 0.03, "ageHours": 3640.7, "postedAt": "2026-04-03T14:56:32+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3937438874434808231", "username": "hara_diett", "text": "知ってほしい。ほうれい線が年々濃くなってる、マッサージしても消えないという30代・40代の方へ。美容外科分野の研究で、ほうれい線の正体は「皮膚のたるみ」だけじゃなく「骨の凹み」だと分かっている。鼻の脇の骨(梨状孔)は加齢で溶けて縁が広がり、そこに皮膚と脂肪が落ち込んでほうれい線になる。マッサージや表情筋トレで消そうとするよりも、", "permalink": "https://www.threads.com/@hara_diett/post/Dakl8t7gCmn", "likes": 126, "velocity": 0.1, "ageHours": 1306.3, "postedAt": "2026-07-09T21:15:12+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3949480839549510947", "username": "trendbeauty_log", "text": "無印の頭皮スプレー、人気な理由がわかった🥹\n頭皮がスッキリするし、トップがふんわり見える。", "permalink": "https://www.threads.com/@trendbeauty_log/post/DbPX-X4j2Uj", "likes": 122, "velocity": 0.13, "ageHours": 907.6, "postedAt": "2026-07-26T12:00:26+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3915775561343562760", "username": "sad_nipple_syndrome_00", "text": "顔の小さな美人より顔の大きな美人の方が美人さ際立って顔が綺麗に見える気がする。男性も", "permalink": "https://www.threads.com/@sad_nipple_syndrome_00/post/DZXoSBaCfQI", "likes": 122, "velocity": 0.06, "ageHours": 2023.7, "postedAt": "2026-06-09T23:54:04+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3921956317841935076", "username": "yuu41b", "text": "毎日の肌の変化が楽しすぎる🥹41歳にしてスキンケアに目覚めるとは思わなかった✨️\nシワやたるみが消えていくのが幸せすぎる🎶\nくすみも無くなってきて、肌白すぎじゃない？(笑)って言われた💦仕事で会う人にも毎回若返るからホントにビックリされる(笑)\n毎日が楽しいぜ〜\n🎶", "permalink": "https://www.threads.com/@yuu41b/post/DZtln3dkUrk", "likes": 121, "velocity": 0.07, "ageHours": 1819.0, "postedAt": "2026-06-18T12:34:08+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3961787665725210293", "username": "qianpotianxzzz", "text": "初めてフェイシャルエステしてきた〰️▓▓\nめっちゃ気持ちいい▓▓施術してくれた方めっちゃ可愛いし、癒された。何より終わったあとのスッキリ感☺️また行きたくなる😊", "permalink": "https://www.threads.com/@qianpotianxzzz/post/Db7GOQ7Ez61", "likes": 119, "velocity": 0.24, "ageHours": 500.1, "postedAt": "2026-08-12T11:31:54+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3871568274438164302", "username": "__u.r.a.7__", "text": "エステ開業3ヶ月。\n広告ゼロで月140件。\n\nThreadsからご新規 月40件\nホットペッパーなし(締切)\nリピートほぼ100（幸）\n\nただの一人サロンの私が意識してること↓\n\n※最後は要注意", "permalink": "https://www.threads.com/@__u.r.a.7__/post/DW6ktVJjw9O", "likes": 117, "velocity": 0.03, "ageHours": 3487.6, "postedAt": "2026-04-10T00:02:05+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3964197078910460319", "username": "bihatsu_usagi", "text": "何度でも言います。\n白髪が増えるのは「遺伝」か「加齢」だと\n思ってたけど、\n漢方外来の先生いわく\n白髪を止めたいなら、\n高いシャンプーに変えるでもなく、\n毎月美容院で染め続けるでもなく、\nサプリを何種類も飲み続けるわけでもなく、、", "permalink": "https://www.threads.com/@bihatsu_usagi/post/DcDqD10GWGf", "likes": 116, "velocity": 0.28, "ageHours": 420.3, "postedAt": "2026-08-15T19:18:59+09:00", "genres": ["育毛"], "keywords": ["育毛剤"]}, {"id": "3905224365051152063", "username": "gomesu_maru", "text": "またもやスレ民の手のひらの上でクルクル踊ってみた。\nたしかに首から肩にかけてのマッサージには良かったんだよね。\n\nでも、頭皮のマッサージなら…", "permalink": "https://www.threads.com/@gomesu_maru/post/DYyJN6HEwa_", "likes": 116, "velocity": 0.05, "ageHours": 2373.1, "postedAt": "2026-05-26T10:30:43+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3922859231871082104", "username": "aya.kogao", "text": "「顔がたるんできた…」という人は\nまず顔じゃなく、ここを3秒引っ張る！\n\nここにはお顔を上に引き上げる\n筋肉があります。\n\nここがガチガチだと\n頬も口角も目元も下がりやすい。\n\nここのやり方は、1番上の固定投稿\n動画3つ目です🫶", "permalink": "https://www.threads.com/@aya.kogao/post/DZwy6_riZ54", "likes": 114, "velocity": 0.06, "ageHours": 1789.1, "postedAt": "2026-06-19T18:28:03+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3911169870570662144", "username": "raaamen__0141", "text": "眉毛パーマ行ってきたんだが、、、\n明らかに左右違うよな\n右だけすごい抜かれるし眉毛描かれてたから\n車戻ってソッコー拭いたらこんなことに。\nなんじゃこれ🤦‍♀️\n右だけ眉毛離れてるのでとか言われたけど、関係ある？笑\nまぁ、毛は生えてくるからいいか。", "permalink": "https://www.threads.com/@raaamen__0141/post/DZHREZnkykA", "likes": 111, "velocity": 0.05, "ageHours": 2176.2, "postedAt": "2026-06-03T15:23:23+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄い", "生え際 後退"]}, {"id": "3907730165212631734", "username": "ra_ra_item", "text": "クマやほうれい線でお悩みの方へ。この方法なら「5歳若返った？」って褒められるかも。ぜひ試してみてね✨", "permalink": "https://www.threads.com/@ra_ra_item/post/DY7C-GXk9K2", "likes": 111, "velocity": 0.05, "ageHours": 2290.1, "postedAt": "2026-05-29T21:29:18+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3867450358696742065", "username": "calm_0915", "text": "フェイシャルエステされてる方、自宅サロンされてる方\nまだオープンしたばかりなので認知も薄くお客様も中々平日や土日予約入りません。集客方法色々教えてください。\n宜しくお願いします😊", "permalink": "https://www.threads.com/@calm_0915/post/DWr8ZxQk4yx", "likes": 109, "velocity": 0.03, "ageHours": 3623.9, "postedAt": "2026-04-04T07:40:31+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3880501030316834708", "username": "ichiko1001", "text": "このほうれい線はもう医療じゃないと無理よね？", "permalink": "https://www.threads.com/@ichiko1001/post/DXaTyCWkn-U", "likes": 109, "velocity": 0.03, "ageHours": 3191.8, "postedAt": "2026-04-22T07:49:52+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3901192872272003978", "username": "jimu_neesan", "text": "なんかかわいくなった？って思われる施術5選\n※個人的な意見です\n5位：ハイフ\n→たるみが引き上がって輪郭がすっきり\n気づいたら「なんか顔小さくなった？」って言われる👀\n4位：エラボトックス\n→ハイフのあとにやると小顔効果が倍増する\nセットでやってる人が多いのわかる気がする😌\n3位：埋没\n→もともと二重の人でも幅を広げたりぱっちりさせるのにおすすめ\n目の印象が変わるだけで顔全体が変わる✨", "permalink": "https://www.threads.com/@jimu_neesan/post/DYj0j94DwOK", "likes": 108, "velocity": 0.04, "ageHours": 2506.6, "postedAt": "2026-05-20T21:00:52+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3911301723390575607", "username": "koziwatyann_biyou", "text": "いいか、40代。\n40代で美容医療をしなかった人の50代の差をエグいほど見てきた。だから偉そうに言うで。40代が月1でやると肌質が激変する美容医療は、", "permalink": "https://www.threads.com/@koziwatyann_biyou/post/DZHvDHIEYP3", "likes": 108, "velocity": 0.05, "ageHours": 2171.8, "postedAt": "2026-06-03T19:45:21+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3890391113812067236", "username": "mokon_chan", "text": "たぶん、これを知っていたら何万円も無駄にしなかった。\n薄毛には育毛剤。抜け毛には頭皮マッサージ。\nそう信じて、ドラッグストアで話題の育毛シャンプーを買い続けた。口コミの良いサプリも、頭皮用美容液も、惜しみなく使った。\nそれでも、一向に変化は感じられなくて。\n転機は、国際中医師のいる育毛サロンへ行った時。頭皮を診てもらう覚悟でいたら、先生が最初に触れたのは、", "permalink": "https://www.threads.com/@mokon_chan/post/DX9chsYGsOk", "likes": 105, "velocity": 0.04, "ageHours": 2864.3, "postedAt": "2026-05-05T23:19:42+09:00", "genres": ["薄毛", "育毛"], "keywords": ["薄毛 対策", "抜け毛 対策", "育毛剤"]}, {"id": "3889503863628222282", "username": "t.masa21", "text": "50代で前半です。ハイフを2週間前に受けて何も変わらんのだけどこんなもん？？\n口横たるみとほうれい線が気になって\n-10歳とかじゃなくて、すごい若返らなくていいから、そこそこ口横のたるみがなくなればって感じで思ってるのだけど、脂肪吸引してリフトアップとか\n50万前後かかる施術ばかり言われるのだけどそうするしかないのでしょうか？数万で-5歳くらいは無理なのかなぁ。。\n誰か詳しい人ご教授お願いします！\n#美容\n#美容医療", "permalink": "https://www.threads.com/@t.masa21/post/DX6SygQEc9K", "likes": 105, "velocity": 0.04, "ageHours": 2893.7, "postedAt": "2026-05-04T17:56:54+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3943505048051602353", "username": "neurobeauty_toshi_gunma", "text": "耳の上がリフトアップの鍵。\n顔は頭皮から引き上がる。\nたるみは側頭筋で変わる。\n首肩ゆるめて若返る。\n整形級リフトアップ3選。", "permalink": "https://www.threads.com/@neurobeauty_toshi_gunma/post/Da6JPKXE1Ox", "likes": 104, "velocity": 0.09, "ageHours": 1105.5, "postedAt": "2026-07-18T06:07:56+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3912080653869523386", "username": "mu.__.61", "text": "閲覧注意⚠️\n汚い肌を晒して申し訳ありません、、\n美容スペシャリストの皆様にアドバイスをいただきたいです😭😭\n毛穴に赤ら顔が気になります。美容の知識はあまりなくお力添えをお願いできればと思っております。\n今Qoo10メガ割しているので、スキンケアのおすすめもしていただけると幸いです😭😭\nよろしくお願いいたします😭😭\n30代前半でございます、、", "permalink": "https://www.threads.com/@mu.__.61/post/DZKgKCqkiG6", "likes": 101, "velocity": 0.05, "ageHours": 2146.0, "postedAt": "2026-06-04T21:32:57+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3921395583118682652", "username": "japan_4192", "text": "更年期！！抜け毛！！\nどうしたら良いのーーーーー😭？", "permalink": "https://www.threads.com/@japan_4192/post/DZrmIGjkyoc", "likes": 99, "velocity": 0.05, "ageHours": 1837.6, "postedAt": "2026-06-17T18:00:03+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3946883293929172004", "username": "saki_kounenki_totonou", "text": "更年期になると、顔がたるみます。ほうれい線は深くなるし、鏡に映る老け顔にげんなり。何だか顔が四角くなった、なんてことも増えます。これ、老化のスピードが早いとかそういう話じゃないんです。", "permalink": "https://www.threads.com/@saki_kounenki_totonou/post/DbGJXHAkmwk", "likes": 99, "velocity": 0.1, "ageHours": 993.6, "postedAt": "2026-07-22T21:59:35+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善", "ほうれい線"]}, {"id": "3951198929320911262", "username": "tanukichi_jibunmigaki", "text": "すっぴんで申し訳ないのだが\n写真の通り頬のコケ ほうれい線 毛穴が気になる…\n美容医療で一応カウンセリングいくつもりだが\n他になにかオススメのやるべき事や美容液とかありませんか？？\n40代になり悩みが多すぎて追いつかない😭", "permalink": "https://www.threads.com/@tanukichi_jibunmigaki/post/DbVen3rE6Ge", "likes": 94, "velocity": 0.11, "ageHours": 850.7, "postedAt": "2026-07-28T20:53:58+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3885181545376368938", "username": "seitailien_koga", "text": "まぶたが重い原因、\n「皮膚のたるみ」だと思ってませんか？\n\n実はこれ、\n上眼瞼挙筋という筋肉がうまく働いていないだけの可能性が高いです。\n\nこの状態が続くと\n・目が小さく見える\n・眠そうな印象になる\n・おでこのシワが増える\n・顔全体が老けて見える\n\nといった変化が起こります。\n\n逆にいうと、\nこの筋肉をしっかり使えるようにするだけで\n目の開きや印象は大きく変わります。\n\n動画内で紹介しているケア、\nまずは1週間続けてみてください。", "permalink": "https://www.threads.com/@seitailien_koga/post/DXq8AfsD8kq", "likes": 93, "velocity": 0.03, "ageHours": 3036.8, "postedAt": "2026-04-28T18:49:15+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3858881420698638710", "username": "jimny.xlxlx", "text": "もしかしてちょっとリフトアップした方がもっとかっこよくなるのかなぁ？とたまに思います😂自分で納得した上で乗り心地\u0026純正ホイールを優先して今の状態ですが、タイヤそのままでリフトアップすると変でしょうか(´～｀)？オフロードのためではなく、あくまで見た目のため…✨", "permalink": "https://www.threads.com/@jimny.xlxlx/post/DWNgDT3GNl2", "likes": 92, "velocity": 0.02, "ageHours": 3907.7, "postedAt": "2026-03-23T11:55:34+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3884463631703015114", "username": "ichkyo", "text": "ケンザンで頭皮マッサージするやつ、そういや似たようなの買った買った、ってひっぱり出してきてやったら、風呂場で飛び上がるほど痛くて…\n頭皮ってこんな痛いものなの⁉️", "permalink": "https://www.threads.com/@ichkyo/post/DXoYxeelP7K", "likes": 92, "velocity": 0.03, "ageHours": 3060.6, "postedAt": "2026-04-27T19:02:51+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3939203457261747240", "username": "yokoyoko3053", "text": "48歳です。フェイスラインのたるみがやばすぎる。リフトアップしたい。", "permalink": "https://www.threads.com/@yokoyoko3053/post/Daq3KxwE7wo", "likes": 91, "velocity": 0.07, "ageHours": 1247.9, "postedAt": "2026-07-12T07:41:07+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3974235592230277909", "username": "aabbcc5466", "text": "たるみと、ほうれい線が気になるのだけど、おすすめの美容医療を知りたいです。\nハイフ気になってるのですが、調べたら、\n頬がこける…とあったのですがどうでしょうか？", "permalink": "https://www.threads.com/@aabbcc5466/post/DcnUjb4mZMV", "likes": 91, "velocity": 1.04, "ageHours": 87.9, "postedAt": "2026-08-29T15:43:43+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3932207608228592015", "username": "kounenki.no.biyou", "text": "炎上覚悟で言います。頭皮マッサージはマジでヤバい習慣です💢\n育毛剤に月1万かけてたワイが、頭皮マッサージの恐ろしさに気づいた。\n何が恐ろしいかというと、", "permalink": "https://www.threads.com/@kounenki.no.biyou/post/DaSAfxnjbmP", "likes": 91, "velocity": 0.06, "ageHours": 1479.6, "postedAt": "2026-07-02T16:01:37+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3910168447749965986", "username": "ganmen.kakin", "text": "切開リフトまであと15日。\nねぇ、どうしよう、、、\n怖すぎて四六時中調べてる。\nフルフェイスリフトに決めたんだけどさ、、おぞましいDT見ちゃって、、ミニリフトにしようか迷い始めた。笑\nそもそも変更できるのか、、", "permalink": "https://www.threads.com/@ganmen.kakin/post/DZDtXx8E8ii", "likes": 90, "velocity": 0.04, "ageHours": 2209.4, "postedAt": "2026-06-02T06:13:44+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3953792717751326002", "username": "tsuya2mi", "text": "40代でもおばさん化しない人は、実は頭皮マッサージをしてる人。これは間違いない。美容業界15年いて、この効果の大きさ痛感してる。髪だけじゃなくて顔にも直結してるんだけど、頭皮マッサージの恐ろしい効果が、", "permalink": "https://www.threads.com/@tsuya2mi/post/DbesYdZGBUy", "likes": 89, "velocity": 0.12, "ageHours": 764.8, "postedAt": "2026-08-01T10:47:22+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3856206176443740622", "username": "biyou.tama", "text": "美容ナースが選ぶ、美容医療ランキング【たるみ】第3位：ジャルプロスーパーハイドロ(肌育注射)。肌を支えてる靭帯（リガメント）にアプローチしてコラーゲンとエラスチンを増やし、土台から肌を立て直す。顔を昔のように自然にリフトアップできる注射。ボリューム・ハリを出しつつたるみ感を補正。私も実際に、写真上でもたるみ改善が見えて喜んでいる人を見てきた。第2位：ボルニューマ（RF・高周波）。熱で引き締めて、自然に持ち上げるリフト治療。高周波で肌の奥を温めることで、コラーゲンが縮む＆増える。内側から引き締まる。たるみ改善、フェイスラインがすっきりする。第1位は、", "permalink": "https://www.threads.com/@biyou.tama/post/DWD_xYfmLHO", "likes": 89, "velocity": 0.02, "ageHours": 3996.3, "postedAt": "2026-03-19T19:20:20+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3951655429692447013", "username": "chyh_beauty", "text": "毛穴に10年悩まされた女が教える、毛穴詰まりや顎下のプツプツにはサリチル酸が1番効くし肌綺麗になる！", "permalink": "https://www.threads.com/@chyh_beauty/post/DbXGa0xj9kl", "likes": 88, "velocity": 0.11, "ageHours": 835.6, "postedAt": "2026-07-29T12:00:58+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3965520160481072934", "username": "reela.lo7583", "text": "友だちの家で借りたヘッドスクラブ、\n想像以上によかった。\n\n頭皮のベタつきがスッと取れて、\nその後のシャンプーの泡立ちが全然違う。\n\n無印にこんなのあったんだ…\n今まで完全にノーマークだった。\n\nこれ、頭皮ケアにかなりおすすめ🛁", "permalink": "https://www.threads.com/@reela.lo7583/post/DcIW5NjH9cm", "likes": 85, "velocity": 0.23, "ageHours": 376.5, "postedAt": "2026-08-17T15:07:42+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3972039690434053190", "username": "biyou_rui0", "text": "頭皮マッサージを毎晩1ヶ月続けたら顔が別人になった。正直「頭皮マッサージで顔が変わるわけない」と思ってたけどたるみ・ほうれい線・むくみ、全部変わった。やり方を間違えると逆効果だから正しい方法をまとめておくと、", "permalink": "https://www.threads.com/@biyou_rui0/post/DcfhQ2-EwRG", "likes": 82, "velocity": 0.51, "ageHours": 160.6, "postedAt": "2026-08-26T15:00:51+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3967381962608559438", "username": "ichi_lexus_is", "text": "皆さん、おはようございます☁️\n\nおはようニャン😸\n\n今日は、８月２０日 木曜日です。\n\n今日は、NHK創立記念日、交通信号設置記念日、蚊の日、誕生記念筆の日、親父の日、リーブ21・発毛の日、パンツゼロでリラックスの日だそうです。\n\n今日も、やわやわ頑張りましょう🤗\n\n本日も宜しくお願いします🙇‍♂️😽", "permalink": "https://www.threads.com/@ichi_lexus_is/post/DcO-N_5k0VO", "likes": 82, "velocity": 0.26, "ageHours": 314.8, "postedAt": "2026-08-20T04:46:46+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3953028024258258673", "username": "yuko_the_rebirth", "text": "ヘッドスパやってる人、気づいてる？\n皮膚、髪の毛は排泄器官です。", "permalink": "https://www.threads.com/@yuko_the_rebirth/post/Dbb-gtFE-bx", "likes": 81, "velocity": 0.1, "ageHours": 790.1, "postedAt": "2026-07-31T09:28:04+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア", "頭皮マッサージ"]}, {"id": "3942570144912916034", "username": "tsuya2mi", "text": "炎上覚悟で言うけど。頭皮マッサージはマジでヤバい習慣です‼️‼️美容業界に15年いて、頭皮マッサージの恐ろしさ痛感してる^^髪や頭皮だけじゃなくて、顔にも影響する。正直に全部話す。何がヤバいかというと", "permalink": "https://www.threads.com/@tsuya2mi/post/Da20qh9mD5C", "likes": 78, "velocity": 0.07, "ageHours": 1136.4, "postedAt": "2026-07-16T23:10:07+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3950919166870068368", "username": "kiiiikorin829", "text": "38歳。産後から4年経っても明らかに薄毛になってきて前髪スカスカ😭薄毛治療のクリニック通うしかないのかな😭これやったら改善してきたよ！ってものがあれば教えてほしいです🥲\n左➞4年前 。右➞今", "permalink": "https://www.threads.com/@kiiiikorin829/post/DbUfAylkpyQ", "likes": 76, "velocity": 0.09, "ageHours": 860.0, "postedAt": "2026-07-28T11:38:08+09:00", "genres": ["育毛", "薄毛"], "keywords": ["育毛剤", "頭皮ケア", "薄毛 対策", "つむじ 薄毛"]}, {"id": "3874887391870361028", "username": "aya_haircare_ikuji", "text": "頭皮の匂いが気になってご来店されるお客さん、最近ほんとに増えてる。正直、あーまたこのパターンだ…ってなった。「毎日ちゃんと洗ってるのになんか臭う気がして」とか「おじさん頭の中で飼ってる気がする」(世の中のおじ様すみません)とか言う人が特に増えてる。\nでも原因を聞くと、ほぼ2パターンに絞られるんだけど、", "permalink": "https://www.threads.com/@aya_haircare_ikuji/post/DXGXY2JEp3E", "likes": 73, "velocity": 0.02, "ageHours": 3377.7, "postedAt": "2026-04-14T13:56:34+09:00", "genres": ["育毛"], "keywords": ["頭皮ケア"]}, {"id": "3955097657144472074", "username": "hatibeutyhair", "text": "資生堂の研究者に聞いた「ほうれい線がない人」の共通点がガチで意外だった。\nコラーゲンを塗り込んでるでも、コラーゲンを飲んでるでも、美顔器で引き上げてるでもなくて。実は、、", "permalink": "https://www.threads.com/@hatibeutyhair/post/DbjVF06E3IK", "likes": 71, "velocity": 0.1, "ageHours": 721.6, "postedAt": "2026-08-03T06:00:16+09:00", "genres": ["フェイシャル"], "keywords": ["ほうれい線"]}, {"id": "3925135379586550827", "username": "ma.o__8", "text": "美容院でトリートメントしてもらって\nめちゃくちゃツルツルになってルンルンだったのに\n次の日髪の毛洗ったらパサパサの広がる髪の毛に戻ってしまって激萎え😭😭😭😭\n何が原因？シャンプー？トリートメント？それとも元々の髪のポテンシャル？\nまとまってた毛先まであっちこっち向いてて悲しい😭", "permalink": "https://www.threads.com/@ma.o__8/post/DZ44dTbkwwr", "likes": 69, "velocity": 0.04, "ageHours": 1713.8, "postedAt": "2026-06-22T21:50:21+09:00", "genres": ["薄毛"], "keywords": ["髪 ボリューム"]}, {"id": "3911988785215374912", "username": "keana_lab_40s", "text": "「レチノールを続けても濃度を上げても毛穴が変わらない…」それ、当然です。だってレチノールが得意な毛穴は限られているから。毛穴は全部同じに見えて原因はまったく違う。だからレチノールさえ塗れば何とかなるわけではないの。\n\n【左上】おでこ・開き毛穴（皮脂主導型）\n\n・毛穴が丸い\n・大きさがほぼ均一\n・光が当たるとテカる\n\nこのタイプは皮脂の影響が大きい。コラーゲン不足やたるみが主因ではないので、レチノールで大きな変化は出にくい。必要なのは", "permalink": "https://www.threads.com/@keana_lab_40s/post/DZKLRLUEwZA", "likes": 68, "velocity": 0.03, "ageHours": 2149.1, "postedAt": "2026-06-04T18:30:25+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3949395906328261154", "username": "lalalan_kiki", "text": "ホットペッパーのキャンセルポリシーが書き換えられた話…私はフェイシャルエステサロンで1回やられた。\nまず初回。店側都合で親が具合悪いと前日夜にドタキャンされた。改めて別日に行き、料金は少し安くしてくれた。\nその後、3回目に行こうしたら予約していた日間際に口唇ヘルペスが出来てしまい、お店側のキャンセルポリシーをインスタやホットペッパーで確認したところ、当日キャンセルについてだけ記載されていたため、前日朝にヘルペスあるので変更した方が良いか、このまま気にせず行っても良いかと問い合わせた。\nキャンセルポリシーはインスタとホットペッパーを見ていて、当日キャンセル料は承知しているので前日に連絡したと伝えた。\n店側は前日でもキャンセル料がかかることは記載していると、どこかのサロンのキャンセルポリシーのスクショを送ってきて、数時間後にはインスタにキャンセルポリシーを新しく作って載せたりと工作しだす始末。\nこちらも、ホットペッパーとインスタは連絡前に全部証拠のスクショは撮ってあるので、闘っても良いけど面倒なので、お店が嫌じゃないならヘルペスあるまま行きますね、と返信。\nそれ以来、行くのやめた💢", "permalink": "https://www.threads.com/@lalalan_kiki/post/DbPEqbqE_Ii", "likes": 68, "velocity": 0.07, "ageHours": 910.4, "postedAt": "2026-07-26T09:11:41+09:00", "genres": ["フェイシャル"], "keywords": ["フェイシャルエステ"]}, {"id": "3879815307842444404", "username": "lily.bihouse", "text": "小田切ヒロ様が\"毛穴消えるわよ\"って \n言ってたから速攻買って帰った！！！！\nガチで毛穴消えるよ！！！！！！\n毛穴気になる人いたら教えるから聞いてね〜🫶", "permalink": "https://www.threads.com/@lily.bihouse/post/DXX33diElx0", "likes": 68, "velocity": 0.02, "ageHours": 3214.5, "postedAt": "2026-04-21T09:07:28+09:00", "genres": ["フェイシャル"], "keywords": ["毛穴 ケア"]}, {"id": "3974358641113422407", "username": "yoshiko_fujisawa0629", "text": "68歳、顔ダンス講師の自己紹介。\n\nフォロワー数が2000人を超えたので\n自己紹介を改めてさせていただきます。\n\n私は藤澤美子と申します。\n生まれは愛知県の渥美半島、メロンの産地です。\n渥美病院で産湯を使い、育ちは、三重県の四日市と鈴鹿。\n\n現在は三重県在住。\n顔ダンス講師をしております。顔ダンスと言うのは\n表情筋トレーニングの1つの流派です。\n\n60歳で顔ダンスに出会い、62歳で講師になりました。その後実にたくさんの方々のお顔をリフトアップさせ、また笑顔を素敵にしてきました。\n\nもう一つの顔は、アマチュア小説家です。\n同人雑誌に小説を書いております。\n文章を書くことでお金をもらったのは3度だけ。\n地方の小さな文学賞と動物児童文学賞と言う\n小規模の賞でした。いつかもっと大きな賞が\nとれるように￼研鑽を積みたいと思っていますが、日々SNSの発信に時間を取られて書けないと言うジレンマ。発信しなければ、顔ダンスのことを知ってもらえないし。\n\n40代の後半から、重い更年期鬱を発症しました。\nでも、そこから蘇ることができたのは\n神の恵だと信じています。実は私はクリスチャン。", "permalink": "https://www.threads.com/@yoshiko_fujisawa0629/post/DcnwiCFkdpH", "likes": 68, "velocity": 0.81, "ageHours": 83.8, "postedAt": "2026-08-29T19:48:11+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3951792942867381827", "username": "aya_jinmitosahi", "text": "ユンギ💗💗💗\nデコ出しユンギを描きました🐈‍⬛🫶\nこの角度のフェイスライン、髪の生え際、白い肌すべてが美しいです😳💕\n#btsfanart #suga #yoongi #portraitart", "permalink": "https://www.threads.com/@aya_jinmitosahi/post/DbXlr55gX5D", "likes": 67, "velocity": 0.08, "ageHours": 831.0, "postedAt": "2026-07-29T16:34:10+09:00", "genres": ["薄毛"], "keywords": ["生え際 後退"]}, {"id": "3920028561884915167", "username": "000chan__000", "text": "口横のたるみ？ぽにょはどうやって\nとれますか？\n一時的な効果の糸リフトじゃなく\n半永久で効果がある施術したいのだが。。", "permalink": "https://www.threads.com/@000chan__000/post/DZmvTU0iSXf", "likes": 66, "velocity": 0.04, "ageHours": 1882.9, "postedAt": "2026-06-15T20:44:01+09:00", "genres": ["フェイシャル"], "keywords": ["たるみ 改善", "リフトアップ"]}, {"id": "3962051783378942484", "username": "nekomimomomaron", "text": "頭皮ってどうやったら柔らかくなる？\n\nめちゃ固い…", "permalink": "https://www.threads.com/@nekomimomomaron/post/Db8CRrqAToU", "likes": 66, "velocity": 0.13, "ageHours": 491.3, "postedAt": "2026-08-12T20:16:39+09:00", "genres": ["育毛"], "keywords": ["頭皮マッサージ"]}, {"id": "3961973690774167122", "username": "htmdajgajw99", "text": "美容師さんへ質問です🙋‍♀️\n髪の毛が広がりやすいんですけど、縮毛矯正と髪質改善ってどちらがいいんでしょうか？", "permalink": "https: 8691568", "username": "haocha_11", "text": "お目汚し失礼します…\n左側のほうれい線が右より目立つんです。\n(写真だと右手です)\nけどフェイスラインは右側のほうがたるんでる気がして…\n口元も歪んでいるのが気になって🥲\n\nお顔のトレーニングをはじめてみようと思うんですけど、これだと左側を多めにやったほうがいいんでしょうか…？？\n\n美容・小顔にお詳しい方教えていただけませんか🥲", "permalink": "https://www.threads.com/@haocha_11/post/DWEJE6mGPxw", "likes": 48, "velocity": 0.01, "ageHours": 3994.9, "postedAt": "2026-03-19T20:41:39+09:00", "genres": ["フェイシャル"], "keywords": ["小顔"]}, {"id": "3959623646839356049", "username": "mr_22_k_27", "text": "ほんとに抜け毛がやばくて、髪結ぶと頭皮が薄く見えるようになってほんとに悲しくなる…戻る？ほんとに戻る？😭😭😭そもそも毛が細いから、普段から前髪も少なく見えるし、側面も…なのに…毎日換毛機かってくらいシャンプーしても抜け、ドライヤーかけても抜け、ブラシでとくたびに抜ける…毎日悲しくなる…髪長いから、抜けると余計に抜けた量が多く見える(実際多いけど)し、日々毛がフローリングに落ちてる…😮‍💨月末に美容院行くけど、ハゲが目立たんように髪切ってもらえるかなあ…", "permalink": "https://www.threads.com/@mr_22_k_27/post/DbzaLpSGLqR", "likes": 48, "velocity": 0.08, "ageHours": 571.7, "postedAt": "2026-08-09T11:52:23+09:00", "genres": ["育毛"], "keywords": ["発毛"]}, {"id": "3861465401268249217", "username": "francafrique", "text": "糸リフトとかウルセラ、サーマクール色々やったけど、\nたるみに一番効果あって小顔になったのは、", "permalink": "https://www.threads.com/@francafrique/post/DWWrlLTDiKB", "likes": 48, "velocity": 0.01, "ageHours": 3822.1, "postedAt": "2026-03-27T01:29:28+09:00", "genres": ["フェイシャル"], "keywords": ["リフトアップ"]}, {"id": "3946861498362706586", "username": "kamukamu35", "text": "野球みる薄毛ちゃん。", "permalink": "https://www.threads.com/@kamukamu35/post/DbGEZ8Tkzqa", "likes": 47, "velocity": 0.05, "ageHours": 994.3, "postedAt": "2026-07-22T21:16:16+09:00", "genres": ["薄毛"], "keywords": ["薄毛 対策"]}, {"id": "3966225658745447954", "username": "livingwithcancer_fish2027", "text": "ドセタキセル＋フェスゴ6回目（術前ラストケモ）終了後２週間経った頭頂部です！\n前髪辺りの毛は5回目終了時にもっとハゲてたんですけど、なぜか6回目打ち終わった直後ぐらいから伸びて来ました！\n完璧なおハゲにならなかったのは自力の頭皮冷却の効果があったのかも？と思ってます。\n抜けたとこ早く生えてほしい〜！💦", "permalink": "https://www.threads.com/@livingwithcancer_fish2027/post/DcK3TkAj-YS", "likes": 47, "velocity": 0.13, "ageHours": 353.1, "postedAt": "2026-08-18T14:29:24+09:00", "genres": ["薄毛"], "keywords": ["つむじ 薄毛"]}, {"id": "396642787232
